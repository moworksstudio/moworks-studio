</div>
<script>
window.__timelines = window.__timelines || {};
const tl = gsap.timeline({ paused: true });
tl.fromTo("#t1", { x: -200, opacity: 0 }, { x: 0, opacity: 1, duration: 1 }, 0.2);
tl.to({}, { duration: 10 }, 0);
