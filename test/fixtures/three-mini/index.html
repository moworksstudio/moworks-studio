<!doctype html>
<!-- three-mini (audit 51): the smallest three.js film the app must finalize, check and render offline. Bare imports only; the app
     copies three.js r184 and writes the import map (finalize R-THREE). Seek-safe: render(t) from one paused GSAP clock. -->
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=640, height=360" />
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
  html, body { margin: 0; width: 640px; height: 360px; overflow: hidden; background: #0b0b14; }
  #root { position: relative; width: 640px; height: 360px; overflow: hidden; background: #0b0b14; }
  #c { position: absolute; inset: 0; width: 640px; height: 360px; display: block; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="1" data-width="640" data-height="360">
  <canvas id="c" class="clip" data-start="0" data-duration="1" data-track-index="1"></canvas>
</div>
<script>
  (function () {
    var clock = { t: 0 }, host = { clock: clock, render: null };
    window.__mini = host;
    window.__hf = window.__hf || {};
    window.__hf.buildReady = window.__hf.buildReady || {};
    window.__hf.buildReady.mini = new Promise(function (resolve) { host.ready = resolve; });
    var tl = gsap.timeline({ paused: true });
    tl.to(clock, { t: 1, duration: 1, ease: "none", onUpdate: function () { if (host.render) host.render(clock.t); } });
    window.__timelines = window.__timelines || {};
    window.__timelines.main = tl;
  })();
</script>
<script type="module">
  import * as THREE from "three";
  import { RoundedBoxGeometry } from "three/addons/geometries/RoundedBoxGeometry.js";
  import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
  import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
  import { OutputPass } from "three/addons/postprocessing/OutputPass.js";

  const host = window.__mini;
  const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById("c"), preserveDrawingBuffer: true });
  renderer.setPixelRatio(1);
  renderer.setSize(640, 360, false);
  renderer.toneMapping = THREE.NeutralToneMapping;
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0b0b14);
  scene.add(new THREE.HemisphereLight(0xffffff, 0x334466, 2.5));
  const box = new THREE.Mesh(new RoundedBoxGeometry(1.6, 1.6, 1.6, 4, 0.2), new THREE.MeshStandardMaterial({ color: 0xff8a4c, roughness: 0.4 }));
  scene.add(box);
  const camera = new THREE.PerspectiveCamera(35, 640 / 360, 0.1, 50);
  camera.position.set(0, 0, 6);
  const composer = new EffectComposer(renderer);
  composer.addPass(new RenderPass(scene, camera));
  composer.addPass(new OutputPass());
  host.render = (t) => { box.rotation.set(t * 1.2, t * 2.0, 0); composer.render(); };
  host.render(host.clock.t);
  host.ready();
</script>
</body>
</html>
