<!doctype html>
<!-- anidoodle-cheetah-sumi (audit 73, QC2): the author's cheetah, posed by its own rig (cheetahRig.ts), drawn in the Sumi-e medium's brush (sumiEKit.ts): a rigged character in a medium that is not its own. The film is the
     author's way (anidoodle/page.ts: a Film mounted by the engine's host on <canvas id="film">); the app bundles it into
     compositions/anidoodle/film.js and its bridge seeks window.FILM by HyperFrames' time. -->
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1080" />
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
  html, body { margin: 0; width: 1080px; height: 1080px; overflow: hidden; background: #f3eee2; }
  #root { position: relative; width: 1080px; height: 1080px; overflow: hidden; background: #f3eee2; }
  #film { position: absolute; inset: 0; width: 1080px; height: 1080px; display: block; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="2" data-width="1080" data-height="1080">
  <canvas id="film" class="clip" data-start="0" data-duration="2" data-track-index="1"></canvas>
</div>
<script src="compositions/anidoodle/film.js"></script>
</body>
</html>
