<!doctype html>
<!-- mg-mini (audit 55): the smallest mg-styles-15 page the app must finalize, check and render offline, written the way the author
     writes one (harness/render.mjs): an async window.renderAt(t) and window.__ready, the author's fonts.css, a pinned library from its
     own node_modules, a shared texture from its assets. No timeline of its own: the app's bridge (R-LEMO) drives renderAt(t). -->
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=640, height=360" />
<link rel="stylesheet" href="/assets/fonts/fonts.css">

<script src="/node_modules/d3/dist/d3.min.js"></script>
<style>
  html, body { margin: 0; width: 640px; height: 360px; overflow: hidden; background: #F1E9DA; }

  #c { position: absolute; inset: 0; width: 640px; height: 360px; display: block; }
  #probe { position: absolute; left: 0; top: 0; opacity: 0; font-family: "Inter", sans-serif; font-weight: 800; }

  <div id="probe">Aa</div>
</div>
<script>window.DEMO = { width: 640, height: 360, fps: 10, duration: 1 };</script>
<script type="module" src="compositions/mg/film.js"></script>
</body>
</html>
