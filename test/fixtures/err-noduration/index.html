<!doctype html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1920, height=1080" />
<script src="assets/vendor/gsap.min.js"></script>
<style>
@font-face { font-family: "RFlex"; src: url("assets/fonts/RobotoFlex-var.woff2") format("woff2"); font-weight: 100 1000; }
body { margin: 0; }
#root { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #ffffff; font-family: "RFlex"; }
.clip { position: absolute; inset: 0; display: grid; place-items: center; }
h1 { font-size: 120px; margin: 0; color: #111; }
p { font-size: 14px; color: #111; position: absolute; left: 80px; top: 900px; }
#s2 { background: #1d3fd8; } #s2 h1 { color: #fff; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-width="1920" data-height="1080">
  <section id="s1" class="clip" data-start="0" data-duration="2" data-track-index="1">
    <h1 id="t1">Xin chào Moworks</h1>
    <p id="small">Chữ nhỏ 14px: Tiếng Việt có dấu – ả ạ ặ ẫ ể ọ ở ữ ỹ đ</p>
  </section>
  <section id="s2" class="clip" data-start="2" data-duration="2" data-track-index="1">
    <h1 id="t2">Phim thử nghiệm</h1>
  </section>
</div>
<script>
window.__timelines = window.__timelines || {};
const tl = gsap.timeline({ paused: true });
tl.fromTo("#t1", { y: 60, opacity: 0 }, { y: 0, opacity: 1, duration: 0.8, ease: "power3.out" }, 0.2);
tl.fromTo("#t2", { scale: 0.8, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.8, ease: "back.out(1.7)" }, 2.2);


</script>
</body>
</html>
