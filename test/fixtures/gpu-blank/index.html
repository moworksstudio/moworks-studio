<!doctype html>
<!-- gpu-blank (#184): a film that comes out black on a hardware GPU and shows its text on the CPU (SwiftShader), to test the fallback
     after the GPU test frame. Not a real film: it reads the WebGL renderer and hides its content when it is not SwiftShader. -->
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=640, height=360" />
<style>
  html, body { margin: 0; width: 640px; height: 360px; overflow: hidden; background: #000; }
  #root { position: relative; width: 640px; height: 360px; overflow: hidden; background: #000; }
  #content { position: absolute; inset: 0; background: #ff8a4c; }
  #content i { position: absolute; left: 80px; top: 120px; width: 480px; height: 120px; background: #1d3fd8; }
  .on-gpu #content, .on-gpu #content i { background: #000; }          /* HF's runtime owns the clips' visibility: colour them black instead */
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="2" data-width="640" data-height="360">
  <div id="content" class="clip" data-start="0" data-duration="2" data-track-index="1"><i></i></div>
</div>
<script>
  (function () {
    var gl = document.createElement("canvas").getContext("webgl");
    var ext = gl && gl.getExtension("WEBGL_debug_renderer_info");
    var renderer = ext ? String(gl.getParameter(ext.UNMASKED_RENDERER_WEBGL)) : "";
    if (!/swiftshader/i.test(renderer)) document.documentElement.classList.add("on-gpu");
  })();
</script>
</body>
</html>
