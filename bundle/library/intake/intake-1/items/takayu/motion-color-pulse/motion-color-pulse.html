  Nhãn trạng thái chuyển từ xanh dương sang xanh lá rồi về, nền, viền và chữ đổi cùng nhịp, không di chuyển.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.motionColorPulse(q(".cp"), tl, 0.5, {});

  Options (defaults in brackets):
      - duration: s (0.76): blue → green → blue as one bump
      - from: background (#294c68)
      - to: background at the peak (#337b60)
      - borderFrom: #6499bd
      - borderTo: #a6efd0
      - textFrom: #c4deed
      - textTo: #e4fff3

  Notes: Idea and numbers (TakayuStudio color-pulse, written here): Status pill: background #294c68 → #337b60 → #294c68 with border #6499bd → #a6efd0 and text #c4deed → #e4fff3 in step; no transform. Site: one blue → green → blue pulse over 2200 ms (canvas: a sine bump peaking mid-way; DOM keys at 12 / 45 / 80 %); motion_ms 760. Params: from (#294c68) · to (#337b60) · duration (0.76 s) · yoyo.

<script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.drive = MW.drive || function (tl, at, dur, fn) {
    var s = { t: 0 }; fn(0);
    tl.fromTo(s, { t: 0 }, { t: dur, duration: dur, ease: "none", immediateRender: false, onUpdate: function () { fn(s.t); } }, at);
    return at + dur;
  };
  var defaults = {"duration":0.76,"from":"#294c68","to":"#337b60","borderFrom":"#6499bd","borderTo":"#a6efd0","textFrom":"#c4deed","textTo":"#e4fff3"};
  var run = function (el, tl, at, o) {
        var bg = gsap.utils.interpolate(o.from, o.to), bd = gsap.utils.interpolate(o.borderFrom, o.borderTo), tx = gsap.utils.interpolate(o.textFrom, o.textTo);
        return MW.drive(tl, at, o.duration, function (t) {
          var k = Math.sin(Math.PI * Math.min(1, t / o.duration));
          el.style.backgroundColor = bg(k); el.style.borderColor = bd(k); el.style.color = tx(k);
        });
      };
  MW.motionColorPulse = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
</script>
