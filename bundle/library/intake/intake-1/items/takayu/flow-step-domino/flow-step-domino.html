  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.flowStepDomino(q(".gm"), tl, 0, {});

  Options (defaults in brackets):
      - steps: the step labels (4)
      - exitAt: s the boxes fold down in reverse (3.4)

  Notes: Idea and numbers (TakayuStudio catalog-data-story-event-domino, written here): 4 step boxes 50 x 56 px, 70 px apart, on a floor line. Box i starts at 350 + 620 i ms: rises scaleY 0.08 -> 1 (bottom origin) over 320 ms back.out, accent fill while running; at +400 ms it resolves to the plain card and a green check badge pops (220 ms back.out) at its top-right; at +420 to +580 ms an arrow draws to the next box (easeOutCubic). Exit: boxes fold down in reverse, 50 ms apart. Params: steps (4) · interval (0.62 s) · rise (0.32 s).
