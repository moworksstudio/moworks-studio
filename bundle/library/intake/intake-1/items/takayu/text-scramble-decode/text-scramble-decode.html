  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.textScrambleDecode(q(".tk-head"), tl, 0, {});

  Options (defaults in brackets):
      - delay: s before letters start to lock (0.5)
      - span: s the locking spreads over (1.1)
      - fps: noise rate (25)
      - start: s (0.25)
      - backAt: s it scrambles again from the right (2.95)
      - fadeAt: s (3.2)
      - accent: noise colour
      - loop: s (3.4)
      - seed: noise

  Notes: Idea and numbers (TakayuStudio tx-scramble-decode, written here): Text starts as random glyphs of each char's class (upper / lower / digits; kana for CJK), changing at 25 fps (seeded per char and frame; demo accent 90 %). After a 0.5 s reveal delay real chars lock left → right, evenly over ~1 s (demo min(1.1 s, 90 ms × n), from 0.75 s), linear. GSAP ScrambleText: 1 s, chars 'upperCase', revealDelay 0.5, speed 0.3. Demo loop: from 2.95 s chars fall back to noise from the right over 0.25 s, fade 3.2–3.4 s; loop 3.4 s. Params: duration (1 s) · revealDelay (0.5 s) · chars: bộ ký tự (chữ hoa) · fps nhiễu (25) · seed.
