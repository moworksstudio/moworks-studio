<!--
  Brush Wipe (TakayuStudio (motion-reference), No licence stated: idea and numbers only, written from the idea (site read 12/10/2026)).
  Source: motion-reference.takayustudio.jp/#motion=tr-brush (read 12/10/2026).
  Năm vệt cọ dày lần lượt quét ngang từ trái sang, chồng lên nhau tô lộ cảnh mới.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.transitionBrushWipe(q(".tk-b"), tl, 1.2, {});

  Options (defaults in brackets):
      - strokes: bands (5)
      - stagger: s between bands (0.06)
      - each: s each band's edge crosses the frame (0.36)
      - slant: px the top edge rises toward the lead (30)
      - ease: power2.out (cubic); the site's demo eases in-out
      - from: the outgoing scene

  Notes: Idea and numbers (TakayuStudio tr-brush, written here): 5 bands (each ~1/4 of frame height at a 1/5 pitch, so they overlap ~5 %), leading edge vertical, top edge slanting up ~6 px; band i starts at i x 60 ms and its leading edge runs from just left of the frame to past the right edge over 360 ms easeOutCubic (demo ease-in-out); together they mask in the incoming scene; 600 ms total. Straight polygon edges in the demo; ragged dry-brush ends are optional. Params: strokes (5) · stagger (60 ms) · duration mỗi vệt (0.36 s).
-->

<section class="tk-scene tk-a"><div class="tk-mark circle"></div><div class="tk-sc-text"><div class="tk-sc-letter">A</div><div class="tk-sc-cap">Cảnh mở đầu</div></div></section>
<section class="tk-scene tk-b"><div class="tk-mark square"></div><div class="tk-sc-text"><div class="tk-sc-letter">B</div><div class="tk-sc-cap">Cảnh tiếp theo</div></div></section>

<style>

</style>

<script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.drive = MW.drive || function (tl, at, dur, fn) {
    var s = { t: 0 }; fn(0);
    tl.fromTo(s, { t: 0 }, { t: dur, duration: dur, ease: "none", immediateRender: false, onUpdate: function () { fn(s.t); } }, at);
    return at + dur;
  };
  var defaults = {"strokes":5,"stagger":0.06,"each":0.36,"slant":30,"ease":"power2.out","from":null};
  var run = function (el, tl, at, o) {
        var out = o.from ? MW.el(o.from) : el.previousElementSibling, ease = gsap.parseEase(o.ease), W = el.offsetWidth, H = el.offsetHeight, n = o.strokes;
        var pitch = H / n, bh = H / 4, slant = o.slant, total = (n - 1) * o.stagger + o.each;
        return MW.drive(tl, at, total, function (t) {
          var pts = ["0px 0px"], done = true;
          for (var i = 0; i < n; i++) {
            var p = ease(Math.max(0, Math.min(1, (t - i * o.stagger) / o.each))), x = -0.05 * W + 1.12 * W * p, top = i * pitch - (bh - pitch) / 2, bot = top + bh;
            if (p < 1) done = false;
            if (p <= 0) continue;
            // a band from the left edge to its leading edge, the top edge slanting up toward the lead
            pts.push("0px " + top + "px", x + "px " + (top - slant) + "px", x + "px " + bot + "px", "0px " + bot + "px", "0px " + top + "px", "0px 0px");
          }
          el.style.clipPath = done ? "none" : pts.length < 3 ? "inset(50%)" : "polygon(" + pts.join(",") + ")"; el.style.visibility = t > 0 ? "visible" : "hidden";
          if (out) out.style.visibility = done ? "hidden" : "visible";
        });
      };
  MW.transitionBrushWipe = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
</script>
