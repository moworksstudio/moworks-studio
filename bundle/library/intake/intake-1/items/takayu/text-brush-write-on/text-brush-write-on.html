      - box: [w, h] of the stroke coordinates ([400, 160])
      - brush: brush radius in box units (7)
      - gap: s between strokes (0.08)
      - fit: s (3.6)
      - start: s (0.35)

      - exitAt: s (4.5)
      - ink: 
      - accent: ring at the brush tip
      - loop: s (5)
