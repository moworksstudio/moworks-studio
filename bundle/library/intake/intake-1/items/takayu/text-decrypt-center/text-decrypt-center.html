  Các ký tự mật mã (màu khác, chữ mono) đổi mỗi 50 ms, rồi giải mã từ giữa dòng lan ra hai bên.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.textDecryptCenter(q(".tk-head"), tl, 0, {});

  Options (defaults in brackets):
      - interval: s between cipher redraws (0.05)
      - span: s the reveal takes (1.2), 0.05-0.2 s per rank from the centre
      - start: s (0.6)
      - backAt: s the outer letters scramble again (2.95)
      - glyphs: cipher symbols
      - cipher: cipher colour
      - font: font for the line (mono)
      - loop: s (3.4)
      - seed: cipher

  Notes: Idea and numbers (TakayuStudio tx-decrypt-center, written here): Unrevealed chars show a cipher glyph (symbols !<>-_\/[]{}=+*^?#%&$@; kanji set for CJK), mono weight 600, second colour (demo blue, 85 %), redrawn every 50 ms (seeded per char and tick). Chars lock from the line centre outward, symmetric pairs together: one rank per step, step = 1.2 s / ranks clamped 50–200 ms, from 0.6 s (react-bits: interval 50 ms, maxIterations 10, revealDirection center). Demo loop: outer chars scramble again first, 2.95–3.3 s; loop 3.4 s. Params: interval: nhịp đổi ký tự (0.05 s) · step: mỗi bậc từ giữa ra (0.05–0.2 s) · cipherColor: màu ký tự mật mã · glyphs: bộ ký hiệu.

<script>
(function () {

  };
  MW.hash = MW.hash || function (s) { var h = 2166136261; s = String(s); for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; };

  var defaults = {"interval":0.05,"span":1.2,"start":0.6,"backAt":2.95,"glyphs":"!<>-_\\/[]{}=+*^?#%&$@","cipher":"rgba(61,160,255,0.85)","font":"'JetBrains Mono', monospace","loop":3.4,"seed":8};
  var run = function (el,tl,at,o
  ) {

  var gr = function (s) { s = String(s).normalize("NFC"); if (!seg) return Array.from(s); var out = [], it = seg.segment(s)[Symbol.iterator](), r; while (!(r = it.next()).done) out.push(r.value.segment); return out; };
  var cells = function (el, text) { el.textContent = ""; var word = null; return gr(text).map(function (g) { var s = document.createElement("span"); s.textContent = g; s.style.display = "inline-block"; s.style.whiteSpace = "pre";
