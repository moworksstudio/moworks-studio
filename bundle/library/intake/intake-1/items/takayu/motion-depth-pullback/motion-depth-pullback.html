  Depth Pullback (TakayuStudio (motion-reference), No licence stated: idea and numbers only, written from the idea (site read 12/10/2026)).
  Source: motion-reference.takayustudio.jp/#motion=depth-pullback (read 12/10/2026).
  Thẻ từ 220 % nhoè và loá thu về đúng cỡ, rõ nét dần, rồi bốn góc khung hiện ra.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.motionDepthPullback(q(".dp"), tl, 0.3, { exitAt: 2.1 });

  Options (defaults in brackets):
      - from: start scale (2.2)
      - blur: px (28)
      - bright: start brightness (1.35)
      - duration: s (0.76)
      - ease: (power2.inOut)
      - bracket: px corner size (60)
      - gap: px outside the card (30)
      - stroke: px (6)
      - accent: 
      - exitAt: s after the start to fade (null)

  Notes: Idea and numbers (TakayuStudio depth-pullback, written here): Card scales 2.2 → 1 about its centre with blur 8 → 0 px and brightness 1.35 → 1, together in 760 ms power2.inOut; it fades in over the first 300 ms of the loop; four corner brackets fade in over 250 ms once it lands. Site exit: fade 300 ms. Params: duration (0.76 s) · scale đầu (2.2) · blur (8 px) · brightness (1.35).
-->
