  Chữ gõ ra với nhịp không đều như người thật: mỗi phím nhanh chậm khác nhau, dừng lâu hơn sau dấu câu và trước từ dài.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.textHumanTypewriter(q(".tk-head"), tl, 0, {});

  Options (defaults in brackets):
      - base: s per key (0.085)
      - variance: ± share (0.5)
      - pause: s added after punctuation (0.32)
      - longWord: s before a word of 6+ letters (0.12)
      - fit: s the line is scaled to (2.6; 0: natural)
      - start: s (0.3)
      - clearAt: s (3.75)
      - accent: caret
      - seed: the rhythm

  Notes: Idea and numbers (TakayuStudio tx-human-typewriter, written here): Each keystroke interval = 85 ms × (1 ± 0.5 seeded jitter); +320 ms after , . ! ? … and 、。; +120 ms before words of 6+ chars (Latin); caret (accent bar ~2.5 px × 1 em) solid while typing, blinks 0.5 s on / 0.5 s off when idle; optional normalise to a target total duration (demo scales the cadence to fit 2.6 s, from 0.3 s). Demo clears at 3.75 s; loop 4 s. Params: base: nhịp gõ (0.085 s) · variance: độ lệch (±50 %) · pause: dừng sau dấu câu (0.32 s) · longWord: dừng trước từ dài (0.12 s) · seed.
-->
