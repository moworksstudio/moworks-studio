<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Circular Reveal - Demo</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
:root { --bg: #09090b; --fg: #fafafa; --card: #111114; --line: #27272a; }
* { box-sizing: border-box; }
html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); }
#demo { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); color: var(--fg); font-family: Inter, sans-serif; }
.center { position: absolute; inset: 0; display: grid; place-items: center; }
.row { display: flex; align-items: center; justify-content: center; gap: 48px; }
.col { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 32px; }
.h1 { font-size: 132px; font-weight: 800; letter-spacing: -0.035em; line-height: 1.1; text-align: center; }
.h2 { font-size: 84px; font-weight: 700; letter-spacing: -0.025em; line-height: 1.15; text-align: center; }
.p { font-size: 40px; line-height: 1.4; opacity: 0.72; text-align: center; }
.card { position: relative; border-radius: 28px; background: var(--card); border: 2px solid var(--line); overflow: hidden; }
.muted { opacity: 0.6; }

#demo { background: radial-gradient(100% 100% at 50% 45%, #1a1f33, #0b0d12); color: #e8ebf3; font-family: Inter, sans-serif; } .gm { position: absolute; inset: 0; }
.st { position: absolute; inset: 0; display: grid; place-items: center; } .ph { position: relative; width: 520px; height: 956px; border-radius: 70px; overflow: hidden; background: #10131d; border: 4px solid #2a3350; }
.pg { position: absolute; inset: 0; padding: 90px 40px; box-sizing: border-box; } .pg h3 { margin: 0 0 40px; font-size: 52px; } .pg .r { height: 110px; border-radius: 24px; background: #1b2130; margin-bottom: 24px; }
.pg-b { background: linear-gradient(160deg, #a693ff, #6a4cf0); } .pg-b .r { background: rgba(255,255,255,0.18); } .fab { position: absolute; right: 46px; bottom: 60px; width: 114px; height: 114px; border-radius: 50%; background: #8b7bff; z-index: 5; box-shadow: 0 20px 40px rgba(0,0,0,0.4); }
.fab::before, .fab::after { content: ""; position: absolute; left: 50%; top: 50%; width: 46px; height: 9px; margin: -4.5px 0 0 -23px; border-radius: 5px; background: #fff; } .fab::after { transform: rotate(90deg); }
    </style>
  </head>
  <body>
    <div id="demo" data-composition-id="mw-demo" data-start="0" data-width="1920" data-height="1080" data-duration="3">
<div class="st"><div class="ph"><div class="pg"><h3>Ghi chú</h3><div class="r"></div><div class="r"></div><div class="r"></div><div class="r"></div></div><div class="pg pg-b"><h3>Ghi chú mới</h3><div class="r" style="height:300px"></div></div><div class="fab"></div></div></div>
      <script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.drive = MW.drive || function (tl, at, dur, fn) {
    var s = { t: 0 }; fn(0);
    tl.fromTo(s, { t: 0 }, { t: dur, duration: dur, ease: "none", immediateRender: false, onUpdate: function () { fn(s.t); } }, at);
    return at + dur;
  };
  var defaults = {"from":".fab","delay":0.08,"duration":0.7,"ease":"power2.inOut","backAt":null,"back":0.5,"ringR":50,"ringWidth":4};
  var run = function (el, tl, at, o) {
        var host = el.parentNode, fab = o.from ? host.querySelector(o.from) : null, e = gsap.parseEase(o.ease), ring = document.createElement("div");
        if (getComputedStyle(host).position === "static") host.style.position = "relative";
        var er = el.getBoundingClientRect(), hr = host.getBoundingClientRect(), fr = fab ? fab.getBoundingClientRect() : { left: er.right - 90, top: er.bottom - 90, width: 0, height: 0 };
        var cx = fr.left + fr.width / 2 - er.left, cy = fr.top + fr.height / 2 - er.top, R = Math.max(Math.hypot(cx, cy), Math.hypot(er.width - cx, cy), Math.hypot(cx, er.height - cy), Math.hypot(er.width - cx, er.height - cy)), r0 = fr.width / 2, hx = fr.left + fr.width / 2 - hr.left, hy = fr.top + fr.height / 2 - hr.top;
        ring.style.cssText = "position:absolute;border-radius:50%;pointer-events:none;opacity:0;z-index:30;border:" + o.ringWidth + "px solid rgba(255,255,255,0.85);"; host.appendChild(ring);
        return MW.drive(tl, at, o.backAt == null ? o.delay + o.duration : o.backAt + o.back, function (t) {
          var p = e(Math.max(0, Math.min(1, (t - o.delay) / o.duration))); if (o.backAt != null && t > o.backAt) p = 1 - e(Math.min(1, (t - o.backAt) / o.back));
          var r = R * p; el.style.clipPath = "circle(" + r.toFixed(1) + "px at " + cx.toFixed(1) + "px " + cy.toFixed(1) + "px)"; el.style.visibility = r > 0.5 ? "visible" : "hidden";
          if (fab) fab.style.opacity = String(1 - Math.max(0, Math.min(1, (r - r0) / (r0 * 1.7 || 1))));
          var u = t / 0.32, rr = 10 + o.ringR * u; ring.style.width = ring.style.height = 2 * rr + "px"; ring.style.left = hx - rr - o.ringWidth + "px"; ring.style.top = hy - rr - o.ringWidth + "px"; ring.style.opacity = t > 0 && u < 1 ? String(1 - u) : "0";
        });
      };
  MW.transitionFabCircleReveal = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
      </script>
      <script>
        (function () {
          var tl = gsap.timeline({ paused: true });
          var q = function (s) { return document.querySelector(s); }, qa = function (s) { return Array.prototype.slice.call(document.querySelectorAll(s)); };
          MW.transitionFabCircleReveal(q(".pg-b"), tl, 0.32, { backAt: 1.63 });
          tl.set({}, {}, 3);
          // register only when every motion is ready (MW.pending: e.g. a WebGL texture still decoding), as HyperFrames asks of async builds
          var go = function () { window.__timelines = window.__timelines || {}; window.__timelines["mw-demo"] = tl; };
          if (window.MW && MW.pending && MW.pending.length) Promise.all(MW.pending).then(go, go); else go();
        })();
      </script>
    </div>
  </body>
</html>
