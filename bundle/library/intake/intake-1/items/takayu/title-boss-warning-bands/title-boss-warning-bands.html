<!--
  Boss Warning (TakayuStudio (motion-reference), No licence stated: idea and numbers only, written from the idea (site read 12/10/2026)).
  Source: motion-reference.takayustudio.jp/#motion=catalog-game-cinematic-boss-warning (read 12/10/2026).
  Khung ngả màu nhẹ, dải sọc nguy hiểm phía trên trượt vào từ trái, dải dưới từ phải, sọc chạy đều ngược chiều nhau; chữ cảnh báo lộ ra từ giữa và đứng yên không nhấp nháy, rồi hai dải trượt ra.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.titleBossWarningBands(q(".bw"), tl, 0, {});

  Options (defaults in brackets):
      - inAt: s (0.3)
      - drift: px/s the stripes run (110)
      - outAt: s (2.3)

  Notes: Idea and numbers (TakayuStudio catalog-game-cinematic-boss-warning, written here): px @320x200. Frame tints accent 10 %. Top hazard band (y 26, 20 px, dark diagonal stripes every 18 px) slides in from the left, bottom band (y 156) from the right, 400 ms outExpo at 0.3 s; stripes drift 22 px/s opposite ways. A dim silhouette fades in 0.4-1.0 s, growing 0.92 → 1 to 2.3 s. Title revealed by a clip widening from the centre 0 → 260 px (300 ms outCubic, 0.75 s), steady. Bands exit 250 ms in-expo at 2.3 s, continuing across. Params: inAt: lúc vào (0.3 s) · band: dải sọc (cao 20 px, sọc 18 px) · drift: tốc độ sọc (22 px/s) · title: chữ cảnh báo · outAt: lúc ra (2.3 s).
-->

<div class="gm bw"><div class="bw-tint"></div><div class="bw-sil"></div><div class="bw-band" style="top:130px"></div><div class="bw-band" style="top:780px"></div><div class="bw-title"><b>CẢNH BÁO</b><span>TRÙM ĐANG TỚI</span></div></div>

<style>

</style>

<script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.drive = MW.drive || function (tl, at, dur, fn) {
    var s = { t: 0 }; fn(0);
    tl.fromTo(s, { t: 0 }, { t: dur, duration: dur, ease: "none", immediateRender: false, onUpdate: function () { fn(s.t); } }, at);
    return at + dur;
  };
  var defaults = {"inAt":0.3,"drift":110,"outAt":2.3};
  var run = function (el, tl, at, o) {
        var bands = el.querySelectorAll(".bw-band"), sil = el.querySelector(".bw-sil"), title = el.querySelector(".bw-title"), tint = el.querySelector(".bw-tint"), ex = gsap.parseEase("expo.out"), ei = gsap.parseEase("expo.in"), out = gsap.parseEase("power2.out");
        return MW.drive(tl, at, o.outAt + 0.6, function (t) {
          var W = el.offsetWidth, p = ex(Math.max(0, Math.min(1, (t - o.inAt) / 0.4))), e = ei(Math.max(0, Math.min(1, (t - o.outAt) / 0.25)));
          gsap.set(bands[0], { x: -W * (1 - p) + W * e }); gsap.set(bands[1], { x: W * (1 - p) - W * e });
          bands[0].style.backgroundPosition = (t * o.drift) + "px 0"; bands[1].style.backgroundPosition = (-t * o.drift) + "px 0";
          if (tint) tint.style.opacity = String(Math.min(1, t / 0.3) * (1 - e));
          if (sil) { sil.style.opacity = String(0.5 * Math.max(0, Math.min(1, (t - 0.4) / 0.6)) * (1 - e)); gsap.set(sil, { scale: 0.92 + 0.08 * Math.min(1, t / 2.3) }); }
          var r = out(Math.max(0, Math.min(1, (t - 0.75) / 0.3))), w = title.offsetWidth; title.style.clipPath = "inset(-0.3em " + (w / 2) * (1 - r) + "px -0.3em " + (w / 2) * (1 - r) + "px)"; title.style.opacity = String(1 - e);
        });
      };
  MW.titleBossWarningBands = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
</script>
