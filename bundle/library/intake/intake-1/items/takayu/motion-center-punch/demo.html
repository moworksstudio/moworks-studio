<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Center Punch - Demo</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
:root { --bg: #09090b; --fg: #fafafa; --card: #111114; --line: #27272a; }
* { box-sizing: border-box; }
html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); }
#demo { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); color: var(--fg); font-family: Inter, sans-serif; }
.center { position: absolute; inset: 0; display: grid; place-items: center; }
.row { display: flex; align-items: center; justify-content: center; gap: 48px; }
.col { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 32px; }
.h1 { font-size: 132px; font-weight: 800; letter-spacing: -0.035em; line-height: 1.1; text-align: center; }
.h2 { font-size: 84px; font-weight: 700; letter-spacing: -0.025em; line-height: 1.15; text-align: center; }
.p { font-size: 40px; line-height: 1.4; opacity: 0.72; text-align: center; }
.card { position: relative; border-radius: 28px; background: var(--card); border: 2px solid var(--line); overflow: hidden; }
.muted { opacity: 0.6; }

#demo { background: radial-gradient(100% 100% at 50% 45%, #1a1f33, #0b0d12); color: #e8ebf3; font-family: Inter, sans-serif; }
.st { position: absolute; inset: 0; display: grid; place-items: center; } .cp { width: 340px; height: 340px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #c4b8ff, #8b7bff 60%, #5b46d8); display: grid; place-items: center; color: #fff; opacity: 0; } .cp svg { width: 180px; height: 180px; }
    </style>
  </head>
  <body>
    <div id="demo" data-composition-id="mw-demo" data-start="0" data-width="1920" data-height="1080" data-duration="2.4">
<div class="st"><div class="cp"><svg viewBox="-12 -12 24 24"><path d="M0 -11 L3.2 -3.8 L11 -3.4 L5 1.8 L6.8 9.6 L0 5.4 L-6.8 9.6 L-5 1.8 L-11 -3.4 L-3.2 -3.8 Z" fill="currentColor"/></svg></div></div>
      <script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.drive = MW.drive || function (tl, at, dur, fn) {
    var s = { t: 0 }; fn(0);
    tl.fromTo(s, { t: 0 }, { t: dur, duration: dur, ease: "none", immediateRender: false, onUpdate: function () { fn(s.t); } }, at);
    return at + dur;
  };
  var defaults = {"from":0.18,"peak":1.32,"peakAt":0.62,"duration":0.48,"rays":10,"rayR":[230,310],"rayLen":[65,15],"rayWidth":12,"rayStart":0.22,"rayEnd":0.6,"accent":"#ffd23d","exitAt":null};
  var run = function (el, tl, at, o) {
        var host = el.parentNode, p2 = gsap.parseEase("power2.out"), io = gsap.parseEase("power2.inOut"), pin = gsap.parseEase("power2.in"), rays = [], tp = o.duration * o.peakAt;
        if (getComputedStyle(host).position === "static") host.style.position = "relative";
        var cx = el.offsetLeft + el.offsetWidth / 2, cy = el.offsetTop + el.offsetHeight / 2;
        for (var i = 0; i < o.rays; i++) { var r = document.createElement("div"); r.style.cssText = "position:absolute;pointer-events:none;opacity:0;transform-origin:0 50%;left:" + cx + "px;top:" + (cy - o.rayWidth / 2) + "px;height:" + o.rayWidth + "px;border-radius:" + o.rayWidth + "px;background:" + o.accent + ";"; host.insertBefore(r, el); rays.push(r); }
        return MW.drive(tl, at, o.exitAt == null ? Math.max(o.duration, o.rayEnd) : o.exitAt + 0.25, function (t) {
          var s = t < tp ? o.from + (o.peak - o.from) * p2(t / tp) : o.peak + (1 - o.peak) * io(Math.min(1, (t - tp) / (o.duration - tp))), a = Math.min(1, t / 0.08);
          if (o.exitAt != null && t > o.exitAt) { var x = pin(Math.min(1, (t - o.exitAt) / 0.25)); s *= 1 - 0.6 * x; a *= 1 - x; }
          gsap.set(el, { scale: s }); el.style.opacity = String(a);
          var u = (t - o.rayStart) / (o.rayEnd - o.rayStart), q = p2(Math.max(0, Math.min(1, u)));
          rays.forEach(function (r, i) { r.style.width = o.rayLen[0] + (o.rayLen[1] - o.rayLen[0]) * q + "px"; r.style.transform = "rotate(" + (i / o.rays * 360 - 90) + "deg) translateX(" + (o.rayR[0] + (o.rayR[1] - o.rayR[0]) * q) + "px)"; r.style.opacity = u > 0 && u < 1 ? String(1 - q) : "0"; });
        });
      };
  MW.motionCenterPunch = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
      </script>
      <script>
        (function () {
          var tl = gsap.timeline({ paused: true });
          var q = function (s) { return document.querySelector(s); }, qa = function (s) { return Array.prototype.slice.call(document.querySelectorAll(s)); };
          MW.motionCenterPunch(q(".cp"), tl, 0.3, { exitAt: 1.8 });
          tl.set({}, {}, 2.4);
          // register only when every motion is ready (MW.pending: e.g. a WebGL texture still decoding), as HyperFrames asks of async builds
          var go = function () { window.__timelines = window.__timelines || {}; window.__timelines["mw-demo"] = tl; };
          if (window.MW && MW.pending && MW.pending.length) Promise.all(MW.pending).then(go, go); else go();
        })();
      </script>
    </div>
  </body>
</html>
