  Focus Portal (TakayuStudio (motion-reference), No licence stated: idea and numbers only, written from the idea (site read 12/10/2026)).
  Source: motion-reference.takayustudio.jp/#motion=catalog-ui-spatial-focus-portal (read 12/10/2026).
  Một vòng tròn nhỏ có viền màu nhấn mở rộng thành cổng tròn 72 px giữa lưới thẻ, bên trong thẻ nội dung mới phóng lên và hiện dần trễ hơn một nhịp.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.transitionFocusPortal(q(".portal"), tl, 0, { content: ".pc" });

  Options (defaults in brackets):
      - x: focus point, 0-1 of the width (0.5)
      - y: 0-1 of the height (0.5)
      - from: px radius at the start (54)
      - to: px when open (390; 72 of 320)
      - rim: px (6)
      - openAt: s (0.45)
      - closeAt: s (3.0)
      - content: the card inside the portal

  Notes: Idea and numbers (TakayuStudio catalog-ui-spatial-focus-portal, written here): Circle clip at the focus point opens radius 10 → 72 px in 0.7 s power4.out (quint) at 0.45 s; a 2 px accent rim follows its edge. Inside: plain background and a card 108x80 scaling 0.6 → 1 and fading in over 0.7 s quint, starting 120 ms after the opening. Close: content 3.0-3.4 s, then the circle 3.1-3.55 s, both power2.in. The grid of cards outside stays still. Params: radius (10 → 72 px) · open (0.7 s, power4.out) · content (+0.12 s, scale 0.6 → 1) · close (power2.in).
-->

<div class="gm"><div class="grid"><div></div><div></div><div></div><div></div><div></div><div></div><div></div><div></div></div><div class="portal"><div class="pc">Nội dung mới</div></div></div>

<script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.drive = MW.drive || function (tl, at, dur, fn) {
    var s = { t: 0 }; fn(0);
    tl.fromTo(s, { t: 0 }, { t: dur, duration: dur, ease: "none", immediateRender: false, onUpdate: function () { fn(s.t); } }, at);
    return at + dur;
  };
  var defaults = {"x":0.5,"y":0.5,"from":54,"to":390,"rim":6,"openAt":0.45,"closeAt":3,"content":null};
  var run = function (el, tl, at, o) {
        var host = el.parentNode, rim = document.createElement("div"), card = o.content ? el.querySelector(o.content) : el.firstElementChild, q5 = gsap.parseEase("power4.out"), inn = gsap.parseEase("power2.in");
        rim.style.cssText = "position:absolute;pointer-events:none;border-radius:50%;box-sizing:border-box;border:" + o.rim + "px solid #8b7bff;z-index:9;"; host.appendChild(rim);
        return MW.drive(tl, at, o.closeAt + 0.6, function (t) {
          var W = el.offsetWidth, Hh = el.offsetHeight, cx = o.x * W, cy = o.y * Hh;
          var u = Math.max(0, Math.min(1, (t - o.openAt) / 0.7)), c = t > o.closeAt + 0.1 ? 1 - inn(Math.min(1, (t - o.closeAt - 0.1) / 0.45)) : 1, r = (o.from + (o.to - o.from) * q5(u)) * c;
          el.style.clipPath = "circle(" + r + "px at " + cx + "px " + cy + "px)"; el.style.visibility = t >= o.openAt && r > 0.5 ? "visible" : "hidden";
          rim.style.left = (cx - r) + "px"; rim.style.top = (cy - r) + "px"; rim.style.width = rim.style.height = 2 * r + "px"; rim.style.opacity = el.style.visibility === "visible" ? "1" : "0";
          if (card) { var v = Math.max(0, Math.min(1, (t - o.openAt - 0.12) / 0.7)), cc = t > o.closeAt ? 1 - inn(Math.min(1, (t - o.closeAt) / 0.4)) : 1; gsap.set(card, { scale: (0.6 + 0.4 * q5(v)) * (0.6 + 0.4 * cc) }); card.style.opacity = String(q5(v) * cc); }
        });
      };
  MW.transitionFocusPortal = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
</script>
