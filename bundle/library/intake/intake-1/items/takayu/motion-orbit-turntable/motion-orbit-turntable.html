  Các thẻ chạy vòng quanh một tâm, thẻ phía sau nhỏ và tối hơn, thứ tự trước sau đổi đúng theo chiều sâu.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.motionOrbitTurntable(q(".orbit"), tl, 0, {});

  Options (defaults in brackets):
      - radius: px (550; 110 on the site's frame)
      - tilt: the circle's flattening, y radius ÷ x radius (0.2)
      - period: s per turn (4), linear
      - turns: turns (1)

  Notes: Idea and numbers (TakayuStudio cam-orbit, written here): 6 cards (44 x 60, one accent) on a circle: x = centre + 110 cos(a), y = centre + 22 sin(a), depth z = sin(a); scale 0.6 -> 1 and opacity 0.45 -> 1 from back to front; drawing order sorted by z every frame; angle 0 -> 360 deg over 4000 ms linear, seamless loop. Params: count (6) · radius (110 px) · period (4 s).
-->

<div class="orbit"><div class="acc">1</div><div>2</div><div>3</div><div>4</div><div>5</div><div>6</div></div>

<style>

</style>

<script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.drive = MW.drive || function (tl, at, dur, fn) {
    var s = { t: 0 }; fn(0);
    tl.fromTo(s, { t: 0 }, { t: dur, duration: dur, ease: "none", immediateRender: false, onUpdate: function () { fn(s.t); } }, at);
    return at + dur;
  };
  var defaults = {"radius":550,"tilt":0.2,"period":4,"turns":1};
  var run = function (el, tl, at, o) {
        var cards = Array.prototype.slice.call(el.children), n = cards.length, W = el.offsetWidth, H = el.offsetHeight;
        return MW.drive(tl, at, o.period * o.turns, function (t) {
          var base = (t / o.period) * 2 * Math.PI;
          cards.forEach(function (c, i) {
            var a = base + (i / n) * 2 * Math.PI, z = Math.sin(a), f = (z + 1) / 2;
            // x on the circle, y on its flattened ellipse; nearer cards larger, brighter and drawn later
            gsap.set(c, { x: W / 2 + o.radius * Math.cos(a) - c.offsetWidth / 2, y: H / 2 + o.radius * o.tilt * z - c.offsetHeight / 2, scale: 0.6 + 0.4 * f, zIndex: Math.round(f * 100) });
            c.style.opacity = String(0.45 + 0.55 * f);
          });
        });
      };
  MW.motionOrbitTurntable = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
</script>
