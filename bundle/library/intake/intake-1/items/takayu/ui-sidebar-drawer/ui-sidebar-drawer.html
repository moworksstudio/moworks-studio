  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline

    MW.uiSidebarDrawer(q(".gm"), tl, 0, {});

  Options (defaults in brackets):
      - loop: s (3.2)

  Notes: Idea and numbers (TakayuStudio sidebar-reveal, written here): App window 240x146 (two content cards). Panel 104 px wide slides x −104 → 0 over 0.45-1.1 s (650 ms) power2.out; backdrop dims to 62 % over 0.53-1.18 s (starts 80 ms later) power2.out. Panel: accent pill header 88x18, 4 icon rows 20 px apart. Close: panel back 2.05-2.45 s, backdrop out 2.05-2.4 s, both power2.in. Cursor taps the menu icon at 0.3 s and the backdrop at 1.9 s. Params: width (104 px) · duration (0.65 s) · backdrop (62 %, trễ 0.08 s) · ease (power2.out / power2.in khi đóng).

<script>
