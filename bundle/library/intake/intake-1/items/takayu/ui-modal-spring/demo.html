<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Modal Enter / Exit - Demo</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
:root { --bg: #09090b; --fg: #fafafa; --card: #111114; --line: #27272a; }
* { box-sizing: border-box; }
html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); }
#demo { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); color: var(--fg); font-family: Inter, sans-serif; }
.center { position: absolute; inset: 0; display: grid; place-items: center; }
.row { display: flex; align-items: center; justify-content: center; gap: 48px; }
.col { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 32px; }
.h1 { font-size: 132px; font-weight: 800; letter-spacing: -0.035em; line-height: 1.1; text-align: center; }
.h2 { font-size: 84px; font-weight: 700; letter-spacing: -0.025em; line-height: 1.15; text-align: center; }
.p { font-size: 40px; line-height: 1.4; opacity: 0.72; text-align: center; }
.card { position: relative; border-radius: 28px; background: var(--card); border: 2px solid var(--line); overflow: hidden; }
.muted { opacity: 0.6; }

#demo { background: radial-gradient(100% 100% at 50% 40%, #1a1f33, #0b0d12); color: #e8ebf3; font-family: Inter, sans-serif; } .gm { position: absolute; inset: 0; }
.ui-cursor { position: absolute; left: 0; top: 0; z-index: 30; filter: drop-shadow(0 6px 10px rgba(0, 0, 0, 0.5)); }
.app { position: absolute; inset: 0; overflow: hidden; } .app.dark { background: #121624; color: #e8ebf3; } .app.light { background: #f3f4f8; color: #151a28; }
.app-bar { height: 150px; display: flex; align-items: center; gap: 40px; padding: 0 90px; font-size: 60px; font-weight: 800; } .app-bar b { width: 70px; height: 70px; border-radius: 20px; background: currentColor; opacity: 0.2; }
.app-body { padding: 30px 90px; } .app-hero { height: 380px; border-radius: 40px; margin-bottom: 50px; } .app-row { height: 54px; border-radius: 27px; background: currentColor; opacity: 0.14; margin-bottom: 34px; }
.ms-bd { position: absolute; inset: 0; background: #05060a; opacity: 0; } .ms { position: absolute; left: 50%; top: 50%; width: 970px; height: 600px; margin: -300px 0 0 -485px; border-radius: 64px; background: #222a42; border: 3px solid #3a4466; padding: 70px; box-sizing: border-box; opacity: 0; box-shadow: 0 40px 100px rgba(0,0,0,0.5); }
.ms b { display: block; font-size: 64px; margin-bottom: 30px; } .ms p { font-size: 38px; color: #9aa3b8; margin: 0 0 60px; } .ms i { display: inline-block; padding: 26px 70px; border-radius: 50px; background: #8b7bff; font-style: normal; font-size: 40px; font-weight: 800; }
    </style>
  </head>
  <body>
    <div id="demo" data-composition-id="mw-demo" data-start="0" data-width="1920" data-height="1080" data-duration="2.8">
<div class="gm"><section class="ms-app app dark"><div class="app-bar"><b></b><span>Bảng điều khiển</span></div>
<div class="app-body"><div class="app-hero" style="background:#8b7bff"></div><div class="app-row"></div><div class="app-row" style="width:70%"></div><div class="app-row" style="width:85%"></div></div></section><div class="ms-bd"></div><div class="ms"><b>Chào mừng trở lại</b><p>Bạn có 3 dự án đang chờ duyệt.</p><i>Xem ngay</i></div></div>
      <script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.spring = MW.spring || function (stiffness, damping, mass, from, to) {
    var k = stiffness || 100, c = damping == null ? 10 : damping, m = mass || 1, w0 = Math.sqrt(k / m), z = c / (2 * Math.sqrt(k * m));
    var x = function (t) {
      if (z < 1) { var wd = w0 * Math.sqrt(1 - z * z); return 1 - Math.exp(-z * w0 * t) * (Math.cos(wd * t) + (z * w0 / wd) * Math.sin(wd * t)); }
      if (z === 1) return 1 - Math.exp(-w0 * t) * (1 + w0 * t);
      var q = Math.sqrt(z * z - 1), r1 = -w0 * (z - q), r2 = -w0 * (z + q), A = r2 / (r2 - r1), B = -r1 / (r2 - r1);
      return 1 - (A * Math.exp(r1 * t) + B * Math.exp(r2 * t));
    };
    var T = 0, dt = 1 / 240; for (var t = 0; t < 30; t += dt) if (Math.abs(1 - x(t)) > 0.001) T = t;
    T = Math.max(dt, T + dt);
    return { duration: T, ease: function (p) { return p >= 1 ? 1 : x(p * T); }, at: x };
  };
  MW.springDB = MW.springDB || function (duration, bounce) {
    var z = 1 - (bounce == null ? 0.25 : bounce), w = Math.log(1000) / (Math.max(0.05, z) * (duration || 0.8));
    return MW.spring(w * w, 2 * z * w, 1);
  };
  MW.drive = MW.drive || function (tl, at, dur, fn) {
    var s = { t: 0 }; fn(0);
    tl.fromTo(s, { t: 0 }, { t: dur, duration: dur, ease: "none", immediateRender: false, onUpdate: function () { fn(s.t); } }, at);
    return at + dur;
  };
  var defaults = {"rise":80,"closeAt":1.9,"closeEase":"expo.in","backdrop":null,"dim":0.65};
  var run = function (el, tl, at, o) {
        var sp = MW.spring(280, 28), ei = gsap.parseEase(o.closeEase), bd = o.backdrop ? MW.el(o.backdrop) : null;
        return MW.drive(tl, at, o.closeAt + 0.22, function (t) {
          var k = t > 0 ? sp.at(t) : 0; if (t > o.closeAt) k *= 1 - ei(Math.min(1, (t - o.closeAt) / 0.22));
          el.style.opacity = String(Math.max(0, Math.min(1, k))); gsap.set(el, { y: o.rise * (1 - k), scale: 0.96 + 0.04 * k }); if (bd) bd.style.opacity = String(o.dim * Math.max(0, Math.min(1, k)));
        });
      };
  MW.uiModalSpring = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
      </script>
      <script>
        (function () {
          var tl = gsap.timeline({ paused: true });
          var q = function (s) { return document.querySelector(s); }, qa = function (s) { return Array.prototype.slice.call(document.querySelectorAll(s)); };
          MW.uiModalSpring(q(".ms"), tl, 0.3, { backdrop: ".ms-bd" });
          tl.set({}, {}, 2.8);
          // register only when every motion is ready (MW.pending: e.g. a WebGL texture still decoding), as HyperFrames asks of async builds
          var go = function () { window.__timelines = window.__timelines || {}; window.__timelines["mw-demo"] = tl; };
          if (window.MW && MW.pending && MW.pending.length) Promise.all(MW.pending).then(go, go); else go();
        })();
      </script>
    </div>
  </body>
</html>
