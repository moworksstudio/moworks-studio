  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.textStrokeOrder(q(".so"), tl, 0, {});

  Options (defaults in brackets):
      - strokes: SVG path data per stroke in a 100 × 100 box, in writing order (木 here, drawn by hand)
      - width: stroke width in box units (5.5)
      - gap: s between strokes (0.1)
      - fit: s the strokes are fitted into (3.6)
      - start: s (0.35)
      - exitAt: s (4.55)
      - accent: the stroke being written
      - ink: finished strokes
      - loop: s (5)

  Notes: Idea and numbers (TakayuStudio tx-kanji-stroke-order, written here): Character in a 136 px box with a dashed centre cross over a grey underlay of all strokes (7 px, round caps). From 0.35 s each stroke draws along its centre-line in max(0.16 s, length × 3 ms/px), 100 ms gaps, fitted to 3.6 s, power1.inOut; the drawing stroke is accent with an arrowhead at its tip, finished strokes ink, a numbered badge at each stroke start. No stroke data: left → right sweep mask per glyph. Exit 4.55–4.85 s. Loop 5 s. Params: tốc độ (3 ms / px) · nghỉ giữa nét (100 ms) · độ dày nét (7 px). Each stroke takes max(0.16 s, its length × 3 ms per px of a 136 px box), power1.inOut; a numbered badge marks where each starts.
