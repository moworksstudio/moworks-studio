  Source: motion-reference.takayustudio.jp/#motion=page-wipe (read 12/10/2026).
  Một tấm màu quét kín khung từ trái sang, đổi trang khi đã che kín, rồi tấm màu rút tiếp sang phải để lộ trang mới.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.transitionCoverWipe(q(".tk-b"), tl, 1.1, {});

  Options (defaults in brackets):
      - duration: s (0.78): covers left to right, the scenes swap while covered, then it leaves to the right
      - color: panel colour
      - ease: house, cubic-bezier(.83,0,.17,1) (ease-in-out quint)
      - from: the outgoing scene

  Notes: Idea and numbers (TakayuStudio page-wipe, written here): One accent panel over both scenes, 780 ms total, ease easeInOutQuint (CSS cubic-bezier(.83,0,.17,1), about power4.inOut). Leading edge sweeps left to right over 0-374 ms (panel scaleX 0 → 1, origin left); the scenes swap at 390 ms while fully covered; the trailing edge follows over 406-780 ms (scaleX 1 → 0, origin right) so the panel exits right. Params: duration (0.78 s) · color · swap (0.39 s) · ease (power4.inOut) · direction.
-->
