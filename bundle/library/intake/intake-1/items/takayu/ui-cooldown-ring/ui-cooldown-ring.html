  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.uiCooldownRing(q(".gm"), tl, 0, {});

  Options (defaults in brackets):
      - cooldown: s (2.0)
      - start: s (0.45)
      - shade: darkness of what is left (0.62)
      - loop: s (3.2)

  Notes: Idea and numbers (TakayuStudio catalog-game-hud-cooldown-ability, written here): px @320x200. Track ring r 41, stroke 4; accent arc grows clockwise from 12 o'clock linearly over 2.0 s (0.45-2.45 s). Icon disc r 30 (bolt glyph) dimmed by a pie of the dark bg colour at 62 % over the remaining part; centre number 2.0 → 0.0 (one decimal). Press scale 0.92 (in 60 ms at 0.3 s, back by 0.5 s). Ready at 2.45 s: icon fills accent, scale 0.8 → 1 spring k380 d14, full ring, flash ring r 41 → 61 (stroke 2) fading 500 ms outCubic. Params: cooldown: thời gian hồi (2.0 s) · start: lúc bắt đầu (0.45 s) · shade: độ tối phần còn lại (0.62) · readyPop: lò xo lúc sẵn sàng (k380 d14). Ready: the icon fills and springs 0.8 → 1 (k380 c14) with a flash ring.
