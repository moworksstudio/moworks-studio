  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.effectNoiseResolve(q(".nr"), tl, 0.2, { exitAt: 2 });

  Options (defaults in brackets):
      - duration: s (1, ease-out sine)
      - amount: grain opacity at the start (0.85)
      - count: grains (420)
      - speck: px (6)
      - margin: px of grain field around the element (140)
      - blur: px (24)
      - ink: 
      - accent: every third grain
      - seed: (4)
      - exitAt: s after the start to fade (null)

  Notes: Idea and numbers (TakayuStudio noise-reveal, written here): Grain specks (1.6 px) in a disc ~64 px around the subject fade in over 250 ms while the subject shows at 20 %. Then over 1000 ms easeOutSine: speck opacity 0.85 -> 0 and count 420 -> 0, re-seeded 24 times / s (2 in 3 in the light ink colour, 1 in 3 accent); subject blur 8 px -> 0 and opacity 0.2 -> 1, all ending together. Exit 250 ms ease-in cubic. DOM keyframes also scale the subject 0.96 -> 1. Params: duration (1 s) · amount: độ đậm hạt (0.85) · blur (8 px) · seed. The grains are re-seeded 24 times a second.
