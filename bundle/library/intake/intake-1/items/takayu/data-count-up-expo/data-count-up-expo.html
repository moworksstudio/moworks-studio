  Count Up (TakayuStudio (motion-reference), No licence stated: idea and numbers only, written from the idea (site read 12/10/2026)).
  Source: motion-reference.takayustudio.jp/#motion=tx-count-up (read 12/10/2026).
  Con số đếm từ 0 lên đích trong 2 giây, lao nhanh rồi chậm dần khi gần tới, chữ số cố định độ rộng.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.dataCountUpExpo(q(".cu-n"), tl, 0, {});

  Options (defaults in brackets):
      - from: (0)
      - to: (12480)
      - duration: s (2), expo.out
      - decimals: (0)
      - locale: grouping (vi-VN: 12.480)
      - tint: accent while counting (35 %)
      - start: s (0.3)
      - resetAt: s (3.15)
      - loop: s (3.6)

  Notes: Idea and numbers (TakayuStudio tx-count-up, written here): Number counts 0 → target over 2 s expo.out (cubic-bezier(.16,1,.3,1)), snapped to integers (or the target decimals), formatted with grouping (Intl.NumberFormat), tabular figures, right-aligned to the final width so digits do not shift; demo tints the digits accent 35 % while counting, plain when done; from 0.3 s, reset 3.15–3.6 s; loop 3.6 s. Magic UI variant: a spring with damping 20 + 40/d, stiffness 100/d. Params: from, to: số đầu / cuối (0 → 12.480) · duration (2 s) · ease (expo.out) · format: dấu phân cách hàng nghìn.
-->

<script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.drive = MW.drive || function (tl, at, dur, fn) {
    var s = { t: 0 }; fn(0);
    tl.fromTo(s, { t: 0 }, { t: dur, duration: dur, ease: "none", immediateRender: false, onUpdate: function () { fn(s.t); } }, at);
    return at + dur;
  };
  var defaults = {"from":0,"to":12480,"duration":2,"decimals":0,"locale":"vi-VN","tint":"#8b7bff","start":0.3,"resetAt":3.15,"loop":3.6};
  var run = function (el, tl, at, o) {
        var ex = gsap.parseEase("expo.out"), fmt = new Intl.NumberFormat(o.locale, { minimumFractionDigits: o.decimals, maximumFractionDigits: o.decimals }), col = getComputedStyle(el).color, mix = gsap.utils.interpolate(col, o.tint);
        el.style.fontVariantNumeric = "tabular-nums"; el.style.display = "inline-block"; el.style.textAlign = "right"; el.textContent = fmt.format(o.to); el.style.minWidth = el.offsetWidth + "px";
        return MW.drive(tl, at, o.loop, function (t) {
          var u = Math.max(0, Math.min(1, (t - o.start) / o.duration)), v = o.from + (o.to - o.from) * ex(u), m = Math.pow(10, o.decimals);
          el.textContent = fmt.format(Math.round(v * m) / m); el.style.color = u > 0 && u < 1 ? mix(0.35) : col; el.style.opacity = String(1 - Math.max(0, Math.min(1, (t - o.resetAt) / 0.45)));
        });
      };
  MW.dataCountUpExpo = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
</script>
