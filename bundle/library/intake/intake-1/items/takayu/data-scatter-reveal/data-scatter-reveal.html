    MW.dataScatterReveal(q(".gm"), tl, 0, {});

      - points: (24)
      - seed: the points

  Notes: Idea and numbers (TakayuStudio dv-scatter, written here): Axes; 24 points (r 4) rise from the x-axis to their y over 500 ms easeOutCubic, 30 ms apart (recipe 600 ms, 20 ms); then the regression line draws from its left end over 500-600 ms easeInOut in accent. Params: points (24) · stagger (30 ms) · line (0.6 s).
