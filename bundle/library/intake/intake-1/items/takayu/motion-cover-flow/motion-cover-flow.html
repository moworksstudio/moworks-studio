  Source: motion-reference.takayustudio.jp/#motion=3d-coverflow (read 12/10/2026).
  Thẻ đang chọn nằm phẳng giữa khung, các thẻ hai bên xoay 60° và lùi sâu, việc chọn chuyển qua lại bằng lò xo.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.motionCoverFlow(q(".cf"), tl, 0, {});

  Options (defaults in brackets):
      - items: 
      - keys: [[s, selected index], ...] joined by springs
      - stiffness: (200)
      - damping: (22)
      - angle: degrees, facing the centre (60)
      - depth: px back at 1 and 2 steps ([400, 600])
      - step: px per card (320)
      - gap: px extra beside the centre (110)
      - perspective: px (1800)
      - duration: s (4.4)

  Notes: Idea and numbers (TakayuStudio 3d-coverflow, written here): Cards (68 x 92) in a row; the selected one flat at centre; others rotateY +-60 deg (facing the centre), z -80 to -120 px, x = 70 px x offset + 20 px gap per side, opacity 1 - min(0.6, 0.3 x |offset|). Selection moves on a spring (stiffness 200, damping 22-24, ~500 ms) through 0 -> 1 -> 2 -> 1 -> 0 at 0.8 / 1.8 / 2.8 / 3.6 s. Params: angle (±60°) · depth (80–120 px) · spring (200 / 22). Opacity 1 − min(0.6, 0.3 |offset|). The site moves the selection 0 → 1 → 2 → 1 → 0; here it starts on the second of five cards so both sides show.
-->

<script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.spring = MW.spring || function (stiffness, damping, mass, from, to) {
    var k = stiffness || 100, c = damping == null ? 10 : damping, m = mass || 1, w0 = Math.sqrt(k / m), z = c / (2 * Math.sqrt(k * m));
    var x = function (t) {
      if (z < 1) { var wd = w0 * Math.sqrt(1 - z * z); return 1 - Math.exp(-z * w0 * t) * (Math.cos(wd * t) + (z * w0 / wd) * Math.sin(wd * t)); }
      if (z === 1) return 1 - Math.exp(-w0 * t) * (1 + w0 * t);
      var q = Math.sqrt(z * z - 1), r1 = -w0 * (z - q), r2 = -w0 * (z + q), A = r2 / (r2 - r1), B = -r1 / (r2 - r1);
      return 1 - (A * Math.exp(r1 * t) + B * Math.exp(r2 * t));
    };
    var T = 0, dt = 1 / 240; for (var t = 0; t < 30; t += dt) if (Math.abs(1 - x(t)) > 0.001) T = t;
    T = Math.max(dt, T + dt);
    return { duration: T, ease: function (p) { return p >= 1 ? 1 : x(p * T); }, at: x };
  };
  MW.springDB = MW.springDB || function (duration, bounce) {
    var z = 1 - (bounce == null ? 0.25 : bounce), w = Math.log(1000) / (Math.max(0.05, z) * (duration || 0.8));
    return MW.spring(w * w, 2 * z * w, 1);
  };
  MW.drive = MW.drive || function (tl, at, dur, fn) {
    var s = { t: 0 }; fn(0);
    tl.fromTo(s, { t: 0 }, { t: dur, duration: dur, ease: "none", immediateRender: false, onUpdate: function () { fn(s.t); } }, at);
    return at + dur;
  };
  MW.springTo = MW.springTo || function (k, c, keys) {
    var sp = MW.spring(k, c);
    return function (t) { var v = keys[0][1]; for (var i = 1; i < keys.length; i++) if (t >= keys[i][0]) v += (keys[i][1] - keys[i - 1][1]) * sp.at(t - keys[i][0]); return v; };
  };
  var defaults = {"items":".cd","keys":[[0,1],[0.8,2],[1.8,3],[2.8,2],[3.6,1]],"stiffness":200,"damping":22,"angle":60,"depth":[400,600],"step":320,"gap":110,"perspective":1800,"duration":4.4};
  var run = function (el, tl, at, o) {
        var it = Array.prototype.slice.call(el.querySelectorAll(o.items)), W = it[0].offsetWidth, Hh = it[0].offsetHeight, sel = MW.springTo(o.stiffness, o.damping, o.keys), cl = function (x) { return Math.max(-1, Math.min(1, x)); };
        el.style.perspective = o.perspective + "px"; el.style.transformStyle = "preserve-3d";
        it.forEach(function (c) { c.style.position = "absolute"; c.style.left = "50%"; c.style.top = "50%"; c.style.margin = -Hh / 2 + "px 0 0 " + -W / 2 + "px"; });
        return MW.drive(tl, at, o.duration, function (t) { var s = sel(t); it.forEach(function (c, i) { var d = i - s, a = Math.abs(d), z = -(o.depth[0] * Math.min(1, a) + (o.depth[1] - o.depth[0]) * Math.max(0, Math.min(1, a - 1)));
          gsap.set(c, { x: d * o.step + cl(d) * o.gap, z: z, rotationY: -cl(d) * o.angle }); c.style.zIndex = String(100 - Math.round(a * 10)); c.style.opacity = String(1 - Math.min(0.6, 0.3 * a)); }); });
      };
  MW.motionCoverFlow = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
</script>
