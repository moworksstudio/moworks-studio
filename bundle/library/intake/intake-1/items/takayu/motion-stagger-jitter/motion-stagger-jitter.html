  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.motionStaggerJitter(q(".sj-a"), tl, 0.3, { jitter: 0, size: 0, exitAt: 2.4 });

  Options (defaults in brackets):
      - items: 
      - k: spring stiffness (220)
      - c: damping (20)
      - stagger: s (0.07)
      - jitter: ± s per item (0.045; the recipe 0.016–0.033)
      - size: ± scale (0.04; the recipe 0.03)
      - rise: px (160)
      - seed: (7)
      - exitAt: s after the start to fade (null)

  Notes: Idea and numbers (TakayuStudio jitter, written here): Two rows of 7 squares rise 40 px on a spring (k 220, c 20), 70 ms apart: the top row evenly; the bottom row adds a seeded per-item delay (±45 ms) and size (±4 %) (site seed 7). Recipe: base stagger 60 ms + ±16–33 ms and ±3 % scale per element. Site exit: fade 300 ms. Params: stagger (60 ms) · time_jitter (±16–33 ms) · size_jitter (±3 %) · seed.

(function () {

    var k = stiffness || 100, c = damping == null ? 10 : damping, m = mass || 1, w0 = Math.sqrt(k / m), z = c / (2 * Math.sqrt(k * m));
