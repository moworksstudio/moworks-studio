<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>VHS Tracking Noise - Demo</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
:root { --bg: #09090b; --fg: #fafafa; --card: #111114; --line: #27272a; }
* { box-sizing: border-box; }
html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); }
#demo { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); color: var(--fg); font-family: Inter, sans-serif; }
.center { position: absolute; inset: 0; display: grid; place-items: center; }
.row { display: flex; align-items: center; justify-content: center; gap: 48px; }
.col { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 32px; }
.h1 { font-size: 132px; font-weight: 800; letter-spacing: -0.035em; line-height: 1.1; text-align: center; }
.h2 { font-size: 84px; font-weight: 700; letter-spacing: -0.025em; line-height: 1.15; text-align: center; }
.p { font-size: 40px; line-height: 1.4; opacity: 0.72; text-align: center; }
.card { position: relative; border-radius: 28px; background: var(--card); border: 2px solid var(--line); overflow: hidden; }
.muted { opacity: 0.6; }

#demo { background: radial-gradient(100% 100% at 50% 45%, #1a1f33, #0b0d12); color: #e8ebf3; font-family: Inter, sans-serif; }
.vh { position: absolute; inset: 0; overflow: hidden; } .vh-p { position: absolute; inset: -20px 0; background: url(assets/shot.svg) center / cover; filter: saturate(0.8) contrast(1.05); }
.vh-t { position: absolute; left: 0; right: 0; top: 380px; text-align: center; font-size: 150px; font-weight: 900; color: #fff; } .vh-c { position: absolute; left: 80px; top: 70px; font-family: 'JetBrains Mono', monospace; font-size: 54px; font-weight: 700; color: #fff; text-shadow: 3px 3px 0 #000; }
.vh-c i { display: inline-block; width: 0; height: 0; border-left: 36px solid #fff; border-top: 22px solid transparent; border-bottom: 22px solid transparent; margin-right: 24px; vertical-align: -6px; }
    </style>
  </head>
  <body>
    <div id="demo" data-composition-id="mw-demo" data-start="0" data-width="1920" data-height="1080" data-duration="3">
<div class="vh"><div class="vh-p"></div><div class="vh-t">Kỷ niệm 1998</div><div class="vh-c"><i></i>PLAY  00:12:34</div></div>
      <script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.rand = MW.rand || function (seed) {
    var a = typeof seed === "string" ? MW.hash(seed) : (seed >>> 0) || 1;
    return function () { a = (a + 0x6d2b79f5) >>> 0; var t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  };
  MW.hash = MW.hash || function (s) { var h = 2166136261; s = String(s); for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; };
  MW.drive = MW.drive || function (tl, at, dur, fn) {
    var s = { t: 0 }; fn(0);
    tl.fromTo(s, { t: 0 }, { t: dur, duration: dur, ease: "none", immediateRender: false, onUpdate: function () { fn(s.t); } }, at);
    return at + dur;
  };
  var defaults = {"picture":".vh-p","title":".vh-t","scan":0.38,"band":0.09,"roll":3,"jumpAt":1.6,"seed":7,"loop":3};
  var run = function (el, tl, at, o) {
        var pic = o.picture ? el.querySelector(o.picture) : null, title = o.title ? el.querySelector(o.title) : null, sc = document.createElement("div"), cv = document.createElement("canvas"), bar = document.createElement("div"), W = el.clientWidth, Hh = el.clientHeight;
        if (getComputedStyle(el).position === "static") el.style.position = "relative";
        sc.style.cssText = "position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg, rgba(0,0,0," + o.scan + ") 0 2px, transparent 2px 4px);z-index:5;"; el.appendChild(sc);
        cv.width = W; cv.height = Hh; cv.style.cssText = "position:absolute;inset:0;pointer-events:none;z-index:6;"; el.appendChild(cv); var c = cv.getContext("2d");
        bar.style.cssText = "position:absolute;left:0;right:0;bottom:0;height:0;background:#000;z-index:7;"; el.appendChild(bar);
        var J = [-28, 16, -8, 4];
        return MW.drive(tl, at, o.loop, function (t) {
          sc.style.backgroundPosition = "0 " + (Math.floor(t * 30) % 2 ? 2 : 0) + "px";
          var jf = Math.floor((t - o.jumpAt) * 24), jy = jf >= 0 && jf < 4 ? J[jf] : 0; if (pic) gsap.set(pic, { y: jy }); bar.style.height = jy ? Math.abs(jy) + 12 + "px" : "0";
          if (title) { var ch = jy ? 16 : 8; title.style.textShadow = (-ch) + "px 0 0 rgba(255,40,80,0.75), " + ch + "px 0 0 rgba(0,224,255,0.75)"; }
          c.clearRect(0, 0, W, Hh); var bh = o.band * Hh, by = ((t % o.roll) / o.roll) * (Hh + bh) - bh, f = Math.floor(t * 24), r = MW.rand(o.seed + f);
          for (var k = 0; k < 4; k++) { var y = by + k * bh / 4, dx = (r() * 2 - 1) * 28; c.fillStyle = "rgba(255,255,255," + (0.06 + 0.06 * r()).toFixed(3) + ")"; c.fillRect(dx, y, W, bh / 4); for (var d = 0; d < 14; d++) { c.fillStyle = "rgba(255,255,255," + (0.4 + 0.5 * r()).toFixed(3) + ")"; c.fillRect(r() * W, y + r() * bh / 4, 20 + r() * 60, 2); } }
        });
      };
  MW.effectVhsTracking = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
      </script>
      <script>
        (function () {
          var tl = gsap.timeline({ paused: true });
          var q = function (s) { return document.querySelector(s); }, qa = function (s) { return Array.prototype.slice.call(document.querySelectorAll(s)); };
          MW.effectVhsTracking(q(".vh"), tl, 0, {});
          tl.set({}, {}, 3);
          // register only when every motion is ready (MW.pending: e.g. a WebGL texture still decoding), as HyperFrames asks of async builds
          var go = function () { window.__timelines = window.__timelines || {}; window.__timelines["mw-demo"] = tl; };
          if (window.MW && MW.pending && MW.pending.length) Promise.all(MW.pending).then(go, go); else go();
        })();
      </script>
    </div>
  </body>
</html>
