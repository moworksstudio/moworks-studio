<!--
  Secondary Action (TakayuStudio (motion-reference), No licence stated: idea and numbers only, written from the idea (site read 12/10/2026)).
  Source: motion-reference.takayustudio.jp/#motion=secondary (read 12/10/2026).
  Thẻ chính trồi lên, biểu tượng “+” trên thẻ xoay trễ 100 ms và vài ngôi sao nhỏ lấp lánh bay lên.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.motionSecondaryAction(q(".sa"), tl, 0.3, {});

  Options (defaults in brackets):
      - rise: px the card rises (520)
      - duration: s (0.6)
      - ease: (expo.out)
      - icon: the icon that turns
      - turn: degrees (90)
      - delay: s behind the card (0.1)
      - iconTime: s (0.6, back.out)
      - sparkles: (6)
      - drift: px up (72)
      - accent: sparkle colour

  Notes: Idea and numbers (TakayuStudio secondary, written here): Hero card rises 130 px in 600 ms expo.out; its '+' icon turns 0 → 90° starting 100 ms later (600 ms back.out); six small stars drift up 18 px and fade, 60 ms apart from 200 ms (500 ms each). Recipe: hero 0–500 ms ease-out, secondary 80–500 ms at 40 % of the amount, ease-in-out (30–50 %, 50–100 ms late). Params: delay (0.1 s) · amount: tỷ lệ so với động tác chính (40 %) · sparkles (6).
-->

<script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.drive = MW.drive || function (tl, at, dur, fn) {
    var s = { t: 0 }; fn(0);
    tl.fromTo(s, { t: 0 }, { t: dur, duration: dur, ease: "none", immediateRender: false, onUpdate: function () { fn(s.t); } }, at);
    return at + dur;
  };
  var defaults = {"rise":520,"duration":0.6,"ease":"expo.out","icon":".sa-i","turn":90,"delay":0.1,"iconTime":0.6,"sparkles":6,"drift":72,"accent":"#ffd23d"};
  var run = function (el, tl, at, o) {
        var ic = el.querySelector(o.icon), out = gsap.parseEase(o.ease), bo = gsap.parseEase("back.out(1.7)"), st = [];
        for (var i = 0; i < o.sparkles; i++) { var s = document.createElement("div"); s.style.cssText = "position:absolute;width:" + (i % 2 ? 34 : 48) + "px;height:" + (i % 2 ? 34 : 48) + "px;left:" + (8 + 80 * i / Math.max(1, o.sparkles - 1)) + "%;top:" + (-14 - (i % 3) * 6) + "%;color:" + o.accent + ";opacity:0;pointer-events:none;";
          s.innerHTML = '<svg viewBox="-10 -10 20 20" width="100%" height="100%"><path d="M0 -10 L2.6 -2.6 L10 0 L2.6 2.6 L0 10 L-2.6 2.6 L-10 0 L-2.6 -2.6 Z" fill="currentColor"/></svg>'; el.appendChild(s); st.push(s); }
        return MW.drive(tl, at, Math.max(o.duration, o.delay + o.iconTime, 0.2 + o.sparkles * 0.06 + 0.5), function (t) {
          gsap.set(el, { y: o.rise * (1 - out(Math.min(1, t / o.duration))) }); el.style.opacity = String(Math.min(1, t / 0.15));
          if (ic) gsap.set(ic, { rotation: o.turn * bo(Math.max(0, Math.min(1, (t - o.delay) / o.iconTime))) });
          st.forEach(function (s, i) { var u = Math.max(0, Math.min(1, (t - 0.2 - i * 0.06) / 0.5)); gsap.set(s, { y: -o.drift * u }); s.style.opacity = u > 0 && u < 1 ? String(Math.sin(Math.PI * u)) : "0"; });
        });
      };
  MW.motionSecondaryAction = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
</script>
