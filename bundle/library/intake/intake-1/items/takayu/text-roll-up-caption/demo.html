<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Roll-Up Caption - Demo</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
:root { --bg: #09090b; --fg: #fafafa; --card: #111114; --line: #27272a; }
* { box-sizing: border-box; }
html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); }
#demo { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); color: var(--fg); font-family: Inter, sans-serif; }
.center { position: absolute; inset: 0; display: grid; place-items: center; }
.row { display: flex; align-items: center; justify-content: center; gap: 48px; }
.col { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 32px; }
.h1 { font-size: 132px; font-weight: 800; letter-spacing: -0.035em; line-height: 1.1; text-align: center; }
.h2 { font-size: 84px; font-weight: 700; letter-spacing: -0.025em; line-height: 1.15; text-align: center; }
.p { font-size: 40px; line-height: 1.4; opacity: 0.72; text-align: center; }
.card { position: relative; border-radius: 28px; background: var(--card); border: 2px solid var(--line); overflow: hidden; }
.muted { opacity: 0.6; }

#demo { background: #0b0d12; color: #fff; font-family: Inter, sans-serif; } .ft { position: absolute; inset: 0; background: url(assets/shot.svg) center / cover; filter: brightness(0.75); }
.cap { position: absolute; left: 0; right: 0; text-align: center; font-weight: 800; paint-order: stroke fill; }
.ru { position: absolute; left: 300px; bottom: 90px; width: 1320px; height: 295.79999999999995px; overflow: hidden; font-size: 68px; font-weight: 800; }
    </style>
  </head>
  <body>
    <div id="demo" data-composition-id="mw-demo" data-start="0" data-width="1920" data-height="1080" data-duration="5">
<div class="ft"></div><div class="rw"><div class="ru"></div></div>
      <script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.drive = MW.drive || function (tl, at, dur, fn) {
    var s = { t: 0 }; fn(0);
    tl.fromTo(s, { t: 0 }, { t: dur, duration: dur, ease: "none", immediateRender: false, onUpdate: function () { fn(s.t); } }, at);
    return at + dur;
  };
  var defaults = {"lines":["Chào mừng quý vị","đến với bản tin sáng nay.","Hôm nay trời Hà Nội","có mưa rào nhẹ","ở nhiều nơi."],"start":0.4,"every":0.85,"clearAt":4.55,"box":"rgba(8,9,14,0.88)","window":".ru","loop":5};
  var run = function (el, tl, at, o) {
        var win = el.querySelector(o.window), lines = [], p2 = gsap.parseEase("power2.out"), rowH = parseFloat(getComputedStyle(win).fontSize) * 1.45;
        o.lines.forEach(function (txt) { var d = document.createElement("div"); d.style.cssText = "position:absolute;left:0;top:0;white-space:nowrap;line-height:" + rowH + "px;"; var g = Array.from(txt.normalize("NFC")); g.forEach(function (ch) { var s = document.createElement("span"); s.textContent = ch; s.style.cssText = "background:" + o.box + ";padding:0.06em 0;"; d.appendChild(s); }); win.appendChild(d); lines.push(d); });
        var start = function (k) { return o.start + o.every * k; };
        return MW.drive(tl, at, o.loop, function (t) {
          var clr = 1 - Math.max(0, Math.min(1, (t - o.clearAt) / 0.2));
          lines.forEach(function (d, k) {
            if (t < start(k) - 0.27 && k > 0) { d.style.visibility = "hidden"; return; }
            var shift = 0; for (var j = k + 1; j < lines.length; j++) shift += p2(Math.max(0, Math.min(1, (t - start(j) + 0.27) / 0.27)));
            var row = 2 - shift; gsap.set(d, { y: row * rowH }); d.style.visibility = "visible"; d.style.opacity = String(Math.max(0, Math.min(1, row + 1)) * clr);
            var n = d.children.length; Array.prototype.forEach.call(d.children, function (s, i) { s.style.visibility = t >= start(k) + 0.5 * i / n ? "visible" : "hidden"; });
          });
        });
      };
  MW.textRollUpCaption = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
      </script>
      <script>
        (function () {
          var tl = gsap.timeline({ paused: true });
          var q = function (s) { return document.querySelector(s); }, qa = function (s) { return Array.prototype.slice.call(document.querySelectorAll(s)); };
          MW.textRollUpCaption(q(".rw"), tl, 0, {});
          tl.set({}, {}, 5);
          // register only when every motion is ready (MW.pending: e.g. a WebGL texture still decoding), as HyperFrames asks of async builds
          var go = function () { window.__timelines = window.__timelines || {}; window.__timelines["mw-demo"] = tl; };
          if (window.MW && MW.pending && MW.pending.length) Promise.all(MW.pending).then(go, go); else go();
        })();
      </script>
    </div>
  </body>
</html>
