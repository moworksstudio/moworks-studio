  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.uiThumbnailToHero(q(".gm"), tl, 0, {});

  Options (defaults in brackets):
      - places: the four thumbnails' captions
      - posts: line under each thumbnail
      - title: the detail heading
      - loop: s (3)

  Notes: Idea and numbers (TakayuStudio catalog-ui-navigation-hero-expand, written here): Window 180x162: grid of thumbnails 72x50 r6 (84 / 66 px pitch). Click the first at 0.34 s; over 0.45-1.15 s power2.inOut it grows to a full-width hero 180x80 at the top, radius 6 → 0; its caption 'ALPINE' grows 8 → 15 px and keeps its inset (6 → 12 px); other thumbnails and labels fade out. Details (heading + 3 lines) fade in rising 8 px over 0.95-1.25 s power2.out. Reverse 2.0-2.55 s (details out 1.92-2.05 s). Params: duration (0.7 s, power2.inOut) · hero (cao 80 px) · details (0.3 s, rise 8 px).
