    MW.effectConfettiRain(q(".gm"), tl, 0, {});

      - pieces: (40)
      - colors:

      - seed: (8)

  Notes: Idea and numbers (TakayuStudio catalog-ui-feedback-confetti-rain, written here): 40 pieces 8x5 px r1, 5 colours, from 12 columns across the top (25.5 px apart, ±7 px jitter). Each falls the frame height per 2.8 s or 1.4 s (two speeds), phase-offset; sways ±9 px (1-3 cycles per loop); flips (scaleX = |cos|, min 0.15, 2-5 cycles, back side at 55 % opacity); tilts ±0.8 rad. Drawn behind the result card. Seamless 2.8 s loop. Params: pieces (40) · columns (12) · speeds (2.8 / 1.4 s mỗi lượt) · sway (±9 px) · loop (2.8 s). Pieces fall at two speeds (one or two passes per loop), sway, flip (scaleX = |cos|, back side at 55 %) and tilt; every motion is a whole number of cycles per loop.
