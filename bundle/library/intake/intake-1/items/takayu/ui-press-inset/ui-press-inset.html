    MW.uiPressInset(q(".pi"), tl, 0, { cursor: ".ui-cursor" });

  Options (defaults in brackets):
      - press: s (0.7)
      - release: s (1.6)
      - down: s (0.12)
      - up: s (0.25)
      - inset: px of inner shadow when pressed (32)
      - y: px it sinks (4)
      - ease: (power2.out)
      - shadow: its outer shadow
      - cursor: an optional cursor that makes the clicks
      - approach: [x, y] px the cursor comes from
      - lead: s it arrives before a click

  Notes: Idea and numbers (TakayuStudio catalog-ui-button-inner-press, written here): Accent button 140x46 r14. Press at 0.7 s: k 0 → 1 in 120 ms power2.out; release at 1.6 s: back in 250 ms power2.out. translateY = 1 px × k; the face darkens 12 % × k; an inner shadow of 8 soft rings from the top edge (0 → 8 px); the top light line (40 %) fades out and a light bottom line (30 %) fades in; no scale. Params: down (0.12 s) · up (0.25 s) · inset (8 px) · y (1 px) · ease (power2.out).
