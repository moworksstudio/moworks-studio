  Roll (TakayuStudio (motion-reference), No licence stated: idea and numbers only, written from the idea (site read 12/10/2026)).
  Source: motion-reference.takayustudio.jp/#motion=cam-roll (read 12/10/2026).
  Cả khung nghiêng chưa tới 1° trong tích tắc khi có cú va rồi về thẳng.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.motionCameraRoll(q(".tk-cam"), tl, h, { angle: i % 2 ? -2.5 : 2.5 });

  Options (defaults in brackets):
      - angle: degrees at the hit (0.9)
      - attack: s to reach it (0.06)
      - decay: s back to level, ease-out cubic (0.24)
      - overscan: scale that hides the edges (1.04)

  Notes: Idea and numbers (TakayuStudio cam-roll, written here): Hit accent: the whole frame rotates 0 -> 0.9 deg in 60 ms and back to 0 by 300 ms ease-out (easeOutCubic). Demo exaggerates it as a continuous roll of +-4.6 deg (0.08 rad) on a 3 s sine. Params: angle (0.9°) · attack (60 ms) · decay (0.24 s). Call it once per hit. The demo exaggerates the angle (2.5°) so the roll reads on a small preview, as the site's demo does.
-->

<script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.drive = MW.drive || function (tl, at, dur, fn) {
    var s = { t: 0 }; fn(0);
    tl.fromTo(s, { t: 0 }, { t: dur, duration: dur, ease: "none", immediateRender: false, onUpdate: function () { fn(s.t); } }, at);
    return at + dur;
  };
  var defaults = {"angle":0.9,"attack":0.06,"decay":0.24,"overscan":1.04};
  var run = function (el, tl, at, o) {
        var out = gsap.parseEase("power2.out");
        return MW.drive(tl, at, o.decay + o.attack, function (t) {
          var r = t < o.attack ? o.angle * (t / o.attack) : o.angle * (1 - out(Math.min(1, (t - o.attack) / o.decay)));
          gsap.set(el, { rotation: t >= o.attack + o.decay ? 0 : r, scale: o.overscan });
        });
      };
  MW.motionCameraRoll = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
</script>
