  Bốn vết mực mềm loang ra từ bốn điểm lệch giờ nhau, viền gợn rồi nhập lại thành một, lộ trọn hình bên dưới.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.effectInkReveal(q(".ir"), tl, 0.3, { exitAt: 2.2 });

  Options (defaults in brackets):
      - duration: s per blot (1.2, ease-out cubic)
      - starts: s each blot starts
      - points: [[x, y] shares]
      - size: end radius as a share of the width (0.55)
      - wobble: ± share of the radius, fading as it grows (0.14)
      - seed: (2)
      - exitAt: s after the start to fade (null)

  Notes: Idea and numbers (TakayuStudio ink-reveal, written here): Four soft blobs mask the target (demo box 200 x 110), centres at (24 %, 60 %), (55 %, 29 %), (78 %, 60 %), (44 %, 83 %) of the box, starting 0 / 250 / 150 / 500 ms; each radius 0 -> 110 px (0.55 x box width) over 1200 ms easeOutCubic; 2.5 px feather, edge wobble +-14 % of radius fading as it grows; blobs merge into a full reveal. Exit: fade 300 ms ease-in cubic. Recipe: 980 ms, r 0 -> 105 px. Params: duration mỗi vết (1.2 s) · points (4) · wobble (14 %) · feather (2.5 px).
-->
