  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.motionSnapBack(q(".sn"), tl, 0, { cursor: ".ui-cursor" });

  Options (defaults in brackets):
      - pullAt: s (0.3)
      - pull: s (0.55, power2.inOut)
      - hold: s (0.2, trembling)
      - tremble: ± px (2.4)
      - distance: px (490)
      - stretch: (1.5)
      - k: spring stiffness (420)
      - cx: damping of the position (20)
      - cs: damping of the stretch (12: dips to about 0.8)
      - anchor: px from the anchor to the pill (200)
      - cursor: an optional cursor

  Notes: Idea and numbers (TakayuStudio snap-back, written here): Pulled right: x +98 px (demo) and scaleX 1 → 1.5 (scaleY = 1/scaleX) in 550 ms power2.inOut, a 200 ms hold with a ±0.6 px tremble, then release: x returns on a spring (k 420, d 20), scaleX on a looser one (k 420, d 12) dipping to ~0.8 before 1; 4 ghost copies 18 ms apart for 300 ms after release; a tether line thins as it stretches. Params: pull (98 px) · stretch (1.5) · hold (0.2 s) · spring x (k 420, d 20) · spring scale (k 420, d 12).
