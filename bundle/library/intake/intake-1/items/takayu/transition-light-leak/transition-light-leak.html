<!--
  Light Leak (TakayuStudio (motion-reference), No licence stated: idea and numbers only, written from the idea (site read 12/10/2026)).
  Source: motion-reference.takayustudio.jp/#motion=tr-leak (read 12/10/2026).
  Một luồng sáng ấm mềm lướt ngang và loá mạnh nhất đúng lúc cắt cảnh rồi tan đi.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.transitionLightLeak(q(".tk-b"), tl, 1.5, {});

  Options (defaults in brackets):
      - duration: s (0.8; the cut is under the peak, at the middle)
      - radius: 0-1 of the width (0.62: 200 on a 320 frame)
      - y: 0-1 of the height (0.4)
      - peak: opacity of the warm core (0.95)
      - from: the outgoing scene

  Notes: Idea and numbers (TakayuStudio tr-leak, written here): A soft radial light (stops rgba(255,214,140,.95) -> rgba(255,140,80,.45) at 50 % -> transparent, radius 200 on a 320 frame, y 40 %) sweeps left -> right (centre x -120 -> W + 120) easeInOutSine over 800 ms with opacity sin(pi p): builds 0-400 ms, the cut happens at 400 ms under the peak, fades 400-800 ms. Params: duration (0.8 s) · color (cam ấm) · peak (0.95). Called with the cut time: the leak starts half its duration before it.
-->

<section class="tk-scene tk-a"><div class="tk-mark circle"></div><div class="tk-sc-text"><div class="tk-sc-letter">A</div><div class="tk-sc-cap">Cảnh mở đầu</div></div></section>
<section class="tk-scene tk-b"><div class="tk-mark square"></div><div class="tk-sc-text"><div class="tk-sc-letter">B</div><div class="tk-sc-cap">Cảnh tiếp theo</div></div></section>

<script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.drive = MW.drive || function (tl, at, dur, fn) {
    var s = { t: 0 }; fn(0);
    tl.fromTo(s, { t: 0 }, { t: dur, duration: dur, ease: "none", immediateRender: false, onUpdate: function () { fn(s.t); } }, at);
    return at + dur;
  };
  var defaults = {"duration":0.8,"radius":0.62,"y":0.4,"peak":0.95,"from":null};
  var run = function (el, tl, at, o) {
        var out = o.from ? MW.el(o.from) : el.previousElementSibling, root = el.parentNode, W = el.offsetWidth, H = el.offsetHeight, R = o.radius * W, ease = gsap.parseEase("sine.inOut");
        var leak = document.createElement("div");
        leak.style.cssText = "position:absolute;pointer-events:none;z-index:6;mix-blend-mode:screen;width:" + 2 * R + "px;height:" + 2 * R + "px;border-radius:50%;background:radial-gradient(circle, rgba(255,214,140," + o.peak + ") 0%, rgba(255,140,80,0.45) 50%, rgba(255,140,80,0) 70%);";
        root.appendChild(leak);
        return MW.drive(tl, at - o.duration / 2, o.duration, function (t) {
          var u = t / o.duration, x = -R * 0.6 + (W + R * 1.2) * ease(u);
          leak.style.left = (x - R) + "px"; leak.style.top = (o.y * H - R) + "px"; leak.style.opacity = u > 0 && u < 1 ? String(Math.sin(Math.PI * u)) : "0";
          el.style.visibility = u >= 0.5 ? "visible" : "hidden"; if (out) out.style.visibility = u >= 0.5 ? "hidden" : "visible";
        });
      };
  MW.transitionLightLeak = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
</script>
