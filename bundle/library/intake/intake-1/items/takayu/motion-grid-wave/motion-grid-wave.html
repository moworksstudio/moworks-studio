<!--
  Grid Wave (TakayuStudio (motion-reference), No licence stated: idea and numbers only, written from the idea (site read 12/10/2026)).
  Source: motion-reference.takayustudio.jp/#motion=grid-wave (read 12/10/2026).
  Lưới 3×3 ô trồi lên và phóng từ 78 % về đủ cỡ, lan theo đường chéo từ góc trên trái.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.motionGridWave(q(".gw"), tl, 0.3, {});

  Options (defaults in brackets):
      - items: 
      - cols: (3)
      - y: px (72)
      - from: start scale (0.78)
      - step: s per diagonal step (0.055)
      - duration: s (0.68, power2.out)

  Notes: Idea and numbers (TakayuStudio grid-wave, written here): 3×3 tiles (36 px, 8 px gap): y +18 → 0 px, scale 0.78 → 1, opacity in over the first 55 % — each 680 ms power2.out, starting (row + col) × 55 ms (900 ms in all). A faint shadow bar under each tile fades in with it; the sweeping guide line is not ported. Params: y (18 px) · scale đầu (0.78) · step: trễ mỗi bậc chéo (55 ms) · each (0.68 s).
-->

<div class="st"><div class="gw" style="grid-template-columns:repeat(3,1fr)"><i style="background:#2f3a5c">1</i><i style="background:#2f3a5c">2</i><i style="background:#2f3a5c">3</i><i style="background:#2f3a5c">4</i><i style="background:#2f3a5c">5</i><i style="background:#2f3a5c">6</i><i style="background:#2f3a5c">7</i><i style="background:#2f3a5c">8</i><i style="background:#2f3a5c">9</i></div></div>

</style>

<script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.drive = MW.drive || function (tl, at, dur, fn) {
    var s = { t: 0 }; fn(0);
    tl.fromTo(s, { t: 0 }, { t: dur, duration: dur, ease: "none", immediateRender: false, onUpdate: function () { fn(s.t); } }, at);
    return at + dur;
  };
  var defaults = {"items":"i","cols":3,"y":72,"from":0.78,"step":0.055,"duration":0.68};
  var run = function (el,tl,at,o
  ) {
  var it = Array.prototype.slice.call(el.querySelectorAll(o.items)), n = it.length, cols = o.cols || n;
  var p2 = gsap.parseEase("power2.out");
  return MW.drive(tl, at, (2 * cols - 2) * o.step + o.duration, function (t) { it.forEach(function (x, i) { var d = (Math.floor(i / cols) + i % cols) * o.step, u = Math.max(0, Math.min(1, (t - d) / o.duration)), e = p2(u); gsap.set(x, { y: o.y * (1 - e), scale: o.from + (1 - o.from) * e }); x.style.opacity = String(Math.min(1, u / 0.55)); }); });
  };
  MW.motionGridWave = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
</script>
