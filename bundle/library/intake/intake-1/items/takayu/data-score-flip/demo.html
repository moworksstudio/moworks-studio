<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Score Update - Demo</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
:root { --bg: #09090b; --fg: #fafafa; --card: #111114; --line: #27272a; }
* { box-sizing: border-box; }
html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); }
#demo { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); color: var(--fg); font-family: Inter, sans-serif; }
.center { position: absolute; inset: 0; display: grid; place-items: center; }
.row { display: flex; align-items: center; justify-content: center; gap: 48px; }
.col { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 32px; }
.h1 { font-size: 132px; font-weight: 800; letter-spacing: -0.035em; line-height: 1.1; text-align: center; }
.h2 { font-size: 84px; font-weight: 700; letter-spacing: -0.025em; line-height: 1.15; text-align: center; }
.p { font-size: 40px; line-height: 1.4; opacity: 0.72; text-align: center; }
.card { position: relative; border-radius: 28px; background: var(--card); border: 2px solid var(--line); overflow: hidden; }
.muted { opacity: 0.6; }

#demo { background: radial-gradient(100% 100% at 50% 40%, #1a1f33, #0b0d12); color: #e8ebf3; font-family: Inter, sans-serif; } .gm { position: absolute; inset: 0; }
.sf { position: absolute; inset: 0; display: grid; place-items: center; } .sf-box { display: flex; align-items: center; gap: 46px; padding: 60px 80px; border-radius: 40px; background: #151a28; border: 3px solid #2a3350; font-size: 70px; font-weight: 800; }
.sf-c { position: relative; width: 170px; height: 200px; border-radius: 24px; background: #222a42; display: grid; place-items: center; font-size: 140px; font-weight: 900; font-variant-numeric: tabular-nums; } .sf-sep { color: #6c778b; }
.sf-dot { position: absolute; top: -40px; left: 50%; width: 22px; height: 22px; margin-left: -11px; border-radius: 50%; background: #ffd23d; opacity: 0; } .sf-w { position: relative; }
    </style>
  </head>
  <body>
    <div id="demo" data-composition-id="mw-demo" data-start="0" data-width="1920" data-height="1080" data-duration="4.2">
<div class="gm sf"><div class="sf-box"><span>Hà Nội</span><div class="sf-w"><div class="sf-dot d1"></div><div class="sf-c h">1</div></div><span class="sf-sep">-</span><div class="sf-w"><div class="sf-dot d2"></div><div class="sf-c a">1</div></div><span>Sài Gòn</span></div></div>
      <script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.drive = MW.drive || function (tl, at, dur, fn) {
    var s = { t: 0 }; fn(0);
    tl.fromTo(s, { t: 0 }, { t: dur, duration: dur, ease: "none", immediateRender: false, onUpdate: function () { fn(s.t); } }, at);
    return at + dur;
  };
  var defaults = {"values":[1,2,1],"times":[0.7,3.8],"flash":"#8b7bff","dot":null,"dots":[true,false],"loop":4.2};
  var run = function (el, tl, at, o) {
        var pin = gsap.parseEase("power1.in"), pout = gsap.parseEase("power1.out"), dot = o.dot ? MW.el(o.dot) : null, base = getComputedStyle(el).backgroundColor, col = getComputedStyle(el).color;
        el.parentNode.style.perspective = "1200px";
        return MW.drive(tl, at, o.loop, function (t) {
          var k = 0; o.times.forEach(function (tt, i) { if (t >= tt) k = i + 1; });
          var d = k ? t - o.times[k - 1] : 9, prev = o.values[Math.max(0, k - 1)], cur = o.values[k], ang = 0, txt = cur;
          if (k && d < 0.35) { if (d < 0.175) { ang = -90 * pin(d / 0.175); txt = prev; } else { ang = 90 * (1 - pout((d - 0.175) / 0.175)); } }
          el.textContent = String(txt); gsap.set(el, { rotationX: ang });
          var f = d - 0.35, lit = k && f >= 0 && ((f < 0.15) || (f >= 0.3 && f < 0.45));
          el.style.backgroundColor = lit ? o.flash : base; el.style.color = lit ? base : col;
          if (dot) dot.style.opacity = k && d < 1.1 && o.dots && o.dots[k - 1] ? "1" : "0";
        });
      };
  MW.dataScoreFlip = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
      </script>
      <script>
        (function () {
          var tl = gsap.timeline({ paused: true });
          var q = function (s) { return document.querySelector(s); }, qa = function (s) { return Array.prototype.slice.call(document.querySelectorAll(s)); };
          MW.dataScoreFlip(q(".sf-c.h"), tl, 0, { values: [1, 2, 1], times: [0.7, 3.8], dot: ".d1" }); MW.dataScoreFlip(q(".sf-c.a"), tl, 0, { values: [1, 2, 1], times: [2.1, 3.8], dot: ".d2" });
          tl.set({}, {}, 4.2);
          // register only when every motion is ready (MW.pending: e.g. a WebGL texture still decoding), as HyperFrames asks of async builds
          var go = function () { window.__timelines = window.__timelines || {}; window.__timelines["mw-demo"] = tl; };
          if (window.MW && MW.pending && MW.pending.length) Promise.all(MW.pending).then(go, go); else go();
        })();
      </script>
    </div>
  </body>
</html>
