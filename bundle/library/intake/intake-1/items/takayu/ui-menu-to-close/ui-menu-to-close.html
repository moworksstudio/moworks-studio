  Options (defaults in brackets):
      - bars: the three bars, top to bottom
      - gap: px between bars (42)
      - angle: degrees (45)
      - duration: s (0.56, power2.inOut)
      - ease: 
      - clicks: [s open, s close]
      - cursor: an optional cursor
      - approach: [x, y] px the cursor comes from
      - lead: s it arrives before a click

  Notes: Idea and numbers (TakayuStudio icon-morph, written here): Round button r44; three bars 44 px long, 5 px, round caps. Over 560 ms power2.inOut (0.5-1.06 s): middle bar scaleX and opacity 1 → 0 in the first 40 %; outer bars move from ±14 px to the centre in the first 50 %, then rotate 0 → ±45° in the second 50 %. Reverse 1.6-2.16 s. Cursor presses at 0.45 and 1.55 s. Recipe at UI size: bars ±7 px. Params: duration (0.56 s) · gap (14 px) · angle (45°) · ease (power2.inOut). The middle bar shrinks away in the first 40 %; the outer bars meet in the first half and turn ±45° in the second.
