<!--
  Seven-segment Display (TakayuStudio (motion-reference), No licence stated: idea and numbers only, written from the idea (site read 12/10/2026)).
  Source: motion-reference.takayustudio.jp/#motion=tx-seven-segment (read 12/10/2026).
  Chữ số dựng từ bảy thanh đèn LED, đổi số thì chỉ các thanh khác nhau sáng tắt trong 60 ms, dấu hai chấm nhấp nháy mỗi giây.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.dataSevenSegment(q(".ss-d"), tl, 0, {});

  Options (defaults in brackets):
      - from: the shown value as hhmm (1234)
      - start: s it starts counting (0.5)
      - every: s per step (0.45)
      - fade: s a segment changes (0.06)
      - off: unlit opacity (0.08)
      - width: px per digit (150)
      - color: LED colour
      - format: digit layout ('dd:dd')
      - powerOffAt: s (3.4)
      - loop: s (4)

  Notes: Idea and numbers (TakayuStudio tx-seven-segment, written here): Each digit = 7 hexagonal bar segments a–g (thickness 0.17 × digit width, height 1.8 × width, italic skew 0.08 ≈ 4.6°) + optional colon / dot; value → bitmask (0 abcdef, 1 bc, 2 abdeg, 3 abcdg, 4 bcfg, 5 acdfg, 6 acdefg, 7 abc, 8 all, 9 abcdfg, − g); on change only differing segments fade over 60 ms; unlit at 0.08 opacity, lit 1 with a soft glow (blur 8 px); colon blinks 1 Hz. Demo counts up 1 every 0.45 s from 0.5 s, power drops 3.4–3.62 s; loop 4 s. Params: value: số hiển thị (12:34) · fade: đổi thanh (0.06 s) · off: độ sáng thanh tắt (0.08) · colon: nhấp nháy (1 Hz) · color.
-->

<div class="gm ss"><div><div class="ss-box"><div class="ss-d"></div></div><p>Giờ mở bán</p></div></div>

<script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.drive = MW.drive || function (tl, at, dur, fn) {
    var s = { t: 0 }; fn(0);
    tl.fromTo(s, { t: 0 }, { t: dur, duration: dur, ease: "none", immediateRender: false, onUpdate: function () { fn(s.t); } }, at);
    return at + dur;
  };
  var defaults = {"from":1234,"start":0.5,"every":0.45,"fade":0.06,"off":0.08,"width":150,"color":"#ff5d6c","format":"dd:dd","powerOffAt":3.4,"loop":4};
  var run = function (el, tl, at, o) {
        var NS = "http://www.w3.org/2000/svg", MASK = { "0": "abcdef", "1": "bc", "2": "abdeg", "3": "abcdg", "4": "bcfg", "5": "acdfg", "6": "acdefg", "7": "abc", "8": "abcdefg", "9": "abcdfg", "-": "g" };
        var w = o.width, h = w * 1.8, th = w * 0.17, gap = w * 0.35, svg = document.createElementNS(NS, "svg"), digits = [], colon = [];
        var seg = function (x, y, len, vert) { var p = document.createElementNS(NS, "polygon"), a = th / 2, pts = vert ? [[x, y], [x + a, y + a], [x + a, y + len - a], [x, y + len], [x - a, y + len - a], [x - a, y + a]] : [[x, y], [x + a, y - a], [x + len - a, y - a], [x + len, y], [x + len - a, y + a], [x + a, y + a]]; p.setAttribute("points", pts.map(function (q) { return q.join(","); }).join(" ")); p.setAttribute("fill", o.color); return p; };
        var x = th, cnt = o.format.length;
        svg.setAttribute("width", cnt * (w + gap) + th * 2); svg.setAttribute("height", h + th * 2); svg.style.overflow = "visible"; svg.style.transform = "skewX(" + (-4.6) + "deg)";
        for (var i = 0; i < cnt; i++) {
          if (o.format[i] === ":") { [h * 0.32, h * 0.68].forEach(function (yy) { var c = document.createElementNS(NS, "circle"); c.setAttribute("cx", x + th / 2); c.setAttribute("cy", yy + th); c.setAttribute("r", th * 0.55); c.setAttribute("fill", o.color); svg.appendChild(c); colon.push(c); }); x += th * 2 + gap * 0.6; continue; }
          var y0 = th, m = h / 2, S = { a: seg(x + th / 2, y0, w - th, false), b: seg(x + w, y0 + th / 2, m - th, true), c: seg(x + w, y0 + m + th / 2, m - th, true), d: seg(x + th / 2, y0 + h, w - th, false), e: seg(x, y0 + m + th / 2, m - th, true), f: seg(x, y0 + th / 2, m - th, true), g: seg(x + th / 2, y0 + m, w - th, false) };
          for (var k in S) svg.appendChild(S[k]); digits.push(S); x += w + gap;
        }
        el.appendChild(svg); svg.style.filter = "drop-shadow(0 0 8px " + o.color + ")";
        var at0 = function (v, i) { return String(v)[i]; };
        return MW.drive(tl, at, o.loop, function (t) {
          var n = Math.max(0, Math.floor((t - o.start) / o.every) + 1), cur = o.from + (t >= o.start ? n : 0), prev = cur - 1, d = t >= o.start ? (t - o.start) % o.every : 9, pow = 1 - Math.max(0, Math.min(1, (t - o.powerOffAt) / 0.22));
          var fmt = function (v) { var mm = Math.floor(v / 100) % 100, ss = v % 100; ss = ss % 60; return ("0" + Math.floor(v / 100)).slice(-2) + ("0" + (v % 100)).slice(-2); };
          var A = fmt(prev), B = fmt(cur), k2 = Math.min(1, d / o.fade);
          digits.forEach(function (S, i) { for (var s in S) { var on1 = MASK[A[i]].indexOf(s) >= 0, on2 = MASK[B[i]].indexOf(s) >= 0, v = on1 === on2 ? (on2 ? 1 : o.off) : (on2 ? o.off + (1 - o.off) * k2 : 1 - (1 - o.off) * k2); S[s].setAttribute("opacity", String(Math.max(o.off * pow, v * pow))); } });
          colon.forEach(function (c) { c.setAttribute("opacity", String((Math.floor(t * 2) % 2 ? o.off : 1) * pow)); });
        });
      };
  MW.dataSevenSegment = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
</script>
