  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.textHandwriteMask(q(".tk-head"), tl, 0, {});

  Options (defaults in brackets):
      - total: s of writing, split by letter width (2.2)
      - step: em between zig-zag strokes (0.17)
      - slant: em (0.07)
      - start: s (0.3)
      - fadeAt: s (3.6)
      - ink: 
      - mute: the faint copy under it
      - accent: pen tip
      - loop: s (4.2)

  Notes: Idea and numbers (TakayuStudio tx-handwriting, written here): Write time 2.2 s from 0.3 s, split across glyphs by glyph width (≈ stroke length), one after another. Each glyph is revealed by a thick zig-zag stroke (segments 0.17 em apart, top ↔ bottom with ±0.07 em slant, width 1.7 × segment + 1 px, round caps) drawn with sine.inOut, used as a mask over the filled font. Under it a 55 % mute copy and a baseline; a pen (short line + accent dot) rides the stroke head. Fade out 3.6–4.0 s. Loop 4.2 s. Params: tổng thời gian (2.2 s) · độ dày nét quét (1.7 × bước) · đầu bút (bật / tắt). Each letter is revealed by a thick zig-zag stroke drawn as a mask (sine.inOut), with a pen riding its head.
-->
