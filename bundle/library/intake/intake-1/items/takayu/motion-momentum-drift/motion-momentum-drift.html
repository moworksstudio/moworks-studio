  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.motionMomentumDrift(q(".md"), tl, 0, {});

  Options (defaults in brackets):
      - keys: [fast, past, rest] px ([1040, 1140, 1085])
      - nudge: px under the pressed cursor first (60)
      - flickAt: s (0.6)
      - cursor: 

  Notes: Idea and numbers (TakayuStudio momentum-drift, written here): Card flicked by a cursor: x 0 → 168 px at 598 ms (power2.out) → 184 at 739 ms (sine.out, drifting past) → 175 at 880 ms (power2.inOut) (demo ×1.03); three speed lines behind it scale with speed. In the demo a 10 px nudge under the pressed cursor precedes it (300 ms). Params: duration (0.88 s) · x (175 px) · drift: trôi quá (9 px) · lines: vệt tốc độ (bật/tắt).
