  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline

    MW.uiPress3d(q(".p3"), tl, 0, { cursor: ".ui-cursor" });

  Options (defaults in brackets):
      - depth: [rest, pressed] px of the side band ([32, 8])
      - press: s (0.7, 0.1 s power2.out)
      - release: s (1.3)
      - k: spring stiffness on release (420)
      - c: damping (24)
      - side: side band colour
      - shadow: an extra shadow under it
      - cursor: an optional cursor that makes the clicks
      - approach: [x, y] px the cursor comes from
      - lead: s it arrives before a click

  Notes: Idea and numbers (TakayuStudio catalog-ui-button-push-3d, written here): Button 140x44 r14 sitting on an 8 px darker side band (depth; the accent mixed 50 % with the background). Press at 0.7 s: depth 8 → 2 px in 100 ms power2.out (the top face moves down 6 px, the base stays). Release at 1.3 s: depth back to 8 px on a spring k420 d24 (one small overshoot). Params: depth (8 → 2 px) · press (0.1 s, power2.out) · spring (k420 c24) · at / release.
