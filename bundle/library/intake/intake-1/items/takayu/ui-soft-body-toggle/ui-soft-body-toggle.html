  Bấm, núm bẹp ngang, chạy sang kéo dài như thạch, đập vào mép bên kia thì dẹt lại rồi nảy về tròn bằng lò xo; rãnh đổi màu theo.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.uiSoftBodyToggle(q(".sb"), tl, 0, {});

  Options (defaults in brackets):
      - knob: 
      - distance: px of travel (260)
      - travel: s (0.33, power2.inOut)
      - k: landing spring stiffness (420)
      - c: damping (11)
      - pressAt: s (0.4)
      - backAt: s (2.4)
      - on: track colour on
      - off: track colour off

  Notes: Idea and numbers (TakayuStudio catalog-ui-material-soft-body-toggle, written here): Knob r17, track 104x48. Press (0-150 ms): scaleX 1.12, scaleY 0.85 (power2.out). Travel 52 px over 330 ms power2.inOut with a stretch scaleX + 0.4 × sin(π × progress). Arrival: squash scaleX 0.78 against the far edge (the knob keeps touching it), then back to 1 on a spring k420 d11; scaleY = 1 / scaleX; the track colour follows progress. Press at 0.4 s; reverse at 2.4 s. Params: press (0.15 s, 1.12 × 0.85) · travel (52 px, 0.33 s) · stretch (+0.4) · squash (0.78, k420 c11). Press: 1.12 × 0.85 in 0.15 s; travel with scaleX + 0.4 × sin(π progress); lands squashed to 0.78 against the far edge, then springs back; scaleY = 1 / scaleX.
-->

<div class="st"><div class="sb"><div class="sb-k"></div></div></div>

</style>

<script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.spring = MW.spring || function (stiffness, damping, mass, from, to) {
    var k = stiffness || 100, c = damping == null ? 10 : damping, m = mass || 1, w0 = Math.sqrt(k / m), z = c / (2 * Math.sqrt(k * m));
    var x = function (t) {
      if (z < 1) { var wd = w0 * Math.sqrt(1 - z * z); return 1 - Math.exp(-z * w0 * t) * (Math.cos(wd * t) + (z * w0 / wd) * Math.sin(wd * t)); }
      if (z === 1) return 1 - Math.exp(-w0 * t) * (1 + w0 * t);
      var q = Math.sqrt(z * z - 1), r1 = -w0 * (z - q), r2 = -w0 * (z + q), A = r2 / (r2 - r1), B = -r1 / (r2 - r1);
      return 1 - (A * Math.exp(r1 * t) + B * Math.exp(r2 * t));
    };
    var T = 0, dt = 1 / 240; for (var t = 0; t < 30; t += dt) if (Math.abs(1 - x(t)) > 0.001) T = t;
    T = Math.max(dt, T + dt);
    return { duration: T, ease: function (p) { return p >= 1 ? 1 : x(p * T); }, at: x };
  };
  MW.springDB = MW.springDB || function (duration, bounce) {
    var z = 1 - (bounce == null ? 0.25 : bounce), w = Math.log(1000) / (Math.max(0.05, z) * (duration || 0.8));
    return MW.spring(w * w, 2 * z * w, 1);
  };
  MW.drive = MW.drive || function (tl, at, dur, fn) {
    var s = { t: 0 }; fn(0);
    tl.fromTo(s, { t: 0 }, { t: dur, duration: dur, ease: "none", immediateRender: false, onUpdate: function () { fn(s.t); } }, at);
    return at + dur;
  };
  var defaults = {"knob":".sb-k","distance":260,"travel":0.33,"k":420,"c":11,"pressAt":0.4,"backAt":2.4,"on":"#8b7bff","off":"#2a3142"};
  var run = function (el, tl, at, o) {
        var kn = el.querySelector(o.knob), p2 = gsap.parseEase("power2.out"), io = gsap.parseEase("power2.inOut"), sp = MW.spring(o.k, o.c), mix = gsap.utils.interpolate(o.off, o.on);
        var one = function (t, t0, dir) { var u = t - t0; if (u <= 0) return null; var sx = 1, sy, x, origin = "50% 50%";
          if (u < 0.15) { var a = p2(u / 0.15); sx = 1 + 0.12 * a; sy = 1 - 0.15 * a; x = 0; }
          else if (u < 0.15 + o.travel) { var p = io((u - 0.15) / o.travel); x = p; sx = 1.12 * (1 - p) + p + 0.4 * Math.sin(Math.PI * p); sy = 1 / sx; }
          else { x = 1; sx = 0.78 + 0.22 * sp.at(u - 0.15 - o.travel); sy = 1 / sx; origin = dir > 0 ? "100% 50%" : "0% 50%"; }
          return { x: x, sx: sx, sy: sy, origin: origin }; };
        return MW.drive(tl, at, o.backAt + 0.15 + o.travel + sp.duration, function (t) {
          var b = one(t, o.backAt, -1), f = one(t, o.pressAt, 1), s = b || f || { x: 0, sx: 1, sy: 1, origin: "50% 50%" }, pos = b ? 1 - b.x : s.x;
          gsap.set(kn, { x: o.distance * pos, scaleX: s.sx, scaleY: s.sy, transformOrigin: s.origin }); el.style.background = mix(Math.max(0, Math.min(1, pos)));
        });
      };
  MW.uiSoftBodyToggle = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
</script>
