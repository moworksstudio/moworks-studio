<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Pixel Dissolve - Demo</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
:root { --bg: #09090b; --fg: #fafafa; --card: #111114; --line: #27272a; }
* { box-sizing: border-box; }
html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); }
#demo { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); color: var(--fg); font-family: Inter, sans-serif; }
.center { position: absolute; inset: 0; display: grid; place-items: center; }
.row { display: flex; align-items: center; justify-content: center; gap: 48px; }
.col { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 32px; }
.h1 { font-size: 132px; font-weight: 800; letter-spacing: -0.035em; line-height: 1.1; text-align: center; }
.h2 { font-size: 84px; font-weight: 700; letter-spacing: -0.025em; line-height: 1.15; text-align: center; }
.p { font-size: 40px; line-height: 1.4; opacity: 0.72; text-align: center; }
.card { position: relative; border-radius: 28px; background: var(--card); border: 2px solid var(--line); overflow: hidden; }
.muted { opacity: 0.6; }

#demo { --ink: #e8ebf3; --acc: #8b7bff; --acc2: #3dd6f5; --warm: #ffb547; --rose: #ff5d8f; --mute: #6c778b; --tk-card: #151a24; --tk-line: #262c3a; background: #0b0d12; color: var(--ink); }
.tk-stage { position: absolute; inset: 0; display: grid; place-items: center; }
.tk-cap { font-size: 30px; font-weight: 500; color: var(--mute); letter-spacing: 0.01em; }
.tk-scene { position: absolute; inset: 0; overflow: hidden; display: flex; align-items: center; justify-content: center; gap: 110px; }
.tk-a { background: radial-gradient(120% 120% at 30% 30%, #1b2440 0%, #10141f 55%, #0b0d12 100%); }
.tk-b { background: radial-gradient(120% 120% at 70% 30%, #a28cff 0%, #7a5cf5 50%, #5232d8 100%); }
.tk-mark { width: 340px; height: 340px; flex: none; }
.tk-mark.circle { border-radius: 50%; background: radial-gradient(circle at 35% 30%, #8ff0ff, #2bb7e6 60%, #1580b8); box-shadow: 0 40px 120px rgba(61, 214, 245, 0.25); }
.tk-mark.square { border-radius: 56px; background: linear-gradient(160deg, #ffffff, #e2dcff); box-shadow: 0 40px 120px rgba(20, 0, 80, 0.35); }
.tk-mark.coin { border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff1b0, #ffc633 60%, #d99400); }
.tk-sc-text { display: flex; flex-direction: column; gap: 18px; }
.tk-sc-letter { font-size: 260px; font-weight: 800; line-height: 0.85; letter-spacing: -0.04em; }
.tk-a .tk-sc-letter { color: #e8ebf3; } .tk-b .tk-sc-letter { color: #ffffff; }
.tk-sc-cap { font-size: 44px; font-weight: 600; }
.tk-a .tk-sc-cap { color: #8f9ab3; } .tk-b .tk-sc-cap { color: rgba(255, 255, 255, 0.82); }
    </style>
  </head>
  <body>
    <div id="demo" data-composition-id="mw-demo" data-start="0" data-width="1920" data-height="1080" data-duration="3">
<section class="tk-scene tk-a"><div class="tk-mark circle"></div><div class="tk-sc-text"><div class="tk-sc-letter">A</div><div class="tk-sc-cap">Cảnh mở đầu</div></div></section>
<section class="tk-scene tk-b"><div class="tk-mark square"></div><div class="tk-sc-text"><div class="tk-sc-letter">B</div><div class="tk-sc-cap">Cảnh tiếp theo</div></div></section>
      <script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.rand = MW.rand || function (seed) {
    var a = typeof seed === "string" ? MW.hash(seed) : (seed >>> 0) || 1;
    return function () { a = (a + 0x6d2b79f5) >>> 0; var t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  };
  MW.hash = MW.hash || function (s) { var h = 2166136261; s = String(s); for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; };
  MW.drive = MW.drive || function (tl, at, dur, fn) {
    var s = { t: 0 }; fn(0);
    tl.fromTo(s, { t: 0 }, { t: dur, duration: dur, ease: "none", immediateRender: false, onUpdate: function () { fn(s.t); } }, at);
    return at + dur;
  };
  var defaults = {"cell":0.05,"duration":0.6,"seed":7,"from":null};
  var run = function (el, tl, at, o) {
        var out = o.from ? MW.el(o.from) : el.previousElementSibling, W = el.offsetWidth, H = el.offsetHeight, c = o.cell * W, cols = Math.ceil(W / c), rows = Math.ceil(H / c);
        var r = MW.rand(o.seed), cells = [];
        for (var j = 0; j < rows; j++) for (var i = 0; i < cols; i++) cells.push({ x: i * c, y: j * c, th: r() });
        return MW.drive(tl, at, o.duration, function (t) {
          var p = t / o.duration, pts = ["0px 0px"], all = true;
          // the cells already switched, as one polygon: each cell joined to the corner by a zero-area thread
          for (var k = 0; k < cells.length; k++) {
            var q = cells[k]; if (q.th >= p) { all = false; continue; }
            pts.push(q.x + "px " + q.y + "px", (q.x + c) + "px " + q.y + "px", (q.x + c) + "px " + (q.y + c) + "px", q.x + "px " + (q.y + c) + "px", q.x + "px " + q.y + "px", "0px 0px");
          }
          el.style.clipPath = all ? "none" : pts.length < 3 ? "inset(50%)" : "polygon(" + pts.join(",") + ")"; el.style.visibility = t > 0 ? "visible" : "hidden";
          if (out) out.style.visibility = all ? "hidden" : "visible";
        });
      };
  MW.transitionPixelDissolve = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
      </script>
      <script>
        (function () {
          var tl = gsap.timeline({ paused: true });
          var q = function (s) { return document.querySelector(s); }, qa = function (s) { return Array.prototype.slice.call(document.querySelectorAll(s)); };
          MW.transitionPixelDissolve(q(".tk-b"), tl, 1.2, {});
          tl.set({}, {}, 3);
          // register only when every motion is ready (MW.pending: e.g. a WebGL texture still decoding), as HyperFrames asks of async builds
          var go = function () { window.__timelines = window.__timelines || {}; window.__timelines["mw-demo"] = tl; };
          if (window.MW && MW.pending && MW.pending.length) Promise.all(MW.pending).then(go, go); else go();
        })();
      </script>
    </div>
  </body>
</html>
