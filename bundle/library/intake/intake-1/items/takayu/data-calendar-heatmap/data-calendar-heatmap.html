    MW.dataCalendarHeatmap(q(".gm"), tl, 0, {});

  Options (defaults in brackets):
      - seed: the month's values

  Notes: Idea and numbers (TakayuStudio catalog-data-story-calendar-density, written here): 7 x 5 month grid (cells 30 x 21, pitch 33 x 25), day 1 in column 3, weekday header. Week row r reveals from 350 + 420 r ms; cells in a row 15 ms apart, each rises 8 px and fades in over 350 ms easeOutCubic; fill opacity 0.1 + 0.9 x value (weekends x 0.45); the active row label turns accent. 4-swatch legend. Fade 3600-3900. Params: grid (7 × 5) · interval tuần (0.42 s) · start: ngày 1 (cột 3).
