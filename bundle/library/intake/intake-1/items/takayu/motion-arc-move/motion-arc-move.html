  Chấm đi theo đường cong có điểm giữa lệch khỏi đường thẳng, cạnh một chấm xám đi thẳng để so sánh.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.motionArcMove(q(".am-a"), tl, 0.3, { compare: ".am-b", backAt: 2 });

  Options (defaults in brackets):
      - dx: px to the end (−1080)
      - dy: px (−540)
      - bend: px the mid-point sits off the straight line (270; the recipe 10–20)
      - duration: s (1.2; the recipe 0.9 s sine.inOut)
      - ease: (power2.inOut)
      - compare: a second element that goes straight
      - backAt: s after the start to come back (null)

  Notes: Idea and numbers (TakayuStudio arcs, written here): Dot travels a quadratic arc (start (270,160) → end (70,60), control (250,50) on a 320×200 stage: the mid-point sits ~50 px off the chord) in 1200 ms power2.inOut, beside a grey dot on the straight chord. Recipe: 900 ms sine.inOut with the mid-point 10–20 px off (15 px); thrown objects follow a parabola. Params: duration (0.9 s) · offset: lệch điểm giữa (15 px) · ease (sine.inOut).
-->

<script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.drive = MW.drive || function (tl, at, dur, fn) {
    var s = { t: 0 }; fn(0);
    tl.fromTo(s, { t: 0 }, { t: dur, duration: dur, ease: "none", immediateRender: false, onUpdate: function () { fn(s.t); } }, at);
    return at + dur;
  };
  var defaults = {"dx":-1080,"dy":-540,"bend":270,"duration":1.2,"ease":"power2.inOut","compare":null,"backAt":null};
  var run = function (el, tl, at, o) {
        var e = gsap.parseEase(o.ease), L = Math.hypot(o.dx, o.dy) || 1, nx = -o.dy / L, ny = o.dx / L, cx = o.dx / 2 + nx * 2 * o.bend, cy = o.dy / 2 + ny * 2 * o.bend, cmp = o.compare ? el.parentNode.querySelector(o.compare) : null;
        var pt = function (u) { var b = 2 * (1 - u) * u, q = u * u; return [b * cx + q * o.dx, b * cy + q * o.dy]; };
        return MW.drive(tl, at, o.backAt == null ? o.duration : o.backAt + o.duration, function (t) {
          var u = e(Math.min(1, t / o.duration)); if (o.backAt != null && t > o.backAt) u = 1 - e(Math.min(1, (t - o.backAt) / o.duration));
          var p = pt(u); gsap.set(el, { x: p[0], y: p[1] }); if (cmp) gsap.set(cmp, { x: o.dx * u, y: o.dy * u });
        });
      };
  MW.motionArcMove = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
</script>
