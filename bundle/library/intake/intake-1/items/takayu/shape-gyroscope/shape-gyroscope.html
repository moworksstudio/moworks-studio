<!--
  Gyroscope Rotation (TakayuStudio (motion-reference), No licence stated: idea and numbers only, written from the idea (site read 12/10/2026)).
  Source: motion-reference.takayustudio.jp/#motion=gyroscope (read 12/10/2026).
  Hai vòng tròn vuông góc quanh một lõi xoay một vòng quanh trục dọc trong khi nghiêng lên 55° rồi về.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.shapeGyroscope(q(".gm"), tl, 0, {});

  Options (defaults in brackets):
      - rings: radii in the 320 frame ([58, 44])
      - strokes: ([4, 3])
      - tilt: degrees at the middle (55)
      - perspective: (360)
      - duration: s per turn (1.1)
      - hold: s between turns (0.6)
      - cycles: (2)

  Notes: Idea and numbers (TakayuStudio gyroscope, written here): Two rings (r 58 and 44 px, strokes 4 and 3 px; the inner one perpendicular to the outer) around a 10 px core: the assembly turns rotateY 0 → 360° (sine.inOut) while rotateX goes 0 → 55° → 0 (sine each half), 1100 ms, perspective 360 px; back halves at 30 % opacity behind the core; a marker dot on the outer ring (front half only). Params: duration (1.1 s) · rings (58 / 44 px) · tilt (55°) · perspective (360 px).
-->

<script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.drive = MW.drive || function (tl, at, dur, fn) {
    var s = { t: 0 }; fn(0);
    tl.fromTo(s, { t: 0 }, { t: dur, duration: dur, ease: "none", immediateRender: false, onUpdate: function () { fn(s.t); } }, at);
    return at + dur;
  };
  MW.canvas = MW.canvas || function (host, w, h) {
    host = MW.el(host);
    var cv = document.createElement("canvas"); w = w || host.clientWidth || 1920; h = h || host.clientHeight || 1080;
    cv.width = w; cv.height = h; cv.style.position = "absolute"; cv.style.left = "0"; cv.style.top = "0"; cv.style.width = w + "px"; cv.style.height = h + "px"; cv.style.pointerEvents = "none";
    host.appendChild(cv);
    return { cv: cv, ctx: cv.getContext("2d"), w: w, h: h };
  };
  MW.stage320 = MW.stage320 || function (host) {
    host = MW.el(host); if (getComputedStyle(host).position === "static") host.style.position = "relative";
    var c = MW.canvas(host), k = Math.min(c.w / 320, c.h / 200), ox = (c.w - 320 * k) / 2, oy = (c.h - 200 * k) / 2;
    return { ctx: c.ctx, cv: c.cv, k: k, ox: ox, oy: oy, w: c.w, h: c.h,
      clear: function () { c.ctx.setTransform(1, 0, 0, 1, 0, 0); c.ctx.clearRect(0, 0, c.w, c.h); c.ctx.setTransform(k, 0, 0, k, ox, oy); },
      put: function (el, x, y) { el.style.position = "absolute"; el.style.left = (ox + x * k) + "px"; el.style.top = (oy + y * k) + "px"; gsap.set(el, { xPercent: -50, yPercent: -50 }); } };
  };
  var defaults = {"rings":[58,44],"strokes":[4,3],"tilt":55,"perspective":360,"duration":1.1,"hold":0.6,"cycles":2};
  var run = function (el, tl, at, o) {
        var S = MW.stage320(el), c = S.ctx, si = gsap.parseEase("sine.inOut"), cx = 160, cy = 92;
        var ring = function (r, plane) { var pts = []; for (var i = 0; i <= 96; i++) { var a = i / 96 * 2 * Math.PI; pts.push(plane ? [0, r * Math.sin(a), r * Math.cos(a)] : [r * Math.cos(a), r * Math.sin(a), 0]); } return pts; };
        var R = [[ring(o.rings[0], 0), o.strokes[0], "#8b7bff"], [ring(o.rings[1], 1), o.strokes[1], "#3dd6f5"]];
        var proj = function (p, ry, rx) { var x = p[0] * Math.cos(ry) + p[2] * Math.sin(ry), z = -p[0] * Math.sin(ry) + p[2] * Math.cos(ry), y = p[1], y2 = y * Math.cos(rx) - z * Math.sin(rx), z2 = y * Math.sin(rx) + z * Math.cos(rx), k = o.perspective / (o.perspective + z2); return [cx + x * k, cy + y2 * k, z2]; };
        var per = o.duration + o.hold;
        return MW.drive(tl, at, o.cycles * per, function (t) {
          S.clear(); var u = Math.min(1, (t % per) / o.duration), ry = 2 * Math.PI * si(u), rx = (o.tilt * Math.PI / 180) * (u < 0.5 ? si(u * 2) : 1 - si((u - 0.5) * 2));
          var g = c.createRadialGradient(cx, 170, 2, cx, 170, 60); g.addColorStop(0, "rgba(0,0,0,0.5)"); g.addColorStop(1, "rgba(0,0,0,0)"); c.fillStyle = g; c.save(); c.translate(cx, 170); c.scale(1, 0.16); c.beginPath(); c.arc(0, 0, 60, 0, 2 * Math.PI); c.restore(); c.fill();
          var segs = []; R.forEach(function (q) { var P = q[0].map(function (p) { return proj(p, ry, rx); }); for (var i = 0; i < P.length - 1; i++) segs.push({ a: P[i], b: P[i + 1], z: (P[i][2] + P[i + 1][2]) / 2, w: q[1], col: q[2] }); });
          var draw = function (back) { c.lineCap = "round"; segs.forEach(function (s) { if ((s.z > 0.01) !== back) return; c.globalAlpha = back ? 0.3 : 1; c.strokeStyle = s.col; c.lineWidth = s.w; c.beginPath(); c.moveTo(s.a[0], s.a[1]); c.lineTo(s.b[0], s.b[1]); c.stroke(); }); c.globalAlpha = 1; };
          draw(true); c.fillStyle = "#ffd23d"; c.beginPath(); c.arc(cx, cy, 5, 0, 2 * Math.PI); c.fill(); draw(false);
          var m = proj([o.rings[0] * Math.cos(-Math.PI / 4), o.rings[0] * Math.sin(-Math.PI / 4), 0], ry, rx); if (m[2] <= 0.01) { c.fillStyle = "#fff"; c.beginPath(); c.arc(m[0], m[1], 4, 0, 2 * Math.PI); c.fill(); }
        });
      };
  MW.shapeGyroscope = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
</script>
