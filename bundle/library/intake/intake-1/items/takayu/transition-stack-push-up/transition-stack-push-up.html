  Source: motion-reference.takayustudio.jp/#motion=page-transition-stack (read 12/10/2026).
  Trang mới trượt từ dưới lên phủ trang cũ, trang cũ lùi lại thu nhỏ 0.94, nhích lên 10 px và tối đi; quay lại thì chạy ngược đúng như vậy.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.transitionStackPushUp(q(".sp2"), tl, 0.5, { backAt: 1.6 });

  Options (defaults in brackets):
      - duration: s (0.72), in-out
      - scale: the old page shrinks to (0.94)
      - rise: px it rises (50)
      - dim: it darkens to (0.45)
      - radius: px of the new page's top corners (50)
      - backAt: s after the start for the exact reverse (null: stay)
      - from: the outgoing page

  Notes: Idea and numbers (TakayuStudio page-transition-stack, written here): Incoming scene slides up from y = 100 % to 0 with rounded top corners (10 px); the outgoing scene stays under it, scales 1 → 0.94 about its centre, rises 10 px and darkens 0 → 45 % (overlay). 720 ms power2.inOut (easeInOutCubic). Back: the exact reverse. Params: duration (0.72 s) · scale (0.94) · rise (10 px) · dim (45 %) · radius (10 px) · ease (power2.inOut).
-->

<script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.drive = MW.drive || function (tl, at, dur, fn) {
    var s = { t: 0 }; fn(0);
    tl.fromTo(s, { t: 0 }, { t: dur, duration: dur, ease: "none", immediateRender: false, onUpdate: function () { fn(s.t); } }, at);
    return at + dur;
  };
  var defaults = {"duration":0.72,"scale":0.94,"rise":50,"dim":0.45,"radius":50,"backAt":null,"from":null};
  var run = function (el, tl, at, o) {
        var out = o.from ? MW.el(o.from) : el.previousElementSibling, io = gsap.parseEase("power2.inOut"), dim = document.createElement("div");
        dim.style.cssText = "position:absolute;inset:0;background:#000;pointer-events:none;opacity:0;"; if (out) out.appendChild(dim);
        el.style.borderRadius = o.radius + "px " + o.radius + "px 0 0";
        return MW.drive(tl, at, o.backAt == null ? o.duration : o.backAt + o.duration, function (t) {
          var p = io(Math.max(0, Math.min(1, t / o.duration))); if (o.backAt != null) p *= 1 - io(Math.max(0, Math.min(1, (t - o.backAt) / o.duration)));
          gsap.set(el, { yPercent: 100 * (1 - p) }); el.style.visibility = p > 0 ? "visible" : "hidden";
          if (out) { gsap.set(out, { scale: 1 - (1 - o.scale) * p, y: -o.rise * p }); dim.style.opacity = String(o.dim * p); }
        });
      };
  MW.transitionStackPushUp = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
</script>
