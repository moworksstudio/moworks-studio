<!--
  Shape-morph Bridge (TakayuStudio (motion-reference), No licence stated: idea and numbers only, written from the idea (site read 12/10/2026)).
  Source: motion-reference.takayustudio.jp/#motion=tr-morph (read 12/10/2026).
  Một hình của cảnh cũ biến dần thành hình của cảnh mới và trượt sang chỗ mới, cảnh đổi giữa chừng dưới một lớp màu.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.transitionShapeMorphBridge(q(".tk-b"), tl, 1.1, { duration: 0.9 });

  Options (defaults in brackets):
      - duration: s (0.7)
      - fromShape: the outgoing scene's shape (its .tk-mark)
      - toShape: the incoming scene's shape
      - color: the morphing shape's colour
      - veil: the veil's colour (it peaks half-way, the scenes swap behind it)
      - from: the outgoing scene

  Notes: Idea and numbers (TakayuStudio tr-morph, written here): q = easeInOutCubic over 700 ms: a shape from scene A (circle r 46, left) morphs point by point into scene B's shape (square r 46, right) with equal point counts (64), travelling across; a full-frame colour veil peaks mid-way (opacity sin(pi q)) and the scenes swap behind it at q = 0.5. Params: shapeA / shapeB · duration (0.7 s) · ease (power2.inOut).
-->

<section class="tk-scene tk-a"><div class="tk-mark circle"></div><div class="tk-sc-text"><div class="tk-sc-letter">A</div><div class="tk-sc-cap">Cảnh mở đầu</div></div></section>
<section class="tk-scene tk-b"><div class="tk-mark square"></div><div class="tk-sc-text"><div class="tk-sc-letter">B</div><div class="tk-sc-cap">Cảnh tiếp theo</div></div></section>

<style>

</style>

<script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.drive = MW.drive || function (tl, at, dur, fn) {
    var s = { t: 0 }; fn(0);
    tl.fromTo(s, { t: 0 }, { t: dur, duration: dur, ease: "none", immediateRender: false, onUpdate: function () { fn(s.t); } }, at);
    return at + dur;
  };
  var defaults = {"duration":0.7,"fromShape":null,"toShape":null,"color":"#e8ebf3","veil":"#2a2350","from":null};
  var run = function (el, tl, at, o) {
        var out = o.from ? MW.el(o.from) : el.previousElementSibling, ease = gsap.parseEase("power2.inOut"), N = 64, root = el.parentNode;
        var box = root.getBoundingClientRect(), A = (o.fromShape ? MW.el(o.fromShape) : out.querySelector(".tk-mark")).getBoundingClientRect();
        var vis = el.style.visibility; el.style.visibility = "hidden"; var B = (o.toShape ? MW.el(o.toShape) : el.querySelector(".tk-mark")).getBoundingClientRect(); el.style.visibility = vis;
        var veil = document.createElement("div"); veil.style.cssText = "position:absolute;inset:0;pointer-events:none;z-index:6;background:" + o.veil + ";opacity:0;"; root.appendChild(veil);
        var shp = document.createElement("div"); shp.style.cssText = "position:absolute;inset:0;pointer-events:none;z-index:7;background:" + o.color + ";visibility:hidden;"; root.appendChild(shp);
        var cA = [A.left - box.left + A.width / 2, A.top - box.top + A.height / 2, A.width / 2], cB = [B.left - box.left + B.width / 2, B.top - box.top + B.height / 2, B.width / 2];
        var circ = [], sq = [];
        for (var i = 0; i < N; i++) {
          var a = (i / N) * 2 * Math.PI - Math.PI / 4; circ.push([Math.cos(a), Math.sin(a)]);
          // the same angle on the square's outline (a square of half-size 1 with corners cut round a little)
          var m = Math.max(Math.abs(Math.cos(a)), Math.abs(Math.sin(a))); sq.push([Math.cos(a) / m, Math.sin(a) / m]);
        }
        return MW.drive(tl, at, o.duration, function (t) {
          var u = t / o.duration, q = ease(u), cx = cA[0] + (cB[0] - cA[0]) * q, cy = cA[1] + (cB[1] - cA[1]) * q, r = cA[2] + (cB[2] - cA[2]) * q;
          shp.style.clipPath = "polygon(" + circ.map(function (c, i) { var x = c[0] + (sq[i][0] - c[0]) * q, y = c[1] + (sq[i][1] - c[1]) * q; return (cx + x * r) + "px " + (cy + y * r) + "px"; }).join(",") + ")";
          shp.style.visibility = u > 0 && u < 1 ? "visible" : "hidden"; veil.style.opacity = u > 0 && u < 1 ? String(Math.sin(Math.PI * q)) : "0";
          el.style.visibility = q >= 0.5 ? "visible" : "hidden"; if (out) out.style.visibility = q >= 0.5 ? "hidden" : "visible";
        });
      };
  MW.transitionShapeMorphBridge = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
</script>
