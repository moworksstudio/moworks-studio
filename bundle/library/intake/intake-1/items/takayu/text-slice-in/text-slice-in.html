  Sliced Bars Title (TakayuStudio (motion-reference), No licence stated: idea and numbers only, written from the idea (site read 12/10/2026)).
  Source: motion-reference.takayustudio.jp/#motion=tx-split-bars-title (read 12/10/2026).
  Tiêu đề bị cắt thành sáu dải ngang, các dải lần lượt trượt vào xen kẽ từ trái và phải, mỗi dải có vạch màu chạy trước, giật nhẹ một nhịp rồi bay xuyên ra phía bên kia.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.textSliceIn(q(".tk-head"), tl, 0, {});

  Options (defaults in brackets):
      - slices: strips (6)
      - distance: px each slides in from (2300, ≈120 % of the frame)
      - start: s (0.32; 0.06 s apart, 0.7 s expo.out)
      - jolt: px (25) at 1.6-1.9 s
      - bar: px of the accent bar (10)
      - barWidth: px (1600)
      - color: bar colour
      - exitAt: s (2.55): on through to the other side

  Notes: Idea and numbers (TakayuStudio tx-split-bars-title, written here): 6 copies of the title, each clipped to one horizontal strip (1/6 of text height + 4 px). Strip k (top first) slides in from the left for even k, right for odd: x ±380 px (≈120 % of a 320 px frame) → 0, 0.7 s expo.out from 0.32 + 0.06 k s. A 300 × 2 px accent bar at its top runs ahead 0.1 s earlier (0.6 s expo.out), fading 0.7–1.0 s (+0.06 k). At 1.6–1.9 s strips jolt ±5 px and back. Exit 2.55 + 0.04 k s, 0.4 s expo.in, on through to the other side. Loop 3.4 s. Params: số dải (6) · quãng trượt (≈ 120 % khung) · thời gian (0.7 s) · cách nhau (0.06 s).
-->

<div class="tk-stage"><div><h1 class="tk-head ">BẢN TIN TỐI</h1></div></div>

<style>

</style>

<script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.drive = MW.drive || function (tl, at, dur, fn) {
    var s = { t: 0 }; fn(0);
    tl.fromTo(s, { t: 0 }, { t: dur, duration: dur, ease: "none", immediateRender: false, onUpdate: function () { fn(s.t); } }, at);
    return at + dur;
  };
  var defaults = {"slices":6,"distance":2300,"start":0.32,"jolt":25,"bar":10,"barWidth":1600,"color":"#8b7bff","exitAt":2.55};
  var run = function (el, tl, at, o) {
        var html = el.innerHTML, n = o.slices, strips = [], bars = [], ex = gsap.parseEase("expo.out"), ei = gsap.parseEase("expo.in");
        el.innerHTML = ""; el.style.position = "relative";
        var base = document.createElement("span"); base.innerHTML = html; base.style.visibility = "hidden"; base.style.display = "block"; el.appendChild(base);
        for (var i = 0; i < n; i++) { var s = document.createElement("span"); s.innerHTML = html; s.style.cssText = "display:block;position:absolute;left:0;top:0;width:100%;"; el.appendChild(s); strips.push(s);
          var b = document.createElement("span"); b.style.cssText = "position:absolute;left:50%;height:" + o.bar + "px;width:" + o.barWidth + "px;margin-left:-" + o.barWidth / 2 + "px;background:" + o.color + ";pointer-events:none;"; el.appendChild(b); bars.push(b); }
        return MW.drive(tl, at, o.exitAt + 0.04 * n + 0.4, function (t) {
          var Hh = el.offsetHeight, fs = parseFloat(getComputedStyle(el).fontSize), top = -0.25 * fs, sh = (Hh - top + 0.1 * fs) / n;
          strips.forEach(function (s, k) {
            var dir = k % 2 ? 1 : -1, y0 = top + k * sh, u = Math.max(0, Math.min(1, (t - o.start - 0.06 * k) / 0.7)), ue = Math.max(0, Math.min(1, (t - o.exitAt - 0.04 * k) / 0.4));
            var jolt = t > 1.6 && t < 1.9 ? Math.sin(Math.PI * (t - 1.6) / 0.3) * o.jolt * dir : 0, x = dir * o.distance * (1 - ex(u)) - dir * o.distance * ei(ue) + jolt;
            s.style.clipPath = "inset(" + y0 + "px -40px " + Math.max(0, Hh - y0 - sh - 4) + "px -40px)"; gsap.set(s, { x: x }); s.style.visibility = u > 0 ? "visible" : "hidden";
            var bu = Math.max(0, Math.min(1, (t - o.start - 0.06 * k + 0.1) / 0.6)); bars[k].style.top = y0 + "px"; gsap.set(bars[k], { x: dir * o.distance * (1 - ex(bu)) });
            bars[k].style.opacity = bu > 0 ? String(1 - Math.max(0, Math.min(1, (t - 0.7 - 0.06 * k) / 0.3))) : "0";
          });
        });
      };
  MW.textSliceIn = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
</script>
