  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.textStrikeCorrect(q(".sc-l"), tl, 0.4, {});

  Options (defaults in brackets):
      - old: the wrong word
      - new: the correction (shown above it)
      - dim: old word's opacity (0.4)
      - color: pen colour
      - resetAt: s after the start (2.5)

  Notes: Idea and numbers (TakayuStudio tx-strike-correct, written here): Old word: accent strike line (0.07 em, through the x-height, 3 px past each end) grows left → right, 0.3 s power2.inOut (demo cubic-bezier(.65,0,.35,1)); old word dims to 0.4 over 0.2 s. 0.2 s later the new word (accent, ~0.8× size, above the old, tilted −2°) pops scale 0.6 → 1, 0.5 s back.out(2), fading in over 0.2 s, with a small ∧ insert mark. Demo: strike 0.4–0.7 s, dim 0.7–0.9, pop 0.9–1.4 s; reset 2.9–3.2 s; loop 3.4 s. Params: to: từ mới · strike (0.3 s) · dim: độ mờ từ cũ (0.4) · pop: bật từ mới (0.5 s, back.out(2)).

<script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.bezier = MW.bezier || function (x1, y1, x2, y2) {
    var cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx, cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
    var X = function (t) { return ((ax * t + bx) * t + cx) * t; }, Y = function (t) { return ((ay * t + by) * t + cy) * t; }, dX = function (t) { return (3 * ax * t + 2 * bx) * t + cx; };
    return function (p) {
      if (p <= 0) return 0; if (p >= 1) return 1;
      var t = p, i, d;
      for (i = 0; i < 8; i++) { d = X(t) - p; if (Math.abs(d) < 1e-6) return Y(t); var s = dX(t); if (Math.abs(s) < 1e-6) break; t -= d / s; }
      var lo = 0, hi = 1; t = p;
      for (i = 0; i < 40; i++) { d = X(t); if (Math.abs(d - p) < 1e-6) break; if (d < p) lo = t; else hi = t; t = (lo + hi) / 2; }
      return Y(t);
    };
  };
  MW.CSS_EASE = { ease: [0.25, 0.1, 0.25, 1], easeIn: [0.42, 0, 1, 1], easeOut: [0, 0, 0.58, 1], easeInOut: [0.42, 0, 0.58, 1] };
  MW.EASES = MW.EASES || { "css-ease": [0.25, 0.1, 0.25, 1], "css-in": [0.42, 0, 1, 1], "css-out": [0, 0, 0.58, 1], "css-in-out": [0.42, 0, 0.58, 1],
    md3: [0.2, 0, 0, 1], "md3-emph": [0.05, 0.7, 0.1, 1], "md3-acc": [0.3, 0, 1, 1], "md3-dec": [0, 0, 0, 1], whip: [0.9, 0, 0.1, 1], glide: [0.4, 0, 0.2, 1],
    house: [0.83, 0, 0.17, 1], "in-out": [0.65, 0, 0.35, 1] };
  MW.ez = MW.ez || function (name) {
    if (typeof name === "function") return name;
    var b = MW.EASES[name]; if (b) return MW.bezier(b[0], b[1], b[2], b[3]);
    var m = /^cubic-bezier\(([^)]+)\)$/.exec(name || ""); if (m) { var v = m[1].split(",").map(Number); return MW.bezier(v[0], v[1], v[2], v[3]); }
    return gsap.parseEase(name || "none");
  };
  MW.drive = MW.drive || function (tl, at, dur, fn) {
    var s = { t: 0 }; fn(0);
    tl.fromTo(s, { t: 0 }, { t: dur, duration: dur, ease: "none", immediateRender: false, onUpdate: function () { fn(s.t); } }, at);
    return at + dur;
  };
  var defaults = {"old":".sc-old","new":".sc-new","dim":0.4,"color":"#ff5d6c","resetAt":2.5};
  var run = function (el, tl, at, o) {
        var old = el.querySelector(o.old), neu = el.querySelector(o["new"]), io = MW.ez("in-out"), bk = gsap.parseEase("back.out(2)"), line = document.createElement("span"), mark = document.createElement("span");
        old.style.position = "relative"; line.style.cssText = "position:absolute;left:-0.06em;right:-0.06em;top:52%;height:0.07em;background:" + o.color + ";transform-origin:0 50%;transform:scaleX(0);"; old.appendChild(line);
        mark.textContent = "^"; mark.style.cssText = "position:absolute;left:50%;bottom:-0.1em;transform:translateX(-50%);color:" + o.color + ";font-size:0.6em;"; old.appendChild(mark);
        return MW.drive(tl, at, o.resetAt + 0.3, function (t) {
          var rs = 1 - Math.max(0, Math.min(1, (t - o.resetAt) / 0.3)), s = io(Math.max(0, Math.min(1, t / 0.3))), dim = Math.max(0, Math.min(1, (t - 0.3) / 0.2)), p = Math.max(0, Math.min(1, (t - 0.5) / 0.5));
          line.style.transform = "scaleX(" + s * rs + ")"; old.style.opacity = String(1 - (1 - o.dim) * dim * rs);
          gsap.set(neu, { scale: (0.6 + 0.4 * bk(p)), rotation: -2 }); neu.style.opacity = String(Math.min(1, p / 0.4) * rs); mark.style.opacity = String(Math.min(1, p / 0.4) * rs);
        });
      };
  MW.textStrikeCorrect = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
