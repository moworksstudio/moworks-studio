  Một khung viền màu nhấn kéo từ góc trên trái ra ôm lấy cụm từ trong 1 giây, con trỏ chuột bám theo góc dưới phải.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.textPointerBox(q(".pb-w"), tl, 0.05, { cursor: ".ui-cursor" });

  Options (defaults in brackets):
      - duration: s (1), in-out, from the top-left corner
      - padX: em (0.3)
      - padY: em (0.06)
      - border: px (5)
      - color: colour
      - cursor: the pointer riding the corner
      - fadeAt: s (2.3)

  Notes: Idea and numbers (TakayuStudio tx-pointer-highlight-box, written here): Box round the phrase: 1.5 px accent border, radius 3 px, 10 % accent fill, padding 0.3 em left/right, ~0.06 em top/bottom; width and height 0 → 100 % together from a fixed top-left corner, 1 s ease-in-out (CSS (.42,0,.58,1); demo (.65,0,.35,1)), demo from 0.45 s. A pointer arrow (~0.5 em, accent, dark outline) flies in from off-frame bottom-right (0.05–0.45 s, easeOutCubic), then rides the bottom-right corner. Exit fade 2.7–3.0 s; loop 3.2 s. Params: duration (1 s) · padding (0.3 em) · border (1.5 px) · fill: nền mờ (10 %) · pointer: con trỏ ở góc (bật).
-->
