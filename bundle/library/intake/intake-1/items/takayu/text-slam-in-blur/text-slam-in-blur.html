  Tiêu đề to gấp ba lao vào và nhỏ lại với tốc độ tăng dần, nhoè khi lao, chạm vào thì loé sáng một khung, bung tia và rung khung vài nhịp.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.textSlamInBlur(q(".tk-head"), tl, 0, {});

  Options (defaults in brackets):
      - start: s (0.35); the slam takes 0.2 s, cubic-bezier(.7,0,1,1)
      - blur: px while flying (20)
      - shake: px of the 4-frame shake at 24 fps (24)
      - color: ghosts and dashes
      - stage: what shakes (the title's parent)
      - exitAt: s (2.2)
      - seed: shake pattern

  Notes: Idea and numbers (TakayuStudio tx-slam-in-title, written here): From 0.35 s: scale 3 → 1 in 0.2 s cubic-bezier(.7,0,1,1), opacity in the first 0.05 s, blur → 0 (6 px in the 320 px demo; recipe 20 px); 3 blurred accent ghosts trail on the same curve (lag 0.14, opacity 0.3 / 0.2 / 0.1). Impact: one 24 fps frame of 20 % light flash; 14 accent dashes burst around the title over 0.4 s; the stage shakes seeded ±8 px × (1 − k/4) for 4 frames at 24 fps. Exit 2.2–2.5 s. Loop 2.6 s. Params: tỉ lệ (300 % → 100 %) · thời gian (0.2 s) · rung (±8 px, 4 khung) · nhoè (20 px).
-->
