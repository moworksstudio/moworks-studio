  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.effectScanLine(q(".sl-c"), tl, 0, {});

  Options (defaults in brackets):
      - pass: s per pass, linear (1.1)
      - passes: (3)
      - line: px (8)
      - glow: px (48)
      - tail: px (120)
      - color: line colour

  Notes: Idea and numbers (TakayuStudio scan-line, written here): Inside a card: a 2 px accent line with a 12 px glow sweeps y −10 % → 110 % of the card height, linear, 1100 ms per pass, looping; a 30 px tail above it fades from 28 % to 0 opacity; clipped to the card (6 px bleed). Corner brackets stay still. Params: pass: một lượt (1.1 s) · line (2 px) · glow (12 px) · tail (30 px) · color.
-->

<script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.drive = MW.drive || function (tl, at, dur, fn) {
    var s = { t: 0 }; fn(0);
    tl.fromTo(s, { t: 0 }, { t: dur, duration: dur, ease: "none", immediateRender: false, onUpdate: function () { fn(s.t); } }, at);
    return at + dur;
  };
  var defaults = {"pass":1.1,"passes":3,"line":8,"glow":48,"tail":120,"color":"#8b7bff"};
  var run = function (el, tl, at, o) {
        var line = document.createElement("div"), tail = document.createElement("div");
        if (getComputedStyle(el).position === "static") el.style.position = "relative"; el.style.overflow = "hidden";
        tail.style.cssText = "position:absolute;left:-6px;right:-6px;height:" + o.tail + "px;pointer-events:none;background:linear-gradient(180deg, rgba(139,123,255,0), rgba(139,123,255,0.28));";
        line.style.cssText = "position:absolute;left:-6px;right:-6px;height:" + o.line + "px;pointer-events:none;background:" + o.color + ";box-shadow:0 0 " + o.glow + "px " + o.color + ";";
        el.appendChild(tail); el.appendChild(line);
        return MW.drive(tl, at, o.pass * o.passes, function (t) { var u = (t / o.pass) % 1, y = (-0.1 + 1.2 * u) * el.offsetHeight; line.style.top = y + "px"; tail.style.top = (y - o.tail) + "px"; });
      };
  MW.effectScanLine = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
</script>
