  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.uiTapRipple(q(".tr"), tl, 0, {});

  Options (defaults in brackets):
      - taps: [[s, x share, y share], ...]
      - grow: s to the farthest corner (0.55, power2.out)
      - opacity: (0.38)
      - fade: [from, to] s after the tap ([0.2, 0.75])
      - ink: ripple colour
      - dot: px radius of the touch mark (30)
      - cursor: an optional cursor that makes the clicks
      - approach: [x, y] px the cursor comes from
      - lead: s it arrives before a click

  Notes: Idea and numbers (TakayuStudio catalog-ui-button-tap-ripple, written here): Accent button 160x52, radius 14. Each tap: a light ink circle (#e8ebf3) at the tap point, radius 0 → distance of the farthest corner in 550 ms power2.out, opacity 38 % fading to 0 from 200 to 750 ms after the tap, clipped to the button. Two taps 1.1 s apart at different points (0.55 s left-low, 1.65 s right-high); a small touch dot (r3 + ring r6) marks each tap for 0.35 s. Params: taps [[giây, x, y]] · grow (0.55 s, power2.out) · opacity (0.38) · fade (0.2 → 0.75 s).
