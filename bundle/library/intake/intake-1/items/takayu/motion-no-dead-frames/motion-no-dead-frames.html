  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.motionNoDeadFrames(q(".nd"), tl, 0, {});

  Options (defaults in brackets):
      - title: the held text
      - breathe: ± scale (0.015)
      - period: s (2)
      - dots: (18)
      - drift: [min, max] px a second up ([55, 110])
      - enter: s (0.6)
      - exit: s (0.6)
      - dotColor: 
      - seed: (9)
      - loop: s (4)

  Notes: Idea and numbers (TakayuStudio ambient-hold, written here): Hold demo (4000 ms loop): the title stays readable but breathes, scale 1 ± 1.5 % on a 2 s sine, while 18 faint dots drift upward at 11–22 px/s (wrapping). Recipe: enter 0–600 ms, hold 600–3400 ms with the background on a 4 s sine, exit 3400–4000 ms; no fully static frame, rest 40–60 % of the film. Params: breathe (±1.5 %, 2 s) · drift (11–22 px/s) · hold (2.8 s). Rule: no fully still frame; holds take 40–60 % of the film.

<script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.rand = MW.rand || function (seed) {
    var a = typeof seed === "string" ? MW.hash(seed) : (seed >>> 0) || 1;
    return function () { a = (a + 0x6d2b79f5) >>> 0; var t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  };
  MW.hash = MW.hash || function (s) { var h = 2166136261; s = String(s); for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; };
  MW.drive = MW.drive || function (tl, at, dur, fn) {
    var s = { t: 0 }; fn(0);
    tl.fromTo(s, { t: 0 }, { t: dur, duration: dur, ease: "none", immediateRender: false, onUpdate: function () { fn(s.t); } }, at);
    return at + dur;
  };
  var defaults = {"title":".nd-t","breathe":0.015,"period":2,"dots":18,"drift":[55,110],"enter":0.6,"exit":0.6,"dotColor":"rgba(169,155,255,0.22)","seed":9,"loop":4};
  var run = function (el, tl, at, o) {
        var ti = el.querySelector(o.title), r = MW.rand(o.seed), W = el.clientWidth, Hh = el.clientHeight, dots = [], p2 = gsap.parseEase("power2.out"), pin = gsap.parseEase("power2.in");
        for (var i = 0; i < o.dots; i++) { var d = document.createElement("div"), z = 8 + r() * 10; d.style.cssText = "position:absolute;left:0;top:0;border-radius:50%;width:" + z + "px;height:" + z + "px;background:" + o.dotColor + ";"; el.insertBefore(d, el.firstChild); dots.push({ d: d, x: r() * W, y: r() * Hh, v: o.drift[0] + r() * (o.drift[1] - o.drift[0]) }); }
        return MW.drive(tl, at, o.loop, function (t) {
          dots.forEach(function (q) { gsap.set(q.d, { x: q.x, y: ((q.y - q.v * t) % Hh + Hh) % Hh }); });
          var e = p2(Math.min(1, t / o.enter)), x = t > o.loop - o.exit ? 1 - pin(Math.min(1, (t - (o.loop - o.exit)) / o.exit)) : 1, b = 1 + o.breathe * Math.sin(2 * Math.PI * t / o.period);
          gsap.set(ti, { scale: b * (0.94 + 0.06 * e), y: 40 * (1 - e) }); ti.style.opacity = String(e * x);
        });
      };
  MW.motionNoDeadFrames = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
</script>
