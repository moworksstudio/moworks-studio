  Chữ như ống đèn neon tắt, từng ký tự chập chờn sáng tắt không đều trong khoảng 0.6 giây rồi sáng hẳn, hắt ánh lên tường.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.textNeonFlicker(q(".nf"), tl, 0, {});

  Options (defaults in brackets):
      - stagger: s between letters (0.08)
      - start: s (0.35)
      - accent: neon colour
      - core: lit core colour
      - bg: wall colour
      - offAt: s (3.0)
      - wall: a glow layer on the wall
      - wallGlow: (0.22) × the average level
      - seed: which flicker pattern each letter takes
      - loop: s (3.6)

  Notes: Idea and numbers (TakayuStudio tx-neon-flicker, written here): Unlit: fill accent 82 % toward the background with a 1.2 px stroke at 60 %. Lit: colour + glows 4 / 11 / 19 / 40 px (CSS text-shadow, whitish core #fff4fb; demo blurs 18 / 8 / 3 px). Each char starts 80 ms after the previous (from 0.35 s) and steps through one of 3 seeded level patterns, e.g. 1 → 0.15 → 1 → 0.35 → 1 at 0 / 160 / 240 / 520 / 600 ms, then stays lit (<3 flashes/s). Wall glow: radial accent 22 % × average level. Off 3.0–3.25 s; loop 3.6 s. Params: glow: ba lớp sáng (4 / 11 / 19 px, thêm 40 px) · stagger: giữa các ký tự (0.08 s) · flicker (0.5–0.66 s) · wall: hắt sáng tường (22 %). Under three flashes a second; each letter settles lit after about 0.6 s.
