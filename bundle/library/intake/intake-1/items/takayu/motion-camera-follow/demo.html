<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Follow with Lookahead - Demo</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
:root { --bg: #09090b; --fg: #fafafa; --card: #111114; --line: #27272a; }
* { box-sizing: border-box; }
html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); }
#demo { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); color: var(--fg); font-family: Inter, sans-serif; }
.center { position: absolute; inset: 0; display: grid; place-items: center; }
.row { display: flex; align-items: center; justify-content: center; gap: 48px; }
.col { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 32px; }
.h1 { font-size: 132px; font-weight: 800; letter-spacing: -0.035em; line-height: 1.1; text-align: center; }
.h2 { font-size: 84px; font-weight: 700; letter-spacing: -0.025em; line-height: 1.15; text-align: center; }
.p { font-size: 40px; line-height: 1.4; opacity: 0.72; text-align: center; }
.card { position: relative; border-radius: 28px; background: var(--card); border: 2px solid var(--line); overflow: hidden; }
.muted { opacity: 0.6; }

#demo { background: linear-gradient(180deg, #161c3a, #2a2350); overflow: hidden; }
.fw { position: absolute; inset: 0; } .fw > div { position: absolute; top: 0; bottom: 0; left: -1200px; right: -1200px; }
.fw .hills { background: radial-gradient(60% 40% at 30% 100%, #3b2f6b 60%, transparent 61%), radial-gradient(50% 35% at 75% 100%, #3b2f6b 60%, transparent 61%); }
.fw .ground { top: 720px; bottom: 0; background: #1a1838; border-top: 4px solid #3b3570; }
.fw .post { position: absolute; top: 640px; width: 14px; height: 80px; border-radius: 7px; background: #6c778b; }
.fw .ball { position: absolute; left: 50%; top: 520px; width: 200px; height: 200px; margin-left: -100px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #9af2ff, #2bb7e6 60%, #1278ad); }
.fw-cap { position: absolute; left: 0; right: 0; top: 860px; text-align: center; font-size: 34px; color: #6c778b; }
    </style>
  </head>
  <body>
    <div id="demo" data-composition-id="mw-demo" data-start="0" data-width="1920" data-height="1080" data-duration="4">
<div class="fw"><div class="hills" data-depth="0.4"></div><div class="world" data-depth="1"><div class="ground"></div><div class="post" style="left:0px"></div><div class="post" style="left:300px"></div><div class="post" style="left:600px"></div><div class="post" style="left:900px"></div><div class="post" style="left:1200px"></div><div class="post" style="left:1500px"></div><div class="post" style="left:1800px"></div><div class="post" style="left:2100px"></div><div class="post" style="left:2400px"></div><div class="post" style="left:2700px"></div><div class="post" style="left:3000px"></div><div class="post" style="left:3300px"></div><div class="post" style="left:3600px"></div><div class="post" style="left:3900px"></div><div class="post" style="left:4200px"></div><div class="post" style="left:4500px"></div><div class="ball"></div></div></div><div class="fw-cap">Máy quay bám theo, đi trước một chút theo hướng chạy</div>
      <script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.drive = MW.drive || function (tl, at, dur, fn) {
    var s = { t: 0 }; fn(0);
    tl.fromTo(s, { t: 0 }, { t: dur, duration: dur, ease: "none", immediateRender: false, onUpdate: function () { fn(s.t); } }, at);
    return at + dur;
  };
  var defaults = {"subject":".ball","swing":660,"period":3,"lookahead":0.47,"cap":138,"k":120,"c":20,"duration":4,"layers":"[data-depth]"};
  var run = function (el, tl, at, o) {
        var ball = el.querySelector(o.subject), Ls = Array.prototype.slice.call(el.querySelectorAll(o.layers)), dt = 1 / 240;
        var X = function (t) { return o.swing * Math.sin((2 * Math.PI * t) / o.period); }, V = function (t) { return o.swing * (2 * Math.PI / o.period) * Math.cos((2 * Math.PI * t) / o.period); };
        return MW.drive(tl, at, o.duration, function (t) {
          // the camera chases target = subject + velocity × lookahead (capped) on a spring, integrated from the start up to this frame
          var c = X(0), v = 0;
          for (var s = 0; s < t; s += dt) { var target = X(s) + Math.max(-o.cap, Math.min(o.cap, V(s) * o.lookahead)); var a = o.k * (target - c) - o.c * v; v += a * dt; c += v * dt; }
          gsap.set(ball, { x: X(t) });
          Ls.forEach(function (l) { var d = parseFloat(l.getAttribute("data-depth") || "1"); gsap.set(l, { x: -c * d }); });
        });
      };
  MW.motionCameraFollow = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
      </script>
      <script>
        (function () {
          var tl = gsap.timeline({ paused: true });
          var q = function (s) { return document.querySelector(s); }, qa = function (s) { return Array.prototype.slice.call(document.querySelectorAll(s)); };
          MW.motionCameraFollow(q(".fw"), tl, 0, {});
          tl.set({}, {}, 4);
          // register only when every motion is ready (MW.pending: e.g. a WebGL texture still decoding), as HyperFrames asks of async builds
          var go = function () { window.__timelines = window.__timelines || {}; window.__timelines["mw-demo"] = tl; };
          if (window.MW && MW.pending && MW.pending.length) Promise.all(MW.pending).then(go, go); else go();
        })();
      </script>
    </div>
  </body>
</html>
