  Ký tự gần con trỏ phình đậm và rộng ra, ký tự xa bị ép mảnh và hẹp lại, cả dòng vẫn giữ nguyên bề rộng như chịu áp lực.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.textTextPressure(q(".tk-head"), tl, 0, {});

  Options (defaults in brackets):
      - period: s a sweep left → right → left (4), a cosine
      - over: px past each end (70)
      - reach: [min px, share of the line] of the falloff ([350, 0.45])
      - weight: wght [far, near] ([100, 900])
      - squeeze: [base, gain] of each letter's width (0.55 + 1.05 f)
      - cursor: a pointer drawn on the path (optional)
      - loop: s (4)

  Notes: Idea and numbers (TakayuStudio tx-text-pressure, written here): A cursor sweeps left ↔ right across the line as a cosine every 4 s (amplitude half the line width + 14 px, small vertical bob). Per char f = smoothstep(1 − |dx| / md), md = max(70 px, 0.45 × line width) (horizontal distance); wght = 100 + 800f; width factor 0.55 + 1.05f (source wdth 5–200; RFlex 25–151); then all widths are rescaled so the line keeps its rest width (far letters condense); min font size 24 px. Loop 4 s. Params: path: đường đi con trỏ (trái ↔ phải, 4 s) · wght (100–900) · wdth (hẹp ↔ rộng) · falloff: tầm ảnh hưởng (0.45 bề rộng dòng). f = smoothstep(1 − |dx| / reach) per letter; widths are then rescaled so the line keeps its rest width (far letters condense), and wdth follows each letter's share.
