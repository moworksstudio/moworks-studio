  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.uiImeConversion(q(".im"), tl, 0, {});

  Options (defaults in brackets):
      - states: what the field shows after each key (Telex here; kana for Japanese)
      - converted: the segments after Space
      - per: s per key (0.09)
      - start: s (0.35)
      - text: 
      - window: the candidate window (its children are the rows)
      - caret: 
      - accent: 
      - exitAt: s (4.45)
      - loop: s (5)

  Notes: Idea and numbers (TakayuStudio tx-ime-conversion, written here): Field 280 px, text 26 px. From 0.35 s one kana per 90 ms (≤ 1.6 s) under a dotted 1 px underline. 0.3 s after the last, Space: text turns into the conversion; each segment flashes an accent block (text in background colour) 0.3 s, 80 ms apart; underlines solid 1 px, focused segment 2.5 px accent; a 3-candidate window (first row accent) fades in 0.1–0.25 s later. 1 s later Enter commits: underlines and window gone. Caret 2 px accent, 0.5 s blink. Exit 4.45–4.75 s. Params: nhịp gõ (90 ms / kana) · loé đổi chữ (0.3 s, lệch 80 ms) · chốt sau (1 s). Space turns the composition into segments that flash 0.3 s, 0.08 s apart, and opens three candidates; Enter, a second later, commits and clears the underlines.

  var defaults = {"states":["t","ti","tie","tiê","tiên","tiêng","tiếng","tiếng v","tiếng vi","tiếng vie","tiếng viê","tiếng viêt","tiếng việt"],"converted":["Tiếng","Việt"],"per":0.09,"start":0.35,"text":".im-t","window":".im-w","caret":".im-c","accent":"#8b7bff","exitAt":4.45,"loop":5};

        });
