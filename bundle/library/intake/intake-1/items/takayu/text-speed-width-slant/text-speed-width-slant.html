  Width/Slant Velocity (TakayuStudio (motion-reference), No licence stated: idea and numbers only, written from the idea (site read 12/10/2026)).
  Source: motion-reference.takayustudio.jp/#motion=tx-width-slant-scroll (read 12/10/2026).
  Khi khung chữ trượt nhanh, chữ giãn rộng và nghiêng về trước; khi dừng, chữ bật về hình gốc như lò xo.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.textSpeedWidthSlant(q(".tk-head"), tl, 0, {});

  Options (defaults in brackets):
      - distance: px the text travels (900)
      - start: s (0.3)
      - duration: s (1.5)
      - ease: (cubic-bezier(.3,0,.7,1))
      - stiffness: of the spring that smooths the speed (200)
      - damping: (16)
      - rest: wdth at rest (75)
      - fast: wdth at full speed (125)
      - slant: slnt at full speed (−12, clamped to the font's −10)
      - loop: s (3.2)

  Notes: Idea and numbers (TakayuStudio tx-width-slant-scroll, written here): v = speed of a scroll / pan move normalised to 0..1 (demo: 216 px over 0.3–1.8 s, ease (.3,0,.7,1); GSAP |velocity| / 2000), smoothed by a spring (demo k 200, c 16 ≈ 11 % overshoot; GSAP quickTo 0.8 s power3); wdth = 75 + 50v (condensed 75 at rest, 125 at full speed), slnt = −12v (RFlex clamps at −10), pivot on the baseline; when the move stops v springs back to 0. Loop 3.2 s. Params: wdth: hẹp khi nghỉ → rộng khi nhanh (75 → 125) · slnt (0 → −12) · spring: độ cứng / giảm chấn (200 / 16) · move: chuyển động dẫn. The speed is normalised to 0–1 and smoothed by a spring stepped on the film clock, so the letters widen and lean while the text moves fast and spring back when it stops.
-->

<script>
(function () {

  MW.txt = MW.txt || function (c, s, x, y, size, color, weight, align) { c.font = (weight || 700) + " " + size + "px Inter, sans-serif"; c.fillStyle = color || "#e8ebf3"; c.textAlign = align || "center"; c.textBaseline = "middle"; c.fillText(s, x, y); };

  MW.path = MW.path || function (keys, t, ease) {

  var run = function (el,tl,at,o
  ) {
  var mix = function (a, b, u) { u = Math.max(0, Math.min(1, u)); var out = []; for (var i = 0; i < 3; i++) { var x = parseInt(a.substr(1 + 2 * i, 2), 16), y = parseInt(b.substr(1 + 2 * i, 2), 16); out.push(Math.round(x + (y - x) * u)); } return "rgb(" + out.join(",") + ")"; };
  var fv = function (n, axes) { var s = []; for (var k in axes) s.push('"' + k + '" ' + (+axes[k]).toFixed(2)); n.style.fontVariationSettings = s.join(", "); }, pin = function (u) { return Math.max(0, Math.min(1, u)); };
  var e = MW.ez(o.ease), dt = 1 / 240, X = function (t) { return o.distance * e(pin((t - o.start) / o.duration)); }, vmax = 1e-6;

  };
  MW.textSpeedWidthSlant = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];

  };
