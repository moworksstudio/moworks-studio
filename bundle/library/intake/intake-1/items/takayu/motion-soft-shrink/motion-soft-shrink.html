<!--
  Soft Shrink (TakayuStudio (motion-reference), No licence stated: idea and numbers only, written from the idea (site read 12/10/2026)).
  Source: motion-reference.takayustudio.jp/#motion=soft-shrink (read 12/10/2026).
  Thẻ thu nhỏ về 20 % quanh tâm và mờ dần, các thẻ bên cạnh đứng yên.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.motionSoftShrink(q(".sk .x"), tl, 0.4, { returnAt: 1.5 });

  Options (defaults in brackets):
      - to: end scale (0.2)
      - duration: s (0.6)
      - ease: (power2.in)
      - returnAt: s after the start to come back from 0.9 (null)
      - slotColor: dashed outline of its slot

  Notes: Idea and numbers (TakayuStudio soft-shrink, written here): Card scales 1 → 0.2 about its centre and fades 1 → 0 in 600 ms power2.in (easeInCubic); neighbours stay put; a dashed outline of its slot fades in as it goes. Site return: 0.9 → 1 with fade-in, 400 ms power2.out. Params: duration (0.6 s) · scale cuối (0.2) · ease (power2.in).
-->

<div class="st"><div class="sk"><div></div><div class="x"></div><div></div></div></div>

<script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.drive = MW.drive || function (tl, at, dur, fn) {
    var s = { t: 0 }; fn(0);
    tl.fromTo(s, { t: 0 }, { t: dur, duration: dur, ease: "none", immediateRender: false, onUpdate: function () { fn(s.t); } }, at);
    return at + dur;
  };
  var defaults = {"to":0.2,"duration":0.6,"ease":"power2.in","returnAt":null,"slotColor":"#3a4466"};
  var run = function (el, tl, at, o) {
        var host = el.parentNode, pin = gsap.parseEase(o.ease), p2 = gsap.parseEase("power2.out"), slot = document.createElement("div");
        if (getComputedStyle(host).position === "static") host.style.position = "relative";
        slot.style.cssText = "position:absolute;pointer-events:none;box-sizing:border-box;opacity:0;border:4px dashed " + o.slotColor + ";border-radius:" + getComputedStyle(el).borderRadius + ";left:" + el.offsetLeft + "px;top:" + el.offsetTop + "px;width:" + el.offsetWidth + "px;height:" + el.offsetHeight + "px;"; host.insertBefore(slot, el);
        return MW.drive(tl, at, o.returnAt == null ? o.duration : o.returnAt + 0.4, function (t) {
          var p = pin(Math.min(1, t / o.duration)), s = 1 - (1 - o.to) * p, a = 1 - p, sl = p;
          if (o.returnAt != null && t > o.returnAt) { var r = p2(Math.min(1, (t - o.returnAt) / 0.4)); s = 0.9 + 0.1 * r; a = r; sl = 1 - r; }
          gsap.set(el, { scale: s }); el.style.opacity = String(a); slot.style.opacity = String(sl);
        });
      };
  MW.motionSoftShrink = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
</script>
