  Các thẻ chữ ngắn thay nhau bằng nhát cắt đúng phách, mỗi nhát cắt có ba khung chớp trắng tắt dần, chữ phóng rất chậm trong lúc đứng.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.textFlashFrameCut(q(".fc"), tl, 0, {});

  Options (defaults in brackets):
      - duration: s for all the cards (4.2)
      - cards: selector of the cards (shown one by one, hard cuts)

  Notes: Idea and numbers (TakayuStudio tx-flash-frame-cut, written here): Phrases as cards (demo 3, 42 px, last one accent), each on screen 4.2 s / n, hard cut between them (on the beat). Each card scales 1 → 1.05 linearly while shown. On every cut a full-frame white flash: 100 % / 55 % / 20 % on the first three 24 fps frames, then 0 (rule: ≤ 3 flashes per second). Loop 4.2 s. Params: số thẻ (3) · thời lượng thẻ (1.4 s) · chớp (100 / 55 / 20 % trong 3 khung).
-->

<div class="fc"><div class="ff">MỘT GIẤC MƠ</div><div class="ff">MỘT HÀNH TRÌNH</div><div class="ff acc">SẮP RA MẮT</div></div>

<script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.drive = MW.drive || function (tl, at, dur, fn) {
    var s = { t: 0 }; fn(0);
    tl.fromTo(s, { t: 0 }, { t: dur, duration: dur, ease: "none", immediateRender: false, onUpdate: function () { fn(s.t); } }, at);
    return at + dur;
  };
  var defaults = {"duration":4.2,"cards":".ff"};
  var run = function (el, tl, at, o) {
        var cards = Array.prototype.slice.call(el.querySelectorAll(o.cards)), flash = document.createElement("div"), n = cards.length, each = o.duration / n;
        flash.style.cssText = "position:absolute;inset:0;background:#fff;pointer-events:none;opacity:0;z-index:9;"; el.appendChild(flash);
        return MW.drive(tl, at, o.duration, function (t) {
          var i = Math.min(n - 1, Math.floor(t / each)), u = t - i * each, f = Math.floor(u * 24);
          cards.forEach(function (c, j) { c.style.visibility = j === i ? "visible" : "hidden"; if (j === i) gsap.set(c, { scale: 1 + 0.05 * (u / each) }); });
          flash.style.opacity = i > 0 || t > 0 ? String(f === 0 ? 1 : f === 1 ? 0.55 : f === 2 ? 0.2 : 0) : "0";
        });
      };
  MW.textFlashFrameCut = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
</script>
