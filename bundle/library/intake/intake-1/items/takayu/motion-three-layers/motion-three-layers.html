  Source: motion-reference.takayustudio.jp/#motion=layers3 (read 12/10/2026).
  Vai chính di chuyển rõ, vai phụ đáp lại nhỏ hơn và trễ, nền trôi chậm liên tục.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.motionThreeLayers(q(".tl"), tl, 0, {});

  Options (defaults in brackets):
      - hero: the main subject
      - second: the secondary one
      - heroMove: px (550)
      - heroTime: s (0.6, expo.out)
      - secMove: px (150, about 30 % of the hero)
      - secTime: s (0.55, power2.out)
      - delay: s behind the hero (0.15)
      - hold: s before both return (0.8)
      - start: s (0.3)
      - dots: background dots (14)
      - drift: [min, max] px a second ([40, 80])
      - dotColor: 
      - seed: (5)
      - loop: s (3.4)

  Notes: Idea and numbers (TakayuStudio layers3, written here): Hero square moves 110 px in 600 ms expo.out; a secondary dot answers 150 ms later, moving 30 px in 550 ms power2.out (recipe: +100 ms at 40 % of the hero); 14 small background dots drift right all the time at 8–16 px/s, wrapping (recipe: a constant 6 s cycle). Both return after an 800 ms hold. Rule: at most 2–3 things move at once. Params: hero (0.6 s) · secondary delay (0.15 s) · amount (40 %) · bg drift (8–16 px/s). Rule: at most two or three things move at once.
-->

<div class="tl"><div class="tl-h"></div><div class="tl-s"></div></div>

<script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.rand = MW.rand || function (seed) {
    var a = typeof seed === "string" ? MW.hash(seed) : (seed >>> 0) || 1;
    return function () { a = (a + 0x6d2b79f5) >>> 0; var t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  };
  MW.hash = MW.hash || function (s) { var h = 2166136261; s = String(s); for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; };
  MW.drive = MW.drive || function (tl, at, dur, fn) {
    var s = { t: 0 }; fn(0);
    tl.fromTo(s, { t: 0 }, { t: dur, duration: dur, ease: "none", immediateRender: false, onUpdate: function () { fn(s.t); } }, at);
    return at + dur;
  };
  var defaults = {"hero":".tl-h","second":".tl-s","heroMove":550,"heroTime":0.6,"secMove":150,"secTime":0.55,"delay":0.15,"hold":0.8,"start":0.3,"dots":14,"drift":[40,80],"dotColor":"rgba(233,235,243,0.16)","seed":5,"loop":3.4};
  var run = function (el, tl, at, o) {
        var hero = el.querySelector(o.hero), sec = el.querySelector(o.second), ex = gsap.parseEase("expo.out"), p2 = gsap.parseEase("power2.out"), io = gsap.parseEase("power2.inOut"), r = MW.rand(o.seed), W = el.clientWidth, Hh = el.clientHeight, dots = [];
        for (var i = 0; i < o.dots; i++) { var d = document.createElement("div"), z = 14 + r() * 12; d.style.cssText = "position:absolute;left:0;top:0;border-radius:50%;width:" + z + "px;height:" + z + "px;background:" + o.dotColor + ";"; el.insertBefore(d, el.firstChild); dots.push({ d: d, x: r() * W, y: r() * Hh, v: o.drift[0] + r() * (o.drift[1] - o.drift[0]) }); }
        var c = function (v) { return Math.max(0, Math.min(1, v)); }, back = o.start + o.heroTime + o.hold;
        return MW.drive(tl, at, o.loop, function (t) {
          dots.forEach(function (q) { gsap.set(q.d, { x: ((q.x + q.v * t) % W + W) % W, y: q.y }); });
          var hp = ex(c((t - o.start) / o.heroTime)) - io(c((t - back) / 0.6)), sp = p2(c((t - o.start - o.delay) / o.secTime)) - io(c((t - back - o.delay) / 0.6));
          gsap.set(hero, { x: o.heroMove * hp }); gsap.set(sec, { x: o.secMove * sp });
        });
      };
  MW.motionThreeLayers = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
</script>
