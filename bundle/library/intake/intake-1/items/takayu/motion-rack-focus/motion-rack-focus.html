<!--
  Rack Focus (TakayuStudio (motion-reference), No licence stated: idea and numbers only, written from the idea (site read 12/10/2026)).
  Source: motion-reference.takayustudio.jp/#motion=cam-rack (read 12/10/2026).
  Tiêu điểm chuyển từ lớp gần sang lớp xa: lớp này rõ dần thì lớp kia nhoè đi.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.motionRackFocus(q(".tk-cam"), tl, 0.6, { duration: 0.8, blur: 12 });

  Options (defaults in brackets):
      - duration: s (0.65; 12-20 frames)
      - blur: px of the soft layer (8; 2.6 on the site's frame)
      - toFar: false: focus comes to the near layers (default); true: it goes to the far ones
      - split: depth from which a layer is near (1)
      - layers: selector of the layers
      - ease: power2.inOut

  Notes: Idea and numbers (TakayuStudio cam-rack, written here): Two depth layers: near blur 2.6 px -> 0 while far 0 -> 2.6 px over 650 ms easeInOutCubic (12-20 frames). Demo: near 4 -> 0 / far 0 -> 4 px over 0.6-1.4 s, back over 2.0-2.8 s. Params: duration (0.65 s) · blur (2.6 px) · ease (power2.inOut).
-->

<script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.drive = MW.drive || function (tl, at, dur, fn) {
    var s = { t: 0 }; fn(0);
    tl.fromTo(s, { t: 0 }, { t: dur, duration: dur, ease: "none", immediateRender: false, onUpdate: function () { fn(s.t); } }, at);
    return at + dur;
  };
  var defaults = {"duration":0.65,"blur":8,"toFar":false,"split":1,"layers":"[data-depth]","ease":"power2.inOut"};
  var run = function (el, tl, at, o) {
        var Ls = Array.prototype.slice.call(el.querySelectorAll(o.layers)), ease = gsap.parseEase(o.ease);
        return MW.drive(tl, at, o.duration, function (t) {
          var p = ease(t / o.duration);
          Ls.forEach(function (l) {
            var near = parseFloat(l.getAttribute("data-depth") || "1") >= o.split, b = o.toFar ? (near ? o.blur * p : o.blur * (1 - p)) : (near ? o.blur * (1 - p) : o.blur * p);
            l.style.filter = b > 0.05 ? "blur(" + b + "px)" : "";
          });
        });
      };
  MW.motionRackFocus = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
</script>
