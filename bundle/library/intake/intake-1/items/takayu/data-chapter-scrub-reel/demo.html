    <script src="assets/vendor/gsap.min.js"></script>
    <style>

.center { position: absolute; inset: 0; display: grid; place-items: center; }
.row { display: flex; align-items: center; justify-content: center; gap: 48px; }

.h2 { font-size: 84px; font-weight: 700; letter-spacing: -0.025em; line-height: 1.15; text-align: center; }
.p { font-size: 40px; line-height: 1.4; opacity: 0.72; text-align: center; }
.card { position: relative; border-radius: 28px; background: var(--card); border: 2px solid var(--line); overflow: hidden; }
.muted { opacity: 0.6; }

.ui-cursor { position: absolute; left: 0; top: 0; z-index: 30; filter: drop-shadow(0 6px 10px rgba(0, 0, 0, 0.5)); }
.cs { position: absolute; left: 50%; top: 50%; width: 1200px; height: 700px; margin: -350px 0 0 -600px; border-radius: 50px; background: #151a28; border: 3px solid #2a3350; }
.cs-win { position: absolute; left: 50%; top: 110px; width: 480px; height: 320px; margin-left: -240px; border-radius: 40px; background: #0d1018; overflow: hidden; } .cs-reel div { height: 320px; display: grid; place-items: center; font-size: 220px; font-weight: 800; color: #a99bff; font-variant-numeric: tabular-nums; }
.cs-tr { position: absolute; left: 100px; right: 100px; top: 560px; height: 12px; border-radius: 6px; background: #222a42; } .cs-fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; border-radius: 6px; background: #8b7bff; }
.cs-tr i { position: absolute; top: -14px; width: 4px; height: 40px; background: #3a4466; } .cs-th { position: absolute; left: -35px; top: -29px; width: 70px; height: 70px; border-radius: 50%; background: #fff; }
.cs-lab { position: absolute; left: 0; right: 0; top: 40px; text-align: center; font-size: 40px; color: #9aa3b8; letter-spacing: 0.2em; font-weight: 700; }
    </style>
  </head>
  <body>
    <div id="demo" data-composition-id="mw-demo" data-start="0" data-width="1920" data-height="1080" data-duration="3.8">
<div class="gm"><div class="cs"><div class="cs-lab">CHƯƠNG</div><div class="cs-win"><div class="cs-reel"><div>01</div><div>02</div><div>03</div><div>04</div></div></div>
<div class="cs-tr"><div class="cs-fill"></div><i style="left:0"></i><i style="left:33.3%"></i><i style="left:66.6%"></i><i style="left:100%"></i><div class="cs-th"></div></div></div><svg class="ui-cursor" viewBox="0 0 32 32" width="64" height="64"><path d="M6 3 L6 25 L12 19.5 L16 28.5 L20 26.8 L16 18 L24 18 Z" fill="#fff" stroke="#111" stroke-width="1.6" stroke-linejoin="round"/></svg></div>
      <script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };

    var X = function (t) { return ((ax * t + bx) * t + cx) * t; }, Y = function (t) { return ((ay * t + by) * t + cy) * t; }, dX = function (t) { return (3 * ax * t + 2 * bx) * t + cx; };
    return function (p) {

      for (i = 0; i < 8; i++) { d = X(t) - p; if (Math.abs(d) < 1e-6) return Y(t); var s = dX(t); if (Math.abs(s) < 1e-6) break; t -= d / s; }

      for (i = 0; i < 40; i++) { d = X(t); if (Math.abs(d - p) < 1e-6) break; if (d < p) lo = t; else hi = t; t = (lo + hi) / 2; }
      return Y(t);

  };
  MW.CSS_EASE = { ease: [0.25, 0.1, 0.25, 1], easeIn: [0.42, 0, 1, 1], easeOut: [0, 0, 0.58, 1], easeInOut: [0.42, 0, 0.58, 1] };
  MW.EASES = MW.EASES || { "css-ease": [0.25, 0.1, 0.25, 1], "css-in": [0.42, 0, 1, 1], "css-out": [0, 0, 0.58, 1], "css-in-out": [0.42, 0, 0.58, 1],
    md3: [0.2, 0, 0, 1], "md3-emph": [0.05, 0.7, 0.1, 1], "md3-acc": [0.3, 0, 1, 1], "md3-dec": [0, 0, 0, 1], whip: [0.9, 0, 0.1, 1], glide: [0.4, 0, 0.2, 1],
    house: [0.83, 0, 0.17, 1], "in-out": [0.65, 0, 0.35, 1] };

    var m = /^cubic-bezier\(([^)]+)\)$/.exec(name || ""); if (m) { var v = m[1].split(",").map(Number); return MW.bezier(v[0], v[1], v[2], v[3]); }
    return gsap.parseEase(name || "none");

  MW.drive = MW.drive || function (tl, at, dur, fn) {

    return at + dur;
  };
  MW.rr = MW.rr || function (c, x, y, w, h, r) { r = Math.min(r, w / 2, h / 2); c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); };
  MW.txt = MW.txt || function (c, s, x, y, size, color, weight, align) { c.font = (weight || 700) + " " + size + "px Inter, sans-serif"; c.fillStyle = color || "#e8ebf3"; c.textAlign = align || "center"; c.textBaseline = "middle"; c.fillText(s, x, y); };
  MW.cursor = MW.cursor || function (c, x, y, s) { s = s || 1; c.save(); c.translate(x, y); c.scale(s, s); c.beginPath(); c.moveTo(0, 0); c.lineTo(0, 16); c.lineTo(4, 12.5); c.lineTo(6.5, 18); c.lineTo(9, 17); c.lineTo(6.5, 11.5); c.lineTo(11.5, 11.5); c.closePath(); c.fillStyle = "#fff"; c.fill(); c.lineWidth = 1; c.strokeStyle = "#111"; c.stroke(); c.restore(); };
  MW.path = MW.path || function (keys, t, ease) {
    var e = typeof ease === "function" ? ease : gsap.parseEase(ease || "power2.inOut");
    if (t <= keys[0][0]) return [keys[0][1], keys[0][2]];
    for (var i = 1; i < keys.length; i++) if (t <= keys[i][0]) { var a = keys[i - 1], b = keys[i], u = e((t - a[0]) / ((b[0] - a[0]) || 1)); return [a[1] + (b[1] - a[1]) * u, a[2] + (b[2] - a[2]) * u]; }
    var z = keys[keys.length - 1]; return [z[1], z[2]];
  };
  var defaults = {"reel":".cs-reel","thumb":".cs-th","fill":".cs-fill","cursor":null};
  var run = function (el, tl, at, o) {
        var reel = el.querySelector(o.reel), thumb = el.querySelector(o.thumb), fill = el.querySelector(o.fill), cur = o.cursor ? MW.el(o.cursor) : null, io = MW.ez("in-out");
        var K = [[0, 0, 0], [0.5, 0, 0], [1.1, 0.3, 0], [1.4, 0.38, 0], [2.3, 1, 0], [2.9, 1, 0], [3.6, 0, 0]];
        return MW.drive(tl, at, 3.8, function (t) {
          var p = MW.path(K, t, io)[0], n = reel.children.length, pitch = reel.firstElementChild.offsetHeight;
          gsap.set(reel, { y: -p * (n - 1) * pitch }); var W = thumb.parentNode.offsetWidth; gsap.set(thumb, { x: p * W, scale: t > 0.4 && t < 3.7 ? 1.15 : 1 }); fill.style.width = (p * 100) + "%";
          if (cur) { var r = thumb.getBoundingClientRect(), b = el.parentNode.getBoundingClientRect(); cur.style.left = (r.left - b.left + r.width / 2) + "px"; cur.style.top = (r.top - b.top + r.height / 2) + "px"; }
        });
      };
  MW.dataChapterScrubReel = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
      </script>
      <script>
        (function () {
          var tl = gsap.timeline({ paused: true });
          var q = function (s) { return document.querySelector(s); }, qa = function (s) { return Array.prototype.slice.call(document.querySelectorAll(s)); };
          MW.dataChapterScrubReel(q(".cs"), tl, 0, { cursor: ".ui-cursor" });
          tl.set({}, {}, 3.8);
          // register only when every motion is ready (MW.pending: e.g. a WebGL texture still decoding), as HyperFrames asks of async builds
          var go = function () { window.__timelines = window.__timelines || {}; window.__timelines["mw-demo"] = tl; };
          if (window.MW && MW.pending && MW.pending.length) Promise.all(MW.pending).then(go, go); else go();
        })();
      </script>
