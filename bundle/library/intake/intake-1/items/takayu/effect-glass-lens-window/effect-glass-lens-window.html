  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.effectGlassLensWindow(q(".gm"), tl, 0, {});

  Options (defaults in brackets):
      - zoom: (1.4)
      - ease: (power2.inOut)
      - title: the card's heading
      - accent: rim colour
      - loop: s (4.2)

  Notes: Idea and numbers (TakayuStudio catalog-ui-material-glass-refraction, written here): Rounded window 100x70 (radius 16) slides x 96 → 224 (0.4-1.8 s, power2.inOut) and back (2.6-3.8 s). Inside it the content is scaled 1.4× about the window centre, so lines break at the window edge; a 7 % light tint, a 22 % light diagonal streak (20 px wide band near the left edge), a 55 % light hairline 4 px under the top edge and a 1.5 px accent rim. The cursor rides on the window. Params: zoom (1.4×) · window (100x70, r16) · path [[giây, x]] · move (1.4 s, power2.inOut).
