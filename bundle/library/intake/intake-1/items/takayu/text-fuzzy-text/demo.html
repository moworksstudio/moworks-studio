<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Fuzzy Text - Demo</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
:root { --bg: #09090b; --fg: #fafafa; --card: #111114; --line: #27272a; }
* { box-sizing: border-box; }
html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); }
#demo { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); color: var(--fg); font-family: Inter, sans-serif; }
.center { position: absolute; inset: 0; display: grid; place-items: center; }
.row { display: flex; align-items: center; justify-content: center; gap: 48px; }
.col { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 32px; }
.h1 { font-size: 132px; font-weight: 800; letter-spacing: -0.035em; line-height: 1.1; text-align: center; }
.h2 { font-size: 84px; font-weight: 700; letter-spacing: -0.025em; line-height: 1.15; text-align: center; }
.p { font-size: 40px; line-height: 1.4; opacity: 0.72; text-align: center; }
.card { position: relative; border-radius: 28px; background: var(--card); border: 2px solid var(--line); overflow: hidden; }
.muted { opacity: 0.6; }

#demo { --ink: #e8ebf3; --acc: #8b7bff; --acc2: #3dd6f5; --warm: #ffb547; --rose: #ff5d8f; --mute: #6c778b; --tk-card: #151a24; --tk-line: #262c3a; background: #0b0d12; color: var(--ink); }
.tk-stage { position: absolute; inset: 0; display: grid; place-items: center; }
.tk-cap { font-size: 30px; font-weight: 500; color: var(--mute); letter-spacing: 0.01em; }
.tk-head { margin: 0; font-family: 'Inter', sans-serif; font-size: 380px; font-weight: 900; letter-spacing: -0.03em; line-height: 1.15; text-align: center; max-width: 1600px; }
.tk-sub { margin-top: 36px; text-align: center; }
    </style>
  </head>
  <body>
    <div id="demo" data-composition-id="mw-demo" data-start="0" data-width="1920" data-height="1080" data-duration="3.2">
<div class="tk-stage"><div><h1 class="tk-head ">404</h1><div class="tk-sub tk-cap">Không tìm thấy trang</div></div></div>
      <script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.rand = MW.rand || function (seed) {
    var a = typeof seed === "string" ? MW.hash(seed) : (seed >>> 0) || 1;
    return function () { a = (a + 0x6d2b79f5) >>> 0; var t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  };
  MW.hash = MW.hash || function (s) { var h = 2166136261; s = String(s); for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; };
  MW.drive = MW.drive || function (tl, at, dur, fn) {
    var s = { t: 0 }; fn(0);
    tl.fromTo(s, { t: 0 }, { t: dur, duration: dur, ease: "none", immediateRender: false, onUpdate: function () { fn(s.t); } }, at);
    return at + dur;
  };
  var defaults = {"range":120,"rest":0.18,"hover":0.5,"on":[0.75,1.05],"off":[1.95,2.3],"row":2,"seed":9,"loop":3.2};
  var run = function (el,tl,at,o
  ) {
  var host = el.parentNode; if (getComputedStyle(host).position === "static") host.style.position = "relative";
  var clone = function () { var g = el.cloneNode(true), br = el.getBoundingClientRect(); g.removeAttribute("id"); g.style.position = "absolute"; g.style.margin = "0"; g.style.pointerEvents = "none"; g.style.boxSizing = "border-box";
    g.style.left = el.offsetLeft + "px"; g.style.top = el.offsetTop + "px"; g.style.width = (br.width + 0.5) + "px"; g.style.height = el.offsetHeight + "px"; host.insertBefore(g, el.nextSibling); return g; };
  var raster = function (m) { var cs = getComputedStyle(el), W = el.offsetWidth + 2 * m, Hh = el.offsetHeight + 2 * m, cv = document.createElement("canvas"), off = document.createElement("canvas"); cv.width = off.width = W; cv.height = off.height = Hh;
    cv.style.cssText = "position:absolute;pointer-events:none;left:" + (el.offsetLeft - m) + "px;top:" + (el.offsetTop - m) + "px;width:" + W + "px;height:" + Hh + "px;"; host.insertBefore(cv, el.nextSibling);
    var g = off.getContext("2d"); g.font = cs.fontWeight + " " + cs.fontSize + " " + cs.fontFamily; g.fillStyle = cs.color; g.textAlign = "center"; g.textBaseline = "middle"; g.fillText(el.textContent, W / 2, Hh / 2 + parseFloat(cs.fontSize) * 0.04);
    el.style.visibility = "hidden"; return { cv: cv, c: cv.getContext("2d"), off: off, W: W, H: Hh, fs: parseFloat(cs.fontSize), font: g.font }; };
  var Rr = raster(o.range), c = Rr.c, p3 = gsap.parseEase("power3.out"), row = o.row;
  return MW.drive(tl, at, o.loop, function (t) {
    var f = Math.floor(t * 60), r = MW.rand(o.seed + f), k = o.rest + (o.hover - o.rest) * (p3(Math.max(0, Math.min(1, (t - o.on[0]) / (o.on[1] - o.on[0])))) - Math.max(0, Math.min(1, (t - o.off[0]) / (o.off[1] - o.off[0])))); c.clearRect(0, 0, Rr.W, Rr.H);
    for (var y = 0; y < Rr.H; y += row) { var dx = (r() - 0.5) * k * o.range; c.drawImage(Rr.off, 0, y, Rr.W, row, dx, y, Rr.W, row); }
  });
  };
  MW.textFuzzyText = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
      </script>
      <script>
        (function () {
          var tl = gsap.timeline({ paused: true });
          var q = function (s) { return document.querySelector(s); }, qa = function (s) { return Array.prototype.slice.call(document.querySelectorAll(s)); };
          MW.textFuzzyText(q(".tk-head"), tl, 0, {});
          tl.set({}, {}, 3.2);
          // register only when every motion is ready (MW.pending: e.g. a WebGL texture still decoding), as HyperFrames asks of async builds
          var go = function () { window.__timelines = window.__timelines || {}; window.__timelines["mw-demo"] = tl; };
          if (window.MW && MW.pending && MW.pending.length) Promise.all(MW.pending).then(go, go); else go();
        })();
      </script>
    </div>
  </body>
</html>
