  Một chữ rất lớn chỉ có nét viền tự vẽ ra, rồi một đốm sáng theo con trỏ tô màu cầu vồng phát sáng lên phần nét viền nằm trong đốm.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.textOutlineSpotlight(q(".os-t"), tl, 0, {});

  Options (defaults in brackets):
      - dash: user units of the drawing dash (1300)
      - draw: s [from, to] the outline draws ([0.2, 2.4])
      - width: [outline, spot] stroke widths ([5, 10])
      - radius: user units of the spot (300)
      - glow: user units of the glow (40)
      - colors: spot gradient [start, middle, end]
      - spotIn: s ([1.6, 2.0])
      - spotOut: s ([3.9, 4.3])
      - cross: s the pointer reaches the left edge, the right edge, and leaves ([2.0, 3.8, 4.3])
      - outAt: s (4.45)
      - ease: (cubic-bezier(.65,0,.35,1))
      - cursor: 
      - loop: s (5)

  Notes: Idea and numbers (TakayuStudio tx-spotlight-outline, written here): Word 78 px, outline only (1.1 px, mute), drawn on with a 260 px dash, offset 260 → 0, 0.2–2.4 s cubic-bezier(.65,0,.35,1) (recipe 1000 → 0 in 4 s). Spot: same outline at 2.2 px with a diagonal yellow → accent → blue gradient and a 14 px accent glow, seen through a radial mask r 62 px (≈19 % of width; 1 → 0.8 at 55 % → 0) on a scripted cursor (enters 2.0 s, crosses to 3.8 s, exits 4.3 s); spot in 1.6–2.0 s, out 3.9–4.3 s. Fade 4.45–4.9 s. Loop 5 s. Params: thời gian vẽ (2.2 s) · bán kính đốm (62 px) · nét viền (1.1 / 2.2 px). Apply to an SVG text drawn as an outline (fill none). A glowing gradient copy of the outline shows only inside a soft round mask that follows the pointer.
