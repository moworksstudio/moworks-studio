  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.uiSharedElementHero(q(".gm"), tl, 0, {});

  Options (defaults in brackets):
      - at: s (0.4)
      - duration: s (0.65), in-out
      - backAt: s it flies back (1.9)
      - loop: s (3.2)

  Notes: Idea and numbers (TakayuStudio shared-element, written here): Element 44x34 (accent) starts in the list slot (offset −88, +20 px from centre, scale 0.55, radius 12) and travels to the detail hero slot (offset +54, −17, scale 1.45, radius 5) by 76 % of an 850 ms pass (≈650 ms, eased in-out), then holds. Dashed start slot 42x32 lower left, end slot 72x55 upper right, arrow between. Params: from / to: khung đầu, khung cuối · duration (0.65 s) · radius (12 → 5 px) · ease (power2.inOut).
