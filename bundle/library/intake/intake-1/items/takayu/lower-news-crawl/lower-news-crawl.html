  Thanh tin tối dưới đáy khung có nhãn màu nhấn bên trái, dòng tin chạy ngang đều với số px nguyên mỗi khung để không giật, các bản tin ngăn bằng chấm màu.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.lowerNewsCrawl(q(".nc"), tl, 0, {});

  Options (defaults in brackets):
      - track: the moving row (its first child is one headline unit)
      - loop: s for one unit (4): the speed is a whole number of px per 60 fps frame
      - minPx: px a frame at least (8)
      - loops: (1)

  Notes: Idea and numbers (TakayuStudio tx-news-ticker, written here): Dark band 30 px tall at the bottom with a 2 px accent line on top; accent label block 58 px wide on the left (13 px weight 800 label). Headline 15 px bold crawls left at a whole number of px per 60 fps frame (2 px = 120 px/s; demo picks 2–6 px so the 4 s loop is seamless), position = floor(t × 60) × px, copies separated by an accent dot, clipped right of the label. Loop 4 s. Params: tốc độ (2 px / khung ở 60 fps = 120 px/s) · nhãn (58 px) · cỡ chữ (15 px). Position = floor(t × 60) × px, never fractional, so the crawl never judders; the unit is padded so the loop is seamless.

<script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.drive = MW.drive || function (tl, at, dur, fn) {
    var s = { t: 0 }; fn(0);
    tl.fromTo(s, { t: 0 }, { t: dur, duration: dur, ease: "none", immediateRender: false, onUpdate: function () { fn(s.t); } }, at);
    return at + dur;
  };
  var defaults = {"track":".nc-t","loop":4,"minPx":8,"loops":1};
  var run = function (el, tl, at, o) {
        var tr = el.querySelector(o.track), unit = tr.firstElementChild, fr = Math.round(o.loop * 60), w = unit.offsetWidth, px = Math.max(o.minPx, Math.ceil(w / fr)), W = px * fr;
        unit.style.paddingRight = (W - w + (parseFloat(getComputedStyle(unit).paddingRight) || 0)) + "px"; unit.style.boxSizing = "content-box"; var w2 = unit.offsetWidth, k = W / w2;
        for (var i = 0; i < 3; i++) tr.appendChild(unit.cloneNode(true));
        return MW.drive(tl, at, o.loop * o.loops, function (t) { var pos = (Math.floor(t * 60 + 1e-6) * px) % W; gsap.set(tr, { x: -pos / (k || 1) }); });
      };
  MW.lowerNewsCrawl = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
</script>
