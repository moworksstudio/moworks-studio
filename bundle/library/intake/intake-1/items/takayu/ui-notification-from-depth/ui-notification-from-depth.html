  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.uiNotificationFromDepth(q(".nt"), tl, 0, { behind: ".app" });

  Options (defaults in brackets):
      - depth: z it comes from (400; scale 360 / (360 + z))
      - at: s (0.4), spring k200 c15
      - exitAt: s (3.0; 0.3 s ease-in back into depth)
      - behind: the app window that dims and recedes
      - dim: (0.35)

  Notes: Idea and numbers (TakayuStudio catalog-ui-spatial-z-notification, written here): Notification pill 164x42 r10 (light, accent check circle) comes from z 400 → 0 on a spring k200 c15 (scale 360 / (360 + z): 0.47 → 1, overshooting to ≈ 1.08), opacity min(1, 1.6 × spring) from 0.4 s. The app window behind scales to 0.97 and dims 35 %. Hold to 3.0 s; exit: z 0 → 400 (scale back to 0.47) and fade over 3.0-3.3 s power2.in. Params: depth (400 px) · spring (k200 c15) · hold (1.6 s) · exit (0.3 s, power2.in) · dim (35 %).

<script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.spring = MW.spring || function (stiffness, damping, mass, from, to) {
    var k = stiffness || 100, c = damping == null ? 10 : damping, m = mass || 1, w0 = Math.sqrt(k / m), z = c / (2 * Math.sqrt(k * m));
    var x = function (t) {
      if (z < 1) { var wd = w0 * Math.sqrt(1 - z * z); return 1 - Math.exp(-z * w0 * t) * (Math.cos(wd * t) + (z * w0 / wd) * Math.sin(wd * t)); }
      if (z === 1) return 1 - Math.exp(-w0 * t) * (1 + w0 * t);
      var q = Math.sqrt(z * z - 1), r1 = -w0 * (z - q), r2 = -w0 * (z + q), A = r2 / (r2 - r1), B = -r1 / (r2 - r1);
      return 1 - (A * Math.exp(r1 * t) + B * Math.exp(r2 * t));
    };
    var T = 0, dt = 1 / 240; for (var t = 0; t < 30; t += dt) if (Math.abs(1 - x(t)) > 0.001) T = t;
    T = Math.max(dt, T + dt);
    return { duration: T, ease: function (p) { return p >= 1 ? 1 : x(p * T); }, at: x };
  };
  MW.springDB = MW.springDB || function (duration, bounce) {
    var z = 1 - (bounce == null ? 0.25 : bounce), w = Math.log(1000) / (Math.max(0.05, z) * (duration || 0.8));
    return MW.spring(w * w, 2 * z * w, 1);
  };
  MW.drive = MW.drive || function (tl, at, dur, fn) {
    var s = { t: 0 }; fn(0);
    tl.fromTo(s, { t: 0 }, { t: dur, duration: dur, ease: "none", immediateRender: false, onUpdate: function () { fn(s.t); } }, at);
    return at + dur;
  };
  var defaults = {"depth":400,"at":0.4,"exitAt":3,"behind":null,"dim":0.35};
  var run = function (el, tl, at, o) {
        var sp = MW.spring(200, 15), inn = gsap.parseEase("power2.in"), app = o.behind ? MW.el(o.behind) : null;
        return MW.drive(tl, at, o.exitAt + 0.3, function (t) {
          var x = t < o.at ? 0 : sp.at(t - o.at), z = o.depth * (1 - x);
          if (t > o.exitAt) z = o.depth * inn(Math.min(1, (t - o.exitAt) / 0.3));
          var s = 360 / (360 + z), a = t < o.at ? 0 : t > o.exitAt ? 1 - inn(Math.min(1, (t - o.exitAt) / 0.3)) : Math.min(1, 1.6 * x);
          gsap.set(el, { scale: s }); el.style.opacity = String(a);
          if (app) { var d = Math.min(1, Math.max(0, x)) * (t > o.exitAt ? 1 - Math.min(1, (t - o.exitAt) / 0.3) : 1); gsap.set(app, { scale: 1 - 0.03 * d }); app.style.filter = d > 0.01 ? "brightness(" + (1 - o.dim * d) + ")" : ""; }
        });
      };
  MW.uiNotificationFromDepth = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
</script>
