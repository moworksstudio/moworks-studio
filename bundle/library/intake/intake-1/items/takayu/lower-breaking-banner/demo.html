<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Breaking News Banner - Demo</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
:root { --bg: #09090b; --fg: #fafafa; --card: #111114; --line: #27272a; }
* { box-sizing: border-box; }
html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); }
#demo { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); color: var(--fg); font-family: Inter, sans-serif; }
.center { position: absolute; inset: 0; display: grid; place-items: center; }
.row { display: flex; align-items: center; justify-content: center; gap: 48px; }
.col { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 32px; }
.h1 { font-size: 132px; font-weight: 800; letter-spacing: -0.035em; line-height: 1.1; text-align: center; }
.h2 { font-size: 84px; font-weight: 700; letter-spacing: -0.025em; line-height: 1.15; text-align: center; }
.p { font-size: 40px; line-height: 1.4; opacity: 0.72; text-align: center; }
.card { position: relative; border-radius: 28px; background: var(--card); border: 2px solid var(--line); overflow: hidden; }
.muted { opacity: 0.6; }

#demo { background: radial-gradient(100% 100% at 50% 45%, #1a1f33, #0b0d12); color: #e8ebf3; font-family: Inter, sans-serif; } .gm { position: absolute; inset: 0; }
.ft { position: absolute; inset: 0; background: url(assets/shot.svg) center / cover; } .ft::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,0.1) 30%, rgba(0,0,0,0.55)); }
.bb { position: absolute; left: 160px; bottom: 210px; } .bb-l { position: absolute; left: 0; top: -28px; width: 1168px; height: 8px; background: #0b0d12; } .bb-b { position: relative; width: 1168px; height: 176px; border-radius: 8px; overflow: hidden; display: flex; align-items: center; padding-left: 56px; box-sizing: border-box; }
.bb-b span { font-size: 104px; font-weight: 900; white-space: nowrap; letter-spacing: -0.01em; }
    </style>
  </head>
  <body>
    <div id="demo" data-composition-id="mw-demo" data-start="0" data-width="1920" data-height="1080" data-duration="3.5">
<div class="ft"></div><div class="bb"><i class="bb-l"></i><div class="bb-b"><span>TIN NÓNG: BÃO SỐ 9</span></div></div>
      <script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.drive = MW.drive || function (tl, at, dur, fn) {
    var s = { t: 0 }; fn(0);
    tl.fromTo(s, { t: 0 }, { t: dur, duration: dur, ease: "none", immediateRender: false, onUpdate: function () { fn(s.t); } }, at);
    return at + dur;
  };
  var defaults = {"banner":".bb-b","line":".bb-l","start":0.3,"frames":8,"delay":6,"slide":560,"skew":17,"outAt":3.05,"textOut":1200,"accent":"#ff3b4f","light":"#ffffff"};
  var run = function (el, tl, at, o) {
        var b = el.querySelector(o.banner), tx = b.firstElementChild, ln = o.line ? el.querySelector(o.line) : null, p2 = gsap.parseEase("power2.out"), ex = gsap.parseEase("expo.out"), pin = gsap.parseEase("power2.in"), W = b.offsetWidth;
        gsap.set(b, { transformOrigin: "0% 50%" }); if (ln) gsap.set(ln, { transformOrigin: "0% 50%" });
        var wipe = o.frames / 30, we = o.start + wipe;
        return MW.drive(tl, at, o.outAt + 0.3 + 0.05, function (t) {
          var s = p2(Math.max(0, Math.min(1, (t - o.start) / wipe))), x = pin(Math.max(0, Math.min(1, (t - o.outAt) / 0.3)));
          gsap.set(b, { scaleX: s, x: W * 1.1 * x }); if (ln) gsap.set(ln, { scaleX: s, x: W * 1.1 * x });
          var fl = t >= we && t < we + 0.75 ? Math.floor((t - we) / 0.125) % 2 : 0; b.style.background = fl ? o.light : o.accent; tx.style.color = fl ? o.accent : o.light;
          var u = ex(Math.max(0, Math.min(1, (t - we - o.delay / 30) / 0.2))); gsap.set(tx, { x: o.slide * (1 - u) + o.textOut * x, skewX: o.skew * (1 - u) }); tx.style.visibility = t >= we + o.delay / 30 ? "visible" : "hidden";
        });
      };
  MW.lowerBreakingBanner = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
      </script>
      <script>
        (function () {
          var tl = gsap.timeline({ paused: true });
          var q = function (s) { return document.querySelector(s); }, qa = function (s) { return Array.prototype.slice.call(document.querySelectorAll(s)); };
          MW.lowerBreakingBanner(q(".bb"), tl, 0, {});
          tl.set({}, {}, 3.5);
          // register only when every motion is ready (MW.pending: e.g. a WebGL texture still decoding), as HyperFrames asks of async builds
          var go = function () { window.__timelines = window.__timelines || {}; window.__timelines["mw-demo"] = tl; };
          if (window.MW && MW.pending && MW.pending.length) Promise.all(MW.pending).then(go, go); else go();
        })();
      </script>
    </div>
  </body>
</html>
