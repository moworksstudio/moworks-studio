  Mỗi ký tự là một cuộn sáu chữ ngẫu nhiên quay rồi dừng đúng chữ, ô chẵn cuộn xuống, ô lẻ cuộn lên, các ô dừng lệch nhau 0.06 giây.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.textSlotShuffle(q(".tk-head"), tl, 0, {});

  Options (defaults in brackets):
      - rows: random letters before the target (6)
      - duration: s per reel (0.8)
      - stagger: s (0.06, ≤ 1 s)
      - start: s (0.35)
      - stretch: stretch per row a second (0.035)
      - card: window colour
      - accent: landing underline
      - fadeAt: s (3.0)
      - seed: letters

  Notes: Idea and numbers (TakayuStudio tx-slot-shuffle, written here): Each char window (glyph width + 0.16 em × 1.18 em, card, radius 5 px; row pitch 1.18 em) holds a reel of 6 seeded random letters of its class + the target; the reel travels 6 rows in 0.8 s easeOutCubic (labelled power3.out), reels start 60 ms apart (capped 1 s) from 0.35 s; even slots scroll down, odd up; while fast, scaleY = 1 + min(0.45, 0.035 × rows/s), scaleX = 1/√scaleY. an accent underline appears as a reel lands. Exit fade 3.0–3.3 s; loop 3.4 s. Params: rows: số chữ ngẫu nhiên (6) · duration (0.8 s) · stagger (0.06 s) · direction: chẵn xuống / lẻ lên · stretch (0.035).
