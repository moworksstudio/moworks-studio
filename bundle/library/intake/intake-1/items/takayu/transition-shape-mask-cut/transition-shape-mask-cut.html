  Source: motion-reference.takayustudio.jp/#motion=tx-shape-mask-cut (read 12/10/2026).
  Cảnh tiếp theo hiện ra trong một ngôi sao năm cánh đặt giữa tiêu đề, ngôi sao phóng to và xoay cho tới khi phủ kín khung.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.transitionShapeMaskCut(q(".sm-b"), tl, 1.2, { back: 1.8 });

  Options (defaults in brackets):
      - duration: s (0.6), ease-in
      - ease: power2.in (cubic)
      - start: px of the star at the start (0; the recipe 0.4 em)
      - inner: inner radius ÷ outer (0.45)
      - rotate: degrees it turns while growing (30)
      - center: element the star is centred on (the frame's centre)
      - outline: outline colour
      - stroke: px (4.5)
      - back: s after the start to shrink back (null: stay)
      - from: the outgoing scene

  Notes: Idea and numbers (TakayuStudio tx-shape-mask-cut, written here): Next scene clipped by a 5-point star (inner radius 45 % of outer) centred on the title; radius grows from ~0.4 em (21 px at 54 px type) to past the frame diagonal (100 → 3000 %) in 0.6 s power3.in (demo easeInCubic, CSS cubic-bezier(.55,0,1,.45)), rotating 0 → +30°; 1.5 px dark outline on the star edge until it leaves the frame. Demo: the star grows from 0, next scene = accent background with the second title; cut 1.2–1.8 s, back 3.0–3.6 s; loop 4.8 s. Params: shape: hình mặt nạ (sao 5 cánh) · duration (0.6 s, ease-in) · scale (100 → 3000 %) · rotate (30°).
-->

        var out = o.from ? MW.el(o.from) : el.previousElementSibling, root = el.parentNode, W = el.offsetWidth, Hh = el.offsetHeight, ease = gsap.parseEase(o.ease), N = 10;
        var c = o.center ? MW.el(o.center).getBoundingClientRect() : null, rb = root.getBoundingClientRect(), cx = c ? c.left - rb.left + c.width / 2 : W / 2, cy = c ? c.top - rb.top + c.height / 2 : Hh / 2;
        var NS = "http://www.w3.org/2000/svg", svg = document.createElementNS(NS, "svg"), pl = document.createElementNS(NS, "polygon");

        var end = o.back == null ? o.duration : o.back + o.duration;
