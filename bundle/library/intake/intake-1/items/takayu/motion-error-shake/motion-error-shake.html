  Source: motion-reference.takayustudio.jp/#motion=error-shake (read 12/10/2026).
  Ô email lắc ngang mạnh rồi nhỏ dần, viền chuyển đỏ và dòng báo lỗi hiện ra.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.motionErrorShake(q(".ef"), tl, 0.85, { message: ".em", badge: ".eb" });

  Options (defaults in brackets):
      - amp: px of the first swing (36; 12 on the site's demo), then 10 / 6 / 4 in proportion
      - color: error outline colour
      - base: outline colour before
      - width: px before (3)
      - widthError: px in error (5)
      - message: the error line (fades in sliding down)
      - badge: the ! badge
      - slide: px the message slides (12)

  Notes: Idea and numbers (TakayuStudio error-shake, written here): After a click on 'Log in', the email field shakes x 0 → −12 → +10 → −6 → +4 → 0 px at 0 / 90 / 200 / 310 / 420 / 540 ms (sine.inOut between keys); within the first 120 ms its outline turns red and thickens 1.5 → 2.5 px and a '!' badge appears; the error message fades in, sliding 4 px down, 300–550 ms. Params: keys (−12 / 10 / −6 / 4 px) · duration (0.54 s) · color lỗi.
-->
