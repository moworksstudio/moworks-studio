  Source: motion-reference.takayustudio.jp/#motion=tx-char-flicker-in (read 12/10/2026).
  Từng ký tự loé hai ký hiệu ngẫu nhiên rất nhanh (mỗi lần 50 ms) rồi mới hiện đúng chữ, lần lượt từ trái sang.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.textCharFlickerIn(q(".tk-head"), tl, 0, {});

  Options (defaults in brackets):
      - delay: s between letters (0.18)
      - fit: s the line is fitted into (1.6)
      - start: s (0.3)
      - glyphs: flash symbols
      - accent: flash colour
      - fadeAt: s (3.05)
      - seed: symbols

  Notes: Idea and numbers (TakayuStudio tx-char-flicker-in, written here): Split chars; char i starts at (i + 1) × 0.18 s (demo capped so the line fits 1.6 s, from 0.3 s). Each char: a random symbol (#%&*+=?@$!<>/|^~, seeded) flashes 50 ms in accent, blank 30 ms, a second symbol 50 ms, then the real char appears at +130 ms with no fade. Demo: a 2 px accent underline marks the active char; faint dots mark empty slots. Loop exit: fade 3.05–3.3 s; loop 3.4 s. Params: delay: mỗi ký tự (0.18 s) · flash: mỗi lần loé (0.05 s) · gap (0.03 s) · glyphs: bộ ký hiệu.
-->
