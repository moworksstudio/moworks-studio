  Một từ đập xuống bằng lò xo nặng, bẹp lại lúc chạm và làm khung rung vài khung hình.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.textEmphasisSlam(q(".tk-head"), tl, 0.3, {});

  Options (defaults in brackets):
      - from: start scale (3)
      - k: spring stiffness (80)
      - c: damping (16)
      - m: mass (1.6): a heavy spring
      - shake: px (16)
      - shakeFrames: frames at 24 fps (3)
      - duration: s (1.6)
      - stage: what shakes
      - seed: shake

  Notes: Idea and numbers (TakayuStudio ty-slam, written here): Recipe: one word starts at scale 3 and lands on a heavy spring (k 80, c 16, m 1.6; ζ ≈ 0.71, ~0.7 s), squashes on landing, the frame shakes 2–4 frames. Demo (2.4 s loop): 'BOOM' 56 px drops from y −80 px to 0 on spring k 260, c 16, m 1 from 0.3 s; during 0.45–0.6 s it holds squash scaleY 0.82 / scaleX 1.22 and shakes x ±4 px per frame (seeded). Params: from: cỡ đầu (3 lần) · spring: độ cứng / giảm chấn / khối lượng (80 / 16 / 1.6) · squash (0.82) · shake: rung ngang (4 px, 2–4 khung).
-->

<script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.rand = MW.rand || function (seed) {
    var a = typeof seed === "string" ? MW.hash(seed) : (seed >>> 0) || 1;
    return function () { a = (a + 0x6d2b79f5) >>> 0; var t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  };
  MW.hash = MW.hash || function (s) { var h = 2166136261; s = String(s); for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; };
  MW.spring = MW.spring || function (stiffness, damping, mass, from, to) {
    var k = stiffness || 100, c = damping == null ? 10 : damping, m = mass || 1, w0 = Math.sqrt(k / m), z = c / (2 * Math.sqrt(k * m));
    var x = function (t) {
      if (z < 1) { var wd = w0 * Math.sqrt(1 - z * z); return 1 - Math.exp(-z * w0 * t) * (Math.cos(wd * t) + (z * w0 / wd) * Math.sin(wd * t)); }
      if (z === 1) return 1 - Math.exp(-w0 * t) * (1 + w0 * t);
      var q = Math.sqrt(z * z - 1), r1 = -w0 * (z - q), r2 = -w0 * (z + q), A = r2 / (r2 - r1), B = -r1 / (r2 - r1);
      return 1 - (A * Math.exp(r1 * t) + B * Math.exp(r2 * t));
    };
    var T = 0, dt = 1 / 240; for (var t = 0; t < 30; t += dt) if (Math.abs(1 - x(t)) > 0.001) T = t;
    T = Math.max(dt, T + dt);
    return { duration: T, ease: function (p) { return p >= 1 ? 1 : x(p * T); }, at: x };
  };
  MW.springDB = MW.springDB || function (duration, bounce) {
    var z = 1 - (bounce == null ? 0.25 : bounce), w = Math.log(1000) / (Math.max(0.05, z) * (duration || 0.8));
    return MW.spring(w * w, 2 * z * w, 1);
  };
  MW.drive = MW.drive || function (tl, at, dur, fn) {
    var s = { t: 0 }; fn(0);
    tl.fromTo(s, { t: 0 }, { t: dur, duration: dur, ease: "none", immediateRender: false, onUpdate: function () { fn(s.t); } }, at);
    return at + dur;
  };
  var defaults = {"from":3,"k":80,"c":16,"m":1.6,"shake":16,"shakeFrames":3,"duration":1.6,"stage":null,"seed":5};
  var run = function (el, tl, at, o) {
        var sp = MW.spring(o.k, o.c, o.m), land = 0; for (var s = 0; s < 2; s += 1 / 240) if (sp.at(s) >= 1) { land = s; break; }
        var host = o.stage ? MW.el(o.stage) : el.parentNode;
        return MW.drive(tl, at, o.duration, function (t) {
          var v = sp.at(t), sc = o.from + (1 - o.from) * v, d = t - land, sq = d >= 0 && d < 0.15 ? 1 : 0, f = Math.floor(d * 24), r = MW.rand(o.seed + f);
          gsap.set(el, { scale: sc, scaleX: sc * (sq ? 1.22 : 1), scaleY: sc * (sq ? 0.82 : 1), transformOrigin: "50% 100%" }); el.style.opacity = String(Math.min(1, t / 0.05));
          gsap.set(host, { x: d >= 0 && f < o.shakeFrames ? (r() * 2 - 1) * o.shake : 0 });
        });
      };
  MW.textEmphasisSlam = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
