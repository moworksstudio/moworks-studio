  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline

    MW.uiClapCounter(q(".gm"), tl, 0, {});

      - taps: s of each clap
      - from: the count before (24)
      - resetAt: s (2.5)
      - loop: s (2.8)

  Notes: Idea and numbers (TakayuStudio catalog-ui-feedback-clap-counter, written here): Clap button: circle r32 with two rounded hands 12x26 r6 tilted ±0.38 rad, closing to ±0.1 rad and the icon scaling 0.92 at each tap, 3 spark lines flash. Taps at 0.45 / 1.0 / 1.55 s. Counter cell 66x44 r10: the number rolls up one step (40 px, clipped) over 0.2 s power2.out right after each tap, 24 → 27. A '+1' floats up 16 px (power2.out) and fades over 0.53 s. Reset at 2.5 s. Params: taps ([0.45, 1.0, 1.55] s) · roll (0.2 s, 40 px) · from (24) · float (+1, 16 px).
