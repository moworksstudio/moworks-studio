<!--
  J-cut / L-cut (TakayuStudio (motion-reference), No licence stated: idea and numbers only, written from the idea (site read 12/10/2026)).
  Source: motion-reference.takayustudio.jp/#motion=tr-jcut (read 12/10/2026).
  Bài học: tiếng của cảnh sau vào trước hình 4–12 khung (J-cut), hoặc tiếng của cảnh trước còn kéo dài 12–24 khung sau điểm cắt (L-cut).

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.motionJLCut(q(".jl"), tl, 0.1, {});

  Options (defaults in brackets):
      - loop: s for the playhead to cross the 3 s ruler (3)
      - loops: times (1)

  Notes: Idea and numbers (TakayuStudio tr-jcut, written here): Diagram on neutral bars: a picture track (A dark / B accent, cut at the middle) over an audio track, two rows. J row: audio B starts 4-12 frames before the picture cut (demo ~0.3 s early); L row: audio A runs 12-24 frames past it (~0.3 s late); a yellow line marks the cut. A playhead sweeps the 3 s ruler linearly, looping. Params: lead: tiếng trước (4–12 khung) · trail: tiếng sau (12–24 khung). A lesson as a diagram: picture over sound; the J row's sound of B starts before the cut, the L row's sound of A runs past it. In a film: place the voice clip a few frames early or late against the scene cut.
-->

<div class="jl">
<div class="jl-row"><div class="jl-title">J-cut<span>tiếng cảnh sau vào trước hình</span></div>
<div class="jl-track"><div class="jl-lab">Hình</div><div class="jl-seg jl-a" style="left:0;width:50%">A</div><div class="jl-seg jl-b" style="left:50%;width:50%">B</div></div>
<div class="jl-track"><div class="jl-lab">Tiếng</div><div class="jl-seg jl-a jl-wave" style="left:0;width:40%">A</div><div class="jl-seg jl-b jl-wave" style="left:40%;width:60%">B</div></div>
<div class="jl-cut"></div><div class="jl-head"></div></div>
<div class="jl-row"><div class="jl-title">L-cut<span>tiếng cảnh trước kéo dài sau điểm cắt</span></div>
<div class="jl-track"><div class="jl-lab">Hình</div><div class="jl-seg jl-a" style="left:0;width:50%">A</div><div class="jl-seg jl-b" style="left:50%;width:50%">B</div></div>
<div class="jl-track"><div class="jl-lab">Tiếng</div><div class="jl-seg jl-a jl-wave" style="left:0;width:60%">A</div><div class="jl-seg jl-b jl-wave" style="left:60%;width:40%">B</div></div>
<div class="jl-cut"></div><div class="jl-head"></div></div></div>

<style>

</style>

<script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  var defaults = {"loop":3,"loops":1};
  var run = function (el, tl, at, o) {
        var head = el.querySelectorAll(".jl-head"), span = o.loop;
        for (var i = 0; i < o.loops; i++) head.forEach(function (h) { tl.fromTo(h, { left: "0%" }, { left: "100%", duration: span, ease: "none", immediateRender: i === 0 }, at + i * span); });
        return at + o.loops * span;
      };
  MW.motionJLCut = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
</script>
