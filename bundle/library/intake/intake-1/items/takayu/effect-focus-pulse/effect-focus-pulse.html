<!--
  Focus Pulse (TakayuStudio (motion-reference), No licence stated: idea and numbers only, written from the idea (site read 12/10/2026)).
  Source: motion-reference.takayustudio.jp/#motion=pulse-focus (read 12/10/2026).
  Một vòng tròn loang ra từ biểu tượng rồi tắt, biểu tượng nhún nhẹ, sau đó nhãn “Mới” hiện lên.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.effectFocusPulse(q(".fp i.on"), tl, 0.4, { tooltip: ".fp-t" });

  Options (defaults in brackets):
      - radius: px (80)
      - scale: [from, to] of the radius ([0.5, 2.4])
      - opacity: at the start (0.8)
      - stroke: px (8)
      - duration: s (0.68, power2.out)
      - accent: 
      - tooltip: a label shown after it
      - tipAt: s (0.5)
      - tipRise: px (20)

  Notes: Idea and numbers (TakayuStudio pulse-focus, written here): Ring centred on an icon of radius 12 px: ring radius 16 px × scale 0.5 → 2.4, opacity 0.8 → 0, 2 px stroke, 680 ms power2.out (easeOutCubic); the icon bumps 1 → 1.06 → 1 (sine) over the first 240 ms. 500 ms after the ring starts a tooltip ('New') fades in and rises 4 px in 200 ms above it. Once; the centre never moves. Params: duration (0.68 s) · scale (0.5 → 2.4) · opacity đầu (0.8) · stroke (2 px) · tooltip: nhãn (rỗng = không).
-->

<div class="st"><div class="fp"><i></i><i></i><i></i><i class="on"></i><i></i><div class="fp-t">Mới</div></div></div>

<style>

</style>

<script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.drive = MW.drive || function (tl, at, dur, fn) {
    var s = { t: 0 }; fn(0);
    tl.fromTo(s, { t: 0 }, { t: dur, duration: dur, ease: "none", immediateRender: false, onUpdate: function () { fn(s.t); } }, at);
    return at + dur;
  };
  var defaults = {"radius":80,"scale":[0.5,2.4],"opacity":0.8,"stroke":8,"duration":0.68,"accent":"#8b7bff","tooltip":null,"tipAt":0.5,"tipRise":20};
  var run = function (el, tl, at, o) {
        var host = el.parentNode; if (getComputedStyle(host).position === "static") host.style.position = "relative";
        var ring = document.createElement("div"), tip = o.tooltip ? host.querySelector(o.tooltip) : null, p2 = gsap.parseEase("power2.out"), cx = el.offsetLeft + el.offsetWidth / 2, cy = el.offsetTop + el.offsetHeight / 2;
        ring.style.cssText = "position:absolute;border-radius:50%;pointer-events:none;box-sizing:border-box;opacity:0;border:" + o.stroke + "px solid " + o.accent + ";"; host.appendChild(ring);
        return MW.drive(tl, at, Math.max(o.duration, o.tipAt + 0.2), function (t) {
          var u = Math.min(1, t / o.duration), r = o.radius * (o.scale[0] + (o.scale[1] - o.scale[0]) * p2(u));
          ring.style.width = ring.style.height = 2 * r + "px"; ring.style.left = cx - r + "px"; ring.style.top = cy - r + "px"; ring.style.opacity = t > 0 && u < 1 ? String(o.opacity * (1 - p2(u))) : "0";
          gsap.set(el, { scale: 1 + 0.06 * Math.sin(Math.PI * Math.min(1, t / 0.24)) });
          if (tip) { var w = p2(Math.max(0, Math.min(1, (t - o.tipAt) / 0.2))); tip.style.opacity = String(w); gsap.set(tip, { y: o.tipRise * (1 - w) }); }
        });
      };
  MW.effectFocusPulse = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
</script>
