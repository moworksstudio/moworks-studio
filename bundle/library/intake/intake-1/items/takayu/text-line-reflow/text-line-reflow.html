  Khung chữ hẹp dần, từ cuối không còn chỗ thì trượt mượt xuống dòng dưới thay vì nhảy cóc, rồi khung nới ra và từ đó quay về.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.textLineReflow(q(".lrc"), tl, 0, { cursor: ".ui-cursor" });

  Options (defaults in brackets):
      - wide: px of the card at rest (1350)
      - narrow: px narrowed (850)
      - pad: px (60)
      - gap: px between words (40)
      - pitch: px line pitch (190)
      - cursor: the cursor riding the edge
      - loop: s (4.2)

  Notes: Idea and numbers (TakayuStudio catalog-kinetic-type-line-break-reflow, written here): Card 270 → 170 px wide (0.4–1.1 s, cubic-bezier(.65,0,.35,1)), 92 px tall, radius 8, drag handle 6 × 24 px on its right edge. Words MAKE IT MOVE, 26 px, left-aligned, line pitch 38 px. When the width crosses the fit threshold, the word that wraps moves FLIP from its old slot to the new one in 480 ms power2.out (x linear in progress k, y along k^0.35 so it drops early); a 1 px outline flashes on it (0.9 × sin πk). Reverse 2.5–3.2 s; loop 4.2 s. Params: độ rộng (270 → 170 px) · thời gian co (0.7 s) · thời gian trượt từ (0.48 s).
-->
