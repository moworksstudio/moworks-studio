  Masked Line Rise (TakayuStudio (motion-reference), No licence stated: idea and numbers only, written from the idea (site read 12/10/2026)).
  Source: motion-reference.takayustudio.jp/#motion=tx-line-mask-rise (read 12/10/2026).
  Mỗi dòng trồi lên khỏi mặt nạ riêng trong 1 giây, dòng sau cách dòng trước 0.1 giây, dừng rất êm.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.textLineMaskRise(q(".tk-head"), tl, 0.3, { exit: 2.6 });

  Options (defaults in brackets):
      - duration: s per line (1)
      - stagger: s between lines (0.1)
      - ease: expo.out (cubic-bezier(.16,1,.3,1))
      - exit: s after the start to rise out (null: stay)

  Notes: Idea and numbers (TakayuStudio tx-line-mask-rise, written here): Split lines, each in an overflow-clip mask (demo: baseline − 0.98 em to + 0.3 em, 8 px side pad). Each line yPercent 100 → 0 (rises one mask height), 1 s expo.out (cubic-bezier(.16,1,.3,1); power4.out also given), lines 0.1 s apart from 0.3 s. Demo exit: lines continue up out of the mask, 0.6 s easeInCubic, 0.1 s apart, from 2.9 s; loop 4 s. Params: duration (1 s) · stagger: giữa các dòng (0.1 s) · ease (expo.out).
-->

<div class="tk-stage"><div><h1 class="tk-head ">Mỗi dòng trồi lên<br>khỏi mặt nạ riêng<br>rồi dừng thật êm</h1></div></div>

<style>

</style>

<script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.split = MW.split || function (el, mode) {
    el = MW.el(el);
    if (el.__mwSplit) return el.__mwSplit;
    var seg = typeof Intl !== "undefined" && Intl.Segmenter ? new Intl.Segmenter("vi", { granularity: "grapheme" }) : null;
    var graphemes = function (s) { if (seg) { var out = []; var it = seg.segment(s)[Symbol.iterator](), r; while (!(r = it.next()).done) out.push(r.value.segment); return out; } return Array.from(s); };
    var res = { chars: [], words: [], lines: [] };
    var walk = function (node) {
      var kids = Array.prototype.slice.call(node.childNodes);
      for (var k = 0; k < kids.length; k++) {
        var n = kids[k];
        if (n.nodeType === 1) { if (n.tagName === "BR") continue; walk(n); continue; }
        if (n.nodeType !== 3) continue;
        var text = n.nodeValue.normalize("NFC"), frag = document.createDocumentFragment();
        var parts = text.split(/(\s+)/);
        for (var p = 0; p < parts.length; p++) {
          var part = parts[p];
          if (!part) continue;
          if (/^\s+$/.test(part)) { frag.appendChild(document.createTextNode(part)); continue; }
          var w = document.createElement("span");
          w.className = "mw-w"; w.style.display = "inline-block"; w.style.whiteSpace = "nowrap";
          if (mode === "words") w.textContent = part;
          else { var gs = graphemes(part); for (var g = 0; g < gs.length; g++) { var c = document.createElement("span"); c.className = "mw-ch"; c.style.display = "inline-block"; c.textContent = gs[g]; w.appendChild(c); res.chars.push(c); } }
          res.words.push(w); frag.appendChild(w);
        }
        node.replaceChild(frag, n);
      }
    };
    walk(el);
    var top = null, line = null;
    for (var i = 0; i < res.words.length; i++) { var y = res.words[i].offsetTop; if (top === null || Math.abs(y - top) > 2) { top = y; line = []; res.lines.push(line); } line.push(res.words[i]); }
    el.__mwSplit = res;
    return res;
  };
  MW.lines = MW.lines || function (el, mode) {
    el = MW.el(el);
    if (el.__mwLines) return el.__mwLines;
    var s = MW.split(el, mode || "words"), out = [];
    s.lines.forEach(function (ws) {
      var d = document.createElement("span"); d.className = "mw-line"; d.style.display = "block";
      ws[0].parentNode.insertBefore(d, ws[0]);
      ws.forEach(function (w, i) { d.appendChild(w); if (i < ws.length - 1) d.appendChild(document.createTextNode(" ")); });
      out.push(d);
    });
    Array.prototype.slice.call(el.childNodes).forEach(function (n) { if ((n.nodeType === 3 && !n.nodeValue.trim()) || n.nodeName === "BR") el.removeChild(n); });
    el.__mwLines = { lines: out, chars: s.chars, words: s.words };
    return el.__mwLines;
  };
  var defaults = {"duration":1,"stagger":0.1,"ease":"expo.out","exit":null};
  var run = function (el, tl, at, o) {
        var L = MW.lines(el, "words").lines, inner = [];
        L.forEach(function (l) {
          var s = document.createElement("span"); s.style.display = "inline-block";
          while (l.firstChild) s.appendChild(l.firstChild);
          l.appendChild(s); l.style.overflow = "hidden"; l.style.padding = "0.22em 0.08em"; l.style.margin = "-0.22em -0.08em"; inner.push(s);
        });
        inner.forEach(function (s, i) { tl.fromTo(s, { yPercent: 135 }, { yPercent: 0, duration: o.duration, ease: o.ease, immediateRender: true }, at + i * o.stagger); });
        if (o.exit != null) inner.forEach(function (s, i) { tl.to(s, { yPercent: -135, duration: 0.6, ease: "power2.in", immediateRender: false }, at + o.exit + i * o.stagger); });
        return at + o.duration + (L.length - 1) * o.stagger;
      };
  MW.textLineMaskRise = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
</script>
