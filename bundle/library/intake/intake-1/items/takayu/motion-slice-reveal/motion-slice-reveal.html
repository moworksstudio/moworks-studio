  Phần tử được cắt thành bốn lát ngang, lát lẻ từ trái lát chẵn từ phải trượt vào và hiện dần, cùng dừng một lúc thành một khối.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.motionSliceReveal(q(".sr"), tl, 0.3, { exitAt: 1.7 });

  Options (defaults in brackets):
      - slices: (4)
      - distance: px (120): odd strips from the left, even from the right
      - stagger: s (0.036); all land together
      - duration: s (0.84, ease-in-out cubic)
      - exitAt: s after the start to slide apart again (null, 0.2 s)

  Notes: Idea and numbers (TakayuStudio slice-reveal, written here): Element cut into 4 equal horizontal strips (clipped copies). Strips 1 and 3 start at x -42 px, strips 2 and 4 at +42 px, each opacity 0 -> 1; strip i starts at i x 36 ms and all land together at 840 ms (each lasts 840 - 36i ms), easeInOutCubic. Exit (200 ms ease-in cubic): the same tween runs back, strips slide apart again while fading. Params: slices (4) · distance (42 px) · stagger (36 ms) · duration (0.84 s).
-->

(function () {

  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.drive = MW.drive || function (tl, at, dur, fn) {
    var s = { t: 0 }; fn(0);
    tl.fromTo(s, { t: 0 }, { t: dur, duration: dur, ease: "none", immediateRender: false, onUpdate: function () { fn(s.t); } }, at);
    return at + dur;
  };
  var defaults = {"slices":4,"distance":120,"stagger":0.036,"duration":0.84,"exitAt":null};
  var run = function (el,tl,at,o
  ) {
  var host = el.parentNode; if (getComputedStyle(host).position === "static") host.style.position = "relative";
  var clone = function () { var g = el.cloneNode(true); g.removeAttribute("id"); g.style.position = "absolute"; g.style.margin = "0"; g.style.pointerEvents = "none"; g.style.boxSizing = "border-box";
    g.style.left = el.offsetLeft + "px"; g.style.top = el.offsetTop + "px"; var br = el.getBoundingClientRect(); g.style.width = (br.width + 0.5) + "px"; g.style.height = el.offsetHeight + "px"; host.insertBefore(g, el.nextSibling); return g; };
  var n = o.slices, S = [], io = gsap.parseEase("power2.inOut"), pi = gsap.parseEase("power3.in");
  for (var i = 0; i < n; i++) { var g = clone(); g.style.clipPath = "inset(" + (100 * i / n).toFixed(3) + "% 0 " + (100 - 100 * (i + 1) / n).toFixed(3) + "% 0)"; g.style.opacity = "0"; S.push(g); }
  return MW.drive(tl, at, o.exitAt == null ? o.duration : o.exitAt + 0.2, function (t) {
    var out = o.exitAt != null && t > o.exitAt, x = out ? pi(Math.min(1, (t - o.exitAt) / 0.2)) : 0, done = t >= o.duration && !out;
    el.style.opacity = done ? "1" : "0";
    S.forEach(function (g, i) { var st = i * o.stagger, p = out ? 1 - x : io(Math.max(0, Math.min(1, (t - st) / (o.duration - st)))), side = i % 2 ? 1 : -1; gsap.set(g, { x: side * o.distance * (1 - p) }); g.style.opacity = done ? "0" : String(p); });
  });
  };
  MW.motionSliceReveal = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
