  Source: motion-reference.takayustudio.jp/#motion=tx-rgb-split-glitch (read 12/10/2026).
  Hai bản đỏ và xanh lơ của chữ lệch sang hai bên trong những dải ngang chạy lên xuống, giật từng đợt ngắn.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.textRgbSplitGlitch(q(".tk-head"), tl, 0, {});

  Options (defaults in brackets):
      - colors: [red, cyan]
      - band: [min, max] % of the height ([6, 22])
      - shift: [min, max] px ([16, 48])
      - jitter: ± px (8)
      - bursts: [[from, to] s, ...] ([[0.35, 1.05], [2.4, 2.78]])
      - fps: updates a second (12)
      - seed: (3)
      - loop: s (3)

  Notes: Idea and numbers (TakayuStudio tx-rgb-split-glitch, written here): Two copies over the text, each clipped to a horizontal band. CSS: cyan copy (x −2 px, cyan shadow +5 px) on a 2 s cycle, red copy (x +2, red shadow −5 px) on 3 s; bands slide through 6 inset keys (20/50, 60/12, 43/40, 8/78, 70/6, 32/55 %), linear alternate-reverse. Canvas demo (12 fps): bursts only in 0.35–1.05 / 2.4–2.78 s on ~70 % of frames: red band in the upper half, cyan in the lower (6–22 % tall), shifted −/+4–12 px, screen blend; text jitters ±2 px. Loop 3 s. Params: offset: độ lệch (5–12 px) · band: chiều cao dải (6–22 %) · cycles: chu kỳ hai bản (2 s / 3 s) · seed. In a burst about 70 % of frames glitch: a red band in the upper half, a cyan band in the lower, shifted opposite ways.
-->
