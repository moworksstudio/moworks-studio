<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Signature Stroke - Demo</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
:root { --bg: #09090b; --fg: #fafafa; --card: #111114; --line: #27272a; }
* { box-sizing: border-box; }
html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); }
#demo { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); color: var(--fg); font-family: Inter, sans-serif; }
.center { position: absolute; inset: 0; display: grid; place-items: center; }
.row { display: flex; align-items: center; justify-content: center; gap: 48px; }
.col { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 32px; }
.h1 { font-size: 132px; font-weight: 800; letter-spacing: -0.035em; line-height: 1.1; text-align: center; }
.h2 { font-size: 84px; font-weight: 700; letter-spacing: -0.025em; line-height: 1.15; text-align: center; }
.p { font-size: 40px; line-height: 1.4; opacity: 0.72; text-align: center; }
.card { position: relative; border-radius: 28px; background: var(--card); border: 2px solid var(--line); overflow: hidden; }
.muted { opacity: 0.6; }

#demo { background: radial-gradient(100% 100% at 50% 45%, #1a1f33, #0b0d12); color: #e8ebf3; font-family: Inter, sans-serif; } .sv { position: absolute; inset: 0; display: grid; place-items: center; }
.sgc { width: 1100px; height: 560px; border-radius: 40px; background: #f4f1ea; display: grid; place-items: center; }
    </style>
  </head>
  <body>
    <div id="demo" data-composition-id="mw-demo" data-start="0" data-width="1920" data-height="1080" data-duration="3.4">
<div class="sv"><div class="sgc"><svg class="sgs" width="900" height="420" viewBox="0 0 300 140"><g fill="none" stroke-linecap="round" stroke-linejoin="round">
<path d="M30 100 C34 70 40 40 46 30 C50 50 54 70 58 84 C64 64 70 44 78 30 C80 56 80 80 82 102" stroke="#2a2a55" stroke-width="4.5"/>
<path d="M82 102 C90 90 96 80 100 76 C100 86 100 94 104 98 C110 86 116 74 120 70 C122 84 124 96 130 96 C136 84 140 76 146 70 C146 84 148 94 156 94 C164 86 170 70 172 50 C172 66 172 82 176 96 C182 86 188 78 196 80 C202 84 202 92 208 96" stroke="#2a2a55" stroke-width="4.5"/>
<path d="M40 118 C100 112 170 112 250 116" stroke="#8b7bff" stroke-width="3"/></g><circle class="sg-pen" r="4" fill="#8b7bff" opacity="0"/></svg></div></div>
      <script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.drive = MW.drive || function (tl, at, dur, fn) {
    var s = { t: 0 }; fn(0);
    tl.fromTo(s, { t: 0 }, { t: dur, duration: dur, ease: "none", immediateRender: false, onUpdate: function () { fn(s.t); } }, at);
    return at + dur;
  };
  var defaults = {"windows":[[0.25,0.9],[0.85,1.6],[1.55,2.05]],"pen":".sg-pen","fadeAt":2.9};
  var run = function (el, tl, at, o) {
        var paths = Array.prototype.slice.call(el.querySelectorAll("path")), pen = el.querySelector(o.pen), io = gsap.parseEase("power2.inOut");
        paths.forEach(function (p) { p.setAttribute("pathLength", "1"); p.style.strokeDasharray = "1 1"; });
        return MW.drive(tl, at, o.fadeAt + 0.35, function (t) {
          var tip = null;
          paths.forEach(function (p, i) { var w = o.windows[i], u = io(Math.max(0, Math.min(1, (t - w[0]) / (w[1] - w[0])))); p.style.strokeDashoffset = String(1 - u); if (u > 0 && u < 1) { var L = p.getTotalLength(), q = p.getPointAtLength(L * u); tip = q; } });
          if (pen) { pen.setAttribute("opacity", tip ? "1" : "0"); if (tip) { pen.setAttribute("cx", tip.x); pen.setAttribute("cy", tip.y); } }
          el.style.opacity = String(1 - Math.max(0, Math.min(1, (t - o.fadeAt) / 0.35)));
        });
      };
  MW.lineSignatureWrite = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
      </script>
      <script>
        (function () {
          var tl = gsap.timeline({ paused: true });
          var q = function (s) { return document.querySelector(s); }, qa = function (s) { return Array.prototype.slice.call(document.querySelectorAll(s)); };
          MW.lineSignatureWrite(q(".sgs"), tl, 0, {});
          tl.set({}, {}, 3.4);
          // register only when every motion is ready (MW.pending: e.g. a WebGL texture still decoding), as HyperFrames asks of async builds
          var go = function () { window.__timelines = window.__timelines || {}; window.__timelines["mw-demo"] = tl; };
          if (window.MW && MW.pending && MW.pending.length) Promise.all(MW.pending).then(go, go); else go();
        })();
      </script>
    </div>
  </body>
</html>
