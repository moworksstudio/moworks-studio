  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.motionEaseSineLoop(q(".ez-b"), tl, 0, { prop: "x", to: 780, half: 1.5 });

  Options (defaults in brackets):
      - half: s each way (2)
      - cycles: there-and-back cycles (1)
      - prop: (y)
      - from: (0)
      - to: (−120 px)

  Notes: Idea and numbers (TakayuStudio e-sine, written here): Target moves 0 → 100 % in 2000 ms sine.inOut and back to 0 by 4000 ms (yoyo), looping. Site rule: floating loops and breathing, 2–4 s cycles; dreamy and calm. Site demo: 1200 ms across 114 px beside the curve graph and a 12-frame spacing ruler (guides, not ported). Params: half: nửa chu kỳ (2 s) · amount · repeat (yoyo).

<script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.drive = MW.drive || function (tl, at, dur, fn) {
    var s = { t: 0 }; fn(0);
    tl.fromTo(s, { t: 0 }, { t: dur, duration: dur, ease: "none", immediateRender: false, onUpdate: function () { fn(s.t); } }, at);
    return at + dur;
  };
  var defaults = {"half":2,"cycles":1,"prop":"y","from":0,"to":-120};
  var run = function (el, tl, at, o) {
        var si = gsap.parseEase("sine.inOut");
        return MW.drive(tl, at, o.half * 2 * o.cycles, function (t) { var u = (t / o.half) % 2, v = si(u < 1 ? u : 2 - u), s = {}; s[o.prop] = o.from + (o.to - o.from) * v; gsap.set(el, s); });
      };
  MW.motionEaseSineLoop = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
</script>
