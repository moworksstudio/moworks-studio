<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Metric Odometer Cascade - Demo</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
:root { --bg: #09090b; --fg: #fafafa; --card: #111114; --line: #27272a; }
* { box-sizing: border-box; }
html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); }
#demo { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); color: var(--fg); font-family: Inter, sans-serif; }
.center { position: absolute; inset: 0; display: grid; place-items: center; }
.row { display: flex; align-items: center; justify-content: center; gap: 48px; }
.col { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 32px; }
.h1 { font-size: 132px; font-weight: 800; letter-spacing: -0.035em; line-height: 1.1; text-align: center; }
.h2 { font-size: 84px; font-weight: 700; letter-spacing: -0.025em; line-height: 1.15; text-align: center; }
.p { font-size: 40px; line-height: 1.4; opacity: 0.72; text-align: center; }
.card { position: relative; border-radius: 28px; background: var(--card); border: 2px solid var(--line); overflow: hidden; }
.muted { opacity: 0.6; }

#demo { background: radial-gradient(100% 100% at 50% 40%, #1a1f33, #0b0d12); color: #e8ebf3; font-family: Inter, sans-serif; } .gm { position: absolute; inset: 0; }
.oc { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; } .oc-n { font-size: 300px; font-weight: 900; } .oc p { margin: 10px 0 0; font-size: 50px; color: #9aa3b8; }
    </style>
  </head>
  <body>
    <div id="demo" data-composition-id="mw-demo" data-start="0" data-width="1920" data-height="1080" data-duration="3">
<div class="gm oc"><div><div class="oc-n">128K</div><p>người theo dõi</p></div></div>
      <script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.drive = MW.drive || function (tl, at, dur, fn) {
    var s = { t: 0 }; fn(0);
    tl.fromTo(s, { t: 0 }, { t: dur, duration: dur, ease: "none", immediateRender: false, onUpdate: function () { fn(s.t); } }, at);
    return at + dur;
  };
  var defaults = {"value":"128","suffix":"K","laps":[1,2,3],"start":0.35,"stops":[1.25,1.75,2.25]};
  var run = function (el, tl, at, o) {
        var out = gsap.parseEase("power2.out"), digits = String(o.value).split(""), reels = [];
        el.textContent = ""; el.style.display = "inline-flex"; el.style.fontVariantNumeric = "tabular-nums";
        digits.forEach(function (d, i) {
          var w = document.createElement("span"); w.style.cssText = "display:inline-block;position:relative;overflow:hidden;height:1.2em;border-radius:0.12em;";
          var s = document.createElement("span"); s.style.cssText = "display:block;line-height:1.2em;"; var steps = +d + (o.laps[i] || 1) * 10;
          for (var j = 0; j <= steps; j++) { var e = document.createElement("span"); e.style.display = "block"; e.textContent = String(j % 10); s.appendChild(e); }
          w.appendChild(s); el.appendChild(w); reels.push({ w: w, s: s, steps: steps, stop: o.stops[i] });
        });
        if (o.suffix) { var k = document.createElement("span"); k.textContent = o.suffix; el.appendChild(k); }
        return MW.drive(tl, at, o.stops[o.stops.length - 1] + 0.6, function (t) {
          reels.forEach(function (r) {
            var u = Math.max(0, Math.min(1, (t - o.start) / (r.stop - o.start))), pos = r.steps * out(u), d = t - r.stop, sp = u > 0 && u < 1 ? r.steps * 2 * (1 - u) / (r.stop - o.start) : 0;
            if (d > 0) pos = r.steps + 0.2 * Math.sin(20 * d) * Math.exp(-10 * d);
            gsap.set(r.s, { y: -pos * 1.2 + "em" }); r.w.style.filter = sp > 6 ? "blur(" + Math.min(6, sp / 6) + "px)" : "";
            var g = d > 0 && d < 0.35 ? 1 - d / 0.35 : 0; r.w.style.boxShadow = g ? "0 0 0 " + (4 * (1 - g) + 2) + "px rgba(139,123,255," + g + ")" : "none";
          });
        });
      };
  MW.dataOdometerCascade = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
      </script>
      <script>
        (function () {
          var tl = gsap.timeline({ paused: true });
          var q = function (s) { return document.querySelector(s); }, qa = function (s) { return Array.prototype.slice.call(document.querySelectorAll(s)); };
          MW.dataOdometerCascade(q(".oc-n"), tl, 0, {});
          tl.set({}, {}, 3);
          // register only when every motion is ready (MW.pending: e.g. a WebGL texture still decoding), as HyperFrames asks of async builds
          var go = function () { window.__timelines = window.__timelines || {}; window.__timelines["mw-demo"] = tl; };
          if (window.MW && MW.pending && MW.pending.length) Promise.all(MW.pending).then(go, go); else go();
        })();
      </script>
    </div>
  </body>
</html>
