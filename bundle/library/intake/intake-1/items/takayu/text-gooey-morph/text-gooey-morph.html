  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.textGooeyMorph(q(".gmo"), tl, 0, {});

  Options (defaults in brackets):
      - words: the pair
      - morph: s (1.5)
      - at: s (0.3)
      - backAt: s it morphs back (2.6)
      - maxBlur: px (18)

  Notes: Idea and numbers (TakayuStudio tx-gooey-morph, written here): Two words stacked. Over 1.5 s (linear fraction f 0 → 1): new word opacity f^0.4, blur min(8/f − 8, 100) px; old word the same with 1 − f. The pair goes through an alpha threshold (feColorMatrix alpha ×255 −140; demo: alpha < 130 → 0, > 150 → 255, linear between), so the blurred shapes merge like liquid. Cooldown 0.5 s between morphs. Demo: A → B 0.3–1.8 s, back 2.6–4.1 s (blur capped 18 px); loop 4.6 s. Params: morph: thời gian đổi (1.5 s) · cooldown: nghỉ giữa hai lần (0.5 s) · words: danh sách từ. Liquid look: the two blurred words pass through an alpha threshold (feColorMatrix alpha × 255 − 140).
-->
