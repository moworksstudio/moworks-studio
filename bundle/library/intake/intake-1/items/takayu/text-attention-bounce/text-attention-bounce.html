  Source: motion-reference.takayustudio.jp/#motion=tx-attention-bounce (read 12/10/2026).
  Cả từ nhảy hai nhịp (cao 30 % rồi 12 %), bẹp nhẹ khi chạm đất, rồi nghỉ 2 giây trước khi nhảy lại.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.textAttentionBounce(q(".ab-b"), tl, 0.3, { shadow: ".ab-s" });

  Options (defaults in brackets):
      - rest: s between bounces (2)
      - cycles: (1)
      - shadow: the floor shadow

  Notes: Idea and numbers (TakayuStudio tx-attention-bounce, written here): Whole word, pivot bottom centre. Jump 1: y 0 → −30 % of its height in 0.24 s ease-out, back to 0 in 0.2 s ease-in, squash scale (1.06, 0.9) for 0.1 s on landing; jump 2: −12 % in 0.16 s, down in 0.12 s, squash (1.04, 0.94) for 0.08 s; 0.8 s in all, then 2 s rest (loop 2.8 s, CSS keys at 8.6 / 15.7 / 21.4 / 25.7 / 28.6 %). Demo adds a small take-off squash (0.95) and a floor shadow ellipse that shrinks while airborne. Params: heights: độ cao hai nhịp (30 % / 12 %) · duration (0.8 s) · squash (0.9) · rest: nghỉ giữa các lần (2 s).
-->

<div class="ab"><div class="ab-s"></div><div class="ab-b">MỚI</div></div>

<style>

</style>

<script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.drive = MW.drive || function (tl, at, dur, fn) {
    var s = { t: 0 }; fn(0);
    tl.fromTo(s, { t: 0 }, { t: dur, duration: dur, ease: "none", immediateRender: false, onUpdate: function () { fn(s.t); } }, at);
    return at + dur;
  };
  var defaults = {"rest":2,"cycles":1,"shadow":null};
  var run = function (el, tl, at, o) {
        var sh = o.shadow ? MW.el(o.shadow) : null, out = gsap.parseEase("power2.out"), inn = gsap.parseEase("power2.in");
        el.style.transformOrigin = "50% 100%";
        return MW.drive(tl, at, (0.8 + o.rest) * o.cycles, function (tt) {
          var t = tt % (0.8 + o.rest), H = el.offsetHeight, y = 0, sx = 1, sy = 1;
          if (t < 0.06) { var s = Math.sin(Math.PI * t / 0.06); sx = 1 + 0.03 * s; sy = 1 - 0.05 * s; }
          else if (t < 0.3) y = -0.3 * H * out((t - 0.06) / 0.24); else if (t < 0.5) y = -0.3 * H * (1 - inn((t - 0.3) / 0.2));
          else if (t < 0.6) { sx = 1.06; sy = 0.9; } else if (t < 0.76) y = -0.12 * H * out((t - 0.6) / 0.16); else if (t < 0.88) y = -0.12 * H * (1 - inn((t - 0.76) / 0.12)); else if (t < 0.96) { sx = 1.04; sy = 0.94; }
          gsap.set(el, { y: y, scaleX: sx, scaleY: sy }); if (sh) gsap.set(sh, { scaleX: 1 + y / H * 0.8, opacity: 0.5 + y / H });
        });
      };
  MW.textAttentionBounce = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
</script>
