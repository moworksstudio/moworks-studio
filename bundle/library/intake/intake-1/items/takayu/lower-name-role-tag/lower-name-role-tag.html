  Source: motion-reference.takayustudio.jp/#motion=tx-lower-third (read 12/10/2026).
  Vạch màu dọc mọc ra, dải tên tối quét vào từ trái, tag chức danh màu nhấn quét vào chậm hơn vài khung, chữ trượt nhẹ vào trong dải; giữ lâu rồi quét ra.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.lowerNameRoleTag(q(".lt"), tl, 0, {});

  Options (defaults in brackets):
      - bar: 
      - name: the name plate (its first child is the text)
      - role: the role tag
      - start: s (0.3)
      - outAt: s the text starts to leave (4.3; hold 5–7 s in a film)
      - slide: [name, role] px the text slides in ([72, 56])

  Notes: Idea and numbers (TakayuStudio tx-lower-third, written here): Accent bar 4 × 50 px grows from its centre 0.3–0.55 s expo.out. Name plate (dark, 30 px, radius 2) wipes in from the left 0.35–0.75 s expo.out; role tag (accent, 16 px, 14 px indent) 0.52–0.92 s (≈5 frames later). Name (20 px) fades 0.45–0.7 s and slides −18 px → 0 (expo.out) inside its plate; role (11 px, light) fades 0.62–0.85 s, slides −14 → 0. Hold to 4.3 s (rule 5–7 s). Out: text fades 4.3–4.45 s, plates wipe off right 4.42–4.72 s, bar 4.5–4.75 s. Params: vào (0.3–0.9 s) · trễ chức danh (≈ 5 khung) · giữ (5–7 s) · ra (0.3 s). The role tag comes in about five frames after the name plate; plates wipe in from the left and off to the right (expo.out in, power2.in out).
-->

<script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.drive = MW.drive || function (tl, at, dur, fn) {
    var s = { t: 0 }; fn(0);
    tl.fromTo(s, { t: 0 }, { t: dur, duration: dur, ease: "none", immediateRender: false, onUpdate: function () { fn(s.t); } }, at);
    return at + dur;
  };
  var defaults = {"bar":".lt-bar","name":".lt-n","role":".lt-r","start":0.3,"outAt":4.3,"slide":[72,56]};
  var run = function (el, tl, at, o) {
        var bar = el.querySelector(o.bar), np = el.querySelector(o.name), rp = el.querySelector(o.role), nt = np.firstElementChild, rt = rp.firstElementChild, ex = gsap.parseEase("expo.out"), pin = gsap.parseEase("power2.in"), d = o.start - 0.3, e = o.outAt - 4.3;
        var S = function (t, a, b, f) { return (f || ex)(Math.max(0, Math.min(1, (t - a - d) / (b - a)))); }, O = function (t, a, b) { return pin(Math.max(0, Math.min(1, (t - a - e) / (b - a)))); };
        gsap.set(bar, { transformOrigin: "50% 50%" });
        return MW.drive(tl, at, 4.75 + e + 0.1, function (t) {
          gsap.set(bar, { scaleY: S(t, 0.3, 0.55) * (1 - O(t, 4.5, 4.75)) });
          var n1 = S(t, 0.35, 0.75), n2 = O(t, 4.42, 4.72), r1 = S(t, 0.52, 0.92); np.style.clipPath = "inset(0 " + (100 * (1 - n1)).toFixed(2) + "% 0 " + (100 * n2).toFixed(2) + "%)"; rp.style.clipPath = "inset(0 " + (100 * (1 - r1)).toFixed(2) + "% 0 " + (100 * n2).toFixed(2) + "%)";
          var tf = 1 - Math.max(0, Math.min(1, (t - 4.3 - e) / 0.15)), a = S(t, 0.45, 0.7), b = S(t, 0.62, 0.85); nt.style.opacity = String(a * tf); gsap.set(nt, { x: -o.slide[0] * (1 - a) }); rt.style.opacity = String(b * tf); gsap.set(rt, { x: -o.slide[1] * (1 - b) });
        });
      };
  MW.lowerNameRoleTag = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
</script>
