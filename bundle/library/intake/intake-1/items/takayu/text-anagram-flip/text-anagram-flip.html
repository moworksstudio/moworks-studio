  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline

    MW.textAnagramFlip(q(".tk-head"), tl, 0, {});

  Options (defaults in brackets):
      - from: first word(s)
      - to: second word(s) sharing letters
      - at: s (0.4)
      - duration: s per letter (0.6), cubic-bezier(.2,.8,.2,1)
      - stagger: s (0.02)
      - backAt: s it goes back (2.3)
      - tint: accent mid-flight

  Notes: Idea and numbers (TakayuStudio tx-anagram-flip, written here): Map identical letters of word A to word B left to right (first unused match). From 0.4 s each pair travels to its new slot in 0.6 s cubic-bezier(.2,.8,.2,1), stagger 0.02 s, on an arc of height min(40 px, 16 px + 0.18 × |dx|): rightward movers pass above, leftward below; an accent tint peaks mid-flight (sin πp). Unmatched letters of A fade out rising 10 px, new letters of B fade in from +10 px, over 0.6 s. Reverse from 2.3 s. Loop 4.2 s. Params: thời gian (0.6 s) · cách nhau (0.02 s) · độ vồng (16 px + 18 % quãng, tối đa 40 px).
