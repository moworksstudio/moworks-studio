  Source: motion-reference.takayustudio.jp/#motion=ui-fan (read 12/10/2026).
  Ba thẻ chồng nhau xoè ra: thẻ dưới sang phải, thẻ trên cùng sang trái, mỗi thẻ nghiêng 18° bằng lò xo lệch nhịp, chỉ thẻ trên cùng vượt quá rồi về; sau đó gom lại.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.motionCardFan(q(".cf"), tl, 0, {});

  Options (defaults in brackets):
      - cards: cards from the bottom of the stack to the top
      - spread: px (280)
      - angle: degrees (18)
      - start: s (0.3)
      - each: s between cards (0.06; the top card last)
      - k: spring stiffness (220)
      - c: [others, top card] damping ([22, 12]: only the top card overshoots)
      - closeAt: s (2.3)
      - close: s (0.4, power2.inOut)

  Notes: Idea and numbers (TakayuStudio ui-fan, written here): 3 cards 80x110 r10 (top accent, middle blue, bottom light) stacked at the centre, each rotating about its own centre. Card k spreads by v = spring(k220): x (k − 1) × 70 px and rotation (k − 1) × 0.32 rad (±18°), the middle card stays. Starts: bottom card 0.3 s, middle 0.36 s, top 0.42 s (60 ms apart); only the top card is underdamped (c12, ≈ 25 % overshoot), the others c22. Close 2.3-2.7 s power2.inOut. Recipe: ~600 ms springs, 40 ms apart, 8-15°. Params: spread (±70 px, ±18°) · each (0.06 s, thẻ trên cùng sau cùng) · top (k220 c12) · others (k220 c22) · close (0.4 s).
-->

<div class="st"><div class="cf"><div class="cf-c">Ba lô</div><div class="cf-c">Giày</div><div class="cf-c">Mũ</div></div></div>

<script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.spring = MW.spring || function (stiffness, damping, mass, from, to) {
    var k = stiffness || 100, c = damping == null ? 10 : damping, m = mass || 1, w0 = Math.sqrt(k / m), z = c / (2 * Math.sqrt(k * m));
    var x = function (t) {
      if (z < 1) { var wd = w0 * Math.sqrt(1 - z * z); return 1 - Math.exp(-z * w0 * t) * (Math.cos(wd * t) + (z * w0 / wd) * Math.sin(wd * t)); }
      if (z === 1) return 1 - Math.exp(-w0 * t) * (1 + w0 * t);
      var q = Math.sqrt(z * z - 1), r1 = -w0 * (z - q), r2 = -w0 * (z + q), A = r2 / (r2 - r1), B = -r1 / (r2 - r1);
      return 1 - (A * Math.exp(r1 * t) + B * Math.exp(r2 * t));
    };
    var T = 0, dt = 1 / 240; for (var t = 0; t < 30; t += dt) if (Math.abs(1 - x(t)) > 0.001) T = t;
    T = Math.max(dt, T + dt);
    return { duration: T, ease: function (p) { return p >= 1 ? 1 : x(p * T); }, at: x };
  };
  MW.springDB = MW.springDB || function (duration, bounce) {
    var z = 1 - (bounce == null ? 0.25 : bounce), w = Math.log(1000) / (Math.max(0.05, z) * (duration || 0.8));
    return MW.spring(w * w, 2 * z * w, 1);
  };
  MW.drive = MW.drive || function (tl, at, dur, fn) {
    var s = { t: 0 }; fn(0);
    tl.fromTo(s, { t: 0 }, { t: dur, duration: dur, ease: "none", immediateRender: false, onUpdate: function () { fn(s.t); } }, at);
    return at + dur;
  };
  var defaults = {"cards":".cf-c","spread":280,"angle":18,"start":0.3,"each":0.06,"k":220,"c":[22,12],"closeAt":2.3,"close":0.4};
  var run = function (el, tl, at, o) {
        var cards = Array.prototype.slice.call(el.querySelectorAll(o.cards)), n = cards.length, soft = MW.spring(o.k, o.c[0]), top = MW.spring(o.k, o.c[1]), io = gsap.parseEase("power2.inOut");
        return MW.drive(tl, at, o.closeAt + o.close + 0.2, function (t) {
          var cl = io(Math.max(0, Math.min(1, (t - o.closeAt) / o.close)));
          cards.forEach(function (cd, k) { var side = (n - 1) / 2 - k, st = o.start + k * o.each, sp = k === n - 1 ? top : soft, v = t > st ? sp.at(t - st) : 0; v *= 1 - cl; gsap.set(cd, { x: side * o.spread * v, rotation: side * o.angle * v }); });
        });
      };
  MW.motionCardFan = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
</script>
