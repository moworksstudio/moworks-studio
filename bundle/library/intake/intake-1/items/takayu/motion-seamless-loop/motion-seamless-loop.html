  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.motionSeamlessLoop(q(".gm"), tl, 0, {});

  Options (defaults in brackets):
      - loop: s (2): every period divides it (2 / 1 / 0.5 s), so the last frame meets the first
      - dots: (8)
      - radius: px (60)

  Notes: Idea and numbers (TakayuStudio lp-seamless, written here): Loop 2000 ms: 8 dots orbit r 60 once per loop (angle u x 360 deg + i x 45 deg), each dot's radius 6 + 4 sin(2 x 2 pi u + i) (period 1000 ms), a progress bar below; frame 0 equals frame N because every period divides 2000 (2000 / 1000 / 500 ms). Params: loop (2 s) · periods (2 / 1 / 0.5 s).
