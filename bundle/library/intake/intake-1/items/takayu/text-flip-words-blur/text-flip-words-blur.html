  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.textFlipWordsBlur(q(".fw"), tl, 0, {});

  Options (defaults in brackets):
      - words: the words in turn
      - swaps: s of each swap ([0.5, 2.7])
      - unit: px per reference unit (4)
      - loop: s (4.4)

  Notes: Idea and numbers (TakayuStudio tx-flip-words-blur, written here): Words cycle every 3 s. Exit (old word whole): x +40, y −40 px, scale 1 → 2, blur 0 → 8 px, opacity 1 → 0, 0.45 s easeOutCubic (cubic-bezier(.33,1,.68,1)). Enter: each char of the new word opacity 0 → 1, y +10 → 0, blur 8 → 0 px over 0.2 s ease-out, delay = word index × 0.3 s + char index × 0.05 s (demo +0.1 s, compressed to fit 1 s); the word wrapper rises y 10 → 0 on a spring (k 100, c 10). Demo swaps at 0.5 s and 2.7 s; loop 4.4 s. Params: words: danh sách từ · interval (3 s) · exit: phóng / nhoè (2 lần / 8 px) · charDelay (0.05 s) · wordDelay (0.3 s).
