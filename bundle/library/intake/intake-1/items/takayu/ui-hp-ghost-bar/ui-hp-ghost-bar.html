  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline

    MW.uiHpGhostBar(q(".gm"), tl, 0, {});

  Options (defaults in brackets):
      - from: (100)
      - to: (58)
      - hitAt: s (0.6)
      - lag: s the ghost waits (0.4)
      - trail: s it shrinks (0.5)
      - healAt: s (2.3)
      - label: 
      - loop: s (2.8)

  Notes: Idea and numbers (TakayuStudio catalog-game-hud-hp-ghost-bar, written here): px @320x200. Bar 220 x 14, r 4. At the hit (0.6 s) the accent fill jumps 100 → 58 % at once; a light-ink ghost fill behind it (opacity 1 for 100 ms, then 0.7) waits 400 ms then shrinks to 58 % in 500 ms inOut. Bar shakes ±3 px x for 200 ms (per-frame hash, linear decay). Readout 'NN / 100' turns accent; loss label '−42' centred in the gap while the gap > 3 %. Heal back 400 ms inOut at 2.3 s. Skip the time graph (lesson). Params: from / to: máu trước và sau (100 → 58) · hitAt: lúc trúng (0.6 s) · lag: chờ trước khi vệt co (0.4 s) · trail: thời gian vệt co (0.5 s). The fill drops at once; a light ghost behind it waits, then shrinks, so the loss stays readable.
