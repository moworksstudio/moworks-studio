  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline

    MW.motionInertiaGlide(q(".ig"), tl, 0, {});

  Options (defaults in brackets):
      - start: s the drag starts (0.5)
      - drag: px dragged (250)
      - dragTime: s (0.4), linear
      - tau: s time constant of the glide (0.3)
      - throw: px of the natural glide (700)
      - snap: px slot it lands on (240)
      - backAt: s it returns (2.6)
      - cursor: 

  Notes: Idea and numbers (TakayuStudio s-inertia, written here): Card dragged 50 px by a cursor (400 ms, linear), then released: it glides on x = release + D·(1 − e^(−t/τ)) and stops exactly on a slot tick (D chosen so the end lands on the 48 px grid). Recipe: τ 700 ms, power 0.8, end snapped (modifyTarget). Site demo: τ 250 ms, D 142 px. Params: tau: hằng số thời gian (0.7 s) · power (0.8) · snap: bước khấc (48 px). After release x = release + D (1 − e^(−t/τ)), normalised over 6 τ so it stops exactly on the slot (D chosen so the end lands on the grid).
