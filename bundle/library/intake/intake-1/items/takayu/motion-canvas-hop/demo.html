<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Infinite Canvas Jump - Demo</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
:root { --bg: #09090b; --fg: #fafafa; --card: #111114; --line: #27272a; }
* { box-sizing: border-box; }
html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); }
#demo { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); color: var(--fg); font-family: Inter, sans-serif; }
.center { position: absolute; inset: 0; display: grid; place-items: center; }
.row { display: flex; align-items: center; justify-content: center; gap: 48px; }
.col { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 32px; }
.h1 { font-size: 132px; font-weight: 800; letter-spacing: -0.035em; line-height: 1.1; text-align: center; }
.h2 { font-size: 84px; font-weight: 700; letter-spacing: -0.025em; line-height: 1.15; text-align: center; }
.p { font-size: 40px; line-height: 1.4; opacity: 0.72; text-align: center; }
.card { position: relative; border-radius: 28px; background: var(--card); border: 2px solid var(--line); overflow: hidden; }
.muted { opacity: 0.6; }

#demo { background: radial-gradient(100% 100% at 50% 40%, #1a1f33, #0b0d12); color: #e8ebf3; font-family: Inter, sans-serif; } .gm { position: absolute; inset: 0; }
.ui-cursor { position: absolute; left: 0; top: 0; z-index: 20; filter: drop-shadow(0 6px 10px rgba(0, 0, 0, 0.5)); }
.cv { position: absolute; inset: 0; overflow: hidden; } .cw { position: absolute; left: 0; top: 0; width: 5000px; height: 2500px; background-color: #10131d; background-image: radial-gradient(#2a3142 3px, transparent 3px); background-size: 60px 60px; }
.cw .fr { position: absolute; width: 420px; height: 264px; margin: -132px 0 0 -210px; border-radius: 24px; display: grid; place-items: center; font-size: 60px; font-weight: 800; }
.cw .fl { position: absolute; width: 300px; height: 190px; border-radius: 20px; background: #1b2130; border: 3px solid #262c3a; }
.mm { position: absolute; right: 70px; bottom: 60px; width: 420px; height: 210px; border-radius: 16px; background: rgba(21,26,40,0.9); border: 3px solid #3a4466; overflow: hidden; } .mm .vp { position: absolute; border: 3px solid #8b7bff; border-radius: 4px; }
.mm b { position: absolute; width: 34px; height: 22px; border-radius: 4px; }
    </style>
  </head>
  <body>
    <div id="demo" data-composition-id="mw-demo" data-start="0" data-width="1920" data-height="1080" data-duration="3.9">
<div class="gm cv"><div class="cw"><div class="fl" style="left:400px;top:400px"></div><div class="fl" style="left:1500px;top:300px"></div><div class="fl" style="left:2200px;top:1100px"></div><div class="fl" style="left:2800px;top:500px"></div><div class="fl" style="left:3400px;top:1900px"></div><div class="fl" style="left:1300px;top:1700px"></div><div class="fl" style="left:4300px;top:700px"></div><div class="fl" style="left:600px;top:1900px"></div>
<div class="fr" style="left:900px;top:900px;background:linear-gradient(160deg,#3dd6f5,#1580b8)">Khung A</div><div class="fr" style="left:4020px;top:1560px;background:linear-gradient(160deg,#a693ff,#6a4cf0)">Khung B</div></div>
<div class="mm"><b style="left:58.60000000000001px;top:64.60000000000001px;background:#3dd6f5"></b><b style="left:320.68px;top:120.04000000000002px;background:#8b7bff"></b><div class="vp"></div></div></div>
      <script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.drive = MW.drive || function (tl, at, dur, fn) {
    var s = { t: 0 }; fn(0);
    tl.fromTo(s, { t: 0 }, { t: dur, duration: dur, ease: "none", immediateRender: false, onUpdate: function () { fn(s.t); } }, at);
    return at + dur;
  };
  var defaults = {"world":".cw","from":[900,900],"to":[4020,1560],"zoom":2,"at":0.45,"duration":1.8,"minimap":null,"worldSize":[5000,2500],"fadeAt":3.55,"loop":3.9};
  var run = function (el, tl, at, o) {
        var world = el.querySelector(o.world), mini = o.minimap ? el.querySelector(o.minimap) : null, vp = mini ? mini.querySelector(".vp") : null, io = gsap.parseEase("power2.inOut"), A = o.from, B = o.to;
        return MW.drive(tl, at, o.loop, function (t) {
          var W = el.offsetWidth, Hh = el.offsetHeight, u = io(Math.max(0, Math.min(1, (t - o.at) / o.duration))), z = o.zoom * Math.pow(0.21, Math.sin(Math.PI * u));
          var cx = A[0] + (B[0] - A[0]) * u, cy = A[1] + (B[1] - A[1]) * u;
          world.style.transformOrigin = "0 0"; world.style.transform = "translate(" + W / 2 + "px," + Hh / 2 + "px) scale(" + z + ") translate(" + (-cx) + "px," + (-cy) + "px)";
          if (vp) { var mw = mini.offsetWidth / o.worldSize[0]; vp.style.left = (cx - W / z / 2) * mw + "px"; vp.style.top = (cy - Hh / z / 2) * mw + "px"; vp.style.width = W / z * mw + "px"; vp.style.height = Hh / z * mw + "px"; }
          el.style.opacity = t > o.fadeAt ? String(Math.max(0, 1 - (t - o.fadeAt) / 0.3)) : "1";
        });
      };
  MW.motionCanvasHop = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
      </script>
      <script>
        (function () {
          var tl = gsap.timeline({ paused: true });
          var q = function (s) { return document.querySelector(s); }, qa = function (s) { return Array.prototype.slice.call(document.querySelectorAll(s)); };
          MW.motionCanvasHop(q(".cv"), tl, 0, { minimap: ".mm" });
          tl.set({}, {}, 3.9);
          // register only when every motion is ready (MW.pending: e.g. a WebGL texture still decoding), as HyperFrames asks of async builds
          var go = function () { window.__timelines = window.__timelines || {}; window.__timelines["mw-demo"] = tl; };
          if (window.MW && MW.pending && MW.pending.length) Promise.all(MW.pending).then(go, go); else go();
        })();
      </script>
    </div>
  </body>
</html>
