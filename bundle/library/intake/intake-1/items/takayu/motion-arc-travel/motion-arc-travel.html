  Source: motion-reference.takayustudio.jp/#motion=arc-travel (read 12/10/2026).
  Khối vuông đi theo một cung Bézier bậc hai, giữ nguyên hướng, không xoay.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.motionArcTravel(q(".at"), tl, 0.3, {});

  Options (defaults in brackets):
      - to: [x, y] px of the end ([1080, 0])
      - control: [x, y] px of the Bézier control point ([540, −840]: the apex about −420)
      - duration: s (0.8)
      - ease: (sine.inOut)
      - hold: s held at the end (0.6)

  Notes: Idea and numbers (TakayuStudio arc-travel, written here): Square follows a quadratic Bézier, rotation fixed. Recipe: x 0 → 90 → 180 px with y 0 → −70 → 0 (apex at 400 ms), 800 ms sine.inOut. Site demo: P0 (0,0), control (104,−124), P2 (208,0) (apex −62 px), traversed at constant speed in 2200 ms linear. Control lines and labels are guides only. Params: duration (0.8 s) · x (180 px) · height: độ cao đỉnh cung (70 px) · ease (sine.inOut). The square keeps its orientation along the arc.
-->

<script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.drive = MW.drive || function (tl, at, dur, fn) {
    var s = { t: 0 }; fn(0);
    tl.fromTo(s, { t: 0 }, { t: dur, duration: dur, ease: "none", immediateRender: false, onUpdate: function () { fn(s.t); } }, at);
    return at + dur;
  };
  var defaults = {"to":[1080,0],"control":[540,-840],"duration":0.8,"ease":"sine.inOut","hold":0.6};
  var run = function (el, tl, at, o) {
        var e = gsap.parseEase(o.ease);
        return MW.drive(tl, at, o.duration + o.hold, function (t) { var u = e(Math.max(0, Math.min(1, t / o.duration))), b = 2 * (1 - u) * u, q = u * u; gsap.set(el, { x: b * o.control[0] + q * o.to[0], y: b * o.control[1] + q * o.to[1] }); });
      };
  MW.motionArcTravel = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
</script>
