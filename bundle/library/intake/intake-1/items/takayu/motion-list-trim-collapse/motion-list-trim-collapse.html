  Con trỏ bấm xoá dòng 2: dòng đó co lại và mờ đi, các dòng dưới dồn lên lấp chỗ, rồi thông báo “Đã xoá · Hoàn tác” nảy lên.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.motionListTrimCollapse(q(".tc"), tl, 0, {});

  Options (defaults in brackets):
      - items: 
      - row: the row deleted (2)
      - clickAt: s (0.5)
      - close: the delete button inside a row
      - toast: a toast that springs up (k260 c22)
      - cursor: 
      - cols: 

  Notes: Idea and numbers (TakayuStudio list-trim-collapse, written here): Row 2 of 4 (24 px rows, 30 px pitch) is deleted after a cursor clicks its ×: opacity 1 → 0 and scaleY 1 → 0 (centre origin) in 250 ms power2.in; 100 ms later rows 3–4 move up one pitch (−30 px) in 350 ms power2.out and hold. A toast ('Deleted · Undo') springs up from below (spring k 260, d 22) 500 ms after the collapse starts. Params: collapse (0.25 s) · shift (0.35 s, −30 px) · toast: thông báo (k 260, d 22) · row: dòng xoá.
