  Các ký tự lần lượt rung nhẹ rồi rơi khỏi dòng theo trọng lực, xoay nghiêng ngẫu nhiên.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.textGravityDropOut(q(".tk-head"), tl, 0, {});

  Options (defaults in brackets):
      - gravity: px a second² (4500)
      - rotate: ± degrees (40)
      - drift: ± px a second (75)
      - stagger: s in a seeded order (0.12)
      - cap: s (0.8)
      - wobble: s each letter wobbles first (0.22)
      - start: s (0.8)
      - backAt: s (2.6)
      - seed: (3)
      - loop: s (3.2)

  Notes: Idea and numbers (TakayuStudio tx-gravity-drop-out, written here): Split chars, random order (seeded), 40 ms apart (demo 120 ms capped 0.8 s), from 0.8 s. Each char falls y 0 → 100vh in 1 s easeInQuad (labelled power2.in; demo true gravity y = ½·900 px/s²·t²), rotating to a seeded ±40° (demo reaches it at 0.7 s), x drift up to ±15 px/s. Demo: for 0.22 s before falling each char wobbles on its baseline (rot = sin(18w)·0.06·w rad, w 0 → 1). Loop: text fades back 2.6–3.1 s; loop 3.2 s. Params: duration (1 s) · stagger: ngẫu nhiên (0.04 s) · rotate (±40°) · drop (100vh) · wobble: rung trước khi rơi (0.22 s).
-->
