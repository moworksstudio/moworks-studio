  Cube Rotation (TakayuStudio (motion-reference), No licence stated: idea and numbers only, written from the idea (site read 12/10/2026)).
  Source: motion-reference.takayustudio.jp/#motion=3d-cube (read 12/10/2026).
  Một khối lập phương sáu mặt (ảnh hoặc chữ) xoay đều quanh trục dọc, hơi nghiêng xuống để thấy mặt trên.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.cardCube(q(".cb"), tl, 0, {});

  Options (defaults in brackets):
      - faces: the six faces: front, right, back, left, top, bottom
      - period: s a turn (4), linear
      - tilt: degrees toward the viewer (20; the site's demo about 29)
      - perspective: × the parent's width (1.1)
      - duration: s (8)

  Notes: Idea and numbers (TakayuStudio 3d-cube, written here): CSS 3D cube, 6 faces (pictures or text), perspective about 1.1 x the frame width; rotateY 0 -> 360 deg over 4000 ms linear with a fixed rotateX 20 deg (demo ~29 deg), faces z-sorted, seamless loop. Params: period (4 s) · tilt (20°) · perspective (1.1 × khung).
-->

<div class="st"><div class="cb"><div class="face" style="background-image:url(assets/a.svg)"></div><div class="face" style="background:linear-gradient(150deg, #a693ff, #6a4cf0)">Ý tưởng</div><div class="face" style="background-image:url(assets/b.svg)"></div><div class="face" style="background:linear-gradient(150deg, #3dd6f5, #1580b8)">Dựng</div><div class="face" style="background-image:url(assets/c.svg)"></div><div class="face" style="background:linear-gradient(150deg, #ffb18f, #ff6f91)">Xuất</div></div></div>

</style>

<script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.drive = MW.drive || function (tl, at, dur, fn) {
    var s = { t: 0 }; fn(0);
    tl.fromTo(s, { t: 0 }, { t: dur, duration: dur, ease: "none", immediateRender: false, onUpdate: function () { fn(s.t); } }, at);
    return at + dur;
  };
  var defaults = {"faces":".face","period":4,"tilt":20,"perspective":1.1,"duration":8};
  var run = function (el, tl, at, o) {
        var F = Array.prototype.slice.call(el.querySelectorAll(o.faces)), s = el.offsetWidth, R = [[0, 0], [0, 90], [0, 180], [0, 270], [90, 0], [-90, 0]], host = el.parentNode;
        el.style.transformStyle = "preserve-3d"; host.style.perspective = o.perspective * host.clientWidth + "px";
        F.forEach(function (f, i) { var r = R[i % 6]; f.style.position = "absolute"; f.style.inset = "0"; f.style.backfaceVisibility = "hidden"; f.style.transform = "rotateX(" + r[0] + "deg) rotateY(" + r[1] + "deg) translateZ(" + s / 2 + "px)"; });
        return MW.drive(tl, at, o.duration, function (t) { el.style.transform = "rotateX(" + -o.tilt + "deg) rotateY(" + (360 * t / o.period).toFixed(3) + "deg)"; });
      };
  MW.cardCube = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
</script>
