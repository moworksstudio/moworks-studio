  Phần tử lao sang phải và mờ đi, ba bản sao nhạt dần chạy trễ phía sau như vệt bóng.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.motionTrailExit(q(".te"), tl, 0.3, {});

  Options (defaults in brackets):
      - x: px (1050)
      - duration: s (0.52, ease-in quart)
      - copies: (3)
      - delay: s each (0.032)
      - weights: opacity of each copy ([0.42, 0.24, 0.12])
      - fadeIn: s it fades in first (0.25)

  Notes: Idea and numbers (TakayuStudio trail-exit, written here): Exit to the right: main element x 0 → +175 px (recipe / readout; the demo moves 210 px on a 320 px canvas, ≈×6 at 1920) and opacity 1 → 0 in 520 ms power3.in (easeInQuart). Three copies under it run the same tween 32, 64 and 96 ms later at 0.42 / 0.24 / 0.12 of its opacity and vanish with it. Entrance before it: fade in 250 ms power2.out. Params: duration (0.52 s) · x: quãng lao (175 px) · copies (3) · delay: trễ mỗi bản (32 ms) · ease (power3.in).
