<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Camera Dolly UI - Demo</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
:root { --bg: #09090b; --fg: #fafafa; --card: #111114; --line: #27272a; }
* { box-sizing: border-box; }
html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); }
#demo { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); color: var(--fg); font-family: Inter, sans-serif; }
.center { position: absolute; inset: 0; display: grid; place-items: center; }
.row { display: flex; align-items: center; justify-content: center; gap: 48px; }
.col { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 32px; }
.h1 { font-size: 132px; font-weight: 800; letter-spacing: -0.035em; line-height: 1.1; text-align: center; }
.h2 { font-size: 84px; font-weight: 700; letter-spacing: -0.025em; line-height: 1.15; text-align: center; }
.p { font-size: 40px; line-height: 1.4; opacity: 0.72; text-align: center; }
.card { position: relative; border-radius: 28px; background: var(--card); border: 2px solid var(--line); overflow: hidden; }
.muted { opacity: 0.6; }

#demo { background: radial-gradient(100% 100% at 50% 40%, #1a1f33, #0b0d12); color: #e8ebf3; font-family: Inter, sans-serif; } .gm { position: absolute; inset: 0; }
.ui-cursor { position: absolute; left: 0; top: 0; z-index: 20; filter: drop-shadow(0 6px 10px rgba(0, 0, 0, 0.5)); }
.dl { position: absolute; inset: 0; } .dl > div { position: absolute; left: 50%; top: 50%; border-radius: 40px; box-sizing: border-box; }
.bk { width: 918px; height: 594px; margin: -297px 0 0 -459px; background: #1b2130; border: 4px solid #2a3350; padding: 50px; font-size: 46px; font-weight: 700; color: #9aa3b8; }
.fr { width: 648px; height: 400px; margin: -200px 0 0 -324px; background: linear-gradient(160deg, #a693ff, #6a4cf0); display: grid; place-items: center; font-size: 64px; font-weight: 800; box-shadow: 0 40px 90px rgba(0,0,0,0.5); }
    </style>
  </head>
  <body>
    <div id="demo" data-composition-id="mw-demo" data-start="0" data-width="1920" data-height="1080" data-duration="4">
<div class="gm dl"><div class="bk" data-z="260" data-x="-216" data-y="-130">Bảng phía sau</div><div class="fr" data-z="0" data-x="238" data-y="140">Lớp phía trước</div></div>
      <script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.drive = MW.drive || function (tl, at, dur, fn) {
    var s = { t: 0 }; fn(0);
    tl.fromTo(s, { t: 0 }, { t: dur, duration: dur, ease: "none", immediateRender: false, onUpdate: function () { fn(s.t); } }, at);
    return at + dur;
  };
  var defaults = {"cam":110,"focal":360,"at":0.4,"duration":1.5,"backAt":3};
  var run = function (el, tl, at, o) {
        var Ls = Array.prototype.slice.call(el.querySelectorAll("[data-z]")), io = gsap.parseEase("power2.inOut");
        return MW.drive(tl, at, o.backAt + 0.9, function (t) {
          var cam = t < o.at ? 0 : t < o.at + o.duration ? o.cam * io((t - o.at) / o.duration) : t < o.backAt ? o.cam : o.cam * (1 - io(Math.min(1, (t - o.backAt) / 0.9)));
          Ls.forEach(function (l) { var z = +l.getAttribute("data-z"), s = o.focal / (o.focal + z - cam), dx = +(l.getAttribute("data-x") || 0), dy = +(l.getAttribute("data-y") || 0); gsap.set(l, { scale: s, x: dx * s, y: dy * s }); });
        });
      };
  MW.motionDollyLayers = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
      </script>
      <script>
        (function () {
          var tl = gsap.timeline({ paused: true });
          var q = function (s) { return document.querySelector(s); }, qa = function (s) { return Array.prototype.slice.call(document.querySelectorAll(s)); };
          MW.motionDollyLayers(q(".dl"), tl, 0, {});
          tl.set({}, {}, 4);
          // register only when every motion is ready (MW.pending: e.g. a WebGL texture still decoding), as HyperFrames asks of async builds
          var go = function () { window.__timelines = window.__timelines || {}; window.__timelines["mw-demo"] = tl; };
          if (window.MW && MW.pending && MW.pending.length) Promise.all(MW.pending).then(go, go); else go();
        })();
      </script>
    </div>
  </body>
</html>
