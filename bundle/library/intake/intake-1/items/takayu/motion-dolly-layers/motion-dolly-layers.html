  Source: motion-reference.takayustudio.jp/#motion=catalog-ui-spatial-camera-dolly-ui (read 12/10/2026).
  Hai lớp giao diện đặt ở hai độ sâu; máy quay tiến vào nên lớp trước to ra nhiều (×1.44) còn lớp sau to ít (×1.22), tạo thị sai chiều sâu, rồi lùi lại.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.motionDollyLayers(q(".dl"), tl, 0, {});

  Options (defaults in brackets):
      - cam: camera z it moves to (110)
      - focal: (360)
      - at: s (0.4)
      - duration: s (1.5)
      - backAt: s (3.0)

  Notes: Idea and numbers (TakayuStudio catalog-ui-spatial-camera-dolly-ui, written here): Two planes: FRONT (120x74, accent) at depth z 0 offset (+44, +26), BACK (170x110 card) at z 260 offset (−40, −24) (focal 360, so BACK starts at 0.58 scale). Camera z 0 → 110 over 1.5 s power2.inOut (0.4-1.9 s), back 3.0-3.9 s. Each layer scale = 360 / (360 + z − camera z) and its offset from the centre scales the same way: FRONT ×1.44, BACK ×1.22. Dashed outlines show the start sizes. Params: camera z (0 → 110) · depths ([0, 260]) · focal (360) · duration (1.5 s, power2.inOut). Layers carry data-z (depth) and data-x / data-y (offset from the centre, px); scale = focal / (focal + z − camera z), offsets scale the same.
-->

<div class="gm dl"><div class="bk" data-z="260" data-x="-216" data-y="-130">Bảng phía sau</div><div class="fr" data-z="0" data-x="238" data-y="140">Lớp phía trước</div></div>

</style>

<script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.drive = MW.drive || function (tl, at, dur, fn) {
    var s = { t: 0 }; fn(0);
    tl.fromTo(s, { t: 0 }, { t: dur, duration: dur, ease: "none", immediateRender: false, onUpdate: function () { fn(s.t); } }, at);
    return at + dur;
  };
  var defaults = {"cam":110,"focal":360,"at":0.4,"duration":1.5,"backAt":3};
  var run = function (el, tl, at, o) {
        var Ls = Array.prototype.slice.call(el.querySelectorAll("[data-z]")), io = gsap.parseEase("power2.inOut");
        return MW.drive(tl, at, o.backAt + 0.9, function (t) {
          var cam = t < o.at ? 0 : t < o.at + o.duration ? o.cam * io((t - o.at) / o.duration) : t < o.backAt ? o.cam : o.cam * (1 - io(Math.min(1, (t - o.backAt) / 0.9)));
          Ls.forEach(function (l) { var z = +l.getAttribute("data-z"), s = o.focal / (o.focal + z - cam), dx = +(l.getAttribute("data-x") || 0), dy = +(l.getAttribute("data-y") || 0); gsap.set(l, { scale: s, x: dx * s, y: dy * s }); });
        });
      };
  MW.motionDollyLayers = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
</script>
