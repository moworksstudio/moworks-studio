  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.motionJellyEmphasis(q(".jel"), tl, 0.5, { shadow: ".jsh" });

  Options (defaults in brackets):
      - shadow: the contact shadow (its width follows scaleX)

  Notes: Idea and numbers (TakayuStudio jelly-emphasis, written here): Origin bottom centre; scaleX / scaleY keys 1/1 → 1.25/0.78 (260 ms) → 0.88/1.12 (430 ms) → 1.06/0.96 (590 ms) → 1/1 (760 ms), sine.inOut between keys; contact shadow width follows scaleX. Once. Params: keys (1.25/0.78 → 0.88/1.12 → 1.06/0.96) · duration (0.76 s) · origin (50 % 100 %).
-->
