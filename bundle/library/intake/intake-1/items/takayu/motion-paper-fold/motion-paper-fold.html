  Source: motion-reference.takayustudio.jp/#motion=catalog-ui-material-paper-fold (read 12/10/2026).
  Nửa phải của tấm thiệp gập lật quanh nếp giữa (180°) về phía người xem, tối dần theo góc và đổ bóng lên trang dưới, để lộ nội dung bên trong; rồi gập lại.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.motionPaperFold(q(".pf"), tl, 0.4, { closeAt: 2.2 });

  Options (defaults in brackets):
      - duration: s (1.1, power2.inOut)
      - ease: 
      - perspective: px (2100)
      - darken: at 90° (0.55)
      - shadow: cast on the page under it (0.45)
      - closeAt: s after the start to fold back (null)
      - cover: the flap's front (on the right half)
      - back: the flap's back (laid over the left half)
      - base: the page under the flap

  Notes: Idea and numbers (TakayuStudio catalog-ui-material-paper-fold, written here): Right half (80x96) folds about the centre crease toward the viewer: rotateY 0 → 180° (perspective 420) over 1.1 s power2.inOut at 0.4 s, back 2.6-3.6 s. Darken by angle, max 55 % (× sin); a cast shadow on the base page (45 % × sin). The front face shows the cover (accent, 'OPEN', foreshortened), the back face the inside content (bars); the base page holds the inner spread ('INSIDE' + lines). Params: angle (180°) · duration (1.1 s, power2.inOut) · darken (55 %) · shadow (45 %) · perspective (420). Folds toward the viewer about the centre crease; the faces swap at 90°, so neither reads mirrored.
-->

<script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.drive = MW.drive || function (tl, at, dur, fn) {
    var s = { t: 0 }; fn(0);
    tl.fromTo(s, { t: 0 }, { t: dur, duration: dur, ease: "none", immediateRender: false, onUpdate: function () { fn(s.t); } }, at);
    return at + dur;
  };
  var defaults = {"duration":1.1,"ease":"power2.inOut","perspective":2100,"darken":0.55,"shadow":0.45,"closeAt":null,"cover":".pf-c","back":".pf-k","base":".pf-r"};
  var run = function (el, tl, at, o) {
        var cv = el.querySelector(o.cover), bk = el.querySelector(o.back), base = el.querySelector(o.base), e = gsap.parseEase(o.ease), dk1 = document.createElement("div"), dk2 = document.createElement("div"), sh = document.createElement("div");
        [dk1, dk2].forEach(function (d, i) { d.style.cssText = "position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;border-radius:inherit;"; (i ? bk : cv).appendChild(d); });
        sh.style.cssText = "position:absolute;inset:0;pointer-events:none;opacity:0;background:linear-gradient(90deg,rgba(0,0,0,0.9),rgba(0,0,0,0.2));"; if (base) base.appendChild(sh);
        gsap.set(cv, { transformOrigin: "0% 50%" }); gsap.set(bk, { transformOrigin: "100% 50%" });
        return MW.drive(tl, at, o.closeAt == null ? o.duration : o.closeAt + o.duration, function (t) {
          var A = 180 * e(Math.max(0, Math.min(1, t / o.duration))); if (o.closeAt != null) A -= 180 * e(Math.max(0, Math.min(1, (t - o.closeAt) / o.duration)));
          var s = Math.sin(A * Math.PI / 180), front = A <= 90;
          gsap.set(cv, { rotationY: -A, transformPerspective: o.perspective }); gsap.set(bk, { rotationY: 180 - A, transformPerspective: o.perspective });
          cv.style.visibility = front ? "visible" : "hidden"; bk.style.visibility = front ? "hidden" : "visible"; dk1.style.opacity = dk2.style.opacity = String(o.darken * s); sh.style.opacity = String(o.shadow * s);
        });
      };
  MW.motionPaperFold = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
