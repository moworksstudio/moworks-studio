  Float (TakayuStudio (motion-reference), No licence stated: idea and numbers only, written from the idea (site read 12/10/2026)).
  Source: motion-reference.takayustudio.jp/#motion=lp-float (read 12/10/2026).
  Vật trôi lên xuống chậm theo hình sin, bóng dưới chân co giãn theo cùng nhịp.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.motionFloatShadow(q(".fs"), tl, 0, { shadow: ".fs-sh" });

  Options (defaults in brackets):
      - amp: px (40; 6 at UI size)
      - period: s (3), sine
      - shrink: how much the shadow narrows at the top (0.15)
      - shadow: the shadow element (optional)
      - shadowOpacity: (0.85)
      - duration: s (6)

  Notes: Idea and numbers (TakayuStudio lp-float, written here): Object y = A sin(2 pi t / 3 s), A 6 px (demo 10 px), sine, seamless 3 s loop; a flat shadow ellipse below (scaleY 0.25, 85 % opacity) changes width by 1.5 % per px of lift (+-15 % in the demo) in antiphase (the demo widens it as the object rises; physically it should shrink). Params: amp (6 px) · period (3 s) · shadow (±15 %). The shadow narrows as the object rises (the site's demo widens it; physically it shrinks).
-->

<div class="st"><div class="fs-w"><div class="fs"></div><div class="fs-sh"></div></div></div>

<style>

</style>

<script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.drive = MW.drive || function (tl, at, dur, fn) {
    var s = { t: 0 }; fn(0);
    tl.fromTo(s, { t: 0 }, { t: dur, duration: dur, ease: "none", immediateRender: false, onUpdate: function () { fn(s.t); } }, at);
    return at + dur;
  };
  var defaults = {"amp":40,"period":3,"shrink":0.15,"shadow":null,"shadowOpacity":0.85,"duration":6};
  var run = function (el, tl, at, o) {
        var sh = o.shadow ? document.querySelector(o.shadow) : null;
        return MW.drive(tl, at, o.duration, function (t) { var lift = o.amp * Math.sin(2 * Math.PI * t / o.period), k = lift / o.amp; gsap.set(el, { y: -lift }); if (sh) { gsap.set(sh, { scaleX: 1 - o.shrink * k }); sh.style.opacity = String(o.shadowOpacity * (1 - 0.4 * o.shrink * k)); } });
      };
  MW.motionFloatShadow = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
</script>
