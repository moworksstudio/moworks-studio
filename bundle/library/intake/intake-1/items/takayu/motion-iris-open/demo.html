<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Iris Open - Demo</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
:root { --bg: #09090b; --fg: #fafafa; --card: #111114; --line: #27272a; }
* { box-sizing: border-box; }
html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); }
#demo { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); color: var(--fg); font-family: Inter, sans-serif; }
.center { position: absolute; inset: 0; display: grid; place-items: center; }
.row { display: flex; align-items: center; justify-content: center; gap: 48px; }
.col { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 32px; }
.h1 { font-size: 132px; font-weight: 800; letter-spacing: -0.035em; line-height: 1.1; text-align: center; }
.h2 { font-size: 84px; font-weight: 700; letter-spacing: -0.025em; line-height: 1.15; text-align: center; }
.p { font-size: 40px; line-height: 1.4; opacity: 0.72; text-align: center; }
.card { position: relative; border-radius: 28px; background: var(--card); border: 2px solid var(--line); overflow: hidden; }
.muted { opacity: 0.6; }

#demo { background: radial-gradient(100% 100% at 50% 45%, #1a1f33, #0b0d12); color: #e8ebf3; font-family: Inter, sans-serif; }
.st { position: absolute; inset: 0; display: grid; place-items: center; } .cd { width: 760px; height: 440px; border-radius: 40px; background: #1b2130; border: 3px solid #2a3350; padding: 60px; box-sizing: border-box; } .cd b { display: block; width: 50%; height: 50px; border-radius: 25px; background: #8b7bff; margin-bottom: 50px; } .cd i { display: block; height: 30px; border-radius: 15px; background: #3a4466; margin-top: 30px; }
    </style>
  </head>
  <body>
    <div id="demo" data-composition-id="mw-demo" data-start="0" data-width="1920" data-height="1080" data-duration="2.5">
<div class="st"><div class="cd"><b></b><i></i><i style="width:60%"></i></div></div>
      <script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.drive = MW.drive || function (tl, at, dur, fn) {
    var s = { t: 0 }; fn(0);
    tl.fromTo(s, { t: 0 }, { t: dur, duration: dur, ease: "none", immediateRender: false, onUpdate: function () { fn(s.t); } }, at);
    return at + dur;
  };
  var defaults = {"duration":0.76,"pre":0.25,"x":0.5,"y":0.5,"rim":6,"dot":16,"accent":"#a99bff","exitAt":null};
  var run = function (el,tl,at,o
  ) {
  var host = el.parentNode; if (getComputedStyle(host).position === "static") host.style.position = "relative";
  var ghost = function () { var g = el.cloneNode(true); g.removeAttribute("id"); g.style.position = "absolute"; g.style.margin = "0"; g.style.pointerEvents = "none"; g.style.opacity = "0"; g.style.left = el.offsetLeft + "px"; g.style.top = el.offsetTop + "px"; g.style.width = el.offsetWidth + "px"; g.style.height = el.offsetHeight + "px"; host.insertBefore(g, el); return g; };
  var add = function (css) { var d = document.createElement("div"); d.style.cssText = "position:absolute;pointer-events:none;" + css; host.appendChild(d); return d; };
  var cx0 = el.offsetLeft + el.offsetWidth / 2, cy0 = el.offsetTop + el.offsetHeight / 2;
  var e = gsap.parseEase("power3.out"), bo = gsap.parseEase("back.out(1.7)"), W = el.offsetWidth, Hh = el.offsetHeight, px = W * o.x, py = Hh * o.y, R = 1.5 * Math.hypot(W, Hh) / 2, far = Math.max(Math.hypot(px, py), Math.hypot(W - px, py), Math.hypot(px, Hh - py), Math.hypot(W - px, Hh - py));
  var ring = add("border-radius:50%;box-sizing:border-box;border:" + o.rim + "px solid " + o.accent + ";opacity:0;"), dot = add("width:" + o.dot + "px;height:" + o.dot + "px;margin:-" + o.dot / 2 + "px 0 0 -" + o.dot / 2 + "px;border-radius:50%;background:" + o.accent + ";left:" + (el.offsetLeft + px) + "px;top:" + (el.offsetTop + py) + "px;opacity:0;");
  return MW.drive(tl, at, o.exitAt == null ? o.pre + o.duration : o.exitAt + 0.32, function (t) { var d = bo(Math.max(0, Math.min(1, t / 0.25))), u = Math.max(0, Math.min(1, (t - o.pre) / o.duration)), r = R * e(u), x = o.exitAt != null ? Math.max(0, Math.min(1, (t - o.exitAt) / 0.32)) : 0;
    el.style.clipPath = "circle(" + r.toFixed(1) + "px at " + px.toFixed(1) + "px " + py.toFixed(1) + "px)"; el.style.opacity = String(1 - x); dot.style.opacity = String(t > 0 ? Math.max(0, 1 - Math.max(0, (t - o.pre) / 0.15)) : 0); dot.style.transform = "scale(" + d.toFixed(3) + ")";
    ring.style.width = ring.style.height = 2 * r + "px"; ring.style.left = el.offsetLeft + px - r + "px"; ring.style.top = el.offsetTop + py - r + "px"; ring.style.opacity = u > 0 && r < far ? "1" : "0"; });
  };
  MW.motionIrisOpen = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
      </script>
      <script>
        (function () {
          var tl = gsap.timeline({ paused: true });
          var q = function (s) { return document.querySelector(s); }, qa = function (s) { return Array.prototype.slice.call(document.querySelectorAll(s)); };
          MW.motionIrisOpen(q(".cd"), tl, 0.3, { exitAt: 1.8 });
          tl.set({}, {}, 2.5);
          // register only when every motion is ready (MW.pending: e.g. a WebGL texture still decoding), as HyperFrames asks of async builds
          var go = function () { window.__timelines = window.__timelines || {}; window.__timelines["mw-demo"] = tl; };
          if (window.MW && MW.pending && MW.pending.length) Promise.all(MW.pending).then(go, go); else go();
        })();
      </script>
    </div>
  </body>
</html>
