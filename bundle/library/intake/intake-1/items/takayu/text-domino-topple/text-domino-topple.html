  Một quả bóng lăn vào đẩy chữ đầu, từng chữ cái đổ vào chữ kế tiếp như quân domino, chữ cuối ngã xuống sàn và nảy nhẹ.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.textDominoTopple(q(".tk-head"), tl, 0, { ball: ".dm-ball" });

  Options (defaults in brackets):
      - spacing: letter spacing, em (0.42)
      - ball: the ball that pushes the first letter

  Notes: Idea and numbers (TakayuStudio tx-domino-topple, written here): Spacing 0.42 em; pivot at each char's bottom-right. An accent ball rolls in to the first char 0.25–0.7 s (power1.in). From 0.7 s char j starts at j × 0.12 s (≤ 1.6 s total), falls power1.in in 0.12 s to its contact angle asin(gap / cap height) (≈35°), then leans on with the next char's progress to its final angle. Last char: 0 → 86° in 0.3 s power1.in, then dips ~7° and back (e^(−7t) |sin 14t|). Reset 3.45–3.95 s back.out. Loop 4.2 s. Params: giãn chữ (0.42 em) · cách nhau (0.12 s) · góc chữ cuối (86°).
-->

<div class="tk-stage"><div><h1 class="tk-head ">DOMINO</h1></div></div>

<script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.split = MW.split || function (el, mode) {
    el = MW.el(el);
    if (el.__mwSplit) return el.__mwSplit;
    var seg = typeof Intl !== "undefined" && Intl.Segmenter ? new Intl.Segmenter("vi", { granularity: "grapheme" }) : null;
    var graphemes = function (s) { if (seg) { var out = []; var it = seg.segment(s)[Symbol.iterator](), r; while (!(r = it.next()).done) out.push(r.value.segment); return out; } return Array.from(s); };
    var res = { chars: [], words: [], lines: [] };
    var walk = function (node) {
      var kids = Array.prototype.slice.call(node.childNodes);
      for (var k = 0; k < kids.length; k++) {
        var n = kids[k];
        if (n.nodeType === 1) { if (n.tagName === "BR") continue; walk(n); continue; }
        if (n.nodeType !== 3) continue;
        var text = n.nodeValue.normalize("NFC"), frag = document.createDocumentFragment();
        var parts = text.split(/(\s+)/);
        for (var p = 0; p < parts.length; p++) {
          var part = parts[p];
          if (!part) continue;
          if (/^\s+$/.test(part)) { frag.appendChild(document.createTextNode(part)); continue; }
          var w = document.createElement("span");
          w.className = "mw-w"; w.style.display = "inline-block"; w.style.whiteSpace = "nowrap";
          if (mode === "words") w.textContent = part;
          else { var gs = graphemes(part); for (var g = 0; g < gs.length; g++) { var c = document.createElement("span"); c.className = "mw-ch"; c.style.display = "inline-block"; c.textContent = gs[g]; w.appendChild(c); res.chars.push(c); } }
          res.words.push(w); frag.appendChild(w);
        }
        node.replaceChild(frag, n);
      }
    };
    walk(el);
    var top = null, line = null;
    for (var i = 0; i < res.words.length; i++) { var y = res.words[i].offsetTop; if (top === null || Math.abs(y - top) > 2) { top = y; line = []; res.lines.push(line); } line.push(res.words[i]); }
    el.__mwSplit = res;
    return res;
  };
  MW.drive = MW.drive || function (tl, at, dur, fn) {
    var s = { t: 0 }; fn(0);
    tl.fromTo(s, { t: 0 }, { t: dur, duration: dur, ease: "none", immediateRender: false, onUpdate: function () { fn(s.t); } }, at);
    return at + dur;
  };
  var defaults = {"spacing":0.42,"ball":null};
  var run = function (el, tl, at, o) {
        var ch = MW.split(el, "chars").chars, n = ch.length, fs = parseFloat(getComputedStyle(el).fontSize), p1 = gsap.parseEase("power1.in"), bk = gsap.parseEase("back.out"), ball = o.ball ? MW.el(o.ball) : null, step = Math.min(0.12, 1.6 / Math.max(1, n - 1));
        el.style.letterSpacing = o.spacing + "em"; ch.forEach(function (c) { c.style.transformOrigin = "100% 92%"; });
        var contact = Math.asin(Math.min(1, o.spacing / 0.72)) * 57.3, fin = ch.map(function (_, j) { return j === n - 1 ? 86 : contact + 18 * j / Math.max(1, n - 1); });
        var A = function (j, t) { var d = t - 0.7 - j * step; if (d < 0) return 0; if (j === n - 1) { if (d < 0.3) return 86 * p1(d / 0.3); var dd = d - 0.3; return 86 - 7 * Math.exp(-7 * dd) * Math.abs(Math.sin(14 * dd)); } var a = contact * p1(Math.min(1, d / 0.12)); var nx = A(j + 1, t) / fin[j + 1]; return a + (fin[j] - contact) * Math.min(1, Math.max(0, nx)); };
        return MW.drive(tl, at, 4.2, function (t) {
          var rs = t > 3.45 ? 1 - bk(Math.min(1, (t - 3.45) / 0.5)) : 1;
          ch.forEach(function (c, j) { gsap.set(c, { rotation: A(j, t) * rs }); });
          if (ball) { var u = p1(Math.max(0, Math.min(1, (t - 0.25) / 0.45))), r0 = ch[0].getBoundingClientRect(), hb = el.parentNode.getBoundingClientRect(); gsap.set(ball, { x: -500 * (1 - u), rotation: 360 * u }); ball.style.left = (r0.left - hb.left - ball.offsetWidth) + "px"; ball.style.opacity = t < 3.45 ? "1" : String(1 - (t - 3.45) / 0.3); }
        });
      };
  MW.textDominoTopple = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
</script>
