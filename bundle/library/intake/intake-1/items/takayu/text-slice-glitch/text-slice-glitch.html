  Source: motion-reference.takayustudio.jp/#motion=tx-slice-glitch (read 12/10/2026).
  Chữ bị cắt thành 6–8 lát ngang, vài lát giật lệch sang ngang tới 24 px trong 1–3 khung rồi trở lại.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.textSliceGlitch(q(".tk-head"), tl, 0, {});

  Options (defaults in brackets):
      - slices: (7)
      - offset: ± px (96)
      - step: s per update (0.067: 15 a second)
      - group: updates per burst decision (4)
      - chance: a group bursts above this seed (0.25)
      - ghost: opacity of the clean text underneath (0.18)
      - bursts: [[from, to] s, ...]
      - accent: the most shifted slice
      - seed: (5)
      - loop: s (3)

  Notes: Idea and numbers (TakayuStudio tx-slice-glitch, written here): 6–8 horizontal slices (cut positions jittered ±35 % per burst); in a burst (1–3 frames at 15 fps updates, 50–80 ms) slices with seed > 0.45 shift x by a seeded ±24 px; 18 % ghost of the clean text underneath; bursts only in set windows (e.g. 0.3–1.15 s and 2.25–2.75 s). Demo: 7 slices, steps of 67 ms in groups of 4 (burst if seed > 0.25), the most-shifted slice turns accent; loop 3 s. CSS fallback: 4 band copies, 2.4 s steps, jolt −18 / +11 px at 90 / 92 %. Params: slices: số lát (6–8) · offset: độ lệch (±24 px) · burst: 1–3 khung · rate (15 lần/giây) · seed.
-->
