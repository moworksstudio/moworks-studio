  Appeal (TakayuStudio (motion-reference), No licence stated: idea and numbers only, written from the idea (site read 12/10/2026)).
  Source: motion-reference.takayustudio.jp/#motion=appeal (read 12/10/2026).
  Núm công tắc chạy 180 ms, hơi giãn giữa đường, màu rãnh và nhãn đổi trễ 40 ms.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.uiToggleAppeal(q(".tg"), tl, 0.3, { label: ".tg-l" });

  Options (defaults in brackets):
      - knob: 
      - label: the ON / OFF label
      - travel: px (280)
      - knobTime: s (0.18, power2.out)
      - colorDelay: s the colour and label follow (0.04)
      - stretch: px wider mid-move (32)
      - period: s between flips (1)
      - flips: (4)
      - on: track colour on
      - off: track colour off
      - onText: 
      - offText: 

  Notes: Idea and numbers (TakayuStudio appeal, written here): Toggle (120×50 track, 34 px knob): the knob travels 70 px in 180 ms power2.out, widening by up to 8 px mid-move (sine); the track colour and the ON / OFF label follow 40 ms behind (a 180 ms power2.inOut ramp from 40 ms; the colour flips at its half-way, 130 ms). The site alternates on / off every second. Params: knob (0.18 s) · color_delay (40 ms) · stretch (8 px).
-->

<div class="st"><div class="tg-w"><div class="tg"><div class="tg-k"></div></div><div class="tg-l">TẮT</div></div></div>

<style>

</style>

<script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.drive = MW.drive || function (tl, at, dur, fn) {
    var s = { t: 0 }; fn(0);
    tl.fromTo(s, { t: 0 }, { t: dur, duration: dur, ease: "none", immediateRender: false, onUpdate: function () { fn(s.t); } }, at);
    return at + dur;
  };
  var defaults = {"knob":".tg-k","label":null,"travel":280,"knobTime":0.18,"colorDelay":0.04,"stretch":32,"period":1,"flips":4,"on":"#8b7bff","off":"#2a3142","onText":"BẬT","offText":"TẮT"};
  var run = function (el, tl, at, o) {
        var kn = el.querySelector(o.knob), lb = o.label ? el.parentNode.querySelector(o.label) : null, p2 = gsap.parseEase("power2.out"), io = gsap.parseEase("power2.inOut"), mix = gsap.utils.interpolate(o.off, o.on), w0 = kn.offsetWidth;
        return MW.drive(tl, at, o.period * o.flips, function (t) {
          var k = Math.floor(t / o.period), u = t - k * o.period, from = k % 2 === 1, m = Math.min(1, u / o.knobTime), pos = from ? 1 - p2(m) : p2(m), cv = io(Math.max(0, Math.min(1, (u - o.colorDelay) / o.knobTime))), ex = o.stretch * Math.sin(Math.PI * m);
          gsap.set(kn, { x: o.travel * pos - ex / 2, width: w0 + ex }); el.style.background = mix(from ? 1 - cv : cv);
          if (lb) { var on = u >= o.colorDelay + o.knobTime / 2 ? !from : from; lb.textContent = on ? o.onText : o.offText; lb.style.color = on ? o.on : "#8f9ab3"; }
        });
      };
  MW.uiToggleAppeal = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
</script>
