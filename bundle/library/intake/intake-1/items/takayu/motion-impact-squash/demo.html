<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Impact Squash - Demo</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
:root { --bg: #09090b; --fg: #fafafa; --card: #111114; --line: #27272a; }
* { box-sizing: border-box; }
html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); }
#demo { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); color: var(--fg); font-family: Inter, sans-serif; }
.center { position: absolute; inset: 0; display: grid; place-items: center; }
.row { display: flex; align-items: center; justify-content: center; gap: 48px; }
.col { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 32px; }
.h1 { font-size: 132px; font-weight: 800; letter-spacing: -0.035em; line-height: 1.1; text-align: center; }
.h2 { font-size: 84px; font-weight: 700; letter-spacing: -0.025em; line-height: 1.15; text-align: center; }
.p { font-size: 40px; line-height: 1.4; opacity: 0.72; text-align: center; }
.card { position: relative; border-radius: 28px; background: var(--card); border: 2px solid var(--line); overflow: hidden; }
.muted { opacity: 0.6; }

#demo { background: radial-gradient(100% 100% at 50% 45%, #1a1f33, #0b0d12); color: #e8ebf3; font-family: Inter, sans-serif; }
.fl { position: absolute; left: 260px; right: 260px; top: 860px; height: 4px; border-radius: 2px; background: #262c3a; } .is { position: absolute; left: 860px; top: 660px; width: 200px; height: 200px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #ff9ab9, #ff5d8f 60%, #c82e62); }
.is-sh { position: absolute; left: 820px; top: 846px; width: 280px; height: 28px; border-radius: 50%; background: rgba(0, 0, 0, 0.6); filter: blur(8px); }
    </style>
  </head>
  <body>
    <div id="demo" data-composition-id="mw-demo" data-start="0" data-width="1920" data-height="1080" data-duration="2">
<div class="fl"></div><div class="is-sh"></div><div class="is"></div>
      <script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.drive = MW.drive || function (tl, at, dur, fn) {
    var s = { t: 0 }; fn(0);
    tl.fromTo(s, { t: 0 }, { t: dur, duration: dur, ease: "none", immediateRender: false, onUpdate: function () { fn(s.t); } }, at);
    return at + dur;
  };
  var defaults = {"drop":450,"fall":0.65,"duration":0.62,"squash":[1.55,0.55],"tick":[60,10],"reach":[170,240],"accent":"#ffd23d","shadow":null};
  var run = function (el, tl, at, o) {
        var host = el.parentNode, p1 = gsap.parseEase("power1.in"), bo = gsap.parseEase("back.out(1.7)"), p2 = gsap.parseEase("power2.out"), sh = o.shadow ? host.querySelector(o.shadow) : null, ticks = [], A = [205, 228, -25, -48];
        if (getComputedStyle(host).position === "static") host.style.position = "relative"; gsap.set(el, { transformOrigin: "50% 100%" });
        var bx = el.offsetLeft + el.offsetWidth / 2, by = el.offsetTop + el.offsetHeight - 30, tc = o.duration * o.fall;
        for (var i = 0; i < 4; i++) { var k = document.createElement("div"); k.style.cssText = "position:absolute;left:0;top:0;pointer-events:none;opacity:0;transform-origin:0 50%;width:" + o.tick[0] + "px;height:" + o.tick[1] + "px;border-radius:" + o.tick[1] + "px;background:" + o.accent + ";"; host.appendChild(k); ticks.push(k); }
        return MW.drive(tl, at, Math.max(o.duration, tc + 0.25), function (t) {
          var y = 0, sx = 1, sy = 1;
          if (t < tc) { var u = t / tc; y = -o.drop * (1 - p1(u)); sy = 1 + 0.1 * u * u; sx = 1 / sy; } else { var b = bo(Math.min(1, (t - tc) / (o.duration - tc))); sx = o.squash[0] + (1 - o.squash[0]) * b; sy = o.squash[1] + (1 - o.squash[1]) * b; }
          gsap.set(el, { y: y, scaleX: sx, scaleY: sy });
          if (sh) { var f = 1 + y / o.drop; gsap.set(sh, { scaleX: 0.5 + 0.5 * f }); sh.style.opacity = String(0.25 + 0.75 * f); }
          var v = (t - tc) / 0.25, d = o.reach[0] + (o.reach[1] - o.reach[0]) * p2(Math.max(0, Math.min(1, v)));
          ticks.forEach(function (k, i) { var a = A[i] * Math.PI / 180; k.style.transform = "translate(" + (bx + Math.cos(a) * d) + "px," + (by + Math.sin(a) * d * 0.6 - o.tick[1] / 2) + "px) rotate(" + A[i] + "deg)"; k.style.opacity = v > 0 && v < 1 ? String(1 - v) : "0"; });
        });
      };
  MW.motionImpactSquash = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
      </script>
      <script>
        (function () {
          var tl = gsap.timeline({ paused: true });
          var q = function (s) { return document.querySelector(s); }, qa = function (s) { return Array.prototype.slice.call(document.querySelectorAll(s)); };
          MW.motionImpactSquash(q(".is"), tl, 0.3, { shadow: ".is-sh" });
          tl.set({}, {}, 2);
          // register only when every motion is ready (MW.pending: e.g. a WebGL texture still decoding), as HyperFrames asks of async builds
          var go = function () { window.__timelines = window.__timelines || {}; window.__timelines["mw-demo"] = tl; };
          if (window.MW && MW.pending && MW.pending.length) Promise.all(MW.pending).then(go, go); else go();
        })();
      </script>
    </div>
  </body>
</html>
