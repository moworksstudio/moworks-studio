<!--
  Impact Squash (TakayuStudio (motion-reference), No licence stated: idea and numbers only, written from the idea (site read 12/10/2026)).
  Source: motion-reference.takayustudio.jp/#motion=impact-squash (read 12/10/2026).
  Quả bóng rơi xuống, giãn dài khi rơi, bẹp ra 155 / 55 % đúng lúc chạm đất rồi bật về tròn.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.motionImpactSquash(q(".is"), tl, 0.3, { shadow: ".is-sh" });

  Options (defaults in brackets):
      - drop: px (450)
      - fall: share of the length falling (0.65, power1.in)
      - duration: s (0.62)
      - squash: [scaleX, scaleY] at contact ([1.55, 0.55]), then back.out to 1
      - tick: [length, thickness] px of the impact ticks ([60, 10])
      - reach: [from, to] px out from the centre ([170, 240])
      - accent: 
      - shadow: floor shadow (grows and darkens with the fall)

  Notes: Idea and numbers (TakayuStudio impact-squash, written here): Ball (r 20, origin bottom) drops 90 px (demo 99) in 403 ms power1.in, stretching to scaleY 1.1 / scaleX 1/1.1 by contact; on contact it is 1.55 / 0.55 at once and recovers to 1/1 by 620 ms through back.out (217 ms, slightly past 1). Two pairs of impact ticks flick out at the sides over 250 ms; the floor shadow grows and darkens with the fall. Params: duration (0.62 s) · drop: độ cao rơi (90 px) · squash (1.55 / 0.55) · recover (0.22 s).
-->

<script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.drive = MW.drive || function (tl, at, dur, fn) {
    var s = { t: 0 }; fn(0);
    tl.fromTo(s, { t: 0 }, { t: dur, duration: dur, ease: "none", immediateRender: false, onUpdate: function () { fn(s.t); } }, at);
    return at + dur;
  };
  var defaults = {"drop":450,"fall":0.65,"duration":0.62,"squash":[1.55,0.55],"tick":[60,10],"reach":[170,240],"accent":"#ffd23d","shadow":null};
  var run = function (el, tl, at, o) {
        var host = el.parentNode, p1 = gsap.parseEase("power1.in"), bo = gsap.parseEase("back.out(1.7)"), p2 = gsap.parseEase("power2.out"), sh = o.shadow ? host.querySelector(o.shadow) : null, ticks = [], A = [205, 228, -25, -48];
        if (getComputedStyle(host).position === "static") host.style.position = "relative"; gsap.set(el, { transformOrigin: "50% 100%" });
        var bx = el.offsetLeft + el.offsetWidth / 2, by = el.offsetTop + el.offsetHeight - 30, tc = o.duration * o.fall;
        for (var i = 0; i < 4; i++) { var k = document.createElement("div"); k.style.cssText = "position:absolute;left:0;top:0;pointer-events:none;opacity:0;transform-origin:0 50%;width:" + o.tick[0] + "px;height:" + o.tick[1] + "px;border-radius:" + o.tick[1] + "px;background:" + o.accent + ";"; host.appendChild(k); ticks.push(k); }
        return MW.drive(tl, at, Math.max(o.duration, tc + 0.25), function (t) {
          var y = 0, sx = 1, sy = 1;
          if (t < tc) { var u = t / tc; y = -o.drop * (1 - p1(u)); sy = 1 + 0.1 * u * u; sx = 1 / sy; } else { var b = bo(Math.min(1, (t - tc) / (o.duration - tc))); sx = o.squash[0] + (1 - o.squash[0]) * b; sy = o.squash[1] + (1 - o.squash[1]) * b; }
          gsap.set(el, { y: y, scaleX: sx, scaleY: sy });
          if (sh) { var f = 1 + y / o.drop; gsap.set(sh, { scaleX: 0.5 + 0.5 * f }); sh.style.opacity = String(0.25 + 0.75 * f); }
          var v = (t - tc) / 0.25, d = o.reach[0] + (o.reach[1] - o.reach[0]) * p2(Math.max(0, Math.min(1, v)));
          ticks.forEach(function (k, i) { var a = A[i] * Math.PI / 180; k.style.transform = "translate(" + (bx + Math.cos(a) * d) + "px," + (by + Math.sin(a) * d * 0.6 - o.tick[1] / 2) + "px) rotate(" + A[i] + "deg)"; k.style.opacity = v > 0 && v < 1 ? String(1 - v) : "0"; });
        });
      };
  MW.motionImpactSquash = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
</script>
