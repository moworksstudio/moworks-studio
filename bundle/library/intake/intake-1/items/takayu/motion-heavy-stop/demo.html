<!doctype html>
<html lang="vi">

    <title>Heavy Stop - Demo</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
:root { --bg: #09090b; --fg: #fafafa; --card: #111114; --line: #27272a; }
* { box-sizing: border-box; }
html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); }
#demo { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); color: var(--fg); font-family: Inter, sans-serif; }
.center { position: absolute; inset: 0; display: grid; place-items: center; }
.row { display: flex; align-items: center; justify-content: center; gap: 48px; }
.col { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 32px; }
.h1 { font-size: 132px; font-weight: 800; letter-spacing: -0.035em; line-height: 1.1; text-align: center; }
.h2 { font-size: 84px; font-weight: 700; letter-spacing: -0.025em; line-height: 1.15; text-align: center; }
.p { font-size: 40px; line-height: 1.4; opacity: 0.72; text-align: center; }
.card { position: relative; border-radius: 28px; background: var(--card); border: 2px solid var(--line); overflow: hidden; }
.muted { opacity: 0.6; }

#demo { background: radial-gradient(100% 100% at 50% 45%, #1a1f33, #0b0d12); color: #e8ebf3; font-family: Inter, sans-serif; }
.fl { position: absolute; left: 160px; right: 160px; top: 760px; height: 4px; border-radius: 2px; background: #262c3a; } .hs { position: absolute; left: 260px; top: 560px; width: 200px; height: 200px; border-radius: 36px; background: linear-gradient(180deg, #5a6275, #2f3546); } .hs-l { position: absolute; left: 1560px; top: 460px; height: 300px; border-left: 4px dashed #ffd23d; }
    </style>
  </head>
  <body>
    <div id="demo" data-composition-id="mw-demo" data-start="0" data-width="1920" data-height="1080" data-duration="1.8">
<div class="fl"></div><div class="hs-l"></div><div class="hs"></div>
      <script>
(function () {

    return at + dur;

  var add = function (css) { var d = document.createElement("div"); d.style.cssText = "position:absolute;pointer-events:none;" + css; host.appendChild(d); return d; };
  var cx0 = el.offsetLeft + el.offsetWidth / 2, cy0 = el.offsetTop + el.offsetHeight / 2;
  var p3 = gsap.parseEase("power3.out"), io = gsap.parseEase("power2.inOut"), dust = []; gsap.set(el, { transformOrigin: "100% 100%" }); for (var i = 0; i < o.dust; i++) dust.push(add("width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;background:#8f9ab3;opacity:0;"));
  var ar = 0.462, bx = el.offsetLeft + el.offsetWidth, by = el.offsetTop + el.offsetHeight;
  return MW.drive(tl, at, 1.2, function (t) { var x = t < ar ? o.x * p3(t / ar) : o.x + (o.x - o.over - o.x) * io(Math.min(1, (t - ar) / (0.68 - ar))), sq = 0;
    if (t > 0.32 && t < ar) { var q = (t - 0.32) / (ar - 0.32); sq = o.squash * q * q; } else if (t >= ar) { var w = t - ar; sq = o.squash * Math.exp(-11 * w) * Math.cos(26 * w); } gsap.set(el, { x: x, scaleX: 1 - sq, scaleY: 1 + sq });
    dust.forEach(function (d, i) { var u = (t - 0.4) / 0.55; if (u <= 0 || u >= 1) { d.style.opacity = "0"; return; } var a = -Math.PI * (0.15 + 0.7 * i / (o.dust - 1)); d.style.left = bx + o.x + Math.cos(a) * 140 * u + "px"; d.style.top = by - 10 + Math.sin(a) * 80 * u + "px"; d.style.opacity = String(0.7 * (1 - u)); }); });

      <script>
        (function () {
          var tl = gsap.timeline({ paused: true });
          var q = function (s) { return document.querySelector(s); }, qa = function (s) { return Array.prototype.slice.call(document.querySelectorAll(s)); };

</html>
