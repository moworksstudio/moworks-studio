  Chữ được cắt thành nhiều dải mỏng, mỗi dải lệch ngang theo một làn sóng chạy qua hai lượt, đầu và cuối đều thẳng hàng.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.effectDisplaceWave(q(".tk-head"), tl, 0.3, {});

  Options (defaults in brackets):
      - bands: (26)
      - amp: px (48)
      - duration: s (2.2, linear): the crest crosses twice

  Notes: Idea and numbers (TakayuStudio displacement-wave, written here): Element cut into 26 horizontal bands (recipe: 10). Band i shifts x by 16 px x sin(0.16 i - 4 pi tau) x sin^2(pi tau), tau 0 -> 1 linear over 2200 ms (recipe 1000 ms): the crest travels across the bands twice and the envelope is zero at both ends, so the outline is clean at start and end. Areas outside the band zone stay still. Params: bands (26) · amp (16 px) · duration (2.2 s). x = amp × sin(0.16 i − 4π τ) × sin²(π τ): clean at the start and at the end.
-->

<script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.drive = MW.drive || function (tl, at, dur, fn) {
    var s = { t: 0 }; fn(0);
    tl.fromTo(s, { t: 0 }, { t: dur, duration: dur, ease: "none", immediateRender: false, onUpdate: function () { fn(s.t); } }, at);
    return at + dur;
  };
  var defaults = {"bands":26,"amp":48,"duration":2.2};
  var run = function (el,tl,at,o
  ) {
  var host = el.parentNode; if (getComputedStyle(host).position === "static") host.style.position = "relative";
  var clone = function () { var g = el.cloneNode(true); g.removeAttribute("id"); g.style.position = "absolute"; g.style.margin = "0"; g.style.pointerEvents = "none"; g.style.boxSizing = "border-box";
    g.style.left = el.offsetLeft + "px"; g.style.top = el.offsetTop + "px"; var br = el.getBoundingClientRect(); g.style.width = (br.width + 0.5) + "px"; g.style.height = el.offsetHeight + "px"; host.insertBefore(g, el.nextSibling); return g; };
  var n = o.bands, B = []; for (var i = 0; i < n; i++) { var g = clone(); g.style.clipPath = "inset(" + (100 * i / n).toFixed(3) + "% 0 " + (100 - 100 * (i + 1) / n).toFixed(3) + "% 0)"; g.style.opacity = "0"; B.push(g); }
  return MW.drive(tl, at, o.duration, function (t) {
    var tau = Math.max(0, Math.min(1, t / o.duration)), on = tau > 0 && tau < 1, env = Math.pow(Math.sin(Math.PI * tau), 2);
    el.style.opacity = on ? "0" : "1"; B.forEach(function (g, i) { gsap.set(g, { x: o.amp * Math.sin(0.16 * i - 4 * Math.PI * tau) * env }); g.style.opacity = on ? "1" : "0"; });
  });
  };
  MW.effectDisplaceWave = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
</script>
