  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.mapPinDrop(q(".gm"), tl, 0, {});

  Options (defaults in brackets):
      - pins: (9)
      - stagger: s (0.1; 0.06 in the recipe)
      - seed: pin spots

  Notes: Idea and numbers (TakayuStudio dv-pins, written here): Pins at seeded spots on a map panel; pin i drops 40 px with easeOutBounce over 400 ms, starting 60 ms apart (recipe; the demo 100 ms, 9 pins), opacity 0 -> 1 in the first third; 1 in 3 accent. Params: pins · stagger (60 ms) · drop (40 px, 0.4 s) · seed.

  MW.stage320 = MW.stage320 || function (host) {

    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
