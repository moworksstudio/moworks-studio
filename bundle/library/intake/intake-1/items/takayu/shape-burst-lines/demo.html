<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Radiating Burst Lines - Demo</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
:root { --bg: #09090b; --fg: #fafafa; --card: #111114; --line: #27272a; }
* { box-sizing: border-box; }
html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); }
#demo { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); color: var(--fg); font-family: Inter, sans-serif; }
.center { position: absolute; inset: 0; display: grid; place-items: center; }
.row { display: flex; align-items: center; justify-content: center; gap: 48px; }
.col { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 32px; }
.h1 { font-size: 132px; font-weight: 800; letter-spacing: -0.035em; line-height: 1.1; text-align: center; }
.h2 { font-size: 84px; font-weight: 700; letter-spacing: -0.025em; line-height: 1.15; text-align: center; }
.p { font-size: 40px; line-height: 1.4; opacity: 0.72; text-align: center; }
.card { position: relative; border-radius: 28px; background: var(--card); border: 2px solid var(--line); overflow: hidden; }
.muted { opacity: 0.6; }

#demo { background: radial-gradient(100% 100% at 50% 45%, #1a1f33, #0b0d12); color: #e8ebf3; font-family: Inter, sans-serif; } .sv { position: absolute; inset: 0; display: grid; place-items: center; }
.bl { position: relative; } .bl b { position: absolute; inset: 0; display: grid; place-items: center; font-size: 300px; font-weight: 900; color: #ffd23d; }
    </style>
  </head>
  <body>
    <div id="demo" data-composition-id="mw-demo" data-start="0" data-width="1920" data-height="1080" data-duration="2.6">
<div class="sv"><div class="bl"><svg class="bl-s" width="1600" height="1000" viewBox="0 0 320 200"><line stroke="#ffd23d" stroke-width="4" opacity="0"/><line stroke="#ffd23d" stroke-width="4" opacity="0"/><line stroke="#ffd23d" stroke-width="4" opacity="0"/><line stroke="#ffd23d" stroke-width="4" opacity="0"/><line stroke="#ffd23d" stroke-width="4" opacity="0"/><line stroke="#ffd23d" stroke-width="4" opacity="0"/><line stroke="#ffd23d" stroke-width="4" opacity="0"/><line stroke="#ffd23d" stroke-width="4" opacity="0"/><line stroke="#ffd23d" stroke-width="4" opacity="0"/><line stroke="#ffd23d" stroke-width="4" opacity="0"/><line stroke="#ffd23d" stroke-width="4" opacity="0"/><line stroke="#ffd23d" stroke-width="4" opacity="0"/></svg><b>!</b></div></div>
      <script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.drive = MW.drive || function (tl, at, dur, fn) {
    var s = { t: 0 }; fn(0);
    tl.fromTo(s, { t: 0 }, { t: dur, duration: dur, ease: "none", immediateRender: false, onUpdate: function () { fn(s.t); } }, at);
    return at + dur;
  };
  var defaults = {"r0":30,"r1":80,"stagger":0.02,"cx":160,"cy":100};
  var run = function (el, tl, at, o) {
        var lines = el.querySelectorAll("line"), out = gsap.parseEase("power2.out"), inn = gsap.parseEase("power2.in");
        return MW.drive(tl, at, (lines.length - 1) * o.stagger + 0.6, function (t) {
          Array.prototype.forEach.call(lines, function (l, i) { var a = i / lines.length * 2 * Math.PI, d = t - i * o.stagger, h = o.r0 + (o.r1 - o.r0) * out(Math.max(0, Math.min(1, d / 0.3))), tt = o.r0 + (o.r1 - o.r0) * inn(Math.max(0, Math.min(1, (d - 0.3) / 0.3)));
            l.setAttribute("x1", o.cx + Math.cos(a) * tt); l.setAttribute("y1", o.cy + Math.sin(a) * tt); l.setAttribute("x2", o.cx + Math.cos(a) * h); l.setAttribute("y2", o.cy + Math.sin(a) * h); l.setAttribute("opacity", d > 0 && h - tt > 0.3 ? "1" : "0"); });
        });
      };
  MW.shapeBurstLines = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
      </script>
      <script>
        (function () {
          var tl = gsap.timeline({ paused: true });
          var q = function (s) { return document.querySelector(s); }, qa = function (s) { return Array.prototype.slice.call(document.querySelectorAll(s)); };
          MW.shapeBurstLines(q(".bl-s"), tl, 0.4, {}); MW.shapeBurstLines(q(".bl-s"), tl, 1.6, {});
          tl.set({}, {}, 2.6);
          // register only when every motion is ready (MW.pending: e.g. a WebGL texture still decoding), as HyperFrames asks of async builds
          var go = function () { window.__timelines = window.__timelines || {}; window.__timelines["mw-demo"] = tl; };
          if (window.MW && MW.pending && MW.pending.length) Promise.all(MW.pending).then(go, go); else go();
        })();
      </script>
    </div>
  </body>
</html>
