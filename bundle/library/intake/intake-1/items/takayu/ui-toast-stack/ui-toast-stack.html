    MW.uiToastStack(q(".gm"), tl, 0, {});

      - times: s each toast enters ([0.3, 0.95, 1.6])

      - stiffness: (260)
      - damping: (24)
      - slide: px (40)
      - exitAt: s, newest first 0.06 s apart (2.5)
      - labels: 
      - loop: s (3.2)
