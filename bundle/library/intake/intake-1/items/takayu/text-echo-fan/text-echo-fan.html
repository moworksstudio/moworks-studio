  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.textEchoFan(q(".tk-head"), tl, 0, {});

  Options (defaults in brackets):
      - angle: degrees per copy (7)
      - pivot: em below the text where the fan turns (2.8)
      - stroke: px (3)
      - accent: the nearest pair's colour
      - mute: the others'

  Notes: Idea and numbers (TakayuStudio tx-repetition-echo, written here): Solid word stays still. 6 outline copies (1.1 px stroke, no fill; the nearest pair accent, others mute), m = 1–3 on each side, rotate ±m × 7° × p about a pivot at the text's centre x, 150 px below its bottom (≈2.8 em at 54 px), scale 1 − 0.04 m × p, opacity (1 − m / 4) × p (0.75 / 0.5 / 0.25). p 0 → 1 over 0.4–1.4 s, cubic-bezier(.65,0,.35,1) (power2.inOut-like); folds back 2.3–3.2 s. Loop 3.6 s. Params: số bản sao (6) · góc mỗi bản (7°) · thời gian xoè (1 s) · tâm quạt (2.8 em dưới chữ).

(function () {

  MW.bezier = MW.bezier || function (x1, y1, x2, y2) {
    var cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx, cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
    var X = function (t) { return ((ax * t + bx) * t + cx) * t; }, Y = function (t) { return ((ay * t + by) * t + cy) * t; }, dX = function (t) { return (3 * ax * t + 2 * bx) * t + cx; };
    return function (p) {
      if (p <= 0) return 0; if (p >= 1) return 1;
      var t = p, i, d;
      for (i = 0; i < 8; i++) { d = X(t) - p; if (Math.abs(d) < 1e-6) return Y(t); var s = dX(t); if (Math.abs(s) < 1e-6) break; t -= d / s; }
      var lo = 0, hi = 1; t = p;
      for (i = 0; i < 40; i++) { d = X(t); if (Math.abs(d - p) < 1e-6) break; if (d < p) lo = t; else hi = t; t = (lo + hi) / 2; }
      return Y(t);

  };
  MW.CSS_EASE = { ease: [0.25, 0.1, 0.25, 1], easeIn: [0.42, 0, 1, 1], easeOut: [0, 0, 0.58, 1], easeInOut: [0.42, 0, 0.58, 1] };
  MW.EASES = MW.EASES || { "css-ease": [0.25, 0.1, 0.25, 1], "css-in": [0.42, 0, 1, 1], "css-out": [0, 0, 0.58, 1], "css-in-out": [0.42, 0, 0.58, 1],
    md3: [0.2, 0, 0, 1], "md3-emph": [0.05, 0.7, 0.1, 1], "md3-acc": [0.3, 0, 1, 1], "md3-dec": [0, 0, 0, 1], whip: [0.9, 0, 0.1, 1], glide: [0.4, 0, 0.2, 1],
    house: [0.83, 0, 0.17, 1], "in-out": [0.65, 0, 0.35, 1] };
  MW.ez = MW.ez || function (name) {
    if (typeof name === "function") return name;
    var b = MW.EASES[name]; if (b) return MW.bezier(b[0], b[1], b[2], b[3]);
    var m = /^cubic-bezier\(([^)]+)\)$/.exec(name || ""); if (m) { var v = m[1].split(",").map(Number); return MW.bezier(v[0], v[1], v[2], v[3]); }

  MW.drive = MW.drive || function (tl, at, dur, fn) {

  var defaults = {"angle":7,"pivot":2.8,"stroke":3,"accent":"#8b7bff","mute":"#4a5478"};
  var run = function (el, tl, at, o) {
        var io = MW.ez("in-out"), copies = [], host = el.parentNode, fs = parseFloat(getComputedStyle(el).fontSize);
        if (getComputedStyle(host).position === "static") host.style.position = "relative";
        [1, 2, 3].forEach(function (m) { [-1, 1].forEach(function (sd) { var c = el.cloneNode(true); c.removeAttribute("id"); c.style.position = "absolute"; c.style.margin = "0"; c.style.left = el.offsetLeft + "px"; c.style.top = el.offsetTop + "px"; c.style.width = el.offsetWidth + "px"; c.style.color = "transparent"; c.style.webkitTextStroke = o.stroke + "px " + (m === 1 ? o.accent : o.mute); c.style.pointerEvents = "none"; c.style.transformOrigin = "50% " + (el.offsetHeight + o.pivot * fs) + "px"; host.insertBefore(c, el); copies.push({ c: c, m: m, sd: sd }); }); });
        return MW.drive(tl, at, 3.6, function (t) {
          var p = io(Math.max(0, Math.min(1, (t - 0.4) / 1.0))) * (1 - io(Math.max(0, Math.min(1, (t - 2.3) / 0.9))));

        });

    var o = {}, k;
