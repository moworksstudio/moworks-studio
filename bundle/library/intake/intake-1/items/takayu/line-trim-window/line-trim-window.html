  Đường giữ nguyên, chỉ một đoạn dài 22 % chạy từ đầu tới cuối như một vệt sáng.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.lineTrimWindow(q(".tw"), tl, 0.22, { duration: 1.63 });

  Options (defaults in brackets):
      - length: share of the path lit (0.22)
      - duration: s (0.9), in-out
      - guide: opacity of the faint full path (0.18)

  Notes: Idea and numbers (TakayuStudio svg-trim-path, written here): pathLength = 1, stroke-dasharray 0.22 1; dashoffset 0.22 -> -1, so a 22 % window enters at the start and leaves past the end, 900 ms easeInOutCubic; faint full guide path under it. Demo 2.2 s: run between 10 % and 84 %. Site card (sh-trim): trim paths on a circle r 50, 8 px round cap: end 0 -> 1 over 0.2-0.9 s, start follows over 0.45-1.2 s, ease-in-out. Params: length: độ dài vệt (0.22) · duration (0.9 s) · ease (power2.inOut).
-->

(function () {

  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.drive = MW.drive || function (tl, at, dur, fn) {

    tl.fromTo(s, { t: 0 }, { t: dur, duration: dur, ease: "none", immediateRender: false, onUpdate: function () { fn(s.t); } }, at);
