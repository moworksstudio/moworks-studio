  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.motionLightTrail(q(".gm"), tl, 0.4, {});

  Options (defaults in brackets):
      - width: units of the arc (185 of 320)
      - arc: units high (34)
      - duration: s (0.9), power2.out

  Notes: Idea and numbers (TakayuStudio light-trail, written here): Head (r 7 px dot, 12 px glow, 3 px bright core) travels an arc 185 px wide, 34 px high (sine) in 900 ms power2.out; three trailing copies 36 / 72 / 108 ms behind in the demo (recipe: 18 ms steps), opacity 0.45 / 0.30 / 0.18, blur ~1 / 2 / 3 px, radius 6 / 5 / 4, plus a 6 px gradient stroke over the last 90 ms of path; copies merge into the head at rest. Params: duration (0.9 s) · x (185 px) · arc (34 px) · copies (3) · delay (36 ms).
