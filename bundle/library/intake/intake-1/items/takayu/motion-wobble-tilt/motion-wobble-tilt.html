  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.motionWobbleTilt(q(".wt"), tl, 0, { cursor: ".ui-cursor" });

  Options (defaults in brackets):
      - tap: s (0.5)
      - amp: rad (0.24)
      - freq: rad/s (9)
      - decay: (2.4)
      - fadeStart: s after the tap (1.5)
      - fadeEnd: (1.9)
      - cursor: an optional cursor that makes the clicks
      - approach: [x, y] px the cursor comes from
      - lead: s it arrives before a click

  Notes: Idea and numbers (TakayuStudio catalog-ui-button-wobble-tilt, written here): From rest at the tap (0.5 s): angle = 0.24 × e^(−2.4 t) × sin(9 t) rad (first swing about 9°), pivot at the bottom centre; faded to 0 between 1.5-1.9 s after the tap. Equivalent spring k144 d5.6 (site value). Button 130x44 r14. Params: at · amp (0.24 rad) · freq (9 rad/s) · decay (2.4) · pivot (đáy giữa). angle = amp × e^(−decay t) × sin(freq t) about the bottom centre; about a spring k 144, damping 5.6.
