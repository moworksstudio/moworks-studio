  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline

    MW.motionRowExpand(q(".re"), tl, 0.3, {});

  Options (defaults in brackets):
      - items: 
      - from: start height scale (0.08)
      - duration: s (0.525)
      - stagger: s (0.065)
      - ease: (cubic-bezier(.34,1.56,.64,1): back.out)
      - cols: 

  Notes: Idea and numbers (TakayuStudio list-expand, written here): Four rows open downward from a 1.5 px line (origin top): height scale 0.08 → 1 with overshoot (back.out, CSS bezier .34,1.56,.64,1), each 525 ms, 65 ms apart (720 ms in all); the row box fades in over the first third of its move and its content (clipped) fades in over the second half. Params: from: chiều cao đầu (0.08) · stagger (65 ms) · each (0.525 s) · ease (back.out).
