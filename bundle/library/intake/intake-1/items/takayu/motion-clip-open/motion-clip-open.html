  Image Clip Scrub (TakayuStudio (motion-reference), No licence stated: idea and numbers only, written from the idea (site read 12/10/2026)).
  Source: motion-reference.takayustudio.jp/#motion=image-clip-scrub (read 12/10/2026).
  Ảnh đứng yên, khung nhìn mở rộng từ một khe hẹp giữa ảnh ra đủ khung, góc bo nhỏ dần, như mở cửa sổ.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.motionClipOpen(q(".co-p"), tl, 0.4, { closeAt: 2.2 });

  Options (defaults in brackets):
      - insetY: % at the start, top and bottom (12)
      - insetX: % left and right (42)
      - radius: [start, end] px ([110, 30])
      - duration: s (1.2), in-out
      - closeAt: s after the start to close in 0.5 s (null)

  Notes: Idea and numbers (TakayuStudio image-clip-scrub, written here): The picture stays fixed (240x136 in the demo); its clip-path inset goes from 12 % (top / bottom) and 42 % (left / right) to 0, corner radius 22 → 6 px, 1.2 s power2.inOut (easeInOutCubic). Optional close: the reverse in 0.5 s. The image itself does not scale or move. Small arrows at the side edges show the opening while it moves. Params: inset (12 % / 42 % → 0) · radius (22 → 6 px) · duration (1.2 s) · ease (power2.inOut).
-->

<div class="co"><div class="co-p"></div></div>

<style>

</style>

<script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.drive = MW.drive || function (tl, at, dur, fn) {
    var s = { t: 0 }; fn(0);
    tl.fromTo(s, { t: 0 }, { t: dur, duration: dur, ease: "none", immediateRender: false, onUpdate: function () { fn(s.t); } }, at);
    return at + dur;
  };
  var defaults = {"insetY":12,"insetX":42,"radius":[110,30],"duration":1.2,"closeAt":null};
  var run = function (el, tl, at, o) {
        var io = gsap.parseEase("power2.inOut"), pin = gsap.parseEase("power2.in");
        return MW.drive(tl, at, o.closeAt == null ? o.duration : o.closeAt + 0.5, function (t) {
          var p = io(Math.max(0, Math.min(1, t / o.duration))); if (o.closeAt != null && t > o.closeAt) p = 1 - pin(Math.min(1, (t - o.closeAt) / 0.5));
          el.style.clipPath = "inset(" + o.insetY * (1 - p) + "% " + o.insetX * (1 - p) + "% round " + (o.radius[0] + (o.radius[1] - o.radius[0]) * p) + "px)";
        });
      };
  MW.motionClipOpen = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
</script>
