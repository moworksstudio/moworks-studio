  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.textLightLeakBurn(q(".lb"), tl, 0, {});

  Options (defaults in brackets):
      - cutAt: s the title cuts in, at the burn's peak (1.0)
      - offAt: s (3.15)
      - glow: accent glow colour (18 → 4 px, ×3 here)
      - title: the title
      - loop: s (3.8)
      - seed: drift

  Notes: Idea and numbers (TakayuStudio tx-light-leak-burn, written here): Three additive radial blobs (yellow, accent, yellow) drifting with noise; strength 0.35 × leak (in 0.25–0.9 s, out 3.15–3.65 s) + 0.55 × burn; burn keyed 0 (0.55 s) → 1 (1.0 s) → 0 (1.55 s), cubic-bezier(.65,0,.35,1); blob radii grow with burn (+100–140 px), plus a full-frame white at 85 % × burn. Title (44 px) cuts in at the burn peak (1.0 s) with an accent glow 18 → 4 px over 0.9 s power2.out; off 3.15–3.6 s. Loop 3.8 s. Params: đỉnh cháy (1.0 s) · thời gian cháy (0.55 → 1.55 s) · quầng sáng (18 → 4 px).
