<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Camera Kick HUD - Demo</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
:root { --bg: #09090b; --fg: #fafafa; --card: #111114; --line: #27272a; }
* { box-sizing: border-box; }
html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); }
#demo { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); color: var(--fg); font-family: Inter, sans-serif; }
.center { position: absolute; inset: 0; display: grid; place-items: center; }
.row { display: flex; align-items: center; justify-content: center; gap: 48px; }
.col { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 32px; }
.h1 { font-size: 132px; font-weight: 800; letter-spacing: -0.035em; line-height: 1.1; text-align: center; }
.h2 { font-size: 84px; font-weight: 700; letter-spacing: -0.025em; line-height: 1.15; text-align: center; }
.p { font-size: 40px; line-height: 1.4; opacity: 0.72; text-align: center; }
.card { position: relative; border-radius: 28px; background: var(--card); border: 2px solid var(--line); overflow: hidden; }
.muted { opacity: 0.6; }

#demo { background: #0b0d12; color: #e8ebf3; font-family: Inter, sans-serif; overflow: hidden; }
.wd { position: absolute; inset: -80px; background: linear-gradient(180deg, #1c2550 0%, #2b2357 60%, #171a2e 60%, #10121f 100%); }
.wd .bld { position: absolute; bottom: 40%; width: 160px; background: #11142a; } .wd .mz { position: absolute; left: 50%; top: 50%; width: 120px; height: 120px; margin: -60px; border-radius: 50%; border: 8px solid #ffd23d; opacity: 0; }
.hudc { position: absolute; inset: 60px; pointer-events: none; } .hudc i { position: absolute; width: 90px; height: 90px; border: 0 solid rgba(255,255,255,0.6); }
.hudc i:nth-child(1) { left: 0; top: 0; border-left-width: 6px; border-top-width: 6px; } .hudc i:nth-child(2) { right: 0; top: 0; border-right-width: 6px; border-top-width: 6px; }
.hudc i:nth-child(3) { left: 0; bottom: 0; border-left-width: 6px; border-bottom-width: 6px; } .hudc i:nth-child(4) { right: 0; bottom: 0; border-right-width: 6px; border-bottom-width: 6px; }
.xh { position: absolute; left: 50%; top: 50%; width: 80px; height: 80px; margin: -40px; } .xh b { position: absolute; background: #fff; } .xh .h { left: 0; right: 0; top: 37px; height: 6px; } .xh .v { top: 0; bottom: 0; left: 37px; width: 6px; }
.hm { position: absolute; left: 50%; top: 50%; width: 140px; height: 140px; margin: -70px; opacity: 0; background: linear-gradient(45deg, transparent 46%, #ff5d6c 46% 54%, transparent 54%), linear-gradient(-45deg, transparent 46%, #ff5d6c 46% 54%, transparent 54%); }
.ammo { position: absolute; right: 120px; bottom: 110px; font-size: 64px; font-weight: 900; letter-spacing: 0.04em; }
    </style>
  </head>
  <body>
    <div id="demo" data-composition-id="mw-demo" data-start="0" data-width="1920" data-height="1080" data-duration="3">
<div class="wd"><div class="bld" style="left:180px;height:200px"></div><div class="bld" style="left:420px;height:297px"></div><div class="bld" style="left:700px;height:394px"></div><div class="bld" style="left:1020px;height:231px"></div><div class="bld" style="left:1300px;height:328px"></div><div class="bld" style="left:1600px;height:425px"></div><div class="bld" style="left:1850px;height:262px"></div><div class="mz"></div></div>
<div class="hudc"><i></i><i></i><i></i><i></i></div><div class="xh"><b class="h"></b><b class="v"></b></div><div class="hm"></div><div class="ammo">ĐẠN 30</div>
      <script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.spring = MW.spring || function (stiffness, damping, mass, from, to) {
    var k = stiffness || 100, c = damping == null ? 10 : damping, m = mass || 1, w0 = Math.sqrt(k / m), z = c / (2 * Math.sqrt(k * m));
    var x = function (t) {
      if (z < 1) { var wd = w0 * Math.sqrt(1 - z * z); return 1 - Math.exp(-z * w0 * t) * (Math.cos(wd * t) + (z * w0 / wd) * Math.sin(wd * t)); }
      if (z === 1) return 1 - Math.exp(-w0 * t) * (1 + w0 * t);
      var q = Math.sqrt(z * z - 1), r1 = -w0 * (z - q), r2 = -w0 * (z + q), A = r2 / (r2 - r1), B = -r1 / (r2 - r1);
      return 1 - (A * Math.exp(r1 * t) + B * Math.exp(r2 * t));
    };
    var T = 0, dt = 1 / 240; for (var t = 0; t < 30; t += dt) if (Math.abs(1 - x(t)) > 0.001) T = t;
    T = Math.max(dt, T + dt);
    return { duration: T, ease: function (p) { return p >= 1 ? 1 : x(p * T); }, at: x };
  };
  MW.springDB = MW.springDB || function (duration, bounce) {
    var z = 1 - (bounce == null ? 0.25 : bounce), w = Math.log(1000) / (Math.max(0.05, z) * (duration || 0.8));
    return MW.spring(w * w, 2 * z * w, 1);
  };
  MW.drive = MW.drive || function (tl, at, dur, fn) {
    var s = { t: 0 }; fn(0);
    tl.fromTo(s, { t: 0 }, { t: dur, duration: dur, ease: "none", immediateRender: false, onUpdate: function () { fn(s.t); } }, at);
    return at + dur;
  };
  var defaults = {"shots":[0.5,1.2,1.9],"kx":20,"ky":45,"kr":0.57,"muzzle":null,"marker":null,"ammo":null,"ammoText":"ĐẠN ","ammoFrom":30};
  var run = function (el, tl, at, o) {
        var out = gsap.parseEase("power2.out"), sp = MW.spring(220, 18), ring = o.muzzle ? MW.el(o.muzzle) : null, hm = o.marker ? MW.el(o.marker) : null, am = o.ammo ? MW.el(o.ammo) : null, io = gsap.parseEase("power2.inOut");
        return MW.drive(tl, at, o.shots[o.shots.length - 1] + 1, function (t) {
          var k = 0, n = 0, last = -9;
          o.shots.forEach(function (s) { var d = t - s; if (d < 0) return; n++; last = s; k += d < 0.05 ? out(d / 0.05) : 1 - sp.at(d - 0.05); });
          gsap.set(el, { x: o.kx * k, y: -o.ky * k, rotation: -o.kr * k });
          var d = t - last;
          if (ring) { var u = Math.min(1, d / 0.3); gsap.set(ring, { scale: 0.25 + 0.75 * io(u) }); ring.style.opacity = d >= 0 && d < 0.3 ? String(1 - u) : "0"; }
          if (hm) hm.style.opacity = d >= 0 && d < 0.15 ? "1" : "0";
          if (am) am.firstChild.nodeValue = o.ammoText + (o.ammoFrom - n);
        });
      };
  MW.motionRecoilKick = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
      </script>
      <script>
        (function () {
          var tl = gsap.timeline({ paused: true });
          var q = function (s) { return document.querySelector(s); }, qa = function (s) { return Array.prototype.slice.call(document.querySelectorAll(s)); };
          MW.motionRecoilKick(q(".wd"), tl, 0, { muzzle: ".mz", marker: ".hm", ammo: ".ammo" });
          tl.set({}, {}, 3);
          // register only when every motion is ready (MW.pending: e.g. a WebGL texture still decoding), as HyperFrames asks of async builds
          var go = function () { window.__timelines = window.__timelines || {}; window.__timelines["mw-demo"] = tl; };
          if (window.MW && MW.pending && MW.pending.length) Promise.all(MW.pending).then(go, go); else go();
        })();
      </script>
    </div>
  </body>
</html>
