<!--
  Camera Kick HUD (TakayuStudio (motion-reference), No licence stated: idea and numbers only, written from the idea (site read 12/10/2026)).
  Source: motion-reference.takayustudio.jp/#motion=catalog-game-impact-fx-camera-kick (read 12/10/2026).
  Mỗi phát bắn, lớp thế giới giật lên và lệch nhẹ trong tích tắc rồi trở về bằng lò xo, các phát cộng dồn; khung HUD, tâm ngắm và số đạn đứng yên, chỉ có vòng loé đầu nòng.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.motionRecoilKick(q(".wd"), tl, 0, { muzzle: ".mz", marker: ".hm", ammo: ".ammo" });

  Options (defaults in brackets):
      - shots: seconds of each shot ([0.5, 1.2, 1.9])
      - kx: px (20)
      - ky: px up (45)
      - kr: degrees (0.57)
      - muzzle: the muzzle ring (in the world)
      - marker: the hit marker on the crosshair
      - ammo: the ammo readout
      - ammoText: its label
      - ammoFrom: rounds (30)

  Notes: Idea and numbers (TakayuStudio catalog-game-impact-fx-camera-kick, written here): px @320x200. World group only (the HUD stays fixed). Per shot at 0.5, 1.2, 1.9 s: k goes 0 → 1 in 50 ms outCubic, then back by 1 − spring k220 d18; kicks add up. World offset x +4k px, y −9k px, rotation −0.57k° (−0.01 rad). Muzzle ring r 4 → 16 (stroke 2) over 300 ms inOut in the world; hit-marker diagonals on the crosshair for 150 ms; ammo 30 → 27. Params: shots: lúc bắn (0.5 / 1.2 / 1.9 s) · kick: giật (y −9 px, x +4 px, −0.6°) · spring: lò xo về (k220 d18) · target: id lớp thế giới. Call it on the world group only: the HUD stays fixed.
-->

<div class="hudc"><i></i><i></i><i></i><i></i></div><div class="xh"><b class="h"></b><b class="v"></b></div><div class="hm"></div><div class="ammo">ĐẠN 30</div>

<script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.spring = MW.spring || function (stiffness, damping, mass, from, to) {
    var k = stiffness || 100, c = damping == null ? 10 : damping, m = mass || 1, w0 = Math.sqrt(k / m), z = c / (2 * Math.sqrt(k * m));
    var x = function (t) {
      if (z < 1) { var wd = w0 * Math.sqrt(1 - z * z); return 1 - Math.exp(-z * w0 * t) * (Math.cos(wd * t) + (z * w0 / wd) * Math.sin(wd * t)); }
      if (z === 1) return 1 - Math.exp(-w0 * t) * (1 + w0 * t);
      var q = Math.sqrt(z * z - 1), r1 = -w0 * (z - q), r2 = -w0 * (z + q), A = r2 / (r2 - r1), B = -r1 / (r2 - r1);
      return 1 - (A * Math.exp(r1 * t) + B * Math.exp(r2 * t));
    };
    var T = 0, dt = 1 / 240; for (var t = 0; t < 30; t += dt) if (Math.abs(1 - x(t)) > 0.001) T = t;
    T = Math.max(dt, T + dt);
    return { duration: T, ease: function (p) { return p >= 1 ? 1 : x(p * T); }, at: x };
  };
  MW.springDB = MW.springDB || function (duration, bounce) {
    var z = 1 - (bounce == null ? 0.25 : bounce), w = Math.log(1000) / (Math.max(0.05, z) * (duration || 0.8));
    return MW.spring(w * w, 2 * z * w, 1);
  };
  MW.drive = MW.drive || function (tl, at, dur, fn) {
    var s = { t: 0 }; fn(0);
    tl.fromTo(s, { t: 0 }, { t: dur, duration: dur, ease: "none", immediateRender: false, onUpdate: function () { fn(s.t); } }, at);
    return at + dur;
  };
  var defaults = {"shots":[0.5,1.2,1.9],"kx":20,"ky":45,"kr":0.57,"muzzle":null,"marker":null,"ammo":null,"ammoText":"ĐẠN ","ammoFrom":30};
  var run = function (el, tl, at, o) {
        var out = gsap.parseEase("power2.out"), sp = MW.spring(220, 18), ring = o.muzzle ? MW.el(o.muzzle) : null, hm = o.marker ? MW.el(o.marker) : null, am = o.ammo ? MW.el(o.ammo) : null, io = gsap.parseEase("power2.inOut");
        return MW.drive(tl, at, o.shots[o.shots.length - 1] + 1, function (t) {
          var k = 0, n = 0, last = -9;
          o.shots.forEach(function (s) { var d = t - s; if (d < 0) return; n++; last = s; k += d < 0.05 ? out(d / 0.05) : 1 - sp.at(d - 0.05); });
          gsap.set(el, { x: o.kx * k, y: -o.ky * k, rotation: -o.kr * k });
          var d = t - last;
          if (ring) { var u = Math.min(1, d / 0.3); gsap.set(ring, { scale: 0.25 + 0.75 * io(u) }); ring.style.opacity = d >= 0 && d < 0.3 ? String(1 - u) : "0"; }
          if (hm) hm.style.opacity = d >= 0 && d < 0.15 ? "1" : "0";
          if (am) am.firstChild.nodeValue = o.ammoText + (o.ammoFrom - n);
        });
      };
  MW.motionRecoilKick = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
</script>
