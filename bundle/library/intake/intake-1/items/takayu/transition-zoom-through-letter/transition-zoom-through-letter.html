  Một chữ lớn chứa hình cảnh tiếp theo bên trong, máy phóng thẳng vào nét dày nhất của chữ cái giữa cho tới khi hình đầy khung, rồi hình thay hẳn chữ.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.transitionZoomThroughLetter(q(".zt"), tl, 0, {});

  Options (defaults in brackets):
      - scale: zoom reached (60), exponential: scale = 60^z
      - focus: the point zoomed into, 0-1 of the word's box (the thickest stroke of the middle letter)
      - word: the word filled with the next picture
      - picture: the full picture that takes over

  Notes: Idea and numbers (TakayuStudio tx-text-window-zoom, written here): Word (92 px, weight 900, up to 2 lines) filled with the next picture through a text mask; a 35 % thin outline shows at rest. Zoom z 0 → 1 over 0.5–2.2 s, cubic-bezier(.65,0,.35,1); scale = 60^z (exponential). Origin = the thickest ink point of the middle letter, and that point slides to the frame centre as z goes 0 → 1. The full picture fades in 1.95–2.3 s linear, leaving only the picture. Loop: jump back at 3.25 s, picture fades out 3.3–3.9 s. Params: tỉ lệ (1 → 60, hàm mũ) · thời gian (1.7 s) · gốc phóng (nét dày nhất của chữ giữa) · chuyển sang hình (0.35 s).

<script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.bezier = MW.bezier || function (x1, y1, x2, y2) {
    var cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx, cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
    var X = function (t) { return ((ax * t + bx) * t + cx) * t; }, Y = function (t) { return ((ay * t + by) * t + cy) * t; }, dX = function (t) { return (3 * ax * t + 2 * bx) * t + cx; };
    return function (p) {
      if (p <= 0) return 0; if (p >= 1) return 1;
      var t = p, i, d;
      for (i = 0; i < 8; i++) { d = X(t) - p; if (Math.abs(d) < 1e-6) return Y(t); var s = dX(t); if (Math.abs(s) < 1e-6) break; t -= d / s; }
      var lo = 0, hi = 1; t = p;
      for (i = 0; i < 40; i++) { d = X(t); if (Math.abs(d - p) < 1e-6) break; if (d < p) lo = t; else hi = t; t = (lo + hi) / 2; }
      return Y(t);
    };
  };
  MW.CSS_EASE = { ease: [0.25, 0.1, 0.25, 1], easeIn: [0.42, 0, 1, 1], easeOut: [0, 0, 0.58, 1], easeInOut: [0.42, 0, 0.58, 1] };
  MW.EASES = MW.EASES || { "css-ease": [0.25, 0.1, 0.25, 1], "css-in": [0.42, 0, 1, 1], "css-out": [0, 0, 0.58, 1], "css-in-out": [0.42, 0, 0.58, 1],
    md3: [0.2, 0, 0, 1], "md3-emph": [0.05, 0.7, 0.1, 1], "md3-acc": [0.3, 0, 1, 1], "md3-dec": [0, 0, 0, 1], whip: [0.9, 0, 0.1, 1], glide: [0.4, 0, 0.2, 1],
    house: [0.83, 0, 0.17, 1], "in-out": [0.65, 0, 0.35, 1] };
  MW.ez = MW.ez || function (name) {
    if (typeof name === "function") return name;
    var b = MW.EASES[name]; if (b) return MW.bezier(b[0], b[1], b[2], b[3]);
    var m = /^cubic-bezier\(([^)]+)\)$/.exec(name || ""); if (m) { var v = m[1].split(",").map(Number); return MW.bezier(v[0], v[1], v[2], v[3]); }
    return gsap.parseEase(name || "none");
  };
  MW.drive = MW.drive || function (tl, at, dur, fn) {
    var s = { t: 0 }; fn(0);
    tl.fromTo(s, { t: 0 }, { t: dur, duration: dur, ease: "none", immediateRender: false, onUpdate: function () { fn(s.t); } }, at);
    return at + dur;
  };
  var defaults = {"scale":60,"focus":[0.5,0.55],"word":".zt-w","picture":".zt-full"};
  var run = function (el, tl, at, o) {
        var word = el.querySelector(o.word), full = el.querySelector(o.picture), io = MW.ez("in-out"), mid = null;
        return MW.drive(tl, at, 3.9, function (t) {
          if (!mid) { var r = word.getBoundingClientRect(), b = el.getBoundingClientRect(); mid = [r.left - b.left + r.width * o.focus[0], r.top - b.top + r.height * o.focus[1]]; word.style.transformOrigin = (r.width * o.focus[0]) + "px " + (r.height * o.focus[1]) + "px"; }
          var z = t < 3.25 ? io(Math.max(0, Math.min(1, (t - 0.5) / 1.7))) : 0, s = Math.pow(o.scale, z), W = el.offsetWidth, Hh = el.offsetHeight;
          gsap.set(word, { x: (W / 2 - mid[0]) * z, y: (Hh / 2 - mid[1]) * z, scale: s });
          var f = t < 3.25 ? Math.max(0, Math.min(1, (t - 1.95) / 0.35)) : 1 - Math.max(0, Math.min(1, (t - 3.3) / 0.6)); full.style.opacity = String(f);
        });
      };
  MW.transitionZoomThroughLetter = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
