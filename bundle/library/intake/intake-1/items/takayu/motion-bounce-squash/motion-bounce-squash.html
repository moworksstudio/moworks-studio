  Quả bóng rơi nảy nhiều lần, chỉ bẹp đúng khung chạm đất và bẹp yếu dần qua mỗi lần nảy.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.motionBounceSquash(q(".bs"), tl, 0.3, {});

  Options (defaults in brackets):
      - drop: px (560)
      - duration: s (1.6), bounce.out (contacts at 36 / 73 / 91 %)
      - squash: at the first contact (0.32 here; 0.5 × (1 − p))

  Notes: Idea and numbers (TakayuStudio e-custombounce, written here): Recipe: first contact at 400 ms; each bounce keeps 70 % of the previous height (strength 0.7) and lasts √0.7 of the previous, ~1200 ms in all; squash only on the 1–2 contact frames, weaker each bounce, origin bottom; slight stretch in the fast fall. Site demo: bounce.out over 1600 ms, 112 px drop (contacts at 36 / 73 / 91 %), squash = 0.5·(1 − p) within 4 % of the floor: scaleY 0.68 / 0.86 / 0.95, scaleX 1 + the same amount. Params: strength (0.7) · squash đầu (0.32) · duration (1.2 s) · origin (đáy).
-->

<div class="fl"></div><div class="bs"></div>

<script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.drive = MW.drive || function (tl, at, dur, fn) {
    var s = { t: 0 }; fn(0);
    tl.fromTo(s, { t: 0 }, { t: dur, duration: dur, ease: "none", immediateRender: false, onUpdate: function () { fn(s.t); } }, at);
    return at + dur;
  };
  var defaults = {"drop":560,"duration":1.6,"squash":0.5};
  var run = function (el, tl, at, o) {
        var bo = gsap.parseEase("bounce.out");
        el.style.transformOrigin = "50% 100%";
        return MW.drive(tl, at, o.duration, function (t) {
          var p = Math.max(0, Math.min(1, t / o.duration)), v = bo(p), h = o.drop * (1 - v), near = 1 - v < 0.04 && p > 0.05, sq = near ? o.squash * (1 - p) : 0, vel = (bo(Math.min(1, p + 0.01)) - bo(Math.max(0, p - 0.01))) / 0.02, st = !near ? Math.min(0.12, Math.abs(vel) * 0.03) : 0;
          gsap.set(el, { y: -h, scaleY: 1 - sq + st, scaleX: 1 + sq - st * 0.6 });
        });
      };
  MW.motionBounceSquash = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
</script>
