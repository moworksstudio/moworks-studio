<!--
  Vertical Subtitle (TakayuStudio (motion-reference), No licence stated: idea and numbers only, written from the idea (site read 12/10/2026)).
  Source: motion-reference.takayustudio.jp/#motion=tx-vertical-subtitle (read 12/10/2026).
  Khi chữ có sẵn trong hình chiếm phần dưới khung, phụ đề cắt sang chỗ khác không chuyển cảnh: tiếng Nhật thành cột dọc bên phải, tiếng Việt lên mép trên.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.textSubtitleReposition(q(".sr"), tl, 0, {});

  Options (defaults in brackets):
      - sub: 
      - burned: text that is part of the picture
      - start: s (0.3)
      - burnAt: s it appears (1.4)
      - moveAt: s the subtitle cuts to the top (1.95)
      - offAt: s (3.75)
      - top: px from the top when moved (70)
      - bottom: px from the bottom (90)
      - loop: s (4.2)

  Notes: Idea and numbers (TakayuStudio tx-vertical-subtitle, written here): Subtitle (14 px, white, 3.5 px dark outline) at the bottom from 0.3 s. At 1.4 s burned-in text appears in the bottom band of the picture. At 1.95 s the subtitle cuts, no transition, to the alternative place: Japanese → vertical columns at the right edge (≤ 11 chars per column, ≤ 2 columns, ≤ 15 px, top 9 px, right 14 px); Latin set sideways in a column (for Vietnamese films: the top of the frame instead). Off at 3.75 s. Loop 4.2 s. Params: vị trí thay thế (phải dọc / trên) · tối đa (11 chữ × 2 cột) · cỡ chữ (15 px). A cut, no transition. Japanese moves to vertical columns at the right edge; for Vietnamese films, to the top of the frame.
-->

<script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.drive = MW.drive || function (tl, at, dur, fn) {
    var s = { t: 0 }; fn(0);
    tl.fromTo(s, { t: 0 }, { t: dur, duration: dur, ease: "none", immediateRender: false, onUpdate: function () { fn(s.t); } }, at);
    return at + dur;
  };
  var defaults = {"sub":".sr-s","burned":".sr-b","start":0.3,"burnAt":1.4,"moveAt":1.95,"offAt":3.75,"top":70,"bottom":90,"loop":4.2};
  var run = function (el, tl, at, o) {
        var sub = el.querySelector(o.sub), burn = el.querySelector(o.burned);
        return MW.drive(tl, at, o.loop, function (t) {
          var on = t >= o.start && t < o.offAt, moved = t >= o.moveAt; sub.style.visibility = on ? "visible" : "hidden"; sub.style.top = moved ? o.top + "px" : ""; sub.style.bottom = moved ? "" : o.bottom + "px"; if (burn) burn.style.visibility = t >= o.burnAt ? "visible" : "hidden";
        });
      };
  MW.textSubtitleReposition = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
</script>
