<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Circular View Transition - Demo</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
:root { --bg: #09090b; --fg: #fafafa; --card: #111114; --line: #27272a; }
* { box-sizing: border-box; }
html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); }
#demo { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); color: var(--fg); font-family: Inter, sans-serif; }
.center { position: absolute; inset: 0; display: grid; place-items: center; }
.row { display: flex; align-items: center; justify-content: center; gap: 48px; }
.col { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 32px; }
.h1 { font-size: 132px; font-weight: 800; letter-spacing: -0.035em; line-height: 1.1; text-align: center; }
.h2 { font-size: 84px; font-weight: 700; letter-spacing: -0.025em; line-height: 1.15; text-align: center; }
.p { font-size: 40px; line-height: 1.4; opacity: 0.72; text-align: center; }
.card { position: relative; border-radius: 28px; background: var(--card); border: 2px solid var(--line); overflow: hidden; }
.muted { opacity: 0.6; }

#demo { background: radial-gradient(100% 100% at 50% 40%, #1a1f33, #0b0d12); color: #e8ebf3; font-family: Inter, sans-serif; } .gm { position: absolute; inset: 0; }
.ui-cursor { position: absolute; left: 0; top: 0; z-index: 30; filter: drop-shadow(0 6px 10px rgba(0, 0, 0, 0.5)); }
.app { position: absolute; inset: 0; overflow: hidden; } .app.dark { background: #121624; color: #e8ebf3; } .app.light { background: #f3f4f8; color: #151a28; }
.app-bar { height: 150px; display: flex; align-items: center; gap: 40px; padding: 0 90px; font-size: 60px; font-weight: 800; } .app-bar b { width: 70px; height: 70px; border-radius: 20px; background: currentColor; opacity: 0.2; }
.app-body { padding: 30px 90px; } .app-hero { height: 380px; border-radius: 40px; margin-bottom: 50px; } .app-row { height: 54px; border-radius: 27px; background: currentColor; opacity: 0.14; margin-bottom: 34px; }
.tg { position: absolute; left: 1520px; top: 205px; width: 140px; height: 70px; border-radius: 35px; background: #3a4466; z-index: 9; } .tg::after { content: ""; position: absolute; left: 10px; top: 10px; width: 50px; height: 50px; border-radius: 50%; background: #ffd23d; }
    </style>
  </head>
  <body>
    <div id="demo" data-composition-id="mw-demo" data-start="0" data-width="1920" data-height="1080" data-duration="3">
<div class="gm"><section class="cr-a app dark"><div class="app-bar"><b></b><span>Giao diện tối</span></div>
<div class="app-body"><div class="app-hero" style="background:#8b7bff"></div><div class="app-row"></div><div class="app-row" style="width:70%"></div><div class="app-row" style="width:85%"></div></div></section><section class="cr-b app light"><div class="app-bar"><b></b><span>Giao diện sáng</span></div>
<div class="app-body"><div class="app-hero" style="background:#ffb547"></div><div class="app-row"></div><div class="app-row" style="width:70%"></div><div class="app-row" style="width:85%"></div></div></section><div class="tg"></div></div><svg class="ui-cursor" viewBox="0 0 32 32" width="64" height="64"><path d="M6 3 L6 25 L12 19.5 L16 28.5 L20 26.8 L16 18 L24 18 Z" fill="#fff" stroke="#111" stroke-width="1.6" stroke-linejoin="round"/></svg>
      <script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.drive = MW.drive || function (tl, at, dur, fn) {
    var s = { t: 0 }; fn(0);
    tl.fromTo(s, { t: 0 }, { t: dur, duration: dur, ease: "none", immediateRender: false, onUpdate: function () { fn(s.t); } }, at);
    return at + dur;
  };
  var defaults = {"x":0.82,"y":0.24,"duration":0.76,"backAt":null,"from":null};
  var run = function (el, tl, at, o) {
        var out = o.from ? MW.el(o.from) : el.previousElementSibling, io = gsap.parseEase("power2.inOut");
        return MW.drive(tl, at, o.backAt == null ? o.duration : o.backAt + o.duration, function (t) {
          var W = el.offsetWidth, H = el.offsetHeight, cx = o.x * W, cy = o.y * H, R = Math.max(Math.hypot(cx, cy), Math.hypot(W - cx, cy), Math.hypot(cx, H - cy), Math.hypot(W - cx, H - cy));
          var p = io(Math.max(0, Math.min(1, t / o.duration))), q = o.backAt != null ? io(Math.max(0, Math.min(1, (t - o.backAt) / o.duration))) : 0;
          if (q > 0 && out) { el.style.clipPath = "none"; el.style.visibility = "visible"; out.style.zIndex = "3"; out.style.visibility = "visible"; out.style.clipPath = q >= 1 ? "none" : "circle(" + R * q + "px at " + cx + "px " + cy + "px)"; }
          else { if (out) { out.style.zIndex = ""; out.style.clipPath = "none"; } el.style.zIndex = "2"; el.style.clipPath = p >= 1 ? "none" : "circle(" + R * p + "px at " + cx + "px " + cy + "px)"; el.style.visibility = t > 0 ? "visible" : "hidden"; }
        });
      };
  MW.transitionCircleRevealClick = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
      </script>
      <script>
        (function () {
          var tl = gsap.timeline({ paused: true });
          var q = function (s) { return document.querySelector(s); }, qa = function (s) { return Array.prototype.slice.call(document.querySelectorAll(s)); };
          var c = q(".ui-cursor"); tl.fromTo(c, { x: 1300, y: 800 }, { x: 1580, y: 240, duration: 0.35, ease: "power2.inOut", immediateRender: true }, 0); MW.transitionCircleRevealClick(q(".cr-b"), tl, 0.45, { backAt: 1.6 });
          tl.set({}, {}, 3);
          // register only when every motion is ready (MW.pending: e.g. a WebGL texture still decoding), as HyperFrames asks of async builds
          var go = function () { window.__timelines = window.__timelines || {}; window.__timelines["mw-demo"] = tl; };
          if (window.MW && MW.pending && MW.pending.length) Promise.all(MW.pending).then(go, go); else go();
        })();
      </script>
    </div>
  </body>
</html>
