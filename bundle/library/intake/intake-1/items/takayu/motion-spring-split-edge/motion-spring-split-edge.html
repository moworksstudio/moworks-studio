  Split-edge Springs (TakayuStudio (motion-reference), No licence stated: idea and numbers only, written from the idea (site read 12/10/2026)).
  Source: motion-reference.takayustudio.jp/#motion=s-split (read 12/10/2026).
  Viên chỉ báo trên thanh tab có mép trước theo lò xo cứng, mép sau theo lò xo mềm nên giãn ra rồi co lại như chất lỏng.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.motionSpringSplitEdge(q(".pl"), tl, 0, {});

  Options (defaults in brackets):
      - tabs: 
      - keys: [[s, tab index], ...]
      - lead: [k, c] of the edge in front (320, 30: ~240 ms)
      - trail: [k, c] of the edge behind (140, 22: ~470 ms)
      - activeColor: label colour under the pill
      - duration: s (3.2)

  Notes: Idea and numbers (TakayuStudio s-split, written here): Tab indicator pill (4 tabs, 64 px pitch): its leading edge follows the target tab on a stiff spring (k 320, c 30: ~240 ms) and its trailing edge on a soft one (k 140, c 22: ~470 ms), both summed springs starting together at each change (tab 0 → 1 → 3 → 2 → 0 at 0.4 / 1.1 / 1.8 / 2.5 s), so it stretches toward the new tab, then catches up. Params: lead (k 320, c 30) · trail (k 140, c 22) · tabs: các mốc chuyển. The edge in the direction of travel follows a stiff spring and the other a soft one, both summed per change, so the pill stretches toward the new tab, then catches up.
-->

<script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.spring = MW.spring || function (stiffness, damping, mass, from, to) {
    var k = stiffness || 100, c = damping == null ? 10 : damping, m = mass || 1, w0 = Math.sqrt(k / m), z = c / (2 * Math.sqrt(k * m));
    var x = function (t) {
      if (z < 1) { var wd = w0 * Math.sqrt(1 - z * z); return 1 - Math.exp(-z * w0 * t) * (Math.cos(wd * t) + (z * w0 / wd) * Math.sin(wd * t)); }
      if (z === 1) return 1 - Math.exp(-w0 * t) * (1 + w0 * t);
      var q = Math.sqrt(z * z - 1), r1 = -w0 * (z - q), r2 = -w0 * (z + q), A = r2 / (r2 - r1), B = -r1 / (r2 - r1);
      return 1 - (A * Math.exp(r1 * t) + B * Math.exp(r2 * t));
    };
    var T = 0, dt = 1 / 240; for (var t = 0; t < 30; t += dt) if (Math.abs(1 - x(t)) > 0.001) T = t;
    T = Math.max(dt, T + dt);
    return { duration: T, ease: function (p) { return p >= 1 ? 1 : x(p * T); }, at: x };
  };
  MW.springDB = MW.springDB || function (duration, bounce) {
    var z = 1 - (bounce == null ? 0.25 : bounce), w = Math.log(1000) / (Math.max(0.05, z) * (duration || 0.8));
    return MW.spring(w * w, 2 * z * w, 1);
  };
  MW.drive = MW.drive || function (tl, at, dur, fn) {
    var s = { t: 0 }; fn(0);
    tl.fromTo(s, { t: 0 }, { t: dur, duration: dur, ease: "none", immediateRender: false, onUpdate: function () { fn(s.t); } }, at);
    return at + dur;
  };
  var defaults = {"tabs":".tb","keys":[[0,0],[0.4,1],[1.1,3],[1.8,2],[2.5,0]],"lead":[320,30],"trail":[140,22],"activeColor":"#0b0d12","duration":3.2};
  var run = function (el, tl, at, o) {
        var tabs = Array.prototype.slice.call(document.querySelectorAll(o.tabs)), pr = el.parentNode, pb = pr.getBoundingClientRect(), E = tabs.map(function (b) { var r = b.getBoundingClientRect(); return [r.left - pb.left, r.right - pb.left]; });
        var lead = MW.spring(o.lead[0], o.lead[1]), trail = MW.spring(o.trail[0], o.trail[1]), K = o.keys, sp = function (s, t) { return t <= 0 ? 0 : s.at(t); };
        el.style.position = "absolute"; el.style.left = "0px";
        return MW.drive(tl, at, o.duration, function (t) { var L = E[K[0][1]][0], R = E[K[0][1]][1];
          for (var j = 1; j < K.length; j++) { var a = E[K[j - 1][1]], b = E[K[j][1]], dL = b[0] - a[0], dR = b[1] - a[1], right = dL + dR > 0, d = t - K[j][0]; L += dL * sp(right ? trail : lead, d); R += dR * sp(right ? lead : trail, d); }
          gsap.set(el, { x: L }); el.style.width = Math.max(4, R - L) + "px"; var cx = (L + R) / 2; tabs.forEach(function (b, i) { var c = (E[i][0] + E[i][1]) / 2; b.style.color = Math.abs(cx - c) < (E[i][1] - E[i][0]) / 2 ? o.activeColor : ""; }); });
      };
  MW.motionSpringSplitEdge = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
</script>
