  Source: motion-reference.takayustudio.jp/#motion=shrink-fade-exit (read 12/10/2026).
  Ô biểu tượng thu về 22 %, nhoè 3 px và mờ hẳn, để lại một chấm nhỏ ở chỗ biến mất.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.motionShrinkFadeExit(q(".sf"), tl, 0.5, { returnAt: 1.6 });

  Options (defaults in brackets):
      - to: end scale (0.22)
      - blur: px (9)
      - duration: s (0.52, power2.in)
      - dot: px mark at the vanishing point (10)
      - accent: 
      - returnAt: s after the start to come back (null)

  Notes: Idea and numbers (TakayuStudio shrink-fade-exit, written here): Icon tile scales 1 → 0.22 about its centre, opacity 1 → 0 and blur 0 → 3 px, together in 520 ms power2.in (easeInCubic); a 2.5 px dot marks the vanishing point for the last quarter and ~0.5 s after. Site return: 0.9 → 1 with fade-in, 400 ms power2.out. Params: duration (0.52 s) · scale (0.22) · blur (3 px) · ease (power2.in).
-->
