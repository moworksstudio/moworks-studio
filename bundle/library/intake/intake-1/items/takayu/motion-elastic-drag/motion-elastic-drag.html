  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.motionElasticDrag(q(".ed"), tl, 0, { cursor: ".ui-cursor" });

  Options (defaults in brackets):
      - grab: s (0.42)
      - dragAt: s (0.5)
      - drag: s (0.75, power2.inOut)
      - release: s (1.45)
      - to: [x, y] px dragged ([690, −184])
      - bow: px the drag bows upward (54)
      - k: spring stiffness home (180)
      - c: damping (11): about 24 % overshoot
      - tether: [base, extra, falloff px]: width = base + extra / (1 + distance / falloff) ([8, 32, 160])
      - accent: 
      - cursor: an optional cursor that makes the clicks
      - approach: [x, y] px the cursor comes from
      - lead: s it arrives before a click

  Notes: Idea and numbers (TakayuStudio catalog-ui-button-elastic-drag, written here): Chip 84x36 r12 at its home (dashed outline). Grabbed at 0.42 s, dragged 1:1 from (104,104) to (232,70) over 0.5-1.25 s power2.inOut with a 10 px upward bow; held; released at 1.45 s it springs home on k180 c11 (about 24 % overshoot). A tether from the home dot to the chip, width 2 + 8 / (1 + distance / 30) px, 55 % opacity. Params: from / to · drag (0.75 s, power2.inOut) · release (1.45 s) · spring (k180 c11) · tether.
