<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Drag Resistance - Demo</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
:root { --bg: #09090b; --fg: #fafafa; --card: #111114; --line: #27272a; }
* { box-sizing: border-box; }
html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); }
#demo { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); color: var(--fg); font-family: Inter, sans-serif; }
.center { position: absolute; inset: 0; display: grid; place-items: center; }
.row { display: flex; align-items: center; justify-content: center; gap: 48px; }
.col { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 32px; }
.h1 { font-size: 132px; font-weight: 800; letter-spacing: -0.035em; line-height: 1.1; text-align: center; }
.h2 { font-size: 84px; font-weight: 700; letter-spacing: -0.025em; line-height: 1.15; text-align: center; }
.p { font-size: 40px; line-height: 1.4; opacity: 0.72; text-align: center; }
.card { position: relative; border-radius: 28px; background: var(--card); border: 2px solid var(--line); overflow: hidden; }
.muted { opacity: 0.6; }

#demo { background: radial-gradient(100% 100% at 50% 45%, #1a1f33, #0b0d12); color: #e8ebf3; font-family: Inter, sans-serif; } .gm { position: absolute; inset: 0; }
.dr-w { position: absolute; inset: 0; } .dr-s { position: absolute; left: 600px; top: 470px; width: 380px; height: 140px; border-radius: 70px; border: 5px dashed #3a4466; box-sizing: border-box; } .dr { position: absolute; left: 600px; top: 470px; width: 380px; height: 140px; border-radius: 70px; background: linear-gradient(180deg, #9c88ff, #7357f5); }
.ui-cursor { position: absolute; left: 0; top: 0; z-index: 20; filter: drop-shadow(0 6px 10px rgba(0,0,0,0.5)); }
    </style>
  </head>
  <body>
    <div id="demo" data-composition-id="mw-demo" data-start="0" data-width="1920" data-height="1080" data-duration="2.2">
<div class="dr-w"><div class="dr-s"></div><div class="dr"></div><svg class="ui-cursor" viewBox="0 0 32 32" width="64" height="64"><path d="M6 3 L6 25 L12 19.5 L16 28.5 L20 26.8 L16 18 L24 18 Z" fill="#fff" stroke="#111" stroke-width="1.6" stroke-linejoin="round"/></svg></div>
      <script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.spring = MW.spring || function (stiffness, damping, mass, from, to) {
    var k = stiffness || 100, c = damping == null ? 10 : damping, m = mass || 1, w0 = Math.sqrt(k / m), z = c / (2 * Math.sqrt(k * m));
    var x = function (t) {
      if (z < 1) { var wd = w0 * Math.sqrt(1 - z * z); return 1 - Math.exp(-z * w0 * t) * (Math.cos(wd * t) + (z * w0 / wd) * Math.sin(wd * t)); }
      if (z === 1) return 1 - Math.exp(-w0 * t) * (1 + w0 * t);
      var q = Math.sqrt(z * z - 1), r1 = -w0 * (z - q), r2 = -w0 * (z + q), A = r2 / (r2 - r1), B = -r1 / (r2 - r1);
      return 1 - (A * Math.exp(r1 * t) + B * Math.exp(r2 * t));
    };
    var T = 0, dt = 1 / 240; for (var t = 0; t < 30; t += dt) if (Math.abs(1 - x(t)) > 0.001) T = t;
    T = Math.max(dt, T + dt);
    return { duration: T, ease: function (p) { return p >= 1 ? 1 : x(p * T); }, at: x };
  };
  MW.springDB = MW.springDB || function (duration, bounce) {
    var z = 1 - (bounce == null ? 0.25 : bounce), w = Math.log(1000) / (Math.max(0.05, z) * (duration || 0.8));
    return MW.spring(w * w, 2 * z * w, 1);
  };
  MW.drive = MW.drive || function (tl, at, dur, fn) {
    var s = { t: 0 }; fn(0);
    tl.fromTo(s, { t: 0 }, { t: dur, duration: dur, ease: "none", immediateRender: false, onUpdate: function () { fn(s.t); } }, at);
    return at + dur;
  };
  var defaults = {"grab":0.3,"pull":460,"duration":0.6,"lag":0.1,"max":1.35,"k":220,"c":16,"cursor":null};
  var run = function (el, tl, at, o) {
        var host = el.parentNode, cur = o.cursor ? (host.querySelector(o.cursor) || document.querySelector(o.cursor)) : null, io = gsap.parseEase("power2.inOut"), sp = MW.spring(o.k, o.c), W = el.offsetWidth; gsap.set(el, { transformOrigin: "0% 50%" });
        var Rr = function (t) { return o.pull * io(Math.max(0, Math.min(1, (t - o.grab) / o.duration))); }, rel = o.grab + o.duration + o.lag;
        var E = function (t) { if (t <= rel) { var r = Rr(t), l = Rr(t - o.lag), w = Math.max(W * 0.8, Math.min(W * o.max, W + r - l)); return [r + W - w, r]; } var s = sp.at(t - rel), rr = o.pull * (1 - s); return [rr, rr]; };
        return MW.drive(tl, at, rel + sp.duration + 0.2, function (t) {
          var e = E(t), v = (E(t + 0.005)[1] - E(t - 0.005)[1]) / 0.01, st = t > rel ? 1 + Math.min(0.18, Math.abs(v) / 6000) : (W + e[1] - e[0]) / W;
          gsap.set(el, { x: e[0], scaleX: st, scaleY: 1 / Math.sqrt(st) });
          if (cur) { var held = t > o.grab - 0.08 && t <= o.grab + o.duration, gx = el.offsetLeft + W - 40, gy = el.offsetTop + el.offsetHeight / 2, cx = t <= o.grab ? gx + 240 * (1 - Math.min(1, t / o.grab)) : gx + Rr(Math.min(t, o.grab + o.duration)) + (t > o.grab + o.duration ? 120 * Math.min(1, (t - o.grab - o.duration) / 0.5) : 0); gsap.set(cur, { x: cx - 12, y: gy - 6 + (t <= o.grab ? 160 * (1 - Math.min(1, t / o.grab)) : 0), scale: held ? 0.86 : 1, transformOrigin: "20% 10%" }); }
        });
      };
  MW.motionDragResistance = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
      </script>
      <script>
        (function () {
          var tl = gsap.timeline({ paused: true });
          var q = function (s) { return document.querySelector(s); }, qa = function (s) { return Array.prototype.slice.call(document.querySelectorAll(s)); };
          MW.motionDragResistance(q(".dr"), tl, 0, { cursor: ".ui-cursor" });
          tl.set({}, {}, 2.2);
          // register only when every motion is ready (MW.pending: e.g. a WebGL texture still decoding), as HyperFrames asks of async builds
          var go = function () { window.__timelines = window.__timelines || {}; window.__timelines["mw-demo"] = tl; };
          if (window.MW && MW.pending && MW.pending.length) Promise.all(MW.pending).then(go, go); else go();
        })();
      </script>
    </div>
  </body>
</html>
