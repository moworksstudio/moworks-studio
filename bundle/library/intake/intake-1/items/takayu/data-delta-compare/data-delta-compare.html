  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.dataDeltaCompare(q(".gm"), tl, 0, {});

  Options (defaults in brackets):
      - a: (40)
      - b: (64)
      - labels: bar labels

  Notes: Idea and numbers (TakayuStudio catalog-data-story-delta-split, written here): Two bars on one baseline at 2 px per unit: A 40 (80 px) grows 300-1100 ms, B 64 (128 px) 400-1200 ms, easeOutExpo, labels count with them. A dashed guide from A's top extends to B 1400-1800 easeOutCubic; B's top 48 px (the delta) turns accent 1700-2000; a bracket beside B grows 1800-2150 easeOutCubic; '+24' pops 2100-2450 back.out. Exit 3500-3850 ease-in. Params: values (40 / 64) · scale (2 px / đơn vị) · label (+24).
