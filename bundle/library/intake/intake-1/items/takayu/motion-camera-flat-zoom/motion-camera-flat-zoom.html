<!--
  Zoom (flat) (TakayuStudio (motion-reference), No licence stated: idea and numbers only, written from the idea (site read 12/10/2026)).
  Source: motion-reference.takayustudio.jp/#motion=cam-zoomvsdolly (read 12/10/2026).
  Mọi lớp phóng cùng một tỉ lệ như zoom ống kính nên chiều sâu bị ép bẹt, khác với đẩy máy.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.motionCameraFlatZoom(q(".tk-cam"), tl, 0.4, { duration: 2.3, scale: 1.3 });

  Options (defaults in brackets):
      - duration: s (1.6; the site's demo 2.3)
      - scale: every layer's end scale (1.2; demo 1.3)
      - layers: selector of the layers
      - ease: power2.inOut

  Notes: Idea and numbers (TakayuStudio cam-zoomvsdolly, written here): Lens zoom: every layer scales by the same factor about the frame centre, 1 -> 1.2 over 1600 ms easeInOutCubic, so depth flattens (compare with the push-in). Demo: 1 -> 1.3 over 2.3 s ease-in-out. Params: duration (1.6 s) · scale (1 → 1.2) · ease (power2.inOut).
-->

<script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.drive = MW.drive || function (tl, at, dur, fn) {
    var s = { t: 0 }; fn(0);
    tl.fromTo(s, { t: 0 }, { t: dur, duration: dur, ease: "none", immediateRender: false, onUpdate: function () { fn(s.t); } }, at);
    return at + dur;
  };
  var defaults = {"duration":1.6,"scale":1.2,"layers":"[data-depth]","ease":"power2.inOut"};
  var run = function (el, tl, at, o) {
        var Ls = Array.prototype.slice.call(el.querySelectorAll(o.layers)), ease = gsap.parseEase(o.ease);
        return MW.drive(tl, at, o.duration, function (t) { var s = 1 + (o.scale - 1) * ease(t / o.duration); Ls.forEach(function (l) { gsap.set(l, { scale: s }); }); });
      };
  MW.motionCameraFlatZoom = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
</script>
