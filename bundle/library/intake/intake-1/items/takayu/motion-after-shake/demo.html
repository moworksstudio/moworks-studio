<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>After Shake - Demo</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
:root { --bg: #09090b; --fg: #fafafa; --card: #111114; --line: #27272a; }
* { box-sizing: border-box; }
html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); }
#demo { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); color: var(--fg); font-family: Inter, sans-serif; }
.center { position: absolute; inset: 0; display: grid; place-items: center; }
.row { display: flex; align-items: center; justify-content: center; gap: 48px; }
.col { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 32px; }
.h1 { font-size: 132px; font-weight: 800; letter-spacing: -0.035em; line-height: 1.1; text-align: center; }
.h2 { font-size: 84px; font-weight: 700; letter-spacing: -0.025em; line-height: 1.15; text-align: center; }
.p { font-size: 40px; line-height: 1.4; opacity: 0.72; text-align: center; }
.card { position: relative; border-radius: 28px; background: var(--card); border: 2px solid var(--line); overflow: hidden; }
.muted { opacity: 0.6; }

#demo { background: radial-gradient(100% 100% at 50% 45%, #1a1f33, #0b0d12); color: #e8ebf3; font-family: Inter, sans-serif; } .gm { position: absolute; inset: 0; }
.as-c { position: absolute; left: 900px; top: 360px; width: 640px; height: 360px; border-radius: 40px; background: linear-gradient(150deg, #a693ff, #6a4cf0); display: grid; place-items: center; font-size: 70px; font-weight: 900; color: #fff; } .as-b { position: absolute; left: 180px; top: 480px; width: 120px; height: 120px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #ffe2a8, #ffb547 60%, #d98a00); }
    </style>
  </head>
  <body>
    <div id="demo" data-composition-id="mw-demo" data-start="0" data-width="1920" data-height="1080" data-duration="1.6">
<div class="as-b"></div><div class="as-c">BỊ VA!</div>
      <script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.drive = MW.drive || function (tl, at, dur, fn) {
    var s = { t: 0 }; fn(0);
    tl.fromTo(s, { t: 0 }, { t: dur, duration: dur, ease: "none", immediateRender: false, onUpdate: function () { fn(s.t); } }, at);
    return at + dur;
  };
  var defaults = {"amp":80,"freq":5,"decay":6,"hit":0.5,"ball":".as-b"};
  var run = function (el, tl, at, o) {
        var host = el.parentNode, ball = o.ball ? host.querySelector(o.ball) : null, p1 = gsap.parseEase("power1.in"), p2 = gsap.parseEase("power2.out"), fl = document.createElement("div");
        if (getComputedStyle(host).position === "static") host.style.position = "relative";
        fl.style.cssText = "position:absolute;width:90px;height:90px;margin:-45px 0 0 -45px;pointer-events:none;opacity:0;color:#ffd23d;"; fl.innerHTML = '<svg viewBox="-10 -10 20 20" width="100%" height="100%"><path d="M0 -10 L2.4 -2.4 L10 0 L2.4 2.4 L0 10 L-2.4 2.4 L-10 0 L-2.4 -2.4 Z" fill="currentColor"/></svg>'; host.appendChild(fl);
        var hx = el.offsetLeft, hy = el.offsetTop + el.offsetHeight / 2, b0 = ball ? ball.offsetLeft + ball.offsetWidth : 0;
        return MW.drive(tl, at, o.hit + 0.8, function (t) {
          var u = t - o.hit, x = u > 0 ? o.amp * Math.exp(-o.decay * u) * Math.sin(2 * Math.PI * u * o.freq) : 0; gsap.set(el, { x: x });
          if (ball) { var bx = u < 0 ? (hx - b0) * p1(Math.max(0, t / o.hit)) : (hx - b0) - 300 * p2(Math.min(1, u / 0.5)); gsap.set(ball, { x: bx }); }
          fl.style.left = hx + "px"; fl.style.top = hy + "px"; fl.style.opacity = u > 0 && u < 0.14 ? "1" : "0"; fl.style.transform = "scale(" + (0.6 + 2.5 * Math.max(0, u)).toFixed(3) + ")";
        });
      };
  MW.motionAfterShake = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
      </script>
      <script>
        (function () {
          var tl = gsap.timeline({ paused: true });
          var q = function (s) { return document.querySelector(s); }, qa = function (s) { return Array.prototype.slice.call(document.querySelectorAll(s)); };
          MW.motionAfterShake(q(".as-c"), tl, 0, {});
          tl.set({}, {}, 1.6);
          // register only when every motion is ready (MW.pending: e.g. a WebGL texture still decoding), as HyperFrames asks of async builds
          var go = function () { window.__timelines = window.__timelines || {}; window.__timelines["mw-demo"] = tl; };
          if (window.MW && MW.pending && MW.pending.length) Promise.all(MW.pending).then(go, go); else go();
        })();
      </script>
    </div>
  </body>
</html>
