  Source: motion-reference.takayustudio.jp/#motion=tx-fit-text-title (read 12/10/2026).
  Cỡ chữ tiêu đề luôn được tính lại để dòng chữ vừa khít bề rộng khung (trừ lề), có giới hạn cỡ tối đa; khung hẹp lại thì chữ nhỏ theo.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.textFitWidthTitle(q(".fw h1"), tl, 0, { cursor: ".ui-cursor" });

  Options (defaults in brackets):
      - pad: px each side (70)
      - cap: largest font size, px (460)
      - wide: card px (1400)
      - narrow: px (750)
      - card: the box it fits (the title's parent)
      - cursor: the cursor dragging the corner
      - loop: s (4.2)

  Notes: Idea and numbers (TakayuStudio tx-fit-text-title, written here): fontSize = min(cap, size × (frame width − 2 × padding) ÷ measured width), measured after the font loads; one line, no wrap; re-measure whenever the text or box changes. Demo: card width 280 → 150 px (0.4–1.2 s) and back (2.2–3.0 s), cubic-bezier(.65,0,.35,1), padding 14 px, cap 92 px, the title refitting every frame; a cursor drags the card's corner. Loop 4.2 s. Params: lề (14 px mỗi bên) · cỡ tối đa (92 px) · bề rộng khung. fontSize = min(cap, size × (box width − 2 × pad) ÷ measured width), re-measured every frame; one line.
-->
