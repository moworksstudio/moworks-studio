  Source: motion-reference.takayustudio.jp/#motion=route-slide (read 12/10/2026).
  Bấm vào một dòng, trang cũ và trang chi tiết trượt sang trái như một dải liền; bấm quay lại thì dải chạy ngược đúng đường cũ.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.transitionRouteSlide(q(".pg2"), tl, 0.4, { backAt: 1.5 });

  Options (defaults in brackets):
      - duration: s (0.6), in-out
      - backAt: s after the start to slide back the same way (null: stay)
      - parallax: true: the old page moves only −18 % and dims (the push variant)
      - from: the outgoing page

  Notes: Idea and numbers (TakayuStudio route-slide, written here): Window 200x136. Old page x 0 → −100 % and new page x 100 % → 0 move as one strip over 600 ms power2.inOut (0.4-1.0 s), a 1 px divider on the new page's left edge. Back reverses the same path (1.9-2.5 s). Cursor clicks a row at 0.3 s and the back arrow at 1.8 s. DOM recipe variant: old x 0 → −18 % with opacity 1 → 0.4 (parallax push). Params: duration (0.6 s) · direction (forward | back) · ease (power2.inOut).
-->

<script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.drive = MW.drive || function (tl, at, dur, fn) {
    var s = { t: 0 }; fn(0);
    tl.fromTo(s, { t: 0 }, { t: dur, duration: dur, ease: "none", immediateRender: false, onUpdate: function () { fn(s.t); } }, at);
    return at + dur;
  };
  var defaults = {"duration":0.6,"backAt":null,"parallax":false,"from":null};
  var run = function (el, tl, at, o) {
        var out = o.from ? MW.el(o.from) : el.previousElementSibling, io = gsap.parseEase("power2.inOut"), div = document.createElement("div");
        div.style.cssText = "position:absolute;left:0;top:0;bottom:0;width:5px;background:rgba(255,255,255,0.25);"; el.appendChild(div);
        return MW.drive(tl, at, o.backAt == null ? o.duration : o.backAt + o.duration, function (t) {
          var p = io(Math.max(0, Math.min(1, t / o.duration))); if (o.backAt != null) p *= 1 - io(Math.max(0, Math.min(1, (t - o.backAt) / o.duration)));
          gsap.set(el, { xPercent: 100 * (1 - p) }); if (out) { if (o.parallax) { gsap.set(out, { xPercent: -18 * p }); out.style.opacity = String(1 - 0.6 * p); } else gsap.set(out, { xPercent: -100 * p }); }
        });
      };
  MW.transitionRouteSlide = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
</script>
