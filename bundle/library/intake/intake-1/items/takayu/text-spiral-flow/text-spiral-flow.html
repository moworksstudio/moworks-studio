  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.textSpiralFlow(q(".sf"), tl, 0, {});

  Options (defaults in brackets):
      - text: 
      - turns: (3.2)
      - radius: px at the outer end (360)
      - size: letter size as a share of the radius (0.24)
      - flow: radians of spiral per loop (1.8), rounded to whole units
      - inner: [gone, full] px near the centre ([30, 140])
      - sep: 
      - loop: s (5)

  Notes: Idea and numbers (TakayuStudio tx-spiral-text, written here): Text + ' • ' (separator accent) repeated on an Archimedean spiral of 3.2 turns, r = 72 px × θ / θmax. Font size = 0.24 × r, so each char takes a constant angle (0.24 × its width in em). The string flows inward linearly about 1.8 rad of spiral angle per 5 s (whole units, seamless). Each glyph rotated to its angle + 90°; fades in from the outer end over 1.4 rad and out near the centre (r 6 → 28 px). Demo loop 5 s (recipe: 8 s loop). Params: số vòng (3.2) · bán kính (72 px) · cỡ chữ (0.24 × bán kính) · tốc độ (1.8 rad / 5 s). An Archimedean spiral; since the size grows with the radius, each letter takes a constant angle.
