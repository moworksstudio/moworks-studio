  Source: motion-reference.takayustudio.jp/#motion=e-wiggle (read 12/10/2026).
  Giá trị lắc quanh vị trí nghỉ một số lần cố định, biên độ giảm dần rồi dừng đúng chỗ cũ; cho chuông báo, lắc báo lỗi.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.motionEaseWiggle(q(".bell"), tl, 0.4, { duration: 0.9 });

  Options (defaults in brackets):
      - wiggles: swings (6)
      - amp: amplitude (28.6° or px)
      - duration: s (0.6; the site's bell 0.9)
      - prop: rotation, x or y
      - decay: linear (default) or exp

  Notes: Idea and numbers (TakayuStudio e-wiggle, written here): CustomWiggle(6, easeOut): the value swings 6 times around rest, amplitude falling linearly to 0, ending at rest; recipe 600 ms. Site demo: a bell rotates sin(6·2π p)·(1 − p)·0.5 rad (±28.6° at first) about its top over 900 ms. Mode params: prop x | y | rotation, cycles, amp, decay linear | exp; a regular sine, not noise. Params: wiggles (6) · amp (≈28° | px) · duration (0.6 s) · prop (rotation | x).
-->

<script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.drive = MW.drive || function (tl, at, dur, fn) {
    var s = { t: 0 }; fn(0);
    tl.fromTo(s, { t: 0 }, { t: dur, duration: dur, ease: "none", immediateRender: false, onUpdate: function () { fn(s.t); } }, at);
    return at + dur;
  };
  var defaults = {"wiggles":6,"amp":28.6,"duration":0.6,"prop":"rotation","decay":"linear"};
  var run = function (el, tl, at, o) {
        return MW.drive(tl, at, o.duration, function (t) { var p = Math.max(0, Math.min(1, t / o.duration)), d = o.decay === "exp" ? Math.exp(-4 * p) * (1 - p) : 1 - p, s = {}; s[o.prop] = o.amp * Math.sin(o.wiggles * 2 * Math.PI * p) * d; gsap.set(el, s); });
      };
  MW.motionEaseWiggle = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
</script>
