  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.uiCompassLock(q(".gm"), tl, 0, {});

  Options (defaults in brackets):
      - from: degrees (250)
      - to: degrees (360: north)
      - lockAt: s (1.45)
      - backAt: s (2.35)
      - label: 
      - loop: s (3)

  Notes: Idea and numbers (TakayuStudio catalog-game-hud-compass-lock, written here): px @320x200. Tape 220 x 40 under a fixed pointer: heading 250 → 356° in 1.1 s outCubic from 0.3 s, plus +4° by spring k520 d20 from 1.4 s (settles at 360 = N); 2 px per degree, ticks every 5° (longer every 15°), labels N / NE / E… every 45°, edges fade by 1 − (dx/112)². Lock at 1.45 s: brackets close ±42 → ±20 px (250 ms back.out), N turns accent and grows 13 → 15 px, 'LOCK' pill scales in; 3-digit readout. Back to 250° 2.35-2.75 s inOut. Params: from / to: hướng (250° → 360°) · turn: thời gian quay (1.1 s) · lockAt: lúc khoá (1.45 s) · pxPerDeg: px mỗi độ (2). Turns 1.1 s (ease-out cubic), the last 4° on a stiff spring (k520 c20); 2 units per degree, the tape's edges fade.
