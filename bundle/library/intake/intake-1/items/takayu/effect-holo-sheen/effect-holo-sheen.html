  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.effectHoloSheen(q(".hs-c"), tl, 0.4, {});

  Options (defaults in brackets):
      - duration: s (1.3), sine.inOut
      - width: px (260)
      - angle: degrees (29)
      - opacity: (0.55)
      - hue: degrees (55)

  Notes: Idea and numbers (TakayuStudio holographic-sheen, written here): A rainbow band (52 px wide, rotated ~29°, stops transparent → red → yellow → green → blue → transparent) sweeps with its centre from −50 % to +120 % of the card width (recipe −120 % → 220 %) in 1300 ms sine.inOut, additive, opacity 0.55·sin(π p)^0.4, with hue-rotate 0 → 55° → 0; drawn under the card's content so only the background shimmers. Params: duration (1.3 s) · width (52 px) · angle (≈29°) · opacity (0.55) · hue (55°). The band runs under the card's content: only the background shimmers.
-->

<script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.drive = MW.drive || function (tl, at, dur, fn) {
    var s = { t: 0 }; fn(0);
    tl.fromTo(s, { t: 0 }, { t: dur, duration: dur, ease: "none", immediateRender: false, onUpdate: function () { fn(s.t); } }, at);
    return at + dur;
  };
  var defaults = {"duration":1.3,"width":260,"angle":29,"opacity":0.55,"hue":55};
  var run = function (el, tl, at, o) {
        var band = document.createElement("div"), si = gsap.parseEase("sine.inOut");
        if (getComputedStyle(el).position === "static") el.style.position = "relative"; el.style.overflow = "hidden";
        band.style.cssText = "position:absolute;top:-60%;bottom:-60%;width:" + o.width + "px;pointer-events:none;mix-blend-mode:plus-lighter;z-index:0;background:linear-gradient(90deg, transparent, #ff4d6d, #ffd23d, #3ddc84, #3d7bff, transparent);";
        el.insertBefore(band, el.firstChild); Array.prototype.forEach.call(el.children, function (ch) { if (ch !== band && getComputedStyle(ch).position === "static") { ch.style.position = "relative"; ch.style.zIndex = "1"; } });
        return MW.drive(tl, at, o.duration, function (t) {
          var p = si(t / o.duration), W = el.offsetWidth, x = (-0.5 + 1.7 * p) * W;
          gsap.set(band, { x: x - o.width / 2, rotation: o.angle }); band.style.opacity = t > 0 && t < o.duration ? String(o.opacity * Math.pow(Math.sin(Math.PI * t / o.duration), 0.4)) : "0"; band.style.filter = "hue-rotate(" + o.hue * Math.sin(Math.PI * t / o.duration) + "deg)";
        });
      };
  MW.effectHoloSheen = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
</script>
