  Dòng chữ chạy vào theo một đường cong, mỗi chữ xoay theo hướng đường, dừng ở giữa một nhịp rồi tăng tốc chạy ra đầu bên kia.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.textPathRun(q(".pr"), tl, 0, {});

  Options (defaults in brackets):
      - text: 
      - fit: px of text (1000)
      - amp: px of the wave (200)
      - margin: px past each side (250)
      - start: s (0.3)
      - inTime: s (1.2, power2.out)
      - holdAt: s it holds from (1.5)
      - outAt: s (2.6)
      - outTime: s (1.1, power2.in)
      - accent: the last letter
      - loop: s (4)

  Notes: Idea and numbers (TakayuStudio tx-text-along-path, written here): Text on an open path (demo: one full sine wave, amplitude 40 px, across the frame plus 50 px each side); each glyph at its arc-length point, rotated to the tangent (chord ±6 px). Text centre runs from fully off the start (−half width − 20 px) to the path middle 0.3–1.5 s power2.out, holds 1.1 s, then to fully off the end 2.6–3.7 s power2.in. Size fits about 190 px of text (12–34 px). Last char accent. Loop 4 s. Params: đường cong (sóng 40 px) · thời gian vào (1.2 s) · giữ (1.1 s) · thời gian ra (1.1 s).
