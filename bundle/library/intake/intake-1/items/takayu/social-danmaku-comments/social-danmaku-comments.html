  Các bình luận ngắn chạy ngang qua video từ phải sang trái trên nhiều làn, mỗi bình luận đi hết khung trong cùng một thời gian dù dài hay ngắn, chữ trắng viền tối.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.socialDanmakuComments(q(".dm"), tl, 0, {});

  Options (defaults in brackets):
      - comments: [[lane, text, s], ...] in one cycle
      - lanes: (6)
      - cross: s every comment takes to cross (3.5), whatever its length
      - cycle: s (4)
      - loops: (1)
      - size: px (52)
      - accent: the first comment

  Notes: Idea and numbers (TakayuStudio tx-danmaku-comments, written here): Over the video area, 6 lanes (lane height = area height / 6 ≈ 1.7 em at 14 px). Each comment crosses right → left in a fixed 3.5 s whatever its length: x from the right edge to −its width, linear. Demo schedule: 10 slots (lane, comment, start) in a 4 s cycle, each lane's comments at least ~2 s apart (recipe: a lane takes a new one only after the previous tail has entered). Text bold, white with a 3 px dark outline under the fill; first comment accent. Params: thời gian băng qua (3.5 s) · số làn (6) · cỡ chữ (14 px) · danh sách bình luận.
-->

(function () {

  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.drive = MW.drive || function (tl, at, dur, fn) {
    var s = { t: 0 }; fn(0);
    tl.fromTo(s, { t: 0 }, { t: dur, duration: dur, ease: "none", immediateRender: false, onUpdate: function () { fn(s.t); } }, at);
    return at + dur;
  };
  var defaults = {"comments":[[0,"Đẹp quá trời!",0],[2,"Chỗ này ở đâu vậy",0.3],[4,"8888",0.7],[1,"Ước gì được đi",1.1],[3,"Nhạc hay ghê",1.5],[5,"Lần đầu xem kênh",1.9],[0,"Bình minh luôn",2.2],[2,"Cho xin tên bài",2.5],[4,"Like mạnh!",2.9],[5,"Quay bằng gì thế?",3.3]],"lanes":6,"cross":3.5,"cycle":4,"loops":1,"size":52,"accent":"#ffd23d"};
  var run = function (el, tl, at, o) {
        var W = el.clientWidth, lh = el.clientHeight / o.lanes, C = o.comments.map(function (c, i) { var s = document.createElement("span"); s.textContent = c[1]; s.style.cssText = "position:absolute;left:0;white-space:nowrap;font-weight:800;font-size:" + o.size + "px;-webkit-text-stroke:0.2em #0b0d12;paint-order:stroke fill;color:" + (i === 0 ? o.accent : "#fff") + ";top:" + (c[0] * lh + (lh - o.size * 1.2) / 2) + "px;"; el.appendChild(s); return { s: s, st: c[2], w: s.offsetWidth }; });
        return MW.drive(tl, at, o.cycle * o.loops, function (t) {
          C.forEach(function (q) { var u = (((t - q.st) % o.cycle) + o.cycle) % o.cycle, on = u < o.cross; gsap.set(q.s, { x: W - (W + q.w) * Math.min(1, u / o.cross) }); q.s.style.visibility = on ? "visible" : "hidden"; });
        });
      };
  MW.socialDanmakuComments = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
