<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Rim Glow - Demo</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
:root { --bg: #09090b; --fg: #fafafa; --card: #111114; --line: #27272a; }
* { box-sizing: border-box; }
html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); }
#demo { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); color: var(--fg); font-family: Inter, sans-serif; }
.center { position: absolute; inset: 0; display: grid; place-items: center; }
.row { display: flex; align-items: center; justify-content: center; gap: 48px; }
.col { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 32px; }
.h1 { font-size: 132px; font-weight: 800; letter-spacing: -0.035em; line-height: 1.1; text-align: center; }
.h2 { font-size: 84px; font-weight: 700; letter-spacing: -0.025em; line-height: 1.15; text-align: center; }
.p { font-size: 40px; line-height: 1.4; opacity: 0.72; text-align: center; }
.card { position: relative; border-radius: 28px; background: var(--card); border: 2px solid var(--line); overflow: hidden; }
.muted { opacity: 0.6; }

#demo { background: radial-gradient(100% 100% at 50% 40%, #1a1f33, #0b0d12); color: #e8ebf3; font-family: Inter, sans-serif; } .gm { position: absolute; inset: 0; }
.ui-cursor { position: absolute; left: 0; top: 0; z-index: 30; filter: drop-shadow(0 6px 10px rgba(0, 0, 0, 0.5)); }
#demo { background: #05060c; } .rg { position: absolute; inset: 0; display: grid; place-items: center; } .rg-d { position: relative; width: 500px; height: 500px; border-radius: 50%; background: radial-gradient(circle at 60% 60%, #0d0f1a, #05060c); }
.rg i { position: absolute; width: 5px; height: 5px; border-radius: 50%; background: #fff; opacity: 0.6; }
    </style>
  </head>
  <body>
    <div id="demo" data-composition-id="mw-demo" data-start="0" data-width="1920" data-height="1080" data-duration="3">
<div class="gm rg"><i style="left:0px;top:0px"></i><i style="left:421px;top:257px"></i><i style="left:842px;top:514px"></i><i style="left:1263px;top:771px"></i><i style="left:1684px;top:1028px"></i><i style="left:185px;top:205px"></i><i style="left:606px;top:462px"></i><i style="left:1027px;top:719px"></i><i style="left:1448px;top:976px"></i><i style="left:1869px;top:153px"></i><i style="left:370px;top:410px"></i><i style="left:791px;top:667px"></i><i style="left:1212px;top:924px"></i><i style="left:1633px;top:101px"></i><i style="left:134px;top:358px"></i><i style="left:555px;top:615px"></i><i style="left:976px;top:872px"></i><i style="left:1397px;top:49px"></i><i style="left:1818px;top:306px"></i><i style="left:319px;top:563px"></i><i style="left:740px;top:820px"></i><i style="left:1161px;top:1077px"></i><i style="left:1582px;top:254px"></i><i style="left:83px;top:511px"></i><i style="left:504px;top:768px"></i><i style="left:925px;top:1025px"></i><i style="left:1346px;top:202px"></i><i style="left:1767px;top:459px"></i><i style="left:268px;top:716px"></i><i style="left:689px;top:973px"></i><i style="left:1110px;top:150px"></i><i style="left:1531px;top:407px"></i><i style="left:32px;top:664px"></i><i style="left:453px;top:921px"></i><i style="left:874px;top:98px"></i><i style="left:1295px;top:355px"></i><i style="left:1716px;top:612px"></i><i style="left:217px;top:869px"></i><i style="left:638px;top:46px"></i><i style="left:1059px;top:303px"></i><div class="rg-d"></div></div>
      <script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.drive = MW.drive || function (tl, at, dur, fn) {
    var s = { t: 0 }; fn(0);
    tl.fromTo(s, { t: 0 }, { t: dur, duration: dur, ease: "none", immediateRender: false, onUpdate: function () { fn(s.t); } }, at);
    return at + dur;
  };
  var defaults = {"stroke":[8,16],"glow":[40,88],"period":1,"cycles":3,"color":"#8b7bff"};
  var run = function (el, tl, at, o) {
        var host = el.parentNode, ring = document.createElement("div");
        if (getComputedStyle(host).position === "static") host.style.position = "relative";
        ring.style.cssText = "position:absolute;border-radius:50%;pointer-events:none;box-sizing:border-box;border:4px solid " + o.color + ";"; host.appendChild(ring);
        return MW.drive(tl, at, o.period * o.cycles, function (t) {
          var k = 0.5 - 0.5 * Math.cos(2 * Math.PI * t / o.period), sw = o.stroke[0] + (o.stroke[1] - o.stroke[0]) * k, gl = (o.glow[0] + (o.glow[1] - o.glow[0]) * k) * 0.8;
          el.style.boxShadow = "0 0 0 " + sw + "px " + o.color + ", 0 0 " + gl + "px " + sw + "px " + o.color;
          var R = el.offsetWidth / 2 + sw + 14; ring.style.width = ring.style.height = 2 * R + "px"; ring.style.left = (el.offsetLeft + el.offsetWidth / 2 - R) + "px"; ring.style.top = (el.offsetTop + el.offsetHeight / 2 - R) + "px"; ring.style.opacity = String(0.5 * k);
        });
      };
  MW.effectRimGlow = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
      </script>
      <script>
        (function () {
          var tl = gsap.timeline({ paused: true });
          var q = function (s) { return document.querySelector(s); }, qa = function (s) { return Array.prototype.slice.call(document.querySelectorAll(s)); };
          MW.effectRimGlow(q(".rg-d"), tl, 0, {});
          tl.set({}, {}, 3);
          // register only when every motion is ready (MW.pending: e.g. a WebGL texture still decoding), as HyperFrames asks of async builds
          var go = function () { window.__timelines = window.__timelines || {}; window.__timelines["mw-demo"] = tl; };
          if (window.MW && MW.pending && MW.pending.length) Promise.all(MW.pending).then(go, go); else go();
        })();
      </script>
    </div>
  </body>
