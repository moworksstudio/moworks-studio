<!--
  View Crossfade (TakayuStudio (motion-reference), No licence stated: idea and numbers only, written from the idea (site read 12/10/2026)).
  Source: motion-reference.takayustudio.jp/#motion=view-crossfade (read 12/10/2026).
  Cảnh cũ mờ đi trong lúc cảnh mới hiện lên cùng lúc, không di chuyển và không có khung trống ở giữa.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.transitionTakayuCrossfade(q(".tk-b"), tl, 1.2, {});

  Options (defaults in brackets):
      - duration: s (0.52)
      - ease: power2.inOut
      - from: the outgoing scene

  Notes: Idea and numbers (TakayuStudio view-crossfade, written here): Two scenes overlap: outgoing opacity 1 → 0 and incoming 0 → 1 at the same time, 520 ms power2.inOut (easeInOutCubic), no movement, no empty frame between. Targets [out inner, in inner] as in transition/push. Params: duration (0.52 s) · ease (power2.inOut) · targets: [cảnh ra, cảnh vào]. Unlike the dissolve, the outgoing scene fades out at the same time (no movement, no empty frame).
-->

<section class="tk-scene tk-a"><div class="tk-mark circle"></div><div class="tk-sc-text"><div class="tk-sc-letter">A</div><div class="tk-sc-cap">Cảnh mở đầu</div></div></section>
<section class="tk-scene tk-b"><div class="tk-mark square"></div><div class="tk-sc-text"><div class="tk-sc-letter">B</div><div class="tk-sc-cap">Cảnh tiếp theo</div></div></section>

<style>

</style>

<script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.drive = MW.drive || function (tl, at, dur, fn) {
    var s = { t: 0 }; fn(0);
    tl.fromTo(s, { t: 0 }, { t: dur, duration: dur, ease: "none", immediateRender: false, onUpdate: function () { fn(s.t); } }, at);
    return at + dur;
  };
  var defaults = {"duration":0.52,"ease":"power2.inOut","from":null};
  var run = function (el, tl, at, o) {
        var out = o.from ? MW.el(o.from) : el.previousElementSibling, io = gsap.parseEase(o.ease);
        return MW.drive(tl, at, o.duration, function (t) { var p = io(t / o.duration); el.style.opacity = String(p); el.style.visibility = p > 0 ? "visible" : "hidden"; if (out) out.style.opacity = String(1 - p); });
      };
  MW.transitionTakayuCrossfade = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
</script>
