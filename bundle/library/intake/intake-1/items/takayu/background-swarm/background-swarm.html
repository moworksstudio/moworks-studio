  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.backgroundSwarm(q(".gm"), tl, 0, {});

  Options (defaults in brackets):
      - count: (40)
      - duration: s (6)
      - seed: speeds and radii

  Notes: Idea and numbers (TakayuStudio pt-swarm, written here): 40 dots (r 2.5) orbit a centre that drifts +-50 px in x (6 s) and +-20 px in y (3 s); dot i angle a = t x (0.6-1.4 rad/s, seeded) + i, radius 20 + smooth noise x 50 px; x = cos(a) r, y = sin(1.3 a) x 0.6 r (a Lissajous wobble); 1 in 5 accent. Make periods divide the loop length. Params: count (40) · radius (20–70 px) · drift (±50 / ±20 px) · seed.

<script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.rand = MW.rand || function (seed) {
    var a = typeof seed === "string" ? MW.hash(seed) : (seed >>> 0) || 1;
    return function () { a = (a + 0x6d2b79f5) >>> 0; var t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  };
  MW.hash = MW.hash || function (s) { var h = 2166136261; s = String(s); for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; };
  MW.noise = MW.noise || function (seed) {
    var r = MW.rand(seed), v = []; for (var i = 0; i < 512; i++) v.push(r() * 2 - 1);
    return function (t) { var i = Math.floor(t), f = t - i, a = v[((i % 512) + 512) % 512], b = v[(((i + 1) % 512) + 512) % 512], s = f * f * (3 - 2 * f); return a + (b - a) * s; };
  };
  MW.drive = MW.drive || function (tl, at, dur, fn) {
    var s = { t: 0 }; fn(0);
    tl.fromTo(s, { t: 0 }, { t: dur, duration: dur, ease: "none", immediateRender: false, onUpdate: function () { fn(s.t); } }, at);
    return at + dur;
  };
  MW.canvas = MW.canvas || function (host, w, h) {
    host = MW.el(host);
    var cv = document.createElement("canvas"); w = w || host.clientWidth || 1920; h = h || host.clientHeight || 1080;
    cv.width = w; cv.height = h; cv.style.position = "absolute"; cv.style.left = "0"; cv.style.top = "0"; cv.style.width = w + "px"; cv.style.height = h + "px"; cv.style.pointerEvents = "none";
    host.appendChild(cv);
    return { cv: cv, ctx: cv.getContext("2d"), w: w, h: h };
  };
  MW.stage320 = MW.stage320 || function (host) {
    host = MW.el(host); if (getComputedStyle(host).position === "static") host.style.position = "relative";
    var c = MW.canvas(host), k = Math.min(c.w / 320, c.h / 200), ox = (c.w - 320 * k) / 2, oy = (c.h - 200 * k) / 2;
    return { ctx: c.ctx, cv: c.cv, k: k, ox: ox, oy: oy, w: c.w, h: c.h,
      clear: function () { c.ctx.setTransform(1, 0, 0, 1, 0, 0); c.ctx.clearRect(0, 0, c.w, c.h); c.ctx.setTransform(k, 0, 0, k, ox, oy); },
      put: function (el, x, y) { el.style.position = "absolute"; el.style.left = (ox + x * k) + "px"; el.style.top = (oy + y * k) + "px"; gsap.set(el, { xPercent: -50, yPercent: -50 }); } };
  };
  var defaults = {"count":40,"duration":6,"seed":3};
  var run = function (el, tl, at, o) {
        var S = MW.stage320(el), c = S.ctx, r = MW.rand(o.seed), D = [], nz = MW.noise(o.seed + 1);

        });
      };

    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
