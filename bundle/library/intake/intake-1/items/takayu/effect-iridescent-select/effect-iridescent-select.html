  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.effectIridescentSelect(q(".gm"), tl, 0, {});

  Options (defaults in brackets):
      - rows: the list rows
      - row: index selected (1)
      - at: s (0.55)
      - accent: outline
      - seed: edge noise
      - loop: s (4.2)

  Notes: Idea and numbers (TakayuStudio catalog-ui-material-oil-slick, written here): List card 144x128 r12 (rows 42 px apart). The selected row gets a superellipse blob (exponent 4) 124x32, growing from 80 % width / 60 % height on a spring k160 d14 at 0.55 s, edge noise ±5 / ±3.5 px drifting over the 4.2 s cycle, filled with diagonal bands in 5 colours (2 px lines, 8 px apart, slope 0.45, 5 px sine wobble) at 50 % flowing 40 px per 4.2 s; the same bands at 7 % over the card; 1.5 px accent outline. Out 3.55-3.95 s. Params: blob (124x32, k160 c14) · edge noise (±5 / ±3.5 px) · bands (5 màu, 2 px, cách 8 px) · flow (40 px / 4.2 s). A superellipse (exponent 4) grows on a spring k160 c14 with a slowly drifting edge; five-colour diagonal bands flow inside it at 50 % and over the card at 7 %.
