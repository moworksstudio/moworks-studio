<!--
  Blur Crossfade (TakayuStudio (motion-reference), No licence stated: idea and numbers only, written from the idea (site read 12/10/2026)).
  Source: motion-reference.takayustudio.jp/#motion=tr-blur (read 12/10/2026).
  Hai cảnh cùng nhoè lên đỉnh ở giữa rồi rõ lại, cảnh mới hiện dần đè lên, như tiêu điểm vừa chuyển.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.transitionBlurCrossfade(q(".tk-b"), tl, 1.2, {});

  Options (defaults in brackets):
      - duration: s (0.6)
      - blur: px at the peak, half-way (14; the site's demo 10, here ×4 for the film)
      - from: the outgoing scene

  Notes: Idea and numbers (TakayuStudio tr-blur, written here): Both scenes blur 0 -> 14 px -> 0 as a half-sine over 600 ms (demo peak 10 px); incoming opacity 0 -> 1 easeInOutSine over the same 600 ms, so the swap reads at 300 ms when the blur peaks. Params: duration (0.6 s) · blur: đỉnh nhoè (14 px) · ease (sine.inOut).
-->

<section class="tk-scene tk-a"><div class="tk-mark circle"></div><div class="tk-sc-text"><div class="tk-sc-letter">A</div><div class="tk-sc-cap">Cảnh mở đầu</div></div></section>
<section class="tk-scene tk-b"><div class="tk-mark square"></div><div class="tk-sc-text"><div class="tk-sc-letter">B</div><div class="tk-sc-cap">Cảnh tiếp theo</div></div></section>

</style>

<script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.drive = MW.drive || function (tl, at, dur, fn) {
    var s = { t: 0 }; fn(0);
    tl.fromTo(s, { t: 0 }, { t: dur, duration: dur, ease: "none", immediateRender: false, onUpdate: function () { fn(s.t); } }, at);
    return at + dur;
  };
  var defaults = {"duration":0.6,"blur":40,"from":null};
  var run = function (el, tl, at, o) {
        var out = o.from ? MW.el(o.from) : el.previousElementSibling, ease = gsap.parseEase("sine.inOut");
        return MW.drive(tl, at, o.duration, function (t) {
          var p = t / o.duration, b = o.blur * Math.sin(Math.PI * p);
          el.style.opacity = ease(p); el.style.visibility = p > 0 ? "visible" : "hidden"; el.style.filter = b > 0.01 ? "blur(" + b + "px)" : "";
          if (out) { out.style.filter = b > 0.01 ? "blur(" + b + "px)" : ""; out.style.visibility = p >= 1 ? "hidden" : "visible"; }
        });
      };
  MW.transitionBlurCrossfade = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
</script>
