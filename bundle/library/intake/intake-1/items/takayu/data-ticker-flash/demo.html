<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Price Ticker Flash - Demo</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
:root { --bg: #09090b; --fg: #fafafa; --card: #111114; --line: #27272a; }
* { box-sizing: border-box; }
html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); }
#demo { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); color: var(--fg); font-family: Inter, sans-serif; }
.center { position: absolute; inset: 0; display: grid; place-items: center; }
.row { display: flex; align-items: center; justify-content: center; gap: 48px; }
.col { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 32px; }
.h1 { font-size: 132px; font-weight: 800; letter-spacing: -0.035em; line-height: 1.1; text-align: center; }
.h2 { font-size: 84px; font-weight: 700; letter-spacing: -0.025em; line-height: 1.15; text-align: center; }
.p { font-size: 40px; line-height: 1.4; opacity: 0.72; text-align: center; }
.card { position: relative; border-radius: 28px; background: var(--card); border: 2px solid var(--line); overflow: hidden; }
.muted { opacity: 0.6; }

#demo { background: radial-gradient(100% 100% at 50% 40%, #1a1f33, #0b0d12); color: #e8ebf3; font-family: Inter, sans-serif; } .gm { position: absolute; inset: 0; }
.tf { position: absolute; inset: 0; display: grid; place-items: center; } .tf-box { display: flex; align-items: center; gap: 50px; padding: 60px 90px; border-radius: 40px; background: #151a28; border: 3px solid #2a3350; }
.tf-lab { font-size: 60px; font-weight: 700; color: #9aa3b8; } .tf-n { font-size: 170px; font-weight: 900; } .tf-tri { width: 0; height: 0; border: 40px solid transparent; }
.tf-line { position: absolute; left: 50%; top: 760px; width: 900px; height: 120px; margin-left: -450px; }
    </style>
  </head>
  <body>
    <div id="demo" data-composition-id="mw-demo" data-start="0" data-width="1920" data-height="1080" data-duration="3.6">
<div class="gm tf"><div class="tf-box"><div class="tf-lab">VN-Index</div><div class="tf-n">1.284,5</div><div class="tf-tri"></div></div>
<svg class="tf-line" viewBox="0 0 300 40"><polyline points="0,30 30,26 60,28 90,18 120,22 150,12 180,16 210,10 240,20 270,14 300,8" fill="none" stroke="#3ddc84" stroke-width="2.5"/></svg></div>
      <script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.drive = MW.drive || function (tl, at, dur, fn) {
    var s = { t: 0 }; fn(0);
    tl.fromTo(s, { t: 0 }, { t: dur, duration: dur, ease: "none", immediateRender: false, onUpdate: function () { fn(s.t); } }, at);
    return at + dur;
  };
  var defaults = {"values":["1.284,5","1.292,8","1.279,1","1.284,5"],"times":[0.4,1.6,2.8],"up":"#3ddc84","down":"#ff5d6c","arrow":null,"loop":3.6};
  var run = function (el, tl, at, o) {
        var V = o.values, n = V[0].length, cells = [], out = gsap.parseEase("power2.out"), pq = gsap.parseEase("power1.out"), tri = o.arrow ? MW.el(o.arrow) : null, col = getComputedStyle(el).color;
        el.textContent = ""; el.style.fontVariantNumeric = "tabular-nums"; el.style.display = "inline-flex"; el.style.position = "relative";
        for (var i = 0; i < n; i++) { var w = document.createElement("span"); w.style.cssText = "display:inline-block;position:relative;overflow:hidden;padding:0.08em 0;border-radius:12px;"; var a = document.createElement("span"), b = document.createElement("span"); a.style.display = "inline-block"; b.style.cssText = "position:absolute;left:0;top:0.08em;"; a.textContent = V[0][i]; w.appendChild(a); w.appendChild(b); el.appendChild(w); cells.push({ w: w, a: a, b: b }); }
        var num = function (s) { return parseFloat(s.replace(/\./g, "").replace(",", ".")); };
        return MW.drive(tl, at, o.loop, function (t) {
          var k = 0; o.times.forEach(function (tt, i) { if (t >= tt) k = i + 1; });
          var cur = V[k], prev = V[Math.max(0, k - 1)], up = num(cur) >= num(prev), d = k ? t - o.times[k - 1] : 9, cl = up ? o.up : o.down;
          cells.forEach(function (c, i) {
            var ch = k && cur[i] !== prev[i], u = out(Math.min(1, d / 0.35)), fl = 0.32 * (1 - pq(Math.min(1, d / 0.6)));
            if (ch && d < 0.35) { c.a.textContent = prev[i]; c.b.textContent = cur[i]; var s = up ? 1 : -1; gsap.set(c.a, { yPercent: -s * 30 * u }); c.a.style.opacity = String(1 - u); gsap.set(c.b, { yPercent: s * 30 * (1 - u) }); c.b.style.opacity = String(u); }
            else { c.a.textContent = cur[i]; gsap.set(c.a, { yPercent: 0 }); c.a.style.opacity = "1"; c.b.style.opacity = "0"; }
            var lit = k && cur[i] !== prev[i] && d < 0.6; c.w.style.backgroundColor = lit ? "rgba(" + (up ? "61,220,132" : "255,93,108") + "," + fl + ")" : "transparent"; c.w.style.color = lit ? gsap.utils.interpolate(col, cl, fl / 0.32) : col;
          });
          if (tri) { tri.style.borderColor = "transparent"; tri.style[up ? "borderBottomColor" : "borderTopColor"] = cl; tri.style.marginTop = up ? "-30px" : "30px"; }
        });
      };
  MW.dataTickerFlash = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
      </script>
      <script>
        (function () {
          var tl = gsap.timeline({ paused: true });
          var q = function (s) { return document.querySelector(s); }, qa = function (s) { return Array.prototype.slice.call(document.querySelectorAll(s)); };
          MW.dataTickerFlash(q(".tf-n"), tl, 0, { arrow: ".tf-tri" });
          tl.set({}, {}, 3.6);
          // register only when every motion is ready (MW.pending: e.g. a WebGL texture still decoding), as HyperFrames asks of async builds
          var go = function () { window.__timelines = window.__timelines || {}; window.__timelines["mw-demo"] = tl; };
          if (window.MW && MW.pending && MW.pending.length) Promise.all(MW.pending).then(go, go); else go();
        })();
      </script>
    </div>
  </body>
</html>
