  Khi giá đổi, chỉ các chữ số thay đổi trượt lên hoặc xuống và loé nền xanh (tăng) hay đỏ (giảm), kèm mũi tên tam giác cùng màu.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.dataTickerFlash(q(".tf-n"), tl, 0, { arrow: ".tf-tri" });

  Options (defaults in brackets):
      - values: price texts, same length
      - times: s of each change ([0.4, 1.6, 2.8])
      - up: colour for a rise
      - down: for a fall
      - arrow: the triangle element (CSS borders)
      - loop: s (3.6)

  Notes: Idea and numbers (TakayuStudio tx-ticker-flash, written here): Value changes at cues; only changed digits move: on a rise the new digit slides in from +0.3 em below (old out up), on a fall from above, 0.35 s easeOutCubic with fade; behind them a rounded flash (radius 6 px) green / red at 32 % fades over 0.6 s easeOutQuad, digits tinted the same, fading with it; a triangle up / down in that colour beside the number; tabular figures. Demo: +0.65 % at 0.4 s, down at 1.6 s, back at 2.8 s, small trend line; loop 3.6 s. Params: values: chuỗi giá theo mốc · slide (0.35 s, 0.3 em) · flash: loé nền (0.6 s, 32 %) · colors: tăng xanh / giảm đỏ.
-->
