  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.uiScrollProgressBar(q(".spb-bar"), tl, 0.3, { duration: 2.2 });

  Options (defaults in brackets):
      - duration: s it fills, linear (follows the scroll in a page)

  Notes: Idea and numbers (TakayuStudio scroll-progress, written here): Thin bar at the top edge of the viewport: scaleX 0 → 1, transform-origin left, 1 s linear (follows scroll progress, reverses with it). Text lines and a page block sit below, static. Params: duration (1 s) · origin (left) · ease (none).

<div class="spb"><div class="spb-bar"></div><b></b><i></i><i style="width:80%"></i><i></i><i style="width:60%"></i></div>

<script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.drive = MW.drive || function (tl, at, dur, fn) {
    var s = { t: 0 }; fn(0);
    tl.fromTo(s, { t: 0 }, { t: dur, duration: dur, ease: "none", immediateRender: false, onUpdate: function () { fn(s.t); } }, at);
    return at + dur;
  };
  var defaults = {"duration":1};
  var run = function (el, tl, at, o) {
        el.style.transformOrigin = "0 50%";
        return MW.drive(tl, at, o.duration, function (t) { gsap.set(el, { scaleX: t / o.duration }); });
      };
  MW.uiScrollProgressBar = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
</script>
