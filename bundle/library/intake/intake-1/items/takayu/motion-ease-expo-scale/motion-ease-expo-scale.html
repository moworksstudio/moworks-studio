  Source: motion-reference.takayustudio.jp/#motion=e-expo-scale (read 12/10/2026).
  Phóng từ 1 lên 8 lần theo hàm mũ để mỗi lần gấp đôi tốn cùng thời gian, trông đều tốc thay vì chậm đầu nhanh cuối.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.motionEaseExpoScale(q(".exp"), tl, 0.5, {});

  Options (defaults in brackets):
      - from: start scale (1)
      - to: end scale (8)
      - duration: s (1.8)
      - inner: ease of the progress (none)

  Notes: Idea and numbers (TakayuStudio e-expo-scale, written here): Zoom scale 1 → 8 over 1800 ms interpolated in log space: scale(p) = start × (end / start)^p, p linear or eased, so every doubling takes the same time; as a 0→1 ease for a scale tween 1→8: e(p) = (8^p − 1) / 7. Proposed alias expoScale(start, end[, inner ease]). Site demo: linear vs exponential zoom side by side on a small square. Params: duration (1.8 s) · from (1) · to (8) · ease trong (none). Scale interpolated in log space, so every doubling takes the same time; as a 0-1 ease for a 1 → 8 scale: (8^p − 1) / 7.
-->

<script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.drive = MW.drive || function (tl, at, dur, fn) {
    var s = { t: 0 }; fn(0);
    tl.fromTo(s, { t: 0 }, { t: dur, duration: dur, ease: "none", immediateRender: false, onUpdate: function () { fn(s.t); } }, at);
    return at + dur;
  };
  var defaults = {"from":1,"to":8,"duration":1.8,"inner":"none"};
  var run = function (el, tl, at, o) {
        var inner = gsap.parseEase(o.inner);
        return MW.drive(tl, at, o.duration, function (t) { var p = inner(Math.max(0, Math.min(1, t / o.duration))); gsap.set(el, { scale: o.from * Math.pow(o.to / o.from, p) }); });
      };
  MW.motionEaseExpoScale = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
</script>
