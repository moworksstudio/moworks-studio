  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.textRotatingLettersPill(q(".rp"), tl, 0, {});

  Options (defaults in brackets):
      - words: the words in turn
      - swaps: s of each swap ([0.7, 2.7])
      - k: spring stiffness (300)
      - c: damping (25)
      - pad: px (56)
      - loop: s (4)

  Notes: Idea and numbers (TakayuStudio tx-rotating-letters-spring, written here): Word in a rounded accent pill (padding 14 px). Every 2 s: old letters y 0 → −120 % and fade, new letters y +100 % → 0 and fade in, each on a spring (stiffness 300, damping 25, ratio ~0.72), letters 30 ms apart; new word waits until the old leaves (~0.22 s). Pill width / height track the new word size on the same spring. Demo: pill height = text + 0.18 em, radius 9 px, dark text on accent, letters clipped to the pill; swaps at 0.7 s and 2.7 s; loop 4 s. Params: words: danh sách từ · interval (2 s) · spring: độ cứng / giảm chấn (300 / 25) · stagger (0.03 s) · padding (14 px).
