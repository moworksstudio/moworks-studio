  Dòng chữ lặp lại quấn quanh một hình trụ đứng hơi nhìn từ trên xuống, trụ quay đều một vòng, chữ phía sau ngược và mờ, chữ phía trước sáng rõ.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.textCylinderRing(q(".cy"), tl, 0, {});

  Options (defaults in brackets):
      - text: the phrase
      - sep: separator
      - radius: px (600, 31 % of the width)
      - size: px (110)
      - tilt: radians seen from above (0.26)
      - perspective: px (2300)
      - period: s per turn (6)
      - turns: (1)
      - accent: separator colour
      - mute: colour of letters at the back

  Notes: Idea and numbers (TakayuStudio tx-cylinder-text, written here): Text + ' • ' (separator accent) repeated as many whole times as fit around a vertical ring of radius ≈31 % of the frame width (demo 100 px of 320; 24 px text, shrunk to fit), spacing spread to close exactly. Seen slightly from above (tilt 0.26 rad), perspective 460 px; turns −360° per 6 s linear. Each char scaled x by cos(angle) (back mirrored), opacity 0.18 (back) → 1 (front), back chars mute; draw back to front. Loop 6 s. Params: bán kính (31 % khung) · một vòng (6 s) · góc nhìn (0.26 rad) · cỡ chữ (24 px).

        var reps = Math.max(1, Math.floor(2 * Math.PI * R / w)), seg = typeof Intl !== "undefined" && Intl.Segmenter ? new Intl.Segmenter("vi", { granularity: "grapheme" }) : null;
