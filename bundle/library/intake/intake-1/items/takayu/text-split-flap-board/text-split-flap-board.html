  Bảng lật kiểu nhà ga: mỗi ô chữ lật qua vài ký tự trung gian rồi dừng đúng ký tự đích, các ô bắt đầu cách nhau 0.06 giây.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.textSplitFlapBoard(q(".sf"), tl, 0, {});

  Options (defaults in brackets):
      - text: the board line
      - flip: s per flip (0.085)
      - stagger: s between cells (0.06, ≤ 1 s)
      - start: s (0.3)
      - blankAt: s the board clears (3.4; 0.03 s per cell)
      - gap: px (10)
      - perspective: px (1600)
      - card: flap colour
      - seed: passing characters

  Notes: Idea and numbers (TakayuStudio tx-split-flap, written here): One card cell per char (≤12 per row, height 1.32 × width, 3 px gap). Each cell starts blank, flips through 3–6 seeded chars of the target's class (A–Z, 0–9, kana), then the target; one flip = top flap rotateX 0 → −90° (ease-in), then the next bottom flap 90° → 0 (ease-out), 85 ms (CSS 85 + 85 ms), perspective 400 px, falling flap darkens to 70 %. Cells start 60 ms apart (capped 1 s) from 0.3 s. Blank again at 3.4 s + 30 ms per cell; loop 4.2 s. Params: flip: mỗi lần lật (0.085 s) · stagger: giữa các ô (0.06 s) · steps: số ký tự trung gian (3–6) · seed.
-->
