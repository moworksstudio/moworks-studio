<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Split-flap Board - Demo</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
:root { --bg: #09090b; --fg: #fafafa; --card: #111114; --line: #27272a; }
* { box-sizing: border-box; }
html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); }
#demo { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); color: var(--fg); font-family: Inter, sans-serif; }
.center { position: absolute; inset: 0; display: grid; place-items: center; }
.row { display: flex; align-items: center; justify-content: center; gap: 48px; }
.col { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 32px; }
.h1 { font-size: 132px; font-weight: 800; letter-spacing: -0.035em; line-height: 1.1; text-align: center; }
.h2 { font-size: 84px; font-weight: 700; letter-spacing: -0.025em; line-height: 1.15; text-align: center; }
.p { font-size: 40px; line-height: 1.4; opacity: 0.72; text-align: center; }
.card { position: relative; border-radius: 28px; background: var(--card); border: 2px solid var(--line); overflow: hidden; }
.muted { opacity: 0.6; }

#demo { background: radial-gradient(100% 100% at 50% 45%, #1a1f33, #0b0d12); color: #e8ebf3; font-family: Inter, sans-serif; } .sw { position: absolute; inset: 0; display: grid; place-items: center; }
.sf > span::after { content: ''; position: absolute; left: 0; right: 0; top: 50%; height: 4px; margin-top: -2px; background: #0b0d12; }
    </style>
  </head>
  <body>
    <div id="demo" data-composition-id="mw-demo" data-start="0" data-width="1920" data-height="1080" data-duration="4.2">
<div class="sw"><div class="sf" style="font-size:140px;font-weight:800;color:#ffd23d">GA HÀ NỘI 09:40</div></div>
      <script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.rand = MW.rand || function (seed) {
    var a = typeof seed === "string" ? MW.hash(seed) : (seed >>> 0) || 1;
    return function () { a = (a + 0x6d2b79f5) >>> 0; var t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  };
  MW.hash = MW.hash || function (s) { var h = 2166136261; s = String(s); for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; };
  MW.drive = MW.drive || function (tl, at, dur, fn) {
    var s = { t: 0 }; fn(0);
    tl.fromTo(s, { t: 0 }, { t: dur, duration: dur, ease: "none", immediateRender: false, onUpdate: function () { fn(s.t); } }, at);
    return at + dur;
  };
  var defaults = {"text":"GA HÀ NỘI 09:40","flip":0.085,"stagger":0.06,"start":0.3,"blankAt":3.4,"gap":10,"perspective":1600,"card":"#1d2232","seed":7};
  var run = function (el,tl,at,o
  ) {
  var seg = typeof Intl !== "undefined" && Intl.Segmenter ? new Intl.Segmenter("vi", { granularity: "grapheme" }) : null;
  var gr = function (s) { s = String(s).normalize("NFC"); if (!seg) return Array.from(s); var out = [], it = seg.segment(s)[Symbol.iterator](), r; while (!(r = it.next()).done) out.push(r.value.segment); return out; };
  var target = gr(o.text), r = MW.rand(o.seed), cells = [], pin = gsap.parseEase("power1.in"), pout = gsap.parseEase("power1.out");
  var cls = function (g) { return /[0-9]/.test(g) ? "0123456789" : /[A-ZĐĂÂÊÔƠƯÀ-Ỹ]/i.test(g) ? "ABCDEGHIKLMNOPQRSTUVXY" : ":-. "; };
  el.textContent = ""; el.style.display = "inline-flex"; el.style.gap = o.gap + "px";
  target.forEach(function (g, i) {
    var c = document.createElement("span"); c.style.cssText = "position:relative;display:inline-block;width:0.78em;height:1.03em;perspective:" + o.perspective + "px;";
    var mkHalf = function (top) { var h = document.createElement("span"); h.style.cssText = "position:absolute;left:0;right:0;height:50%;overflow:hidden;background:" + o.card + ";" + (top ? "top:0;border-radius:0.08em 0.08em 0 0;transform-origin:50% 100%;" : "bottom:0;border-radius:0 0 0.08em 0.08em;transform-origin:50% 0;"); var t = document.createElement("span"); t.style.cssText = "position:absolute;left:0;right:0;height:1.03em;line-height:1.03em;text-align:center;" + (top ? "top:0;" : "bottom:0;"); h.appendChild(t); c.appendChild(h); return { h: h, t: t }; };
    var parts = { topNext: mkHalf(true), botCur: mkHalf(false), flapTop: mkHalf(true), flapBot: mkHalf(false) };
    var seq = [" "], steps = 3 + Math.floor(r() * 4), pool = cls(g); for (var k = 0; k < steps; k++) seq.push(pool[Math.floor(r() * pool.length)]); seq.push(g); if (g === " ") seq = [" ", " "];
    el.appendChild(c); cells.push({ p: parts, seq: seq, i: i });
  });
  var n = cells.length, st = Math.min(o.stagger, 1 / Math.max(1, n - 1));
  return MW.drive(tl, at, o.blankAt + 0.03 * n + 0.2, function (t) {
    cells.forEach(function (cell) {
      var seq = cell.seq, F = o.flip, t0 = o.start + cell.i * st, blank = t >= o.blankAt + 0.03 * cell.i, k = Math.floor((t - t0) / F), u = ((t - t0) / F) - k;
      var cur, nxt, phase;
      if (blank) { cur = nxt = " "; phase = -1; } else if (t < t0) { cur = nxt = seq[0]; phase = -1; } else if (k >= seq.length - 1) { cur = nxt = seq[seq.length - 1]; phase = -1; } else { cur = seq[k]; nxt = seq[k + 1]; phase = u; }
      var P = cell.p; P.topNext.t.textContent = nxt; P.botCur.t.textContent = phase < 0 ? nxt : cur; P.flapTop.t.textContent = cur; P.flapBot.t.textContent = nxt;
      if (phase < 0) { P.flapTop.h.style.visibility = "hidden"; P.flapBot.h.style.visibility = "hidden"; return; }
      var a1 = phase < 0.5 ? -90 * pin(phase / 0.5) : -90, a2 = phase < 0.5 ? 90 : 90 * (1 - pout((phase - 0.5) / 0.5));
      P.flapTop.h.style.visibility = phase < 0.5 ? "visible" : "hidden"; P.flapTop.h.style.transform = "rotateX(" + a1 + "deg)"; P.flapTop.h.style.filter = "brightness(" + (1 - 0.3 * Math.min(1, phase / 0.5)) + ")";
      P.flapBot.h.style.visibility = phase >= 0.5 ? "visible" : "hidden"; P.flapBot.h.style.transform = "rotateX(" + a2 + "deg)";
    });
  });
  };
  MW.textSplitFlapBoard = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
      </script>
      <script>
        (function () {
          var tl = gsap.timeline({ paused: true });
          var q = function (s) { return document.querySelector(s); }, qa = function (s) { return Array.prototype.slice.call(document.querySelectorAll(s)); };
          MW.textSplitFlapBoard(q(".sf"), tl, 0, {});
          tl.set({}, {}, 4.2);
          // register only when every motion is ready (MW.pending: e.g. a WebGL texture still decoding), as HyperFrames asks of async builds
          var go = function () { window.__timelines = window.__timelines || {}; window.__timelines["mw-demo"] = tl; };
          if (window.MW && MW.pending && MW.pending.length) Promise.all(MW.pending).then(go, go); else go();
        })();
      </script>
    </div>
  </body>
</html>
