  Mười hai bản sao của một viên con nhộng xếp quanh tâm, thay nhau chạy ra vào lệch nhịp như vạn hoa, cả vòng xoay chậm.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.shapeRadialRepeater(q(".rr"), tl, 0, {});

  Options (defaults in brackets):
      - inner: px (90)
      - outer: px (190)
      - period: s out and back (1.5)
      - offset: s per copy (0.08)
      - spin: degrees per second (23)
      - duration: s (4)

  Notes: Idea and numbers (TakayuStudio sh-repeater, written here): 12 copies of one shape (a 34 x 10 px pill) around a centre, copy i rotated i x 30 deg, the ring turning slowly (~23 deg/s). Each copy moves out from the centre 18 -> 38 px and back (sine ping-pong, 1.5 s period), copy i delayed i x 80 ms (recipe 60 ms), easeInOutSine; every third copy accent. Params: copies (12) · radius (18 → 38 px) · offset (80 ms) · period (1.5 s).
-->

<script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.drive = MW.drive || function (tl, at, dur, fn) {
    var s = { t: 0 }; fn(0);
    tl.fromTo(s, { t: 0 }, { t: dur, duration: dur, ease: "none", immediateRender: false, onUpdate: function () { fn(s.t); } }, at);
    return at + dur;
  };
  var defaults = {"inner":90,"outer":190,"period":1.5,"offset":0.08,"spin":23,"duration":4};
  var run = function (el, tl, at, o) {
        var pills = Array.prototype.slice.call(el.children), si = gsap.parseEase("sine.inOut");
        return MW.drive(tl, at, o.duration, function (t) {
          var W = el.offsetWidth, Hh = el.offsetHeight, spin = o.spin * t;
          pills.forEach(function (p, i) { var a = i * 360 / pills.length + spin, u = ((t - i * o.offset) / o.period) % 1, k = u < 0 ? 0 : si(u < 0.5 ? u * 2 : 2 - u * 2), r = o.inner + (o.outer - o.inner) * k;
            gsap.set(p, { x: W / 2 + r * Math.cos(a * Math.PI / 180) - p.offsetWidth / 2, y: Hh / 2 + r * Math.sin(a * Math.PI / 180) - p.offsetHeight / 2, rotation: a }); });
        });
      };
  MW.shapeRadialRepeater = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
</script>
