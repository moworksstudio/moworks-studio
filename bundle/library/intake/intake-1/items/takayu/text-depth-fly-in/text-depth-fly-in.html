  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline

    MW.textDepthFlyIn(q(".tk-head"), tl, 0.3, { exit: 2.1 });

  Options (defaults in brackets):
      - depth: z at the start, px (−800)
      - perspective: px (1000)
      - duration: s (0.9), back.out(1.2)
      - stagger: s (0.04, ≤ 0.9 s)
      - color: trail colour
      - exit: s after the start to fade (null)

  Notes: Idea and numbers (TakayuStudio tx-z-fly-in, written here): Per char: z −800 → 0 with perspective 1000 px toward the frame centre (position and scale × P / (P − z)), back.out(1.2) 0.9 s (slight overshoot past z 0), stagger 0.04 s (capped at 0.9 s total), from 0.3 s; opacity = 0.2 → 1 following z. Three accent trail copies 30 / 60 / 90 ms behind at opacity 0.24 / 0.18 / 0.12. Exit 2.4–2.75 s fade power2.in. Loop 3.2 s. Params: độ sâu (z −800 px) · phối cảnh (1000 px) · thời gian (0.9 s) · cách nhau (0.04 s).
