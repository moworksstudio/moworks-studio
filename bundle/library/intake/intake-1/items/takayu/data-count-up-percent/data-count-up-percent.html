<!--
  Count Up (TakayuStudio (motion-reference), No licence stated: idea and numbers only, written from the idea (site read 12/10/2026)).
  Source: motion-reference.takayustudio.jp/#motion=count-up (read 12/10/2026).
  Con số đếm từng số nguyên từ 0 lên 100 với chữ số đều nhau nên không xô ngang, rồi đứng yên ở đích.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.dataCountUpPercent(q(".cu"), tl, 0, {});

  Options (defaults in brackets):
      - from: (0)
      - to: (100)
      - start: s (0.26)
      - duration: s (1.28), linear through every integer
      - suffix: (%)

  Notes: Idea and numbers (TakayuStudio count-up, written here): Number 48 px weight 850, tabular digits, right-aligned in a 104x56 window, % unit beside. In a 2.2 s loop it steps through every integer 0 → 100 linearly from 12 % to 70 % (0.26-1.54 s; recipe floor(progress × 100)); holds 100. Motion data: 1 s easeOutCubic. Params: from (0) · to (100) · duration (1.28 s) · suffix (%) · ease (none). Tabular digits, so the number does not shift sideways; right-align it in a fixed box.
-->

<div class="st"><div class="cu">0%</div></div>

<style>

</style>

<script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.drive = MW.drive || function (tl, at, dur, fn) {
    var s = { t: 0 }; fn(0);
    tl.fromTo(s, { t: 0 }, { t: dur, duration: dur, ease: "none", immediateRender: false, onUpdate: function () { fn(s.t); } }, at);
    return at + dur;
  };
  var defaults = {"from":0,"to":100,"start":0.26,"duration":1.28,"suffix":"%"};
  var run = function (el, tl, at, o) {
        el.style.fontVariantNumeric = "tabular-nums";
        return MW.drive(tl, at, o.start + o.duration, function (t) { var p = Math.max(0, Math.min(1, (t - o.start) / o.duration)); el.textContent = Math.floor(o.from + (o.to - o.from) * p + 1e-6) + o.suffix; });
      };
  MW.dataCountUpPercent = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
</script>
