<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Diagonal Wipe - Demo</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
:root { --bg: #09090b; --fg: #fafafa; --card: #111114; --line: #27272a; }
* { box-sizing: border-box; }
html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); }
#demo { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); color: var(--fg); font-family: Inter, sans-serif; }
.center { position: absolute; inset: 0; display: grid; place-items: center; }
.row { display: flex; align-items: center; justify-content: center; gap: 48px; }
.col { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 32px; }
.h1 { font-size: 132px; font-weight: 800; letter-spacing: -0.035em; line-height: 1.1; text-align: center; }
.h2 { font-size: 84px; font-weight: 700; letter-spacing: -0.025em; line-height: 1.15; text-align: center; }
.p { font-size: 40px; line-height: 1.4; opacity: 0.72; text-align: center; }
.card { position: relative; border-radius: 28px; background: var(--card); border: 2px solid var(--line); overflow: hidden; }
.muted { opacity: 0.6; }

#demo { background: radial-gradient(100% 100% at 50% 45%, #1a1f33, #0b0d12); color: #e8ebf3; font-family: Inter, sans-serif; }
.st { position: absolute; inset: 0; display: grid; place-items: center; } .dw { width: 1000px; height: 600px; border-radius: 40px; overflow: hidden; background: linear-gradient(180deg, #ffb18f 0%, #ff8fab 55%, #6a4cf0 100%); position: relative; } .dw::before { content: ""; position: absolute; left: 640px; top: 120px; width: 180px; height: 180px; border-radius: 50%; background: #fff3c4; }
.dw::after { content: ""; position: absolute; left: -100px; right: -100px; bottom: -260px; height: 520px; border-radius: 50%; background: #3a2a6b; box-shadow: 380px -60px 0 -40px #4a3a8b; }
    </style>
  </head>
  <body>
    <div id="demo" data-composition-id="mw-demo" data-start="0" data-width="1920" data-height="1080" data-duration="2.4">
<div class="st"><div class="dw"></div></div>
      <script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.drive = MW.drive || function (tl, at, dur, fn) {
    var s = { t: 0 }; fn(0);
    tl.fromTo(s, { t: 0 }, { t: dur, duration: dur, ease: "none", immediateRender: false, onUpdate: function () { fn(s.t); } }, at);
    return at + dur;
  };
  var defaults = {"duration":0.68,"angle":45,"exitAt":null};
  var run = function (el,tl,at,o
  ) {
  var host = el.parentNode; if (getComputedStyle(host).position === "static") host.style.position = "relative";
  var ghost = function () { var g = el.cloneNode(true); g.removeAttribute("id"); g.style.position = "absolute"; g.style.margin = "0"; g.style.pointerEvents = "none"; g.style.opacity = "0"; g.style.left = el.offsetLeft + "px"; g.style.top = el.offsetTop + "px"; g.style.width = el.offsetWidth + "px"; g.style.height = el.offsetHeight + "px"; host.insertBefore(g, el); return g; };
  var add = function (css) { var d = document.createElement("div"); d.style.cssText = "position:absolute;pointer-events:none;" + css; host.appendChild(d); return d; };
  var cx0 = el.offsetLeft + el.offsetWidth / 2, cy0 = el.offsetTop + el.offsetHeight / 2;
  var e = gsap.parseEase("power4.inOut"), pin = gsap.parseEase("power2.in"), line = add("left:" + el.offsetLeft + "px;top:" + el.offsetTop + "px;width:" + el.offsetWidth + "px;height:" + el.offsetHeight + "px;border-radius:" + getComputedStyle(el).borderRadius + ";opacity:0;");
  return MW.drive(tl, at, o.exitAt == null ? o.duration : o.exitAt + 0.32, function (t) { var p = 100 * e(Math.min(1, t / o.duration)), x = o.exitAt != null ? pin(Math.max(0, Math.min(1, (t - o.exitAt) / 0.32))) : 0, m = "linear-gradient(" + o.angle + "deg, #000 " + p.toFixed(2) + "%, transparent " + (p + 0.01).toFixed(2) + "%)";
    el.style.webkitMaskImage = el.style.maskImage = p >= 100 ? "none" : m; el.style.opacity = String(1 - x); line.style.background = "linear-gradient(" + o.angle + "deg, transparent " + (p - 0.6).toFixed(2) + "%, rgba(255,255,255,0.9) " + p.toFixed(2) + "%, transparent " + (p + 0.6).toFixed(2) + "%)"; line.style.opacity = p > 0 && p < 100 ? "1" : "0"; });
  };
  MW.motionDiagonalWipe = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
      </script>
      <script>
        (function () {
          var tl = gsap.timeline({ paused: true });
          var q = function (s) { return document.querySelector(s); }, qa = function (s) { return Array.prototype.slice.call(document.querySelectorAll(s)); };
          MW.motionDiagonalWipe(q(".dw"), tl, 0.3, { exitAt: 1.7 });
          tl.set({}, {}, 2.4);
          // register only when every motion is ready (MW.pending: e.g. a WebGL texture still decoding), as HyperFrames asks of async builds
          var go = function () { window.__timelines = window.__timelines || {}; window.__timelines["mw-demo"] = tl; };
          if (window.MW && MW.pending && MW.pending.length) Promise.all(MW.pending).then(go, go); else go();
        })();
      </script>
    </div>
  </body>
</html>
