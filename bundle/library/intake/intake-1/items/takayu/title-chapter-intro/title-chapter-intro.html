    MW.titleChapterIntro(q(".ci"), tl, 0, {});

  Options (defaults in brackets):
      - rule: px each side (360)
      - outAt: s (2.3)

  Notes: Idea and numbers (TakayuStudio catalog-game-cinematic-chapter-intro, written here): px @320x200. 'CHAPTER' + accent '04' (11 px) fade in and rise 6 px (0.3-0.8 s outCubic). Rule grows from the centre to ±72 px (0.62-1.12 s inOut) with 5 px diamond ends riding its tips. Title (26 px) rises 36 px out of a clip box (0.95-1.55 s outExpo). No scale anywhere. All fade out 2.3-2.6 s in-cubic. Params: chapter: nhãn chương ("CHƯƠNG 04") · title: tên chương · rule: vạch (±72 px) · gap: cách nhau (0.33 s) · outAt: lúc ra (2.3 s).

<script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.bezier = MW.bezier || function (x1, y1, x2, y2) {
    var cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx, cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
    var X = function (t) { return ((ax * t + bx) * t + cx) * t; }, Y = function (t) { return ((ay * t + by) * t + cy) * t; }, dX = function (t) { return (3 * ax * t + 2 * bx) * t + cx; };
    return function (p) {
      if (p <= 0) return 0; if (p >= 1) return 1;
      var t = p, i, d;
      for (i = 0; i < 8; i++) { d = X(t) - p; if (Math.abs(d) < 1e-6) return Y(t); var s = dX(t); if (Math.abs(s) < 1e-6) break; t -= d / s; }
      var lo = 0, hi = 1; t = p;
      for (i = 0; i < 40; i++) { d = X(t); if (Math.abs(d - p) < 1e-6) break; if (d < p) lo = t; else hi = t; t = (lo + hi) / 2; }
      return Y(t);
    };
  };
  MW.CSS_EASE = { ease: [0.25, 0.1, 0.25, 1], easeIn: [0.42, 0, 1, 1], easeOut: [0, 0, 0.58, 1], easeInOut: [0.42, 0, 0.58, 1] };
  MW.EASES = MW.EASES || { "css-ease": [0.25, 0.1, 0.25, 1], "css-in": [0.42, 0, 1, 1], "css-out": [0, 0, 0.58, 1], "css-in-out": [0.42, 0, 0.58, 1],
    md3: [0.2, 0, 0, 1], "md3-emph": [0.05, 0.7, 0.1, 1], "md3-acc": [0.3, 0, 1, 1], "md3-dec": [0, 0, 0, 1], whip: [0.9, 0, 0.1, 1], glide: [0.4, 0, 0.2, 1],
    house: [0.83, 0, 0.17, 1], "in-out": [0.65, 0, 0.35, 1] };
  MW.ez = MW.ez || function (name) {
    if (typeof name === "function") return name;
    var b = MW.EASES[name]; if (b) return MW.bezier(b[0], b[1], b[2], b[3]);
    var m = /^cubic-bezier\(([^)]+)\)$/.exec(name || ""); if (m) { var v = m[1].split(",").map(Number); return MW.bezier(v[0], v[1], v[2], v[3]); }
    return gsap.parseEase(name || "none");
  };
  MW.drive = MW.drive || function (tl, at, dur, fn) {
    var s = { t: 0 }; fn(0);
    tl.fromTo(s, { t: 0 }, { t: dur, duration: dur, ease: "none", immediateRender: false, onUpdate: function () { fn(s.t); } }, at);
    return at + dur;
  };
  var defaults = {"rule":360,"outAt":2.3};
  var run = function (el, tl, at, o) {
        var lab = el.querySelector(".ci-lab"), rule = el.querySelector(".ci-rule"), dia = el.querySelectorAll(".ci-dia"), title = el.querySelector(".ci-title"), out = gsap.parseEase("power2.out"), io = MW.ez("in-out"), ex = gsap.parseEase("expo.out"), pi = gsap.parseEase("power2.in");
        var c = function (a, b, t) { return Math.max(0, Math.min(1, (t - a) / (b - a))); };
        return MW.drive(tl, at, o.outAt + 0.3, function (t) {
          var f = 1 - pi(c(o.outAt, o.outAt + 0.3, t)), a = out(c(0.3, 0.8, t)), r = io(c(0.62, 1.12, t)), x = ex(c(0.95, 1.55, t));
          gsap.set(lab, { y: 30 * (1 - a) }); lab.style.opacity = String(a * f);
          gsap.set(rule, { scaleX: r }); rule.style.opacity = String(f); dia.forEach(function (d, i) { gsap.set(d, { x: (i ? 1 : -1) * o.rule * r, rotation: 45 }); d.style.opacity = String(r > 0 ? f : 0); });
          gsap.set(title, { y: 180 * (1 - x) }); title.style.opacity = String(f);
        });
      };
  MW.titleChapterIntro = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
