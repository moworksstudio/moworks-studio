  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.textCollapseToCenter(q(".tk-head"), tl, 0, {});

  Options (defaults in brackets):
      - duration: s per letter (0.5)
      - stagger: s from both ends inward (0.05)
      - cap: s (0.4)
      - ease: (cubic-bezier(.55,.055,.675,.19))
      - accent: 
      - outAt: s (0.9)
      - ringAt: s the ring pulses (1.45)
      - backAt: s (2.4)
      - loop: s (3)

  Notes: Idea and numbers (TakayuStudio tx-collapse-to-center, written here): Per char: move to the text box centre (offset = box centre − char centre, measured, x and y), scale 1 → 0, opacity 1 → 0 (demo only to 0.6), 0.5 s easeInCubic (CSS cubic-bezier(.55,.055,.675,.19), labelled power3.in); stagger 30 ms from the edges inward (outer chars first; demo 50 ms capped 0.4 s), from 0.9 s. Demo: a centre dot grows 1.5 → 5.5 px with the collapse, then an accent ring 6 → 28 px pulses out 1.45–1.9 s. Loop: text fades back 2.4–2.9 s; loop 3 s. Params: duration (0.5 s) · stagger: từ hai đầu vào (0.03 s) · ease (easeInCubic) · ring: vòng loé ở tâm (bật).
