  Gravity Drop (TakayuStudio (motion-reference), No licence stated: idea and numbers only, written from the idea (site read 12/10/2026)).
  Source: motion-reference.takayustudio.jp/#motion=tr-drop (read 12/10/2026).
  Cảnh cũ nằm trên cùng, nghiêng và rơi khỏi khung như bị trọng lực kéo, lộ cảnh mới đứng yên bên dưới.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.transitionGravityDrop(q(".tk-b"), tl, 1.1, { drop: 1.3, rotate: 20, ease: "power2.in" });

  Options (defaults in brackets):
      - duration: s (0.7)
      - drop: fall, × the frame height (1.2; the site's demo 1.3)
      - rotate: degrees about the top centre (10; demo 20)
      - ease: power1.in (quad; demo power2.in)
      - from: the outgoing scene, which falls; the incoming waits still underneath

  Notes: Idea and numbers (TakayuStudio tr-drop, written here): Outgoing scene stays on top and falls: y 0 -> +120 % of frame height and rotation 0 -> 10 deg about its top centre, 700 ms easeInQuad; the incoming scene sits still underneath from the start. Demo: +130 %, 20 deg, ease-in cubic. HF showcase-other ships a Gravity Drop. Params: duration (0.7 s) · drop (120 %) · rotate (10°).
-->

<section class="tk-scene tk-b"><div class="tk-mark square"></div><div class="tk-sc-text"><div class="tk-sc-letter">B</div><div class="tk-sc-cap">Cảnh tiếp theo</div></div></section>

<script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.drive = MW.drive || function (tl, at, dur, fn) {
    var s = { t: 0 }; fn(0);
    tl.fromTo(s, { t: 0 }, { t: dur, duration: dur, ease: "none", immediateRender: false, onUpdate: function () { fn(s.t); } }, at);
    return at + dur;
  };
  var defaults = {"duration":0.7,"drop":1.2,"rotate":10,"ease":"power1.in","from":null};
  var run = function (el, tl, at, o) {
        var out = o.from ? MW.el(o.from) : el.previousElementSibling, ease = gsap.parseEase(o.ease), H = el.offsetHeight;
        el.style.visibility = "visible";
        return MW.drive(tl, at, o.duration, function (t) {
          var p = ease(t / o.duration);
          if (out) { gsap.set(out, { y: o.drop * H * p, rotation: o.rotate * p, transformOrigin: "50% 0%", zIndex: 3 }); out.style.visibility = p >= 1 ? "hidden" : "visible"; }
        });
      };
  MW.transitionGravityDrop = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
</script>
