  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.uiToggleMorph(q(".tm"), tl, 0, { cursor: ".ui-cursor" });

  Options (defaults in brackets):
      - knob: 
      - onLabel: 
      - offLabel: 
      - travel: px (224)
      - onAt: s (0.5): spring k300 c20, about 10 % over
      - offAt: s (1.9): spring k420 c40
      - squash: scaleX per px a second (0.0005), at most 0.16
      - onColor: 
      - offColor: 
      - cursor: an optional cursor
      - approach: [x, y] px the cursor comes from
      - lead: s it arrives before a click

  Notes: Idea and numbers (TakayuStudio toggle-morph, written here): Track 120x56 r28, grey → accent crossfade with knob progress. Knob circle r22 travels x +56 px on spring(k300, c20) from 0.5 s (about 10 % overshoot); back at 1.9 s on spring(k420, c40). Knob squash: scaleX = 1 + min(0.16, speed × 0.02), scaleY inverse. Check stroke draws inside the knob as progress goes 0.35 → 1; OFF fades out, ON fades in. Cursor arrives 0.05-0.4 s (power2.out), presses at 0.47 and 1.87 s, leaves 2.3-2.75 s. Params: travel (56 px) · spring on (k300 c20) · spring off (k420 c40) · squash (tối đa 0.16) · at.
