    <style>
:root { --bg: #09090b; --fg: #fafafa; --card: #111114; --line: #27272a; }
* { box-sizing: border-box; }
html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); }
#demo { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); color: var(--fg); font-family: Inter, sans-serif; }
.center { position: absolute; inset: 0; display: grid; place-items: center; }
.row { display: flex; align-items: center; justify-content: center; gap: 48px; }
.col { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 32px; }
.h1 { font-size: 132px; font-weight: 800; letter-spacing: -0.035em; line-height: 1.1; text-align: center; }
.h2 { font-size: 84px; font-weight: 700; letter-spacing: -0.025em; line-height: 1.15; text-align: center; }
.p { font-size: 40px; line-height: 1.4; opacity: 0.72; text-align: center; }
.card { position: relative; border-radius: 28px; background: var(--card); border: 2px solid var(--line); overflow: hidden; }
.muted { opacity: 0.6; }

#demo { background: radial-gradient(100% 100% at 50% 45%, #1a1f33, #0b0d12); color: #e8ebf3; font-family: Inter, sans-serif; }
.st { position: absolute; inset: 0; display: grid; place-items: center; } .cd { width: 760px; height: 440px; border-radius: 40px; background: #1b2130; border: 3px solid #2a3350; padding: 60px; box-sizing: border-box; } .cd b { display: block; width: 50%; height: 50px; border-radius: 25px; background: #8b7bff; margin-bottom: 50px; } .cd i { display: block; height: 30px; border-radius: 15px; background: #3a4466; margin-top: 30px; } .ca-l { position: absolute; left: 400px; right: 400px; top: 764px; height: 4px; background: #262c3a; }
    </style>

    <div id="demo" data-composition-id="mw-demo" data-start="0" data-width="1920" data-height="1080" data-duration="2.4">
<div class="ca-l"></div><div class="st"><div class="cd"><b></b><i></i><i style="width:60%"></i></div></div>
      <script>
(function () {

    md3: [0.2, 0, 0, 1], "md3-emph": [0.05, 0.7, 0.1, 1], "md3-acc": [0.3, 0, 1, 1], "md3-dec": [0, 0, 0, 1], whip: [0.9, 0, 0.1, 1], glide: [0.4, 0, 0.2, 1],
    house: [0.83, 0, 0.17, 1], "in-out": [0.65, 0, 0.35, 1] };

  var defaults = {"duration":0.56,"to":0.05,"origin":"50% 100%","ease":"cubic-bezier(.36,0,.66,-.56)","returnAt":null};
  var run = function (el, tl, at, o) {
        var e = MW.ez(o.ease), p2 = gsap.parseEase("power2.out"); gsap.set(el, { transformOrigin: o.origin });
        return MW.drive(tl, at, o.returnAt == null ? o.duration : o.returnAt + 0.45, function (t) { var u = e(Math.min(1, t / o.duration)), s = 1 - (1 - o.to) * u, a = 1 - Math.max(0, Math.min(1, u)); if (o.returnAt != null && t > o.returnAt) { var r = p2(Math.min(1, (t - o.returnAt) / 0.45)); s = o.to + (1 - o.to) * r; a = r; } gsap.set(el, { scaleY: s }); el.style.opacity = String(Math.max(0, a)); });

    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];

    return run(MW.el(el), tl, at || 0, o);

      </script>
      <script>
        (function () {
          var tl = gsap.timeline({ paused: true });
          var q = function (s) { return document.querySelector(s); }, qa = function (s) { return Array.prototype.slice.call(document.querySelectorAll(s)); };
          MW.motionCollapseAway(q(".cd"), tl, 0.4, { returnAt: 1.5 });
