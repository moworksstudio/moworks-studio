  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline

    MW.lineNeonSignDraw(q(".gm"), tl, 0, {});

  Options (defaults in brackets):
      - draw: s at a constant speed (2)
      - start: s (0.35)
      - accent: neon colour
      - loop: s (4)

  Notes: Idea and numbers (TakayuStudio catalog-ui-material-neon-tube-draw, written here): Neon word path ('NEON': N, E with a bar, O ellipse, N; several strokes) drawn at constant speed over 2 s (linear) from 0.35 s: lit stroke 4.5 px accent with a 14 px glow plus a 1.2 px bright core (70 %), glowing head dot r3.5; the unlit tube shown dim underneath (6 px grey + 2 px line). On completion two flickers: opacity 1, 0.35, 1, 0.5, 1 in 50 ms steps (2.4-2.65 s). Lights off 3.55-3.8 s. Params: draw (2 s, none) · width (4.5 px + glow 14 px) · flicker ([1, 0.35, 1, 0.5, 1] / 0.05 s) · off. Two flickers on completion (opacity 1, 0.35, 1, 0.5, 1 in 0.05 s steps), lights off 3.55–3.8 s.
