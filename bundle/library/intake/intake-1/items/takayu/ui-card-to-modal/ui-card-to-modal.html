    MW.uiCardToModal(q(".gm"), tl, 0, {});

  Options (defaults in brackets):
      - loop: s (3.4)

  Notes: Idea and numbers (TakayuStudio modal-morph, written here): Row of 4 cards 60x72 r6 (x 22 + 72 i, y 62). Click at 0.42 s; card 1 morphs over 0.55-1.15 s power2.inOut: rect (22,62,60,72) → (60,26,200,144), radius 6 → 12, padding 6 → 12, image 28 → 52 tall, title bar 36 → 96 wide. Backdrop dims to 66 % over 0.65-1.12 s power2.out. Two text lines, a button and an X fade in and rise 6 px over 1.0-1.28 s. Close: click X 2.04 s, content out 2.06-2.2, morph back 2.25-2.65, backdrop out 2.25-2.55 (power2.in). Params: from / to: khung thẻ, khung hộp thoại · duration (0.6 s) · backdrop (66 %) · ease (power2.inOut).

<script>
(function () {

  MW.path = MW.path || function (keys, t, ease) {

          c.fillStyle = "rgba(5,6,10," + bd + ")"; c.fillRect(0, 0, 320, 200);
          var x = L(22, 60, m), y = L(62, 26, m), w = L(60, 200, m), h = L(72, 144, m), r = L(6, 12, m), pd = L(6, 12, m), ih = L(28, 52, m), tb = L(36, 96, m);

    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
