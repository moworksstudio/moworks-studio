<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Settle Drop - Demo</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
:root { --bg: #09090b; --fg: #fafafa; --card: #111114; --line: #27272a; }
* { box-sizing: border-box; }
html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); }
#demo { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); color: var(--fg); font-family: Inter, sans-serif; }
.center { position: absolute; inset: 0; display: grid; place-items: center; }
.row { display: flex; align-items: center; justify-content: center; gap: 48px; }
.col { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 32px; }
.h1 { font-size: 132px; font-weight: 800; letter-spacing: -0.035em; line-height: 1.1; text-align: center; }
.h2 { font-size: 84px; font-weight: 700; letter-spacing: -0.025em; line-height: 1.15; text-align: center; }
.p { font-size: 40px; line-height: 1.4; opacity: 0.72; text-align: center; }
.card { position: relative; border-radius: 28px; background: var(--card); border: 2px solid var(--line); overflow: hidden; }
.muted { opacity: 0.6; }

#demo { background: radial-gradient(100% 100% at 50% 45%, #1a1f33, #0b0d12); color: #e8ebf3; font-family: Inter, sans-serif; } .gm { position: absolute; inset: 0; }
.fl { position: absolute; left: 260px; right: 260px; top: 860px; height: 4px; border-radius: 2px; background: #262c3a; } .sd { position: absolute; left: 820px; top: 600px; width: 280px; height: 260px; border-radius: 30px 30px 14px 14px; background: linear-gradient(180deg, #5a6275, #2f3546); display: grid; place-items: center; font-size: 90px; font-weight: 900; color: #e8ebf3; } .sd-s { position: absolute; left: 790px; top: 846px; width: 340px; height: 30px; border-radius: 50%; background: rgba(0,0,0,0.6); filter: blur(8px); }
    </style>
  </head>
  <body>
    <div id="demo" data-composition-id="mw-demo" data-start="0" data-width="1920" data-height="1080" data-duration="1.8">
<div class="fl"></div><div class="sd-s"></div><div class="sd">kg</div>
      <script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.drive = MW.drive || function (tl, at, dur, fn) {
    var s = { t: 0 }; fn(0);
    tl.fromTo(s, { t: 0 }, { t: dur, duration: dur, ease: "none", immediateRender: false, onUpdate: function () { fn(s.t); } }, at);
    return at + dur;
  };
  var defaults = {"drop":440,"fall":0.32,"squash":[1.45,0.62],"squashIn":0.06,"recover":0.55,"dust":[56,164],"shadow":null};
  var run = function (el, tl, at, o) {
        var host = el.parentNode, p1 = gsap.parseEase("power1.in"), p2 = gsap.parseEase("power2.out"), sh = o.shadow ? host.querySelector(o.shadow) : null, dust = []; if (getComputedStyle(host).position === "static") host.style.position = "relative"; gsap.set(el, { transformOrigin: "50% 100%" });
        for (var i = 0; i < 8; i++) { var d = document.createElement("div"), z = 18 + (i % 3) * 8; d.style.cssText = "position:absolute;border-radius:50%;background:#8f9ab3;opacity:0;pointer-events:none;width:" + z + "px;height:" + z + "px;margin:-" + z / 2 + "px 0 0 -" + z / 2 + "px;"; host.appendChild(d); dust.push(d); }
        var bx = el.offsetLeft, bw = el.offsetWidth, by = el.offsetTop + el.offsetHeight;
        return MW.drive(tl, at, o.fall + o.squashIn + o.recover + 0.1, function (t) {
          var y = 0, sx = 1, sy = 1; if (t < o.fall) { var u = t / o.fall; y = -o.drop * (1 - p1(u)); sy = 1 + 0.1 * u; sx = 1 / sy; } else if (t < o.fall + o.squashIn) { var v = p2((t - o.fall) / o.squashIn); sx = 1 / 1.1 + (o.squash[0] - 1 / 1.1) * v; sy = 1.1 + (o.squash[1] - 1.1) * v; } else { var w = p2(Math.min(1, (t - o.fall - o.squashIn) / o.recover)); sx = o.squash[0] + (1 - o.squash[0]) * w; sy = o.squash[1] + (1 - o.squash[1]) * w; }
          gsap.set(el, { y: y, scaleX: sx, scaleY: sy }); if (sh) { var f = 1 + y / o.drop; gsap.set(sh, { scaleX: (0.5 + 0.5 * f) * (t > o.fall ? sx : 1) }); sh.style.opacity = String(0.3 + 0.7 * f); }
          var q = (t - o.fall) / 0.5; dust.forEach(function (d, i) { var side = i < 4 ? -1 : 1, k = i % 4, dist = o.dust[0] + (o.dust[1] - o.dust[0]) * (k / 3); d.style.left = bx + bw / 2 + side * (bw / 2 + dist * p2(Math.max(0, Math.min(1, q)))) + "px"; d.style.top = by - 14 - k * 10 * Math.max(0, q) + "px"; d.style.opacity = q > 0 && q < 1 ? String(0.7 * (1 - q)) : "0"; });
        });
      };
  MW.motionSettleDrop = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
      </script>
      <script>
        (function () {
          var tl = gsap.timeline({ paused: true });
          var q = function (s) { return document.querySelector(s); }, qa = function (s) { return Array.prototype.slice.call(document.querySelectorAll(s)); };
          MW.motionSettleDrop(q(".sd"), tl, 0.3, { shadow: ".sd-s" });
          tl.set({}, {}, 1.8);
          // register only when every motion is ready (MW.pending: e.g. a WebGL texture still decoding), as HyperFrames asks of async builds
          var go = function () { window.__timelines = window.__timelines || {}; window.__timelines["mw-demo"] = tl; };
          if (window.MW && MW.pending && MW.pending.length) Promise.all(MW.pending).then(go, go); else go();
        })();
      </script>
    </div>
  </body>
</html>
