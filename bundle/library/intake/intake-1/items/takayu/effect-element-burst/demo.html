<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Elemental Affinity Burst - Demo</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
:root { --bg: #09090b; --fg: #fafafa; --card: #111114; --line: #27272a; }
* { box-sizing: border-box; }
html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); }
#demo { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); color: var(--fg); font-family: Inter, sans-serif; }
.center { position: absolute; inset: 0; display: grid; place-items: center; }
.row { display: flex; align-items: center; justify-content: center; gap: 48px; }
.col { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 32px; }
.h1 { font-size: 132px; font-weight: 800; letter-spacing: -0.035em; line-height: 1.1; text-align: center; }
.h2 { font-size: 84px; font-weight: 700; letter-spacing: -0.025em; line-height: 1.15; text-align: center; }
.p { font-size: 40px; line-height: 1.4; opacity: 0.72; text-align: center; }
.card { position: relative; border-radius: 28px; background: var(--card); border: 2px solid var(--line); overflow: hidden; }
.muted { opacity: 0.6; }

#demo { background: radial-gradient(100% 100% at 50% 40%, #1a1f33, #0b0d12); color: #e8ebf3; font-family: Inter, sans-serif; }
.gm { position: absolute; inset: 0; } .gm .w { font-weight: 900; letter-spacing: -0.02em; white-space: nowrap; } .gm .lab { font-size: 34px; font-weight: 700; color: #8f9ab3; letter-spacing: 0.08em; white-space: nowrap; }
    </style>
  </head>
  <body>
    <div id="demo" data-composition-id="mw-demo" data-start="0" data-width="1920" data-height="1080" data-duration="4">
<div class="gm"><div class="lab" style="position:absolute;left:0;right:0;bottom:120px;text-align:center"><span style="color:#5fd7ff">Băng</span> · <span style="color:#ff7a3d">Lửa</span></div></div>
      <script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.spring = MW.spring || function (stiffness, damping, mass, from, to) {
    var k = stiffness || 100, c = damping == null ? 10 : damping, m = mass || 1, w0 = Math.sqrt(k / m), z = c / (2 * Math.sqrt(k * m));
    var x = function (t) {
      if (z < 1) { var wd = w0 * Math.sqrt(1 - z * z); return 1 - Math.exp(-z * w0 * t) * (Math.cos(wd * t) + (z * w0 / wd) * Math.sin(wd * t)); }
      if (z === 1) return 1 - Math.exp(-w0 * t) * (1 + w0 * t);
      var q = Math.sqrt(z * z - 1), r1 = -w0 * (z - q), r2 = -w0 * (z + q), A = r2 / (r2 - r1), B = -r1 / (r2 - r1);
      return 1 - (A * Math.exp(r1 * t) + B * Math.exp(r2 * t));
    };
    var T = 0, dt = 1 / 240; for (var t = 0; t < 30; t += dt) if (Math.abs(1 - x(t)) > 0.001) T = t;
    T = Math.max(dt, T + dt);
    return { duration: T, ease: function (p) { return p >= 1 ? 1 : x(p * T); }, at: x };
  };
  MW.springDB = MW.springDB || function (duration, bounce) {
    var z = 1 - (bounce == null ? 0.25 : bounce), w = Math.log(1000) / (Math.max(0.05, z) * (duration || 0.8));
    return MW.spring(w * w, 2 * z * w, 1);
  };
  MW.drive = MW.drive || function (tl, at, dur, fn) {
    var s = { t: 0 }; fn(0);
    tl.fromTo(s, { t: 0 }, { t: dur, duration: dur, ease: "none", immediateRender: false, onUpdate: function () { fn(s.t); } }, at);
    return at + dur;
  };
  MW.canvas = MW.canvas || function (host, w, h) {
    host = MW.el(host);
    var cv = document.createElement("canvas"); w = w || host.clientWidth || 1920; h = h || host.clientHeight || 1080;
    cv.width = w; cv.height = h; cv.style.position = "absolute"; cv.style.left = "0"; cv.style.top = "0"; cv.style.width = w + "px"; cv.style.height = h + "px"; cv.style.pointerEvents = "none";
    host.appendChild(cv);
    return { cv: cv, ctx: cv.getContext("2d"), w: w, h: h };
  };
  MW.stage320 = MW.stage320 || function (host) {
    host = MW.el(host); if (getComputedStyle(host).position === "static") host.style.position = "relative";
    var c = MW.canvas(host), k = Math.min(c.w / 320, c.h / 200), ox = (c.w - 320 * k) / 2, oy = (c.h - 200 * k) / 2;
    return { ctx: c.ctx, cv: c.cv, k: k, ox: ox, oy: oy, w: c.w, h: c.h,
      clear: function () { c.ctx.setTransform(1, 0, 0, 1, 0, 0); c.ctx.clearRect(0, 0, c.w, c.h); c.ctx.setTransform(k, 0, 0, k, ox, oy); },
      put: function (el, x, y) { el.style.position = "absolute"; el.style.left = (ox + x * k) + "px"; el.style.top = (oy + y * k) + "px"; gsap.set(el, { xPercent: -50, yPercent: -50 }); } };
  };
  var defaults = {"chargeAt":0.2,"burstAt":0.65,"colors":["#5fd7ff","#ff7a3d"],"outAt":3.5};
  var run = function (el, tl, at, o) {
        var S = MW.stage320(el), ctx = S.ctx, inq = gsap.parseEase("power1.in"), out = gsap.parseEase("power2.out"), inn = gsap.parseEase("power2.in"), sp = MW.spring(300, 14), dots = [];
        for (var i = 0; i < 20; i++) dots.push({ a: (i / 20) * 2 * Math.PI, R: 62 + ((i * 7) % 10) / 9 * 26, c: i % 2 ? o.colors[1] : o.colors[0] });
        var star = function (x, y, r, rot) { ctx.beginPath(); for (var j = 0; j < 10; j++) { var a = rot + j * Math.PI / 5 - Math.PI / 2, rr = j % 2 ? r * 0.45 : r; ctx.lineTo(x + rr * Math.cos(a), y + rr * Math.sin(a)); } ctx.closePath(); ctx.fill(); };
        return MW.drive(tl, at, o.outAt + 0.4, function (t) {
          S.clear(); var fade = t > o.outAt ? 1 - inn(Math.min(1, (t - o.outAt) / 0.4)) : 1; ctx.globalAlpha = fade;
          if (t >= o.chargeAt && t < o.burstAt) {
            var u = (t - o.chargeAt) / (o.burstAt - o.chargeAt), R = 36 - 30 * inq(u);
            [0, Math.PI].forEach(function (ph, i) { ctx.fillStyle = o.colors[i]; ctx.beginPath(); ctx.arc(160 + R * Math.cos(9 * t + ph), 100 + R * 0.7 * Math.sin(9 * t + ph), 4, 0, 2 * Math.PI); ctx.fill(); });
            ctx.fillStyle = "#e8ebf3"; star(160, 100, 8 + 6 * u, 2 * t);
          }
          var d = t - o.burstAt;
          if (d >= 0) {
            var q = out(Math.min(1, d / 0.9));
            dots.forEach(function (p) { var x = 160 + p.R * q * Math.cos(p.a), y = 100 + p.R * 0.82 * q * Math.sin(p.a), s = 4.5 - 2 * q;
              if (q < 1) { ctx.strokeStyle = p.c; ctx.globalAlpha = fade * 0.4 * (1 - q); ctx.lineWidth = s; ctx.beginPath(); ctx.moveTo(160 + p.R * q * 0.6 * Math.cos(p.a), 100 + p.R * 0.82 * q * 0.6 * Math.sin(p.a)); ctx.lineTo(x, y); ctx.stroke(); }
              ctx.globalAlpha = fade; ctx.fillStyle = p.c; ctx.beginPath(); ctx.arc(x, y, s, 0, 2 * Math.PI); ctx.fill(); });
            if (d < 0.4) { var g = out(d / 0.4); ctx.globalAlpha = fade * (1 - g); ctx.strokeStyle = "#e8ebf3"; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(160, 100, 10 + 40 * g, 0, 2 * Math.PI); ctx.stroke(); }
            ctx.globalAlpha = fade; ctx.fillStyle = "#e8ebf3"; star(160, 100, 14 * (1.6 + (1 - 1.6) * sp.at(d)), 2 * t);
          }
          ctx.globalAlpha = 1;
        });
      };
  MW.effectElementBurst = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
      </script>
      <script>
        (function () {
          var tl = gsap.timeline({ paused: true });
          var q = function (s) { return document.querySelector(s); }, qa = function (s) { return Array.prototype.slice.call(document.querySelectorAll(s)); };
          MW.effectElementBurst(q(".gm"), tl, 0, {});
          tl.set({}, {}, 4);
          // register only when every motion is ready (MW.pending: e.g. a WebGL texture still decoding), as HyperFrames asks of async builds
          var go = function () { window.__timelines = window.__timelines || {}; window.__timelines["mw-demo"] = tl; };
          if (window.MW && MW.pending && MW.pending.length) Promise.all(MW.pending).then(go, go); else go();
        })();
      </script>
    </div>
  </body>
</html>
