  Source: motion-reference.takayustudio.jp/#motion=catalog-game-cinematic-countdown-go (read 12/10/2026).
  Ba chữ số lớn hiện lần lượt mỗi 0.8 giây, mỗi số thu từ to về cỡ rồi co và mờ cuối nhịp, vòng tròn quanh số cạn dần theo nhịp; tới "GO!" thì chữ bật vọt, vòng đổi màu nhấn và một vòng sóng nở ra.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.dataCountdownGo(q(".gm"), tl, 0, {});

  Options (defaults in brackets):
      - start: s (0.3)
      - beat: s per number (0.8)
      - outAt: s (3.55)

  Notes: Idea and numbers (TakayuStudio catalog-game-cinematic-countdown-go, written here): px @320x200. Beats 800 ms apart from 0.3 s: digits 3, 2, 1 (60 px) each fade in 80 ms and scale 1.5 → 1 in 250 ms outExpo; at 700-800 ms into the beat they shrink to 0.85 and fade. An accent arc on a grey ring (r 52, stroke 4) shrinks from full to 0 over each beat, anchored at 12 o'clock. 'GO!' at 2.7 s: 300 ms back.out, full accent ring, burst ring r 52 → 82 (stroke 3.5 → 0.5) fading 500 ms outCubic; 4 pips light per beat. Out 3.55-3.8 s in-cubic. Params: beat: nhịp (0.8 s) · from: số đầu (3) · go: chữ cuối ("GO!") · start: lúc bắt đầu (0.3 s). Markup: one .cg-d per number (3, 2, 1) and the final .cg-go word.
-->

<div class="gm"><div class="cg-d">3</div><div class="cg-d">2</div><div class="cg-d">1</div><div class="cg-go">BẮT ĐẦU!</div></div>

</style>

<script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.drive = MW.drive || function (tl, at, dur, fn) {
    var s = { t: 0 }; fn(0);
    tl.fromTo(s, { t: 0 }, { t: dur, duration: dur, ease: "none", immediateRender: false, onUpdate: function () { fn(s.t); } }, at);
    return at + dur;
  };
  MW.canvas = MW.canvas || function (host, w, h) {
    host = MW.el(host);
    var cv = document.createElement("canvas"); w = w || host.clientWidth || 1920; h = h || host.clientHeight || 1080;
    cv.width = w; cv.height = h; cv.style.position = "absolute"; cv.style.left = "0"; cv.style.top = "0"; cv.style.width = w + "px"; cv.style.height = h + "px"; cv.style.pointerEvents = "none";
    host.appendChild(cv);
    return { cv: cv, ctx: cv.getContext("2d"), w: w, h: h };
  };
  MW.stage320 = MW.stage320 || function (host) {
    host = MW.el(host); if (getComputedStyle(host).position === "static") host.style.position = "relative";
    var c = MW.canvas(host), k = Math.min(c.w / 320, c.h / 200), ox = (c.w - 320 * k) / 2, oy = (c.h - 200 * k) / 2;
    return { ctx: c.ctx, cv: c.cv, k: k, ox: ox, oy: oy, w: c.w, h: c.h,
      clear: function () { c.ctx.setTransform(1, 0, 0, 1, 0, 0); c.ctx.clearRect(0, 0, c.w, c.h); c.ctx.setTransform(k, 0, 0, k, ox, oy); },
      put: function (el, x, y) { el.style.position = "absolute"; el.style.left = (ox + x * k) + "px"; el.style.top = (oy + y * k) + "px"; gsap.set(el, { xPercent: -50, yPercent: -50 }); } };
  };
  var defaults = {"start":0.3,"beat":0.8,"outAt":3.55};
  var run = function (el, tl, at, o) {
        var S = MW.stage320(el), c = S.ctx, digits = Array.prototype.slice.call(el.querySelectorAll(".cg-d")), go = el.querySelector(".cg-go"), ex = gsap.parseEase("expo.out"), bk = gsap.parseEase("back.out"), out = gsap.parseEase("power2.out"), pi = gsap.parseEase("power2.in");
        digits.concat([go]).forEach(function (d) { S.put(d, 160, 96); });
        var goAt = o.start + o.beat * digits.length;
        return MW.drive(tl, at, o.outAt + 0.25, function (t) {
          S.clear(); var fade = 1 - pi(Math.max(0, Math.min(1, (t - o.outAt) / 0.25))); c.globalAlpha = fade;
          c.strokeStyle = "#2a3142"; c.lineWidth = 4; c.beginPath(); c.arc(160, 96, 52, 0, 2 * Math.PI); c.stroke();
          var k = Math.floor((t - o.start) / o.beat);
          if (t >= o.start && t < goAt) { var u = (t - o.start - k * o.beat) / o.beat; c.strokeStyle = "#8b7bff"; c.beginPath(); c.arc(160, 96, 52, -Math.PI / 2, -Math.PI / 2 + 2 * Math.PI * (1 - u)); c.stroke(); }
          if (t >= goAt) { c.strokeStyle = "#8b7bff"; c.beginPath(); c.arc(160, 96, 52, 0, 2 * Math.PI); c.stroke(); var d = t - goAt; if (d < 0.5) { var q = out(d / 0.5); c.globalAlpha = fade * (1 - q); c.lineWidth = 3.5 - 3 * q; c.beginPath(); c.arc(160, 96, 52 + 30 * q, 0, 2 * Math.PI); c.stroke(); c.globalAlpha = fade; } }
          for (var i = 0; i < 4; i++) { c.fillStyle = t >= o.start + i * o.beat ? "#8b7bff" : "#2a3142"; c.beginPath(); c.arc(136 + i * 16, 166, 3.5, 0, 2 * Math.PI); c.fill(); }
          c.globalAlpha = 1;
          digits.forEach(function (d, i) { var b = t - o.start - i * o.beat, on = b >= 0 && b < o.beat; var s = b < 0.25 ? 1.5 - 0.5 * ex(Math.max(0, b) / 0.25) : b > 0.7 * o.beat / 0.8 ? 1 - 0.15 * Math.min(1, (b - 0.7) / 0.1) : 1;
            gsap.set(d, { xPercent: -50, yPercent: -50, scale: s }); d.style.opacity = on ? String(Math.min(1, b / 0.08) * (b > 0.7 ? Math.max(0, 1 - (b - 0.7) / 0.1) : 1)) : "0"; });
          var g = t - goAt; gsap.set(go, { xPercent: -50, yPercent: -50, scale: g >= 0 ? bk(Math.min(1, g / 0.3)) : 0 }); go.style.opacity = g >= 0 ? String(fade) : "0";
        });
      };
  MW.dataCountdownGo = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
</script>
