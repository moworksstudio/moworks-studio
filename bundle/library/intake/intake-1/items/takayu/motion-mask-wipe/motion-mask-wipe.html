  Nội dung đứng yên, một mép che quét từ trái sang phải để lộ ra, có vạch màu chạy theo mép.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.motionMaskWipe(q(".mw"), tl, 0.3, { exitAt: 1.7 });

  Options (defaults in brackets):
      - duration: s (0.7, power4.inOut): the edge travels 0 → 115 % of the width
      - edge: px of the line (8; 0 to hide)
      - accent: 
      - exitAt: s after the start to fade (null)

  Notes: Idea and numbers (TakayuStudio mask-wipe, written here): Content stays still; a left-to-right clip opens it: the cover edge travels 0 → 115 % of the box width in 700 ms power4.inOut (easeInOutQuint), so the content is fully shown at ~87 % of the move. A 2 px accent line with a small ▼ marker rides the edge while it is inside the box. Site exit: fade 320 ms power2.in. Params: duration (0.7 s) · direction: hướng quét (trái → phải) · edge: vạch mép (2 px, bật/tắt) · ease (power4.inOut).
-->
