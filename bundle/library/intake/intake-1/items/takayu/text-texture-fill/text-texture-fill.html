<!--
  Texture / Video Fill (TakayuStudio (motion-reference), No licence stated: idea and numbers only, written from the idea (site read 12/10/2026)).
  Source: motion-reference.takayustudio.jp/#motion=tx-texture-fill (read 12/10/2026).
  Chữ rất đậm làm khuôn cắt cho ảnh, video hoặc hoạ tiết bên trong; phần hình trôi chậm qua lòng chữ còn nét chữ đứng yên.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.textTextureFill(q(".tk-head"), tl, 0, { duration: 5, period: 6 });

  Options (defaults in brackets):
      - image: a picture to run inside the letters (an assets/ path); none: a drawn pattern (gradient, wavy lines, rising bubbles)
      - colors: the pattern's gradient
      - period: s for one pass across, ping-pong (20; the site's 0 → 100 % in 20 s)
      - duration: s it runs

  Notes: Idea and numbers (TakayuStudio tx-texture-fill, written here): Heavy text (weight 900, 10–20 vw) as a mask over an image / video / pattern (background-clip text, or a mask with mask-size contain for video), fill 200 % of the box, vertical position 50 %; background-position-x 0 % → 100 % over 20 s linear, ping-pong (CSS alternate) (a 5 s shot moves 25 %); video frame-locked to the film; letters still. Demo pattern: blue → accent gradient with 2 px wavy lines that drift 10 px and rising bubbles per 5 s loop. Params: fill: ảnh / video / hoạ tiết · drift: trôi nền (0 → 100 % trong 20 s) · size: cỡ nền (200 %).
-->

<div class="tk-stage"><div><h1 class="tk-head ">BIỂN XANH</h1></div></div>

<style>

</style>

<script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.drive = MW.drive || function (tl, at, dur, fn) {
    var s = { t: 0 }; fn(0);
    tl.fromTo(s, { t: 0 }, { t: dur, duration: dur, ease: "none", immediateRender: false, onUpdate: function () { fn(s.t); } }, at);
    return at + dur;
  };
  var defaults = {"image":null,"colors":["#2f6bff","#8b7bff","#3dd6f5","#2f6bff"],"period":20,"duration":5};
  var run = function (el, tl, at, o) {
        var waves = "data:image/svg+xml," + encodeURIComponent("<svg xmlns='http://www.w3.org/2000/svg' width='240' height='60'><path d='M0 30 Q30 10 60 30 T120 30 T180 30 T240 30' fill='none' stroke='rgba(255,255,255,0.35)' stroke-width='5'/></svg>");
        var bubbles = "data:image/svg+xml," + encodeURIComponent("<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><g fill='rgba(255,255,255,0.5)'><circle cx='40' cy='60' r='9'/><circle cx='150' cy='200' r='14'/><circle cx='240' cy='110' r='7'/><circle cx='90' cy='260' r='5'/><circle cx='200' cy='30' r='11'/></g></svg>");
        if (!o.image) { el.style.backgroundImage = "url(\"" + bubbles + "\"), url(\"" + waves + "\"), linear-gradient(90deg, " + o.colors.join(", ") + ")"; el.style.backgroundSize = "300px 300px, 240px 60px, 200% 100%"; }
        else { el.style.backgroundImage = "url(" + o.image + ")"; el.style.backgroundSize = "200% auto"; }
        el.style.webkitBackgroundClip = "text"; el.style.backgroundClip = "text"; el.style.color = "transparent"; el.style.webkitTextFillColor = "transparent";
        // the fill paints only inside the box: room above and below for Vietnamese marks
        el.style.paddingTop = "0.3em"; el.style.paddingBottom = "0.12em"; el.style.marginTop = "-0.3em"; el.style.marginBottom = "-0.12em";
        return MW.drive(tl, at, o.duration, function (t) {
          var c = (t / o.period) % 2, pp = c < 1 ? c : 2 - c;
          if (!o.image) el.style.backgroundPosition = "0px " + (-t * 60) + "px, " + (t * 20) + "px 0px, " + (pp * 100) + "% 50%";
          else el.style.backgroundPosition = (pp * 100) + "% 50%";
        });
      };
  MW.textTextureFill = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
</script>
