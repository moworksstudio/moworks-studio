<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Lens Flare Sweep - Demo</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
:root { --bg: #09090b; --fg: #fafafa; --card: #111114; --line: #27272a; }
* { box-sizing: border-box; }
html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); }
#demo { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); color: var(--fg); font-family: Inter, sans-serif; }
.center { position: absolute; inset: 0; display: grid; place-items: center; }
.row { display: flex; align-items: center; justify-content: center; gap: 48px; }
.col { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 32px; }
.h1 { font-size: 132px; font-weight: 800; letter-spacing: -0.035em; line-height: 1.1; text-align: center; }
.h2 { font-size: 84px; font-weight: 700; letter-spacing: -0.025em; line-height: 1.15; text-align: center; }
.p { font-size: 40px; line-height: 1.4; opacity: 0.72; text-align: center; }
.card { position: relative; border-radius: 28px; background: var(--card); border: 2px solid var(--line); overflow: hidden; }
.muted { opacity: 0.6; }

#demo { --ink: #e8ebf3; --acc: #8b7bff; --acc2: #3dd6f5; --warm: #ffb547; --rose: #ff5d8f; --mute: #6c778b; --tk-card: #151a24; --tk-line: #262c3a; background: #0b0d12; color: var(--ink); }
.tk-stage { position: absolute; inset: 0; display: grid; place-items: center; }
.tk-cap { font-size: 30px; font-weight: 500; color: var(--mute); letter-spacing: 0.01em; }
.tk-head { margin: 0; font-family: 'Inter', sans-serif; font-size: 170px; font-weight: 900; letter-spacing: -0.03em; line-height: 1.15; text-align: center; max-width: 1600px; }
.tk-sub { margin-top: 36px; text-align: center; }
    </style>
  </head>
  <body>
    <div id="demo" data-composition-id="mw-demo" data-start="0" data-width="1920" data-height="1080" data-duration="3.2">
<div class="tk-stage"><div><h1 class="tk-head ">RA MẮT MÙA THU</h1></div></div>
      <script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.drive = MW.drive || function (tl, at, dur, fn) {
    var s = { t: 0 }; fn(0);
    tl.fromTo(s, { t: 0 }, { t: dur, duration: dur, ease: "none", immediateRender: false, onUpdate: function () { fn(s.t); } }, at);
    return at + dur;
  };
  MW.canvas = MW.canvas || function (host, w, h) {
    host = MW.el(host);
    var cv = document.createElement("canvas"); w = w || host.clientWidth || 1920; h = h || host.clientHeight || 1080;
    cv.width = w; cv.height = h; cv.style.position = "absolute"; cv.style.left = "0"; cv.style.top = "0"; cv.style.width = w + "px"; cv.style.height = h + "px"; cv.style.pointerEvents = "none";
    host.appendChild(cv);
    return { cv: cv, ctx: cv.getContext("2d"), w: w, h: h };
  };
  var defaults = {"duration":1.05,"unit":5,"tint":"#d6ccff"};
  var run = function (el, tl, at, o) {
        var host = el.parentNode, cv = MW.canvas(host), c = cv.ctx, io = gsap.parseEase("power2.inOut"), col = getComputedStyle(el).color, mix = gsap.utils.interpolate(col, o.tint); cv.cv.style.zIndex = "5"; cv.cv.style.mixBlendMode = "plus-lighter";
        return MW.drive(tl, at, o.duration, function (t) {
          var p = io(t / o.duration), k = o.unit, off = (-155 + 310 * p) * k, env = Math.pow(Math.sin(Math.PI * t / o.duration), 0.5), g = Math.exp(-Math.pow(off / (60 * k), 2)), cx = el.offsetLeft + el.offsetWidth / 2, cy = el.offsetTop + el.offsetHeight / 2, x = cx + off;
          c.clearRect(0, 0, cv.w, cv.h); el.style.color = mix(0.35 * g * env); if (t <= 0 || t >= o.duration) return;
          var disc = function (X, R, a, cc) { var gr = c.createRadialGradient(X, cy, 0, X, cy, R); gr.addColorStop(0, "rgba(" + cc + "," + a + ")"); gr.addColorStop(1, "rgba(" + cc + ",0)"); c.fillStyle = gr; c.beginPath(); c.arc(X, cy, R, 0, 2 * Math.PI); c.fill(); };
          disc(x, (12 + 8 * g) * k, 0.8 * env, "214,204,255"); disc(x, (4 + 3 * g) * k, env, "255,255,255");
          c.save(); c.translate(x, cy); c.scale(1, 0.06); var sr = (70 + 40 * g) * k, sg = c.createRadialGradient(0, 0, 0, 0, 0, sr); sg.addColorStop(0, "rgba(255,255,255," + 0.9 * env + ")"); sg.addColorStop(1, "rgba(255,255,255,0)"); c.fillStyle = sg; c.beginPath(); c.arc(0, 0, sr, 0, 2 * Math.PI); c.fill(); c.restore();
          [[0.7, 10, 0.35], [-0.7, 7, 0.25], [-0.4, 14, 0.2]].forEach(function (q) { disc(cx + off * q[0] * -1, q[1] * k, q[2] * env, q[0] > 0 ? "139,123,255" : "61,214,245"); });
        });
      };
  MW.effectLensFlareSweep = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
      </script>
      <script>
        (function () {
          var tl = gsap.timeline({ paused: true });
          var q = function (s) { return document.querySelector(s); }, qa = function (s) { return Array.prototype.slice.call(document.querySelectorAll(s)); };
          MW.effectLensFlareSweep(q(".tk-head"), tl, 0.5, {}); MW.effectLensFlareSweep(q(".tk-head"), tl, 1.9, {});
          tl.set({}, {}, 3.2);
          // register only when every motion is ready (MW.pending: e.g. a WebGL texture still decoding), as HyperFrames asks of async builds
          var go = function () { window.__timelines = window.__timelines || {}; window.__timelines["mw-demo"] = tl; };
          if (window.MW && MW.pending && MW.pending.length) Promise.all(MW.pending).then(go, go); else go();
        })();
      </script>
    </div>
  </body>
</html>
