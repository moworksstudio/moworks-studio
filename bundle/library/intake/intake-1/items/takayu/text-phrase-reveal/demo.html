<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Bunsetsu Phrase Reveal - Demo</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
:root { --bg: #09090b; --fg: #fafafa; --card: #111114; --line: #27272a; }
* { box-sizing: border-box; }
html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); }
#demo { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); color: var(--fg); font-family: Inter, sans-serif; }
.center { position: absolute; inset: 0; display: grid; place-items: center; }
.row { display: flex; align-items: center; justify-content: center; gap: 48px; }
.col { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 32px; }
.h1 { font-size: 132px; font-weight: 800; letter-spacing: -0.035em; line-height: 1.1; text-align: center; }
.h2 { font-size: 84px; font-weight: 700; letter-spacing: -0.025em; line-height: 1.15; text-align: center; }
.p { font-size: 40px; line-height: 1.4; opacity: 0.72; text-align: center; }
.card { position: relative; border-radius: 28px; background: var(--card); border: 2px solid var(--line); overflow: hidden; }
.muted { opacity: 0.6; }

#demo { --ink: #e8ebf3; --acc: #8b7bff; --acc2: #3dd6f5; --warm: #ffb547; --rose: #ff5d8f; --mute: #6c778b; --tk-card: #151a24; --tk-line: #262c3a; background: #0b0d12; color: var(--ink); }
.tk-stage { position: absolute; inset: 0; display: grid; place-items: center; }
.tk-cap { font-size: 30px; font-weight: 500; color: var(--mute); letter-spacing: 0.01em; }
.tk-head { margin: 0; font-family: 'Inter', sans-serif; font-size: 120px; font-weight: 800; letter-spacing: -0.03em; line-height: 1.15; text-align: center; max-width: 1600px; }
.tk-sub { margin-top: 36px; text-align: center; }
.tk-head { line-height: 1.6; } .ch { opacity: 0; }
    </style>
  </head>
  <body>
    <div id="demo" data-composition-id="mw-demo" data-start="0" data-width="1920" data-height="1080" data-duration="3.4">
<div class="tk-stage"><div><h1 class="tk-head "><span class="ch">Mùa thu</span> <span class="ch">Hà Nội</span> <span class="ch">có</span> <span class="ch">hương</span> <span class="ch">hoa sữa</span></h1></div></div>
      <script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.split = MW.split || function (el, mode) {
    el = MW.el(el);
    if (el.__mwSplit) return el.__mwSplit;
    var seg = typeof Intl !== "undefined" && Intl.Segmenter ? new Intl.Segmenter("vi", { granularity: "grapheme" }) : null;
    var graphemes = function (s) { if (seg) { var out = []; var it = seg.segment(s)[Symbol.iterator](), r; while (!(r = it.next()).done) out.push(r.value.segment); return out; } return Array.from(s); };
    var res = { chars: [], words: [], lines: [] };
    var walk = function (node) {
      var kids = Array.prototype.slice.call(node.childNodes);
      for (var k = 0; k < kids.length; k++) {
        var n = kids[k];
        if (n.nodeType === 1) { if (n.tagName === "BR") continue; walk(n); continue; }
        if (n.nodeType !== 3) continue;
        var text = n.nodeValue.normalize("NFC"), frag = document.createDocumentFragment();
        var parts = text.split(/(\s+)/);
        for (var p = 0; p < parts.length; p++) {
          var part = parts[p];
          if (!part) continue;
          if (/^\s+$/.test(part)) { frag.appendChild(document.createTextNode(part)); continue; }
          var w = document.createElement("span");
          w.className = "mw-w"; w.style.display = "inline-block"; w.style.whiteSpace = "nowrap";
          if (mode === "words") w.textContent = part;
          else { var gs = graphemes(part); for (var g = 0; g < gs.length; g++) { var c = document.createElement("span"); c.className = "mw-ch"; c.style.display = "inline-block"; c.textContent = gs[g]; w.appendChild(c); res.chars.push(c); } }
          res.words.push(w); frag.appendChild(w);
        }
        node.replaceChild(frag, n);
      }
    };
    walk(el);
    var top = null, line = null;
    for (var i = 0; i < res.words.length; i++) { var y = res.words[i].offsetTop; if (top === null || Math.abs(y - top) > 2) { top = y; line = []; res.lines.push(line); } line.push(res.words[i]); }
    el.__mwSplit = res;
    return res;
  };
  MW.drive = MW.drive || function (tl, at, dur, fn) {
    var s = { t: 0 }; fn(0);
    tl.fromTo(s, { t: 0 }, { t: dur, duration: dur, ease: "none", immediateRender: false, onUpdate: function () { fn(s.t); } }, at);
    return at + dur;
  };
  var defaults = {"chunk":".ch","rise":0.5,"duration":0.6,"stagger":0.12,"cap":1,"bracket":true,"start":0.35,"exitAt":2.95,"accent":"#8b7bff","loop":3.4};
  var run = function (el, tl, at, o) {
        var ch = el.querySelectorAll(o.chunk).length ? Array.prototype.slice.call(el.querySelectorAll(o.chunk)) : MW.split(el, "words").words, n = ch.length, st = Math.min(o.stagger, o.cap / Math.max(1, n - 1)), ex = gsap.parseEase("expo.out"), pin = gsap.parseEase("power2.in"), fs = parseFloat(getComputedStyle(el).fontSize), br = [];
        ch.forEach(function (c) { c.style.display = "inline-block"; c.style.whiteSpace = "nowrap"; c.style.position = "relative"; if (!o.bracket) { br.push(null); return; } var b = document.createElement("span"); b.style.cssText = "position:absolute;left:4%;right:4%;bottom:-0.08em;height:0.035em;background:" + o.accent + ";opacity:0;";
          ["left", "right"].forEach(function (s) { var k = document.createElement("span"); k.style.cssText = "position:absolute;" + s + ":0;bottom:0;width:0.035em;height:0.11em;background:" + o.accent + ";"; b.appendChild(k); }); c.appendChild(b); br.push(b); });
        return MW.drive(tl, at, o.loop, function (t) {
          var x = pin(Math.max(0, Math.min(1, (t - o.exitAt) / 0.3)));
          ch.forEach(function (c, i) { var u = ex(Math.max(0, Math.min(1, (t - o.start - i * st) / o.duration))); gsap.set(c, { y: o.rise * fs * (1 - u) }); c.style.opacity = String(u * (1 - x)); if (br[i]) br[i].style.opacity = String(u); });
        });
      };
  MW.textPhraseReveal = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
      </script>
      <script>
        (function () {
          var tl = gsap.timeline({ paused: true });
          var q = function (s) { return document.querySelector(s); }, qa = function (s) { return Array.prototype.slice.call(document.querySelectorAll(s)); };
          MW.textPhraseReveal(q(".tk-head"), tl, 0, {});
          tl.set({}, {}, 3.4);
          // register only when every motion is ready (MW.pending: e.g. a WebGL texture still decoding), as HyperFrames asks of async builds
          var go = function () { window.__timelines = window.__timelines || {}; window.__timelines["mw-demo"] = tl; };
          if (window.MW && MW.pending && MW.pending.length) Promise.all(MW.pending).then(go, go); else go();
        })();
      </script>
    </div>
  </body>
</html>
