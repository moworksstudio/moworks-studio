  Source: motion-reference.takayustudio.jp/#motion=3d-depth (read 12/10/2026).
  Các thẻ xếp theo chiều sâu, máy quay bay thẳng về phía trước, thẻ gần to dần và lướt qua hai bên.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.cardDepthFlythrough(q(".df"), tl, 0, {});

  Options (defaults in brackets):
      - items: 
      - spacing: px between cards in depth (360)
      - wrap: px of depth before a card comes round again (2880)
      - speed: px a second of the camera (600), linear
      - focal: px: depth at scale 1 (2160)
      - x: ± px (360)
      - y: px for rows −1 / 0 / +1 (180)
      - near: px depth the card fades out over ([240, 700])
      - far: px depth it fades in over (600)
      - duration: s (4.8: one wrap)

  Notes: Idea and numbers (TakayuStudio 3d-depth, written here): Cards placed along z (recipe 250 apart) and the camera moves forward z 0 -> 1000 over 4000 ms linear (perspective). Demo: 8 cards 60 x 40 at 60 z spacing (focal 360 on a 320 frame), camera 100 z / s, wrapping every 480 z; x alternates +-60 px, y -30 / 0 / +30; cards fade in far away and out just before the lens. Params: spacing (250) · travel (1000) · duration (4 s). Each card is projected by focal / depth; x alternates ±, y cycles −1 / 0 / +1, so cards grow and slide past both sides.
-->

<script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.drive = MW.drive || function (tl, at, dur, fn) {
    var s = { t: 0 }; fn(0);
    tl.fromTo(s, { t: 0 }, { t: dur, duration: dur, ease: "none", immediateRender: false, onUpdate: function () { fn(s.t); } }, at);
    return at + dur;
  };
  var defaults = {"items":".pc","spacing":360,"wrap":2880,"speed":600,"focal":2160,"x":360,"y":180,"near":[240,700],"far":600,"duration":4.8};
  var run = function (el, tl, at, o) {
        var it = Array.prototype.slice.call(el.querySelectorAll(o.items)), XS = [-1, 1], YS = [-1, 0, 1];
        it.forEach(function (c) { c.style.position = "absolute"; c.style.left = "50%"; c.style.top = "50%"; }); var W = it[0].offsetWidth, Hh = it[0].offsetHeight; it.forEach(function (c) { c.style.marginLeft = -W / 2 + "px"; c.style.marginTop = -Hh / 2 + "px"; });
        return MW.drive(tl, at, o.duration, function (t) { var cam = o.speed * t; it.forEach(function (c, i) { var d = ((i * o.spacing - cam) % o.wrap + o.wrap) % o.wrap; if (d < 1) d += o.wrap; var s = o.focal / d;
          gsap.set(c, { x: XS[i % 2] * o.x * s, y: YS[i % 3] * o.y * s, scale: s }); c.style.zIndex = String(Math.round(10000 - d)); c.style.opacity = String(Math.max(0, Math.min(1, (d - o.near[0]) / (o.near[1] - o.near[0]))) * Math.max(0, Math.min(1, (o.wrap - d) / o.far))); }); });
      };
  MW.cardDepthFlythrough = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
</script>
