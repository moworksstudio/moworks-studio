<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Depth Stack - Demo</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
:root { --bg: #09090b; --fg: #fafafa; --card: #111114; --line: #27272a; }
* { box-sizing: border-box; }
html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); }
#demo { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); color: var(--fg); font-family: Inter, sans-serif; }
.center { position: absolute; inset: 0; display: grid; place-items: center; }
.row { display: flex; align-items: center; justify-content: center; gap: 48px; }
.col { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 32px; }
.h1 { font-size: 132px; font-weight: 800; letter-spacing: -0.035em; line-height: 1.1; text-align: center; }
.h2 { font-size: 84px; font-weight: 700; letter-spacing: -0.025em; line-height: 1.15; text-align: center; }
.p { font-size: 40px; line-height: 1.4; opacity: 0.72; text-align: center; }
.card { position: relative; border-radius: 28px; background: var(--card); border: 2px solid var(--line); overflow: hidden; }
.muted { opacity: 0.6; }

#demo { background: radial-gradient(100% 100% at 50% 45%, #1a1f33, #0b0d12); color: #e8ebf3; font-family: Inter, sans-serif; } .gm { position: absolute; inset: 0; }
.df { position: absolute; inset: 0; overflow: hidden; } .df .pc { width: 360px; height: 240px; border-radius: 22px; background-size: cover; background-position: center; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
    </style>
  </head>
  <body>
    <div id="demo" data-composition-id="mw-demo" data-start="0" data-width="1920" data-height="1080" data-duration="4.8">
<div class="df"><div class="pc" style="background:url(assets/a.svg) center / cover"></div><div class="pc" style="background:linear-gradient(150deg, #3dd6f5, #1580b8)"></div><div class="pc" style="background:url(assets/b.svg) center / cover"></div><div class="pc" style="background:linear-gradient(150deg, #75e4d2, #2a8f7f)"></div><div class="pc" style="background:url(assets/c.svg) center / cover"></div><div class="pc" style="background:linear-gradient(150deg, #a693ff, #6a4cf0)"></div><div class="pc" style="background:url(assets/a.svg) center / cover"></div><div class="pc" style="background:linear-gradient(150deg, #ffb18f, #ff6f91)"></div></div>
      <script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.drive = MW.drive || function (tl, at, dur, fn) {
    var s = { t: 0 }; fn(0);
    tl.fromTo(s, { t: 0 }, { t: dur, duration: dur, ease: "none", immediateRender: false, onUpdate: function () { fn(s.t); } }, at);
    return at + dur;
  };
  var defaults = {"items":".pc","spacing":360,"wrap":2880,"speed":600,"focal":2160,"x":360,"y":180,"near":[240,700],"far":600,"duration":4.8};
  var run = function (el, tl, at, o) {
        var it = Array.prototype.slice.call(el.querySelectorAll(o.items)), XS = [-1, 1], YS = [-1, 0, 1];
        it.forEach(function (c) { c.style.position = "absolute"; c.style.left = "50%"; c.style.top = "50%"; }); var W = it[0].offsetWidth, Hh = it[0].offsetHeight; it.forEach(function (c) { c.style.marginLeft = -W / 2 + "px"; c.style.marginTop = -Hh / 2 + "px"; });
        return MW.drive(tl, at, o.duration, function (t) { var cam = o.speed * t; it.forEach(function (c, i) { var d = ((i * o.spacing - cam) % o.wrap + o.wrap) % o.wrap; if (d < 1) d += o.wrap; var s = o.focal / d;
          gsap.set(c, { x: XS[i % 2] * o.x * s, y: YS[i % 3] * o.y * s, scale: s }); c.style.zIndex = String(Math.round(10000 - d)); c.style.opacity = String(Math.max(0, Math.min(1, (d - o.near[0]) / (o.near[1] - o.near[0]))) * Math.max(0, Math.min(1, (o.wrap - d) / o.far))); }); });
      };
  MW.cardDepthFlythrough = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
      </script>
      <script>
        (function () {
          var tl = gsap.timeline({ paused: true });
          var q = function (s) { return document.querySelector(s); }, qa = function (s) { return Array.prototype.slice.call(document.querySelectorAll(s)); };
          MW.cardDepthFlythrough(q(".df"), tl, 0, {});
          tl.set({}, {}, 4.8);
          // register only when every motion is ready (MW.pending: e.g. a WebGL texture still decoding), as HyperFrames asks of async builds
          var go = function () { window.__timelines = window.__timelines || {}; window.__timelines["mw-demo"] = tl; };
          if (window.MW && MW.pending && MW.pending.length) Promise.all(MW.pending).then(go, go); else go();
        })();
      </script>
    </div>
  </body>
</html>
