  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.uiReadMoreExpand(q(".rm"), tl, 0, { below: ".rm-next", cursor: ".ui-cursor" });

  Options (defaults in brackets):
      - openAt: s (1.1), 0.45 s in-out
      - closeAt: s (3.6)
      - body: the paragraph (clamped to one line)
      - link: the link
      - more: label
      - less: label when open
      - below: the element pushed down
      - cursor: the cursor
      - loop: s (4.8)

  Notes: Idea and numbers (TakayuStudio tx-expand-truncated, written here): Card 228 px (radius 8); body 14 px weight 600, line height 1.5, clamped to 1 line with an ellipsis; accent link 'Read more ▾' 16 px below. Cursor clicks it at 1.0–1.2 s; height 1 line → all lines in 0.45 s (1.1–1.55 s), cubic-bezier(.65,0,.35,1) (recipe ease); ellipsis fades in the first half; lines fade in as the edge passes; link becomes 'Close ▴' and rides below; the element under the card is pushed down. Second click 3.5 s collapses 3.6–4.05 s. Loop 4.8 s. Params: thời gian mở (0.45 s) · số dòng ban đầu (1) · nhãn nút (Xem thêm / Thu gọn).
