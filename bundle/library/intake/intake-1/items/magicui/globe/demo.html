<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Globe - Demo</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <script src="assets/vendor/cobe-0.6.4.js"></script>
    <style>
:root { --bg: #09090b; --fg: #fafafa; --card: #111114; --line: #27272a; }
* { box-sizing: border-box; }
html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); }
#demo { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); color: var(--fg); font-family: Inter, sans-serif; }
.center { position: absolute; inset: 0; display: grid; place-items: center; }
.row { display: flex; align-items: center; justify-content: center; gap: 48px; }
.col { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 32px; }
.h1 { font-size: 132px; font-weight: 800; letter-spacing: -0.035em; line-height: 1.1; text-align: center; }
.h2 { font-size: 84px; font-weight: 700; letter-spacing: -0.025em; line-height: 1.15; text-align: center; }
.p { font-size: 40px; line-height: 1.4; opacity: 0.72; text-align: center; }
.card { position: relative; border-radius: 28px; background: var(--card); border: 2px solid var(--line); overflow: hidden; }
.muted { opacity: 0.6; }
.mw-globe { position: relative; aspect-ratio: 1; }
.mw-globe > canvas { width: 100%; height: 100%; contain: layout paint size; opacity: 0; }
.wrap { position: relative; width: 1700px; height: 900px; display: flex; align-items: center; }
.copy { width: 760px; } .copy .h1 { text-align: left; font-size: 110px; } .copy .p { text-align: left; }
.mw-globe { position: absolute; right: 0; top: 50%; transform: translateY(-50%); width: 820px; }
    </style>
  </head>
  <body>
    <div id="demo" data-composition-id="mw-demo" data-start="0" data-width="1920" data-height="1080" data-duration="8">
<div class="center"><div class="wrap"><div class="copy"><div class="h1">Toàn cầu</div><div class="p">Khách hàng ở hơn 40 quốc gia tin dùng Moworks Studio.</div></div><div class="mw-globe"></div></div></div>
      <script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  var defaults = {"size":600,"phi":0,"speed":0.3,"theta":0.3,"dark":0,"diffuse":0.4,"mapSamples":16000,"mapBrightness":1.2,"mapBaseBrightness":0,"baseColor":[1,1,1],"markerColor":[0.984313725490196,0.39215686274509803,0.08235294117647059],"glowColor":[1,1,1],"markers":[{"location":[14.5995,120.9842],"size":0.03},{"location":[19.076,72.8777],"size":0.1},{"location":[23.8103,90.4125],"size":0.05},{"location":[30.0444,31.2357],"size":0.07},{"location":[39.9042,116.4074],"size":0.08},{"location":[-23.5505,-46.6333],"size":0.1},{"location":[19.4326,-99.1332],"size":0.1},{"location":[40.7128,-74.006],"size":0.1},{"location":[34.6937,135.5022],"size":0.05},{"location":[41.0082,28.9784],"size":0.06}],"fadeIn":0.5,"hold":10};
  var run = function (el, tl, at, o) {
      var canvas = document.createElement("canvas"); el.appendChild(canvas);
      var state = { phi: o.phi };
      // cobe decodes its map texture from a data: image asynchronously: catch that image so the film waits for it (MW.pending)
      var Real = window.Image, caught = [];
      window.Image = function () { var img = new Real(); caught.push(img); return img; };
      var globe;
      try { globe = window.createGlobe(canvas, { devicePixelRatio: 2, width: o.size * 2, height: o.size * 2, phi: o.phi, theta: o.theta, dark: o.dark, diffuse: o.diffuse,
        mapSamples: o.mapSamples, mapBrightness: o.mapBrightness, mapBaseBrightness: o.mapBaseBrightness, baseColor: o.baseColor, markerColor: o.markerColor, glowColor: o.glowColor, markers: o.markers,
        context: { preserveDrawingBuffer: true }, onRender: function (st) { st.phi = state.phi; st.width = o.size * 2; st.height = o.size * 2; } }); }
      finally { window.Image = Real; }
      globe.toggle(false);                                    // no frame loop of its own: the film draws it
      var s = { t: 0 };
      var draw = function () {
        state.phi = o.phi + o.speed * s.t;
        canvas.style.opacity = Math.min(1, Math.max(0, s.t / o.fadeIn));
        globe.render(); globe.render();                        // cobe applies the state after a draw: the second draw shows it
      };
      draw();
      MW.pending = MW.pending || [];
      caught.forEach(function (img) {
        MW.pending.push(img.complete ? Promise.resolve() : new Promise(function (ok) { img.addEventListener("load", ok); img.addEventListener("error", ok); }).then(draw));
      });
      tl.fromTo(s, { t: 0 }, { t: o.hold, duration: o.hold, ease: "none", onUpdate: draw, immediateRender: false }, at);
      return at + o.hold;
    };
  MW.globe = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
      </script>
      <script>
        (function () {
          var tl = gsap.timeline({ paused: true });
          var q = function (s) { return document.querySelector(s); }, qa = function (s) { return Array.prototype.slice.call(document.querySelectorAll(s)); };
          MW.globe(q(".mw-globe"), tl, 0, { size: 820, hold: 8 });
          tl.set({}, {}, 8);
          // register only when every motion is ready (MW.pending: e.g. a WebGL texture still decoding), as HyperFrames asks of async builds
          var go = function () { window.__timelines = window.__timelines || {}; window.__timelines["mw-demo"] = tl; };
          if (window.MW && MW.pending && MW.pending.length) Promise.all(MW.pending).then(go, go); else go();
        })();
      </script>
    </div>
  </body>
</html>
