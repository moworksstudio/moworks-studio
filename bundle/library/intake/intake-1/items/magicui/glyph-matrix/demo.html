<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Glyph Matrix - Demo</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
:root { --bg: #09090b; --fg: #fafafa; --card: #111114; --line: #27272a; }
* { box-sizing: border-box; }
html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); }
#demo { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); color: var(--fg); font-family: Inter, sans-serif; }
.center { position: absolute; inset: 0; display: grid; place-items: center; }
.row { display: flex; align-items: center; justify-content: center; gap: 48px; }
.col { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 32px; }
.h1 { font-size: 132px; font-weight: 800; letter-spacing: -0.035em; line-height: 1.1; text-align: center; }
.h2 { font-size: 84px; font-weight: 700; letter-spacing: -0.025em; line-height: 1.15; text-align: center; }
.p { font-size: 40px; line-height: 1.4; opacity: 0.72; text-align: center; }
.card { position: relative; border-radius: 28px; background: var(--card); border: 2px solid var(--line); overflow: hidden; }
.muted { opacity: 0.6; }
.mw-glyph-matrix { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; font-family: 'JetBrains Mono', monospace; }
.mw-glyph-matrix { display: block; }
    </style>
  </head>
  <body>
    <div id="demo" data-composition-id="mw-demo" data-start="0" data-width="1920" data-height="1080" data-duration="6">
<canvas class="mw-glyph-matrix"></canvas><div class="center"><div class="col"><div class="h1" style="font-family:'JetBrains Mono',monospace;font-size:110px">npx moworks</div><div class="p">Công cụ cho lập trình viên</div></div></div>
      <script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.rand = MW.rand || function (seed) {
    var a = typeof seed === "string" ? MW.hash(seed) : (seed >>> 0) || 1;
    return function () { a = (a + 0x6d2b79f5) >>> 0; var t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  };
  MW.hash = MW.hash || function (s) { var h = 2166136261; s = String(s); for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; };
  var defaults = {"glyphs":"01·•+*/\\<>=","cellSize":14,"mutationRate":0.04,"interval":90,"fadeBottom":0.6,"color":"#6B7280","font":"'JetBrains Mono', monospace","hold":10,"seed":1};
  var run = function (el, tl, at, o) {
      var w = el.clientWidth, h = el.clientHeight, dpr = window.devicePixelRatio || 1, ctx = el.getContext("2d");
      el.width = w * dpr; el.height = h * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      var p = document.createElement("canvas").getContext("2d"); p.fillStyle = "#6B7280"; p.fillStyle = o.color; p.fillRect(0, 0, 1, 1);
      var px = p.getImageData(0, 0, 1, 1).data, ca = px[3] / 255;
      var cols = Math.ceil(w / o.cellSize), rows = Math.ceil(h / o.cellSize), total = cols * rows, G = o.glyphs;
      var r = MW.rand(o.seed * 3001), start = [], startA = [];
      for (var i = 0; i < total; i++) { start.push(G[Math.floor(r() * G.length)]); startA.push(0.05 + r() * 0.35); }
      // the mutations of every tick, drawn once from the seed
      var ticks = Math.floor((o.hold * 1000) / o.interval), per = Math.max(1, Math.floor(total * o.mutationRate)), muts = [];
      for (var k = 0; k < ticks; k++) { var m = []; for (var j = 0; j < per; j++) m.push([Math.floor(r() * total), G[Math.floor(r() * G.length)], 0.05 + r() * 0.45]); muts.push(m); }
      var s = { t: 0 }, cells = [], alphas = [];
      var draw = function () {
        cells = start.slice(); alphas = startA.slice();
        var upto = Math.min(ticks, Math.floor((s.t * 1000) / o.interval));
        for (var k = 0; k < upto; k++) for (var j = 0; j < muts[k].length; j++) { var q = muts[k][j]; cells[q[0]] = q[1]; alphas[q[0]] = q[2]; }
        ctx.clearRect(0, 0, w, h);
        ctx.font = o.cellSize - 2 + "px " + o.font; ctx.textBaseline = "top";
        for (var y = 0; y < rows; y++) {
          var fade = o.fadeBottom > 0 ? 1 - (y / rows) * o.fadeBottom : 1;
          for (var x = 0; x < cols; x++) { var i = y * cols + x; ctx.fillStyle = "rgba(" + px[0] + ", " + px[1] + ", " + px[2] + ", " + alphas[i] * fade * ca + ")"; ctx.fillText(cells[i], x * o.cellSize, y * o.cellSize); }
        }
      };
      draw();
      tl.fromTo(s, { t: 0 }, { t: o.hold, duration: o.hold, ease: "none", onUpdate: draw, immediateRender: false }, at);
      return at + o.hold;
    };
  MW.glyphMatrix = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
      </script>
      <script>
        (function () {
          var tl = gsap.timeline({ paused: true });
          var q = function (s) { return document.querySelector(s); }, qa = function (s) { return Array.prototype.slice.call(document.querySelectorAll(s)); };
          MW.glyphMatrix(q(".mw-glyph-matrix"), tl, 0, { cellSize: 28, color: "#a1a1aa", hold: 6 });
          tl.set({}, {}, 6);
          // register only when every motion is ready (MW.pending: e.g. a WebGL texture still decoding), as HyperFrames asks of async builds
          var go = function () { window.__timelines = window.__timelines || {}; window.__timelines["mw-demo"] = tl; };
          if (window.MW && MW.pending && MW.pending.length) Promise.all(MW.pending).then(go, go); else go();
        })();
      </script>
    </div>
  </body>
</html>
