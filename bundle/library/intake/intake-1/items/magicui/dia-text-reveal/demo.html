<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Dia Text Reveal - Demo</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
:root { --bg: #09090b; --fg: #fafafa; --card: #111114; --line: #27272a; }
* { box-sizing: border-box; }
html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); }
#demo { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); color: var(--fg); font-family: Inter, sans-serif; }
.center { position: absolute; inset: 0; display: grid; place-items: center; }
.row { display: flex; align-items: center; justify-content: center; gap: 48px; }
.col { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 32px; }
.h1 { font-size: 132px; font-weight: 800; letter-spacing: -0.035em; line-height: 1.1; text-align: center; }
.h2 { font-size: 84px; font-weight: 700; letter-spacing: -0.025em; line-height: 1.15; text-align: center; }
.p { font-size: 40px; line-height: 1.4; opacity: 0.72; text-align: center; }
.card { position: relative; border-radius: 28px; background: var(--card); border: 2px solid var(--line); overflow: hidden; }
.muted { opacity: 0.6; }
.mw-dia-text-reveal { display: inline-block; vertical-align: bottom; white-space: nowrap; padding: 0.12em 0; margin: -0.12em 0; color: transparent;
  -webkit-background-clip: text; background-clip: text; overflow: hidden; }

    </style>
  </head>
  <body>
    <div id="demo" data-composition-id="mw-demo" data-start="0" data-width="1920" data-height="1080" data-duration="7">
<div class="center"><div class="col"><div class="h1"><span class="mw-dia-text-reveal r1">Trình duyệt AI</span></div>
<div class="h2"><span class="mw-dia-text-reveal r2">Viết nhanh hơn</span></div></div></div>
<div hidden aria-hidden="true" data-mw-script-text>Viết nhanh hơn · Nghĩ rõ ràng hơn · Làm ít hơn</div>
      <script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.bezier = MW.bezier || function (x1, y1, x2, y2) {
    var cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx, cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
    var X = function (t) { return ((ax * t + bx) * t + cx) * t; }, Y = function (t) { return ((ay * t + by) * t + cy) * t; }, dX = function (t) { return (3 * ax * t + 2 * bx) * t + cx; };
    return function (p) {
      if (p <= 0) return 0; if (p >= 1) return 1;
      var t = p, i, d;
      for (i = 0; i < 8; i++) { d = X(t) - p; if (Math.abs(d) < 1e-6) return Y(t); var s = dX(t); if (Math.abs(s) < 1e-6) break; t -= d / s; }
      var lo = 0, hi = 1; t = p;
      for (i = 0; i < 40; i++) { d = X(t); if (Math.abs(d - p) < 1e-6) break; if (d < p) lo = t; else hi = t; t = (lo + hi) / 2; }
      return Y(t);
    };
  };
  MW.CSS_EASE = { ease: [0.25, 0.1, 0.25, 1], easeIn: [0.42, 0, 1, 1], easeOut: [0, 0, 0.58, 1], easeInOut: [0.42, 0, 0.58, 1] };
  var defaults = {"texts":null,"colors":["#c679c4","#fa3d1d","#ffb005","#e1e1fe","#0358f7"],"textColor":null,"duration":1.5,"delay":0,"repeat":false,"repeatDelay":0.5,"cycles":0};
  var run = function (el, tl, at, o) {
      var HALF = 17, START = -HALF, END = 100 + HALF;
      var texts = o.texts || [el.textContent];
      var textColor = o.textColor || getComputedStyle(el.parentNode).color;
      var grad = function (pos) {
        var a = pos - HALF, b = pos + HALF, n = o.colors.length, parts = [];
        if (a >= 100) return "linear-gradient(90deg, " + textColor + ", " + textColor + ")";
        if (a > 0) parts.push(textColor + " 0%", textColor + " " + a.toFixed(2) + "%");
        for (var i = 0; i < n; i++) parts.push(o.colors[i] + " " + (n === 1 ? pos : a + (i / (n - 1)) * HALF * 2).toFixed(2) + "%");
        if (b < 100) parts.push("transparent " + b.toFixed(2) + "%", "transparent 100%");
        return "linear-gradient(90deg, " + parts.join(", ") + ")";
      };
      // widths of every phrase, measured once (upstream measures with a hidden clone)
      var widths = texts.map(function (t) { el.textContent = t; return el.getBoundingClientRect().width; });
      el.textContent = texts[0];
      var multi = texts.length > 1 && o.repeat;
      if (multi) el.style.width = widths[0] + "px";
      var sweep = function (t) { return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; };
      var cycle = o.duration + o.repeatDelay, n = multi ? (o.cycles || texts.length) : 1, wEase = MW.bezier(0.4, 0, 0.2, 1);
      var total = o.delay + n * cycle;
      // everything follows from the time alone (no callbacks), so any frame seeks exactly
      var s = { t: 0 }, shown = 0;
      var paint = function () {
        var t = s.t - o.delay, k = Math.max(0, Math.min(n - 1, Math.floor(t / cycle))), local = t - k * cycle;
        if (k !== shown) { el.textContent = texts[k % texts.length]; shown = k; }
        if (multi) {
          var w0 = widths[(k + texts.length - 1) % texts.length], w1 = widths[k % texts.length];
          el.style.width = (k === 0 ? w1 : w0 + (w1 - w0) * wEase(Math.max(0, Math.min(1, local / 0.4)))) + "px";
        }
        var p = t < 0 ? START : START + (END - START) * sweep(Math.max(0, Math.min(1, local / o.duration)));
        el.style.backgroundImage = grad(p);
      };
      paint();
      tl.fromTo(s, { t: 0 }, { t: total, duration: total, ease: "none", onUpdate: paint, immediateRender: false }, at);
      return at + total;
    };
  MW.diaTextReveal = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
      </script>
      <script>
        (function () {
          var tl = gsap.timeline({ paused: true });
          var q = function (s) { return document.querySelector(s); }, qa = function (s) { return Array.prototype.slice.call(document.querySelectorAll(s)); };
          MW.diaTextReveal(q(".r1"), tl, 0.4, {});
          MW.diaTextReveal(q(".r2"), tl, 1.2, { texts: ["Viết nhanh hơn", "Nghĩ rõ ràng hơn", "Làm ít hơn"], repeat: true, colors: ["#A97CF8", "#F38CB8", "#FDCC92"] });
          tl.set({}, {}, 7);
          // register only when every motion is ready (MW.pending: e.g. a WebGL texture still decoding), as HyperFrames asks of async builds
          var go = function () { window.__timelines = window.__timelines || {}; window.__timelines["mw-demo"] = tl; };
          if (window.MW && MW.pending && MW.pending.length) Promise.all(MW.pending).then(go, go); else go();
        })();
      </script>
    </div>
  </body>
</html>
