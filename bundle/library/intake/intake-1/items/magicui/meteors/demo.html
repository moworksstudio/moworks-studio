<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Meteors - Demo</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
:root { --bg: #09090b; --fg: #fafafa; --card: #111114; --line: #27272a; }
* { box-sizing: border-box; }
html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); }
#demo { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); color: var(--fg); font-family: Inter, sans-serif; }
.center { position: absolute; inset: 0; display: grid; place-items: center; }
.row { display: flex; align-items: center; justify-content: center; gap: 48px; }
.col { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 32px; }
.h1 { font-size: 132px; font-weight: 800; letter-spacing: -0.035em; line-height: 1.1; text-align: center; }
.h2 { font-size: 84px; font-weight: 700; letter-spacing: -0.025em; line-height: 1.15; text-align: center; }
.p { font-size: 40px; line-height: 1.4; opacity: 0.72; text-align: center; }
.card { position: relative; border-radius: 28px; background: var(--card); border: 2px solid var(--line); overflow: hidden; }
.muted { opacity: 0.6; }
.mw-meteors { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
.mw-meteors > .mw-meteor { position: absolute; width: 2px; height: 2px; border-radius: 9999px; background: #71717b; box-shadow: 0 0 0 1px #ffffff10; }
.mw-meteors > .mw-meteor::before { content: ""; position: absolute; top: 50%; width: 50px; height: 1px; transform: translateY(-50%); background: linear-gradient(to right, #71717b, transparent); }
.sky { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 120%, #1e1b4b 0%, #09090b 60%); }
.mw-meteor { transform-origin: 0 0; } .mw-meteors > .mw-meteor { width: 4px; height: 4px; background: #a1a1aa; } .mw-meteors > .mw-meteor::before { width: 120px; height: 2px; background: linear-gradient(to right, #a1a1aa, transparent); }
    </style>
  </head>
  <body>
    <div id="demo" data-composition-id="mw-demo" data-start="0" data-width="1920" data-height="1080" data-duration="8">
<div class="sky"></div><div class="mw-meteors"></div><div class="center"><div class="h1">Đêm sao băng</div></div>
      <script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.rand = MW.rand || function (seed) {
    var a = typeof seed === "string" ? MW.hash(seed) : (seed >>> 0) || 1;
    return function () { a = (a + 0x6d2b79f5) >>> 0; var t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  };
  MW.hash = MW.hash || function (s) { var h = 2166136261; s = String(s); for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; };
  var defaults = {"number":20,"minDelay":0.2,"maxDelay":1.2,"minDuration":2,"maxDuration":10,"angle":215,"hold":10,"seed":1};
  var run = function (el, tl, at, o) {
      var r = MW.rand(o.seed * 4099), W = el.offsetWidth, list = [];
      for (var i = 0; i < o.number; i++) {
        var m = document.createElement("span"); m.className = "mw-meteor";
        var left = Math.floor(r() * W), delay = r() * (o.maxDelay - o.minDelay) + o.minDelay, dur = Math.floor(r() * (o.maxDuration - o.minDuration) + o.minDuration);
        m.style.top = "-5%"; m.style.left = left + "px";
        m.style.rotate = -o.angle + "deg";          // Tailwind rotate-(--angle) sets the rotate property, which adds to the keyframe's rotate()
        el.appendChild(m); list.push({ m: m, delay: delay, dur: dur });
      }
      var s = { t: 0 };
      var set = function () {
        for (var i = 0; i < list.length; i++) {
          var L = list[i], u = s.t - L.delay, x = 0, op = 1;
          if (u < 0) { op = 1; x = 0; }                              // during its delay a CSS-animated span shows its own style: in place, visible
          else { var f = (u % L.dur) / L.dur; x = -500 * f; op = f < 0.7 ? 1 : 1 - (f - 0.7) / 0.3; }
          L.m.style.transform = "rotate(" + -o.angle + "deg) translateX(" + x + "px)";
          L.m.style.opacity = op;
        }
      };
      set();
      tl.fromTo(s, { t: 0 }, { t: o.hold, duration: o.hold, ease: "none", onUpdate: set, immediateRender: false }, at);
      return at + o.hold;
    };
  MW.meteors = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
      </script>
      <script>
        (function () {
          var tl = gsap.timeline({ paused: true });
          var q = function (s) { return document.querySelector(s); }, qa = function (s) { return Array.prototype.slice.call(document.querySelectorAll(s)); };
          MW.meteors(q(".mw-meteors"), tl, 0, { number: 30, hold: 8 });
          tl.set({}, {}, 8);
          // register only when every motion is ready (MW.pending: e.g. a WebGL texture still decoding), as HyperFrames asks of async builds
          var go = function () { window.__timelines = window.__timelines || {}; window.__timelines["mw-demo"] = tl; };
          if (window.MW && MW.pending && MW.pending.length) Promise.all(MW.pending).then(go, go); else go();
        })();
      </script>
    </div>
  </body>
</html>
