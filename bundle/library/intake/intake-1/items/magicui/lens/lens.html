<!--
  Lens (Magic UI (magicuidesign), MIT, adapted).
  Source: magicuidesign/magicui at efe76fc, apps/www/registry/magicui/lens.tsx.
  A round magnifying lens glides over a picture or UI and zooms into the detail under it (x1.3, 170 px), popping in and out.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.lens(q(".mw-lens"), tl, 0.4, { zoomFactor: 2, lensSize: 300, path: [[0, 300, 420], [1.6, 690, 610], [3.2, 420, 760], [4.6, 600, 360]], enter: 0, leave: 4.6 });

  Options (defaults in brackets):
      - zoomFactor: 1.3
      - lensSize: px (170)
      - duration: s (0.1)
      - lensColor: black
      - path: [[0, x, y], ...]
      - enter: 0
      - leave: end of the path

  Notes: el is the holder (position relative, overflow hidden); its content is cloned for the zoomed copy (ids in the clone are removed). path: [[t, x, y], ...] px in el; enter / leave in s after `at`.
-->

<div class="mw-lens"><img src="assets/picture.svg" alt=""></div>

<style>
.mw-lens { position: relative; overflow: hidden; }
.mw-lens > .mw-lens-copy { position: absolute; inset: 0; overflow: hidden; z-index: 50; pointer-events: none; }
.mw-lens > .mw-lens-copy > div { position: absolute; inset: 0; }
</style>

<script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.bezier = MW.bezier || function (x1, y1, x2, y2) {
    var cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx, cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
    var X = function (t) { return ((ax * t + bx) * t + cx) * t; }, Y = function (t) { return ((ay * t + by) * t + cy) * t; }, dX = function (t) { return (3 * ax * t + 2 * bx) * t + cx; };
    return function (p) {
      if (p <= 0) return 0; if (p >= 1) return 1;
      var t = p, i, d;
      for (i = 0; i < 8; i++) { d = X(t) - p; if (Math.abs(d) < 1e-6) return Y(t); var s = dX(t); if (Math.abs(s) < 1e-6) break; t -= d / s; }
      var lo = 0, hi = 1; t = p;
      for (i = 0; i < 40; i++) { d = X(t); if (Math.abs(d - p) < 1e-6) break; if (d < p) lo = t; else hi = t; t = (lo + hi) / 2; }
      return Y(t);
    };
  };
  MW.CSS_EASE = { ease: [0.25, 0.1, 0.25, 1], easeIn: [0.42, 0, 1, 1], easeOut: [0, 0, 0.58, 1], easeInOut: [0.42, 0, 0.58, 1] };
  var defaults = {"zoomFactor":1.3,"lensSize":170,"duration":0.1,"lensColor":"black","path":null,"enter":0,"leave":null};
  var run = function (el, tl, at, o) {
      var W = el.clientWidth, H = el.clientHeight, path = o.path || [[0, W * 0.3, H * 0.4], [1.5, W * 0.7, H * 0.6], [3, W * 0.4, H * 0.7]];
      var copy = document.createElement("div"), inner = document.createElement("div"); copy.className = "mw-lens-copy";
      Array.prototype.forEach.call(el.childNodes, function (n) { var c = n.cloneNode(true); if (c.removeAttribute) c.removeAttribute("id"); inner.appendChild(c); });
      copy.appendChild(inner); el.appendChild(copy);
      var leave = o.leave == null ? path[path.length - 1][0] : o.leave, e = MW.bezier.apply(null, MW.CSS_EASE.easeInOut), D = o.duration;
      var pos = function (t) {
        if (t <= path[0][0]) return [path[0][1], path[0][2]];
        for (var k = 1; k < path.length; k++) if (t <= path[k][0]) { var a = path[k - 1], b = path[k], f = (t - a[0]) / (b[0] - a[0]), g = f * f * (3 - 2 * f); return [a[1] + (b[1] - a[1]) * g, a[2] + (b[2] - a[2]) * g]; }
        return [path[path.length - 1][1], path[path.length - 1][2]];
      };
      var s = { t: 0 }, set = function () {
        var p = pos(s.t), x = p[0], y = p[1], op = 0, sc = 0.58;
        if (s.t >= o.enter && s.t < leave) { var k = e(Math.min(1, (s.t - o.enter) / D)); op = k; sc = 0.58 + 0.42 * k; }
        else if (s.t >= leave) { var j = e(Math.min(1, (s.t - leave) / D)); op = 1 - j; sc = 1 - 0.2 * j; }
        var m = "radial-gradient(circle " + o.lensSize / 2 + "px at " + x + "px " + y + "px, " + o.lensColor + " 100%, transparent 100%)";
        copy.style.webkitMaskImage = copy.style.maskImage = m; copy.style.opacity = op;
        copy.style.transformOrigin = x + "px " + y + "px"; copy.style.transform = "scale(" + sc + ")";
        inner.style.transformOrigin = x + "px " + y + "px"; inner.style.transform = "scale(" + o.zoomFactor + ")";
      };
      set();
      var end = leave + D;
      tl.fromTo(s, { t: 0 }, { t: end, duration: end, ease: "none", onUpdate: set, immediateRender: false }, at);
      return at + end;
    };
  MW.lens = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
</script>
