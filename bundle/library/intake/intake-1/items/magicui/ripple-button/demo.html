<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Ripple Button - Demo</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
:root { --bg: #09090b; --fg: #fafafa; --card: #111114; --line: #27272a; }
* { box-sizing: border-box; }
html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); }
#demo { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); color: var(--fg); font-family: Inter, sans-serif; }
.center { position: absolute; inset: 0; display: grid; place-items: center; }
.row { display: flex; align-items: center; justify-content: center; gap: 48px; }
.col { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 32px; }
.h1 { font-size: 132px; font-weight: 800; letter-spacing: -0.035em; line-height: 1.1; text-align: center; }
.h2 { font-size: 84px; font-weight: 700; letter-spacing: -0.025em; line-height: 1.15; text-align: center; }
.p { font-size: 40px; line-height: 1.4; opacity: 0.72; text-align: center; }
.card { position: relative; border-radius: 28px; background: var(--card); border: 2px solid var(--line); overflow: hidden; }
.muted { opacity: 0.6; }
.mw-ripple-button { position: relative; display: flex; align-items: center; justify-content: center; overflow: hidden; border-radius: 8px; border: 2px solid currentColor; padding: 8px 16px; text-align: center; }
.mw-ripple-button > .mw-rp-label { position: relative; z-index: 10; }
.mw-ripple-button > .mw-rp-ink { pointer-events: none; position: absolute; inset: 0; }
.mw-ripple-button .mw-rp-ink > span { position: absolute; border-radius: 9999px; transform: scale(0); }
.mw-ripple-button { font-size: 52px; font-weight: 600; padding: 28px 70px; border-radius: 18px; color: #fafafa; background: #18181b; }
.tap { position: absolute; width: 56px; height: 56px; border-radius: 50%; border: 4px solid rgba(255,255,255,.8); margin: -28px 0 0 -28px; opacity: 0; }
    </style>
  </head>
  <body>
    <div id="demo" data-composition-id="mw-demo" data-start="0" data-width="1920" data-height="1080" data-duration="5">
<div class="center"><div class="mw-ripple-button">Thêm vào giỏ</div></div>
      <script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.bezier = MW.bezier || function (x1, y1, x2, y2) {
    var cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx, cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
    var X = function (t) { return ((ax * t + bx) * t + cx) * t; }, Y = function (t) { return ((ay * t + by) * t + cy) * t; }, dX = function (t) { return (3 * ax * t + 2 * bx) * t + cx; };
    return function (p) {
      if (p <= 0) return 0; if (p >= 1) return 1;
      var t = p, i, d;
      for (i = 0; i < 8; i++) { d = X(t) - p; if (Math.abs(d) < 1e-6) return Y(t); var s = dX(t); if (Math.abs(s) < 1e-6) break; t -= d / s; }
      var lo = 0, hi = 1; t = p;
      for (i = 0; i < 40; i++) { d = X(t); if (Math.abs(d - p) < 1e-6) break; if (d < p) lo = t; else hi = t; t = (lo + hi) / 2; }
      return Y(t);
    };
  };
  MW.CSS_EASE = { ease: [0.25, 0.1, 0.25, 1], easeIn: [0.42, 0, 1, 1], easeOut: [0, 0, 0.58, 1], easeInOut: [0.42, 0, 0.58, 1] };
  var defaults = {"rippleColor":"#ffffff","duration":0.6,"clicks":null};
  var run = function (el, tl, at, o) {
      var label = document.createElement("div"); label.className = "mw-rp-label"; while (el.firstChild) label.appendChild(el.firstChild);
      var ink = document.createElement("span"); ink.className = "mw-rp-ink"; el.appendChild(label); el.appendChild(ink);
      var W = el.offsetWidth, H = el.offsetHeight, size = Math.max(W, H), e = MW.bezier.apply(null, MW.CSS_EASE.easeOut), last = 0;
      (o.clicks || [[0, W / 2, H / 2]]).forEach(function (c) {
        var r = document.createElement("span");
        r.style.width = r.style.height = size + "px"; r.style.left = c[1] - size / 2 + "px"; r.style.top = c[2] - size / 2 + "px"; r.style.backgroundColor = o.rippleColor; r.style.opacity = 0;
        ink.appendChild(r);
        // hidden until its click; the keyframe's 0 % (opacity 1) overrides the span's opacity-30 class, as in the browser
        tl.fromTo(r, { scale: 0, opacity: 1 }, { scale: 2, opacity: 0, duration: o.duration, ease: e, immediateRender: false }, at + c[0]);
        // removed at its own end (its own timer upstream), whatever the other clicks do
        tl.set(r, { display: "none" }, at + c[0] + o.duration);
        last = Math.max(last, c[0] + o.duration);
      });
      return at + last;
    };
  MW.rippleButton = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
      </script>
      <script>
        (function () {
          var tl = gsap.timeline({ paused: true });
          var q = function (s) { return document.querySelector(s); }, qa = function (s) { return Array.prototype.slice.call(document.querySelectorAll(s)); };
          MW.rippleButton(q(".mw-ripple-button"), tl, 0.5, { rippleColor: "#ADD8E6", duration: 0.6, clicks: [[0, 120, 60], [1.2, 420, 80], [2.4, 260, 50]] });
          tl.set({}, {}, 5);
          // register only when every motion is ready (MW.pending: e.g. a WebGL texture still decoding), as HyperFrames asks of async builds
          var go = function () { window.__timelines = window.__timelines || {}; window.__timelines["mw-demo"] = tl; };
          if (window.MW && MW.pending && MW.pending.length) Promise.all(MW.pending).then(go, go); else go();
        })();
      </script>
    </div>
  </body>
</html>
