<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Scroll Based Velocity - Demo</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
:root { --bg: #09090b; --fg: #fafafa; --card: #111114; --line: #27272a; }
* { box-sizing: border-box; }
html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); }
#demo { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); color: var(--fg); font-family: Inter, sans-serif; }
.center { position: absolute; inset: 0; display: grid; place-items: center; }
.row { display: flex; align-items: center; justify-content: center; gap: 48px; }
.col { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 32px; }
.h1 { font-size: 132px; font-weight: 800; letter-spacing: -0.035em; line-height: 1.1; text-align: center; }
.h2 { font-size: 84px; font-weight: 700; letter-spacing: -0.025em; line-height: 1.15; text-align: center; }
.p { font-size: 40px; line-height: 1.4; opacity: 0.72; text-align: center; }
.card { position: relative; border-radius: 28px; background: var(--card); border: 2px solid var(--line); overflow: hidden; }
.muted { opacity: 0.6; }
.mw-scroll-based-velocity { width: 100%; overflow: hidden; white-space: nowrap; }
.mw-scroll-based-velocity > .mw-sv-track { display: inline-flex; align-items: center; will-change: transform; }
.mw-scroll-based-velocity .mw-sv-copy { display: inline-flex; flex-shrink: 0; align-items: center; }
.rows { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; gap: 30px; }
.mw-scroll-based-velocity { font-size: 150px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.2; }
.fade { position: absolute; top: 0; bottom: 0; width: 25%; pointer-events: none; } .fade.l { left: 0; background: linear-gradient(to right, var(--bg), transparent); } .fade.r { right: 0; background: linear-gradient(to left, var(--bg), transparent); }
    </style>
  </head>
  <body>
    <div id="demo" data-composition-id="mw-demo" data-start="0" data-width="1920" data-height="1080" data-duration="8">
<div class="rows"><div class="mw-scroll-based-velocity r1"><span class="mw-sv-copy">Chuyển động có chủ đích&nbsp;·&nbsp;</span></div>
<div class="mw-scroll-based-velocity r2" style="color:#a78bfa"><span class="mw-sv-copy">Làm video nhanh hơn&nbsp;·&nbsp;</span></div></div><div class="fade l"></div><div class="fade r"></div>
      <script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.spring = MW.spring || function (stiffness, damping, mass, from, to) {
    var k = stiffness || 100, c = damping == null ? 10 : damping, m = mass || 1, w0 = Math.sqrt(k / m), z = c / (2 * Math.sqrt(k * m));
    var x = function (t) {
      if (z < 1) { var wd = w0 * Math.sqrt(1 - z * z); return 1 - Math.exp(-z * w0 * t) * (Math.cos(wd * t) + (z * w0 / wd) * Math.sin(wd * t)); }
      if (z === 1) return 1 - Math.exp(-w0 * t) * (1 + w0 * t);
      var q = Math.sqrt(z * z - 1), r1 = -w0 * (z - q), r2 = -w0 * (z + q), A = r2 / (r2 - r1), B = -r1 / (r2 - r1);
      return 1 - (A * Math.exp(r1 * t) + B * Math.exp(r2 * t));
    };
    var T = 0, dt = 1 / 240; for (var t = 0; t < 30; t += dt) if (Math.abs(1 - x(t)) > 0.001) T = t;
    T = Math.max(dt, T + dt);
    return { duration: T, ease: function (p) { return p >= 1 ? 1 : x(p * T); }, at: x };
  };
  MW.springDB = MW.springDB || function (duration, bounce) {
    var z = 1 - (bounce == null ? 0.25 : bounce), w = Math.log(1000) / (Math.max(0.05, z) * (duration || 0.8));
    return MW.spring(w * w, 2 * z * w, 1);
  };
  var defaults = {"baseVelocity":5,"direction":1,"scroll":[],"hold":8};
  var run = function (el, tl, at, o) {
      var copy = el.querySelector(".mw-sv-copy");
      if (!copy) { copy = document.createElement("span"); copy.className = "mw-sv-copy"; copy.textContent = el.textContent; el.textContent = ""; el.appendChild(copy); }
      var track = document.createElement("div"); track.className = "mw-sv-track"; el.insertBefore(track, copy); track.appendChild(copy);
      var bw = copy.getBoundingClientRect().width, cw = el.getBoundingClientRect().width, copies = Math.max(3, Math.ceil(cw / bw) + 2);
      for (var i = 1; i < copies; i++) { var c = copy.cloneNode(true); c.setAttribute("aria-hidden", "true"); track.appendChild(c); }
      // virtual scroll speed -> spring -> factor, integrated once at 240 Hz
      var keys = o.scroll || [], dt = 1 / 240, N = Math.ceil(o.hold / dt) + 1, X = new Float64Array(N);
      var vAt = function (t) { if (!keys.length) return 0; if (t <= keys[0][0]) return keys[0][1]; for (var k = 1; k < keys.length; k++) if (t <= keys[k][0]) { var a = keys[k - 1], b = keys[k]; return a[1] + (b[1] - a[1]) * (t - a[0]) / (b[0] - a[0]); } return keys[keys.length - 1][1]; };
      var y = 0, vy = 0, x = 0, dir = o.direction, base = o.direction;
      for (var f = 0; f < N; f++) {
        X[f] = x;
        var target = vAt(f * dt);
        vy += (400 * (target - y) - 50 * vy) * dt; y += vy * dt;          // spring (mass 1) chasing the scroll speed
        var vf = (y < 0 ? -1 : 1) * Math.min(5, Math.abs(y) / 1000 * 5), av = Math.min(5, Math.abs(vf));
        if (av > 0.1) dir = base * (vf >= 0 ? 1 : -1);
        x += dir * (bw * o.baseVelocity / 100) * (1 + av) * dt;
      }
      var wrap = function (v) { return ((v % bw) + bw) % bw; };
      var s = { t: 0 };
      var draw = function () { var i = Math.max(0, Math.min(N - 1, Math.round(s.t / dt))); track.style.transform = "translateX(" + (-wrap(X[i])) + "px)"; };
      draw();
      tl.fromTo(s, { t: 0 }, { t: o.hold, duration: o.hold, ease: "none", onUpdate: draw, immediateRender: false }, at);
      return at + o.hold;
    };
  MW.scrollBasedVelocity = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
      </script>
      <script>
        (function () {
          var tl = gsap.timeline({ paused: true });
          var q = function (s) { return document.querySelector(s); }, qa = function (s) { return Array.prototype.slice.call(document.querySelectorAll(s)); };
          var burst = [[0, 0], [2.4, 0], [2.8, 900], [3.6, 900], [4.0, 0], [5.6, 0], [5.9, -700], [6.6, -700], [6.9, 0]];
          MW.scrollBasedVelocity(q(".r1"), tl, 0, { baseVelocity: 20, direction: 1, scroll: burst, hold: 8 });
          MW.scrollBasedVelocity(q(".r2"), tl, 0, { baseVelocity: 20, direction: -1, scroll: burst, hold: 8 });
          tl.set({}, {}, 8);
          // register only when every motion is ready (MW.pending: e.g. a WebGL texture still decoding), as HyperFrames asks of async builds
          var go = function () { window.__timelines = window.__timelines || {}; window.__timelines["mw-demo"] = tl; };
          if (window.MW && MW.pending && MW.pending.length) Promise.all(MW.pending).then(go, go); else go();
        })();
      </script>
    </div>
  </body>
</html>
