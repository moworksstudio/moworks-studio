<!--
  Number Ticker (Magic UI (magicuidesign), MIT, adapted).
  Source: magicuidesign/magicui at efe76fc, apps/www/registry/magicui/number-ticker.tsx.
  A number counts up (or down) to its value on a soft overdamped spring: fast at first, then a long gentle landing, with thousands separators.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.numberTicker(q(".n1"), tl, 0.4, { value: 12500, locale: "vi-VN" });

  Options (defaults in brackets):
      - value: target (100)
      - startValue: 0
      - direction: up | down (up)
      - delay: s (0)
      - decimalPlaces: 0
      - locale: en-US (vi-VN for 1.234,5)

  Notes: Spring stiffness 100, damping 60 (damping ratio 3): it settles in about 4 s. tabular-nums keeps the width steady.
-->

<span class="mw-number-ticker">0</span>

<style>
.mw-number-ticker { display: inline-block; letter-spacing: 0.05em; font-variant-numeric: tabular-nums; }
</style>

<script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.spring = MW.spring || function (stiffness, damping, mass, from, to) {
    var k = stiffness || 100, c = damping == null ? 10 : damping, m = mass || 1, w0 = Math.sqrt(k / m), z = c / (2 * Math.sqrt(k * m));
    var x = function (t) {
      if (z < 1) { var wd = w0 * Math.sqrt(1 - z * z); return 1 - Math.exp(-z * w0 * t) * (Math.cos(wd * t) + (z * w0 / wd) * Math.sin(wd * t)); }
      if (z === 1) return 1 - Math.exp(-w0 * t) * (1 + w0 * t);
      var q = Math.sqrt(z * z - 1), r1 = -w0 * (z - q), r2 = -w0 * (z + q), A = r2 / (r2 - r1), B = -r1 / (r2 - r1);
      return 1 - (A * Math.exp(r1 * t) + B * Math.exp(r2 * t));
    };
    var T = 0, dt = 1 / 240; for (var t = 0; t < 30; t += dt) if (Math.abs(1 - x(t)) > 0.001) T = t;
    T = Math.max(dt, T + dt);
    return { duration: T, ease: function (p) { return p >= 1 ? 1 : x(p * T); }, at: x };
  };
  MW.springDB = MW.springDB || function (duration, bounce) {
    var z = 1 - (bounce == null ? 0.25 : bounce), w = Math.log(1000) / (Math.max(0.05, z) * (duration || 0.8));
    return MW.spring(w * w, 2 * z * w, 1);
  };
  var defaults = {"value":100,"startValue":0,"direction":"up","delay":0,"decimalPlaces":0,"locale":"en-US"};
  var run = function (el, tl, at, o) {
      var a = o.direction === "down" ? o.value : o.startValue, b = o.direction === "down" ? o.startValue : o.value;
      var sp = MW.spring(100, 60, 1);
      var fmt = new Intl.NumberFormat(o.locale, { minimumFractionDigits: o.decimalPlaces, maximumFractionDigits: o.decimalPlaces });
      var s = { v: a };
      var set = function () { el.textContent = fmt.format(Number(s.v.toFixed(o.decimalPlaces))); };
      set();
      tl.fromTo(s, { v: a }, { v: b, duration: sp.duration, ease: sp.ease, onUpdate: set, immediateRender: false }, at + o.delay);
      return at + o.delay + sp.duration;
    };
  MW.numberTicker = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
</script>
