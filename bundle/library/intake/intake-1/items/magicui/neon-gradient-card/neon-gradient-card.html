<!--
  Neon Gradient Card (Magic UI (magicuidesign), MIT, adapted).
  Source: magicuidesign/magicui at efe76fc, apps/www/registry/magicui/neon-gradient-card.tsx.
  A card with a thin two-colour neon border and a large blurred glow behind it, the gradient sliding up and down (3 s each way).

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.neonGradientCard(q(".mw-neon-gradient-card"), tl, 0, { borderSize: 4, borderRadius: 28, hold: 6 });

  Options (defaults in brackets):
      - borderSize: px (2)
      - borderRadius: px (20)
      - firstColor: #ff00aa
      - secondColor: #00FFF1
      - panel: inner colour (#171717)
      - hold: seconds (6)

  Notes: el is the card (its content gets the inner panel). Docs say a 5 px border: the code has 2 px (the code wins).
-->

<div class="mw-neon-gradient-card">…</div>

<style>
.mw-neon-gradient-card { position: relative; z-index: 10; }
.mw-neon-gradient-card > .mw-ng-panel { position: relative; width: 100%; height: 100%; padding: 24px; box-sizing: border-box; }
.mw-neon-gradient-card .mw-ng-edge, .mw-neon-gradient-card .mw-ng-glow { position: absolute; z-index: -10; display: block; background-size: 100% 200%; }
</style>

<script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.bezier = MW.bezier || function (x1, y1, x2, y2) {
    var cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx, cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
    var X = function (t) { return ((ax * t + bx) * t + cx) * t; }, Y = function (t) { return ((ay * t + by) * t + cy) * t; }, dX = function (t) { return (3 * ax * t + 2 * bx) * t + cx; };
    return function (p) {
      if (p <= 0) return 0; if (p >= 1) return 1;
      var t = p, i, d;
      for (i = 0; i < 8; i++) { d = X(t) - p; if (Math.abs(d) < 1e-6) return Y(t); var s = dX(t); if (Math.abs(s) < 1e-6) break; t -= d / s; }
      var lo = 0, hi = 1; t = p;
      for (i = 0; i < 40; i++) { d = X(t); if (Math.abs(d - p) < 1e-6) break; if (d < p) lo = t; else hi = t; t = (lo + hi) / 2; }
      return Y(t);
    };
  };
  MW.CSS_EASE = { ease: [0.25, 0.1, 0.25, 1], easeIn: [0.42, 0, 1, 1], easeOut: [0, 0, 0.58, 1], easeInOut: [0.42, 0, 0.58, 1] };
  var defaults = {"borderSize":2,"borderRadius":20,"firstColor":"#ff00aa","secondColor":"#00FFF1","panel":"#171717","hold":6};
  var run = function (el, tl, at, o) {
      var W = el.offsetWidth, H = el.offsetHeight, b = o.borderSize, panel = document.createElement("div"); panel.className = "mw-ng-panel";
      while (el.firstChild) panel.appendChild(el.firstChild);
      el.appendChild(panel);
      el.style.borderRadius = o.borderRadius + "px"; panel.style.borderRadius = (o.borderRadius - b) + "px"; panel.style.background = o.panel;
      var grad = "linear-gradient(0deg, " + o.firstColor + ", " + o.secondColor + ")", layers = [];
      ["mw-ng-edge", "mw-ng-glow"].forEach(function (c) {
        var d = document.createElement("div"); d.className = c; d.style.top = d.style.left = -b + "px"; d.style.width = W + b * 2 + "px"; d.style.height = H + b * 2 + "px";
        d.style.borderRadius = o.borderRadius + "px"; d.style.backgroundImage = grad; if (c === "mw-ng-glow") { d.style.filter = "blur(" + W / 3 + "px)"; d.style.opacity = 0.8; }
        panel.insertBefore(d, panel.firstChild); layers.push(d);
      });
      var e = MW.bezier.apply(null, MW.CSS_EASE.ease), s = { t: 0 }, set = function () {
        var k = Math.floor(s.t / 3), f = (s.t - k * 3) / 3; if (k % 2) f = 1 - f;
        var y = 100 * e(f);
        for (var i = 0; i < layers.length; i++) layers[i].style.backgroundPosition = "center " + y + "%";
      };
      set();
      tl.fromTo(s, { t: 0 }, { t: o.hold, duration: o.hold, ease: "none", onUpdate: set, immediateRender: false }, at);
      return at + o.hold;
    };
  MW.neonGradientCard = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
</script>
