<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Typing Animation - Demo</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
:root { --bg: #09090b; --fg: #fafafa; --card: #111114; --line: #27272a; }
* { box-sizing: border-box; }
html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); }
#demo { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); color: var(--fg); font-family: Inter, sans-serif; }
.center { position: absolute; inset: 0; display: grid; place-items: center; }
.row { display: flex; align-items: center; justify-content: center; gap: 48px; }
.col { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 32px; }
.h1 { font-size: 132px; font-weight: 800; letter-spacing: -0.035em; line-height: 1.1; text-align: center; }
.h2 { font-size: 84px; font-weight: 700; letter-spacing: -0.025em; line-height: 1.15; text-align: center; }
.p { font-size: 40px; line-height: 1.4; opacity: 0.72; text-align: center; }
.card { position: relative; border-radius: 28px; background: var(--card); border: 2px solid var(--line); overflow: hidden; }
.muted { opacity: 0.6; }
.mw-typing-animation { letter-spacing: -0.02em; white-space: pre; }
.mw-typing-animation .mw-cursor { display: inline-block; }

    </style>
  </head>
  <body>
    <div id="demo" data-composition-id="mw-demo" data-start="0" data-width="1920" data-height="1080" data-duration="9">
<div class="center"><div class="col"><div class="h1"><span class="mw-typing-animation t1">Thiết kế</span></div>
<div class="h2" style="font-family:'JetBrains Mono',monospace;opacity:.7"><span class="mw-typing-animation t2">npx moworks studio</span></div></div></div>
<div hidden aria-hidden="true" data-mw-script-text>Thiết kế · Xây dựng · Ra mắt</div>
      <script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  var defaults = {"words":null,"typeSpeed":0.1,"deleteSpeed":null,"pauseDelay":1,"delay":0,"loop":false,"cycles":0,"showCursor":true,"blinkCursor":true,"cursorStyle":"line"};
  var run = function (el, tl, at, o) {
      var words = o.words || [el.textContent];
      var seg = new Intl.Segmenter("vi", { granularity: "grapheme" });
      var G = words.map(function (w) { var out = [], it = seg.segment(w.normalize("NFC"))[Symbol.iterator](), r; while (!(r = it.next()).done) out.push(r.value.segment); return out; });
      var ts = o.typeSpeed, ds = o.deleteSpeed == null ? ts / 2 : o.deleteSpeed, multi = words.length > 1;
      var count = multi ? (o.loop ? (o.cycles || words.length * 2) : words.length) : 1;
      // the schedule: [start, word, phase] with phase type / pause / delete, as upstream's state machine steps it
      var plan = [], t = o.delay;
      for (var k = 0; k < count; k++) {
        var g = G[k % G.length], last = k === count - 1;
        plan.push({ t: t, k: k, type: true }); t += g.length * ts + ts;
        if (last && !(o.loop && multi)) { plan.push({ t: t, k: k, done: true }); break; }
        if (!multi) break;
        plan.push({ t: t, k: k, pause: true }); t += o.pauseDelay;
        plan.push({ t: t, k: k, del: true }); t += g.length * ds + ds;
        if (o.delay) t += o.delay;
      }
      var end = t;
      var textEl = document.createElement("span"), cur = document.createElement("span");
      cur.className = "mw-cursor"; cur.textContent = o.cursorStyle === "block" ? "▌" : o.cursorStyle === "underscore" ? "_" : "|";
      el.textContent = ""; el.appendChild(textEl); if (o.showCursor) el.appendChild(cur);
      var s = { t: 0 };
      var draw = function () {
        var p = plan[0];
        for (var i = 0; i < plan.length; i++) if (plan[i].t <= s.t) p = plan[i];
        var g = G[p.k % G.length], n = 0, local = s.t - p.t;
        if (s.t < plan[0].t) n = 0;
        else if (p.type) n = Math.min(g.length, Math.floor(local / ts) + 1);
        else if (p.pause || p.done) n = g.length;
        else if (p.del) n = Math.max(0, g.length - Math.floor(local / ds) - 1);
        textEl.textContent = g.slice(0, n).join("");
        var hide = p.done && !o.loop;
        cur.style.opacity = hide ? 0 : !o.blinkCursor ? 1 : ((s.t % 1.2) < 0.6 ? 1 : 0);
      };
      draw();
      tl.fromTo(s, { t: 0 }, { t: end, duration: end, ease: "none", onUpdate: draw, immediateRender: false }, at);
      return at + end;
    };
  MW.typingAnimation = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
      </script>
      <script>
        (function () {
          var tl = gsap.timeline({ paused: true });
          var q = function (s) { return document.querySelector(s); }, qa = function (s) { return Array.prototype.slice.call(document.querySelectorAll(s)); };
          MW.typingAnimation(q(".t1"), tl, 0.3, { words: ["Thiết kế", "Xây dựng", "Ra mắt"], loop: true, cycles: 3, typeSpeed: 0.08, deleteSpeed: 0.05, pauseDelay: 1 });
          MW.typingAnimation(q(".t2"), tl, 0.6, { cursorStyle: "block", typeSpeed: 0.06 });
          tl.set({}, {}, 9);
          // register only when every motion is ready (MW.pending: e.g. a WebGL texture still decoding), as HyperFrames asks of async builds
          var go = function () { window.__timelines = window.__timelines || {}; window.__timelines["mw-demo"] = tl; };
          if (window.MW && MW.pending && MW.pending.length) Promise.all(MW.pending).then(go, go); else go();
        })();
      </script>
    </div>
  </body>
</html>
