<!--
  Animated Grid Pattern (Magic UI (magicuidesign), MIT, adapted).
  Source: magicuidesign/magicui at efe76fc, apps/www/registry/magicui/animated-grid-pattern.tsx.
  A line grid on which random cells softly light up and fade out, each coming back at a new spot: the familiar tech backdrop.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.animatedGridPattern(q(".mw-animated-grid-pattern"), tl, 0, { width: 64, height: 64, numSquares: 40, maxOpacity: 1, duration: 2, repeatDelay: 0.6, color: "rgba(156,163,175,0.35)", hold: 8 });

  Options (defaults in brackets):
      - width: 40
      - height: 40
      - numSquares: 50
      - maxOpacity: 0.5
      - duration: s (4)
      - repeatDelay: s (0.5)
      - color: rgba(156,163,175,0.3)
      - hold: seconds (12)
      - seed: 1

  Notes: One square's cycle: delay i x 0.1 s, fade in `duration`, hold repeatDelay, fade out `duration`, then a new cell. Upstream demo: 30 squares, maxOpacity 0.1, duration 3, repeatDelay 1, radial mask, skewY(12deg).
-->

<svg class="mw-animated-grid-pattern" aria-hidden="true"></svg>

<style>
.mw-animated-grid-pattern { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
</style>

<script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.rand = MW.rand || function (seed) {
    var a = typeof seed === "string" ? MW.hash(seed) : (seed >>> 0) || 1;
    return function () { a = (a + 0x6d2b79f5) >>> 0; var t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  };
  MW.hash = MW.hash || function (s) { var h = 2166136261; s = String(s); for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; };
  MW.bezier = MW.bezier || function (x1, y1, x2, y2) {
    var cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx, cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
    var X = function (t) { return ((ax * t + bx) * t + cx) * t; }, Y = function (t) { return ((ay * t + by) * t + cy) * t; }, dX = function (t) { return (3 * ax * t + 2 * bx) * t + cx; };
    return function (p) {
      if (p <= 0) return 0; if (p >= 1) return 1;
      var t = p, i, d;
      for (i = 0; i < 8; i++) { d = X(t) - p; if (Math.abs(d) < 1e-6) return Y(t); var s = dX(t); if (Math.abs(s) < 1e-6) break; t -= d / s; }
      var lo = 0, hi = 1; t = p;
      for (i = 0; i < 40; i++) { d = X(t); if (Math.abs(d - p) < 1e-6) break; if (d < p) lo = t; else hi = t; t = (lo + hi) / 2; }
      return Y(t);
    };
  };
  MW.CSS_EASE = { ease: [0.25, 0.1, 0.25, 1], easeIn: [0.42, 0, 1, 1], easeOut: [0, 0, 0.58, 1], easeInOut: [0.42, 0, 0.58, 1] };
  var defaults = {"width":40,"height":40,"x":-1,"y":-1,"numSquares":50,"maxOpacity":0.5,"duration":4,"repeatDelay":0.5,"color":"rgba(156,163,175,0.3)","hold":12,"seed":1};
  var run = function (el, tl, at, o) {
      var NS = "http://www.w3.org/2000/svg", id = "mw-agp-" + (MW.__agp = (MW.__agp || 0) + 1), w = o.width, h = o.height;
      var W = el.getBoundingClientRect().width, H = el.getBoundingClientRect().height;
      el.innerHTML = '<defs><pattern id="' + id + '" width="' + w + '" height="' + h + '" patternUnits="userSpaceOnUse" x="' + o.x + '" y="' + o.y + '">' +
        '<path d="M.5 ' + h + "V.5H" + w + '" fill="none" stroke="' + o.color + '"/></pattern></defs><rect width="100%" height="100%" fill="url(#' + id + ')"/>';
      var g = document.createElementNS(NS, "svg"); g.setAttribute("x", o.x); g.setAttribute("y", o.y); g.style.overflow = "visible"; el.appendChild(g);
      var ease = MW.bezier.apply(null, MW.CSS_EASE.easeInOut), sq = [];
      for (var i = 0; i < o.numSquares; i++) {
        var r = document.createElementNS(NS, "rect"); r.setAttribute("width", w - 1); r.setAttribute("height", h - 1); r.setAttribute("fill", o.color); r.setAttribute("stroke-width", "0"); g.appendChild(r);
        sq.push({ r: r, rand: MW.rand(o.seed * 7919 + i * 104729), cells: [] });
      }
      var cellOf = function (q, k) {                                   // the k-th cell of square q (seeded, cached)
        while (q.cells.length <= k) q.cells.push([Math.floor((q.rand() * W) / w), Math.floor((q.rand() * H) / h)]);
        return q.cells[k];
      };
      var s = { t: 0 };
      var set = function () {
        for (var i = 0; i < sq.length; i++) {
          var q = sq[i], P = i * 0.1 + 2 * o.duration + o.repeatDelay, k = Math.floor(s.t / P), u = s.t - k * P - i * 0.1, op = 0;
          if (u >= 0) op = u < o.duration ? o.maxOpacity * ease(u / o.duration) : u < o.duration + o.repeatDelay ? o.maxOpacity : o.maxOpacity * (1 - ease(Math.min(1, (u - o.duration - o.repeatDelay) / o.duration)));
          var c = cellOf(q, k);
          q.r.setAttribute("x", c[0] * w + 1); q.r.setAttribute("y", c[1] * h + 1); q.r.setAttribute("opacity", op);
        }
      };
      set();
      tl.fromTo(s, { t: 0 }, { t: o.hold, duration: o.hold, ease: "none", onUpdate: set, immediateRender: false }, at);
      return at + o.hold;
    };
  MW.animatedGridPattern = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
</script>
