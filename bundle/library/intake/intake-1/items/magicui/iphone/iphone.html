  A flat phone frame shaped like a recent iPhone (Dynamic Island, side buttons) with a screenshot or screen recording on its screen.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.iphone(q(".i1"), tl, 0.3, { src: "assets/screen.svg", enter: "rise" });

  Options (defaults in brackets):
      - src: screen picture
      - dark: false
      - enter: null | rise | fade
      - enterDuration: s (0.9)

  Notes: Looks like an Apple product (brand look): fine for showing an app, never to suggest Apple's endorsement. For a video put a HyperFrames <video class="clip"> inside .mw-iphone-screen.
-->

  border-radius: calc(55.75 / 389.5 * 100%) / calc(55.75 / 843.5 * 100%); }
.mw-iphone > .mw-iphone-screen > img, .mw-iphone > .mw-iphone-screen > video { display: block; width: 100%; height: 100%; object-fit: cover; object-position: top; }
.mw-iphone > svg { position: absolute; inset: 0; width: 100%; height: 100%; }
</style>
