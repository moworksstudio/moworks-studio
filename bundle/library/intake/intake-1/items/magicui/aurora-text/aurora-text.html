<!--
  Aurora Text (Magic UI (magicuidesign), MIT, adapted).
  Source: magicuidesign/magicui at efe76fc, apps/www/registry/magicui/aurora-text.tsx.
  A word filled with a 135° pink-purple-blue-sky gradient that drifts back and forth (10 s / speed, ease-in-out, alternate).

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.auroraText(q(".mw-aurora-text"), tl, 0, { speed: 2, hold: 10 });

  Options (defaults in brackets):
      - colors: list (#FF0080, #7928CA, #0070F3, #38bdf8)
      - speed: 1 (10 s per pass)
      - wobble: false
      - hold: seconds (10)

  Notes: Only the x part of background-position moves (auto height = 100 %). The wobble (rotate -5/5/-3/3 deg, scale .9/1.1/.95/1.05) is off by default because upstream's inline span never shows it.
-->

<span class="mw-aurora-text">Cực quang</span>

<style>
.mw-aurora-text { display: inline-block; padding: 0.12em 0.02em; margin: -0.12em -0.02em; color: transparent; background-size: 200% auto;
  -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
</style>

<script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.bezier = MW.bezier || function (x1, y1, x2, y2) {
    var cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx, cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
    var X = function (t) { return ((ax * t + bx) * t + cx) * t; }, Y = function (t) { return ((ay * t + by) * t + cy) * t; }, dX = function (t) { return (3 * ax * t + 2 * bx) * t + cx; };
    return function (p) {
      if (p <= 0) return 0; if (p >= 1) return 1;
      var t = p, i, d;
      for (i = 0; i < 8; i++) { d = X(t) - p; if (Math.abs(d) < 1e-6) return Y(t); var s = dX(t); if (Math.abs(s) < 1e-6) break; t -= d / s; }
      var lo = 0, hi = 1; t = p;
      for (i = 0; i < 40; i++) { d = X(t); if (Math.abs(d - p) < 1e-6) break; if (d < p) lo = t; else hi = t; t = (lo + hi) / 2; }
      return Y(t);
    };
  };
  MW.CSS_EASE = { ease: [0.25, 0.1, 0.25, 1], easeIn: [0.42, 0, 1, 1], easeOut: [0, 0, 0.58, 1], easeInOut: [0.42, 0, 0.58, 1] };
  var defaults = {"colors":["#FF0080","#7928CA","#0070F3","#38bdf8"],"speed":1,"wobble":false,"hold":10};
  var run = function (el, tl, at, o) {
      el.style.backgroundImage = "linear-gradient(135deg, " + o.colors.join(", ") + ", " + o.colors[0] + ")";
      var D = 10 / o.speed, seg = D / 4, e = MW.bezier.apply(null, MW.CSS_EASE.easeInOut);
      // keyframes [x %, y %, rotate, scale]; only x shows (auto height = 100 %), kept as written
      var K = [[0, 50, -5, 0.9], [50, 100, 5, 1.1], [100, 50, -3, 0.95], [50, 0, 3, 1.05], [0, 50, -5, 0.9]];
      var s = { t: 0 };
      var set = function () {
        var c = Math.floor(s.t / D), f = (s.t - c * D) / D;
        if (c % 2 === 1) f = 1 - f;                          // infinite alternate
        var i = Math.min(3, Math.floor(f * 4)), u = e(f * 4 - i), a = K[i], b = K[i + 1];
        el.style.backgroundPosition = (a[0] + (b[0] - a[0]) * u) + "% " + (a[1] + (b[1] - a[1]) * u) + "%";
        if (o.wobble) el.style.transform = "rotate(" + (a[2] + (b[2] - a[2]) * u) + "deg) scale(" + (a[3] + (b[3] - a[3]) * u) + ")";
      };
      set();
      tl.fromTo(s, { t: 0 }, { t: o.hold, duration: o.hold, ease: "none", onUpdate: set, immediateRender: false }, at);
      return at + o.hold;
    };
  MW.auroraText = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
</script>
