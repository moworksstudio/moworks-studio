<!--
  Flickering Grid (Magic UI (magicuidesign), MIT, adapted).
  Source: magicuidesign/magicui at efe76fc, apps/www/registry/magicui/flickering-grid.tsx.
  A grid of tiny squares whose brightness flickers at random, like a dim LED panel: a quiet tech texture under titles and UI.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.flickeringGrid(q(".mw-flickering-grid"), tl, 0, { squareSize: 8, gridGap: 8, color: "#60A5FA", maxOpacity: 0.6, flickerChance: 1.2, hold: 6 });

  Options (defaults in brackets):
      - squareSize: px (4)
      - gridGap: px (6)
      - flickerChance: per second (0.3)
      - color: rgb(0, 0, 0)
      - maxOpacity: 0.3
      - hold: seconds (10)
      - seed: 1

  Notes: el is a <canvas> sized by its box (device pixels follow window.devicePixelRatio as upstream). Docs say maxOpacity 0.2: the code has 0.3 (the code wins).
-->

<canvas class="mw-flickering-grid"></canvas>

<style>
.mw-flickering-grid { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
</style>

<script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.rand = MW.rand || function (seed) {
    var a = typeof seed === "string" ? MW.hash(seed) : (seed >>> 0) || 1;
    return function () { a = (a + 0x6d2b79f5) >>> 0; var t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  };
  MW.hash = MW.hash || function (s) { var h = 2166136261; s = String(s); for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; };
  var defaults = {"squareSize":4,"gridGap":6,"flickerChance":0.3,"color":"rgb(0, 0, 0)","maxOpacity":0.3,"hold":10,"seed":1};
  var run = function (el, tl, at, o) {
      var W = el.clientWidth, H = el.clientHeight, dpr = window.devicePixelRatio || 1, ctx = el.getContext("2d");
      el.width = W * dpr; el.height = H * dpr;
      var p = document.createElement("canvas").getContext("2d"); p.fillStyle = o.color; p.fillRect(0, 0, 1, 1);
      var px = p.getImageData(0, 0, 1, 1).data, rgba = "rgba(" + px[0] + ", " + px[1] + ", " + px[2] + ",";
      var step = o.squareSize + o.gridGap, cols = Math.ceil(W / step), rows = Math.ceil(H / step), n = cols * rows, r = MW.rand(o.seed * 6007);
      // each square: its start value, then flips at exponential gaps (rate flickerChance), each with a new value
      var times = [], vals = [];
      for (var i = 0; i < n; i++) {
        var ts = [], vs = [r() * o.maxOpacity], t = 0;
        while (true) { t += -Math.log(1 - r()) / o.flickerChance; if (t > o.hold) break; ts.push(t); vs.push(r() * o.maxOpacity); }
        times.push(ts); vals.push(vs);
      }
      var s = { t: 0 };
      var draw = function () {
        ctx.clearRect(0, 0, el.width, el.height);
        for (var c = 0; c < cols; c++) for (var j = 0; j < rows; j++) {
          var k = c * rows + j, ts = times[k], m = 0;
          while (m < ts.length && ts[m] <= s.t) m++;
          ctx.fillStyle = rgba + vals[k][m] + ")";
          ctx.fillRect(c * step * dpr, j * step * dpr, o.squareSize * dpr, o.squareSize * dpr);
        }
      };
      draw();
      tl.fromTo(s, { t: 0 }, { t: o.hold, duration: o.hold, ease: "none", onUpdate: draw, immediateRender: false }, at);
      return at + o.hold;
    };
  MW.flickeringGrid = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
</script>
