<!--
  Animated Shiny Text (Magic UI (magicuidesign), MIT, adapted).
  Source: magicuidesign/magicui at efe76fc, apps/www/registry/magicui/animated-shiny-text.tsx.
  Muted grey text with a narrow light glint (100 px) that sweeps across, waits, sweeps back, on an 8 s loop.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.animatedShinyText(q(".mw-animated-shiny-text"), tl, 0, { shimmerWidth: 220, hold: 8 });

  Options (defaults in brackets):
      - shimmerWidth: px (100)
      - period: seconds per loop (8)
      - color: text colour (rgba(163,163,163,.7))
      - shine: band colour (rgba(255,255,255,.8))
      - hold: seconds (8)

  Notes: Registry keyframe shiny-text: 0%, 90%, 100% background-position calc(-100% - width) 0; 30%, 60% calc(100% + width) 0; 8 s infinite (CSS ease per segment). Text colour neutral-400/70 on dark, neutral-600/70 on light.
-->

<span class="mw-animated-shiny-text">✨ Giới thiệu Magic UI</span>

<style>
.mw-animated-shiny-text { display: inline-block; padding: 0.12em 0; margin: -0.12em 0; color: var(--mw-st-color);
  background-image: linear-gradient(to right, transparent, var(--mw-st-shine) 50%, transparent); background-size: var(--mw-st-w, 100px) 100%;
  background-repeat: no-repeat; background-position: calc(-100% - var(--mw-st-w, 100px)) 0; -webkit-background-clip: text; background-clip: text; }
</style>

<script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.bezier = MW.bezier || function (x1, y1, x2, y2) {
    var cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx, cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
    var X = function (t) { return ((ax * t + bx) * t + cx) * t; }, Y = function (t) { return ((ay * t + by) * t + cy) * t; }, dX = function (t) { return (3 * ax * t + 2 * bx) * t + cx; };
    return function (p) {
      if (p <= 0) return 0; if (p >= 1) return 1;
      var t = p, i, d;
      for (i = 0; i < 8; i++) { d = X(t) - p; if (Math.abs(d) < 1e-6) return Y(t); var s = dX(t); if (Math.abs(s) < 1e-6) break; t -= d / s; }
      var lo = 0, hi = 1; t = p;
      for (i = 0; i < 40; i++) { d = X(t); if (Math.abs(d - p) < 1e-6) break; if (d < p) lo = t; else hi = t; t = (lo + hi) / 2; }
      return Y(t);
    };
  };
  MW.CSS_EASE = { ease: [0.25, 0.1, 0.25, 1], easeIn: [0.42, 0, 1, 1], easeOut: [0, 0, 0.58, 1], easeInOut: [0.42, 0, 0.58, 1] };
  var defaults = {"shimmerWidth":100,"period":8,"color":"rgba(163,163,163,0.7)","shine":"rgba(255,255,255,0.8)","hold":8};
  var run = function (el, tl, at, o) {
      el.style.setProperty("--mw-st-w", o.shimmerWidth + "px");
      el.style.setProperty("--mw-st-color", o.color);
      el.style.setProperty("--mw-st-shine", o.shine);
      // background-position in px: off the left (-width) to off the right (box width + width); percentages of a no-repeat layer scale with
      // (box - layer), so px keep upstream's travel exact
      var W = el.offsetWidth, w = o.shimmerWidth, off = -w - (W - w), on = (W - w) * 2 + w;
      var css = MW.bezier.apply(null, MW.CSS_EASE.ease), P = o.period;
      // the keyframe as a function of time: 0-30 % out, 30-60 % hold, 60-90 % back, 90-100 % hold
      var s = { t: 0 };
      var set = function () {
        var f = (s.t % P) / P, v;
        if (f < 0.3) v = off + (on - off) * css(f / 0.3);
        else if (f < 0.6) v = on;
        else if (f < 0.9) v = on + (off - on) * css((f - 0.6) / 0.3);
        else v = off;
        el.style.backgroundPosition = v + "px 0";
      };
      set();
      tl.fromTo(s, { t: 0 }, { t: o.hold, duration: o.hold, ease: "none", onUpdate: set, immediateRender: false }, at);
      return at + o.hold;
    };
  MW.animatedShinyText = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
</script>
