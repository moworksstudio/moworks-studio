<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Border Beam - Demo</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
:root { --bg: #09090b; --fg: #fafafa; --card: #111114; --line: #27272a; }
* { box-sizing: border-box; }
html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); }
#demo { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); color: var(--fg); font-family: Inter, sans-serif; }
.center { position: absolute; inset: 0; display: grid; place-items: center; }
.row { display: flex; align-items: center; justify-content: center; gap: 48px; }
.col { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 32px; }
.h1 { font-size: 132px; font-weight: 800; letter-spacing: -0.035em; line-height: 1.1; text-align: center; }
.h2 { font-size: 84px; font-weight: 700; letter-spacing: -0.025em; line-height: 1.15; text-align: center; }
.p { font-size: 40px; line-height: 1.4; opacity: 0.72; text-align: center; }
.card { position: relative; border-radius: 28px; background: var(--card); border: 2px solid var(--line); overflow: hidden; }
.muted { opacity: 0.6; }
.mw-border-beam { position: absolute; inset: 0; border-radius: inherit; border: var(--mw-bb-width, 1px) solid transparent; pointer-events: none;
  -webkit-mask: linear-gradient(#000 0 0) padding-box, linear-gradient(#000 0 0) border-box; -webkit-mask-composite: xor;
  mask: linear-gradient(#000 0 0) padding-box exclude, linear-gradient(#000 0 0) border-box; }
.mw-border-beam > i { position: absolute; aspect-ratio: 1; width: var(--mw-bb-size, 50px); background: linear-gradient(to left, var(--mw-bb-from), var(--mw-bb-to), transparent);
  offset-path: rect(0 auto auto 0 round var(--mw-bb-size, 50px)); offset-distance: 0%; }
.login { width: 760px; height: 560px; padding: 56px; display: flex; flex-direction: column; gap: 28px; }
.login h3 { margin: 0; font-size: 48px; font-weight: 700; } .login p { margin: 0; font-size: 26px; opacity: .6; }
.field { height: 72px; border-radius: 14px; border: 2px solid var(--line); padding: 0 24px; display: flex; align-items: center; font-size: 26px; opacity: .55; }
.btns { display: flex; justify-content: space-between; margin-top: auto; } .btn { height: 72px; padding: 0 40px; border-radius: 14px; display: flex; align-items: center; font-size: 26px; font-weight: 600; border: 2px solid var(--line); }
.btn.primary { background: var(--fg); color: var(--bg); border-color: var(--fg); }
    </style>
  </head>
  <body>
    <div id="demo" data-composition-id="mw-demo" data-start="0" data-width="1920" data-height="1080" data-duration="8">
<div class="center"><div class="card login" style="border-radius:24px">
  <h3>Đăng nhập</h3><p>Nhập thông tin để vào tài khoản của bạn.</p>
  <div class="field">Email</div><div class="field">Mật khẩu</div>
  <div class="btns"><div class="btn">Đăng ký</div><div class="btn primary">Đăng nhập</div></div>
  <div class="mw-border-beam"><i></i></div>
</div></div>
      <script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  var defaults = {"size":50,"duration":6,"delay":0,"reverse":false,"initialOffset":0,"borderWidth":1,"colorFrom":"#ffaa40","colorTo":"#9c40ff","hold":10};
  var run = function (el, tl, at, o) {
      var beam = el.querySelector("i") || el.appendChild(document.createElement("i"));
      el.style.setProperty("--mw-bb-width", o.borderWidth + "px");
      el.style.setProperty("--mw-bb-size", o.size + "px");
      el.style.setProperty("--mw-bb-from", o.colorFrom);
      el.style.setProperty("--mw-bb-to", o.colorTo);
      var a = o.reverse ? 100 - o.initialOffset : o.initialOffset, b = o.reverse ? -o.initialOffset : 100 + o.initialOffset;
      // one linear lap every `duration` s; upstream's delay advances the lap (motion's delay: -delay)
      var s = { t: 0 };
      var set = function () { var p = ((s.t + o.delay) / o.duration) % 1; beam.style.offsetDistance = (a + (b - a) * p) + "%"; };
      set();
      tl.to(s, { t: o.hold, duration: o.hold, ease: "none", onUpdate: set }, at);
      return at + o.hold;
    };
  MW.borderBeam = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
      </script>
      <script>
        (function () {
          var tl = gsap.timeline({ paused: true });
          var q = function (s) { return document.querySelector(s); }, qa = function (s) { return Array.prototype.slice.call(document.querySelectorAll(s)); };
          MW.borderBeam(q(".login .mw-border-beam"), tl, 0, { duration: 8, size: 200, borderWidth: 3, hold: 8 });
          tl.set({}, {}, 8);
          // register only when every motion is ready (MW.pending: e.g. a WebGL texture still decoding), as HyperFrames asks of async builds
          var go = function () { window.__timelines = window.__timelines || {}; window.__timelines["mw-demo"] = tl; };
          if (window.MW && MW.pending && MW.pending.length) Promise.all(MW.pending).then(go, go); else go();
        })();
      </script>
    </div>
  </body>
</html>
