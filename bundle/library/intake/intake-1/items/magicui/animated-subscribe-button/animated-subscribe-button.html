<!--
  Animated Subscribe Button (Magic UI (magicuidesign), MIT, adapted).
  Source: magicuidesign/magicui at efe76fc, apps/www/registry/magicui/animated-subscribe-button.tsx.
  A button that swaps from its first label to its second when pressed: the old label slips right, the button cross-fades, the new label drops in from above.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.animatedSubscribeButton(q(".mw-animated-subscribe-button"), tl, 1, { clicks: [0, 2.2] });

  Options (defaults in brackets):
      - clicks: [0]

  Notes: el holds two <span> labels (first: before, second: after), as upstream requires. clicks: [t, ...] in s after `at`; each click toggles.
-->

<div class="mw-animated-subscribe-button"><span>Đăng ký</span><span>Đã đăng ký ✓</span></div>

<style>
.mw-animated-subscribe-button { position: relative; display: inline-flex; }
.mw-animated-subscribe-button > .mw-asb { position: relative; display: flex; height: 40px; width: fit-content; align-items: center; justify-content: center; overflow: hidden; border-radius: 8px; padding: 0 24px; font-weight: 600; }
.mw-animated-subscribe-button > .mw-asb + .mw-asb { position: absolute; left: 0; top: 0; }
.mw-animated-subscribe-button .mw-asb > span { position: relative; display: flex; align-items: center; justify-content: center; }
</style>

<script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };

    var X = function (t) { return ((ax * t + bx) * t + cx) * t; }, Y = function (t) { return ((ay * t + by) * t + cy) * t; }, dX = function (t) { return (3 * ax * t + 2 * bx) * t + cx; };
    return function (p) {
      if (p <= 0) return 0; if (p >= 1) return 1;
      var t = p, i, d;
      for (i = 0; i < 8; i++) { d = X(t) - p; if (Math.abs(d) < 1e-6) return Y(t); var s = dX(t); if (Math.abs(s) < 1e-6) break; t -= d / s; }
      var lo = 0, hi = 1; t = p;
      for (i = 0; i < 40; i++) { d = X(t); if (Math.abs(d - p) < 1e-6) break; if (d < p) lo = t; else hi = t; t = (lo + hi) / 2; }
      return Y(t);
    };
  };
  MW.CSS_EASE = { ease: [0.25, 0.1, 0.25, 1], easeIn: [0.42, 0, 1, 1], easeOut: [0, 0, 0.58, 1], easeInOut: [0.42, 0, 0.58, 1] };
  MW.spring = MW.spring || function (stiffness, damping, mass, from, to) {
    var k = stiffness || 100, c = damping == null ? 10 : damping, m = mass || 1, w0 = Math.sqrt(k / m), z = c / (2 * Math.sqrt(k * m));
    var x = function (t) {
      if (z < 1) { var wd = w0 * Math.sqrt(1 - z * z); return 1 - Math.exp(-z * w0 * t) * (Math.cos(wd * t) + (z * w0 / wd) * Math.sin(wd * t)); }
      if (z === 1) return 1 - Math.exp(-w0 * t) * (1 + w0 * t);
      var q = Math.sqrt(z * z - 1), r1 = -w0 * (z - q), r2 = -w0 * (z + q), A = r2 / (r2 - r1), B = -r1 / (r2 - r1);
      return 1 - (A * Math.exp(r1 * t) + B * Math.exp(r2 * t));
    };
    var T = 0, dt = 1 / 240; for (var t = 0; t < 30; t += dt) if (Math.abs(1 - x(t)) > 0.001) T = t;
    T = Math.max(dt, T + dt);
    return { duration: T, ease: function (p) { return p >= 1 ? 1 : x(p * T); }, at: x };
  };
  MW.springDB = MW.springDB || function (duration, bounce) {
    var z = 1 - (bounce == null ? 0.25 : bounce), w = Math.log(1000) / (Math.max(0.05, z) * (duration || 0.8));
    return MW.spring(w * w, 2 * z * w, 1);
  };
  var defaults = {"clicks":[0]};
  var run = function (el, tl, at, o) {
      var spans = el.querySelectorAll(":scope > span"), b = [];

      var sp = MW.spring(500, 25, 1), fade = MW.bezier(0.25, 0.1, 0.35, 1);
      gsap.set(b[1], { opacity: 0 });
      var state = 0, t = at;
      o.clicks.forEach(function (c) {
        var from = b[state], to = b[1 - state], t0 = at + c;

        tl.fromTo(from, { opacity: 1 }, { opacity: 0, duration: 0.3, ease: fade, immediateRender: false }, t0);
        tl.fromTo(to, { opacity: 0 }, { opacity: 1, duration: 0.3, ease: fade, immediateRender: false }, t0 + 0.3);
        tl.fromTo(to.firstChild, { y: -50, x: 0 }, { y: 0, duration: sp.duration, ease: sp.ease, immediateRender: false }, t0 + 0.3);
        state = 1 - state; t = t0 + 0.3 + sp.duration;
      });
      return t;
    };
  MW.animatedSubscribeButton = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
</script>
