<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Text Animate - Demo</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
:root { --bg: #09090b; --fg: #fafafa; --card: #111114; --line: #27272a; }
* { box-sizing: border-box; }
html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); }
#demo { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); color: var(--fg); font-family: Inter, sans-serif; }
.center { position: absolute; inset: 0; display: grid; place-items: center; }
.row { display: flex; align-items: center; justify-content: center; gap: 48px; }
.col { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 32px; }
.h1 { font-size: 132px; font-weight: 800; letter-spacing: -0.035em; line-height: 1.1; text-align: center; }
.h2 { font-size: 84px; font-weight: 700; letter-spacing: -0.025em; line-height: 1.15; text-align: center; }
.p { font-size: 40px; line-height: 1.4; opacity: 0.72; text-align: center; }
.card { position: relative; border-radius: 28px; background: var(--card); border: 2px solid var(--line); overflow: hidden; }
.muted { opacity: 0.6; }
.mw-text-animate { white-space: pre-wrap; }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 70px 140px; width: 1640px; } .grid .h2 { font-size: 78px; text-align: left; }
.grid small { display: block; font-size: 26px; opacity: .45; font-family: 'JetBrains Mono', monospace; margin-bottom: 10px; }
    </style>
  </head>
  <body>
    <div id="demo" data-composition-id="mw-demo" data-start="0" data-width="1920" data-height="1080" data-duration="7">
<div class="center"><div class="grid">
  <div><small>blurInUp · character</small><div class="h2 mw-text-animate a1">Mờ rồi rõ dần</div></div>
  <div><small>slideLeft · word</small><div class="h2 mw-text-animate a2">Trượt vào từ phải</div></div>
  <div><small>scaleUp · word</small><div class="h2 mw-text-animate a3">Bật lên nảy nhẹ</div></div>
  <div><small>fadeIn · line</small><div class="h2 mw-text-animate a4">Từng dòng<br>hiện lên</div></div>
</div></div>
      <script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.split = MW.split || function (el, mode) {
    el = MW.el(el);
    if (el.__mwSplit) return el.__mwSplit;
    var seg = typeof Intl !== "undefined" && Intl.Segmenter ? new Intl.Segmenter("vi", { granularity: "grapheme" }) : null;
    var graphemes = function (s) { if (seg) { var out = []; var it = seg.segment(s)[Symbol.iterator](), r; while (!(r = it.next()).done) out.push(r.value.segment); return out; } return Array.from(s); };
    var res = { chars: [], words: [], lines: [] };
    var walk = function (node) {
      var kids = Array.prototype.slice.call(node.childNodes);
      for (var k = 0; k < kids.length; k++) {
        var n = kids[k];
        if (n.nodeType === 1) { if (n.tagName === "BR") continue; walk(n); continue; }
        if (n.nodeType !== 3) continue;
        var text = n.nodeValue.normalize("NFC"), frag = document.createDocumentFragment();
        var parts = text.split(/(\s+)/);
        for (var p = 0; p < parts.length; p++) {
          var part = parts[p];
          if (!part) continue;
          if (/^\s+$/.test(part)) { frag.appendChild(document.createTextNode(part)); continue; }
          var w = document.createElement("span");
          w.className = "mw-w"; w.style.display = "inline-block"; w.style.whiteSpace = "nowrap";
          if (mode === "words") w.textContent = part;
          else { var gs = graphemes(part); for (var g = 0; g < gs.length; g++) { var c = document.createElement("span"); c.className = "mw-ch"; c.style.display = "inline-block"; c.textContent = gs[g]; w.appendChild(c); res.chars.push(c); } }
          res.words.push(w); frag.appendChild(w);
        }
        node.replaceChild(frag, n);
      }
    };
    walk(el);
    var top = null, line = null;
    for (var i = 0; i < res.words.length; i++) { var y = res.words[i].offsetTop; if (top === null || Math.abs(y - top) > 2) { top = y; line = []; res.lines.push(line); } line.push(res.words[i]); }
    el.__mwSplit = res;
    return res;
  };
  MW.bezier = MW.bezier || function (x1, y1, x2, y2) {
    var cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx, cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
    var X = function (t) { return ((ax * t + bx) * t + cx) * t; }, Y = function (t) { return ((ay * t + by) * t + cy) * t; }, dX = function (t) { return (3 * ax * t + 2 * bx) * t + cx; };
    return function (p) {
      if (p <= 0) return 0; if (p >= 1) return 1;
      var t = p, i, d;
      for (i = 0; i < 8; i++) { d = X(t) - p; if (Math.abs(d) < 1e-6) return Y(t); var s = dX(t); if (Math.abs(s) < 1e-6) break; t -= d / s; }
      var lo = 0, hi = 1; t = p;
      for (i = 0; i < 40; i++) { d = X(t); if (Math.abs(d - p) < 1e-6) break; if (d < p) lo = t; else hi = t; t = (lo + hi) / 2; }
      return Y(t);
    };
  };
  MW.CSS_EASE = { ease: [0.25, 0.1, 0.25, 1], easeIn: [0.42, 0, 1, 1], easeOut: [0, 0, 0.58, 1], easeInOut: [0.42, 0, 0.58, 1] };
  MW.spring = MW.spring || function (stiffness, damping, mass, from, to) {
    var k = stiffness || 100, c = damping == null ? 10 : damping, m = mass || 1, w0 = Math.sqrt(k / m), z = c / (2 * Math.sqrt(k * m));
    var x = function (t) {
      if (z < 1) { var wd = w0 * Math.sqrt(1 - z * z); return 1 - Math.exp(-z * w0 * t) * (Math.cos(wd * t) + (z * w0 / wd) * Math.sin(wd * t)); }
      if (z === 1) return 1 - Math.exp(-w0 * t) * (1 + w0 * t);
      var q = Math.sqrt(z * z - 1), r1 = -w0 * (z - q), r2 = -w0 * (z + q), A = r2 / (r2 - r1), B = -r1 / (r2 - r1);
      return 1 - (A * Math.exp(r1 * t) + B * Math.exp(r2 * t));
    };
    var T = 0, dt = 1 / 240; for (var t = 0; t < 30; t += dt) if (Math.abs(1 - x(t)) > 0.001) T = t;
    T = Math.max(dt, T + dt);
    return { duration: T, ease: function (p) { return p >= 1 ? 1 : x(p * T); }, at: x };
  };
  MW.springDB = MW.springDB || function (duration, bounce) {
    var z = 1 - (bounce == null ? 0.25 : bounce), w = Math.log(1000) / (Math.max(0.05, z) * (duration || 0.8));
    return MW.spring(w * w, 2 * z * w, 1);
  };
  var defaults = {"animation":"fadeIn","by":"word","duration":0.3,"delay":0,"exit":false,"hold":0.6};
  var run = function (el, tl, at, o) {
      var V = {
        fadeIn: [{ opacity: 0, y: 20 }, { y: 20 }], blurIn: [{ opacity: 0, filter: "blur(10px)" }, { filter: "blur(10px)" }],
        blurInUp: [{ opacity: 0, filter: "blur(10px)", y: 20 }, { filter: "blur(10px)", y: 20 }], blurInDown: [{ opacity: 0, filter: "blur(10px)", y: -20 }, { filter: "blur(10px)", y: -20 }],
        slideUp: [{ y: 20, opacity: 0 }, { y: -20 }], slideDown: [{ y: -20, opacity: 0 }, { y: 20 }], slideLeft: [{ x: 20, opacity: 0 }, { x: -20 }],
        slideRight: [{ x: -20, opacity: 0 }, { x: 20 }], scaleUp: [{ scale: 0.5, opacity: 0 }, { scale: 0.5 }], scaleDown: [{ scale: 1.5, opacity: 0 }, { scale: 1.5 }],
      };
      var v = V[o.animation] || V.fadeIn, ease = MW.bezier.apply(null, MW.CSS_EASE.easeInOut);
      var parts;
      if (o.by === "text") parts = [el];
      else if (o.by === "line") {
        // lines as laid out (a <br> ends a line too), each wrapped in a block span
        var brs = Array.prototype.slice.call(el.querySelectorAll("br"));
        brs.forEach(function (b) { b.insertAdjacentText("afterend", " "); });
        var lines = MW.split(el, "words").lines;
        brs.forEach(function (b) { b.remove(); });
        parts = lines.map(function (ws) {
          var box = document.createElement("span"); box.style.display = "block"; ws[0].parentNode.insertBefore(box, ws[0]);
          ws.forEach(function (w, i) { box.appendChild(w); if (i < ws.length - 1) box.appendChild(document.createTextNode(" ")); });
          return box;
        });
      }
      else parts = MW.split(el, o.by === "character" ? "chars" : "words")[o.by === "character" ? "chars" : "words"];
      var each = o.duration / parts.length, spring = MW.spring(300, 15, 1);
      var hidden = v[0];
      parts.forEach(function (p, i) {
        var t = at + o.delay + i * each;
        var to = { opacity: 1, duration: 0.3, ease: ease, immediateRender: true };
        if (/blurIn(Up|Down)/.test(o.animation)) { to.duration = 0.4; tl.fromTo(p, { y: hidden.y }, { y: 0, duration: 0.3, ease: ease, immediateRender: true }, t); tl.fromTo(p, { filter: hidden.filter }, { filter: "blur(0px)", duration: 0.3, ease: ease, immediateRender: true }, t); tl.fromTo(p, { opacity: 0 }, to, t); return; }
        if (/^scale/.test(o.animation)) { tl.fromTo(p, { scale: hidden.scale }, { scale: 1, duration: spring.duration, ease: spring.ease, immediateRender: true }, t); tl.fromTo(p, { opacity: 0 }, to, t); return; }
        var from = {}, k;
        for (k in hidden) from[k] = hidden[k];
        for (k in hidden) if (k !== "opacity") to[k] = k === "filter" ? "blur(0px)" : 0;
        tl.fromTo(p, from, to, t);
      });
      var end = at + o.delay + (parts.length - 1) * each + 0.4;
      if (o.exit) {
        var ex = v[1];
        parts.slice().reverse().forEach(function (p, i) { var to = { opacity: 0, duration: 0.3, ease: ease }; for (var k in ex) to[k] = ex[k]; tl.to(p, to, end + o.hold + i * each); });
        end += o.hold + parts.length * each + 0.3;
      }
      return end;
    };
  MW.textAnimate = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
      </script>
      <script>
        (function () {
          var tl = gsap.timeline({ paused: true });
          var q = function (s) { return document.querySelector(s); }, qa = function (s) { return Array.prototype.slice.call(document.querySelectorAll(s)); };
          var HOLD = 2.4;
          MW.textAnimate(q(".a1"), tl, 0.3, { animation: "blurInUp", by: "character", duration: 0.9, exit: true, hold: HOLD });
          MW.textAnimate(q(".a2"), tl, 0.9, { animation: "slideLeft", by: "word", duration: 0.5, exit: true, hold: HOLD - 0.4 });
          MW.textAnimate(q(".a3"), tl, 1.5, { animation: "scaleUp", by: "word", duration: 0.5, exit: true, hold: HOLD - 0.8 });
          MW.textAnimate(q(".a4"), tl, 2.1, { animation: "fadeIn", by: "line", duration: 0.4, exit: true, hold: HOLD - 1.2 });
          tl.set({}, {}, 7);
          // register only when every motion is ready (MW.pending: e.g. a WebGL texture still decoding), as HyperFrames asks of async builds
          var go = function () { window.__timelines = window.__timelines || {}; window.__timelines["mw-demo"] = tl; };
          if (window.MW && MW.pending && MW.pending.length) Promise.all(MW.pending).then(go, go); else go();
        })();
      </script>
    </div>
  </body>
</html>
