  Error Shake (Moworks Studio, the studio's own, written here).
  Source: Moworks Studio.
  Bấm OK với mật khẩu sai, ô nhập rung ngang ±9 px tắt dần trong khoảng nửa giây, viền chuyển màu lỗi và dòng báo lỗi hiện bên dưới.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.motionMoworksErrorShake(q(".es-f"), tl, 0, { cursor: ".ui-cursor" });

  Options (defaults in brackets):
      - press: s the OK is clicked (0.55)
      - amp: px (36)
      - freq: rad/s (44)
      - decay: (6)
      - clearAt: s the error clears (2.25)
      - accent: error colour
      - error: the error line
      - button: the button clicked
      - cursor: an optional cursor that makes the clicks
      - approach: [x, y] px the cursor comes from
      - lead: s it arrives before a click

  Notes: Password field 140x40 r10 (six dots) with an OK pill. Click at 0.55 s; from 0.65 s x = 9 × e^(−6 t) × sin(44 t) px, faded to 0 between 0.45-0.6 s (always lands at 0). Error border (accent 2 px) and an error line below fade in over 0.63-0.7 s, out at 2.25-2.5 s. Params: at · amp (9 px) · freq (44 rad/s) · decay (6) · duration (0.6 s). x = amp × e^(−decay t) × sin(freq t) from 0.1 s after the click, faded to 0 between 0.45 and 0.6 s, so it always lands at 0.
-->
