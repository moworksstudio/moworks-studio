<!--
  Mosaic Flip (Moworks Studio, the studio's own, written here).
  Source: Moworks Studio.
  Hình được chia 4 × 4 ô, từng ô lật quanh trục dọc theo làn sóng chéo từ góc trên trái, mặt sau là phần của hình kế tiếp.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.effectMosaicFlip(q(".mf"), tl, 0.3, { backAt: 1.9 });

  Options (defaults in brackets):
      - grid: (4)
      - stagger: s per diagonal step (0.114)
      - duration: s per tile (0.45, ease-in-out cubic)
      - perspective: px (1600)
      - a: background of the first picture
      - b: background of the next
      - backAt: s after the start for the return wave (null)

  Notes: 4 x 4 tiles, each with face A (part of the current picture) and face B (part of the next). Tile (row r, col c) starts at (r + c) x 114 ms, rotateY 0 -> 180 deg over 450 ms easeInOutCubic about its centre; swap faces at 90 deg (never show a back face), lift scaleY 1 + 0.08 x sin(angle). Diagonal wave top-left to bottom-right, ~1.15 s. Return wave reversed, 40 ms apart, 350 ms per tile. Params: grid (4 × 4) · stagger chéo (114 ms) · duration mỗi ô (0.45 s) · faceA / faceB. Faces swap at 90°, so no back face shows; the wave runs from the top left to the bottom right.
-->

<div class="st"><div class="mf"></div></div>

<style>

</style>

<script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.drive = MW.drive || function (tl, at, dur, fn) {
    var s = { t: 0 }; fn(0);
    tl.fromTo(s, { t: 0 }, { t: dur, duration: dur, ease: "none", immediateRender: false, onUpdate: function () { fn(s.t); } }, at);
    return at + dur;
  };
  var defaults = {"grid":4,"stagger":0.114,"duration":0.45,"perspective":1600,"a":"url(assets/pic.svg)","b":"url(assets/pic2.svg)","backAt":null};
  var run = function (el, tl, at, o) {
        var N = o.grid, W = el.offsetWidth, Hh = el.offsetHeight, tw = W / N, th = Hh / N, io = gsap.parseEase("power2.inOut"), T = [];
        if (getComputedStyle(el).position === "static") el.style.position = "relative";
        for (var i = 0; i < N * N; i++) { var rr = Math.floor(i / N), cc = i % N, d = document.createElement("div"), fa = document.createElement("div"), fb = document.createElement("div");
          d.style.cssText = "position:absolute;left:" + cc * tw + "px;top:" + rr * th + "px;width:" + (tw + 0.5) + "px;height:" + (th + 0.5) + "px;";
          [[fa, o.a], [fb, o.b]].forEach(function (q) { q[0].style.cssText = "position:absolute;inset:0;background:" + q[1] + ";background-size:" + W + "px " + Hh + "px;background-position:" + (-cc * tw) + "px " + (-rr * th) + "px;"; d.appendChild(q[0]); }); el.appendChild(d); T.push({ d: d, a: fa, b: fb, w: rr + cc, k: i }); }
        var out = (2 * N - 2) * o.stagger + o.duration;
        return MW.drive(tl, at, o.backAt == null ? out : o.backAt + (N * N - 1) * 0.04 + 0.35, function (t) {
          T.forEach(function (q) { var A = 180 * io(Math.max(0, Math.min(1, (t - q.w * o.stagger) / o.duration))); if (o.backAt != null && t > o.backAt) A = 180 * (1 - io(Math.max(0, Math.min(1, (t - o.backAt - (N * N - 1 - q.k) * 0.04) / 0.35))));
            var face = A > 90; gsap.set(q.d, { rotationY: face ? A - 180 : A, scaleY: 1 + 0.08 * Math.sin(A * Math.PI / 180), transformPerspective: o.perspective }); q.a.style.visibility = face ? "hidden" : "visible"; q.b.style.visibility = face ? "visible" : "hidden"; });
        });
      };
  MW.effectMosaicFlip = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
</script>
