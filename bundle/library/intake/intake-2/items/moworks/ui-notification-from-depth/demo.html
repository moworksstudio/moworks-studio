<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Z-axis Notification - Demo</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
:root { --bg: #09090b; --fg: #fafafa; --card: #111114; --line: #27272a; }
* { box-sizing: border-box; }
html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); }
#demo { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); color: var(--fg); font-family: Inter, sans-serif; }
.center { position: absolute; inset: 0; display: grid; place-items: center; }
.row { display: flex; align-items: center; justify-content: center; gap: 48px; }
.col { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 32px; }
.h1 { font-size: 132px; font-weight: 800; letter-spacing: -0.035em; line-height: 1.1; text-align: center; }
.h2 { font-size: 84px; font-weight: 700; letter-spacing: -0.025em; line-height: 1.15; text-align: center; }
.p { font-size: 40px; line-height: 1.4; opacity: 0.72; text-align: center; }
.card { position: relative; border-radius: 28px; background: var(--card); border: 2px solid var(--line); overflow: hidden; }
.muted { opacity: 0.6; }

#demo { background: radial-gradient(100% 100% at 50% 40%, #1a1f33, #0b0d12); color: #e8ebf3; font-family: Inter, sans-serif; } .gm { position: absolute; inset: 0; }
.ui-cursor { position: absolute; left: 0; top: 0; z-index: 20; filter: drop-shadow(0 6px 10px rgba(0, 0, 0, 0.5)); }
.app { position: absolute; inset: 110px 260px; border-radius: 40px; background: #151a28; border: 3px solid #262c3a; padding: 60px; box-sizing: border-box; }
.app .r { height: 70px; border-radius: 18px; background: #1b2130; margin-bottom: 26px; } .nt { position: absolute; left: 50%; top: 170px; width: 900px; height: 230px; margin-left: -450px; border-radius: 56px; background: #f2f3f8; color: #151a28;
  display: flex; align-items: center; gap: 40px; padding: 0 60px; box-sizing: border-box; box-shadow: 0 40px 100px rgba(0,0,0,0.5); opacity: 0; }
.nt .ck { width: 120px; height: 120px; border-radius: 50%; background: #8b7bff; flex: none; position: relative; } .nt .ck::after { content: ""; position: absolute; left: 44px; top: 24px; width: 26px; height: 52px; border: solid #fff; border-width: 0 12px 12px 0; transform: rotate(45deg); }
.nt b { display: block; font-size: 48px; } .nt span { font-size: 32px; color: #5a6275; }
    </style>
  </head>
  <body>
    <div id="demo" data-composition-id="mw-demo" data-start="0" data-width="1920" data-height="1080" data-duration="3.6">
<div class="gm"><div class="app"><div class="r" style="width:60%"></div><div class="r"></div><div class="r"></div><div class="r" style="width:80%"></div><div class="r"></div></div>
<div class="nt"><div class="ck"></div><div><b>Đã xuất video</b><span>Phim của bạn đã sẵn sàng</span></div></div></div>
      <script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.spring = MW.spring || function (stiffness, damping, mass, from, to) {
    var k = stiffness || 100, c = damping == null ? 10 : damping, m = mass || 1, w0 = Math.sqrt(k / m), z = c / (2 * Math.sqrt(k * m));
    var x = function (t) {
      if (z < 1) { var wd = w0 * Math.sqrt(1 - z * z); return 1 - Math.exp(-z * w0 * t) * (Math.cos(wd * t) + (z * w0 / wd) * Math.sin(wd * t)); }
      if (z === 1) return 1 - Math.exp(-w0 * t) * (1 + w0 * t);
      var q = Math.sqrt(z * z - 1), r1 = -w0 * (z - q), r2 = -w0 * (z + q), A = r2 / (r2 - r1), B = -r1 / (r2 - r1);
      return 1 - (A * Math.exp(r1 * t) + B * Math.exp(r2 * t));
    };
    var T = 0, dt = 1 / 240; for (var t = 0; t < 30; t += dt) if (Math.abs(1 - x(t)) > 0.001) T = t;
    T = Math.max(dt, T + dt);
    return { duration: T, ease: function (p) { return p >= 1 ? 1 : x(p * T); }, at: x };
  };
  MW.springDB = MW.springDB || function (duration, bounce) {
    var z = 1 - (bounce == null ? 0.25 : bounce), w = Math.log(1000) / (Math.max(0.05, z) * (duration || 0.8));
    return MW.spring(w * w, 2 * z * w, 1);
  };
  MW.drive = MW.drive || function (tl, at, dur, fn) {
    var s = { t: 0 }; fn(0);
    tl.fromTo(s, { t: 0 }, { t: dur, duration: dur, ease: "none", immediateRender: false, onUpdate: function () { fn(s.t); } }, at);
    return at + dur;
  };
  var defaults = {"depth":400,"at":0.4,"exitAt":3,"behind":null,"dim":0.35};
  var run = function (el, tl, at, o) {
        var sp = MW.spring(200, 15), inn = gsap.parseEase("power2.in"), app = o.behind ? MW.el(o.behind) : null;
        return MW.drive(tl, at, o.exitAt + 0.3, function (t) {
          var x = t < o.at ? 0 : sp.at(t - o.at), z = o.depth * (1 - x);
          if (t > o.exitAt) z = o.depth * inn(Math.min(1, (t - o.exitAt) / 0.3));
          var s = 360 / (360 + z), a = t < o.at ? 0 : t > o.exitAt ? 1 - inn(Math.min(1, (t - o.exitAt) / 0.3)) : Math.min(1, 1.6 * x);
          gsap.set(el, { scale: s }); el.style.opacity = String(a);
          if (app) { var d = Math.min(1, Math.max(0, x)) * (t > o.exitAt ? 1 - Math.min(1, (t - o.exitAt) / 0.3) : 1); gsap.set(app, { scale: 1 - 0.03 * d }); app.style.filter = d > 0.01 ? "brightness(" + (1 - o.dim * d) + ")" : ""; }
        });
      };
  MW.uiNotificationFromDepth = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
      </script>
      <script>
        (function () {
          var tl = gsap.timeline({ paused: true });
          var q = function (s) { return document.querySelector(s); }, qa = function (s) { return Array.prototype.slice.call(document.querySelectorAll(s)); };
          MW.uiNotificationFromDepth(q(".nt"), tl, 0, { behind: ".app" });
          tl.set({}, {}, 3.6);
          // register only when every motion is ready (MW.pending: e.g. a WebGL texture still decoding), as HyperFrames asks of async builds
          var go = function () { window.__timelines = window.__timelines || {}; window.__timelines["mw-demo"] = tl; };
          if (window.MW && MW.pending && MW.pending.length) Promise.all(MW.pending).then(go, go); else go();
        })();
      </script>
    </div>
  </body>
</html>
