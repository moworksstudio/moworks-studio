<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Particle Text - Demo</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
:root { --bg: #09090b; --fg: #fafafa; --card: #111114; --line: #27272a; }
* { box-sizing: border-box; }
html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); }
#demo { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); color: var(--fg); font-family: Inter, sans-serif; }
.center { position: absolute; inset: 0; display: grid; place-items: center; }
.row { display: flex; align-items: center; justify-content: center; gap: 48px; }
.col { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 32px; }
.h1 { font-size: 132px; font-weight: 800; letter-spacing: -0.035em; line-height: 1.1; text-align: center; }
.h2 { font-size: 84px; font-weight: 700; letter-spacing: -0.025em; line-height: 1.15; text-align: center; }
.p { font-size: 40px; line-height: 1.4; opacity: 0.72; text-align: center; }
.card { position: relative; border-radius: 28px; background: var(--card); border: 2px solid var(--line); overflow: hidden; }
.muted { opacity: 0.6; }

#demo { background: radial-gradient(100% 100% at 50% 45%, #1a1f33, #0b0d12); } .pg { position: absolute; inset: 0; }
    </style>
  </head>
  <body>
    <div id="demo" data-composition-id="mw-demo" data-start="0" data-width="1920" data-height="1080" data-duration="5.4">
<div class="pg"></div>
      <script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.rand = MW.rand || function (seed) {
    var a = typeof seed === "string" ? MW.hash(seed) : (seed >>> 0) || 1;
    return function () { a = (a + 0x6d2b79f5) >>> 0; var t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  };
  MW.hash = MW.hash || function (s) { var h = 2166136261; s = String(s); for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; };
  MW.drive = MW.drive || function (tl, at, dur, fn) {
    var s = { t: 0 }; fn(0);
    tl.fromTo(s, { t: 0 }, { t: dur, duration: dur, ease: "none", immediateRender: false, onUpdate: function () { fn(s.t); } }, at);
    return at + dur;
  };
  MW.canvas = MW.canvas || function (host, w, h) {
    host = MW.el(host);
    var cv = document.createElement("canvas"); w = w || host.clientWidth || 1920; h = h || host.clientHeight || 1080;
    cv.width = w; cv.height = h; cv.style.position = "absolute"; cv.style.left = "0"; cv.style.top = "0"; cv.style.width = w + "px"; cv.style.height = h + "px"; cv.style.pointerEvents = "none";
    host.appendChild(cv);
    return { cv: cv, ctx: cv.getContext("2d"), w: w, h: h };
  };
  var defaults = {"text":"HẠT","size":420,"step":12,"radius":152,"push":136,"omega":10,"zeta":0.45,"color":"#e8ebf3","accent":"#a99bff","loop":5.4,"seed":2};
  var run = function (el, tl, at, o) {
        var cv = MW.canvas(el), c = cv.ctx, r = MW.rand(o.seed), pts = [], ex = gsap.parseEase("expo.out"), pi = gsap.parseEase("power2.in"), om = o.omega, z = o.zeta;
        var sample = function () {
          var off = document.createElement("canvas"); off.width = cv.w; off.height = cv.h; var x = off.getContext("2d"); x.font = "900 " + o.size + "px Inter, sans-serif"; x.textAlign = "center"; x.textBaseline = "middle"; x.fillStyle = "#000"; x.fillText(o.text, cv.w / 2, cv.h / 2);
          var d = x.getImageData(0, 0, cv.w, cv.h).data;
          for (var yy = 0, row = 0; yy < cv.h; yy += o.step, row++) for (var xx = (row % 2) * o.step / 2; xx < cv.w; xx += o.step) if (d[(Math.floor(yy) * cv.w + Math.floor(xx)) * 4 + 3] > 128) pts.push({ x: xx, y: yy, sx: r() * cv.w, sy: r() * cv.h, t0: 0.2 + 0.35 * r(), ex: 4.55 + 0.25 * r(), n: r() * 6.28 });
        };
        MW.pending = MW.pending || []; MW.pending.push(document.fonts && document.fonts.load ? document.fonts.load("900 " + o.size + "px Inter").then(sample, sample) : Promise.resolve(sample()));
        var cur = function (t) { var u = Math.max(0, Math.min(1, (t - 1.9) / 1.7)); return [cv.w + 100 - (cv.w + 200) * u, cv.h / 2 + 120 * Math.sin(u * 6)]; };
        return MW.drive(tl, at, o.loop, function (t) {
          c.clearRect(0, 0, cv.w, cv.h);
          pts.forEach(function (p) {
            var g = ex(Math.max(0, Math.min(1, (t - p.t0) / 0.9))), out = pi(Math.max(0, Math.min(1, (t - p.ex) / 0.6))), x = p.sx + (p.x - p.sx) * g, y = p.sy + (p.y - p.sy) * g, push = 0, ang = 0;
            if (t > 1.9 && t < 4.2) { var s = 1.9, dx = 0, v = 0, dt = 1 / 60; for (; s < t; s += dt) { var cc = cur(s), dd = Math.hypot(p.x - cc[0], p.y - cc[1]), target = dd < o.radius ? Math.min(o.push, o.push * Math.pow(1 - dd / o.radius, 2) * 3) : 0; var a = om * om * (target - dx) - 2 * z * om * v; v += a * dt; dx += v * dt; } var c2 = cur(t); ang = Math.atan2(p.y - c2[1], p.x - c2[0]); push = dx; }
            x += Math.cos(ang) * push + 1.6 * Math.sin(t * 3 + p.n); y += Math.sin(ang) * push + 1.6 * Math.cos(t * 3 + p.n);
            x = x + (p.sx - x) * out; y = y + (p.sy - y) * out;
            c.globalAlpha = 0.35 + 0.65 * g; c.fillStyle = push > 4 ? o.accent : o.color; c.fillRect(x - 4, y - 4, 8, 8);
          });
          c.globalAlpha = 1; if (t > 1.9 && t < 3.6) { var p2 = cur(t); c.save(); c.translate(p2[0], p2[1]); c.scale(4, 4); c.beginPath(); c.moveTo(0, 0); c.lineTo(0, 16); c.lineTo(4, 12.5); c.lineTo(6.5, 18); c.lineTo(9, 17); c.lineTo(6.5, 11.5); c.lineTo(11.5, 11.5); c.closePath(); c.fillStyle = "#fff"; c.fill(); c.restore(); }
        });
      };
  MW.textParticleGather = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
      </script>
      <script>
        (function () {
          var tl = gsap.timeline({ paused: true });
          var q = function (s) { return document.querySelector(s); }, qa = function (s) { return Array.prototype.slice.call(document.querySelectorAll(s)); };
          MW.textParticleGather(q(".pg"), tl, 0, {});
          tl.set({}, {}, 5.4);
          // register only when every motion is ready (MW.pending: e.g. a WebGL texture still decoding), as HyperFrames asks of async builds
          var go = function () { window.__timelines = window.__timelines || {}; window.__timelines["mw-demo"] = tl; };
          if (window.MW && MW.pending && MW.pending.length) Promise.all(MW.pending).then(go, go); else go();
        })();
      </script>
    </div>
  </body>
</html>
