<!--
  Summed Springs (Retarget) (Moworks Studio, the studio's own, written here).
  Source: Moworks Studio.
  Khối đổi đích nhiều lần giữa chừng mà không khựng, mỗi lần đổi cộng thêm một lò xo nên luôn liền mạch.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.motionSpringRetarget(q(".rt"), tl, 0, { markers: ".rt-m" });

  Options (defaults in brackets):
      - keys: [[s, px], ...]: each change adds a spring, so it never restarts
      - stiffness: (170)
      - damping: (20)
      - markers: elements that light as each target activates
      - duration: s (3)

  Notes: Square x retargets at 0.3 / 0.75 / 1.3 / 2.2 s (from 50 to 250 → 120 → 220 → 50 px on a 320 px stage) without restarting: x(t) = x0 + Σ Δx·spring(t − ti), spring k 170, c 20, m 1 (2.3 % overshoot, ~500 ms); any time is computable directly; target markers light as they activate. Params: keys [[giây, giá trị]] · spring (k 170, c 20). x(t) = x0 + Σ Δx · spring(t − ti), so any time can be computed directly.
-->

<script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.spring = MW.spring || function (stiffness, damping, mass, from, to) {
    var k = stiffness || 100, c = damping == null ? 10 : damping, m = mass || 1, w0 = Math.sqrt(k / m), z = c / (2 * Math.sqrt(k * m));
    var x = function (t) {
      if (z < 1) { var wd = w0 * Math.sqrt(1 - z * z); return 1 - Math.exp(-z * w0 * t) * (Math.cos(wd * t) + (z * w0 / wd) * Math.sin(wd * t)); }
      if (z === 1) return 1 - Math.exp(-w0 * t) * (1 + w0 * t);
      var q = Math.sqrt(z * z - 1), r1 = -w0 * (z - q), r2 = -w0 * (z + q), A = r2 / (r2 - r1), B = -r1 / (r2 - r1);
      return 1 - (A * Math.exp(r1 * t) + B * Math.exp(r2 * t));
    };
    var T = 0, dt = 1 / 240; for (var t = 0; t < 30; t += dt) if (Math.abs(1 - x(t)) > 0.001) T = t;
    T = Math.max(dt, T + dt);
    return { duration: T, ease: function (p) { return p >= 1 ? 1 : x(p * T); }, at: x };
  };
  MW.springDB = MW.springDB || function (duration, bounce) {
    var z = 1 - (bounce == null ? 0.25 : bounce), w = Math.log(1000) / (Math.max(0.05, z) * (duration || 0.8));
    return MW.spring(w * w, 2 * z * w, 1);
  };
  MW.drive = MW.drive || function (tl, at, dur, fn) {
    var s = { t: 0 }; fn(0);
    tl.fromTo(s, { t: 0 }, { t: dur, duration: dur, ease: "none", immediateRender: false, onUpdate: function () { fn(s.t); } }, at);
    return at + dur;
  };
  MW.springTo = MW.springTo || function (k, c, keys) {
    var sp = MW.spring(k, c);
    return function (t) { var v = keys[0][1]; for (var i = 1; i < keys.length; i++) if (t >= keys[i][0]) v += (keys[i][1] - keys[i - 1][1]) * sp.at(t - keys[i][0]); return v; };
  };
  var defaults = {"keys":[[0,0],[0.3,1100],[0.75,385],[1.3,935],[2.2,0]],"stiffness":170,"damping":20,"markers":null,"duration":3};
  var run = function (el, tl, at, o) {
        var X = MW.springTo(o.stiffness, o.damping, o.keys), M = o.markers ? Array.prototype.slice.call(document.querySelectorAll(o.markers)) : [];
        return MW.drive(tl, at, o.duration, function (t) { gsap.set(el, { x: X(t) }); M.forEach(function (m, i) { var k = o.keys[i + 1], on = k && t >= k[0]; m.style.opacity = on ? "1" : "0.35"; gsap.set(m, { scale: on ? 1 + 0.25 * Math.exp(-8 * (t - k[0])) : 1 }); }); });
      };
  MW.motionSpringRetarget = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
</script>
