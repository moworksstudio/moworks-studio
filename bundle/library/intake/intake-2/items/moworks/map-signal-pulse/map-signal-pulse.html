  Live Signal Pulse Map (Moworks Studio, the studio's own, written here).
  Source: Moworks Studio.
  Trên bản đồ cố định, năm điểm lần lượt bật chấm và phát hai vòng sóng, thanh thời gian bên dưới sáng theo từng lần phát.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.mapSignalPulse(q(".gm"), tl, 0, {});

  Options (defaults in brackets):
      - places: [[x, y, name], ...] in 320 units (5)

  Notes: Fixed map; 5 points fire at 400 / 800 / 1200 / 1600 / 2000 ms. Each: dot pops (scale 0 -> 1, 300 ms back.out), two rings radius 4 -> 30 px over 900 ms easeOutCubic, the second 220 ms later, opacity 0.9 -> 0. Optional time rail below with a dot per fire lighting as passed. Fade out 3600-3900. Params: points (5) · interval (0.4 s) · rings (4 → 30 px, 0.9 s).
-->

<div class="gm"></div>

<script>
(function () {
  "use strict";

  };
  MW.rr = MW.rr || function (c, x, y, w, h, r) { r = Math.min(r, w / 2, h / 2); c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); };
  MW.txt = MW.txt || function (c, s, x, y, size, color, weight, align) { c.font = (weight || 700) + " " + size + "px Inter, sans-serif"; c.fillStyle = color || "#e8ebf3"; c.textAlign = align || "center"; c.textBaseline = "middle"; c.fillText(s, x, y); };

  };
  var defaults = {"places":[[96,56,"Hà Nội"],[196,74,"Huế"],[130,124,"Đà Nẵng"],[248,136,"Nha Trang"],[168,150,"Cần Thơ"]]};
  var run = function (el, tl, at, o) {
        var S = MW.stage320(el), c = S.ctx, sp = MW.span, out = gsap.parseEase("power2.out"), bk = gsap.parseEase("back.out"), P = o.places;
        return MW.drive(tl, at, 4, function (t) {
          S.clear(); var f = 1 - sp(t, 3.6, 3.9); c.globalAlpha = f;
          c.fillStyle = "#1b2233"; [[60, 40, 70, 34], [150, 60, 90, 40], [90, 110, 120, 34], [220, 120, 60, 30]].forEach(function (b) { c.beginPath(); c.ellipse(b[0] + b[2] / 2, b[1] + b[3] / 2, b[2] / 2, b[3] / 2, 0, 0, 2 * Math.PI); c.fill(); });
          c.fillStyle = "#2a3350"; for (var gx = 30; gx < 300; gx += 10) for (var gy = 30; gy < 160; gy += 10) { c.fillRect(gx, gy, 1, 1); }
          P.forEach(function (p, i) { var d = t - (0.4 + 0.4 * i); if (d < 0) return; c.fillStyle = "#8b7bff"; c.beginPath(); c.arc(p[0], p[1], 4 * bk(Math.min(1, d / 0.3)), 0, 2 * Math.PI); c.fill();
            [0, 0.22].forEach(function (lag) { var u = (d - lag) / 0.9; if (u < 0 || u > 1) return; c.globalAlpha = f * 0.9 * (1 - u); c.strokeStyle = "#a99bff"; c.lineWidth = 1.2; c.beginPath(); c.arc(p[0], p[1], 4 + 26 * out(u), 0, 2 * Math.PI); c.stroke(); c.globalAlpha = f; });
            MW.txt(c, p[2], p[0], p[1] + 12, 7, "#c9d2ea", 700); });

          P.forEach(function (p, i) { var x = 60 + 50 * i; c.fillStyle = t >= 0.4 + 0.4 * i ? "#8b7bff" : "#2a3350"; c.beginPath(); c.arc(x, 178, 3.5, 0, 2 * Math.PI); c.fill(); }); c.globalAlpha = 1;
        });
      };
  MW.mapSignalPulse = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
