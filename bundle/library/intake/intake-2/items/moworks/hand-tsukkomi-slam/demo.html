<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Tsukkomi Slam Telop - Demo</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
:root { --bg: #09090b; --fg: #fafafa; --card: #111114; --line: #27272a; }
* { box-sizing: border-box; }
html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); }
#demo { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); color: var(--fg); font-family: Inter, sans-serif; }
.center { position: absolute; inset: 0; display: grid; place-items: center; }
.row { display: flex; align-items: center; justify-content: center; gap: 48px; }
.col { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 32px; }
.h1 { font-size: 132px; font-weight: 800; letter-spacing: -0.035em; line-height: 1.1; text-align: center; }
.h2 { font-size: 84px; font-weight: 700; letter-spacing: -0.025em; line-height: 1.15; text-align: center; }
.p { font-size: 40px; line-height: 1.4; opacity: 0.72; text-align: center; }
.card { position: relative; border-radius: 28px; background: var(--card); border: 2px solid var(--line); overflow: hidden; }
.muted { opacity: 0.6; }

#demo { background: radial-gradient(100% 100% at 50% 45%, #1a1f33, #0b0d12); color: #e8ebf3; font-family: Inter, sans-serif; } .gm { position: absolute; inset: 0; }
.ft { position: absolute; inset: 0; background: url(assets/shot.svg) center / cover; } .ft::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,0.1) 30%, rgba(0,0,0,0.55)); }
.st { position: absolute; inset: 0; display: grid; place-items: center; } .tk { font-size: 176px; font-weight: 900; color: #fff; -webkit-text-stroke: 0.64em #ff3b4f; paint-order: stroke fill; filter: drop-shadow(16px 16px 0 #12081c); visibility: hidden; }
    </style>
  </head>
  <body>
    <div id="demo" data-composition-id="mw-demo" data-start="0" data-width="1920" data-height="1080" data-duration="2.6">
<div class="ft"></div><div class="st"><div class="tk">Sao lại thế!</div></div>
      <script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.rand = MW.rand || function (seed) {
    var a = typeof seed === "string" ? MW.hash(seed) : (seed >>> 0) || 1;
    return function () { a = (a + 0x6d2b79f5) >>> 0; var t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  };
  MW.hash = MW.hash || function (s) { var h = 2166136261; s = String(s); for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; };
  MW.drive = MW.drive || function (tl, at, dur, fn) {
    var s = { t: 0 }; fn(0);
    tl.fromTo(s, { t: 0 }, { t: dur, duration: dur, ease: "none", immediateRender: false, onUpdate: function () { fn(s.t); } }, at);
    return at + dur;
  };
  var defaults = {"angle":-8,"shake":48,"rays":40,"inner":[360,560],"outer":1400,"bg":".ft","offAt":1.9,"seed":9};
  var run = function (el, tl, at, o) {
        var host = el.parentNode, bg = o.bg ? document.querySelector(o.bg) : null, p1 = gsap.parseEase("power1.in"), cv = document.createElement("canvas");
        if (getComputedStyle(host).position === "static") host.style.position = "relative"; var CW = host.clientWidth, CH = host.clientHeight, X0 = CW / 2, Y0 = CH / 2;
        cv.width = CW; cv.height = CH; cv.style.cssText = "position:absolute;left:0;top:0;pointer-events:none;width:" + CW + "px;height:" + CH + "px;"; host.insertBefore(cv, el); var c = cv.getContext("2d"), imp = 3 / 30;
        return MW.drive(tl, at, o.offAt + 0.05, function (t) {
          var s = t <= 0 ? 0 : t < imp ? 2.5 - 1.5 * p1(t / imp) : 1, u = t - imp, f = Math.floor(u * 24), k = u > 0 && f < 8 ? 1 - f / 8 : 0, r = MW.rand(o.seed + f * 31), sx = (r() * 2 - 1) * o.shake * k, sy = (r() * 2 - 1) * o.shake * k;
          if (bg) gsap.set(bg, { x: sx, y: sy }); gsap.set(el, { scale: s, rotation: o.angle, x: sx / 2, y: sy / 2 }); el.style.visibility = t > 0 && t < o.offAt ? "visible" : "hidden";
          c.clearRect(0, 0, CW, CH); var a = u > 0 ? 0.75 * (1 - Math.max(0, Math.min(1, (u - 0.1) / 0.4))) : 0;
          if (a > 0 && t < o.offAt) { c.fillStyle = "rgba(255,255,255," + a.toFixed(3) + ")"; var rr = MW.rand(o.seed * 7 + f); for (var i = 0; i < o.rays; i++) { var th = i / o.rays * 2 * Math.PI + rr() * 0.05, w = 0.02 + rr() * 0.02, ri = o.inner[0] + rr() * (o.inner[1] - o.inner[0]);
            c.beginPath(); c.moveTo(X0 + ri * Math.cos(th), Y0 + 0.7 * ri * Math.sin(th)); c.lineTo(X0 + o.outer * Math.cos(th - w), Y0 + o.outer * Math.sin(th - w)); c.lineTo(X0 + o.outer * Math.cos(th + w), Y0 + o.outer * Math.sin(th + w)); c.closePath(); c.fill(); } }
        });
      };
  MW.handTsukkomiSlam = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
      </script>
      <script>
        (function () {
          var tl = gsap.timeline({ paused: true });
          var q = function (s) { return document.querySelector(s); }, qa = function (s) { return Array.prototype.slice.call(document.querySelectorAll(s)); };
          MW.handTsukkomiSlam(q(".tk"), tl, 0.35, {});
          tl.set({}, {}, 2.6);
          // register only when every motion is ready (MW.pending: e.g. a WebGL texture still decoding), as HyperFrames asks of async builds
          var go = function () { window.__timelines = window.__timelines || {}; window.__timelines["mw-demo"] = tl; };
          if (window.MW && MW.pending && MW.pending.length) Promise.all(MW.pending).then(go, go); else go();
        })();
      </script>
    </div>
  </body>
</html>
