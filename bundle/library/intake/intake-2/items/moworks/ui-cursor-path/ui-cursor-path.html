  Human Cursor Path (Moworks Studio, the studio's own, written here).
  Source: Moworks Studio.
  Con trỏ trong phim không đi thẳng: mỗi lần di chuyển hơi cong, nhanh dần rồi chậm dần khi tới mục tiêu, dừng một nhịp rồi bấm, mục tiêu đổi màu.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.uiCursorPath(q(".cp"), tl, 0, {});

  Options (defaults in brackets):
      - items: the targets in order
      - cycle: s per target (1)
      - move: s (0.7, smoothstep)
      - arc: sideways bow as a share of the move (0.12)
      - pause: s before the press (0.05)
      - press: s (0.1)
      - accent: fill of a pressed target
      - cursor: the cursor

  Notes: Targets 52x28 r8. Recipe: each move 900 ms power2.inOut along a slight arc (perpendicular offset = sin(π q) × 0.06 × segment length), pause 100 ms, click. Demo: 1 s cycles visiting (60,60) → (250,80) → (120,150): move over 0.7 s with smoothstep, arc 0.12 × length, pause 50 ms, press 100 ms (cursor scale 0.85, the target fills accent). Params: keys [[giây, x, y, bấm]] · move (0.9 s, power2.inOut) · arc (0.06 × quãng) · pause (0.1 s) · press (0.1 s). The recipe: 0.9 s moves (power2.inOut) on an arc of 0.06 × the distance, a 0.1 s pause, then the click.
-->
