    MW.textFuzzyText(q(".tk-head"), tl, 0, {});

  Options (defaults in brackets):
      - range: px at intensity 1 (120)
      - rest: intensity at rest (0.18)
      - hover: intensity on the beat (0.5)
      - on: [from, to] s it ramps up ([0.75, 1.05])
      - off: [from, to] s back ([1.95, 2.3])
      - row: px per row (2)
      - seed: (9)
      - loop: s (3.2)
