<!--
  Scale Blur Zoom In (Moworks Studio, the studio's own, written here).
  Source: Moworks Studio.
  Cả dòng chữ thu nhỏ từ 1.4 lần về đúng cỡ và lấy nét từ vùng nhoè 12 px như ống kính lấy nét.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.textScaleBlurZoom(q(".tk-head"), tl, 0, {});

  Options (defaults in brackets):
      - scale: start scale (1.4)
      - blur: px (24)
      - duration: s (0.7)
      - ease: (cubic-bezier(.2,.7,.2,1))
      - start: s (0.4)
      - exitAt: s (2.3)
      - loop: s (2.8)
      - box: [x, y] start size of the AF brackets over the text box ([1.15, 1.3])
      - pad: px (30)
      - bracket: px (54)
      - stroke: px (6)
      - seeking: bracket colour while focusing
      - locked: bracket colour on lock

  Notes: Whole text: scale 1.4 → 1 (about its centre), blur 12 → 0 px, opacity 0 → 1, 0.7 s cubic-bezier(.2,.7,.2,1) (demo 0.4–1.1 s). Demo dressing: viewfinder corner marks on the frame and AF corner brackets that shrink from 1.15× / 1.3× the text box to 1× and turn green on lock. Loop exit: fade 2.3–2.6 s; loop 2.8 s. Params: scale đầu (1.4) · blur (12 px) · duration (0.7 s) · ease (cubic-bezier(.2,.7,.2,1)).
-->

<script>
(function () {

  var MW = (window.MW = window.MW || {});

    var X = function (t) { return ((ax * t + bx) * t + cx) * t; }, Y = function (t) { return ((ay * t + by) * t + cy) * t; }, dX = function (t) { return (3 * ax * t + 2 * bx) * t + cx; };
    return function (p) {
      if (p <= 0) return 0; if (p >= 1) return 1;
      var t = p, i, d;
      for (i = 0; i < 8; i++) { d = X(t) - p; if (Math.abs(d) < 1e-6) return Y(t); var s = dX(t); if (Math.abs(s) < 1e-6) break; t -= d / s; }
      var lo = 0, hi = 1; t = p;
      for (i = 0; i < 40; i++) { d = X(t); if (Math.abs(d - p) < 1e-6) break; if (d < p) lo = t; else hi = t; t = (lo + hi) / 2; }
      return Y(t);
    };
  };
  MW.CSS_EASE = { ease: [0.25, 0.1, 0.25, 1], easeIn: [0.42, 0, 1, 1], easeOut: [0, 0, 0.58, 1], easeInOut: [0.42, 0, 0.58, 1] };
  MW.EASES = MW.EASES || { "css-ease": [0.25, 0.1, 0.25, 1], "css-in": [0.42, 0, 1, 1], "css-out": [0, 0, 0.58, 1], "css-in-out": [0.42, 0, 0.58, 1],
    md3: [0.2, 0, 0, 1], "md3-emph": [0.05, 0.7, 0.1, 1], "md3-acc": [0.3, 0, 1, 1], "md3-dec": [0, 0, 0, 1], whip: [0.9, 0, 0.1, 1], glide: [0.4, 0, 0.2, 1],
    house: [0.83, 0, 0.17, 1], "in-out": [0.65, 0, 0.35, 1] };

  };
  MW.drive = MW.drive || function (tl, at, dur, fn) {

    return at + dur;
  };
  var defaults = {"scale":1.4,"blur":24,"duration":0.7,"ease":"cubic-bezier(.2,.7,.2,1)","start":0.4,"exitAt":2.3,"loop":2.8,"box":[1.15,1.3],"pad":30,"bracket":54,"stroke":6,"seeking":"#e8ebf3","locked":"#3ddc84"};
  var run = function (el, tl, at, o) {
        var host = el.parentNode, e = MW.ez(o.ease), br = [], z = o.bracket;
        if (getComputedStyle(host).position === "static") host.style.position = "relative";
        var L = el.offsetLeft, Tp = el.offsetTop, W = el.offsetWidth, Hh = el.offsetHeight;

        });
      };
  MW.textScaleBlurZoom = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
