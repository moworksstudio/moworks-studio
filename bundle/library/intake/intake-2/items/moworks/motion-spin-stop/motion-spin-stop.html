  Spin Stop (Moworks Studio, the studio's own, written here).
  Source: Moworks Studio.
  Ô xoay hai vòng thật nhanh rồi chậm dần, dừng đúng một góc bội của 90°.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.motionSpinStop(q(".ss-t"), tl, 0.3, { duration: 1.2, ease: "cubic-bezier(.3,.45,.15,1)", marker: ".ss-m" });

  Options (defaults in brackets):
      - turns: (2)
      - duration: s (0.85; the small demo 1.2)
      - ease: (power3.out; the demo cubic-bezier(.3,.45,.15,1))
      - copies: motion copies (5)
      - gap: s between copies (0.012)
      - copyOpacity: at full speed (0.16)
      - marker: the stop marker (a ring pings there)
      - ring: [from, to] px radius ([25, 95])
      - ringWidth: px (6)
      - ringTime: s (0.43)
      - pingAt: share of the spin when the ring pings (0.7)
      - accent: ring colour

  Notes: Tile spins 0 → 720° and stops on a 90° multiple: recipe 850 ms power3.out (easeOutQuart); small demo 1200 ms custom(.3,.45,.15,1). Five motion copies 12 ms apart at up to 16 % opacity scaled by speed; as it lands a small ring pings at the stop marker (radius 5 → 19 px, 430 ms power2.out). Params: duration (0.85 s) · turns: số vòng (2) · ease (power3.out).
-->
