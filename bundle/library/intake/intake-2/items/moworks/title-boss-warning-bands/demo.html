<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Boss Warning - Demo</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
:root { --bg: #09090b; --fg: #fafafa; --card: #111114; --line: #27272a; }
* { box-sizing: border-box; }
html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); }
#demo { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); color: var(--fg); font-family: Inter, sans-serif; }
.center { position: absolute; inset: 0; display: grid; place-items: center; }
.row { display: flex; align-items: center; justify-content: center; gap: 48px; }
.col { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 32px; }
.h1 { font-size: 132px; font-weight: 800; letter-spacing: -0.035em; line-height: 1.1; text-align: center; }
.h2 { font-size: 84px; font-weight: 700; letter-spacing: -0.025em; line-height: 1.15; text-align: center; }
.p { font-size: 40px; line-height: 1.4; opacity: 0.72; text-align: center; }
.card { position: relative; border-radius: 28px; background: var(--card); border: 2px solid var(--line); overflow: hidden; }
.muted { opacity: 0.6; }

#demo { background: radial-gradient(100% 100% at 50% 40%, #1a1f33, #0b0d12); color: #e8ebf3; font-family: Inter, sans-serif; } .gm { position: absolute; inset: 0; }
.bw { position: absolute; inset: 0; overflow: hidden; } .bw-tint { position: absolute; inset: 0; background: rgba(139,123,255,0.1); opacity: 0; }
.bw-band { position: absolute; left: 0; right: 0; height: 100px; background: repeating-linear-gradient(-45deg, #ffd23d 0 45px, #1a1500 45px 90px); }
.bw-sil { position: absolute; left: 50%; top: 50%; width: 700px; height: 700px; margin: -350px; border-radius: 46% 46% 30% 30%; background: radial-gradient(circle at 50% 40%, #3a2066, #0b0d12 70%); opacity: 0; }
.bw-title { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); text-align: center; white-space: nowrap; } .bw-title b { display: block; font-size: 170px; font-weight: 900; color: #ff5d6c; letter-spacing: 0.06em; } .bw-title span { font-size: 54px; font-weight: 800; letter-spacing: 0.3em; }
    </style>
  </head>
  <body>
    <div id="demo" data-composition-id="mw-demo" data-start="0" data-width="1920" data-height="1080" data-duration="2.9">
<div class="gm bw"><div class="bw-tint"></div><div class="bw-sil"></div><div class="bw-band" style="top:130px"></div><div class="bw-band" style="top:780px"></div><div class="bw-title"><b>CẢNH BÁO</b><span>TRÙM ĐANG TỚI</span></div></div>
      <script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.drive = MW.drive || function (tl, at, dur, fn) {
    var s = { t: 0 }; fn(0);
    tl.fromTo(s, { t: 0 }, { t: dur, duration: dur, ease: "none", immediateRender: false, onUpdate: function () { fn(s.t); } }, at);
    return at + dur;
  };
  var defaults = {"inAt":0.3,"drift":110,"outAt":2.3};
  var run = function (el, tl, at, o) {
        var bands = el.querySelectorAll(".bw-band"), sil = el.querySelector(".bw-sil"), title = el.querySelector(".bw-title"), tint = el.querySelector(".bw-tint"), ex = gsap.parseEase("expo.out"), ei = gsap.parseEase("expo.in"), out = gsap.parseEase("power2.out");
        return MW.drive(tl, at, o.outAt + 0.6, function (t) {
          var W = el.offsetWidth, p = ex(Math.max(0, Math.min(1, (t - o.inAt) / 0.4))), e = ei(Math.max(0, Math.min(1, (t - o.outAt) / 0.25)));
          gsap.set(bands[0], { x: -W * (1 - p) + W * e }); gsap.set(bands[1], { x: W * (1 - p) - W * e });
          bands[0].style.backgroundPosition = (t * o.drift) + "px 0"; bands[1].style.backgroundPosition = (-t * o.drift) + "px 0";
          if (tint) tint.style.opacity = String(Math.min(1, t / 0.3) * (1 - e));
          if (sil) { sil.style.opacity = String(0.5 * Math.max(0, Math.min(1, (t - 0.4) / 0.6)) * (1 - e)); gsap.set(sil, { scale: 0.92 + 0.08 * Math.min(1, t / 2.3) }); }
          var r = out(Math.max(0, Math.min(1, (t - 0.75) / 0.3))), w = title.offsetWidth; title.style.clipPath = "inset(-0.3em " + (w / 2) * (1 - r) + "px -0.3em " + (w / 2) * (1 - r) + "px)"; title.style.opacity = String(1 - e);
        });
      };
  MW.titleBossWarningBands = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
      </script>
      <script>
        (function () {
          var tl = gsap.timeline({ paused: true });
          var q = function (s) { return document.querySelector(s); }, qa = function (s) { return Array.prototype.slice.call(document.querySelectorAll(s)); };
          MW.titleBossWarningBands(q(".bw"), tl, 0, {});
          tl.set({}, {}, 2.9);
          // register only when every motion is ready (MW.pending: e.g. a WebGL texture still decoding), as HyperFrames asks of async builds
          var go = function () { window.__timelines = window.__timelines || {}; window.__timelines["mw-demo"] = tl; };
          if (window.MW && MW.pending && MW.pending.length) Promise.all(MW.pending).then(go, go); else go();
        })();
      </script>
    </div>
  </body>
</html>
