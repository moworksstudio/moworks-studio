  Từng ký tự nhún bẹp rồi dài ra vài nhịp như viên thạch, lan từ trái sang.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.textJellyLetters(q(".tk-head"), tl, 0.4, {});

  Options (defaults in brackets):
      - duration: s per letter (0.9)
      - stagger: s (0.06, ≤ 0.5 s)
      - accent: flash colour while squashed

  Notes: Split chars, pivot bottom centre. Each char runs 0.9 s of scaleX/scaleY keys: 0 % (1, 1), 30 % (1.25, 0.75), 40 % (0.75, 1.25), 50 % (1.15, 0.85), 65 % (0.95, 1.05), 75 % (1.05, 0.95), 100 % (1, 1), sine in-out between keys; 60 ms stagger (capped 0.5 s total), from 0.4 s. Chars flash accent while either scale < 0.9. Source trigger: hover (demo cursor arrives 0.02–0.38 s, leaves 2.15–2.6 s). Loop 2.8 s. Params: duration: mỗi ký tự (0.9 s) · stagger (0.06 s) · squash: bẹp đỉnh (1.25 / 0.75).
-->
