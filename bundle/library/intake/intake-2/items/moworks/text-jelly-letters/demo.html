    <style>

.tk-sub { margin-top: 36px; text-align: center; }
.ui-cursor { position: absolute; left: 0; top: 0; z-index: 30; }

    <div id="demo" data-composition-id="mw-demo" data-start="0" data-width="1920" data-height="1080" data-duration="2.8">
<div class="tk-stage"><div><h1 class="tk-head ">Thạch rung rinh</h1></div></div><svg class="ui-cursor" viewBox="0 0 32 32" width="64" height="64"><path d="M6 3 L6 25 L12 19.5 L16 28.5 L20 26.8 L16 18 L24 18 Z" fill="#fff" stroke="#111" stroke-width="1.6" stroke-linejoin="round"/></svg>
      <script>
(function () {

    var val = function (k, t) { if (t <= k[0][0]) return k[0][1]; for (var i = 1; i < k.length; i++) if (t <= k[i][0]) { var a = k[i - 1], b = k[i], u = (t - a[0]) / ((b[0] - a[0]) || 1); return a[1] + (b[1] - a[1]) * e(u); } return k[k.length - 1][1]; };

      <script>
        (function () {
