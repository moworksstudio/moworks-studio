<!--
  Japanese Subtitle 4 cps (Moworks Studio, the studio's own, written here).
  Source: Moworks Studio.
  Mỗi câu phụ đề hiện bằng nhát cắt và đứng đúng thời lượng tính theo số chữ (tiếng Nhật 4 chữ mỗi giây, tối thiểu 0.5 giây), có quãng nghỉ ngắn giữa các câu.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.textSubtitleCpsTiming(q(".cs"), tl, 0, {});

  Options (defaults in brackets):
      - cues: subtitle lines (a newline breaks the line; two lines at most)
      - rate: characters a second (17 for Vietnamese; 4 for Japanese)
      - min: s (0.5)
      - gap: s between cues (0.12: three frames at 24 fps)
      - start: s (0.35)
      - sub: the subtitle element
      - meta: an optional readout of the timing
      - loop: s (4.6)

  Notes: Cue time = max(0.5 s, chars ÷ 4) (half-width chars count 0.5); ≤ 13 chars per line, ≤ 2 lines; 0.12 s gap (3 frames at 24 fps) between cues; schedule scaled to fit if longer; '、' → space, final '。' dropped, inner '。' → full-width space. Text 15 px, white with a 3.5 px dark outline, centred at the bottom of the picture; cuts only. Demo: cues from 0.35 s. Loop 4.6 s. For Vietnamese use a Latin-script rate (≈ 17 chars/s). Params: tốc độ đọc (4 chữ/s; tiếng Việt ≈ 17 ký tự/s) · tối đa (13 chữ × 2 dòng) · tối thiểu (0.5 s) · nghỉ (3 khung). Cue length = max(0.5 s, characters ÷ rate), cut in and out; the plan is scaled to fit when longer.
-->

<div class="ft"></div><div class="cs"><div class="cs-s"></div><div class="cs-m"></div></div>

<script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.drive = MW.drive || function (tl, at, dur, fn) {
    var s = { t: 0 }; fn(0);
    tl.fromTo(s, { t: 0 }, { t: dur, duration: dur, ease: "none", immediateRender: false, onUpdate: function () { fn(s.t); } }, at);
    return at + dur;
  };
  var defaults = {"cues":["Sáng nay cả nhà dậy thật sớm\nđể kịp chuyến tàu ra biển.","Ai cũng háo hức."],"rate":17,"min":0.5,"gap":0.12,"start":0.35,"sub":".cs-s","meta":".cs-m","loop":4.6};
  var run = function (el, tl, at, o) {
        var sub = el.querySelector(o.sub), meta = o.meta ? el.querySelector(o.meta) : null, t0 = o.start, plan = o.cues.map(function (c) { var n = Array.from(c.replace(/\s+/g, " ")).length, d = Math.max(o.min, n / o.rate); return { c: c, n: n, d: d }; });
        var tot = plan.reduce(function (a, p) { return a + p.d; }, 0) + o.gap * (plan.length - 1), k = tot > o.loop - o.start - 0.2 ? (o.loop - o.start - 0.2) / tot : 1; plan.forEach(function (p) { p.t = t0; t0 += p.d * k + o.gap * k; });
        return MW.drive(tl, at, o.loop, function (t) {
          var cur = null; plan.forEach(function (p) { if (t >= p.t && t < p.t + p.d * k) cur = p; }); sub.innerHTML = cur ? cur.c.replace(/\n/g, "<br>") : ""; sub.style.visibility = cur ? "visible" : "hidden";
          if (meta) meta.textContent = cur ? cur.n + " ký tự · " + (cur.d * k).toFixed(1) + " s" : "";
        });
      };
  MW.textSubtitleCpsTiming = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
</script>
