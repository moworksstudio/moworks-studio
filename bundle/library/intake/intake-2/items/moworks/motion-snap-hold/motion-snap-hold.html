<!--
  Snap, then Hold (Moworks Studio, the studio's own, written here).
  Source: Moworks Studio.
  Thay đổi xảy ra gần như trong một khung, chỉ phần lắng xuống có ease, rồi giữ yên để cảm giác chắc tay.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.motionSnapHold(q(".sh"), tl, 0.3, {});

  Options (defaults in brackets):
      - items: 
      - each: s apart (0.45)
      - pop: scale it appears at, with no in-between frames (1.25)
      - snap: s held at the pop (0.06)
      - settle: s (0.2, power2.out)
      - hold: s held after (0.6)

  Notes: Four stars, 450 ms apart: each appears at once at scale 1.25 (no in-between frames), holds 60 ms, settles 1.25 → 1 in 200 ms power2.out, then holds. Recipe: the change itself in 40–80 ms (1–2 frames), settle to 300 ms (expo.out), then hold. Params: pop (1.25) · snap (60 ms) · settle (0.2 s) · hold (≥ 0.6 s). The change itself takes 1–2 frames; only the settle is eased, then it holds still.
-->

<div class="st"><div class="sh"><i><svg viewBox="-12 -12 24 24" width="100%" height="100%"><path d="M0 -11 L3.2 -3.8 L11 -3.4 L5 1.8 L6.8 9.6 L0 5.4 L-6.8 9.6 L-5 1.8 L-11 -3.4 L-3.2 -3.8 Z" fill="currentColor"/></svg></i><i><svg viewBox="-12 -12 24 24" width="100%" height="100%"><path d="M0 -11 L3.2 -3.8 L11 -3.4 L5 1.8 L6.8 9.6 L0 5.4 L-6.8 9.6 L-5 1.8 L-11 -3.4 L-3.2 -3.8 Z" fill="currentColor"/></svg></i><i><svg viewBox="-12 -12 24 24" width="100%" height="100%"><path d="M0 -11 L3.2 -3.8 L11 -3.4 L5 1.8 L6.8 9.6 L0 5.4 L-6.8 9.6 L-5 1.8 L-11 -3.4 L-3.2 -3.8 Z" fill="currentColor"/></svg></i><i><svg viewBox="-12 -12 24 24" width="100%" height="100%"><path d="M0 -11 L3.2 -3.8 L11 -3.4 L5 1.8 L6.8 9.6 L0 5.4 L-6.8 9.6 L-5 1.8 L-11 -3.4 L-3.2 -3.8 Z" fill="currentColor"/></svg></i></div></div>

<script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.drive = MW.drive || function (tl, at, dur, fn) {
    var s = { t: 0 }; fn(0);
    tl.fromTo(s, { t: 0 }, { t: dur, duration: dur, ease: "none", immediateRender: false, onUpdate: function () { fn(s.t); } }, at);
    return at + dur;
  };
  var defaults = {"items":"i","each":0.45,"pop":1.25,"snap":0.06,"settle":0.2,"hold":0.6};
  var run = function (el, tl, at, o) {
        var it = Array.prototype.slice.call(el.querySelectorAll(o.items)), p2 = gsap.parseEase("power2.out");
        return MW.drive(tl, at, (it.length - 1) * o.each + o.snap + o.settle + o.hold, function (t) { it.forEach(function (x, i) { var u = t - i * o.each, s = u < 0 ? 0 : u < o.snap ? o.pop : o.pop + (1 - o.pop) * p2(Math.min(1, (u - o.snap) / o.settle)); gsap.set(x, { scale: s }); }); });
      };
  MW.motionSnapHold = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
</script>
