<!--
  3D Card Flip (Moworks Studio, the studio's own, written here).
  Source: Moworks Studio.
  Cảnh cũ xoay quanh trục dọc tới 90°, đổi mặt, cảnh mới xoay tiếp từ −90° về phẳng như lật một tấm thẻ.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.transitionCardFlip(q(".tk-b"), tl, 1.2, { duration: 0.8 });

  Options (defaults in brackets):
      - duration: s (0.6)
      - perspective: px (2400)
      - scale: scale during the turn (0.9)
      - from: the outgoing scene

  Notes: Outgoing scene rotateY 0 -> 90 deg (perspective origin on the hinge, slight 0.9 scale during the turn), at 300 ms hide it and show the incoming from -90 -> 0 deg; 600 ms easeInOutCubic overall; never show a back face (fold to 90 and swap). HF showcase-3d ships a Card Flip (Apache-2.0). Params: duration (0.6 s) · perspective · scale lúc lật (0.9).
-->

<section class="tk-scene tk-a"><div class="tk-mark circle"></div><div class="tk-sc-text"><div class="tk-sc-letter">A</div><div class="tk-sc-cap">Cảnh mở đầu</div></div></section>
<section class="tk-scene tk-b"><div class="tk-mark square"></div><div class="tk-sc-text"><div class="tk-sc-letter">B</div><div class="tk-sc-cap">Cảnh tiếp theo</div></div></section>

<style>

</style>

<script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.drive = MW.drive || function (tl, at, dur, fn) {
    var s = { t: 0 }; fn(0);
    tl.fromTo(s, { t: 0 }, { t: dur, duration: dur, ease: "none", immediateRender: false, onUpdate: function () { fn(s.t); } }, at);
    return at + dur;
  };
  var defaults = {"duration":0.6,"perspective":2400,"scale":0.9,"from":null};
  var run = function (el, tl, at, o) {
        var out = o.from ? MW.el(o.from) : el.previousElementSibling, ease = gsap.parseEase("power2.inOut");
        el.parentNode.style.perspective = o.perspective + "px";
        return MW.drive(tl, at, o.duration, function (t) {
          var q = ease(t / o.duration), s = 1 - (1 - o.scale) * Math.sin(Math.PI * q);
          // fold to 90 degrees and swap: a back face is never shown
          if (q < 0.5) { if (out) { gsap.set(out, { rotationY: t > 0 ? 180 * q : 0, scale: t > 0 ? s : 1 }); out.style.visibility = "visible"; } el.style.visibility = "hidden"; }
          else { if (out) out.style.visibility = "hidden"; gsap.set(el, { rotationY: 180 * q - 180, scale: s }); el.style.visibility = "visible"; }
        });
      };
  MW.transitionCardFlip = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
</script>
