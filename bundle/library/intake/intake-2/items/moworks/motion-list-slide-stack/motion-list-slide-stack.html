<!--
  List Slide Stack (Moworks Studio, the studio's own, written here).
  Source: Moworks Studio.
  Bốn dòng trồi từ dưới lên vào đúng khe của mình trong một mặt nạ, mỗi dòng trễ 82 ms.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.motionListSlideStack(q(".ss"), tl, 0.3, {});

  Options (defaults in brackets):
      - items: 
      - y: px (192)
      - stagger: s (0.082)
      - duration: s (0.654, power2.out)
      - cols: 

  Notes: Four rows rise into their slots inside one mask: y +48 → 0 px, opacity in over the first half, each 654 ms power2.out, 82 ms apart (900 ms in all); dashed slot outlines show the targets (the recipe also nudges earlier rows +18 → 0; not in the demo). Params: y (48 px) · stagger (82 ms) · each (0.654 s) · ease (power2.out). The rows rise into their slots inside one mask (the container clips them).
-->

<div class="st"><div class="ss"><div class="rw"><i></i><b style="width:62%"></b></div><div class="rw"><i></i><b style="width:48%"></b></div><div class="rw"><i></i><b style="width:70%"></b></div><div class="rw"><i></i><b style="width:54%"></b></div></div></div>

<style>

</style>

<script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.drive = MW.drive || function (tl, at, dur, fn) {
    var s = { t: 0 }; fn(0);
    tl.fromTo(s, { t: 0 }, { t: dur, duration: dur, ease: "none", immediateRender: false, onUpdate: function () { fn(s.t); } }, at);
    return at + dur;
  };
  var defaults = {"items":".rw","y":192,"stagger":0.082,"duration":0.654,"cols":0};
  var run = function (el,tl,at,o
  ) {
  var it = Array.prototype.slice.call(el.querySelectorAll(o.items)), n = it.length, cols = o.cols || n;
  var p2 = gsap.parseEase("power2.out");
  return MW.drive(tl, at, (n - 1) * o.stagger + o.duration, function (t) { it.forEach(function (r, i) { var u = Math.max(0, Math.min(1, (t - i * o.stagger) / o.duration)); gsap.set(r, { y: o.y * (1 - p2(u)) }); r.style.opacity = String(Math.min(1, u * 2)); }); });
  };
  MW.motionListSlideStack = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
</script>
