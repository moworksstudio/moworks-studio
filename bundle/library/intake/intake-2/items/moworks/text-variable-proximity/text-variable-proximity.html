  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.textVariableProximity(q(".tk-head"), tl, 0, {});

  Options (defaults in brackets):
      - radius: px of the falloff (360)
      - from: wght far (400)
      - to: wght at the pointer (900)
      - tint: accent at the pointer (0.5)
      - base: 
      - accent: 
      - ease: of the pointer's glides (cubic-bezier(.4,0,.2,1))
      - cursor: a pointer (optional)
      - loop: s (4)

  Notes: Simulated cursor path; per char wght 400 → 900 and opsz 9 → 40 by a Gaussian falloff of distance (radius 50–100 px); positions never move. Demo: k = exp(−2.5·d²/70²), wght = 400 + 500k (no opsz), accent tint 50 %·k; cursor glides (cubic-bezier(.4,0,.2,1)) from below the frame to 25 % across the word at 1.0 s, holds, to 75 % at 2.3 s, holds, leaves at 3.6 s; loop 4 s. Params: radius: tầm ảnh hưởng (70 px) · wght (400 → 900) · opsz (9 → 40) · path: đường đi con trỏ. k = exp(−2.5 d² / radius²) per letter; boxes are fixed at the heaviest width, so letters never move. The pointer comes up to a quarter of the word, holds, glides to three quarters, holds and leaves.
-->
