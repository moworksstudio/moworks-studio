<!--
  Letter Flip (Moworks Studio, the studio's own, written here).
  Source: Moworks Studio.
  Từng chữ cái lật dọc như tấm thẻ để đổi sang chữ của từ mới, lần lượt từ trái sang.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.textLetterFlip(q(".lf"), tl, 0, {});

  Options (defaults in brackets):
      - from: first word
      - to: second (same letter count)
      - duration: s per letter (0.3; the recipe 0.4)
      - stagger: s (0.07)
      - backStagger: s on the way back (0.05)
      - at: s (0.6)
      - backAt: s (2.2)
      - accent: colour of the new letters

  Notes: Old word → new word letter by letter: each letter rotateX 0 → 180° over 400 ms easeInOutCubic, letters start 100 ms apart (2.5 frames at 24 fps); at 90° the face switches to the new letter (accent). Demo: 'SPRING' → 'TWEENS' 38 px, 0.3 s per letter, 70 ms apart from 0.6 s (drawn as scaleY |cos θ|); flips back from 2.2 s, 50 ms apart; loop 3 s. Params: to: từ mới · duration: mỗi chữ (0.4 s) · stagger (0.1 s) · ease (easeInOutCubic).
-->

<script>
