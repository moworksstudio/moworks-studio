<!--
  Shockwave Typography (Moworks Studio, the studio's own, written here).
  Source: Moworks Studio.
  Chữ phóng từ 0 lên quá cỡ rồi về đúng cỡ bằng lò xo, rung ngắn ở đỉnh; ngay sau đó hai vòng sóng dẹt toả rộng ra và mười vạch ngắn bắn ra quanh chữ.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.textShockwaveType(q(".gm"), tl, 0, {});

  Options (defaults in brackets):
      - peakAt: s when the word peaks (0.58)
      - peak: overshoot scale (1.28), then a spring k300 d16 to 1
      - flat: ring height ÷ width (0.62)
      - exitAt: s of the back.in exit (3.6)

  Notes: px @320x200. Word (50 px) scales 0 → 1.28 in 230 ms outCubic (0.35-0.58 s), then to 1 by spring k300 d16; shakes ±4 px x/y for 160 ms at the peak. Two flat rings (height 0.62 × width) radius 34 → 204 over ~1.2 s outCubic, starting 20 and 100 ms after the peak, opacity 1 − q², stroke 7 → 1 (accent) and 3.5 → 1 (light ink); 10 radial dashes fly out (inner end +30 px, outer +60 px) in 400 ms outCubic, fading. Exit 3.6-3.9 s back.in. Params: peakAt: lúc đạt đỉnh (0.58 s) · peak: cỡ vọt (1.28) · rings: số vòng / bán kính (2 / 34 → 204 px) · flat: độ dẹt vòng (0.62) · spring: lò xo (k300 d16).
-->

<div class="gm"><div class="w" style="font-size:250px;color:#fff">BÙM!</div></div>

<style>

</style>

<script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.spring = MW.spring || function (stiffness, damping, mass, from, to) {
    var k = stiffness || 100, c = damping == null ? 10 : damping, m = mass || 1, w0 = Math.sqrt(k / m), z = c / (2 * Math.sqrt(k * m));
    var x = function (t) {
      if (z < 1) { var wd = w0 * Math.sqrt(1 - z * z); return 1 - Math.exp(-z * w0 * t) * (Math.cos(wd * t) + (z * w0 / wd) * Math.sin(wd * t)); }
      if (z === 1) return 1 - Math.exp(-w0 * t) * (1 + w0 * t);
      var q = Math.sqrt(z * z - 1), r1 = -w0 * (z - q), r2 = -w0 * (z + q), A = r2 / (r2 - r1), B = -r1 / (r2 - r1);
      return 1 - (A * Math.exp(r1 * t) + B * Math.exp(r2 * t));
    };
    var T = 0, dt = 1 / 240; for (var t = 0; t < 30; t += dt) if (Math.abs(1 - x(t)) > 0.001) T = t;
    T = Math.max(dt, T + dt);
    return { duration: T, ease: function (p) { return p >= 1 ? 1 : x(p * T); }, at: x };
  };
  MW.springDB = MW.springDB || function (duration, bounce) {
    var z = 1 - (bounce == null ? 0.25 : bounce), w = Math.log(1000) / (Math.max(0.05, z) * (duration || 0.8));
    return MW.spring(w * w, 2 * z * w, 1);
  };
  MW.drive = MW.drive || function (tl, at, dur, fn) {
    var s = { t: 0 }; fn(0);
    tl.fromTo(s, { t: 0 }, { t: dur, duration: dur, ease: "none", immediateRender: false, onUpdate: function () { fn(s.t); } }, at);
    return at + dur;
  };
  MW.canvas = MW.canvas || function (host, w, h) {
    host = MW.el(host);
    var cv = document.createElement("canvas"); w = w || host.clientWidth || 1920; h = h || host.clientHeight || 1080;
    cv.width = w; cv.height = h; cv.style.position = "absolute"; cv.style.left = "0"; cv.style.top = "0"; cv.style.width = w + "px"; cv.style.height = h + "px"; cv.style.pointerEvents = "none";
    host.appendChild(cv);
    return { cv: cv, ctx: cv.getContext("2d"), w: w, h: h };
  };
  MW.stage320 = MW.stage320 || function (host) {
    host = MW.el(host); if (getComputedStyle(host).position === "static") host.style.position = "relative";
    var c = MW.canvas(host), k = Math.min(c.w / 320, c.h / 200), ox = (c.w - 320 * k) / 2, oy = (c.h - 200 * k) / 2;
    return { ctx: c.ctx, cv: c.cv, k: k, ox: ox, oy: oy, w: c.w, h: c.h,
      clear: function () { c.ctx.setTransform(1, 0, 0, 1, 0, 0); c.ctx.clearRect(0, 0, c.w, c.h); c.ctx.setTransform(k, 0, 0, k, ox, oy); },
      put: function (el, x, y) { el.style.position = "absolute"; el.style.left = (ox + x * k) + "px"; el.style.top = (oy + y * k) + "px"; gsap.set(el, { xPercent: -50, yPercent: -50 }); } };
  };
  var defaults = {"peakAt":0.58,"peak":1.28,"flat":0.62,"exitAt":3.6};
  var run = function (el, tl, at, o) {
        var S = MW.stage320(el), w = el.querySelector(".w"), ctx = S.ctx, out = gsap.parseEase("power2.out"), sp = MW.spring(300, 16), bk = gsap.parseEase("back.in");
        S.put(w, 160, 100);
        var P = o.peakAt, dash = []; for (var i = 0; i < 10; i++) dash.push((i / 10) * 2 * Math.PI + 0.3);
        return MW.drive(tl, at, o.exitAt + 0.3, function (t) {
          var s = t < P - 0.23 ? 0 : t < P ? o.peak * out((t - (P - 0.23)) / 0.23) : o.peak + (1 - o.peak) * sp.at(t - P);
          if (t > o.exitAt) s *= 1 - bk(Math.min(1, (t - o.exitAt) / 0.3));
          var sh = t >= P && t < P + 0.16 ? 4 * S.k * (1 - (t - P) / 0.16) : 0;
          gsap.set(w, { scale: s, x: sh * Math.sin(t * 157), y: sh * Math.cos(t * 131) });
          S.clear();
          [[0.02, "#8b7bff", 7], [0.1, "#e8ebf3", 3.5]].forEach(function (r) {
            var u = t - P - r[0]; if (u < 0 || u > 1.2 || t > o.exitAt) return; var q = out(u / 1.2), R = 34 + (204 - 34) * q;
            ctx.globalAlpha = 1 - q * q; ctx.strokeStyle = r[1]; ctx.lineWidth = r[2] + (1 - r[2]) * q; ctx.beginPath(); ctx.ellipse(160, 100, R / 2, R / 2 * o.flat, 0, 0, 2 * Math.PI); ctx.stroke();
          });
          var d = t - P; if (d > 0 && d < 0.4) { var q2 = out(d / 0.4); ctx.globalAlpha = 1 - q2; ctx.strokeStyle = "#ffd23d"; ctx.lineWidth = 2.5; dash.forEach(function (a) { var r0 = 30 + 30 * q2, r1 = 30 + 60 * q2; ctx.beginPath(); ctx.moveTo(160 + r0 * Math.cos(a), 100 + r0 * Math.sin(a) * 0.7); ctx.lineTo(160 + r1 * Math.cos(a), 100 + r1 * Math.sin(a) * 0.7); ctx.stroke(); }); }
          ctx.globalAlpha = 1;
        });
      };
  MW.textShockwaveType = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
</script>
