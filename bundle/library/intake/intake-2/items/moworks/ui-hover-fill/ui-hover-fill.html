<!--
  Button Fill Hover (Moworks Studio, the studio's own, written here).
  Source: Moworks Studio.
  Con trỏ đi vào nút viền, màu nhấn loang tròn ra từ đúng điểm vào và chữ đổi màu bên trong vùng màu; con trỏ rời đi thì vùng màu thu về điểm ra.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.uiHoverFill(q(".hf"), tl, 0, { cursor: ".ui-cursor" });

  Options (defaults in brackets):
      - radius: px (680)
      - grow: s (0.62, power2.out)
      - shrink: s (0.44, power2.in)
      - enter: s the cursor enters (0.56)
      - leave: s it leaves (1.86)
      - path: [[s, x, y], ...] cursor keys in the 320 frame, the button at its centre
      - unit: px per reference unit (4)
      - label: 
      - accent: 
      - ink: label colour inside the fill
      - cursor: an optional cursor

  Notes: Outlined pill 140x48 r24 (1.5 px accent border, accent label). Origin = cursor at entry (0.56 s): an accent circle grows to radius 170 px (≈ 420 %) over 0.58-1.2 s power2.out, clipped to the button; label drawn twice (accent outside, dark inside the circle). Leave 1.86 s: shrinks to 0 at the exit point in 440 ms power2.in. Cursor (power2.inOut): (100,186) to 0.2 s, (122,120) 0.6, (146,106) 0.9, (150,104) 1.7, (252,60) 2.05, (266,176) 2.3, start 2.6. Params: radius (170 px) · in (0.62 s, power2.out) · out (0.44 s, power2.in) · point: điểm vào / ra.
-->
