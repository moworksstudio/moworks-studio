<!--
  Scratched Film Jitter (Moworks Studio, the studio's own, written here).
  Source: Moworks Studio.
  Tiêu đề như in trên phim cũ: chạy giật 24 khung, từng chữ lệch rung nhẹ, độ sáng chớp tắt, có bóng chồng lệch, vết xước và bụi; đoạn đầu chập chờn vài khung.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.handFilmJitter(q(".tk-head"), tl, 0, {});

  Options (defaults in brackets):
      - jitter: px of the block (10)
      - letter: px per letter (7.5), ±1.7°
      - ghost: colour of the double exposure (35 %, offset 10-25 px)
      - loop: s (3.2)
      - seed: the frame pattern

  Notes: 24 fps, seeded per frame. Visible 0.3–0.38, 0.5–0.62, 0.75–0.8, then 0.92–2.8 s. Block jitter ±2 px; per letter ±1.5 px and ±1.7°; opacity flicker 0.85–1 with a matching full-frame darkening (0–15 %). Double exposure: mute copy at 35 %, offset +2–5 px x and half that up. Thin dark scratches inside the letters; 0–2 vertical scratches, ~50 dust specks and an occasional blob per frame; optional sprocket edges shifting 3 px every other frame. Loop 3.2 s. Params: nhịp (24 fps) · rung (±2 px khối, ±1.5 px mỗi chữ) · chớp sáng (85–100 %) · chồng hình (2–5 px, 35 %).
-->

<div class="tk-stage"><div><h1 class="tk-head ">NGÀY XƯA ẤY</h1></div></div>

<script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.rand = MW.rand || function (seed) {
    var a = typeof seed === "string" ? MW.hash(seed) : (seed >>> 0) || 1;
    return function () { a = (a + 0x6d2b79f5) >>> 0; var t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  };
  MW.hash = MW.hash || function (s) { var h = 2166136261; s = String(s); for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; };
  MW.split = MW.split || function (el, mode) {
    el = MW.el(el);
    if (el.__mwSplit) return el.__mwSplit;
    var seg = typeof Intl !== "undefined" && Intl.Segmenter ? new Intl.Segmenter("vi", { granularity: "grapheme" }) : null;
    var graphemes = function (s) { if (seg) { var out = []; var it = seg.segment(s)[Symbol.iterator](), r; while (!(r = it.next()).done) out.push(r.value.segment); return out; } return Array.from(s); };
    var res = { chars: [], words: [], lines: [] };
    var walk = function (node) {
      var kids = Array.prototype.slice.call(node.childNodes);
      for (var k = 0; k < kids.length; k++) {
        var n = kids[k];
        if (n.nodeType === 1) { if (n.tagName === "BR") continue; walk(n); continue; }
        if (n.nodeType !== 3) continue;
        var text = n.nodeValue.normalize("NFC"), frag = document.createDocumentFragment();
        var parts = text.split(/(\s+)/);
        for (var p = 0; p < parts.length; p++) {
          var part = parts[p];
          if (!part) continue;
          if (/^\s+$/.test(part)) { frag.appendChild(document.createTextNode(part)); continue; }
          var w = document.createElement("span");
          w.className = "mw-w"; w.style.display = "inline-block"; w.style.whiteSpace = "nowrap";
          if (mode === "words") w.textContent = part;
          else { var gs = graphemes(part); for (var g = 0; g < gs.length; g++) { var c = document.createElement("span"); c.className = "mw-ch"; c.style.display = "inline-block"; c.textContent = gs[g]; w.appendChild(c); res.chars.push(c); } }
          res.words.push(w); frag.appendChild(w);
        }
        node.replaceChild(frag, n);
      }
    };
    walk(el);
    var top = null, line = null;
    for (var i = 0; i < res.words.length; i++) { var y = res.words[i].offsetTop; if (top === null || Math.abs(y - top) > 2) { top = y; line = []; res.lines.push(line); } line.push(res.words[i]); }
    el.__mwSplit = res;
    return res;
  };
  MW.drive = MW.drive || function (tl, at, dur, fn) {
    var s = { t: 0 }; fn(0);
    tl.fromTo(s, { t: 0 }, { t: dur, duration: dur, ease: "none", immediateRender: false, onUpdate: function () { fn(s.t); } }, at);
    return at + dur;
  };
  MW.canvas = MW.canvas || function (host, w, h) {
    host = MW.el(host);
    var cv = document.createElement("canvas"); w = w || host.clientWidth || 1920; h = h || host.clientHeight || 1080;
    cv.width = w; cv.height = h; cv.style.position = "absolute"; cv.style.left = "0"; cv.style.top = "0"; cv.style.width = w + "px"; cv.style.height = h + "px"; cv.style.pointerEvents = "none";
    host.appendChild(cv);
    return { cv: cv, ctx: cv.getContext("2d"), w: w, h: h };
  };
  var defaults = {"jitter":10,"letter":7.5,"ghost":"#6c778b","loop":3.2,"seed":6};
  var run = function (el, tl, at, o) {
        var ch = MW.split(el, "chars").chars, host = el.parentNode, ghost = el.cloneNode(true), dark = document.createElement("div"), cv = MW.canvas(host), c = cv.ctx;
        if (getComputedStyle(host).position === "static") host.style.position = "relative";
        ghost.removeAttribute("id"); ghost.style.position = "absolute"; ghost.style.left = el.offsetLeft + "px"; ghost.style.top = el.offsetTop + "px"; ghost.style.width = el.offsetWidth + "px"; ghost.style.margin = "0"; ghost.style.color = o.ghost; ghost.style.opacity = "0.35"; ghost.style.pointerEvents = "none";
        host.insertBefore(ghost, el); dark.style.cssText = "position:absolute;inset:0;background:#000;pointer-events:none;opacity:0;"; host.appendChild(dark); cv.cv.style.zIndex = "5";
        var vis = [[0.3, 0.38], [0.5, 0.62], [0.75, 0.8], [0.92, o.loop - 0.4]];
        return MW.drive(tl, at, o.loop, function (t) {
          var f = Math.floor(t * 24), r = MW.rand(o.seed * 1000 + f), on = vis.some(function (v) { return t >= v[0] && t < v[1]; });
          el.style.visibility = ghost.style.visibility = on ? "visible" : "hidden";
          gsap.set(el, { x: (r() * 2 - 1) * o.jitter, y: (r() * 2 - 1) * o.jitter });
          ch.forEach(function (q) { gsap.set(q, { x: (r() * 2 - 1) * o.letter, y: (r() * 2 - 1) * o.letter, rotation: (r() * 2 - 1) * 1.7 }); });
          var fl = 0.85 + 0.15 * r(); el.style.opacity = String(fl); dark.style.opacity = String((1 - fl)); var off = 10 + r() * 15; gsap.set(ghost, { x: off, y: -off / 2 });
          c.clearRect(0, 0, cv.w, cv.h); if (!on) return;
          c.fillStyle = "rgba(230,225,210,0.55)"; for (var i = 0; i < 50; i++) { c.beginPath(); c.arc(r() * cv.w, r() * cv.h, 1 + r() * 2.5, 0, 2 * Math.PI); c.fill(); }
          if (r() < 0.25) { c.beginPath(); c.arc(r() * cv.w, r() * cv.h, 8 + r() * 14, 0, 2 * Math.PI); c.fill(); }
          var ns = Math.floor(r() * 3); c.strokeStyle = "rgba(230,225,210,0.4)"; c.lineWidth = 2; for (var s = 0; s < ns; s++) { var x = r() * cv.w; c.beginPath(); c.moveTo(x, 0); c.lineTo(x + (r() - 0.5) * 30, cv.h); c.stroke(); }
        });
      };
  MW.handFilmJitter = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
</script>
