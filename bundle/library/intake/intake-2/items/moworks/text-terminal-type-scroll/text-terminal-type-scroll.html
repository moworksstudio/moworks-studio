  Terminal Type & Scroll (Moworks Studio, the studio's own, written here).
  Source: Moworks Studio.
  Khung terminal: lệnh gõ ra 60 ký tự mỗi giây, kết quả hiện cả dòng, mỗi dòng mới đẩy cả khối cuộn lên một dòng, con trỏ khối nhấp nháy.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.textTerminalTypeScroll(q(".tt"), tl, 0, {});

  Options (defaults in brackets):
      - lines: lines; '$ ' starts a typed command, '+ ' a success line
      - cps: characters a second typing (60)
      - rows: visible rows (4)
      - start: s (0.3)
      - body: the panel's text area
      - accent: prompt colour
      - loop: s (5)

  Notes: Mono terminal panel (title bar with 3 dots), 4 visible lines (line-height 1.6; demo 22 px pitch at 12 px type). Command lines type at 60 cps (recipe 30–60), output lines appear whole, 0.17 s apart, 0.12 s after their command; once the panel is full each new line scrolls the block up one line over 0.14 s easeOutCubic (cubic-bezier(.33,1,.68,1)). Prompt sign accent, success lines green. Block cursor █ 0.6 × 1.2 em, solid while typing, blinks 1 Hz (steps). Loop 5 s. Params: lines: các dòng lệnh / kết quả · rate: tốc độ gõ (60 ký tự/giây) · rows: số dòng hiện (4) · scroll (0.14 s).
-->
