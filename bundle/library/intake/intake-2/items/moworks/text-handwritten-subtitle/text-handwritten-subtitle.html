  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.textHandwrittenSubtitle(q(".hw"), tl, 0, {});

  Options (defaults in brackets):
      - cues: 
      - rate: characters a second (17 for Vietnamese; 4 for Japanese)
      - min: s (1)
      - max: s (1.7)
      - gap: s (0.25)
      - start: s (0.35)
      - tilt: ± degrees per letter (4)
      - jitter: [x, y] ± px ([2.8, 6.4])
      - shadow: [x, y] px of the dark copy ([2.4, 3.2])
      - weave: ± px of gate weave each 24 fps frame (1.6)
      - sub: 
      - stage: the picture that weaves
      - seed: (6)
      - loop: s (4.4)

  Notes: Cuts in / out: duration clamp(chars ÷ 4, 1, 1.7) s, 0.25 s gap, from 0.35 s; 21 px weight 500, spacing 0.04 em, near the bottom. Per glyph, seeded: rotation ±4°, scaleX 0.86–0.98, scaleY 0.92–1.08, offset ±0.7 / ±1.6 px, skewX ±3.4°, plus a dark copy at (0.6, 0.8) px 70 %; dakuten redrawn as two bold strokes. Film look: 14 px letterbox bars, grain specks and a ±0.4 px gate weave changing every 24 fps frame. Loop 4.4 s. Params: tốc độ đọc (4 chữ/s, 1–1.7 s mỗi câu) · độ nghiêng mỗi chữ (±4°) · cỡ chữ (21 px). Each glyph is seeded once per cue (rotation, scale, offset, skew), so the line looks written by hand; cuts in and out.
-->
