  Jelly Squash (Moworks Studio, the studio's own, written here).
  Source: Moworks Studio.
  Bấm nút, nút rung bẹp dọc giãn ngang như thạch rồi tắt dần, diện tích giữ nguyên, chân nút đứng yên.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.motionJellySquash(q(".js"), tl, 0, { cursor: ".ui-cursor" });

  Options (defaults in brackets):
      - press: s (0.55)
      - amp: (0.2)
      - freq: rad/s (17)
      - decay: (3.4)
      - fadeStart: s after the press the wobble fades from (1.6)
      - fadeEnd: (2.0)
      - cursor: an optional cursor that makes the clicks
      - approach: [x, y] px the cursor comes from
      - lead: s it arrives before a click

  Notes: On press (0.55 s): d(t) = 0.2 × e^(−3.4 t) × cos(17 t), ramped in over 50 ms (power1.out); scaleX = 1 + d, scaleY = 1 / (1 + d) (area kept), origin bottom centre; the wobble lasts about 1.3 s and is faded to 0 between 1.6-2.0 s after the press. Equivalent spring k290 d6.8. Button 140x46 r16. Params: at · amp (0.2) · freq (17 rad/s) · decay (3.4) · origin (đáy giữa). d(t) = amp × e^(−decay t) × cos(freq t); scaleX = 1 + d, scaleY = 1 / (1 + d), so the area is kept; about a spring k 290, damping 6.8.
-->
