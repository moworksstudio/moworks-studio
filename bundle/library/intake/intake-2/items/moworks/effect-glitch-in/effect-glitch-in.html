<!--
  Glitch In (Moworks Studio, the studio's own, written here).
  Source: Moworks Studio.
  Phần tử hiện ra bị cắt thành lát ngang giật lệch và nghiêng trong nửa đầu, lệch nhẹ 2 px rồi sạch hẳn.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.effectGlitchIn(q(".tk-head"), tl, 0.3, { exitAt: 1.6 });

  Options (defaults in brackets):
      - duration: s (0.65, linear)
      - slices: (8)
      - amp: ± px (40)
      - skew: ± degrees (5)
      - seed: (3)
      - accent2: ghost and bar colour
      - exitAt: s after the start for a 0.1 s glitch out (null)

  Notes: Element cut into 8 horizontal slices re-randomised 30 times / s (seeded). 0-45 % of 650 ms: each slice x +-14 px and skewX +-5 deg, ~1 in 5 slices hidden per frame, an additive ghost copy 4 px left at 70 %, 3 thin 2 px bars in the second accent. 45-65 %: whole element x -2 px. 65-100 %: clean. Linear timing. Demo: in at 0.3 s, a 100 ms glitch-out at 1.9 s. DOM keyframes also fade 0.25 -> 1. Params: duration (0.65 s) · slices (8) · amp (14 px) · skew (5°) · seed. Slices re-randomise 30 times a second (seeded); about one in five is hidden on each frame.
-->

<div class="tk-stage"><div><h1 class="tk-head ">TÍN HIỆU</h1></div></div>

<style>

</style>

<script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.rand = MW.rand || function (seed) {
    var a = typeof seed === "string" ? MW.hash(seed) : (seed >>> 0) || 1;
    return function () { a = (a + 0x6d2b79f5) >>> 0; var t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  };
  MW.hash = MW.hash || function (s) { var h = 2166136261; s = String(s); for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; };
  MW.drive = MW.drive || function (tl, at, dur, fn) {
    var s = { t: 0 }; fn(0);
    tl.fromTo(s, { t: 0 }, { t: dur, duration: dur, ease: "none", immediateRender: false, onUpdate: function () { fn(s.t); } }, at);
    return at + dur;
  };
  var defaults = {"duration":0.65,"slices":8,"amp":40,"skew":5,"seed":3,"accent2":"#3dd6f5","exitAt":null};
  var run = function (el,tl,at,o
  ) {
  var host = el.parentNode; if (getComputedStyle(host).position === "static") host.style.position = "relative";
  var clone = function () { var g = el.cloneNode(true); g.removeAttribute("id"); g.style.position = "absolute"; g.style.margin = "0"; g.style.pointerEvents = "none"; g.style.boxSizing = "border-box";
    g.style.left = el.offsetLeft + "px"; g.style.top = el.offsetTop + "px"; var br = el.getBoundingClientRect(); g.style.width = (br.width + 0.5) + "px"; g.style.height = el.offsetHeight + "px"; host.insertBefore(g, el.nextSibling); return g; };
  var sl = [], n = o.slices, gh = clone(), bars = [];
  for (var i = 0; i < n; i++) { var g = clone(); g.style.clipPath = "inset(" + (100 * i / n).toFixed(3) + "% 0 " + (100 - 100 * (i + 1) / n).toFixed(3) + "% 0)"; g.style.opacity = "0"; sl.push(g); }
  gh.style.mixBlendMode = "lighter"; gh.style.color = o.accent2; gh.style.webkitTextFillColor = o.accent2; gh.style.opacity = "0";
  for (var b = 0; b < 3; b++) { var d = document.createElement("div"); d.style.cssText = "position:absolute;height:6px;pointer-events:none;opacity:0;background:" + o.accent2 + ";"; host.appendChild(d); bars.push(d); }
  var L = el.offsetLeft, Tp = el.offsetTop, W = el.offsetWidth, Hh = el.offsetHeight;
  var mess = function (t, a) { var f = Math.floor(t * 30), r = MW.rand(o.seed * 977 + f * 13); el.style.opacity = "0";
    sl.forEach(function (g) { var hide = r() < 0.2; gsap.set(g, { x: (r() * 2 - 1) * o.amp, skewX: (r() * 2 - 1) * o.skew }); g.style.opacity = hide ? "0" : String(a); });
    gsap.set(gh, { x: -12 + (r() * 2 - 1) * 6 }); gh.style.opacity = String(0.7 * a); bars.forEach(function (d) { d.style.left = L + r() * W * 0.6 + "px"; d.style.top = Tp + r() * Hh + "px"; d.style.width = W * (0.15 + r() * 0.35) + "px"; d.style.opacity = String(a); }); };
  var clean = function (show) { sl.forEach(function (g) { g.style.opacity = "0"; }); gh.style.opacity = "0"; bars.forEach(function (d) { d.style.opacity = "0"; }); el.style.opacity = show ? "1" : "0"; };
  return MW.drive(tl, at, o.exitAt == null ? o.duration : o.exitAt + 0.1, function (t) {
    var u = t / o.duration; if (t <= 0) { clean(false); return; }
    if (o.exitAt != null && t >= o.exitAt) { if (t < o.exitAt + 0.1) mess(t, 1); else clean(false); gsap.set(el, { x: 0 }); return; }
    if (u < 0.45) { mess(t, 0.25 + 0.75 * u / 0.45); gsap.set(el, { x: 0 }); } else if (u < 0.65) { clean(true); gsap.set(el, { x: -2 }); } else { clean(true); gsap.set(el, { x: 0 }); }
  });
  };
  MW.effectGlitchIn = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
</script>
