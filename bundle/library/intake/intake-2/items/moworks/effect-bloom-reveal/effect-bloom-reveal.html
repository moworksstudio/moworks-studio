  Source: Moworks Studio.
  Biểu tượng hiện ra trong ánh loá: sáng chói, nhoè và có quầng lớn, rồi dịu dần về rõ nét.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.effectBloomReveal(q(".br-t"), tl, 0.5, {});

  Options (defaults in brackets):
      - duration: s (0.78), power3.out
      - blur: px at the start (12)
      - unit: px per reference unit for the halo (5)
      - color: halo colour

  Notes: Logo / icon reveal 780 ms power3.out (easeOutQuart): scale 0.82 → 1, brightness 3 → 1 (exposure +2), blur 4 → 0 px; an additive halo (two discs, radius 30 + 0.8 g and 44 + g px, opacity 0.9·g/38 and 0.6·g/38, blur g/2) with glow g 38 → 8 (at 540 ms) → 0 (780 ms) fading with it. Params: duration (0.78 s) · exposure (+2) · glow (38 → 8 → 0) · scale đầu (0.82).
-->
