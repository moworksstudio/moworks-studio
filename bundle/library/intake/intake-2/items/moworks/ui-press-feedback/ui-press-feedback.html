<!--
  Press Feedback (Moworks Studio, the studio's own, written here).
  Source: Moworks Studio.
  Nút thu nhỏ còn 94 % và bóng đổ giảm còn 25 % khi bị bấm, rồi nảy về ngay.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.uiPressFeedback(q(".pb"), tl, 0.9, {});

  Options (defaults in brackets):
      - scale: pressed scale (0.94)
      - down: s to press, ease-out (0.12)
      - up: s back (0.3)
      - depth: px of the slab under the button (18)
      - shadow: slab and shadow while pressed, × (0.25)
      - slab: slab colour

  Notes: Button (132×46, r 14) presses: scale 1 → 0.94 in 120 ms power2.out, holds 60 ms, back to 1 in 300 ms power2.out; its under-slab depth (6 px) and drop shadow fall to 25 % while pressed and return with it. A cursor glides in (450 ms) and clicks. Params: scale (0.94) · down (0.12 s) · up (0.3 s) · shadow (25 %).
-->

<div class="ui-wrap"><div class="ui-btn pb" style="width:396px;height:138px;border-radius:42px;font-size:44px;box-shadow:0 18px 0 #4a33b8, 0 45px 72px rgba(0,0,0,0.45)">Xác nhận</div><svg class="ui-cursor" viewBox="0 0 32 32" width="64" height="64"><path d="M6 3 L6 25 L12 19.5 L16 28.5 L20 26.8 L16 18 L24 18 Z" fill="#fff" stroke="#111" stroke-width="1.6" stroke-linejoin="round"/></svg></div>

<style>

</style>

<script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.drive = MW.drive || function (tl, at, dur, fn) {
    var s = { t: 0 }; fn(0);
    tl.fromTo(s, { t: 0 }, { t: dur, duration: dur, ease: "none", immediateRender: false, onUpdate: function () { fn(s.t); } }, at);
    return at + dur;
  };
  var defaults = {"scale":0.94,"down":0.12,"up":0.3,"depth":18,"shadow":0.25,"slab":"#4a33b8"};
  var run = function (el, tl, at, o) {
        var out = gsap.parseEase("power2.out"), down = o.down, hold = 0.06, up = o.up;
        return MW.drive(tl, at, down + hold + up, function (t) {
          var k = t < down ? out(t / down) : t < down + hold ? 1 : 1 - out((t - down - hold) / up), d = o.depth * (1 - (1 - o.shadow) * k);
          gsap.set(el, { scale: 1 - (1 - o.scale) * k, y: (o.depth - d) });
          el.style.boxShadow = "0 " + d + "px 0 " + o.slab + ", 0 " + (d * 2.5) + "px " + (d * 4) + "px rgba(0,0,0," + (0.45 * (1 - 0.75 * k)) + ")";
        });
      };
  MW.uiPressFeedback = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
</script>
