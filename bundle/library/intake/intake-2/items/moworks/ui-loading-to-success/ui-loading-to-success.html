      - r: px spinner radius (44)
      - width: px stroke (12)
      - spin: s per turn, linear (0.7)
      - arc: [short, long] radians ([0.7, 3.7])
      - breath: s each way (0.7)
      - closeAt: s the arc closes (1.3)
      - close: s (0.3, power2.inOut)
      - resetAt: s (2.35)
      - loop: s (3)
      - accent: 
      - ink: tick colour
      - label: a line under the button
      - doneText: 
      - cursor: an optional cursor that makes the clicks
      - approach: [x, y] px the cursor comes from
      - lead: s it arrives before a click

  Notes: Pill 140x44 outlined. Spinner r11, 3 px arc, round caps, rotating linear 0.7 s per turn; arc length breathes 0.7 ↔ 3.7 rad (sine, 0.7 s each way). 1.3-1.6 s the arc grows to a full circle (power2.inOut) and fades 1.6-1.7 s; at 1.6 s an accent disc r13 pops (back.out 0.25 s) on the same spot and a tick draws 1.7-1.95 s (power2.out). Label below 'processing' → 'done'. Reset 2.35-2.55 s, spinner back 2.5-2.8 s. Params: spin (0.7 s / vòng) · arc (0.7 ↔ 3.7 rad) · close (0.3 s) · pop (back.out 0.25 s) · at.
