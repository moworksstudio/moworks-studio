<!--
  Speedline Tunnel (Moworks Studio, the studio's own, written here).
  Source: Moworks Studio.
  Bốn mươi vạch toả từ tâm khung lao ra ngoài, càng ra xa càng dài và dày; tốc độ tăng dần rồi giảm, chữ ở giữa phồng nhẹ và rung khi chạy nhanh nhất.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.backgroundSpeedLinesTunnel(q(".gm"), tl, 0, {});

  Options (defaults in brackets):
      - lines: radial lines (40), every 6th in the accent
      - cycles: passes per loop (6)
      - loop: s of the loop (4.2): speed ramps up 0.3-1.1 s and down 3.2-3.9 s
      - seed: angles and phases

  Notes: px @320x200. 40 radial lines at fixed angles (±3.4° seeded jitter) stream outward: phase u = fract(ph + seed) gives radius 16 + 190u², length (6 + 70v)u² + 3, width 0.8 + 2.2u, opacity min(1, 3u) × (0.4 + 0.6v); every 6th line accent, others grey. Speed v = 0.2 + 0.8 × (0.3-1.1 s inOut ramp − 3.2-3.9 s ramp); ph = ∫v normalised to 6 cycles per 4.2 s loop. Centre dot r 3; word (30 px) scales 1 + 0.08v and jitters ±0.75 px x at 30 Hz while v > 0.9. Params: lines: số vạch (40, mỗi vạch thứ 6 màu nhấn) · speed: tốc độ (×0.2 → ×1) · ramp: lúc tăng / giảm (0.3-1.1 s / 3.2-3.9 s) · cycles: số lượt mỗi vòng lặp (6).
-->

<div class="gm"><div class="w" style="font-size:150px;color:#fff;z-index:2">LAO TỚI</div></div>

<script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.rand = MW.rand || function (seed) {
    var a = typeof seed === "string" ? MW.hash(seed) : (seed >>> 0) || 1;
    return function () { a = (a + 0x6d2b79f5) >>> 0; var t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  };
  MW.hash = MW.hash || function (s) { var h = 2166136261; s = String(s); for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; };
  MW.drive = MW.drive || function (tl, at, dur, fn) {
    var s = { t: 0 }; fn(0);
    tl.fromTo(s, { t: 0 }, { t: dur, duration: dur, ease: "none", immediateRender: false, onUpdate: function () { fn(s.t); } }, at);
    return at + dur;
  };
  MW.canvas = MW.canvas || function (host, w, h) {
    host = MW.el(host);
    var cv = document.createElement("canvas"); w = w || host.clientWidth || 1920; h = h || host.clientHeight || 1080;
    cv.width = w; cv.height = h; cv.style.position = "absolute"; cv.style.left = "0"; cv.style.top = "0"; cv.style.width = w + "px"; cv.style.height = h + "px"; cv.style.pointerEvents = "none";
    host.appendChild(cv);
    return { cv: cv, ctx: cv.getContext("2d"), w: w, h: h };
  };
  MW.stage320 = MW.stage320 || function (host) {
    host = MW.el(host); if (getComputedStyle(host).position === "static") host.style.position = "relative";
    var c = MW.canvas(host), k = Math.min(c.w / 320, c.h / 200), ox = (c.w - 320 * k) / 2, oy = (c.h - 200 * k) / 2;
    return { ctx: c.ctx, cv: c.cv, k: k, ox: ox, oy: oy, w: c.w, h: c.h,
      clear: function () { c.ctx.setTransform(1, 0, 0, 1, 0, 0); c.ctx.clearRect(0, 0, c.w, c.h); c.ctx.setTransform(k, 0, 0, k, ox, oy); },
      put: function (el, x, y) { el.style.position = "absolute"; el.style.left = (ox + x * k) + "px"; el.style.top = (oy + y * k) + "px"; gsap.set(el, { xPercent: -50, yPercent: -50 }); } };
  };
  var defaults = {"lines":40,"cycles":6,"loop":4.2,"seed":11};
  var run = function (el, tl, at, o) {
        var S = MW.stage320(el), ctx = S.ctx, w = el.querySelector(".w"), r = MW.rand(o.seed), io = gsap.parseEase("power2.inOut"), L = [];
        for (var i = 0; i < o.lines; i++) L.push({ a: (i / o.lines) * 2 * Math.PI + (r() * 2 - 1) * 0.06, ph: r(), acc: i % 6 === 0 });
        if (w) S.put(w, 160, 100);
        var v = function (t) { return 0.2 + 0.8 * (io(Math.max(0, Math.min(1, (t - 0.3) / 0.8))) - io(Math.max(0, Math.min(1, (t - 3.2) / 0.7)))); };
        var dt = 1 / 120, tot = 0; for (var s = 0; s < o.loop; s += dt) tot += v(s) * dt; var c = o.cycles / tot;
        return MW.drive(tl, at, o.loop, function (t) {
          var ph = 0; for (var s = 0; s < t; s += dt) ph += v(s) * dt * c; var vv = v(t);
          S.clear();
          L.forEach(function (l) {
            var u = (ph + l.ph) % 1, R = 16 + 190 * u * u, len = (6 + 70 * vv) * u * u + 3;
            ctx.globalAlpha = Math.min(1, 3 * u) * (0.4 + 0.6 * vv); ctx.strokeStyle = l.acc ? "#8b7bff" : "#8f9ab3"; ctx.lineWidth = 0.8 + 2.2 * u; ctx.lineCap = "round";
            ctx.beginPath(); ctx.moveTo(160 + R * Math.cos(l.a), 100 + R * Math.sin(l.a)); ctx.lineTo(160 + (R + len) * Math.cos(l.a), 100 + (R + len) * Math.sin(l.a)); ctx.stroke();
          });
          ctx.globalAlpha = 1; ctx.fillStyle = "#e8ebf3"; ctx.beginPath(); ctx.arc(160, 100, 3, 0, 2 * Math.PI); ctx.fill();
          if (w) gsap.set(w, { scale: 1 + 0.08 * vv, x: vv > 0.9 ? (Math.floor(t * 30) % 2 ? 0.75 : -0.75) * S.k : 0 });
        });
      };
  MW.backgroundSpeedLinesTunnel = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
</script>
