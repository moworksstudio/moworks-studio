  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.uiButtonShine(q(".bs"), tl, 0, {});

  Options (defaults in brackets):
      - duration: s per pass (0.7)
      - ease: (power2.inOut)
      - times: s each pass starts
      - band: px (72)
      - thin: px (24)
      - slant: px the top edge leads (112)
      - ahead: px the thin band leads (104)
      - light: [band, thin] white opacity
      - cursor: an optional cursor that makes the clicks
      - approach: [x, y] px the cursor comes from
      - lead: s it arrives before a click

  Notes: Accent button 140x44 r14 'UPGRADE'. A slanted light band (parallelogram 18 px wide, top edge 28 px ahead of the bottom edge, 85 % light) and a thin 6 px band 26 px ahead of it (70 %) travel x 52 → 270 (across the frame) over 0.6-1.3 s (700 ms) power2.inOut, clipped to the button face; once per pass. Params: duration (0.7 s, power2.inOut) · band (18 px + 6 px) · slant (28 px) · at.
-->
