  Blur Crossfade (Moworks Studio, the studio's own, written here).
  Source: Moworks Studio.
  Từ cũ nhoè 10 px và mờ đi trong khi từ mới rõ dần ở đúng chỗ đó, cùng lúc trong 0.6 giây.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.textBlurCrossfade(q(".bc"), tl, 0, {});

  Options (defaults in brackets):
      - a: the word shown first
      - b: the word in the same spot
      - duration: s (0.6)
      - blur: px (30)
      - at: s (0.8)
      - backAt: s (2.6)

  Notes: Two words stacked in the same spot. Swap: old opacity 1 → 0 and blur 0 → 10 px while new opacity 0 → 1 and blur 10 → 0 px, together, 0.6 s cubic-bezier(.65,0,.35,1) (recipe range 0.4–0.7 s). Demo: A → B 0.8–1.4 s, back 2.6–3.2 s; new word in accent; loop 3.6 s. Params: to: từ mới · duration (0.6 s) · blur (10 px) · ease (cubic-bezier(.65,0,.35,1)).
-->
