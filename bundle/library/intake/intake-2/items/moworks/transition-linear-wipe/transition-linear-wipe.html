<!--
  Linear Wipe (Moworks Studio, the studio's own, written here).
  Source: Moworks Studio.
  Một mép thẳng quét ngang lộ cảnh mới, cảnh cũ đứng yên, có thể kèm một vạch màu thương hiệu chạy theo mép.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.transitionLinearWipe(q(".tk-b"), tl, 1.2, {});

  Options (defaults in brackets):
      - duration: s (0.5)
      - direction: the way the edge travels: right (default), left, up, down
      - bar: px of the brand bar riding the edge (4; 0 for none; ×3 here)
      - color: the bar's colour
      - ease: power2.inOut
      - from: the outgoing scene

  Notes: Incoming scene revealed by a straight clip edge, clip width 0 -> 100 % over 500 ms easeInOutCubic; the outgoing scene does not move; optional 4 px brand-colour bar riding the edge. Directions left / right / up / down. Params: duration (0.5 s) · direction (trái / phải / lên / xuống) · bar: vạch mép (4 px).
-->

<section class="tk-scene tk-a"><div class="tk-mark circle"></div><div class="tk-sc-text"><div class="tk-sc-letter">A</div><div class="tk-sc-cap">Cảnh mở đầu</div></div></section>
<section class="tk-scene tk-b"><div class="tk-mark square"></div><div class="tk-sc-text"><div class="tk-sc-letter">B</div><div class="tk-sc-cap">Cảnh tiếp theo</div></div></section>

<style>

</style>

<script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.drive = MW.drive || function (tl, at, dur, fn) {
    var s = { t: 0 }; fn(0);
    tl.fromTo(s, { t: 0 }, { t: dur, duration: dur, ease: "none", immediateRender: false, onUpdate: function () { fn(s.t); } }, at);
    return at + dur;
  };
  var defaults = {"duration":0.5,"direction":"right","bar":12,"color":"#ffb547","ease":"power2.inOut","from":null};
  var run = function (el, tl, at, o) {
        var out = o.from ? MW.el(o.from) : el.previousElementSibling, ease = gsap.parseEase(o.ease), W = el.offsetWidth, H = el.offsetHeight, bar = null;
        if (o.bar > 0) { bar = document.createElement("div"); bar.style.cssText = "position:absolute;pointer-events:none;background:" + o.color + ";"; el.parentNode.appendChild(bar); }
        return MW.drive(tl, at, o.duration, function (t) {
          var p = ease(t / o.duration), r = (1 - p) * 100, d = o.direction;
          var inset = d === "right" ? "0 " + r + "% 0 0" : d === "left" ? "0 0 0 " + r + "%" : d === "down" ? "0 0 " + r + "% 0" : "0 0 " + 0 + "% 0";
          if (d === "up") inset = r + "% 0 0 0";
          el.style.clipPath = "inset(" + inset + ")"; el.style.visibility = t > 0 ? "visible" : "hidden";
          if (out) out.style.visibility = p >= 1 ? "hidden" : "visible";
          if (bar) {
            var on = t > 0 && p < 1; bar.style.display = on ? "block" : "none";
            if (d === "right" || d === "left") { var x = d === "right" ? W * p : W * (1 - p); bar.style.left = (x - o.bar / 2) + "px"; bar.style.top = "0"; bar.style.width = o.bar + "px"; bar.style.height = H + "px"; }
            else { var y = d === "down" ? H * p : H * (1 - p); bar.style.top = (y - o.bar / 2) + "px"; bar.style.left = "0"; bar.style.height = o.bar + "px"; bar.style.width = W + "px"; }
          }
        });
      };
  MW.transitionLinearWipe = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
</script>
