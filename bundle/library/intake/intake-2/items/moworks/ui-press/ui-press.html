  Button Press (Moworks Studio, the studio's own, written here).
  Source: Moworks Studio.
  Con trỏ bấm, nút co còn 0.95 trong khoảng 0.08 s và giữ trong lúc nhấn, thả ra thì bật về đúng cỡ bằng lò xo vượt rất nhẹ.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.uiPress(q(".pr"), tl, 0, { cursor: ".ui-cursor" });

  Options (defaults in brackets):
      - press: s (0.6)
      - release: s (0.75)
      - down: (0.95)
      - downTime: s (0.08, power2.out)
      - k: spring stiffness on release (300)
      - c: damping (14): about 1.3 % overshoot
      - cursor: an optional cursor that makes the clicks
      - approach: [x, y] px the cursor comes from
      - lead: s it arrives before a click

  Notes: Pill 140x48 r24. Press at 0.6 s: scale 1 → 0.95 over 80 ms power2.out (data: 80-120 ms, easeOutQuad); held until 0.75 s; release: back to 1 on a spring k300 c14 (≈ 1.3 % overshoot, settled by ≈ 0.5 s); recipe variant: 200 ms back.out. The cursor arrives from 60 px right / 40 px below over 0.1-0.55 s power2.out and shows its pressed state while held. Params: at · hold (0.15 s) · down (0.95, 0.08 s) · release (lò xo k300 c14 | 0.2 s back.out). The recipe's variant releases with 0.2 s back.out.
-->
