<!--
  Slats / Blinds (Moworks Studio, the studio's own, written here).
  Source: Moworks Studio.
  Bảy thanh dọc lần lượt từ trái sang mở rộng từ mép trái của mình, ghép lại thành cảnh mới.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.transitionBlinds(q(".tk-b"), tl, 1.2, {});

  Options (defaults in brackets):
      - slats: vertical slats (7)
      - stagger: s between slats, left to right (0.05)
      - each: s each slat takes to open from its left edge (0.4)
      - from: the outgoing scene

  Notes: 7 vertical slats of equal width; slat i (left to right) starts at i x 50 ms and opens its width 0 -> full from its left edge over 400 ms easeOutCubic, revealing the incoming scene; ~700 ms total. HF showcase-cover ships horizontal and vertical blinds (Apache-2.0). Params: slats (7) · stagger (50 ms) · duration mỗi thanh (0.4 s).
-->

<section class="tk-scene tk-a"><div class="tk-mark circle"></div><div class="tk-sc-text"><div class="tk-sc-letter">A</div><div class="tk-sc-cap">Cảnh mở đầu</div></div></section>
<section class="tk-scene tk-b"><div class="tk-mark square"></div><div class="tk-sc-text"><div class="tk-sc-letter">B</div><div class="tk-sc-cap">Cảnh tiếp theo</div></div></section>

<style>

</style>

<script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.drive = MW.drive || function (tl, at, dur, fn) {
    var s = { t: 0 }; fn(0);
    tl.fromTo(s, { t: 0 }, { t: dur, duration: dur, ease: "none", immediateRender: false, onUpdate: function () { fn(s.t); } }, at);
    return at + dur;
  };
  var defaults = {"slats":7,"stagger":0.05,"each":0.4,"from":null};
  var run = function (el, tl, at, o) {
        var out = o.from ? MW.el(o.from) : el.previousElementSibling, ease = gsap.parseEase("power2.out"), W = el.offsetWidth, H = el.offsetHeight, n = o.slats, sw = W / n;
        var total = (n - 1) * o.stagger + o.each;
        return MW.drive(tl, at, total, function (t) {
          // the union of the slats as one polygon: each slat drawn from the bottom edge, joined along it (zero-area threads)
          var pts = [], done = true;
          for (var i = 0; i < n; i++) {
            var p = ease(Math.max(0, Math.min(1, (t - i * o.stagger) / o.each))), x0 = i * sw, x1 = x0 + sw * p + (p > 0 ? 0.5 : 0);
            if (p < 1) done = false;
            pts.push(x0 + "px " + H + "px", x0 + "px 0px", x1 + "px 0px", x1 + "px " + H + "px");
          }
          el.style.clipPath = done ? "none" : "polygon(" + pts.join(",") + ")"; el.style.visibility = t > 0 ? "visible" : "hidden";
          if (out) out.style.visibility = done ? "hidden" : "visible";
        });
      };
  MW.transitionBlinds = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
</script>
