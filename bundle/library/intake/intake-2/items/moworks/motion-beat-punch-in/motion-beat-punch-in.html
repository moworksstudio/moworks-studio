<!--
  Punch-in on the Beat (Moworks Studio, the studio's own, written here).
  Source: Moworks Studio.
  Mỗi phách mạnh khung phóng vụt lên một chút rồi lùi về rất nhanh, mạnh hơn sau đoạn drop.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.motionBeatPunchIn(q(".tk-cam"), tl, 0.3, { beats: 6 });

  Options (defaults in brackets):
      - bpm: tempo (120)
      - beats: number of beats (6)
      - amp: scale jump on a beat (0.03)
      - ampDrop: after the drop (0.07)
      - dropAt: beat index where the drop starts (0: every beat as after a drop, as the small demo)
      - tau: s, decay time constant (0.11)

  Notes: On each downbeat scale jumps by +0.03 (+0.07 after the drop) and decays back with time constant 0.11 s: s = 1 + A e^(-t / 0.11). Demo: A 0.07 every 0.5 s (120 BPM). Params: amp (0.03 / 0.07) · decay (τ 0.11 s) · beats.
-->

<div class="tk-cam"><div class="tk-far" data-depth="0.2"><div class="sun"></div><div class="star" style="left:12%;top:14%"></div><div class="star" style="left:24%;top:30%"></div><div class="star" style="left:36%;top:10%"></div><div class="star" style="left:70%;top:18%"></div><div class="star" style="left:82%;top:34%"></div><div class="star" style="left:90%;top:12%"></div><div class="star" style="left:46%;top:22%"></div><div class="star" style="left:16%;top:40%"></div></div>

<script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.drive = MW.drive || function (tl, at, dur, fn) {
    var s = { t: 0 }; fn(0);
    tl.fromTo(s, { t: 0 }, { t: dur, duration: dur, ease: "none", immediateRender: false, onUpdate: function () { fn(s.t); } }, at);
    return at + dur;
  };
  var defaults = {"bpm":120,"beats":6,"amp":0.03,"ampDrop":0.07,"dropAt":0,"tau":0.11};
  var run = function (el, tl, at, o) {
        var beat = 60 / o.bpm;
        return MW.drive(tl, at, beat * o.beats, function (t) {
          var k = Math.floor(t / beat + 1e-6), d = t - k * beat, A = k >= o.dropAt ? o.ampDrop : o.amp;
          gsap.set(el, { scale: t >= beat * o.beats ? 1 : 1 + A * Math.exp(-d / o.tau) });
        });
      };
  MW.motionBeatPunchIn = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
</script>
