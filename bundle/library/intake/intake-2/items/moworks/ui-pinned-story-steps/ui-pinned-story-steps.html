      - steps: [[title, line], ...] (3)

  Notes: Left column (clipped 142x150): 3 text steps 60 px apart; step position s: 0 hold to 0.4 s → 1 at 1.1 → hold to 1.8 → 2 at 2.5 → hold to 3.4 → back to 0 at 3.9 (power2.inOut, 0.7 s per step). Active step opacity 1 with accent number, others 0.28; accent marker bar fixed at the reading line. Right: pinned card 136x140 r12 with 3 nodes on a path; the connector fills accent with s, the active node grows r13 → 16, passed nodes fill accent; 3 page dots. Params: steps (3) · step (0.7 s) · hold (0.7 s) · pitch (60 px) · ease (power2.inOut).
