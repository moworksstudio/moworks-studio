<!--
  Type & Backspace Loop (Moworks Studio, the studio's own, written here).
  Source: Moworks Studio.
  Gõ một từ, chờ, xoá lùi nhanh gấp đôi rồi gõ từ tiếp theo, con trỏ chỉ nhấp nháy khi nghỉ.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.textTypeBackspaceLoop(q(".tbw"), tl, 0, {});

  Options (defaults in brackets):
      - words: words typed in turn
      - type: s per character typing (0.06)
      - back: s per character deleting (0.03)
      - hold: s held before deleting (1.0, at least 0.7)
      - pause: s before the next word (0.28)
      - maxWord: s a word may take to type (0.9)
      - start: s (0.3)
      - slot: the element typed into
      - accent: caret colour
      - loop: s (5.4)

  Notes: Type word 1 at 60 ms / char (demo capped 0.9 s per word), hold (backDelay ≥ 0.7 s; GSAP recipe 1.5 s; demo fills the loop, up to 1.6 s), backspace at 30 ms / char (half the type interval), 0.25–0.3 s pause, type word 2, … (loop or stop on the last). Caret: accent bar ~2.5 px × 1 em, solid while typing / deleting; while idle it blinks as a smooth sine yoyo, 0.5 s per half (ease-in-out; demo floor 0.15 opacity). Demo loop 4.8 s. Params: words: danh sách từ · typeSpeed (0.06 s) · backSpeed (0.03 s) · backDelay: giữ trước khi xoá (≥0.7 s) · loop.
-->

<div class="tbw"><div>Chúng tôi làm <span class="tb"></span></div></div>

<script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.drive = MW.drive || function (tl, at, dur, fn) {
    var s = { t: 0 }; fn(0);
    tl.fromTo(s, { t: 0 }, { t: dur, duration: dur, ease: "none", immediateRender: false, onUpdate: function () { fn(s.t); } }, at);
    return at + dur;
  };
  var defaults = {"words":["video","phim ngắn","quảng cáo"],"type":0.06,"back":0.03,"hold":1,"pause":0.28,"maxWord":0.9,"start":0.3,"slot":".tb","accent":"#a99bff","loop":5.4};
  var run = function (el,tl,at,o
  ) {
  var seg = typeof Intl !== "undefined" && Intl.Segmenter ? new Intl.Segmenter("vi", { granularity: "grapheme" }) : null;
  var gr = function (s) { s = String(s).normalize("NFC"); if (!seg) return Array.from(s); var out = [], it = seg.segment(s)[Symbol.iterator](), r; while (!(r = it.next()).done) out.push(r.value.segment); return out; };
  var cells = function (el, text) { el.textContent = ""; var word = null; return gr(text).map(function (g) { var s = document.createElement("span"); s.textContent = g; s.style.display = "inline-block"; s.style.whiteSpace = "pre";
    if (g === " ") { word = null; el.appendChild(s); } else { if (!word) { word = document.createElement("span"); word.style.display = "inline-block"; word.style.whiteSpace = "nowrap"; el.appendChild(word); } word.appendChild(s); } return s; }); };
  var slot = el.querySelector(o.slot), caret = document.createElement("span"), words = o.words.map(gr);
  caret.style.cssText = "display:inline-block;width:0.08em;height:1em;vertical-align:-0.12em;margin-left:0.04em;background:" + o.accent + ";"; slot.parentNode.insertBefore(caret, slot.nextSibling);
  // the plan: for each word, type, hold, delete (except the last), pause
  var plan = [], t0 = o.start; words.forEach(function (w, i) { var tp = Math.min(o.type, o.maxWord / w.length); plan.push({ w: w, a: t0, b: t0 + tp * w.length, tp: tp }); t0 += tp * w.length; var hold = Math.max(o.hold, 0.7); plan[i].h = t0 + hold; t0 += hold; if (i < words.length - 1) { plan[i].d = t0 + o.back * w.length; t0 = plan[i].d + o.pause; } else plan[i].d = 1e9; });
  return MW.drive(tl, at, o.loop, function (t) {
    var txt = "", busy = false, idleSince = 0;
    plan.forEach(function (p) { if (t < p.a) return; if (t < p.b) { txt = p.w.slice(0, Math.floor((t - p.a) / p.tp) + 1).join(""); busy = true; } else if (t < p.h) { txt = p.w.join(""); idleSince = p.b; busy = false; } else if (t < p.d) { var k = Math.max(0, p.w.length - Math.floor((t - p.h) / o.back) - 1); txt = p.w.slice(0, k).join(""); busy = true; } else { txt = ""; idleSince = p.d; busy = false; } });
    slot.textContent = txt; var ph = (t - idleSince) / 0.5; caret.style.opacity = busy || t < o.start ? "1" : String(0.15 + 0.85 * (0.5 + 0.5 * Math.cos(Math.PI * ph)));
  });
  };
  MW.textTypeBackspaceLoop = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
</script>
