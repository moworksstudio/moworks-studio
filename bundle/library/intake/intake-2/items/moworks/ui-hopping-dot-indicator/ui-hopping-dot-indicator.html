  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.uiHoppingDotIndicator(q(".gm"), tl, 0, {});

  Options (defaults in brackets):
      - moves: [[s, from, to], ...]
      - labels: 
      - accent: 
      - loop: s (2.8)

  Notes: Dot r6 under 3 tabs 72 px apart. Each move: 0.1 s take-off squash (scaleY −0.35, half sine), hop 0.42 s with x linear and y on a parabola (apex 26 px + 8 px per extra tab), scaleY + 0.18 × |1 − 2u| near take-off and landing, scaleX = 1 / scaleY; landing squash 0.35 × e^(−14 t) × sin(22 t) (half wave); a dashed arc ghost fades 0.6-0.9 s after the move starts. Moves at 0.3, 1.15, 2.0 s (the last spans two tabs). Params: hop (0.42 s) · apex (26 px + 8 px / tab) · squash (0.35) · moves [[giây, từ, tới]]. Take-off squash 0.1 s, a 0.42 s parabolic hop (apex 26 + 8 per extra tab), a damped landing squash, and a dashed arc ghost that fades.
