<!--
  Perspective Calendar Fold (Moworks Studio, the studio's own, written here).
  Source: Moworks Studio.
  Tờ lịch ngày 24 lật lên quanh mép trên (tới −170°), tối dần khi nghiêng và mờ đi sau khi qua đỉnh, để lộ ngày 25 nằm sẵn bên dưới.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.motionCalendarFlip(q(".top"), tl, 0, {});

  Options (defaults in brackets):
      - angle: degrees about the top edge (−170)
      - duration: s (0.8)
      - at: s (0.45)
      - backAt: s (3.05)
      - shade: darkest shade (0.45)
      - perspective: px (2300)

  Notes: Calendar sheet 112x92 under an accent header 112x28 ('OCT') with two rings. The top sheet ('24 THU', 48 px number) rotates about its top edge, rotateX 0 → −170° (perspective 420), 0.8 s power2.inOut at 0.45 s; a dark shade up to 45 % × sin(angle); the next day ('25 FRI') waits beneath; the turned sheet shows a plain back and fades between about 110° and 158°. Back 3.05-3.5 s. Params: angle (−170°) · duration (0.8 s, power2.inOut) · shade (45 %) · edge (top) · perspective (420).
-->

<div class="gm"><div class="cal"><div class="hd">THÁNG 10<i style="left:140px"></i><i style="right:140px"></i></div><div class="pgs"><div class="pg2"><div><b>25</b><span>THỨ SÁU · RA MẮT</span></div></div><div class="pg2 top"><div><b>24</b><span style="color:#5a6275">THỨ NĂM</span></div></div></div></div></div>

<script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.drive = MW.drive || function (tl, at, dur, fn) {
    var s = { t: 0 }; fn(0);
    tl.fromTo(s, { t: 0 }, { t: dur, duration: dur, ease: "none", immediateRender: false, onUpdate: function () { fn(s.t); } }, at);
    return at + dur;
  };
  var defaults = {"angle":-170,"duration":0.8,"at":0.45,"backAt":3.05,"shade":0.45,"perspective":2300};
  var run = function (el, tl, at, o) {
        var io = gsap.parseEase("power2.inOut"), shade = document.createElement("div"), back = document.createElement("div");
        shade.style.cssText = "position:absolute;inset:0;background:#05060a;pointer-events:none;opacity:0;border-radius:inherit;"; el.appendChild(shade);
        back.style.cssText = "position:absolute;inset:0;background:#d9d6cc;border-radius:inherit;visibility:hidden;"; el.appendChild(back);
        el.parentNode.style.perspective = o.perspective + "px";
        return MW.drive(tl, at, o.backAt + 0.45, function (t) {
          var p = t < o.at ? 0 : t < o.at + o.duration ? io((t - o.at) / o.duration) : t < o.backAt ? 1 : 1 - io(Math.min(1, (t - o.backAt) / 0.45)), a = o.angle * p, aa = Math.abs(a);
          gsap.set(el, { rotationX: a, transformOrigin: "50% 0%" });
          var over = aa > 90; back.style.visibility = over ? "visible" : "hidden"; shade.style.opacity = over ? "0" : String(o.shade * Math.sin(aa * Math.PI / 180));
          el.style.opacity = aa < 110 ? "1" : String(Math.max(0, 1 - (aa - 110) / 48));
        });
      };
  MW.motionCalendarFlip = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
</script>
