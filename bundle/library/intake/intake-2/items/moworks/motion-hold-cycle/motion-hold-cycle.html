<!--
  Hold & Cycle (Moworks Studio, the studio's own, written here).
  Source: Moworks Studio.
  Vật vào, dừng lại cho người xem đọc nhưng vẫn phập phồng hay lắc nhẹ trong lúc dừng, rồi mới đi tiếp.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.motionHoldCycle(q(".hc"), tl, 0, {});

  Options (defaults in brackets):
      - enter: s (0.6, expo.out)
      - hold: s (1.8)
      - exit: s (0.6, expo.in)
      - distance: px (700)
      - rock: ± degrees while held (3.4)
      - rockPeriod: s (0.785)
      - pulse: ± scale while held (0.03)
      - pulsePeriod: s (1)

  Notes: Action -> hold -> action, and the hold keeps a small cycle: recipe scale +-3 % on a 1000 ms sine during the hold. Demo: a star enters 0-0.6 s expo.out (x 30 -> 160), holds 0.6-2.4 s rocking +-0.06 rad on sin(8 t), exits 2.4-3.0 s expo.in to x 300. Params: amp (±3 %) · period (1 s) · hold: thời gian dừng. Action → hold → action: the hold keeps a small rock and pulse so the frame never goes dead.
-->

<script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.drive = MW.drive || function (tl, at, dur, fn) {
    var s = { t: 0 }; fn(0);
    tl.fromTo(s, { t: 0 }, { t: dur, duration: dur, ease: "none", immediateRender: false, onUpdate: function () { fn(s.t); } }, at);
    return at + dur;
  };
  var defaults = {"enter":0.6,"hold":1.8,"exit":0.6,"distance":700,"rock":3.4,"rockPeriod":0.785,"pulse":0.03,"pulsePeriod":1};
  var run = function (el, tl, at, o) {
        var eo = gsap.parseEase("expo.out"), ei = gsap.parseEase("expo.in"), ex = o.enter + o.hold;
        return MW.drive(tl, at, ex + o.exit, function (t) { var x = t < o.enter ? -o.distance * (1 - eo(t / o.enter)) : t < ex ? 0 : o.distance * ei(Math.min(1, (t - ex) / o.exit)), h = t >= o.enter && t < ex ? Math.max(0, Math.min(1, (t - o.enter) / 0.2, (ex - t) / 0.2)) : 0, d = t - o.enter;
          gsap.set(el, { x: x, rotation: h * o.rock * Math.sin(2 * Math.PI * d / o.rockPeriod), scale: 1 + h * o.pulse * Math.sin(2 * Math.PI * d / o.pulsePeriod) }); el.style.opacity = String(Math.min(1, t / 0.15) * (1 - Math.max(0, Math.min(1, (t - ex - o.exit + 0.2) / 0.2)))); });
      };
  MW.motionHoldCycle = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
</script>
