<!--
  Curved Loop Marquee (Moworks Studio, the studio's own, written here).
  Source: Moworks Studio.
  Một dòng chữ lặp lại chạy liên tục dọc theo một đường cong uốn lượn, chữ xoay theo hướng đường, nối vòng không thấy chỗ ghép.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.textCurvedMarquee(q(".cm"), tl, 0, {});

  Options (defaults in brackets):
      - text: 
      - size: px (110)
      - amp: px of the wave (150)
      - margin: px past each side (150)
      - speed: px a second (540), rounded so the loop is seamless
      - fade: px at each edge (200)
      - sep: separator colour
      - loop: s (4)

  Notes: Text + ' • ' (separator accent) repeated along an open curve; demo curve spans the frame plus 30 px each side: y = 30 px × sin(2π × 0.9u − 0.5) (one wave and a bit), chars 24 px placed by arc length and rotated to the tangent (chord ±3 px). Offset moves linearly about 110 px/s (1.8 px per frame at 60 fps; recipe 2 px/frame), wrapping every whole unit so there is no seam. Chars fade over 40 px at both frame edges. Loop 4 s. Params: tốc độ (110 px/s) · độ cong (biên độ 30 px) · cỡ chữ (24 px) · ký tự ngăn (•).
-->
