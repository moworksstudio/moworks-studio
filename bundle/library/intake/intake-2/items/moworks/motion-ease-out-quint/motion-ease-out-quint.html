  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.motionEaseOutQuint(q(".ez-b"), tl, 0.5, { duration: 1.2, graph: ".ez-g" });

  Options (defaults in brackets):
      - duration: s (0.7)
      - ease: the curve (cubic-bezier(.22,1,.36,1))
      - prop: the property moved (x)
      - from: start value (0)
      - to: end value (780 px here)
      - graph: a canvas to draw the curve on (a teaching guide; none by default)

  Notes: Target moves 0 → 100 % on cubic-bezier(.22,1,.36,1) (≈ power4.out), 700 ms (0.6–0.8 s). Rule: the common entrance curve of Motion (motion.dev). Small demo: 1200 ms across 114 px beside the curve graph and a 12-frame spacing ruler (guides, not ported). Params: duration (0.7 s; 0.6–0.8) · ease (custom .22,1,.36,1).
