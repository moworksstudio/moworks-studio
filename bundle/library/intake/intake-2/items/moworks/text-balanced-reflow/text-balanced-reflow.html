<!--
  Balanced Wrap Reflow (Moworks Studio, the studio's own, written here).
  Source: Moworks Studio.
  Đoạn chữ được ngắt dòng cân đều chiều dài, mỗi dòng trồi lên từ khe riêng; khi khung hẹp lại, chữ được chia dòng lại và trồi lên lần nữa.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.textBalancedReflow(q(".brt"), tl, 0, {});

  Options (defaults in brackets):
      - wide: card px (1120)
      - narrow: px (640)
      - pad: px (60)
      - card: the card (the text's parent)
      - loop: s (4.8)

  Notes: Card width 280 px; text 34 px wrapped with text-wrap: balance (narrowest width that keeps the greedy line count). At 0.3 s each line rises from +1 line height inside its own line clip, 0.6 s expo.out, stagger 0.08 s per line. Card narrows 280 → 160 px 1.7–2.3 s (cubic-bezier .65,0,.35,1) with the text shown plain and dimmed; after a 150 ms debounce (2.45 s) the new balanced lines rise again the same way. Fade 4.2–4.45 s, card back 4.2–4.5 s. Loop 4.8 s. Params: bề rộng khung (280 → 160 px) · thời gian trồi (0.6 s) · lệch mỗi dòng (0.08 s). Lines are balanced (text-wrap: balance); after the box changes, the new lines rise again (a 150 ms debounce).
-->

<div class="br"><div class="brt">Mỗi dòng chữ được chia đều chiều dài để đoạn văn trông cân đối và dễ đọc hơn</div></div>

</style>

<script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.split = MW.split || function (el, mode) {
    el = MW.el(el);
    if (el.__mwSplit) return el.__mwSplit;
    var seg = typeof Intl !== "undefined" && Intl.Segmenter ? new Intl.Segmenter("vi", { granularity: "grapheme" }) : null;
    var graphemes = function (s) { if (seg) { var out = []; var it = seg.segment(s)[Symbol.iterator](), r; while (!(r = it.next()).done) out.push(r.value.segment); return out; } return Array.from(s); };
    var res = { chars: [], words: [], lines: [] };
    var walk = function (node) {
      var kids = Array.prototype.slice.call(node.childNodes);
      for (var k = 0; k < kids.length; k++) {
        var n = kids[k];
        if (n.nodeType === 1) { if (n.tagName === "BR") continue; walk(n); continue; }
        if (n.nodeType !== 3) continue;
        var text = n.nodeValue.normalize("NFC"), frag = document.createDocumentFragment();
        var parts = text.split(/(\s+)/);
        for (var p = 0; p < parts.length; p++) {
          var part = parts[p];
          if (!part) continue;
          if (/^\s+$/.test(part)) { frag.appendChild(document.createTextNode(part)); continue; }
          var w = document.createElement("span");
          w.className = "mw-w"; w.style.display = "inline-block"; w.style.whiteSpace = "nowrap";
          if (mode === "words") w.textContent = part;
          else { var gs = graphemes(part); for (var g = 0; g < gs.length; g++) { var c = document.createElement("span"); c.className = "mw-ch"; c.style.display = "inline-block"; c.textContent = gs[g]; w.appendChild(c); res.chars.push(c); } }
          res.words.push(w); frag.appendChild(w);
        }
        node.replaceChild(frag, n);
      }
    };
    walk(el);
    var top = null, line = null;
    for (var i = 0; i < res.words.length; i++) { var y = res.words[i].offsetTop; if (top === null || Math.abs(y - top) > 2) { top = y; line = []; res.lines.push(line); } line.push(res.words[i]); }
    el.__mwSplit = res;
    return res;
  };
  MW.bezier = MW.bezier || function (x1, y1, x2, y2) {
    var cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx, cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
    var X = function (t) { return ((ax * t + bx) * t + cx) * t; }, Y = function (t) { return ((ay * t + by) * t + cy) * t; }, dX = function (t) { return (3 * ax * t + 2 * bx) * t + cx; };
    return function (p) {
      if (p <= 0) return 0; if (p >= 1) return 1;
      var t = p, i, d;
      for (i = 0; i < 8; i++) { d = X(t) - p; if (Math.abs(d) < 1e-6) return Y(t); var s = dX(t); if (Math.abs(s) < 1e-6) break; t -= d / s; }
      var lo = 0, hi = 1; t = p;
      for (i = 0; i < 40; i++) { d = X(t); if (Math.abs(d - p) < 1e-6) break; if (d < p) lo = t; else hi = t; t = (lo + hi) / 2; }
      return Y(t);
    };
  };
  MW.CSS_EASE = { ease: [0.25, 0.1, 0.25, 1], easeIn: [0.42, 0, 1, 1], easeOut: [0, 0, 0.58, 1], easeInOut: [0.42, 0, 0.58, 1] };
  MW.EASES = MW.EASES || { "css-ease": [0.25, 0.1, 0.25, 1], "css-in": [0.42, 0, 1, 1], "css-out": [0, 0, 0.58, 1], "css-in-out": [0.42, 0, 0.58, 1],
    md3: [0.2, 0, 0, 1], "md3-emph": [0.05, 0.7, 0.1, 1], "md3-acc": [0.3, 0, 1, 1], "md3-dec": [0, 0, 0, 1], whip: [0.9, 0, 0.1, 1], glide: [0.4, 0, 0.2, 1],
    house: [0.83, 0, 0.17, 1], "in-out": [0.65, 0, 0.35, 1] };
  MW.ez = MW.ez || function (name) {
    if (typeof name === "function") return name;
    var b = MW.EASES[name]; if (b) return MW.bezier(b[0], b[1], b[2], b[3]);
    var m = /^cubic-bezier\(([^)]+)\)$/.exec(name || ""); if (m) { var v = m[1].split(",").map(Number); return MW.bezier(v[0], v[1], v[2], v[3]); }
    return gsap.parseEase(name || "none");
  };
  MW.drive = MW.drive || function (tl, at, dur, fn) {
    var s = { t: 0 }; fn(0);
    tl.fromTo(s, { t: 0 }, { t: dur, duration: dur, ease: "none", immediateRender: false, onUpdate: function () { fn(s.t); } }, at);
    return at + dur;
  };
  MW.lines = MW.lines || function (el, mode) {
    el = MW.el(el);
    if (el.__mwLines) return el.__mwLines;
    var s = MW.split(el, mode || "words"), out = [];
    s.lines.forEach(function (ws) {
      var d = document.createElement("span"); d.className = "mw-line"; d.style.display = "block";
      ws[0].parentNode.insertBefore(d, ws[0]);
      ws.forEach(function (w, i) { d.appendChild(w); if (i < ws.length - 1) d.appendChild(document.createTextNode(" ")); });
      out.push(d);
    });
    Array.prototype.slice.call(el.childNodes).forEach(function (n) { if ((n.nodeType === 3 && !n.nodeValue.trim()) || n.nodeName === "BR") el.removeChild(n); });
    el.__mwLines = { lines: out, chars: s.chars, words: s.words };
    return el.__mwLines;
  };
  var defaults = {"wide":1120,"narrow":640,"pad":60,"card":null,"loop":4.8};
  var run = function (el, tl, at, o) {
        var card = o.card ? MW.el(o.card) : el.parentNode, html = el.innerHTML, io = MW.ez("in-out"), ex = gsap.parseEase("expo.out");
        var mk = function (w) { var d = document.createElement("div"); d.innerHTML = html; d.style.cssText = "position:absolute;left:" + o.pad + "px;top:" + o.pad + "px;width:" + (w - 2 * o.pad) + "px;text-wrap:balance;"; card.appendChild(d);
          var L = MW.lines(d, "words").lines; L.forEach(function (l) { var s = document.createElement("span"); s.style.display = "inline-block"; while (l.firstChild) s.appendChild(l.firstChild); l.appendChild(s); l.style.overflow = "hidden"; l.style.padding = "0.2em 0.05em"; l.style.margin = "-0.2em -0.05em"; }); return { d: d, L: L }; };
        el.style.display = "none"; var A = mk(o.wide), B = mk(o.narrow), plain = document.createElement("div");
        plain.innerHTML = html; plain.style.cssText = "position:absolute;left:" + o.pad + "px;top:" + o.pad + "px;text-wrap:balance;opacity:0.45;"; card.appendChild(plain);
        var rise = function (X, t0, t) { X.L.forEach(function (l, i) { var u = ex(Math.max(0, Math.min(1, (t - t0 - i * 0.08) / 0.6))); gsap.set(l.firstChild, { yPercent: (1 - u) * 130 }); }); };
        return MW.drive(tl, at, o.loop, function (t) {
          var w = o.wide + (o.narrow - o.wide) * (io(Math.max(0, Math.min(1, (t - 1.7) / 0.6))) - io(Math.max(0, Math.min(1, (t - 4.2) / 0.3)))); card.style.width = w + "px"; plain.style.width = (w - 2 * o.pad) + "px";
          var phase = t < 1.7 ? 0 : t < 2.45 ? 1 : 2, fade = 1 - Math.max(0, Math.min(1, (t - 4.2) / 0.25));
          A.d.style.visibility = phase === 0 ? "visible" : "hidden"; plain.style.visibility = phase === 1 ? "visible" : "hidden"; B.d.style.visibility = phase === 2 ? "visible" : "hidden"; B.d.style.opacity = String(fade);
          rise(A, 0.3, t); rise(B, 2.45, t);
        });
      };
  MW.textBalancedReflow = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
</script>
