<!--
  Comic Pop (Moworks Studio, the studio's own, written here).
  Source: Moworks Studio.
  Chữ kiểu truyện tranh: nét đậm viền đen, bóng cứng, ruột vàng chấm halftone trên nền sao nổ, bật vào hơi nghiêng rồi đứng thẳng.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.textComicPop(q(".cp-w"), tl, 0.5, { burst: ".cp-burst" });

  Options (defaults in brackets):
      - duration: s (0.6), back.out
      - burst: the star burst behind
      - exitAt: s after the start (1.85)

  Notes: Weight-900 word, dark outline (CSS stroke 3 px; demo 6 px), hard dark shadow 3.5–4 px, fill yellow #f2c84b with accent halftone dots on an 8 px grid (demo dots 0.5 → 3.1 px toward the bottom, rows offset 4 px); behind it a 16-point burst star (inner 80 %) in a card tone. Pop: opacity 0 → 1, scale 0.8 → 1, rotate −2° → 0, 0.6 s back.out (cubic-bezier(.34,1.56,.64,1)); burst turns −6° → 0. Exit: scale 0.85 + fade 2.35–2.65 s; loop 2.8 s. Params: duration (0.6 s) · scale đầu (0.8) · rotate (−2°) · dots: lưới chấm halftone (8 px) · burst: sao nổ phía sau (bật). The look is CSS: weight-900 text, a thick dark outline and hard shadow (a copy behind), a yellow fill with accent halftone dots (background-clip: text).
-->

<div class="cp"><div class="cp-burst"></div><div class="cp-w"><span class="sh">BÙM!</span><span class="ol">BÙM!</span><span class="fi">BÙM!</span></div></div>

<script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.bezier = MW.bezier || function (x1, y1, x2, y2) {
    var cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx, cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
    var X = function (t) { return ((ax * t + bx) * t + cx) * t; }, Y = function (t) { return ((ay * t + by) * t + cy) * t; }, dX = function (t) { return (3 * ax * t + 2 * bx) * t + cx; };
    return function (p) {
      if (p <= 0) return 0; if (p >= 1) return 1;
      var t = p, i, d;
      for (i = 0; i < 8; i++) { d = X(t) - p; if (Math.abs(d) < 1e-6) return Y(t); var s = dX(t); if (Math.abs(s) < 1e-6) break; t -= d / s; }
      var lo = 0, hi = 1; t = p;
      for (i = 0; i < 40; i++) { d = X(t); if (Math.abs(d - p) < 1e-6) break; if (d < p) lo = t; else hi = t; t = (lo + hi) / 2; }
      return Y(t);
    };
  };
  MW.CSS_EASE = { ease: [0.25, 0.1, 0.25, 1], easeIn: [0.42, 0, 1, 1], easeOut: [0, 0, 0.58, 1], easeInOut: [0.42, 0, 0.58, 1] };
  MW.EASES = MW.EASES || { "css-ease": [0.25, 0.1, 0.25, 1], "css-in": [0.42, 0, 1, 1], "css-out": [0, 0, 0.58, 1], "css-in-out": [0.42, 0, 0.58, 1],
    md3: [0.2, 0, 0, 1], "md3-emph": [0.05, 0.7, 0.1, 1], "md3-acc": [0.3, 0, 1, 1], "md3-dec": [0, 0, 0, 1], whip: [0.9, 0, 0.1, 1], glide: [0.4, 0, 0.2, 1],
    house: [0.83, 0, 0.17, 1], "in-out": [0.65, 0, 0.35, 1] };
  MW.ez = MW.ez || function (name) {
    if (typeof name === "function") return name;
    var b = MW.EASES[name]; if (b) return MW.bezier(b[0], b[1], b[2], b[3]);
    var m = /^cubic-bezier\(([^)]+)\)$/.exec(name || ""); if (m) { var v = m[1].split(",").map(Number); return MW.bezier(v[0], v[1], v[2], v[3]); }
    return gsap.parseEase(name || "none");
  };
  MW.drive = MW.drive || function (tl, at, dur, fn) {
    var s = { t: 0 }; fn(0);
    tl.fromTo(s, { t: 0 }, { t: dur, duration: dur, ease: "none", immediateRender: false, onUpdate: function () { fn(s.t); } }, at);
    return at + dur;
  };
  var defaults = {"duration":0.6,"burst":null,"exitAt":1.85};
  var run = function (el, tl, at, o) {
        var bk = MW.ez("cubic-bezier(.34,1.56,.64,1)"), burst = o.burst ? MW.el(o.burst) : null;
        return MW.drive(tl, at, o.exitAt + 0.3, function (t) {
          var p = Math.max(0, Math.min(1, t / o.duration)), b = bk(p), e = Math.max(0, Math.min(1, (t - o.exitAt) / 0.3));
          gsap.set(el, { scale: (0.8 + 0.2 * b) * (1 - 0.15 * e), rotation: -2 * (1 - b) }); el.style.opacity = String(Math.min(1, p * 4) * (1 - e));
          if (burst) { gsap.set(burst, { rotation: -6 * (1 - b), scale: (0.8 + 0.2 * b) * (1 - 0.15 * e) }); burst.style.opacity = String(Math.min(1, p * 4) * (1 - e)); }
        });
      };
  MW.textComicPop = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
</script>
