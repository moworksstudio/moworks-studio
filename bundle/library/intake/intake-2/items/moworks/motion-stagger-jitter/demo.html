    <style>
:root { --bg: #09090b; --fg: #fafafa; --card: #111114; --line: #27272a; }

html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); }

.center { position: absolute; inset: 0; display: grid; place-items: center; }

.col { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 32px; }

#demo { background: radial-gradient(100% 100% at 50% 45%, #1a1f33, #0b0d12); color: #e8ebf3; font-family: Inter, sans-serif; } .gm { position: absolute; inset: 0; }

.sj-a .sj { background: #3a4466; } .sj-b .sj { background: linear-gradient(150deg, #a693ff, #6a4cf0); } .sj-c { position: absolute; left: 260px; font-size: 34px; font-weight: 700; color: #8f9ab3; }

    <div id="demo" data-composition-id="mw-demo" data-start="0" data-width="1920" data-height="1080" data-duration="3">
<div class="sj-c" style="top:180px">Đều nhau: máy móc</div><div class="sj-r sj-a" style="top:250px"><div class="sj"></div><div class="sj"></div><div class="sj"></div><div class="sj"></div><div class="sj"></div><div class="sj"></div><div class="sj"></div></div><div class="sj-c" style="top:560px">Lệch nhịp: tự nhiên</div><div class="sj-r sj-b" style="top:630px"><div class="sj"></div><div class="sj"></div><div class="sj"></div><div class="sj"></div><div class="sj"></div><div class="sj"></div><div class="sj"></div></div>
      <script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.rand = MW.rand || function (seed) {
    var a = typeof seed === "string" ? MW.hash(seed) : (seed >>> 0) || 1;
    return function () { a = (a + 0x6d2b79f5) >>> 0; var t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  };
  MW.hash = MW.hash || function (s) { var h = 2166136261; s = String(s); for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; };
  MW.spring = MW.spring || function (stiffness, damping, mass, from, to) {
    var k = stiffness || 100, c = damping == null ? 10 : damping, m = mass || 1, w0 = Math.sqrt(k / m), z = c / (2 * Math.sqrt(k * m));
    var x = function (t) {
      if (z < 1) { var wd = w0 * Math.sqrt(1 - z * z); return 1 - Math.exp(-z * w0 * t) * (Math.cos(wd * t) + (z * w0 / wd) * Math.sin(wd * t)); }
      if (z === 1) return 1 - Math.exp(-w0 * t) * (1 + w0 * t);
      var q = Math.sqrt(z * z - 1), r1 = -w0 * (z - q), r2 = -w0 * (z + q), A = r2 / (r2 - r1), B = -r1 / (r2 - r1);
      return 1 - (A * Math.exp(r1 * t) + B * Math.exp(r2 * t));
    };
    var T = 0, dt = 1 / 240; for (var t = 0; t < 30; t += dt) if (Math.abs(1 - x(t)) > 0.001) T = t;
    T = Math.max(dt, T + dt);
    return { duration: T, ease: function (p) { return p >= 1 ? 1 : x(p * T); }, at: x };
  };
  MW.springDB = MW.springDB || function (duration, bounce) {
    var z = 1 - (bounce == null ? 0.25 : bounce), w = Math.log(1000) / (Math.max(0.05, z) * (duration || 0.8));
    return MW.spring(w * w, 2 * z * w, 1);
  };
  MW.drive = MW.drive || function (tl, at, dur, fn) {
    var s = { t: 0 }; fn(0);
    tl.fromTo(s, { t: 0 }, { t: dur, duration: dur, ease: "none", immediateRender: false, onUpdate: function () { fn(s.t); } }, at);
    return at + dur;
  };
  var defaults = {"items":".sj","k":220,"c":20,"stagger":0.07,"jitter":0.045,"size":0.04,"rise":160,"seed":7,"exitAt":null};
  var run = function (el, tl, at, o) {
        var it = Array.prototype.slice.call(el.querySelectorAll(o.items)), sp = MW.spring(o.k, o.c), r = MW.rand(o.seed), J = it.map(function () { return [(r() * 2 - 1) * o.jitter, 1 + (r() * 2 - 1) * o.size]; });
        var end = o.jitter * 2 + (it.length - 1) * o.stagger + sp.duration;
        return MW.drive(tl, at, o.exitAt == null ? end : o.exitAt + 0.3, function (t) {
          var f = o.exitAt != null && t > o.exitAt ? 1 - Math.min(1, (t - o.exitAt) / 0.3) : 1;
          it.forEach(function (e, i) { var s = t - (o.jitter + i * o.stagger + J[i][0]), v = s > 0 ? sp.at(s) : 0; gsap.set(e, { y: o.rise * (1 - v), scale: J[i][1] }); e.style.opacity = String((s > 0 ? Math.min(1, s / 0.12) : 0) * f); });
        });
      };
  MW.motionStaggerJitter = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
      </script>
      <script>
        (function () {
          var tl = gsap.timeline({ paused: true });
          var q = function (s) { return document.querySelector(s); }, qa = function (s) { return Array.prototype.slice.call(document.querySelectorAll(s)); };
          MW.motionStaggerJitter(q(".sj-a"), tl, 0.3, { jitter: 0, size: 0, exitAt: 2.4 }); MW.motionStaggerJitter(q(".sj-b"), tl, 0.3, { exitAt: 2.4 });
          tl.set({}, {}, 3);
          // register only when every motion is ready (MW.pending: e.g. a WebGL texture still decoding), as HyperFrames asks of async builds
          var go = function () { window.__timelines = window.__timelines || {}; window.__timelines["mw-demo"] = tl; };
          if (window.MW && MW.pending && MW.pending.length) Promise.all(MW.pending).then(go, go); else go();
        })();
      </script>
