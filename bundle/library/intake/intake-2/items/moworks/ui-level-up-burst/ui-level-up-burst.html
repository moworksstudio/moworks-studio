  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.uiLevelUpBurst(q(".gm"), tl, 0, {});

  Options (defaults in brackets):
      - from: level before (7)
      - to: level after (8)
      - peakAt: s the number locks (1.2)
      - particles: (24)
      - label: 
      - accent: 
      - seed: (5)
      - loop: s (2.8)

  Notes: px @320x200. XP bar 100 x 6 fills 0.3-0.95 s inOut (blue, accent after the peak). Digit (50 px) rolls 7 → 8 vertically (56 px, clipped) in 200 ms back.out at 1.0 s. Peak 1.2 s: number scale 1.3 → 1 spring k300 d12; halo ring r 30 → 96 in 600 ms outCubic, stroke 4 → 1, fading; 24 seeded dots in 3 colours burst to 47-86 px over 800 ms; 'LEVEL UP!' pops at 1.25 s (300 ms back.out); bar drains in 300 ms outCubic. Loop fade 2.4-2.8 s. Params: from / to: cấp (7 → 8) · peakAt: lúc khoá số (1.2 s) · halo: vòng sáng (30 → 96 px) · particles: số hạt (24). The XP bar fills, the digit rolls up (back.out), then at the lock the number springs (k300 c12), a halo ring opens 30 → 96 and dots burst.
-->
