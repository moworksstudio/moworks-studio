<!--
  Staggered Bar Chart (Moworks Studio, the studio's own, written here).
  Source: Moworks Studio.
  Năm cột biểu đồ mọc lên từ trục đáy lần lượt cách nhau 75 ms, sáng dần khi cao lên.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.dataBarStagger(q(".bs"), tl, 0.3, {});

  Options (defaults in brackets):
      - items: 
      - each: s later per bar (0.075)
      - duration: s: every bar finishes then (1.1)
      - from: scaleY (0.04)
      - ease: (power2.out)

  Notes: 5 bars (9 % wide, 15 % apart, heights 24 % + 8 % per bar, top radius 3, accent mixed darker to lighter) on a 1 px axis. Each bar scaleY 0.04 → 1 from the bottom with opacity 0.35 → 1, power2.out; bar k starts k × 75 ms later and all finish at 1.1 s (later bars move faster). Params: each (0.075 s) · duration (1.1 s) · from (0.04) · ease (power2.out). Later bars start later but all land together, so they move faster.
-->

<div class="st"><div class="bs"><i style="height:30%;background:#5a47c9"></i><i style="height:44%;background:#6e5ae0"></i><i style="height:58%;background:#8b7bff"></i><i style="height:72%;background:#a99bff"></i><i style="height:86%;background:#c9bfff"></i></div></div>

<style>

</style>

<script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.drive = MW.drive || function (tl, at, dur, fn) {
    var s = { t: 0 }; fn(0);
    tl.fromTo(s, { t: 0 }, { t: dur, duration: dur, ease: "none", immediateRender: false, onUpdate: function () { fn(s.t); } }, at);
    return at + dur;
  };
  var defaults = {"items":"i","each":0.075,"duration":1.1,"from":0.04,"ease":"power2.out"};
  var run = function (el, tl, at, o) {
        var it = Array.prototype.slice.call(el.querySelectorAll(o.items)), e = gsap.parseEase(o.ease); it.forEach(function (b) { gsap.set(b, { transformOrigin: "50% 100%" }); });
        return MW.drive(tl, at, o.duration, function (t) { it.forEach(function (b, k) { var st = k * o.each, p = e(Math.max(0, Math.min(1, (t - st) / (o.duration - st)))); gsap.set(b, { scaleY: o.from + (1 - o.from) * p }); b.style.opacity = String(0.35 + 0.65 * p); }); });
      };
  MW.dataBarStagger = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
</script>
