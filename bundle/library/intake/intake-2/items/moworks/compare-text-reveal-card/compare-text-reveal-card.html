<!--
  Pointer Reveal Card (Moworks Studio, the studio's own, written here).
  Source: Moworks Studio.
  Trên một thẻ, con trỏ kéo qua đến đâu thì chữ mặt trước bị thay bằng chữ mặt sau màu nhấn đến đó, rời thẻ thì vạch chia trượt về mép trái.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.compareTextRevealCard(q(".rc"), tl, 0, {});

  Options (defaults in brackets):
      - front: the front layer
      - back: the back layer (same size, on top of the front)
      - follow: s the divider takes to follow (0.4, power2.out)
      - line: px (7)
      - handle: [w, h] px ([30, 100])
      - scan: px between scanlines on the back (30)
      - accent: 
      - ease: of the pointer (cubic-bezier(.65,0,.35,1))
      - cursor: 
      - loop: s (4.4)

  Notes: Card 276 × 118 px, radius 10; front text (ink) and back text (accent), 44 px, same centre. Divider x follows the cursor x inside the card (else the left edge) with a 0.4 s power2.out response. Right of it the front text; left the back text plus faint accent scanlines every 6 px (6 %). Divider 1.5 px accent with a 6 × 20 px handle. Cursor enters left 0.85 s, sweeps to the right edge by 2.1 s, nudges 3.0 s, leaves 3.35 s (divider returns in 0.4 s). Loop 4.4 s. Params: chữ mặt trước / mặt sau · thời gian trả về (0.4 s) · vạch chia (1.5 px). Left of the divider shows the back text with faint accent scanlines, right of it the front; outside the card the divider returns to the left edge.
-->
