<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Scroll Velocity Marquee - Demo</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
:root { --bg: #09090b; --fg: #fafafa; --card: #111114; --line: #27272a; }
* { box-sizing: border-box; }
html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); }
#demo { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); color: var(--fg); font-family: Inter, sans-serif; }
.center { position: absolute; inset: 0; display: grid; place-items: center; }
.row { display: flex; align-items: center; justify-content: center; gap: 48px; }
.col { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 32px; }
.h1 { font-size: 132px; font-weight: 800; letter-spacing: -0.035em; line-height: 1.1; text-align: center; }
.h2 { font-size: 84px; font-weight: 700; letter-spacing: -0.025em; line-height: 1.15; text-align: center; }
.p { font-size: 40px; line-height: 1.4; opacity: 0.72; text-align: center; }
.card { position: relative; border-radius: 28px; background: var(--card); border: 2px solid var(--line); overflow: hidden; }
.muted { opacity: 0.6; }

#demo { background: radial-gradient(100% 100% at 50% 40%, #1a1f33, #0b0d12); color: #e8ebf3; font-family: Inter, sans-serif; } .gm { position: absolute; inset: 0; }
.ui-cursor { position: absolute; left: 0; top: 0; z-index: 30; filter: drop-shadow(0 6px 10px rgba(0, 0, 0, 0.5)); }
.vm { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; gap: 70px; overflow: hidden; } .vm-b { white-space: nowrap; }
.vm-b.a { font-size: 230px; font-weight: 900; } .vm-b.b { font-size: 120px; font-weight: 900; color: transparent; -webkit-text-stroke: 4px #a99bff; }
    </style>
  </head>
  <body>
    <div id="demo" data-composition-id="mw-demo" data-start="0" data-width="1920" data-height="1080" data-duration="5">
<div class="gm vm"><div class="vm-b a">Làm video nhanh hơn  ·  </div><div class="vm-b b">Kể chuyện hay hơn  ·  </div></div>
      <script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.drive = MW.drive || function (tl, at, dur, fn) {
    var s = { t: 0 }; fn(0);
    tl.fromTo(s, { t: 0 }, { t: dur, duration: dur, ease: "none", immediateRender: false, onUpdate: function () { fn(s.t); } }, at);
    return at + dur;
  };
  var defaults = {"bands":".vm-b","speeds":[230,200],"boosts":[[0.6,4,0],[2.3,4,1],[3.9,2.5,1]],"loop":5};
  var run = function (el, tl, at, o) {
        var bands = Array.prototype.slice.call(el.querySelectorAll(o.bands)), p1 = gsap.parseEase("power1.out"), dt = 1 / 120;
        bands.forEach(function (b) { var t0 = b.innerHTML; b.innerHTML = ""; var s = document.createElement("span"); s.style.cssText = "display:inline-block;white-space:nowrap;"; for (var i = 0; i < 12; i++) s.innerHTML += t0; b.appendChild(s); b.__w = s.offsetWidth / 12; b.__s = s; });
        var boost = function (t) { var v = 0; o.boosts.forEach(function (q) { var d = t - q[0]; if (d < 0) return; v += q[1] * (d < 0.25 ? p1(d / 0.25) : Math.exp(-4 * (d - 0.25))); }); return v; };
        var dir = function (t) { var d = -1; o.boosts.forEach(function (q) { if (t >= q[0] && q[2]) d = -d; }); return d; };
        var I = function (T) { var x = 0; for (var s = 0; s < T; s += dt) x += dir(s) * (1 + boost(s)) * dt; return x; }, tot = I(o.loop);
        return MW.drive(tl, at, o.loop, function (t) {
          var x = I(t);
          bands.forEach(function (b, i) { var sp = o.speeds[i] || o.speeds[0], whole = Math.max(1, Math.round(Math.abs(tot * sp) / b.__w)) * b.__w * Math.sign(tot || 1), k = tot ? whole / tot : 0, X = x * k * (i % 2 ? -1 : 1);
            var m = ((X % b.__w) + b.__w) % b.__w; gsap.set(b.__s, { x: -b.__w * 3 + m }); });
        });
      };
  MW.textVelocityMarquee = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
      </script>
      <script>
        (function () {
          var tl = gsap.timeline({ paused: true });
          var q = function (s) { return document.querySelector(s); }, qa = function (s) { return Array.prototype.slice.call(document.querySelectorAll(s)); };
          MW.textVelocityMarquee(q(".vm"), tl, 0, {});
          tl.set({}, {}, 5);
          // register only when every motion is ready (MW.pending: e.g. a WebGL texture still decoding), as HyperFrames asks of async builds
          var go = function () { window.__timelines = window.__timelines || {}; window.__timelines["mw-demo"] = tl; };
          if (window.MW && MW.pending && MW.pending.length) Promise.all(MW.pending).then(go, go); else go();
        })();
      </script>
    </div>
  </body>
</html>
