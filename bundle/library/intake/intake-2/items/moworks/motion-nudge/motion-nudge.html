  Nudge (Moworks Studio, the studio's own, written here).
  Source: Moworks Studio.
  Nút nhích sang phải 9 px, lùi 3 px rồi về chỗ, một lần, để gợi ý bấm.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.motionNudge(q(".nx"), tl, 0.6, {});

  Options (defaults in brackets):
      - amp: px to the side (27; 9 in the small demo)
      - back: px of the counter-move (9)

  Notes: x keys 0 → +9 px (180 ms) → −3 px (330 ms) → 0 (520 ms), sine.inOut between keys; only the target moves (a 'Next' button), once. Same preset family: styles nod, jelly, hop, tilt (one preset with a style param, like text/land-in). Params: amp (9 px) · back (3 px) · duration (0.52 s).
-->
