<!--
  Drag Snap (Moworks Studio, the studio's own, written here).
  Source: Moworks Studio.
  Thẻ được kéo từ ô đầu sang ô đích, hơi nghiêng khi bay, vượt quá vài px rồi bám đúng vào ô và thẳng lại.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.motionDragSnap(q(".ds"), tl, 0.4, { backAt: 1.7, cursor: ".ui-cursor" });

  Options (defaults in brackets):
      - from: [x, y, degrees] at the start slot ([−360, 150, −8])
      - over: [x, y, degrees] past the end slot at 68 % ([290, −125, 5])
      - to: [x, y, degrees] in the end slot ([255, −100, 0])
      - duration: s (0.82), each leg ease-in-out
      - backAt: s after the start to return (null)
      - cursor: an optional cursor that carries it

  Notes: Chip DRAG moves from the start slot (offset −72, +30 px, rotate −8°) to past the end slot (+58, −25 px, rotate 5°) at 68 %, then settles into it (+51, −20 px, rotate 0) by 100 %; 820 ms; the overshoot is keyed, each segment eased in-out (data lists easeOutBack). Dashed start and end slots, arrow between. Params: from / to: ô đầu, ô đích · duration (0.82 s) · overshoot (~7 px, có keyframe) · tilt (−8° → 5° → 0) · ease (power2.inOut).
-->
