<!--
  Line-by-Line Reveal (Moworks Studio, the studio's own, written here).
  Source: Moworks Studio.
  Ba dòng chữ lần lượt trồi lên 28 px, mỗi dòng trong mặt nạ riêng, dòng sau bắt đầu khi dòng trước vừa đọc được.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.textLineByLineReveal(q(".lbl"), tl, 0, {});

  Options (defaults in brackets):
      - lines: the line elements (each gets its own mask)
      - start: s (0.3)
      - stagger: s (0.24)
      - duration: s per line (0.55)
      - y: em (1.08)
      - exitY: em they leave upward (1.3, 0.25 s ease-in cubic)
      - outAt: s (2.2)
      - fadeIn: also fade in (the DOM version)
      - ease: (ease-out cubic)
      - loop: s (2.8)

  Notes: 3 lines (26 px type), each in its own overflow-hidden mask (140×32 px). Line i: translateY +28 px → 0, 0.55 s easeOutCubic, start 0.3 + 0.24·i s (no fade in the canvas demo). Loop exit: line i slides up 34 px out of its mask, 2.2 + 0.06·i s, 0.25 s inCubic; loop 2.8 s. DOM version (2.2 s loop): same 28 px plus opacity 0 → 1, 682 ms each, 242 ms apart, ease cubic-bezier(.65,0,.35,1). Params: duration: mỗi dòng (0.55 s) · stagger: độ lệch giữa các dòng (0.24 s) · y: quãng trồi (28 px) · ease (easeOutCubic).
-->
