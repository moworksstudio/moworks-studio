<!--
  Truck (Moworks Studio, the studio's own, written here).
  Source: Moworks Studio.
  Máy quay trượt ngang, lớp gần chạy nhanh, lớp xa chạy chậm nên có thị sai.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.motionCameraTruck(q(".tk-cam"), tl, 0.5, { duration: 2.4 });

  Options (defaults in brackets):
      - duration: s (2)
      - distance: px at the subject's depth (360; 120 on the small frame); a layer moves distance × its depth
      - layers: selector of the layers
      - ease: sine.inOut

  Notes: Truck: layer x 0 -> -120 px x depth (near -120, far -24 at depth 0.2) over 2000 ms easeInOutSine. Params: duration (2 s) · distance (120 px ở lớp chủ thể) · depth.
-->

<div class="tk-cam"><div class="tk-far" data-depth="0.2"><div class="sun"></div><div class="star" style="left:12%;top:14%"></div><div class="star" style="left:24%;top:30%"></div><div class="star" style="left:36%;top:10%"></div><div class="star" style="left:70%;top:18%"></div><div class="star" style="left:82%;top:34%"></div><div class="star" style="left:90%;top:12%"></div><div class="star" style="left:46%;top:22%"></div><div class="star" style="left:16%;top:40%"></div></div>
<div class="tk-mid" data-depth="0.55"><svg viewBox="0 0 1000 300" preserveAspectRatio="none"><path d="M0 300 L0 170 Q120 90 240 150 T480 120 T720 160 T1000 110 L1000 300 Z" fill="#3b2f6b"/><path d="M0 300 L0 220 Q160 160 320 210 T640 190 T1000 200 L1000 300 Z" fill="#2a2150"/></svg></div>

<script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.drive = MW.drive || function (tl, at, dur, fn) {
    var s = { t: 0 }; fn(0);
    tl.fromTo(s, { t: 0 }, { t: dur, duration: dur, ease: "none", immediateRender: false, onUpdate: function () { fn(s.t); } }, at);
    return at + dur;
  };
  var defaults = {"duration":2,"distance":360,"layers":"[data-depth]","ease":"sine.inOut"};
  var run = function (el, tl, at, o) {
        var Ls = Array.prototype.slice.call(el.querySelectorAll(o.layers)), ease = gsap.parseEase(o.ease);
        return MW.drive(tl, at, o.duration, function (t) {
          var p = ease(t / o.duration);
          Ls.forEach(function (l) { var d = parseFloat(l.getAttribute("data-depth") || "1"); gsap.set(l, { x: -o.distance * d * p }); });
        });
      };
  MW.motionCameraTruck = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
</script>
