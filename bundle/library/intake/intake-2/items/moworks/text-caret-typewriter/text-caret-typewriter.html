<!--
  Typewriter With Caret (Moworks Studio, the studio's own, written here).
  Source: Moworks Studio.
  Chữ mono gõ ra từng ký tự 70 ms một, con trỏ đứng yên khi gõ rồi nhấp nháy 0.75 giây một nhịp khi dừng.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.textCaretTypewriter(q(".tk-head"), tl, 0, {});

  Options (defaults in brackets):
      - per: s per character (0.07)
      - fit: s at most (1.5)
      - start: s (0.4)
      - caret: em wide (0.12)
      - blink: s per blink when idle (0.75, step)
      - clearAt: s (3.45)
      - accent: caret colour

  Notes: Mono text (demo 34 px, weight 600). Chars appear one per 70 ms (steps(N): width 0 → N ch over N × 70 ms; demo capped 1.5 s total) from 0.4 s. Caret: accent bar 0.12 em wide (demo 3 px), 1 em tall, 3 px after the last char; solid while typing, then blinks with a 0.75 s period, step-end (0.375 s on / off). Full-width CJK counts as 2 ch. Demo clears at 3.45 s; loop 3.75 s. Params: rate: mỗi ký tự (0.07 s) · caret: bề rộng (0.12 em) · blink: chu kỳ nhấp nháy (0.75 s).
-->

<div class="tk-stage"><div><h1 class="tk-head ">&gt; viết kịch bản cho tôi</h1></div></div>

</style>

<script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.drive = MW.drive || function (tl, at, dur, fn) {
    var s = { t: 0 }; fn(0);
    tl.fromTo(s, { t: 0 }, { t: dur, duration: dur, ease: "none", immediateRender: false, onUpdate: function () { fn(s.t); } }, at);
    return at + dur;
  };
  var defaults = {"per":0.07,"fit":1.5,"start":0.4,"caret":0.12,"blink":0.75,"clearAt":3.45,"accent":"#a99bff"};
  var run = function (el,tl,at,o
  ) {
  var seg = typeof Intl !== "undefined" && Intl.Segmenter ? new Intl.Segmenter("vi", { granularity: "grapheme" }) : null;
  var gr = function (s) { s = String(s).normalize("NFC"); if (!seg) return Array.from(s); var out = [], it = seg.segment(s)[Symbol.iterator](), r; while (!(r = it.next()).done) out.push(r.value.segment); return out; };
  var cells = function (el, text) { el.textContent = ""; var word = null; return gr(text).map(function (g) { var s = document.createElement("span"); s.textContent = g; s.style.display = "inline-block"; s.style.whiteSpace = "pre";
    if (g === " ") { word = null; el.appendChild(s); } else { if (!word) { word = document.createElement("span"); word.style.display = "inline-block"; word.style.whiteSpace = "nowrap"; el.appendChild(word); } word.appendChild(s); } return s; }); };
  var cs = cells(el, el.textContent), n = cs.length, per = Math.min(o.per, o.fit / Math.max(1, n)), caret = document.createElement("span");
  caret.style.cssText = "display:inline-block;width:" + o.caret + "em;height:1em;vertical-align:-0.12em;margin-left:0.06em;background:" + o.accent + ";"; el.appendChild(caret);
  return MW.drive(tl, at, o.clearAt + 0.1, function (t) {
    var shown = 0; cs.forEach(function (c, i) { var v = t >= o.start + i * per && t < o.clearAt; c.style.display = v ? "inline-block" : "none"; if (v) shown++; });
    var typing = shown < n && t >= o.start, idle = t - (o.start + n * per); caret.style.visibility = t >= o.clearAt ? "hidden" : typing || idle < 0 ? "visible" : (Math.floor(idle / (o.blink / 2)) % 2 ? "hidden" : "visible");
  });
  };
  MW.textCaretTypewriter = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
</script>
