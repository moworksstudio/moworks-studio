<!--
  CRT Scanlines (Moworks Studio, the studio's own, written here).
  Source: Moworks Studio.
  Các vạch ngang mảnh phủ lên hình và một dải sáng mờ trôi chậm từ trên xuống như màn hình ống cũ.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.effectCrtScanlines(q(".crt"), tl, 0, {});

  Options (defaults in brackets):
      - pitch: px between lines (6)
      - line: px of dark line (2)
      - opacity: (0.18)
      - band: px of the rolling glow (150)
      - glow: (0.12)
      - roll: s per pass (3), linear
      - loop: s (3)

  Notes: Overlay: 1 px dark lines every 2-3 px at 15-22 % opacity, plus a 30 px white band at 12 % opacity rolling top -> bottom over 3000 ms linear, looping. Params: pitch (2–3 px) · opacity (15–22 %) · band (30 px, 3 s).
-->

<div class="crt"><b>KÊNH 7</b></div>

<script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.drive = MW.drive || function (tl, at, dur, fn) {
    var s = { t: 0 }; fn(0);
    tl.fromTo(s, { t: 0 }, { t: dur, duration: dur, ease: "none", immediateRender: false, onUpdate: function () { fn(s.t); } }, at);
    return at + dur;
  };
  var defaults = {"pitch":6,"line":2,"opacity":0.18,"band":150,"glow":0.12,"roll":3,"loop":3};
  var run = function (el, tl, at, o) {
        if (getComputedStyle(el).position === "static") el.style.position = "relative"; var s = document.createElement("div"), b = document.createElement("div"), Hh = el.clientHeight;
        s.style.cssText = "position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg, rgba(0,0,0," + o.opacity + ") 0 " + o.line + "px, transparent " + o.line + "px " + o.pitch + "px);"; b.style.cssText = "position:absolute;left:0;right:0;pointer-events:none;height:" + o.band + "px;background:linear-gradient(180deg, rgba(255,255,255,0), rgba(255,255,255," + o.glow + "), rgba(255,255,255,0));"; el.appendChild(s); el.appendChild(b);
        return MW.drive(tl, at, o.loop, function (t) { gsap.set(b, { y: ((t % o.roll) / o.roll) * (Hh + o.band) - o.band }); });
      };
  MW.effectCrtScanlines = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
</script>
