<!--
  Perspective Opening Crawl (Moworks Studio, the studio's own, written here).
  Source: Moworks Studio.
  Khối chữ vàng nằm trên một mặt phẳng ngả ra sau, trôi chậm từ dưới khung lên và nhỏ dần về đường chân trời, mờ đi trước khi chạm chân trời, trên nền sao.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.titleOpeningCrawl(q(".oc"), tl, 0, { duration: 9 });

  Options (defaults in brackets):
      - tilt: degrees the plane leans back (25)
      - perspective: px (1200)
      - duration: s for the whole text to pass (60 in a film; the demo 9)
      - plane: the tilted plane (.oc-plane), holding the text

  Notes: Recipe: text block on a plane tilted rotateX 20–25° (perspective 400 px, origin 50 % 100 %), translateY 100 % → −200 % linear over 60 s or more. Demo: rows (22 px, yellow, 30 px apart, +16 px between paragraphs) rise from below the frame toward a horizon 15 % from the top, projected with scale = f / (f + depth) (f 110), stretched ×1.25 x / ×1.0 y; each row fades as its scale drops 0.33 → 0.13 near the horizon; 46 static star dots. Loop 6 s in the demo. Params: độ ngả (rotateX 20–25°) · phối cảnh (400 px) · tốc độ (60 s trở lên cho cả khối) · màu chữ (vàng).
-->

<script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.drive = MW.drive || function (tl, at, dur, fn) {
    var s = { t: 0 }; fn(0);
    tl.fromTo(s, { t: 0 }, { t: dur, duration: dur, ease: "none", immediateRender: false, onUpdate: function () { fn(s.t); } }, at);
    return at + dur;
  };
  var defaults = {"tilt":25,"perspective":1200,"duration":60,"plane":".oc-plane"};
  var run = function (el, tl, at, o) {
        var plane = el.querySelector(o.plane), body = plane.firstElementChild;
        plane.style.transformOrigin = "50% 100%"; plane.style.transform = "perspective(" + o.perspective + "px) rotateX(" + o.tilt + "deg)";
        return MW.drive(tl, at, o.duration, function (t) { var H = plane.offsetHeight, B = body.offsetHeight, p = t / o.duration; gsap.set(body, { y: H - (H + B) * p }); });
      };
  MW.titleOpeningCrawl = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
</script>
