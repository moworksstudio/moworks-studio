  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline

    MW.uiFocusRingDraw(q(".fr"), tl, 0, {});

  Options (defaults in brackets):
      - offset: px outside the button (20)
      - stroke: px (8)
      - draw: s (0.8, power2.inOut), clockwise from the top centre
      - drawAt: s (0.45)
      - outAt: s (2.25, 0.25 s power2.in)
      - flash: px the closing flash grows (24)
      - dot: px radius of the drawing head (9)
      - accent: 
      - key: a key cap pressed first
      - keyAt: s (0.3)
      - cursor: an optional cursor that makes the clicks
      - approach: [x, y] px the cursor comes from
      - lead: s it arrives before a click

  Notes: Button 140x44 r12 (dark fill, light label). Focus ring offset 5 px (150x54, r17), one 2.5 px accent stroke starting at the top centre, clockwise, 0 → 100 % of the perimeter over 0.45-1.25 s (800 ms) power2.inOut, a 4 px head dot while drawing. On closing a copy flashes outward 6 px and fades over 0.3 s. Out 2.25-2.5 s power2.in. Trigger: a Tab key cap pressed at 0.3-0.45 s. Params: offset (5 px) · draw (0.8 s, power2.inOut) · stroke (2.5 px) · flash (6 px, 0.3 s).
