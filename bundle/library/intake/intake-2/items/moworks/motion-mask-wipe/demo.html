<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Mask Wipe - Demo</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
:root { --bg: #09090b; --fg: #fafafa; --card: #111114; --line: #27272a; }
* { box-sizing: border-box; }
html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); }
#demo { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); color: var(--fg); font-family: Inter, sans-serif; }
.center { position: absolute; inset: 0; display: grid; place-items: center; }
.row { display: flex; align-items: center; justify-content: center; gap: 48px; }
.col { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 32px; }
.h1 { font-size: 132px; font-weight: 800; letter-spacing: -0.035em; line-height: 1.1; text-align: center; }
.h2 { font-size: 84px; font-weight: 700; letter-spacing: -0.025em; line-height: 1.15; text-align: center; }
.p { font-size: 40px; line-height: 1.4; opacity: 0.72; text-align: center; }
.card { position: relative; border-radius: 28px; background: var(--card); border: 2px solid var(--line); overflow: hidden; }
.muted { opacity: 0.6; }

#demo { background: radial-gradient(100% 100% at 50% 45%, #1a1f33, #0b0d12); color: #e8ebf3; font-family: Inter, sans-serif; }
.st { position: absolute; inset: 0; display: grid; place-items: center; } .mw { padding: 60px 80px; border-radius: 30px; background: #151a24; } .mw h2 { margin: 0 0 40px; font-size: 110px; font-weight: 900; } .mw i { display: block; height: 30px; border-radius: 15px; background: #3a4466; margin-top: 24px; }
    </style>
  </head>
  <body>
    <div id="demo" data-composition-id="mw-demo" data-start="0" data-width="1920" data-height="1080" data-duration="2.4">
<div class="st"><div class="mw"><h2>Ra mắt mùa mới</h2><i></i><i style="width:60%"></i></div></div>
      <script>
(function () {
  "use strict";

    return at + dur;

  var defaults = {"duration":0.7,"edge":8,"accent":"#8b7bff","exitAt":null};
  var run = function (el,tl,at,o

  var add = function (css) { var d = document.createElement("div"); d.style.cssText = "position:absolute;pointer-events:none;" + css; host.appendChild(d); return d; };
  var cx0 = el.offsetLeft + el.offsetWidth / 2, cy0 = el.offsetTop + el.offsetHeight / 2;
  var e = gsap.parseEase("power4.inOut"), pin = gsap.parseEase("power2.in"), W = el.offsetWidth, L = el.offsetLeft, Tp = el.offsetTop, Hh = el.offsetHeight;
  var line = add("width:" + o.edge + "px;height:" + Hh + "px;top:" + Tp + "px;background:" + o.accent + ";opacity:0;"), mark = add("width:0;height:0;border-left:14px solid transparent;border-right:14px solid transparent;border-top:18px solid " + o.accent + ";top:" + (Tp - 24) + "px;opacity:0;");
  return MW.drive(tl, at, o.exitAt == null ? o.duration : o.exitAt + 0.32, function (t) { var p = 1.15 * e(Math.min(1, t / o.duration)), vis = Math.min(1, p); el.style.clipPath = "inset(0 " + (100 * (1 - vis)).toFixed(2) + "% 0 0)"; var x = o.exitAt != null ? pin(Math.max(0, Math.min(1, (t - o.exitAt) / 0.32))) : 0; el.style.opacity = String(1 - x);
    var on = p > 0 && p < 1; line.style.left = L + W * p - o.edge / 2 + "px"; mark.style.left = L + W * p - 14 + "px"; line.style.opacity = mark.style.opacity = on ? "1" : "0"; });
  };
  MW.motionMaskWipe = function (el, tl, at, options) {

      <script>
        (function () {
          var tl = gsap.timeline({ paused: true });
          var q = function (s) { return document.querySelector(s); }, qa = function (s) { return Array.prototype.slice.call(document.querySelectorAll(s)); };

          if (window.MW && MW.pending && MW.pending.length) Promise.all(MW.pending).then(go, go); else go();
        })();

    </div>
  </body>
</html>
