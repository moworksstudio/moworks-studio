<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Noise Resolve - Demo</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
:root { --bg: #09090b; --fg: #fafafa; --card: #111114; --line: #27272a; }
* { box-sizing: border-box; }
html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); }
#demo { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); color: var(--fg); font-family: Inter, sans-serif; }
.center { position: absolute; inset: 0; display: grid; place-items: center; }
.row { display: flex; align-items: center; justify-content: center; gap: 48px; }
.col { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 32px; }
.h1 { font-size: 132px; font-weight: 800; letter-spacing: -0.035em; line-height: 1.1; text-align: center; }
.h2 { font-size: 84px; font-weight: 700; letter-spacing: -0.025em; line-height: 1.15; text-align: center; }
.p { font-size: 40px; line-height: 1.4; opacity: 0.72; text-align: center; }
.card { position: relative; border-radius: 28px; background: var(--card); border: 2px solid var(--line); overflow: hidden; }
.muted { opacity: 0.6; }

#demo { background: radial-gradient(100% 100% at 50% 45%, #1a1f33, #0b0d12); color: #e8ebf3; font-family: Inter, sans-serif; } .gm { position: absolute; inset: 0; }
.st { position: absolute; inset: 0; display: grid; place-items: center; } .nr { width: 360px; height: 360px; border-radius: 90px; background: linear-gradient(150deg, #a693ff, #6a4cf0); display: grid; place-items: center; font-size: 170px; font-weight: 900; color: #fff; opacity: 0; }
    </style>
  </head>
  <body>
    <div id="demo" data-composition-id="mw-demo" data-start="0" data-width="1920" data-height="1080" data-duration="2.6">
<div class="st"><div class="nr">M</div></div>
      <script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.rand = MW.rand || function (seed) {
    var a = typeof seed === "string" ? MW.hash(seed) : (seed >>> 0) || 1;
    return function () { a = (a + 0x6d2b79f5) >>> 0; var t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  };
  MW.hash = MW.hash || function (s) { var h = 2166136261; s = String(s); for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; };
  MW.drive = MW.drive || function (tl, at, dur, fn) {
    var s = { t: 0 }; fn(0);
    tl.fromTo(s, { t: 0 }, { t: dur, duration: dur, ease: "none", immediateRender: false, onUpdate: function () { fn(s.t); } }, at);
    return at + dur;
  };
  var defaults = {"duration":1,"amount":0.85,"count":420,"speck":6,"margin":140,"blur":24,"ink":"#e8ebf3","accent":"#8b7bff","seed":4,"exitAt":null};
  var run = function (el, tl, at, o) {
        var host = el.parentNode, si = gsap.parseEase("sine.out"), pi = gsap.parseEase("power3.in"), cv = document.createElement("canvas"); if (getComputedStyle(host).position === "static") host.style.position = "relative";
        var m = o.margin, W = el.offsetWidth + 2 * m, Hh = el.offsetHeight + 2 * m; cv.width = W; cv.height = Hh; cv.style.cssText = "position:absolute;pointer-events:none;left:" + (el.offsetLeft - m) + "px;top:" + (el.offsetTop - m) + "px;width:" + W + "px;height:" + Hh + "px;"; host.appendChild(cv);
        var c = cv.getContext("2d"), R = Math.max(W, Hh) / 2;
        return MW.drive(tl, at, o.exitAt == null ? 0.25 + o.duration : o.exitAt + 0.25, function (t) {
          var f = Math.floor(t * 24), r = MW.rand(o.seed * 101 + f), fin = Math.min(1, t / 0.25), p = si(Math.max(0, Math.min(1, (t - 0.25) / o.duration))), x = o.exitAt != null && t > o.exitAt ? pi(Math.min(1, (t - o.exitAt) / 0.25)) : 0;
          c.clearRect(0, 0, W, Hh); var n = Math.round(o.count * (1 - p)), a = o.amount * fin * (1 - p);
          if (t > 0 && a > 0.005) for (var i = 0; i < n; i++) { var ang = r() * 2 * Math.PI, d = Math.sqrt(r()) * R; c.globalAlpha = a; c.fillStyle = r() < 0.667 ? o.ink : o.accent; c.fillRect(W / 2 + d * Math.cos(ang), Hh / 2 + d * Math.sin(ang), o.speck, o.speck); }
          c.globalAlpha = 1; var vis = t > 0 ? (0.2 + 0.8 * p) * (1 - x) : 0; el.style.opacity = String(vis); el.style.filter = p < 1 ? "blur(" + (o.blur * (1 - p)).toFixed(2) + "px)" : ""; gsap.set(el, { scale: 0.96 + 0.04 * p });
        });
      };
  MW.effectNoiseResolve = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
      </script>
      <script>
        (function () {
          var tl = gsap.timeline({ paused: true });
          var q = function (s) { return document.querySelector(s); }, qa = function (s) { return Array.prototype.slice.call(document.querySelectorAll(s)); };
          MW.effectNoiseResolve(q(".nr"), tl, 0.2, { exitAt: 2 });
          tl.set({}, {}, 2.6);
          // register only when every motion is ready (MW.pending: e.g. a WebGL texture still decoding), as HyperFrames asks of async builds
          var go = function () { window.__timelines = window.__timelines || {}; window.__timelines["mw-demo"] = tl; };
          if (window.MW && MW.pending && MW.pending.length) Promise.all(MW.pending).then(go, go); else go();
        })();
      </script>
    </div>
  </body>
</html>
