    MW.textShapeContour(q(".sc"), tl, 0, {});

  Options (defaults in brackets):
      - text: 
      - height: px of the heart (610)
      - size: px at most (90), fitted so the text closes the outline
      - repeats: repeats it moves per loop (1)
      - fill: 
      - line: 
      - sep: 
      - loop: s (5)

  Notes: Closed shape (demo heart 122 px tall, filled card colour with a 1 px outline). Text + ' • ' (separator accent) repeated m times so it exactly fills the perimeter, with size ≤ 18 px. Glyph baselines follow the outline, angle taken from a chord of ±1.1 em so cusps stay smooth. Offset moves forward linearly one repeat per 5 s (recipe: string × 2, startOffset 0 → −50 % per 10 s), seamless. Loop 5 s. Params: hình (trái tim, cao 122 px) · cỡ chữ tối đa (18 px) · tốc độ (một lượt lặp / 5 s). Each letter's angle comes from a chord of ±1.1 em, so the cusps of the outline stay smooth.
