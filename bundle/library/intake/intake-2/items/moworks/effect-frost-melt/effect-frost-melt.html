  Source: Moworks Studio.
  Lớp băng mờ có bông tuyết phủ thẻ tan dần từ mép vào giữa với mép tan lởm chởm, để lộ nội dung đã mở khoá bên dưới; ổ khoá ở giữa là chỗ tan sau cùng.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.effectFrostMelt(q(".gm"), tl, 0, {});

  Options (defaults in brackets):
      - rough: ± share of the edge noise (0.16)
      - aspect: vertical share of the round mask (0.78)
      - locked: 
      - open: 
      - accent: 
      - seed: flakes and edge
      - loop: s (4)

  Notes: Frost layer over a card 160x100 r12 (grey-blue fill, 16 seeded six-arm snowflakes, a LOCKED icon). Its round mask (radius 112 → 0, vertical × 0.78, edge noise ±16 % drifting slowly) shrinks from the edges to the centre over 1.65 s power1.inOut (0.45-2.1 s) with a thin light rim (1.5 px, 70 %) on the melting edge; the unlocked content (accent lock, UNLOCKED) shows beneath; the lock is the last thing covered. The frost returns by a fade 3.3-3.8 s. Params: melt (1.65 s, power1.inOut) · radius (112 → 0) · roughness (±16 %) · aspect (0.78) · refreeze (fade 0.5 s). The frost's mask shrinks from radius 112 to 0 over 1.65 s (power1.inOut), so the lock in the middle is the last thing covered; the frost comes back by a fade.
-->

<script>
(function () {

  MW.hash = MW.hash || function (s) { var h = 2166136261; s = String(s); for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; };
  MW.noise = MW.noise || function (seed) {

    return function (t) { var i = Math.floor(t), f = t - i, a = v[((i % 512) + 512) % 512], b = v[(((i + 1) % 512) + 512) % 512], s = f * f * (3 - 2 * f); return a + (b - a) * s; };
  };
  MW.drive = MW.drive || function (tl, at, dur, fn) {

    tl.fromTo(s, { t: 0 }, { t: dur, duration: dur, ease: "none", immediateRender: false, onUpdate: function () { fn(s.t); } }, at);

  };
  MW.canvas = MW.canvas || function (host, w, h) {

  MW.cursor = MW.cursor || function (c, x, y, s) { s = s || 1; c.save(); c.translate(x, y); c.scale(s, s); c.beginPath(); c.moveTo(0, 0); c.lineTo(0, 16); c.lineTo(4, 12.5); c.lineTo(6.5, 18); c.lineTo(9, 17); c.lineTo(6.5, 11.5); c.lineTo(11.5, 11.5); c.closePath(); c.fillStyle = "#fff"; c.fill(); c.lineWidth = 1; c.strokeStyle = "#111"; c.stroke(); c.restore(); };
  MW.path = MW.path || function (keys, t, ease) {

    if (t <= keys[0][0]) return [keys[0][1], keys[0][2]];
    for (var i = 1; i < keys.length; i++) if (t <= keys[i][0]) { var a = keys[i - 1], b = keys[i], u = e((t - a[0]) / ((b[0] - a[0]) || 1)); return [a[1] + (b[1] - a[1]) * u, a[2] + (b[2] - a[2]) * u]; }
    var z = keys[keys.length - 1]; return [z[1], z[2]];
  };
  MW.span = MW.span || function (t, a, b) { return Math.max(0, Math.min(1, (t - a) / (b - a))); };
  MW.yAt = MW.yAt || function (pts, x) { if (x <= pts[0][0]) return pts[0][1]; for (var i = 1; i < pts.length; i++) if (x <= pts[i][0]) { var u = (x - pts[i - 1][0]) / ((pts[i][0] - pts[i - 1][0]) || 1); return pts[i - 1][1] + (pts[i][1] - pts[i - 1][1]) * u; } return pts[pts.length - 1][1]; };
  MW.polyToX = MW.polyToX || function (c, pts, x) { c.beginPath(); c.moveTo(pts[0][0], pts[0][1]); for (var i = 1; i < pts.length; i++) { if (pts[i][0] <= x) c.lineTo(pts[i][0], pts[i][1]); else { c.lineTo(x, MW.yAt(pts, x)); break; } } return [Math.min(x, pts[pts.length - 1][0]), MW.yAt(pts, Math.min(x, pts[pts.length - 1][0]))]; };
  MW.stage320 = MW.stage320 || function (host) {
    host = MW.el(host); if (getComputedStyle(host).position === "static") host.style.position = "relative";
    var c = MW.canvas(host), k = Math.min(c.w / 320, c.h / 200), ox = (c.w - 320 * k) / 2, oy = (c.h - 200 * k) / 2;
    return { ctx: c.ctx, cv: c.cv, k: k, ox: ox, oy: oy, w: c.w, h: c.h,
      clear: function () { c.ctx.setTransform(1, 0, 0, 1, 0, 0); c.ctx.clearRect(0, 0, c.w, c.h); c.ctx.setTransform(k, 0, 0, k, ox, oy); },
      put: function (el, x, y) { el.style.position = "absolute"; el.style.left = (ox + x * k) + "px"; el.style.top = (oy + y * k) + "px"; gsap.set(el, { xPercent: -50, yPercent: -50 }); } };
  };
  var defaults = {"rough":0.16,"aspect":0.78,"locked":"ĐANG KHOÁ","open":"ĐÃ MỞ KHOÁ","accent":"#8b7bff","seed":6,"loop":4};
  var run = function (el, tl, at, o) {
        var S = MW.stage320(el), c = S.ctx, e = gsap.parseEase("power1.inOut"), nz = MW.noise(o.seed), r = MW.rand(o.seed + 3), L = 80, Tp = 50, W = 160, H = 100, cx = 160, cy = 100, flakes = [];
        for (var i = 0; i < 16; i++) flakes.push([L + 8 + r() * (W - 16), Tp + 8 + r() * (H - 16), 2.5 + r() * 4, r() * 6.28]);

        return MW.drive(tl, at, o.loop, function (t) {
          S.clear(); MW.rr(c, L, Tp, W, H, 12); c.fillStyle = "#151a24"; c.fill(); lock(cx, cy - 6, o.accent, true); MW.txt(c, o.open, cx, cy + 22, 9, "#c9c0ff", 800);
          var R = 112 * (1 - e(MW.span(t, 0.45, 2.1))), back = MW.span(t, 3.3, 3.8);
          c.save(); MW.rr(c, L, Tp, W, H, 12); c.clip(); if (back > 0) { c.globalAlpha = back; c.beginPath(); c.rect(L, Tp, W, H); } else mask(R, t);
          c.save(); c.clip(); c.fillStyle = "#8fa3c2"; c.fillRect(L, Tp, W, H); c.fillStyle = "rgba(255,255,255,0.25)"; c.fillRect(L, Tp, W, H / 2);
          flakes.forEach(function (f) { c.strokeStyle = "rgba(255,255,255,0.75)"; c.lineWidth = 0.8; for (var j = 0; j < 3; j++) { var a = f[3] + j * Math.PI / 3; c.beginPath(); c.moveTo(f[0] - f[2] * Math.cos(a), f[1] - f[2] * Math.sin(a)); c.lineTo(f[0] + f[2] * Math.cos(a), f[1] + f[2] * Math.sin(a)); c.stroke(); } });
          lock(cx, cy - 6, "#4a5a78", false); MW.txt(c, o.locked, cx, cy + 22, 9, "#4a5a78", 800); c.restore();

        });
      };
  MW.effectFrostMelt = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
