<!--
  Scale-through / Zoom Through (Moworks Studio, the studio's own, written here).
  Source: Moworks Studio.
  Cảnh cũ phóng to và mờ đi như máy quay lao qua, cảnh mới bên dưới phóng từ 80 % về đúng cỡ.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.transitionScaleThrough(q(".tk-b"), tl, 1.2, {});

  Options (defaults in brackets):
      - duration: s (0.6)
      - scaleOut: the outgoing scene grows to (1.3) while fading over 0-0.35 s
      - scaleIn: the incoming starts at (0.8), 0.25-0.6 s
      - from: the outgoing scene

  Notes: Outgoing scene on top: scale 1 -> 1.3 and opacity 1 -> 0 over 0-350 ms; the incoming scene sits underneath at full opacity, scale 0.8 -> 1 over 250-600 ms; easeInOutCubic, centre origin; 600 ms total. (The demo runs both over the whole transition, ease-in-out.) Params: duration (0.6 s) · scaleOut (1.3) · scaleIn (0.8).
-->

<section class="tk-scene tk-a"><div class="tk-mark circle"></div><div class="tk-sc-text"><div class="tk-sc-letter">A</div><div class="tk-sc-cap">Cảnh mở đầu</div></div></section>
<section class="tk-scene tk-b"><div class="tk-mark square"></div><div class="tk-sc-text"><div class="tk-sc-letter">B</div><div class="tk-sc-cap">Cảnh tiếp theo</div></div></section>

<style>

</style>

<script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.drive = MW.drive || function (tl, at, dur, fn) {
    var s = { t: 0 }; fn(0);
    tl.fromTo(s, { t: 0 }, { t: dur, duration: dur, ease: "none", immediateRender: false, onUpdate: function () { fn(s.t); } }, at);
    return at + dur;
  };
  var defaults = {"duration":0.6,"scaleOut":1.3,"scaleIn":0.8,"from":null};
  var run = function (el, tl, at, o) {
        var out = o.from ? MW.el(o.from) : el.previousElementSibling, ease = gsap.parseEase("power2.inOut"), T1 = 0.35 / 0.6 * o.duration, T0 = 0.25 / 0.6 * o.duration;
        return MW.drive(tl, at, o.duration, function (t) {
          var a = ease(Math.min(1, t / T1)), b = ease(Math.max(0, Math.min(1, (t - T0) / (o.duration - T0))));
          if (out) { gsap.set(out, { scale: t > 0 ? 1 + (o.scaleOut - 1) * a : 1, zIndex: t > 0 && t < o.duration ? 3 : "auto" }); out.style.opacity = t > 0 ? 1 - a : 1; out.style.visibility = t >= T1 ? "hidden" : "visible"; }
          gsap.set(el, { scale: t > 0 ? o.scaleIn + (1 - o.scaleIn) * b : 1 }); el.style.visibility = t > 0 ? "visible" : "hidden";
        });
      };
  MW.transitionScaleThrough = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
</script>
