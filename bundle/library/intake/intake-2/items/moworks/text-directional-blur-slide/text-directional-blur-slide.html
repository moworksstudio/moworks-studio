<!--
  Directional Blur Slide (Moworks Studio, the studio's own, written here).
  Source: Moworks Studio.
  Chữ lướt vào từ trái 200 px, chỉ nhoè theo chiều ngang như vệt chuyển động của máy quay, nét lại khi dừng.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.textDirectionalBlurSlide(q(".tk-head"), tl, 0.3, { exitAt: 1.7 });

  Options (defaults in brackets):
      - x: px it slides in from (−800)
      - blur: horizontal blur at the start, stdDeviation px (60)
      - duration: s (0.5)
      - ease: (expo.out): the blur follows the move, 0 when it stops
      - exitAt: s after the start to slide out the other way (null)
      - exit: s (0.4, expo.in)

  Notes: x −200 → 0 px in 0.5 s expo.out (cubic-bezier(.16,1,.3,1)); horizontal-only blur (SVG feGaussianBlur stdDeviation "20 0" → "0 0", ≈40 px spread) on the same spline as the move, so it is 0 exactly when the text stops. CSS fallback: scaleX 1.6 → 1.05 → 1 (origin right) with blur 4 px → 0 and opacity 0 → 1 by 60 %. Canvas demo: −220 px over 0.55 s as a 12-sample trail covering 1/48 s (180° shutter at 24 fps), exit +220 px 2.0–2.4 s expo.in; loop 2.6 s. Params: x: quãng lướt (−200 px) · blur: nhoè ngang (40 px) · duration (0.5 s, expo.out) · shutter (180°).
-->

<script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.drive = MW.drive || function (tl, at, dur, fn) {
    var s = { t: 0 }; fn(0);
    tl.fromTo(s, { t: 0 }, { t: dur, duration: dur, ease: "none", immediateRender: false, onUpdate: function () { fn(s.t); } }, at);
    return at + dur;
  };
  var defaults = {"x":-800,"blur":60,"duration":0.5,"ease":"expo.out","exitAt":null,"exit":0.4};
  var run = function (el, tl, at, o) {
        window.__mwHBlur = (window.__mwHBlur || 0) + 1; var id = "mw-hblur-" + window.__mwHBlur, ns = "http://www.w3.org/2000/svg", svg = document.createElementNS(ns, "svg"), f = document.createElementNS(ns, "filter"), g = document.createElementNS(ns, "feGaussianBlur");
        svg.setAttribute("width", "0"); svg.setAttribute("height", "0"); svg.style.position = "absolute"; f.setAttribute("id", id); f.setAttribute("x", "-50%"); f.setAttribute("width", "200%"); f.setAttribute("y", "-10%"); f.setAttribute("height", "120%"); f.setAttribute("color-interpolation-filters", "sRGB");
        g.setAttribute("stdDeviation", "0 0"); f.appendChild(g); svg.appendChild(f); document.body.appendChild(svg);
        var e = gsap.parseEase(o.ease), ei = gsap.parseEase("expo.in");
        return MW.drive(tl, at, o.exitAt == null ? o.duration : o.exitAt + o.exit, function (t) {
          var p = e(Math.min(1, t / o.duration)), x = o.x * (1 - p), b = o.blur * (1 - p), a = Math.min(1, t / 0.08);
          if (o.exitAt != null && t > o.exitAt) { var q = ei(Math.min(1, (t - o.exitAt) / o.exit)); x = -o.x * q; b = o.blur * q; a = 1 - Math.max(0, (q - 0.7) / 0.3); }
          gsap.set(el, { x: x }); g.setAttribute("stdDeviation", b.toFixed(2) + " 0"); el.style.filter = b > 0.05 ? "url(#" + id + ")" : ""; el.style.opacity = String(a);
        });
      };
  MW.textDirectionalBlurSlide = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
</script>
