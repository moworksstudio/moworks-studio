    MW.textSparkles(q(".tk-head"), tl, 0, {});

  Options (defaults in brackets):
      - count: (10)
      - life: s per sparkle (0.8)
      - periods: s, each star takes one ([1, 1.333, 2])
      - size: [min, max] radius in em ([0.12, 0.26])
      - pad: px around the text (56)
      - below: px below it (40)
      - colors: 
      - seed: (5)
      - loop: s, seamless (4)

  Notes: 10 four-point stars (concave sides, control at 0.16 r), colours cycling accent / yellow / ink. Each star has a seeded period of 1, 1.33 or 2 s and seeded offset; in each period it lives 0.8 s at a new seeded spot inside the text box widened 14 px (10 px below): size = radius (0.12–0.26 em) × sin(πu), opacity = sin(πu), rotation 75° → 150° linear over its life. Seamless loop 4 s. Params: số sao (10) · đời sao (0.8 s) · cỡ (0.12–0.26 em bán kính) · xoay (75° → 150°).
