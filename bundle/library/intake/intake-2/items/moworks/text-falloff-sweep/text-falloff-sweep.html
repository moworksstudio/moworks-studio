<!--
  MoText Falloff Sweep (Moworks Studio, the studio's own, written here).
  Source: Moworks Studio.
  Một vùng ảnh hưởng vô hình quét ngang dòng chữ như MoText của Cinema 4D, chữ nào trong vùng thì nhô lên, phóng to, xoay, rồi nảy về nhờ độ trễ lò xo.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.textFalloffSweep(q(".tk-head"), tl, 0, {});

  Options (defaults in brackets):
      - radius: px of the falloff (230)
      - margin: px the sweep starts before / ends past the frame (350)
      - rise: px (70)
      - k: spring stiffness (140)
      - c: damping (9)
      - unit: px per extrusion step unit (4)
      - tint: colour inside the falloff
      - loop: s (3.4)

  Notes: Falloff centre sweeps from 70 px left of the frame to 70 px past its right edge, 0.35–2.05 s linear; weight w = smoothstep(1 − d / 46 px) (50 px text). Delay: each char's w (sampled every 0.07 s) is followed by a spring k 140, c 9 (ζ≈0.38, floored at −0.2) → v. Per char: y −14 px × v, scale 1 + 0.16 v, rotation 20° × v, yellow tint 0.55 v. Extrusion: 9 copies offset k × 0.9 × (1 + 0.8 v) px down-right, accent, opacity 0.95 → 0.55. Loop 3.4 s. Params: bề rộng vùng (±46 px) · thời gian quét (1.7 s) · xoay (20°) · phóng (+16 %) · nhô (14 px).
-->

<div class="tk-stage"><div><h1 class="tk-head ">Vùng quét đi qua</h1></div></div>

<style>

</style>

<script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.split = MW.split || function (el, mode) {
    el = MW.el(el);
    if (el.__mwSplit) return el.__mwSplit;
    var seg = typeof Intl !== "undefined" && Intl.Segmenter ? new Intl.Segmenter("vi", { granularity: "grapheme" }) : null;
    var graphemes = function (s) { if (seg) { var out = []; var it = seg.segment(s)[Symbol.iterator](), r; while (!(r = it.next()).done) out.push(r.value.segment); return out; } return Array.from(s); };
    var res = { chars: [], words: [], lines: [] };
    var walk = function (node) {
      var kids = Array.prototype.slice.call(node.childNodes);
      for (var k = 0; k < kids.length; k++) {
        var n = kids[k];
        if (n.nodeType === 1) { if (n.tagName === "BR") continue; walk(n); continue; }
        if (n.nodeType !== 3) continue;
        var text = n.nodeValue.normalize("NFC"), frag = document.createDocumentFragment();
        var parts = text.split(/(\s+)/);
        for (var p = 0; p < parts.length; p++) {
          var part = parts[p];
          if (!part) continue;
          if (/^\s+$/.test(part)) { frag.appendChild(document.createTextNode(part)); continue; }
          var w = document.createElement("span");
          w.className = "mw-w"; w.style.display = "inline-block"; w.style.whiteSpace = "nowrap";
          if (mode === "words") w.textContent = part;
          else { var gs = graphemes(part); for (var g = 0; g < gs.length; g++) { var c = document.createElement("span"); c.className = "mw-ch"; c.style.display = "inline-block"; c.textContent = gs[g]; w.appendChild(c); res.chars.push(c); } }
          res.words.push(w); frag.appendChild(w);
        }
        node.replaceChild(frag, n);
      }
    };
    walk(el);
    var top = null, line = null;
    for (var i = 0; i < res.words.length; i++) { var y = res.words[i].offsetTop; if (top === null || Math.abs(y - top) > 2) { top = y; line = []; res.lines.push(line); } line.push(res.words[i]); }
    el.__mwSplit = res;
    return res;
  };
  MW.drive = MW.drive || function (tl, at, dur, fn) {
    var s = { t: 0 }; fn(0);
    tl.fromTo(s, { t: 0 }, { t: dur, duration: dur, ease: "none", immediateRender: false, onUpdate: function () { fn(s.t); } }, at);
    return at + dur;
  };
  var defaults = {"radius":230,"margin":350,"rise":70,"k":140,"c":9,"unit":4,"tint":"#ffd23d","loop":3.4};
  var run = function (el, tl, at, o) {
        var ch = MW.split(el, "chars").chars, col = getComputedStyle(el).color, mix = gsap.utils.interpolate(col, o.tint), dt = 1 / 240;
        return MW.drive(tl, at, o.loop, function (t) {
          var W = el.parentNode.offsetWidth, R = o.radius;
          ch.forEach(function (c) {
            var cx = c.getBoundingClientRect(), hb = el.parentNode.getBoundingClientRect(), x = cx.left - hb.left + cx.width / 2, v = 0, vv = 0;
            for (var s = 0; s < t; s += dt) { var ts = Math.floor(s / 0.07) * 0.07, fx = -o.margin + (W + 2 * o.margin) * Math.max(0, Math.min(1, (ts - 0.35) / 1.7)), d = Math.abs(fx - x), q = Math.max(0, 1 - d / R), w = q * q * (3 - 2 * q); var a = o.k * (w - v) - o.c * vv; vv += a * dt; v += vv * dt; if (v < -0.2) { v = -0.2; vv = 0; } }
            gsap.set(c, { y: -o.rise * v, scale: 1 + 0.16 * v, rotation: 20 * v }); c.style.color = mix(0.55 * Math.max(0, v));
            var sh = []; for (var k = 1; k <= 9; k++) { var off = k * 0.9 * (1 + 0.8 * v) * o.unit; sh.push(off + "px " + off + "px 0 rgba(139,123,255," + (0.95 - 0.4 * (k - 1) / 8) + ")"); } c.style.textShadow = sh.join(",");
          });
        });
      };
  MW.textFalloffSweep = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
</script>
