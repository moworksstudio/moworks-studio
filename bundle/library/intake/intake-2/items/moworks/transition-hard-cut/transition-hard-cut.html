<!--
  Hard Cut (Moworks Studio, the studio's own, written here).
  Source: Moworks Studio.
  Cảnh mới hiện trọn ngay khung đầu tiên sau điểm cắt, không có khung chuyển tiếp, cắt đúng phách nhạc.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.transitionHardCut(q(".tk-b"), tl, 1.5, {});

  Options (defaults in brackets):
      - from: the outgoing scene (the previous sibling)

  Notes: No interpolation: the outgoing scene shows until the cut frame and the incoming scene is 100 % complete on the next frame (nothing assembles late, or it reads as loading). Cut on a beat or a word; shift the composition's weight across the cut. Demo: scene A (dark card, circle + 'A') <-> scene B (accent, square + 'B'), cut halfway through each 1.5 s half. Params: cut: điểm cắt (phách / từ) · không có duration.
-->

<section class="tk-scene tk-a"><div class="tk-mark circle"></div><div class="tk-sc-text"><div class="tk-sc-letter">A</div><div class="tk-sc-cap">Cảnh mở đầu</div></div></section>
<section class="tk-scene tk-b"><div class="tk-mark square"></div><div class="tk-sc-text"><div class="tk-sc-letter">B</div><div class="tk-sc-cap">Cảnh tiếp theo</div></div></section>

<style>

</style>

<script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  var defaults = {"from":null};
  var run = function (el, tl, at, o) {
        var out = o.from ? MW.el(o.from) : el.previousElementSibling;
        gsap.set(el, { autoAlpha: 0 });
        tl.set(el, { autoAlpha: 1 }, at);
        if (out) tl.set(out, { autoAlpha: 0 }, at);
        return at;
      };
  MW.transitionHardCut = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
</script>
