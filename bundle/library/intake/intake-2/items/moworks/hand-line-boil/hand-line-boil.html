<!--
  Line Boil (Moworks Studio, the studio's own, written here).
  Source: Moworks Studio.
  Hình vẽ được vẽ lại 12 lần mỗi giây, mỗi lần lệch một chút nên nét run rẩy như phim vẽ tay.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.handLineBoil(q(".lb"), tl, 0, {});

  Options (defaults in brackets):
      - fps: drawings a second (12)
      - amp: ± px (6; 1.5 at UI size)
      - variants: drawings it cycles through (3)
      - frequency: of the noise (0.02)
      - seed: (1)
      - duration: s (4)

  Notes: Redraw at 12 fps (2 frames per drawing at 24 fps, ~83 ms), cycling 3 variants, each jittering the drawing +-1.5 px. Demo: a face circle r 50 from 41 points, radius jitter +-2 px re-seeded every 1/12 s (no fixed variants), eyes +-1 px. Params: fps (12) · amp (±1.5 px) · variants (3). An SVG displacement filter whose noise seed changes 12 times a second, cycling a few variants, so any drawing or text boils like hand animation.
-->

<div class="st"><svg class="lb" viewBox="0 0 200 200"><g fill="none" stroke="#e8ebf3" stroke-width="4" stroke-linecap="round"><circle cx="100" cy="100" r="78"/><path d="M62 118 Q100 150 138 118"/><path d="M70 74 L70 88 M130 74 L130 88"/></g><circle cx="100" cy="100" r="78" fill="#8b7bff" opacity="0.18"/></svg></div>

<style>

</style>

<script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.drive = MW.drive || function (tl, at, dur, fn) {
    var s = { t: 0 }; fn(0);
    tl.fromTo(s, { t: 0 }, { t: dur, duration: dur, ease: "none", immediateRender: false, onUpdate: function () { fn(s.t); } }, at);
    return at + dur;
  };
  var defaults = {"fps":12,"amp":6,"variants":3,"frequency":0.02,"seed":1,"duration":4};
  var run = function (el, tl, at, o) {
        window.__mwBoil = (window.__mwBoil || 0) + 1; var id = "mw-boil-" + window.__mwBoil, ns = "http://www.w3.org/2000/svg", svg = document.createElementNS(ns, "svg"); svg.setAttribute("width", "0"); svg.setAttribute("height", "0"); svg.style.position = "absolute";
        svg.innerHTML = '<filter id="' + id + '" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="fractalNoise" baseFrequency="' + o.frequency + '" numOctaves="2" seed="1"/><feDisplacementMap in="SourceGraphic" scale="' + 2 * o.amp + '" xChannelSelector="R" yChannelSelector="G"/></filter>';
        var tb = svg.querySelector("feTurbulence"), dm = svg.querySelector("feDisplacementMap"); dm.setAttribute("in2", "n"); tb.setAttribute("result", "n"); el.parentNode.insertBefore(svg, el); el.style.filter = "url(#" + id + ")";
        return MW.drive(tl, at, o.duration, function (t) { tb.setAttribute("seed", String(1 + o.seed * 7 + Math.floor(t * o.fps + 1e-6) % o.variants)); });
      };
  MW.handLineBoil = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
</script>
