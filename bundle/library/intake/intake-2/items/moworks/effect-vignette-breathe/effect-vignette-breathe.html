<!--
  Vignette Breathe (Moworks Studio, the studio's own, written here).
  Source: Moworks Studio.
  Bốn góc khung tối nhẹ và đậm nhạt chậm theo nhịp thở để kéo mắt vào giữa.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.effectVignetteBreathe(q(".vg"), tl, 0, {});

  Options (defaults in brackets):
      - edge: [min, max] edge darkness ([0.25, 0.45])
      - inner: clear radius in the 320 frame (60)
      - outer: full at (200)
      - period: s (3)
      - loop: s (3)

  Notes: Radial gradient overlay, clear in the middle, edges darkening; edge darkness 15 % <-> 25 % on a 3000 ms sine loop (opacity yoyo). Demo: clear inside r 60, full at r 200 on a 320 x 200 frame, edge alpha 0.25-0.45. House lesson: no grade + vignette over footage by default. Params: amount (15 ↔ 25 %) · period (3 s). House rule: no grade and vignette over footage by default.
-->

<div class="vg"></div>

<style>

</style>

<script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.drive = MW.drive || function (tl, at, dur, fn) {
    var s = { t: 0 }; fn(0);
    tl.fromTo(s, { t: 0 }, { t: dur, duration: dur, ease: "none", immediateRender: false, onUpdate: function () { fn(s.t); } }, at);
    return at + dur;
  };
  var defaults = {"edge":[0.25,0.45],"inner":60,"outer":200,"period":3,"loop":3};
  var run = function (el, tl, at, o) {
        if (getComputedStyle(el).position === "static") el.style.position = "relative"; var v = document.createElement("div"), W = el.clientWidth, k = W / 320; v.style.cssText = "position:absolute;inset:0;pointer-events:none;"; el.appendChild(v);
        return MW.drive(tl, at, o.loop, function (t) { var a = o.edge[0] + (o.edge[1] - o.edge[0]) * (0.5 - 0.5 * Math.cos(2 * Math.PI * t / o.period)); v.style.background = "radial-gradient(circle at 50% 50%, rgba(0,0,0,0) " + (o.inner * k).toFixed(0) + "px, rgba(0,0,0," + a.toFixed(3) + ") " + (o.outer * k).toFixed(0) + "px)"; });
      };
  MW.effectVignetteBreathe = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
</script>
