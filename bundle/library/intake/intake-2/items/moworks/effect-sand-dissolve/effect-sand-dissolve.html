  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.effectSandDissolve(q(".gm"), tl, 0, {});

  Options (defaults in brackets):
      - before: 
      - beforeSub: 
      - after: 
      - afterSub: 
      - seed: (12)
      - loop: s (3.9)

  Notes: Element cut into 18 × 9 grains of 7 px. Grain in column i starts at 0.5 s + 60 ms × i + hash × 0.22 s: trembles ±0.6 px for 0.15 s, then falls y + 300 τ² px (g about 600 px/s²), drifts x ± 18 px × τ, shrinks 1.5 px and fades between τ 0.25-0.6 s. The next state (card with a green check and text) sits underneath. Reform from 3.3 s, +20 ms per column (0.25 s fades). Params: grains (18 × 9 × 7 px) · each (0.06 s / cột + 0-0.22 s) · gravity (600 px/s²) · drift (±18 px/s) · reform (3.3 s). 18 × 9 grains of 7 units; column i starts at 0.5 s + 0.06 s × i + up to 0.22 s, trembles 0.15 s, then falls 300 τ² with a sideways drift, shrinking and fading; reforms from 3.3 s.

<script>

  var run = function (el, tl, at, o) {

    for (k in defaults) o[k] = defaults[k];
