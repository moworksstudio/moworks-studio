  Waypoint Hop (Moworks Studio, the studio's own, written here).
  Source: Moworks Studio.
  Điểm đánh dấu nhảy qua bốn mốc, đáp xuống bẹp nhẹ, mốc nào tới thì bật sáng và vạch tiến độ dài theo.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.motionWaypointHop(q(".wh"), tl, 0.3, {});

  Options (defaults in brackets):
      - points: the waypoints
      - line: a progress line that fills
      - hop: s per hop (0.25, x power2.out)
      - land: s on the ground (0.05)
      - height: px of the arc (150)
      - accent: 

  Notes: A marker hops across 4 points ~67 px apart: each hop 250 ms (x power2.out, y = −24 to −28·sin(π q) px arc), then a 50 ms ground beat with landing squash scaleY 0.92 (120 ms sine bump); each reached point pops (scale back.out, 200 ms) and a progress line fills behind. Total 860–900 ms. Params: hop: mỗi bước (0.25 s) · height (24–28 px) · land (0.05 s) · squash (0.92) · points (4).
-->
