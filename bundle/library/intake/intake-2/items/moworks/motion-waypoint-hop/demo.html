<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Waypoint Hop - Demo</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
:root { --bg: #09090b; --fg: #fafafa; --card: #111114; --line: #27272a; }
* { box-sizing: border-box; }
html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); }
#demo { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); color: var(--fg); font-family: Inter, sans-serif; }
.center { position: absolute; inset: 0; display: grid; place-items: center; }
.row { display: flex; align-items: center; justify-content: center; gap: 48px; }
.col { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 32px; }
.h1 { font-size: 132px; font-weight: 800; letter-spacing: -0.035em; line-height: 1.1; text-align: center; }
.h2 { font-size: 84px; font-weight: 700; letter-spacing: -0.025em; line-height: 1.15; text-align: center; }
.p { font-size: 40px; line-height: 1.4; opacity: 0.72; text-align: center; }
.card { position: relative; border-radius: 28px; background: var(--card); border: 2px solid var(--line); overflow: hidden; }
.muted { opacity: 0.6; }

#demo { background: radial-gradient(100% 100% at 50% 45%, #1a1f33, #0b0d12); color: #e8ebf3; font-family: Inter, sans-serif; }
.wh-t, .wh-l { position: absolute; left: 360px; width: 1200px; top: 596px; height: 8px; border-radius: 4px; background: #262c3a; } .wh-l { background: #8b7bff; transform: scaleX(0); } .wh-p { position: absolute; top: 560px; width: 80px; height: 80px; margin-left: -40px; border-radius: 50%; background: #2a3142; border: 6px solid #10131d; box-sizing: border-box; }
.wh { position: absolute; left: 360px; top: 440px; width: 70px; height: 110px; margin-left: -35px; } .wh::before { content: ""; position: absolute; inset: 0; border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%; background: #ffd23d; }
    </style>
  </head>
  <body>
    <div id="demo" data-composition-id="mw-demo" data-start="0" data-width="1920" data-height="1080" data-duration="1.8">
<div class="wh-t"></div><div class="wh-l"></div><div class="wh-p" style="left:360px"></div><div class="wh-p" style="left:760px"></div><div class="wh-p" style="left:1160px"></div><div class="wh-p" style="left:1560px"></div><div class="wh"></div>
      <script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.drive = MW.drive || function (tl, at, dur, fn) {
    var s = { t: 0 }; fn(0);
    tl.fromTo(s, { t: 0 }, { t: dur, duration: dur, ease: "none", immediateRender: false, onUpdate: function () { fn(s.t); } }, at);
    return at + dur;
  };
  var defaults = {"points":".wh-p","line":".wh-l","hop":0.25,"land":0.05,"height":150,"accent":"#8b7bff"};
  var run = function (el,tl,at,o
  ) {
  var host = el.parentNode; if (getComputedStyle(host).position === "static") host.style.position = "relative";
  var ghost = function () { var g = el.cloneNode(true); g.removeAttribute("id"); g.style.position = "absolute"; g.style.margin = "0"; g.style.pointerEvents = "none"; g.style.opacity = "0"; g.style.left = el.offsetLeft + "px"; g.style.top = el.offsetTop + "px"; g.style.width = el.offsetWidth + "px"; g.style.height = el.offsetHeight + "px"; host.insertBefore(g, el); return g; };
  var add = function (css) { var d = document.createElement("div"); d.style.cssText = "position:absolute;pointer-events:none;" + css; host.appendChild(d); return d; };
  var cx0 = el.offsetLeft + el.offsetWidth / 2, cy0 = el.offsetTop + el.offsetHeight / 2;
  var pts = Array.prototype.slice.call(host.querySelectorAll(o.points)), line = o.line ? host.querySelector(o.line) : null, p2 = gsap.parseEase("power2.out"), bo = gsap.parseEase("back.out(2)"), X = pts.map(function (p) { return p.offsetLeft + p.offsetWidth / 2 - cx0; }), step = o.hop + o.land;
  gsap.set(el, { transformOrigin: "50% 100%" }); if (line) gsap.set(line, { transformOrigin: "0% 50%" });
  return MW.drive(tl, at, (X.length - 1) * step + 0.6, function (t) { var k = Math.min(X.length - 2, Math.floor(t / step)), u = t - k * step, q = Math.min(1, u / o.hop), x = X[k] + (X[k + 1] - X[k]) * p2(q), y = u < o.hop ? -o.height * Math.sin(Math.PI * q) : 0, land = Math.sin(Math.PI * Math.max(0, Math.min(1, (u - o.hop) / 0.12)));
    if (t >= (X.length - 1) * step) { x = X[X.length - 1]; y = 0; } gsap.set(el, { x: x, y: y, scaleY: 1 - 0.08 * (u >= o.hop ? land : 0) });
    pts.forEach(function (p, i) { var r = i === 0 ? 1 : bo(Math.max(0, Math.min(1, (t - (i - 1) * step - o.hop) / 0.2))); gsap.set(p, { scale: 0.7 + 0.3 * r }); p.style.background = r > 0.01 ? o.accent : ""; }); if (line) gsap.set(line, { scaleX: Math.max(0, Math.min(1, (x - X[0]) / (X[X.length - 1] - X[0]))) }); });
  };
  MW.motionWaypointHop = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
      </script>
      <script>
        (function () {
          var tl = gsap.timeline({ paused: true });
          var q = function (s) { return document.querySelector(s); }, qa = function (s) { return Array.prototype.slice.call(document.querySelectorAll(s)); };
          MW.motionWaypointHop(q(".wh"), tl, 0.3, {});
          tl.set({}, {}, 1.8);
          // register only when every motion is ready (MW.pending: e.g. a WebGL texture still decoding), as HyperFrames asks of async builds
          var go = function () { window.__timelines = window.__timelines || {}; window.__timelines["mw-demo"] = tl; };
          if (window.MW && MW.pending && MW.pending.length) Promise.all(MW.pending).then(go, go); else go();
        })();
      </script>
    </div>
  </body>
</html>
