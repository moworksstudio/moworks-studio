<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Ripple Reveal - Demo</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
:root { --bg: #09090b; --fg: #fafafa; --card: #111114; --line: #27272a; }
* { box-sizing: border-box; }
html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); }
#demo { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); color: var(--fg); font-family: Inter, sans-serif; }
.center { position: absolute; inset: 0; display: grid; place-items: center; }
.row { display: flex; align-items: center; justify-content: center; gap: 48px; }
.col { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 32px; }
.h1 { font-size: 132px; font-weight: 800; letter-spacing: -0.035em; line-height: 1.1; text-align: center; }
.h2 { font-size: 84px; font-weight: 700; letter-spacing: -0.025em; line-height: 1.15; text-align: center; }
.p { font-size: 40px; line-height: 1.4; opacity: 0.72; text-align: center; }
.card { position: relative; border-radius: 28px; background: var(--card); border: 2px solid var(--line); overflow: hidden; }
.muted { opacity: 0.6; }

#demo { background: radial-gradient(100% 100% at 50% 45%, #1a1f33, #0b0d12); color: #e8ebf3; font-family: Inter, sans-serif; } .gm { position: absolute; inset: 0; }
.st { position: absolute; inset: 0; display: grid; place-items: center; } .bx { position: relative; width: 1000px; height: 580px; border-radius: 40px; overflow: hidden; background: url(assets/pic.svg) center / cover; box-shadow: 0 50px 120px rgba(0,0,0,0.45); }
    </style>
  </head>
  <body>
    <div id="demo" data-composition-id="mw-demo" data-start="0" data-width="1920" data-height="1080" data-duration="1.8">
<div class="st"><div class="bx rp" style="opacity:0"></div></div>
      <script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.drive = MW.drive || function (tl, at, dur, fn) {
    var s = { t: 0 }; fn(0);
    tl.fromTo(s, { t: 0 }, { t: dur, duration: dur, ease: "none", immediateRender: false, onUpdate: function () { fn(s.t); } }, at);
    return at + dur;
  };
  var defaults = {"duration":0.95,"point":[0.5,0.5],"start":40,"radius":null,"delay2":0.11,"stroke":[10,6],"accent":"#a99bff"};
  var run = function (el, tl, at, o) {
        var host = el.parentNode, p3 = gsap.parseEase("power3.out"), W = el.offsetWidth, Hh = el.offsetHeight, x = W * o.point[0], y = Hh * o.point[1], far = Math.max(Math.hypot(x, y), Math.hypot(W - x, y), Math.hypot(x, Hh - y), Math.hypot(W - x, Hh - y)), R1 = o.radius || far / 1.05, rings = [], dot = document.createElement("div");
        if (getComputedStyle(host).position === "static") host.style.position = "relative"; var hx = el.offsetLeft + x, hy = el.offsetTop + y;
        [[o.stroke[0], 0.9], [o.stroke[1], 0.5]].forEach(function (s) { var r = document.createElement("div"); r.style.cssText = "position:absolute;border-radius:50%;pointer-events:none;opacity:0;z-index:3;box-sizing:border-box;border:" + s[0] + "px solid " + o.accent + ";"; r.__a = s[1]; host.appendChild(r); rings.push(r); });
        dot.style.cssText = "position:absolute;width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;background:#fff;pointer-events:none;opacity:0;z-index:3;left:" + hx + "px;top:" + hy + "px;"; host.appendChild(dot);
        return MW.drive(tl, at, o.duration, function (t) {
          rings.forEach(function (r, i) { var st = i ? o.delay2 : 0, u = Math.max(0, Math.min(1, (t - st) / (o.duration - st))), rad = o.start + (R1 - o.start) * p3(u); r.style.width = r.style.height = 2 * rad + "px"; r.style.left = hx - rad + "px"; r.style.top = hy - rad + "px"; r.style.opacity = t > st && u < 1 ? String(r.__a * (1 - u)) : "0"; });
          var c1 = (o.start + (R1 - o.start) * p3(Math.max(0, Math.min(1, t / o.duration)))) * 1.05; el.style.clipPath = t > 0 ? "circle(" + c1.toFixed(1) + "px at " + x.toFixed(1) + "px " + y.toFixed(1) + "px)" : "circle(0px at 50% 50%)";
          el.style.opacity = String(p3(Math.max(0, Math.min(1, (t - 0.08) / 0.62)))); dot.style.opacity = t > 0 && t < 0.14 ? "1" : "0";
        });
      };
  MW.effectRippleReveal = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
      </script>
      <script>
        (function () {
          var tl = gsap.timeline({ paused: true });
          var q = function (s) { return document.querySelector(s); }, qa = function (s) { return Array.prototype.slice.call(document.querySelectorAll(s)); };
          MW.effectRippleReveal(q(".rp"), tl, 0.4, { point: [0.42, 0.55] });
          tl.set({}, {}, 1.8);
          // register only when every motion is ready (MW.pending: e.g. a WebGL texture still decoding), as HyperFrames asks of async builds
          var go = function () { window.__timelines = window.__timelines || {}; window.__timelines["mw-demo"] = tl; };
          if (window.MW && MW.pending && MW.pending.length) Promise.all(MW.pending).then(go, go); else go();
        })();
      </script>
    </div>
  </body>
</html>
