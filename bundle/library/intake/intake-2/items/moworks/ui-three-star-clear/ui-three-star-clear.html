  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.uiThreeStarClear(q(".gm"), tl, 0, {});

  Options (defaults in brackets):
      - first: s the first star lands (0.35)
      - stagger: s (0.42)
      - from: start scale (2.2)
      - tilt: start degrees (−40)
      - label: 
      - accent: underline
      - loop: s (2.8)

  Notes: px @320x200. Stars r 22 / 28 / 22 (middle 12 px higher) over grey slots; landings at 0.35, 0.77, 1.19 s: each approaches in 180 ms in-cubic, scale 2.2 → 1 and rotation −40° → 0 (fade in 80 ms), then 0.8 → 1 spring k400 d14; ±2 px frame shake 150 ms and an 8-dot burst to r + 16 per landing (350 ms). 'CLEAR' fades in 1.75-1.95 s and rises 8 px (1.75-2.0 s outCubic) with an 80 px accent underline. Loop fade 2.4-2.8 s. Params: stars: số sao (3) · stagger: cách nhau (0.42 s) · from: cỡ đầu (2.2) · tilt: nghiêng đầu (−40°) · label ("CLEAR"). Each star comes down in 0.18 s (ease-in cubic), then springs 0.8 → 1 (k400 c14) with a small frame shake and a dot burst.
