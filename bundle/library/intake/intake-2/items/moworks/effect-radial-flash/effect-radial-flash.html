<!--
  Radial Flash (Moworks Studio, the studio's own, written here).
  Source: Moworks Studio.
  Ngôi sao loé sáng và nảy nhẹ, một vòng sóng toả ra cùng mười hai tia hai màu bắn ra rồi tắt.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.effectRadialFlash(q(".rf-s"), tl, 0.5, {});

  Options (defaults in brackets):
      - unit: px per reference unit (5)
      - color: flash colour
      - color2: second ray colour

  Notes: Hit at t0: core brightness 100 → 220 % → 100 (sine bump^0.7 over 320 ms) with an additive soft glow; the star pops: scale 1 + 0.14·e^(−7 t)·sin(22 t), first half-wave only. From 60 ms a ring: radius 0.2 → 2.3 × 40 px, opacity 0.9 → 0, stroke 4 → 1 px, 500 ms expo.out. 12 rays in two colours move out (30→60 to 36→88 px) and fade over 350 ms expo.out. Params: core (100 → 220 %) · ring (0.2 → 2.3 × 40 px) · rays (12) · duration (0.56 s). Call once per hit.
-->

<div class="gm rf"><div class="rf-s"></div></div>

<style>

</style>

<script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.drive = MW.drive || function (tl, at, dur, fn) {
    var s = { t: 0 }; fn(0);
    tl.fromTo(s, { t: 0 }, { t: dur, duration: dur, ease: "none", immediateRender: false, onUpdate: function () { fn(s.t); } }, at);
    return at + dur;
  };
  MW.canvas = MW.canvas || function (host, w, h) {
    host = MW.el(host);
    var cv = document.createElement("canvas"); w = w || host.clientWidth || 1920; h = h || host.clientHeight || 1080;
    cv.width = w; cv.height = h; cv.style.position = "absolute"; cv.style.left = "0"; cv.style.top = "0"; cv.style.width = w + "px"; cv.style.height = h + "px"; cv.style.pointerEvents = "none";
    host.appendChild(cv);
    return { cv: cv, ctx: cv.getContext("2d"), w: w, h: h };
  };
  var defaults = {"unit":5,"color":"#ffd23d","color2":"#a99bff"};
  var run = function (el, tl, at, o) {
        var host = el.parentNode, cv = MW.canvas(host), c = cv.ctx, ex = gsap.parseEase("expo.out"); cv.cv.style.zIndex = "1"; el.style.position = el.style.position || "relative"; el.style.zIndex = "2";
        return MW.drive(tl, at, 0.6, function (t) {
          var cx = el.offsetLeft + el.offsetWidth / 2, cy = el.offsetTop + el.offsetHeight / 2, k = o.unit, bump = t < 0.32 ? Math.pow(Math.sin(Math.PI * t / 0.32), 0.7) : 0, sc = t < Math.PI / 22 ? 1 + 0.14 * Math.exp(-7 * t) * Math.sin(22 * t) : 1;
          el.style.filter = "brightness(" + (1 + 1.2 * bump) + ") drop-shadow(0 0 " + 40 * bump + "px " + o.color + ")"; gsap.set(el, { scale: sc });
          c.clearRect(0, 0, cv.w, cv.h); var d = t - 0.06;
          if (d > 0 && d < 0.5) { var q = ex(d / 0.5); c.globalAlpha = 0.9 * (1 - d / 0.5); c.strokeStyle = o.color; c.lineWidth = (4 - 3 * q) * k / 2; c.beginPath(); c.arc(cx, cy, (0.2 + 2.1 * q) * 40 * k, 0, 2 * Math.PI); c.stroke(); }
          if (t < 0.35) { var r2 = ex(t / 0.35); c.globalAlpha = 1 - t / 0.35; for (var i = 0; i < 12; i++) { var a = i / 12 * 2 * Math.PI, R0 = (i % 2 ? 36 : 30) * k, R1 = (i % 2 ? 88 : 60) * k; c.strokeStyle = i % 2 ? o.color2 : o.color; c.lineWidth = 2 * k / 2; c.lineCap = "round"; c.beginPath(); c.moveTo(cx + Math.cos(a) * (R0 + (R1 - R0) * r2 * 0.6), cy + Math.sin(a) * (R0 + (R1 - R0) * r2 * 0.6)); c.lineTo(cx + Math.cos(a) * (R0 + (R1 - R0) * r2), cy + Math.sin(a) * (R0 + (R1 - R0) * r2)); c.stroke(); } }
          c.globalAlpha = 1;
        });
      };
  MW.effectRadialFlash = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
</script>
