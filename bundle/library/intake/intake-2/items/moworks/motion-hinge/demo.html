<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Layer Peel - Demo</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
:root { --bg: #09090b; --fg: #fafafa; --card: #111114; --line: #27272a; }
* { box-sizing: border-box; }
html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); }
#demo { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); color: var(--fg); font-family: Inter, sans-serif; }
.center { position: absolute; inset: 0; display: grid; place-items: center; }
.row { display: flex; align-items: center; justify-content: center; gap: 48px; }
.col { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 32px; }
.h1 { font-size: 132px; font-weight: 800; letter-spacing: -0.035em; line-height: 1.1; text-align: center; }
.h2 { font-size: 84px; font-weight: 700; letter-spacing: -0.025em; line-height: 1.15; text-align: center; }
.p { font-size: 40px; line-height: 1.4; opacity: 0.72; text-align: center; }
.card { position: relative; border-radius: 28px; background: var(--card); border: 2px solid var(--line); overflow: hidden; }
.muted { opacity: 0.6; }

#demo { background: radial-gradient(100% 100% at 50% 40%, #1a1f33, #0b0d12); color: #e8ebf3; font-family: Inter, sans-serif; } .gm { position: absolute; inset: 0; }
.ui-cursor { position: absolute; left: 0; top: 0; z-index: 20; filter: drop-shadow(0 6px 10px rgba(0, 0, 0, 0.5)); }
.hs { position: absolute; left: 600px; top: 200px; width: 720px; height: 580px; }
.hs > div { position: absolute; inset: 0; border-radius: 40px; box-sizing: border-box; padding: 50px; } .low { background: #151a28; border: 3px solid #2a3350; }
.low .b { position: absolute; bottom: 60px; width: 70px; border-radius: 14px 14px 0 0; background: linear-gradient(180deg, #a693ff, #6a4cf0); }
.top { background: linear-gradient(160deg, #2a3350, #1b2130); border: 3px solid #3a4466; } .top h3 { margin: 0 0 14px; font-size: 56px; } .top p { margin: 0; font-size: 32px; color: #9aa3b8; }
.top .bk { position: absolute; inset: 0; border-radius: 40px; background: #10131d; border: 4px solid #8b7bff; visibility: hidden; } .top .bk i { position: absolute; left: 60px; top: 60px; width: 300px; height: 24px; border-radius: 12px; background: #2a3142; }
    </style>
  </head>
  <body>
    <div id="demo" data-composition-id="mw-demo" data-start="0" data-width="1920" data-height="1080" data-duration="3.8">
<div class="gm"><div class="hs"><div class="low"><h3 style="margin:0;font-size:44px">Doanh thu quý</h3><div class="b" style="left:90px;height:160px"></div><div class="b" style="left:200px;height:260px"></div><div class="b" style="left:310px;height:210px"></div><div class="b" style="left:420px;height:340px"></div><div class="b" style="left:530px;height:300px"></div></div>
<div class="top"><h3>Tổng quan</h3><p>Mở để xem chi tiết bên dưới</p><div class="bk"><i></i></div></div></div></div>
      <script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.drive = MW.drive || function (tl, at, dur, fn) {
    var s = { t: 0 }; fn(0);
    tl.fromTo(s, { t: 0 }, { t: dur, duration: dur, ease: "none", immediateRender: false, onUpdate: function () { fn(s.t); } }, at);
    return at + dur;
  };
  var defaults = {"angle":-140,"open":0.9,"openAt":0.4,"closeAt":3,"close":0.65,"perspective":3000,"back":null};
  var run = function (el, tl, at, o) {
        var io = gsap.parseEase("power2.inOut"), shade = document.createElement("div"), back = o.back ? el.querySelector(o.back) : null;
        shade.style.cssText = "position:absolute;inset:0;border-radius:inherit;background:#05060a;pointer-events:none;opacity:0;"; el.appendChild(shade);
        el.parentNode.style.perspective = o.perspective + "px";
        return MW.drive(tl, at, o.closeAt + o.close, function (t) {
          var p = t < o.openAt ? 0 : t < o.openAt + o.open ? io((t - o.openAt) / o.open) : t < o.closeAt ? 1 : 1 - io(Math.min(1, (t - o.closeAt) / o.close)), a = o.angle * p;
          gsap.set(el, { rotationY: a, transformOrigin: "0% 50%" });
          var showBack = Math.abs(a) > 90;
          shade.style.opacity = String(showBack ? 0 : 0.5 * Math.sin(Math.abs(a) * Math.PI / 180));
          Array.prototype.forEach.call(el.children, function (ch) { if (ch !== shade && ch !== back) ch.style.visibility = showBack ? "hidden" : "visible"; });
          if (back) { back.style.visibility = showBack ? "visible" : "hidden"; back.style.transform = "scaleX(-1)"; }
        });
      };
  MW.motionHinge = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
      </script>
      <script>
        (function () {
          var tl = gsap.timeline({ paused: true });
          var q = function (s) { return document.querySelector(s); }, qa = function (s) { return Array.prototype.slice.call(document.querySelectorAll(s)); };
          MW.motionHinge(q(".top"), tl, 0, { back: ".bk" });
          tl.set({}, {}, 3.8);
          // register only when every motion is ready (MW.pending: e.g. a WebGL texture still decoding), as HyperFrames asks of async builds
          var go = function () { window.__timelines = window.__timelines || {}; window.__timelines["mw-demo"] = tl; };
          if (window.MW && MW.pending && MW.pending.length) Promise.all(MW.pending).then(go, go); else go();
        })();
      </script>
    </div>
  </body>
</html>
