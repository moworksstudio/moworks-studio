<!--
  Pixel Dissolve (Moworks Studio, the studio's own, written here).
  Source: Moworks Studio.
  Ảnh được cắt thành lưới 4 × 4, từng ô bật to từ tâm và hiện dần theo một thứ tự ngẫu nhiên cố định, cuối cùng ghép kín không khe.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.effectPixelTilesIn(q(".pt"), tl, 0.3, { exitAt: 1.9 });

  Options (defaults in brackets):
      - grid: tiles per side (4)
      - stagger: s (0.028), in a seeded order
      - duration: s per tile (0.45, ease-out cubic)
      - seed: (7)
      - exitAt: s after the start to break up again (null): 0.2 s a tile, 0.012 s apart

  Notes: Target cut into 4 x 4 tiles (each shows its own part of the picture). Tiles appear in a fixed seeded random order; tile k starts at k x 28 ms, scale 0 -> 1 about its own centre + opacity 0 -> 1 over 450 ms easeOutCubic; ~900 ms total; at the end the tiles join with no gaps (swap to the whole picture). Exit: same in a scrambled order, 200 ms each, 12 ms apart, ease-in cubic. Params: grid (4 × 4) · stagger (28 ms) · duration mỗi ô (0.45 s) · seed. At the end the tiles are swapped for the whole element, so no seams show.
-->

<div class="st"><div class="bx pt" style="width:620px;height:620px;opacity:0"></div></div>

<script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.rand = MW.rand || function (seed) {
    var a = typeof seed === "string" ? MW.hash(seed) : (seed >>> 0) || 1;
    return function () { a = (a + 0x6d2b79f5) >>> 0; var t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  };
  MW.hash = MW.hash || function (s) { var h = 2166136261; s = String(s); for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; };
  MW.drive = MW.drive || function (tl, at, dur, fn) {
    var s = { t: 0 }; fn(0);
    tl.fromTo(s, { t: 0 }, { t: dur, duration: dur, ease: "none", immediateRender: false, onUpdate: function () { fn(s.t); } }, at);
    return at + dur;
  };
  var defaults = {"grid":4,"stagger":0.028,"duration":0.45,"seed":7,"exitAt":null};
  var run = function (el,tl,at,o
  ) {
  var host = el.parentNode; if (getComputedStyle(host).position === "static") host.style.position = "relative";
  var clone = function () { var g = el.cloneNode(true); g.removeAttribute("id"); g.style.position = "absolute"; g.style.margin = "0"; g.style.pointerEvents = "none"; g.style.boxSizing = "border-box";
    g.style.left = el.offsetLeft + "px"; g.style.top = el.offsetTop + "px"; var br = el.getBoundingClientRect(); g.style.width = (br.width + 0.5) + "px"; g.style.height = el.offsetHeight + "px"; host.insertBefore(g, el.nextSibling); return g; };
  var N = o.grid, tiles = [], r = MW.rand(o.seed), ord = [], ord2 = [], p3 = gsap.parseEase("power3.out"), pi = gsap.parseEase("power3.in");
  for (var i = 0; i < N * N; i++) { ord.push(i); ord2.push(i); }
  var shuf = function (a) { for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(r() * (i + 1)), x = a[i]; a[i] = a[j]; a[j] = x; } }; shuf(ord); shuf(ord2);
  var rank = [], rank2 = []; ord.forEach(function (c, k) { rank[c] = k; }); ord2.forEach(function (c, k) { rank2[c] = k; });
  for (var j = 0; j < N * N; j++) { var g = clone(), rr = Math.floor(j / N), cc = j % N; g.style.clipPath = "inset(" + (100 * rr / N) + "% " + (100 - 100 * (cc + 1) / N) + "% " + (100 - 100 * (rr + 1) / N) + "% " + (100 * cc / N) + "%)"; g.style.transformOrigin = (100 * (cc + 0.5) / N) + "% " + (100 * (rr + 0.5) / N) + "%"; g.style.opacity = "0"; tiles.push(g); }
  var inEnd = (N * N - 1) * o.stagger + o.duration;
  return MW.drive(tl, at, o.exitAt == null ? inEnd : o.exitAt + (N * N - 1) * 0.012 + 0.2, function (t) {
    var out = o.exitAt != null && t >= o.exitAt, whole = t >= inEnd && !out;
    el.style.opacity = whole ? "1" : "0";
    tiles.forEach(function (g, i) { var s; if (out) s = 1 - pi(Math.max(0, Math.min(1, (t - o.exitAt - rank2[i] * 0.012) / 0.2))); else s = p3(Math.max(0, Math.min(1, (t - rank[i] * o.stagger) / o.duration)));
      gsap.set(g, { scale: s }); g.style.opacity = whole ? "0" : String(s); });
  });
  };
  MW.effectPixelTilesIn = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
