<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Pixel Dissolve - Demo</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
:root { --bg: #09090b; --fg: #fafafa; --card: #111114; --line: #27272a; }
* { box-sizing: border-box; }
html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); }
#demo { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); color: var(--fg); font-family: Inter, sans-serif; }
.center { position: absolute; inset: 0; display: grid; place-items: center; }
.row { display: flex; align-items: center; justify-content: center; gap: 48px; }
.col { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 32px; }
.h1 { font-size: 132px; font-weight: 800; letter-spacing: -0.035em; line-height: 1.1; text-align: center; }
.h2 { font-size: 84px; font-weight: 700; letter-spacing: -0.025em; line-height: 1.15; text-align: center; }
.p { font-size: 40px; line-height: 1.4; opacity: 0.72; text-align: center; }
.card { position: relative; border-radius: 28px; background: var(--card); border: 2px solid var(--line); overflow: hidden; }
.muted { opacity: 0.6; }

#demo { background: radial-gradient(100% 100% at 50% 45%, #1a1f33, #0b0d12); color: #e8ebf3; font-family: Inter, sans-serif; } .gm { position: absolute; inset: 0; }
.st { position: absolute; inset: 0; display: grid; place-items: center; } .bx { position: relative; width: 1000px; height: 580px; border-radius: 40px; overflow: hidden; background: url(assets/pic.svg) center / cover; box-shadow: 0 50px 120px rgba(0,0,0,0.45); }
    </style>
  </head>
  <body>
    <div id="demo" data-composition-id="mw-demo" data-start="0" data-width="1920" data-height="1080" data-duration="2.6">
<div class="st"><div class="bx pt" style="width:620px;height:620px;opacity:0"></div></div>
      <script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.rand = MW.rand || function (seed) {
    var a = typeof seed === "string" ? MW.hash(seed) : (seed >>> 0) || 1;
    return function () { a = (a + 0x6d2b79f5) >>> 0; var t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  };
  MW.hash = MW.hash || function (s) { var h = 2166136261; s = String(s); for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; };
  MW.drive = MW.drive || function (tl, at, dur, fn) {
    var s = { t: 0 }; fn(0);
    tl.fromTo(s, { t: 0 }, { t: dur, duration: dur, ease: "none", immediateRender: false, onUpdate: function () { fn(s.t); } }, at);
    return at + dur;
  };
  var defaults = {"grid":4,"stagger":0.028,"duration":0.45,"seed":7,"exitAt":null};
  var run = function (el,tl,at,o
  ) {
  var host = el.parentNode; if (getComputedStyle(host).position === "static") host.style.position = "relative";
  var clone = function () { var g = el.cloneNode(true); g.removeAttribute("id"); g.style.position = "absolute"; g.style.margin = "0"; g.style.pointerEvents = "none"; g.style.boxSizing = "border-box";
    g.style.left = el.offsetLeft + "px"; g.style.top = el.offsetTop + "px"; var br = el.getBoundingClientRect(); g.style.width = (br.width + 0.5) + "px"; g.style.height = el.offsetHeight + "px"; host.insertBefore(g, el.nextSibling); return g; };
  var N = o.grid, tiles = [], r = MW.rand(o.seed), ord = [], ord2 = [], p3 = gsap.parseEase("power3.out"), pi = gsap.parseEase("power3.in");
  for (var i = 0; i < N * N; i++) { ord.push(i); ord2.push(i); }
  var shuf = function (a) { for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(r() * (i + 1)), x = a[i]; a[i] = a[j]; a[j] = x; } }; shuf(ord); shuf(ord2);
  var rank = [], rank2 = []; ord.forEach(function (c, k) { rank[c] = k; }); ord2.forEach(function (c, k) { rank2[c] = k; });
  for (var j = 0; j < N * N; j++) { var g = clone(), rr = Math.floor(j / N), cc = j % N; g.style.clipPath = "inset(" + (100 * rr / N) + "% " + (100 - 100 * (cc + 1) / N) + "% " + (100 - 100 * (rr + 1) / N) + "% " + (100 * cc / N) + "%)"; g.style.transformOrigin = (100 * (cc + 0.5) / N) + "% " + (100 * (rr + 0.5) / N) + "%"; g.style.opacity = "0"; tiles.push(g); }
  var inEnd = (N * N - 1) * o.stagger + o.duration;
  return MW.drive(tl, at, o.exitAt == null ? inEnd : o.exitAt + (N * N - 1) * 0.012 + 0.2, function (t) {
    var out = o.exitAt != null && t >= o.exitAt, whole = t >= inEnd && !out;
    el.style.opacity = whole ? "1" : "0";
    tiles.forEach(function (g, i) { var s; if (out) s = 1 - pi(Math.max(0, Math.min(1, (t - o.exitAt - rank2[i] * 0.012) / 0.2))); else s = p3(Math.max(0, Math.min(1, (t - rank[i] * o.stagger) / o.duration)));
      gsap.set(g, { scale: s }); g.style.opacity = whole ? "0" : String(s); });
  });
  };
  MW.effectPixelTilesIn = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
      </script>
      <script>
        (function () {
          var tl = gsap.timeline({ paused: true });
          var q = function (s) { return document.querySelector(s); }, qa = function (s) { return Array.prototype.slice.call(document.querySelectorAll(s)); };
          MW.effectPixelTilesIn(q(".pt"), tl, 0.3, { exitAt: 1.9 });
          tl.set({}, {}, 2.6);
          // register only when every motion is ready (MW.pending: e.g. a WebGL texture still decoding), as HyperFrames asks of async builds
          var go = function () { window.__timelines = window.__timelines || {}; window.__timelines["mw-demo"] = tl; };
          if (window.MW && MW.pending && MW.pending.length) Promise.all(MW.pending).then(go, go); else go();
        })();
      </script>
    </div>
  </body>
</html>
