<!--
  Number Scramble Settle (Moworks Studio, the studio's own, written here).
  Source: Moworks Studio.
  Các chữ số nhảy ngẫu nhiên 25 lần mỗi giây rồi chốt dần từ trái sang, mỗi số chốt nảy nhẹ; dấu chấm, dấu phần trăm đứng yên.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.dataNumberScramble(q(".ns-n"), tl, 0, {});

  Options (defaults in brackets):
      - tick: s between random digits (0.04)
      - lock: s per digit, left to right (0.12; at most 1.6 s in all)
      - start: s (0.3)
      - tint: colour while scrambling
      - rescramble: s the digits scramble again from the right (2.95)
      - loop: s (3.4)
      - seed: the digits

  Notes: Only the digits scramble (signs, '.', '%' stay fixed): each unlocked digit shows a seeded random digit, new every 40 ms (accent, 75 %). Digits lock left → right one per 120 ms (demo min(120 ms, 1.6 s/n)) from 0.3 s; a locked digit pops scale 1.14 → 1 and fades accent → text colour over 180 ms. Tabular figures. Demo loop: digits re-scramble from the right, 25 ms apart, from 2.95 s; loop 3.4 s. GSAP ScrambleText: chars '0123456789', revealDelay 0.3, speed 0.6, 1 s. Params: tick: nhịp đổi số (0.04 s) · lock: chốt mỗi chữ số (0.12 s) · pop (1.14) · seed.
-->

<div class="gm ns"><div><div class="ns-n">98,6%</div><p>đơn hàng giao đúng hẹn</p></div></div>

<style>

</style>

<script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.rand = MW.rand || function (seed) {
    var a = typeof seed === "string" ? MW.hash(seed) : (seed >>> 0) || 1;
    return function () { a = (a + 0x6d2b79f5) >>> 0; var t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  };
  MW.hash = MW.hash || function (s) { var h = 2166136261; s = String(s); for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; };
  MW.drive = MW.drive || function (tl, at, dur, fn) {
    var s = { t: 0 }; fn(0);
    tl.fromTo(s, { t: 0 }, { t: dur, duration: dur, ease: "none", immediateRender: false, onUpdate: function () { fn(s.t); } }, at);
    return at + dur;
  };
  var defaults = {"tick":0.04,"lock":0.12,"start":0.3,"tint":"#a99bff","rescramble":2.95,"loop":3.4,"seed":5};
  var run = function (el, tl, at, o) {
        var txt = el.textContent, spans = [], col = getComputedStyle(el).color, mix = gsap.utils.interpolate(o.tint, col);
        el.textContent = ""; el.style.fontVariantNumeric = "tabular-nums";
        for (var i = 0; i < txt.length; i++) { var s = document.createElement("span"); s.textContent = txt[i]; s.style.display = "inline-block"; el.appendChild(s); if (/\d/.test(txt[i])) spans.push({ s: s, d: txt[i] }); }
        var n = spans.length, step = Math.min(o.lock, 1.6 / n);
        return MW.drive(tl, at, o.loop, function (t) {
          var tick = Math.floor(t / o.tick), r = MW.rand(o.seed * 7919 + tick);
          spans.forEach(function (q, i) {
            var lockT = o.start + (i + 1) * step, unT = o.rescramble + (n - 1 - i) * 0.025, locked = t >= lockT && t < unT, rnd = String(Math.floor(r() * 10));
            q.s.textContent = locked ? q.d : rnd; var u = locked ? Math.min(1, (t - lockT) / 0.18) : 0;
            gsap.set(q.s, { scale: locked ? 1.14 - 0.14 * u : 1 }); q.s.style.color = locked ? mix(u) : o.tint; q.s.style.opacity = locked ? "1" : "0.75";
          });
        });
      };
  MW.dataNumberScramble = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
</script>
