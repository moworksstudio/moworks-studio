<!--
  Focus Halo (Moworks Studio, the studio's own, written here).
  Source: Moworks Studio.
  Một vòng sáng loang ra từ viền chủ thể rồi tắt, chủ thể phồng nhẹ 4 %, xung quanh đứng yên.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.effectFocusHalo(q(".av"), tl, 0.5, {});

  Options (defaults in brackets):
      - duration: s (0.9), ease-out cubic
      - from: ring start scale (0.75)
      - to: ring end scale (1.9)
      - opacity: ring start opacity (0.7)
      - stroke: px (7.5)
      - soft: px of the soft copy (30)
      - bump: the subject's scale bump (1.04)
      - color: ring colour

  Notes: Ring on the target's outline (radius R): scale 0.75 → 1.9, opacity 0.7 → 0, 2.5 px stroke plus a 10 px wide soft copy at 35 % of that opacity, 900 ms power2.out (easeOutCubic); the target bumps 1 → 1.04 → 1 (sine) over the first 450 ms. Centre still; neighbours untouched. Params: scale (0.75 → 1.9) · opacity đầu (0.7) · stroke (2.5 px) · bump (1.04) · duration (0.9 s).
-->

<script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.drive = MW.drive || function (tl, at, dur, fn) {
    var s = { t: 0 }; fn(0);
    tl.fromTo(s, { t: 0 }, { t: dur, duration: dur, ease: "none", immediateRender: false, onUpdate: function () { fn(s.t); } }, at);
    return at + dur;
  };
  var defaults = {"duration":0.9,"from":0.75,"to":1.9,"opacity":0.7,"stroke":7.5,"soft":30,"bump":1.04,"color":"#8b7bff"};
  var run = function (el, tl, at, o) {
        var host = el.parentNode, rings = [], out = gsap.parseEase("power2.out");
        if (getComputedStyle(host).position === "static") host.style.position = "relative";
        [[o.stroke, 1, 0], [o.soft, 0.35, o.soft / 2]].forEach(function (r) {
          var d = document.createElement("div");
          d.style.cssText = "position:absolute;pointer-events:none;border-radius:50%;box-sizing:border-box;border:" + r[0] + "px solid " + o.color + ";filter:" + (r[2] ? "blur(" + r[2] / 2 + "px)" : "none") + ";";
          host.insertBefore(d, el); rings.push({ d: d, k: r[1] });
        });
        return MW.drive(tl, at, o.duration, function (t) {
          var u = t / o.duration, p = out(u), s = o.from + (o.to - o.from) * p, w = el.offsetWidth, h = el.offsetHeight;
          rings.forEach(function (r) {
            r.d.style.left = el.offsetLeft + "px"; r.d.style.top = el.offsetTop + "px"; r.d.style.width = w + "px"; r.d.style.height = h + "px";
            gsap.set(r.d, { scale: s }); r.d.style.opacity = u > 0 && u < 1 ? String(o.opacity * (1 - p) * r.k) : "0";
          });
          gsap.set(el, { scale: t < o.duration / 2 ? 1 + (o.bump - 1) * Math.sin(Math.PI * t / (o.duration / 2)) : 1 });
        });
      };
  MW.effectFocusHalo = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
