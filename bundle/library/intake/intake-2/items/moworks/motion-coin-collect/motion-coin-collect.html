  Coin Collect (Moworks Studio, the studio's own, written here).
  Source: Moworks Studio.
  Năm đồng xu nảy nhẹ rồi lần lượt bay theo đường cong vào ví, vừa bay vừa xoay và nhỏ lại; mỗi lần chạm ví thì ví bẹp nhẹ, số dư nhảy +5 và chữ "+5" bay lên.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.motionCoinCollect(q(".gm"), tl, 0, {});

  Options (defaults in brackets):
      - count: (5)
      - first: s the first coin lands (0.9)
      - stagger: s (0.26)
      - flight: s (0.5, ease-in quad on a quadratic arc)
      - step: per coin (5)
      - from: (100)
      - unit: 
      - seed: (4)
      - loop: s (3.3)

  Notes: px @320x200. 5 coins (r 9) scattered; each hops up 4 px (140 ms half-sine) then flies to the wallet on a quadratic arc (control: midpoint x −24, 58 px above the higher end) in 500 ms in-quad, arrivals every 260 ms from 0.9 s; coin shrinks to 0.65 and spins (scaleX = |cos 9u|). Each arrival: wallet squash 280 ms (1.12 / 0.88 sine), counter 100 → 125 (+5) pops 1.22 in accent, '+5' rises 18 px in 400 ms outCubic, fades 160-340 ms. Reset 2.9-3.25 s. Params: target: id ví / đích · stagger: cách nhau (0.26 s) · flight: thời gian bay (0.5 s) · step: cộng mỗi lần (5) · from: số dư đầu (100).
-->
