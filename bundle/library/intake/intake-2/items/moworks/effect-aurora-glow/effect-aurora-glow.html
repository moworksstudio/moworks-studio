<!--
  Aurora Glow (Moworks Studio, the studio's own, written here).
  Source: Moworks Studio.
  Hai quầng màu mờ xoay đối nhau phía sau thẻ và đổi sắc dần, thẻ phía trước đứng yên.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.effectAuroraGlow(q(".ag-t"), tl, 0, {});

  Options (defaults in brackets):
      - colors: the two glows
      - radius: px (205)
      - blur: px (56)
      - offset: [x, y] px ([120, 90])
      - swing: radians (1.3)
      - period: s each way (1.5)
      - hue: degrees of hue drift (70)
      - cycles: (1)

  Notes: Behind a card: two blurred glows (radius ~41 px, blur 14 px, additive, opacity 0.55 / 0.5) circle opposite each other at offset (±24 px x, ±18 px y) along an angle swinging −1.3 → +1.3 rad, 1500 ms sine ping-pong; colours shift up to 70° in hue (red→blue, blue→green). The card on top stays still. Params: offset (±24 / ±18 px) · swing (±1.3 rad) · period (1.5 s mỗi chiều) · hue (70°).
-->

<div class="gm ag"><div class="ag-t">A</div></div>

<style>

</style>

<script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.drive = MW.drive || function (tl, at, dur, fn) {
    var s = { t: 0 }; fn(0);
    tl.fromTo(s, { t: 0 }, { t: dur, duration: dur, ease: "none", immediateRender: false, onUpdate: function () { fn(s.t); } }, at);
    return at + dur;
  };
  var defaults = {"colors":["#ff4d6d","#3d7bff"],"radius":205,"blur":56,"offset":[120,90],"swing":1.3,"period":1.5,"hue":70,"cycles":1};
  var run = function (el, tl, at, o) {
        var host = el.parentNode, G = [];
        if (getComputedStyle(host).position === "static") host.style.position = "relative";
        [[o.colors[0], 0.55, 1], [o.colors[1], 0.5, -1]].forEach(function (g) { var d = document.createElement("div"); d.style.cssText = "position:absolute;border-radius:50%;pointer-events:none;mix-blend-mode:plus-lighter;background:" + g[0] + ";opacity:" + g[1] + ";filter:blur(" + o.blur + "px);"; host.insertBefore(d, el); G.push({ d: d, s: g[2] }); });
        return MW.drive(tl, at, o.period * 2 * o.cycles, function (t) {
          var k = Math.sin(Math.PI * t / o.period - Math.PI / 2), ang = o.swing * k, hue = o.hue * (0.5 + 0.5 * k), cx = el.offsetLeft + el.offsetWidth / 2, cy = el.offsetTop + el.offsetHeight / 2;
          G.forEach(function (g) { var x = cx + g.s * o.offset[0] * Math.cos(ang), y = cy + g.s * o.offset[1] * Math.sin(ang); g.d.style.width = g.d.style.height = 2 * o.radius + "px"; g.d.style.left = (x - o.radius) + "px"; g.d.style.top = (y - o.radius) + "px"; g.d.style.filter = "blur(" + o.blur + "px) hue-rotate(" + (g.s > 0 ? hue : -hue) + "deg)"; });
        });
      };
  MW.effectAuroraGlow = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
</script>
