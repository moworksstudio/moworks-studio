<!--
  Karaoke Fill (Moworks Studio, the studio's own, written here).
  Source: Moworks Studio.
  Màu nhấn tô từ trái sang phải trên từng từ đúng bằng thời gian hát từ đó, từ ngân dài tô chậm, từ ngắn tô nhanh, và giữ màu sau khi hát xong.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.textKaraokeFill(q(".kfw"), tl, 0, {});

  Options (defaults in brackets):
      - from: s (0.4)
      - to: s (3.6): each word fills over exactly its own time (split by length here; from the transcript in a film)
      - accent: fill colour
      - ink: edge line colour
      - outAt: s (4.2)
      - caption: the lyric line

  Notes: Line 30 px weight 800, white with a 4 px dark outline. Word times from the transcript (demo: split 0.4–3.6 s by word length). Each word's accent copy (same outline) is revealed by a clip growing left → right linearly over exactly its own duration, clamped, and stays filled; a 1 px ink line marks the fill edge while it moves. Fade out 4.2–4.5 s. Loop 4.8 s. ASS equivalent: \kf in centiseconds. Params: thời điểm từng từ (theo lời) · màu tô (nhấn) · viền chữ (4 px).
-->

<div class="ft"></div><div class="kfw"><div class="cap kf">Hà Nội mùa thu</div></div>

<style>

</style>

<script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.split = MW.split || function (el, mode) {
    el = MW.el(el);
    if (el.__mwSplit) return el.__mwSplit;
    var seg = typeof Intl !== "undefined" && Intl.Segmenter ? new Intl.Segmenter("vi", { granularity: "grapheme" }) : null;
    var graphemes = function (s) { if (seg) { var out = []; var it = seg.segment(s)[Symbol.iterator](), r; while (!(r = it.next()).done) out.push(r.value.segment); return out; } return Array.from(s); };
    var res = { chars: [], words: [], lines: [] };
    var walk = function (node) {
      var kids = Array.prototype.slice.call(node.childNodes);
      for (var k = 0; k < kids.length; k++) {
        var n = kids[k];
        if (n.nodeType === 1) { if (n.tagName === "BR") continue; walk(n); continue; }
        if (n.nodeType !== 3) continue;
        var text = n.nodeValue.normalize("NFC"), frag = document.createDocumentFragment();
        var parts = text.split(/(\s+)/);
        for (var p = 0; p < parts.length; p++) {
          var part = parts[p];
          if (!part) continue;
          if (/^\s+$/.test(part)) { frag.appendChild(document.createTextNode(part)); continue; }
          var w = document.createElement("span");
          w.className = "mw-w"; w.style.display = "inline-block"; w.style.whiteSpace = "nowrap";
          if (mode === "words") w.textContent = part;
          else { var gs = graphemes(part); for (var g = 0; g < gs.length; g++) { var c = document.createElement("span"); c.className = "mw-ch"; c.style.display = "inline-block"; c.textContent = gs[g]; w.appendChild(c); res.chars.push(c); } }
          res.words.push(w); frag.appendChild(w);
        }
        node.replaceChild(frag, n);
      }
    };
    walk(el);
    var top = null, line = null;
    for (var i = 0; i < res.words.length; i++) { var y = res.words[i].offsetTop; if (top === null || Math.abs(y - top) > 2) { top = y; line = []; res.lines.push(line); } line.push(res.words[i]); }
    el.__mwSplit = res;
    return res;
  };
  MW.drive = MW.drive || function (tl, at, dur, fn) {
    var s = { t: 0 }; fn(0);
    tl.fromTo(s, { t: 0 }, { t: dur, duration: dur, ease: "none", immediateRender: false, onUpdate: function () { fn(s.t); } }, at);
    return at + dur;
  };
  var defaults = {"from":0.4,"to":3.6,"accent":"#ffd23d","ink":"#ffffff","outAt":4.2,"caption":".kf","loop":4.8};
  var run = function (el, tl, at, o) {
        var cap = el.querySelector(o.caption), ws = MW.split(cap, "words").words, len = ws.map(function (w) { return w.textContent.length; }), tot = len.reduce(function (a, b) { return a + b; }, 0), parts = [], acc = o.from;
        ws.forEach(function (w, i) { var d = (o.to - o.from) * len[i] / tot; w.style.position = "relative"; var c = document.createElement("span"); c.textContent = w.textContent; c.style.cssText = "position:absolute;left:0;top:0;color:" + o.accent + ";white-space:nowrap;"; var edge = document.createElement("span"); edge.style.cssText = "position:absolute;top:-0.1em;bottom:-0.1em;width:3px;background:" + o.ink + ";"; w.appendChild(c); w.appendChild(edge); parts.push({ w: w, c: c, e: edge, a: acc, b: acc + d }); acc += d; });
        return MW.drive(tl, at, o.loop, function (t) {
          cap.style.opacity = String(1 - Math.max(0, Math.min(1, (t - o.outAt) / 0.3)));
          parts.forEach(function (p) { var u = Math.max(0, Math.min(1, (t - p.a) / (p.b - p.a))), W = p.w.offsetWidth; p.c.style.clipPath = "inset(-0.4em " + (W * (1 - u)) + "px -0.4em -10px)"; p.e.style.left = (W * u) + "px"; p.e.style.opacity = u > 0 && u < 1 ? "1" : "0"; });
        });
      };
  MW.textKaraokeFill = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
</script>
