<!--
  Terminal Decode (Moworks Studio, the studio's own, written here).
  Source: Moworks Studio.
  Một từ chữ mono trong khung terminal: các ký tự nhiễu đổi 20 lần mỗi giây rồi chốt lần lượt từ trái sang, mỗi ký tự chốt nảy nhẹ 1.18 lần.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.textTerminalDecode(q(".td-w"), tl, 0, {});

  Options (defaults in brackets):
      - text: the word (mono)
      - glyphs: noise characters
      - fps: noise changes a second (20)
      - start: s the first letter locks (0.8)
      - step: s per letter (0.3)
      - backAt: s it falls back to noise (3.7)
      - accent: locked colour
      - mute: noise colour
      - loop: s (4.2)
      - seed: noise

  Notes: Mono word (28 px, 30 px pitch) in a dark terminal card ('$ decode --msg'). From 0.5 s chars lock left → right, one per 300 ms (char i at 0.8 + 0.3·i s); unlocked chars cycle seeded noise from '#%&?*01<>/=_7Q' at 20 fps (muted, weight 500); a locked char turns accent, weight 700, pops 1.18 → 1 over 120 ms linear. Block caret under the next char, blinks 2 Hz once done. Loop: 3.7–3.95 s all chars fall back to noise (linear); loop 4.2 s. Params: glyphs: bộ ký tự nhiễu (#%&?*01<>/=_7Q) · step: mỗi ký tự chốt sau (0.3 s) · fps: tốc độ nhiễu (20) · pop: nảy khi chốt (1.18).
-->
