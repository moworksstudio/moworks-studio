<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Manga Onomatopoeia Impact - Demo</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
:root { --bg: #09090b; --fg: #fafafa; --card: #111114; --line: #27272a; }
* { box-sizing: border-box; }
html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); }
#demo { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); color: var(--fg); font-family: Inter, sans-serif; }
.center { position: absolute; inset: 0; display: grid; place-items: center; }
.row { display: flex; align-items: center; justify-content: center; gap: 48px; }
.col { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 32px; }
.h1 { font-size: 132px; font-weight: 800; letter-spacing: -0.035em; line-height: 1.1; text-align: center; }
.h2 { font-size: 84px; font-weight: 700; letter-spacing: -0.025em; line-height: 1.15; text-align: center; }
.p { font-size: 40px; line-height: 1.4; opacity: 0.72; text-align: center; }
.card { position: relative; border-radius: 28px; background: var(--card); border: 2px solid var(--line); overflow: hidden; }
.muted { opacity: 0.6; }

#demo { background: radial-gradient(100% 100% at 50% 45%, #1a1f33, #0b0d12); color: #e8ebf3; font-family: Inter, sans-serif; }
.ft { position: absolute; inset: 0; background: url(assets/shot.svg) center / cover; } .ft::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,0.15) 30%, rgba(0,0,0,0.55)); }
.st { position: absolute; inset: 0; display: grid; place-items: center; } .om { font-size: 280px; font-weight: 900; letter-spacing: 0.02em; opacity: 0; }
    </style>
  </head>
  <body>
    <div id="demo" data-composition-id="mw-demo" data-start="0" data-width="1920" data-height="1080" data-duration="2.6">
<div class="ft"></div><div class="st"><div class="om">RẦM!</div></div>
      <script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.rand = MW.rand || function (seed) {
    var a = typeof seed === "string" ? MW.hash(seed) : (seed >>> 0) || 1;
    return function () { a = (a + 0x6d2b79f5) >>> 0; var t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  };
  MW.hash = MW.hash || function (s) { var h = 2166136261; s = String(s); for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; };
  MW.drive = MW.drive || function (tl, at, dur, fn) {
    var s = { t: 0 }; fn(0);
    tl.fromTo(s, { t: 0 }, { t: dur, duration: dur, ease: "none", immediateRender: false, onUpdate: function () { fn(s.t); } }, at);
    return at + dur;
  };
  var defaults = {"outer":0.38,"inner":0.11,"fill":"#ffffff","accent":"#ff3b4f","dark":"#14091c","skew":-7,"angle":-3.4,"shake":40,"flash":0.22,"rays":64,"inner2":[370,600],"bg":".ft","exitAt":1.65,"seed":3};
  var run = function (el, tl, at, o) {
        var host = el.parentNode, bg = o.bg ? document.querySelector(o.bg) : null, cv = document.createElement("canvas"), fl = document.createElement("div"), txt = el.textContent, pin = gsap.parseEase("power2.in");
        if (getComputedStyle(host).position === "static") host.style.position = "relative"; var CW = host.clientWidth, CH = host.clientHeight;
        cv.width = CW; cv.height = CH; cv.style.cssText = "position:absolute;left:0;top:0;pointer-events:none;width:" + CW + "px;height:" + CH + "px;"; host.insertBefore(cv, el); var c = cv.getContext("2d");
        fl.style.cssText = "position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;"; host.appendChild(fl);
        el.textContent = ""; el.style.position = "relative"; el.style.display = "inline-block";
        [[o.outer, o.accent], [o.inner, o.dark], [0, null]].forEach(function (s, i) { var sp = document.createElement("span"); sp.textContent = txt; sp.style.cssText = "display:block;white-space:nowrap;" + (i ? "position:absolute;left:0;top:0;" : "") + (s[1] ? "-webkit-text-stroke:" + s[0] + "em " + s[1] + ";paint-order:stroke fill;color:" + s[1] + ";" : "color:" + o.fill + ";"); el.appendChild(sp); });
        return MW.drive(tl, at, o.exitAt + 0.35, function (t) {
          var f = Math.floor(t * 24), s = f < 0 ? 0 : f < 4 ? 3 - 2 * (f / 4) : 1, land = f - 4, k = land >= 0 && land < 8 ? 1 - land / 8 : 0, r = MW.rand(o.seed + f * 17), sx = (r() * 2 - 1) * o.shake * k, sy = (r() * 2 - 1) * o.shake * k, x = pin(Math.max(0, Math.min(1, (t - o.exitAt) / 0.3)));
          if (bg) gsap.set(bg, { x: sx, y: sy }); gsap.set(el, { scale: s * (1 + 0.15 * x), skewX: o.skew, rotation: o.angle, x: sx / 2, y: sy / 2 }); el.style.opacity = String(t > 0 ? 1 - x : 0); fl.style.opacity = land === 0 ? String(o.flash) : "0";
          c.clearRect(0, 0, CW, CH); if (land >= 0 && x < 1) { var rr = MW.rand(o.seed * 5 + f); c.fillStyle = "rgba(200,205,215," + (0.85 * (1 - x)).toFixed(3) + ")"; for (var i = 0; i < o.rays; i++) { var th = i / o.rays * 2 * Math.PI + rr() * 0.04, w = 0.012 + rr() * 0.02, ri = o.inner2[0] + rr() * (o.inner2[1] - o.inner2[0]), R = Math.hypot(CW, CH);
            c.beginPath(); c.moveTo(CW / 2 + ri * Math.cos(th), CH / 2 + 0.7 * ri * Math.sin(th)); c.lineTo(CW / 2 + R * Math.cos(th - w), CH / 2 + R * Math.sin(th - w)); c.lineTo(CW / 2 + R * Math.cos(th + w), CH / 2 + R * Math.sin(th + w)); c.closePath(); c.fill(); } }
        });
      };
  MW.handOnomatopoeiaImpact = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
      </script>
      <script>
        (function () {
          var tl = gsap.timeline({ paused: true });
          var q = function (s) { return document.querySelector(s); }, qa = function (s) { return Array.prototype.slice.call(document.querySelectorAll(s)); };
          MW.handOnomatopoeiaImpact(q(".om"), tl, 0.4, {});
          tl.set({}, {}, 2.6);
          // register only when every motion is ready (MW.pending: e.g. a WebGL texture still decoding), as HyperFrames asks of async builds
          var go = function () { window.__timelines = window.__timelines || {}; window.__timelines["mw-demo"] = tl; };
          if (window.MW && MW.pending && MW.pending.length) Promise.all(MW.pending).then(go, go); else go();
        })();
      </script>
    </div>
  </body>
</html>
