<!--
  Armor Crack Network (Moworks Studio, the studio's own, written here).
  Source: Moworks Studio.
  Từ điểm va chạm, sáu nhánh nứt gấp khúc kèm nhánh con lan ra rất nhanh trên tấm giáp, vòng va chạm loé và khung rung nhẹ; vết nứt ở lại rồi mờ đi ở cuối.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.effectCrackSpread(q(".gm"), tl, 0, {});

  Options (defaults in brackets):
      - hitAt: s (0.62)
      - branches: main branches (6)
      - spread: s to draw outward, expo.out (0.3)
      - x: hit point, of 320 (118)
      - y: of 200 (84)
      - seed: the crack pattern
      - fadeAt: s (3.5)

  Notes: px @320x200. From the hit point (0.62 s), seeded: 6 main branches at equal angles ±17°, each 4 segments of 12.5-20 px turning ±20° per segment; one twig per branch from point 1 or 2, at ±46°, 14-26 px in 2 segments (+17° bend). Accent strokes 2.2 / 1.3 px; all draw outward in 300 ms outExpo (twigs start when the branch passes their root); hit dot r 5; impact ring r 6 → 32 in 350 ms outCubic; shake ±3 px 180 ms. Cracks fade 3.5-3.9 s in-cubic. Params: hitAt: lúc va (0.62 s) · branches: số nhánh (6) · length: dài nhánh (50-80 px) · spread: thời gian lan (0.3 s) · seed.
-->

<div class="gm"></div>

<style>

</style>

<script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.rand = MW.rand || function (seed) {
    var a = typeof seed === "string" ? MW.hash(seed) : (seed >>> 0) || 1;
    return function () { a = (a + 0x6d2b79f5) >>> 0; var t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  };
  MW.hash = MW.hash || function (s) { var h = 2166136261; s = String(s); for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; };
  MW.drive = MW.drive || function (tl, at, dur, fn) {
    var s = { t: 0 }; fn(0);
    tl.fromTo(s, { t: 0 }, { t: dur, duration: dur, ease: "none", immediateRender: false, onUpdate: function () { fn(s.t); } }, at);
    return at + dur;
  };
  MW.canvas = MW.canvas || function (host, w, h) {
    host = MW.el(host);
    var cv = document.createElement("canvas"); w = w || host.clientWidth || 1920; h = h || host.clientHeight || 1080;
    cv.width = w; cv.height = h; cv.style.position = "absolute"; cv.style.left = "0"; cv.style.top = "0"; cv.style.width = w + "px"; cv.style.height = h + "px"; cv.style.pointerEvents = "none";
    host.appendChild(cv);
    return { cv: cv, ctx: cv.getContext("2d"), w: w, h: h };
  };
  MW.stage320 = MW.stage320 || function (host) {
    host = MW.el(host); if (getComputedStyle(host).position === "static") host.style.position = "relative";
    var c = MW.canvas(host), k = Math.min(c.w / 320, c.h / 200), ox = (c.w - 320 * k) / 2, oy = (c.h - 200 * k) / 2;
    return { ctx: c.ctx, cv: c.cv, k: k, ox: ox, oy: oy, w: c.w, h: c.h,
      clear: function () { c.ctx.setTransform(1, 0, 0, 1, 0, 0); c.ctx.clearRect(0, 0, c.w, c.h); c.ctx.setTransform(k, 0, 0, k, ox, oy); },
      put: function (el, x, y) { el.style.position = "absolute"; el.style.left = (ox + x * k) + "px"; el.style.top = (oy + y * k) + "px"; gsap.set(el, { xPercent: -50, yPercent: -50 }); } };
  };
  var defaults = {"hitAt":0.62,"branches":6,"spread":0.3,"x":118,"y":84,"seed":5,"fadeAt":3.5};
  var run = function (el, tl, at, o) {
        var S = MW.stage320(el), ctx = S.ctx, r = MW.rand(o.seed), ex = gsap.parseEase("expo.out"), out = gsap.parseEase("power2.out"), inn = gsap.parseEase("power2.in"), br = [];
        for (var i = 0; i < o.branches; i++) {
          var a = (i / o.branches) * 2 * Math.PI + (r() * 2 - 1) * 0.3, pts = [[o.x, o.y]], len = 0;
          for (var s = 0; s < 4; s++) { a += (r() * 2 - 1) * 0.35; var L = 12.5 + r() * 7.5, p = pts[pts.length - 1]; pts.push([p[0] + L * Math.cos(a), p[1] + L * Math.sin(a)]); len += L; }
          var root = 1 + Math.floor(r() * 2), ta = a + (r() > 0.5 ? 0.8 : -0.8), tw = [pts[root]], tl2 = 14 + r() * 12;
          for (var j = 0; j < 2; j++) { var q = tw[tw.length - 1]; ta += 0.3; tw.push([q[0] + tl2 / 2 * Math.cos(ta), q[1] + tl2 / 2 * Math.sin(ta)]); }
          br.push({ pts: pts, len: len, tw: tw, root: root / 4 });
        }
        var path = function (pts, f, w) { var n = pts.length - 1, m = f * n; ctx.lineWidth = w; ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]); for (var i = 1; i <= n; i++) { if (i - 1 >= m) break; var p0 = pts[i - 1], p1 = pts[i], g = Math.min(1, m - (i - 1)); ctx.lineTo(p0[0] + (p1[0] - p0[0]) * g, p0[1] + (p1[1] - p0[1]) * g); } ctx.stroke(); };
        return MW.drive(tl, at, o.fadeAt + 0.4, function (t) {
          var d = t - o.hitAt, sh = d > 0 && d < 0.18 ? 3 * S.k * (1 - d / 0.18) : 0;
          gsap.set(el, { x: sh * Math.sin(t * 180), y: sh * Math.cos(t * 150) });
          S.clear(); if (d < 0) return;
          ctx.globalAlpha = t > o.fadeAt ? 1 - inn(Math.min(1, (t - o.fadeAt) / 0.4)) : 1; ctx.strokeStyle = "#8b7bff"; ctx.lineCap = "round"; ctx.lineJoin = "round";
          var f = ex(Math.min(1, d / o.spread));
          br.forEach(function (b) { path(b.pts, f, 2.2); if (f > b.root) path(b.tw, (f - b.root) / (1 - b.root), 1.3); });
          ctx.fillStyle = "#e8ebf3"; ctx.beginPath(); ctx.arc(o.x, o.y, 5, 0, 2 * Math.PI); ctx.fill();
          if (d < 0.35) { var q = out(d / 0.35); ctx.globalAlpha = 1 - q; ctx.strokeStyle = "#e8ebf3"; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(o.x, o.y, 6 + 26 * q, 0, 2 * Math.PI); ctx.stroke(); }
          ctx.globalAlpha = 1;
        });
      };
  MW.effectCrackSpread = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
</script>
