<!--
  Dolly Zoom (Vertigo) (Moworks Studio, the studio's own, written here).
  Source: Moworks Studio.
  Chủ thể giữ nguyên cỡ trong khi phông nền co giãn mạnh, tạo cảm giác chóng mặt, bất an.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.motionDollyZoom(q(".tk-cam"), tl, 0.5, { duration: 2.2 });

  Options (defaults in brackets):
      - duration: s (2)
      - bgScale: the farthest layer's end scale (0.6)
      - layers: selector of the layers (the subject at depth 1)
      - ease: power2.inOut

  Notes: Subject layer keeps its screen size while the camera moves z 0 -> +300 (perspective 1100 px) and background layers scale 1 -> 0.6, 2000 ms easeInOutCubic; per-layer scale compensation from each layer's distance. camera/dolly-zoom solves the focal length per frame but only on its own content. (A small canvas demo that scales every layer by 1 - 0.6 x depth shrinks its subject too: follow the recipe.) Params: duration (2 s) · z (+300) · scale nền (0.6) · perspective (1100 px).
-->

<div class="tk-cam"><div class="tk-far" data-depth="0.2"><div class="sun"></div><div class="star" style="left:12%;top:14%"></div><div class="star" style="left:24%;top:30%"></div><div class="star" style="left:36%;top:10%"></div><div class="star" style="left:70%;top:18%"></div><div class="star" style="left:82%;top:34%"></div><div class="star" style="left:90%;top:12%"></div><div class="star" style="left:46%;top:22%"></div><div class="star" style="left:16%;top:40%"></div></div>
<div class="tk-mid" data-depth="0.55"><svg viewBox="0 0 1000 300" preserveAspectRatio="none"><path d="M0 300 L0 170 Q120 90 240 150 T480 120 T720 160 T1000 110 L1000 300 Z" fill="#3b2f6b"/><path d="M0 300 L0 220 Q160 160 320 210 T640 190 T1000 200 L1000 300 Z" fill="#2a2150"/></svg></div>
<div class="tk-near" data-depth="1"><div class="card">Toàn cảnh</div></div>
<div class="tk-fore" data-depth="1.6"><div class="blob" style="left:6%;top:62%;width:380px;height:380px"></div><div class="blob" style="left:80%;top:8%;width:300px;height:300px"></div><div class="blob" style="left:86%;top:70%;width:420px;height:420px"></div></div></div>

<script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.drive = MW.drive || function (tl, at, dur, fn) {
    var s = { t: 0 }; fn(0);
    tl.fromTo(s, { t: 0 }, { t: dur, duration: dur, ease: "none", immediateRender: false, onUpdate: function () { fn(s.t); } }, at);
    return at + dur;
  };
  var defaults = {"duration":2,"bgScale":0.6,"layers":"[data-depth]","ease":"power2.inOut"};
  var run = function (el, tl, at, o) {
        var Ls = Array.prototype.slice.call(el.querySelectorAll(o.layers)), ease = gsap.parseEase(o.ease), minD = 1;
        Ls.forEach(function (l) { minD = Math.min(minD, parseFloat(l.getAttribute("data-depth") || "1")); });
        return MW.drive(tl, at, o.duration, function (t) {
          var p = ease(t / o.duration);
          // the subject (depth 1) keeps its size; layers behind it shrink toward bgScale (the farthest reaches it), layers in front grow
          Ls.forEach(function (l) { var d = parseFloat(l.getAttribute("data-depth") || "1"), w = (d - 1) / (1 - minD || 1); gsap.set(l, { scale: Math.max(0.05, 1 + (1 - o.bgScale) * w * p) }); });
        });
      };
  MW.motionDollyZoom = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
</script>
