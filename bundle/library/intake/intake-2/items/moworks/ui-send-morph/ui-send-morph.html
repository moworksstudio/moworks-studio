    MW.uiSendMorph(q(".sm"), tl, 0, { cursor: ".ui-cursor" });

      - press: s the button is clicked (0.3); the rest follows its own timing
      - fly: [x, y] px of the flight ([632, −296])
      - bulge: px the curve sags below the straight line (104)
      - pull: px the plane pulls back first (16)
      - success: colour on success
      - label: the label
      - cursor: an optional cursor that makes the clicks
      - approach: [x, y] px the cursor comes from
      - lead: s it arrives before a click
