<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Comment-Follow Telop - Demo</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
:root { --bg: #09090b; --fg: #fafafa; --card: #111114; --line: #27272a; }
* { box-sizing: border-box; }
html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); }
#demo { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); color: var(--fg); font-family: Inter, sans-serif; }
.center { position: absolute; inset: 0; display: grid; place-items: center; }
.row { display: flex; align-items: center; justify-content: center; gap: 48px; }
.col { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 32px; }
.h1 { font-size: 132px; font-weight: 800; letter-spacing: -0.035em; line-height: 1.1; text-align: center; }
.h2 { font-size: 84px; font-weight: 700; letter-spacing: -0.025em; line-height: 1.15; text-align: center; }
.p { font-size: 40px; line-height: 1.4; opacity: 0.72; text-align: center; }
.card { position: relative; border-radius: 28px; background: var(--card); border: 2px solid var(--line); overflow: hidden; }
.muted { opacity: 0.6; }

#demo { background: radial-gradient(100% 100% at 50% 45%, #1a1f33, #0b0d12); color: #e8ebf3; font-family: Inter, sans-serif; } .gm { position: absolute; inset: 0; }
.ft { position: absolute; inset: 0; background: url(assets/shot.svg) center / cover; } .ft::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,0.1) 30%, rgba(0,0,0,0.55)); }
.sc { position: absolute; left: 0; right: 0; bottom: 140px; height: 160px; } .sc-l { position: absolute; left: 0; right: 0; bottom: 0; display: flex; justify-content: center; align-items: center; gap: 30px; font-size: 92px; font-weight: 900; color: #fff; -webkit-text-stroke: 0.6em #3d9bff; paint-order: stroke fill; filter: drop-shadow(8px 8px 0 #0b0d22); opacity: 0; }
.sc-b { width: 72px; height: 72px; border-radius: 50%; display: grid; place-items: center; font-size: 40px; -webkit-text-stroke: 0; color: #fff; flex: none; }
    </style>
  </head>
  <body>
    <div id="demo" data-composition-id="mw-demo" data-start="0" data-width="1920" data-height="1080" data-duration="6.6">
<div class="ft"></div><div class="sc"><div class="sc-l" data-color="#3d9bff"><span class="sc-b">H</span>Hôm nay mình đi chợ sớm</div><div class="sc-l" data-color="#ff5d8f"><span class="sc-b">M</span>Mua được gì ngon không?</div><div class="sc-l" data-color="#3d9bff"><span class="sc-b">H</span>Cá tươi lắm, về kho liền</div></div>
      <script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.drive = MW.drive || function (tl, at, dur, fn) {
    var s = { t: 0 }; fn(0);
    tl.fromTo(s, { t: 0 }, { t: dur, duration: dur, ease: "none", immediateRender: false, onUpdate: function () { fn(s.t); } }, at);
    return at + dur;
  };
  var defaults = {"lines":".sc-l","badge":".sc-b","turn":2.2,"colors":["#3d9bff"]};
  var run = function (el, tl, at, o) {
        var L = Array.prototype.slice.call(el.querySelectorAll(o.lines)), bo = gsap.parseEase("back.out(1.7)"), n = L.length;
        L.forEach(function (l) { l.style.webkitTextStrokeColor = l.getAttribute("data-color") || o.colors[0]; var b = l.querySelector(o.badge); if (b) b.style.background = l.getAttribute("data-color") || o.colors[0]; });
        return MW.drive(tl, at, n * o.turn, function (t) {
          L.forEach(function (l, i) { var st = i * o.turn + 0.1, u = (t - st) / (5 / 30), nx = (i + 1) * o.turn, out = i < n - 1 ? Math.max(0, Math.min(1, (t - (nx - 0.28)) / 0.15)) : 0;
            gsap.set(l, { scale: 0.85 + 0.15 * bo(Math.max(0, Math.min(1, u))) }); l.style.opacity = String(Math.max(0, Math.min(1, u * 3)) * (1 - out)); });
        });
      };
  MW.textSpeakerColorCaptions = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
      </script>
      <script>
        (function () {
          var tl = gsap.timeline({ paused: true });
          var q = function (s) { return document.querySelector(s); }, qa = function (s) { return Array.prototype.slice.call(document.querySelectorAll(s)); };
          MW.textSpeakerColorCaptions(q(".sc"), tl, 0, {});
          tl.set({}, {}, 6.6);
          // register only when every motion is ready (MW.pending: e.g. a WebGL texture still decoding), as HyperFrames asks of async builds
          var go = function () { window.__timelines = window.__timelines || {}; window.__timelines["mw-demo"] = tl; };
          if (window.MW && MW.pending && MW.pending.length) Promise.all(MW.pending).then(go, go); else go();
        })();
      </script>
    </div>
  </body>
</html>
