<!--
  Hit-stop Frame (Moworks Studio, the studio's own, written here).
  Source: Moworks Studio.
  Vật tấn công lao tới chạm mục tiêu, cả hai đứng sững một quãng ở đúng tư thế va chạm, rồi mục tiêu mới bị đẩy văng và xoay nhẹ.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.motionHitStopHold(q(".gm"), tl, 0, {});

  Options (defaults in brackets):
      - contactAt: s to contact (1.16)
      - hold: s both stand still (0.56; a real game holds 3-6 frames)
      - travel: units the attacker travels (81 of 320)
      - push: units the target is pushed (36)
      - rotate: degrees it turns (15)

  Notes: DOM study (4.0 s, linear keys): attacker x 0 → 81 px at 12-29 % (0.48-1.16 s); both hold still to 43 % (1.72 s) while 'CONTACT / HOLD' shows; then attacker 81 → 105 px and target 0 → 36 px + rotate 15° at 43-60 % (1.72-2.4 s), hold. The card shows atlas demo t-hitstop (2.4 s): ball 30 → 234 px linear in 1 s; at contact (1.0 s) time stops 120 ms under a 55 % dark overlay with 8 radial strokes (r 20 → 40), then rebounds at 140 px/s. Params: contactAt: lúc chạm (1.16 s) · hold: đứng sững (0.56 s; game thật 3-6 khung) · push: đẩy mục tiêu (36 px, 15°) · travel: quãng lao (81 px).
-->

<div class="gm"><div class="atk" style="width:200px;height:200px;border-radius:30px;background:linear-gradient(160deg,#a693ff,#6a4cf0)"></div><div class="tgt" style="width:200px;height:200px;border-radius:30px;background:#2a3350;border:4px solid #4a5478"></div><div class="lab">CHẠM · KHỰNG</div></div>

<script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.bezier = MW.bezier || function (x1, y1, x2, y2) {
    var cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx, cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
    var X = function (t) { return ((ax * t + bx) * t + cx) * t; }, Y = function (t) { return ((ay * t + by) * t + cy) * t; }, dX = function (t) { return (3 * ax * t + 2 * bx) * t + cx; };
    return function (p) {
      if (p <= 0) return 0; if (p >= 1) return 1;
      var t = p, i, d;
      for (i = 0; i < 8; i++) { d = X(t) - p; if (Math.abs(d) < 1e-6) return Y(t); var s = dX(t); if (Math.abs(s) < 1e-6) break; t -= d / s; }
      var lo = 0, hi = 1; t = p;
      for (i = 0; i < 40; i++) { d = X(t); if (Math.abs(d - p) < 1e-6) break; if (d < p) lo = t; else hi = t; t = (lo + hi) / 2; }
      return Y(t);
    };
  };
  MW.CSS_EASE = { ease: [0.25, 0.1, 0.25, 1], easeIn: [0.42, 0, 1, 1], easeOut: [0, 0, 0.58, 1], easeInOut: [0.42, 0, 0.58, 1] };
  MW.EASES = MW.EASES || { "css-ease": [0.25, 0.1, 0.25, 1], "css-in": [0.42, 0, 1, 1], "css-out": [0, 0, 0.58, 1], "css-in-out": [0.42, 0, 0.58, 1],
    md3: [0.2, 0, 0, 1], "md3-emph": [0.05, 0.7, 0.1, 1], "md3-acc": [0.3, 0, 1, 1], "md3-dec": [0, 0, 0, 1], whip: [0.9, 0, 0.1, 1], glide: [0.4, 0, 0.2, 1],
    house: [0.83, 0, 0.17, 1], "in-out": [0.65, 0, 0.35, 1] };
  MW.ez = MW.ez || function (name) {
    if (typeof name === "function") return name;
    var b = MW.EASES[name]; if (b) return MW.bezier(b[0], b[1], b[2], b[3]);
    var m = /^cubic-bezier\(([^)]+)\)$/.exec(name || ""); if (m) { var v = m[1].split(",").map(Number); return MW.bezier(v[0], v[1], v[2], v[3]); }
    return gsap.parseEase(name || "none");
  };
  MW.drive = MW.drive || function (tl, at, dur, fn) {
    var s = { t: 0 }; fn(0);
    tl.fromTo(s, { t: 0 }, { t: dur, duration: dur, ease: "none", immediateRender: false, onUpdate: function () { fn(s.t); } }, at);
    return at + dur;
  };
  MW.keys = MW.keys || function (tl, target, at, track, ease) {
    var e = MW.ez(ease || "sine.inOut"), end = 0, p;
    for (p in track) end = Math.max(end, track[p][track[p].length - 1][0]);
    var val = function (k, t) { if (t <= k[0][0]) return k[0][1]; for (var i = 1; i < k.length; i++) if (t <= k[i][0]) { var a = k[i - 1], b = k[i], u = (t - a[0]) / ((b[0] - a[0]) || 1); return a[1] + (b[1] - a[1]) * e(u); } return k[k.length - 1][1]; };
    return MW.drive(tl, at, end, function (t) { var s = {}; for (var q in track) s[q] = val(track[q], t); gsap.set(target, s); });
  };
  MW.canvas = MW.canvas || function (host, w, h) {
    host = MW.el(host);
    var cv = document.createElement("canvas"); w = w || host.clientWidth || 1920; h = h || host.clientHeight || 1080;
    cv.width = w; cv.height = h; cv.style.position = "absolute"; cv.style.left = "0"; cv.style.top = "0"; cv.style.width = w + "px"; cv.style.height = h + "px"; cv.style.pointerEvents = "none";
    host.appendChild(cv);
    return { cv: cv, ctx: cv.getContext("2d"), w: w, h: h };
  };
  MW.stage320 = MW.stage320 || function (host) {
    host = MW.el(host); if (getComputedStyle(host).position === "static") host.style.position = "relative";
    var c = MW.canvas(host), k = Math.min(c.w / 320, c.h / 200), ox = (c.w - 320 * k) / 2, oy = (c.h - 200 * k) / 2;
    return { ctx: c.ctx, cv: c.cv, k: k, ox: ox, oy: oy, w: c.w, h: c.h,
      clear: function () { c.ctx.setTransform(1, 0, 0, 1, 0, 0); c.ctx.clearRect(0, 0, c.w, c.h); c.ctx.setTransform(k, 0, 0, k, ox, oy); },
      put: function (el, x, y) { el.style.position = "absolute"; el.style.left = (ox + x * k) + "px"; el.style.top = (oy + y * k) + "px"; gsap.set(el, { xPercent: -50, yPercent: -50 }); } };
  };
  var defaults = {"contactAt":1.16,"hold":0.56,"travel":81,"push":36,"rotate":15};
  var run = function (el, tl, at, o) {
        var S = MW.stage320(el), a = el.querySelector(".atk"), b = el.querySelector(".tgt"), lab = el.querySelector(".lab"), k = S.k, c = o.contactAt, h = o.hold;
        S.put(a, 70, 132); S.put(b, 200, 132); S.put(lab, 160, 60);
        var ctx = S.ctx; S.clear(); ctx.strokeStyle = "#3a4260"; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(20, 152); ctx.lineTo(300, 152); ctx.stroke();
        MW.keys(tl, a, at, { x: [[0, 0], [c - 0.68, 0], [c, o.travel * k], [c + h, o.travel * k], [c + h + 0.68, (o.travel + 24) * k]] }, "none");
        MW.keys(tl, b, at, { x: [[0, 0], [c + h, 0], [c + h + 0.68, o.push * k]], rotation: [[0, 0], [c + h, 0], [c + h + 0.68, o.rotate]] }, "none");
        tl.fromTo(lab, { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.05, immediateRender: true }, at + c); tl.to(lab, { autoAlpha: 0, duration: 0.1 }, at + c + h);
        return at + c + h + 0.68;
      };
  MW.motionHitStopHold = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
</script>
