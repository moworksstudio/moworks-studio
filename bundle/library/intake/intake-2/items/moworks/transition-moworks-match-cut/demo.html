<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Match Cut - Demo</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
:root { --bg: #09090b; --fg: #fafafa; --card: #111114; --line: #27272a; }
* { box-sizing: border-box; }
html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); }
#demo { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); color: var(--fg); font-family: Inter, sans-serif; }
.center { position: absolute; inset: 0; display: grid; place-items: center; }
.row { display: flex; align-items: center; justify-content: center; gap: 48px; }
.col { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 32px; }
.h1 { font-size: 132px; font-weight: 800; letter-spacing: -0.035em; line-height: 1.1; text-align: center; }
.h2 { font-size: 84px; font-weight: 700; letter-spacing: -0.025em; line-height: 1.15; text-align: center; }
.p { font-size: 40px; line-height: 1.4; opacity: 0.72; text-align: center; }
.card { position: relative; border-radius: 28px; background: var(--card); border: 2px solid var(--line); overflow: hidden; }
.muted { opacity: 0.6; }

#demo { background: #0b0d12; color: #e8ebf3; }
.mc { position: absolute; inset: 0; display: grid; place-items: center; }
.mc-a { background: radial-gradient(120% 120% at 50% 40%, #2f6bff, #173a9e 70%); }
.mc-b { background: radial-gradient(120% 120% at 50% 40%, #f7f4ec, #e3ddcf 80%); }
.sunc { width: 480px; height: 480px; border-radius: 50%; background: radial-gradient(circle at 40% 35%, #fff4a8, #ffd23d 55%, #f0a500); box-shadow: 0 0 160px rgba(255, 210, 61, 0.55); }
.coin { width: 480px; height: 480px; border-radius: 50%; background: radial-gradient(circle at 40% 35%, #fff1b0, #ffc633 60%, #d99400); display: grid; place-items: center; box-shadow: 0 30px 80px rgba(120, 80, 0, 0.3); }
.coin .ring { width: 360px; height: 360px; border-radius: 50%; border: 18px solid rgba(140, 90, 0, 0.55); display: grid; place-items: center; font-size: 190px; font-weight: 800; color: rgba(120, 76, 0, 0.75); }
.mc-cap { position: absolute; bottom: 120px; left: 0; right: 0; text-align: center; font-size: 44px; font-weight: 600; }
.mc-a .mc-cap { color: rgba(255, 255, 255, 0.85); } .mc-b .mc-cap { color: #6b5a2a; }
    </style>
  </head>
  <body>
    <div id="demo" data-composition-id="mw-demo" data-start="0" data-width="1920" data-height="1080" data-duration="3">
<section class="mc mc-a"><div class="sunc"></div><div class="mc-cap">Mặt trời lặn</div></section>
<section class="mc mc-b"><div class="coin"><div class="ring">₫</div></div><div class="mc-cap">Đồng xu tiết kiệm</div></section>
      <script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  var defaults = {"from":null};
  var run = function (el, tl, at, o) {
        var out = o.from ? MW.el(o.from) : el.previousElementSibling;
        gsap.set(el, { autoAlpha: 0 });
        tl.set(el, { autoAlpha: 1 }, at);
        if (out) tl.set(out, { autoAlpha: 0 }, at);
        return at;
      };
  MW.transitionMoworksMatchCut = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
      </script>
      <script>
        (function () {
          var tl = gsap.timeline({ paused: true });
          var q = function (s) { return document.querySelector(s); }, qa = function (s) { return Array.prototype.slice.call(document.querySelectorAll(s)); };
          MW.transitionMoworksMatchCut(q(".mc-b"), tl, 1.5, {});
          tl.set({}, {}, 3);
          // register only when every motion is ready (MW.pending: e.g. a WebGL texture still decoding), as HyperFrames asks of async builds
          var go = function () { window.__timelines = window.__timelines || {}; window.__timelines["mw-demo"] = tl; };
          if (window.MW && MW.pending && MW.pending.length) Promise.all(MW.pending).then(go, go); else go();
        })();
      </script>
    </div>
  </body>
</html>
