<!--
  Match Cut (Moworks Studio, the studio's own, written here).
  Source: Moworks Studio.
  Cắt thẳng ở chỗ khung cuối cảnh cũ và khung đầu cảnh mới trùng hình dạng và vị trí, như mặt trời hoá đồng xu.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.transitionMoworksMatchCut(q(".mc-b"), tl, 1.5, {});

  Options (defaults in brackets):
      - from: the outgoing scene

  Notes: A plain cut (no interpolation) where the last frame of A and the first frame of B share shape, position and size: demo A = blue frame with a yellow circle r 40 at the centre; B = light frame with the same yellow circle turned into a coin (ring r 30, 3 px, currency mark); cut halfway through each 1.5 s half. Params: shape · position · size: phải khớp hai bên điểm cắt. The motion is a plain cut; the match is in the layout: the last frame of the outgoing scene and the first of the incoming share a shape at the same place and size.
-->

<section class="mc mc-a"><div class="sunc"></div><div class="mc-cap">Mặt trời lặn</div></section>
<section class="mc mc-b"><div class="coin"><div class="ring">₫</div></div><div class="mc-cap">Đồng xu tiết kiệm</div></section>

<style>

</style>

<script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  var defaults = {"from":null};
  var run = function (el, tl, at, o) {
        var out = o.from ? MW.el(o.from) : el.previousElementSibling;
        gsap.set(el, { autoAlpha: 0 });
        tl.set(el, { autoAlpha: 1 }, at);
        if (out) tl.set(out, { autoAlpha: 0 }, at);
        return at;
      };
  MW.transitionMoworksMatchCut = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
</script>
