<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Kanji Stroke Order - Demo</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
:root { --bg: #09090b; --fg: #fafafa; --card: #111114; --line: #27272a; }
* { box-sizing: border-box; }
html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); }
#demo { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); color: var(--fg); font-family: Inter, sans-serif; }
.center { position: absolute; inset: 0; display: grid; place-items: center; }
.row { display: flex; align-items: center; justify-content: center; gap: 48px; }
.col { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 32px; }
.h1 { font-size: 132px; font-weight: 800; letter-spacing: -0.035em; line-height: 1.1; text-align: center; }
.h2 { font-size: 84px; font-weight: 700; letter-spacing: -0.025em; line-height: 1.15; text-align: center; }
.p { font-size: 40px; line-height: 1.4; opacity: 0.72; text-align: center; }
.card { position: relative; border-radius: 28px; background: var(--card); border: 2px solid var(--line); overflow: hidden; }
.muted { opacity: 0.6; }

#demo { background: radial-gradient(100% 100% at 50% 45%, #1a1f33, #0b0d12); color: #e8ebf3; font-family: Inter, sans-serif; }
.st { position: absolute; inset: 0; display: grid; place-items: center; } .so { position: relative; width: 640px; height: 640px; border-radius: 30px; background: #121722; border: 3px solid #262c3a; }
    </style>
  </head>
  <body>
    <div id="demo" data-composition-id="mw-demo" data-start="0" data-width="1920" data-height="1080" data-duration="5">
<div class="st"><div class="so"></div></div>
      <script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };

    tl.fromTo(s, { t: 0 }, { t: dur, duration: dur, ease: "none", immediateRender: false, onUpdate: function () { fn(s.t); } }, at);
    return at + dur;
  };
  var defaults = {"strokes":["M17 37 C35 35 62 34 84 33","M50 10 C50 40 51 70 50 93","M48 37 C42 55 30 70 14 80","M52 38 C60 55 72 68 88 78"],"width":5.5,"gap":0.1,"fit":3.6,"start":0.35,"exitAt":4.55,"accent":"#ff5d8f","ink":"#e8ebf3","loop":5};
  var run = function (el, tl, at, o) {
        var ns = "http://www.w3.org/2000/svg", svg = document.createElementNS(ns, "svg"), io = gsap.parseEase("power1.inOut"), W = el.clientWidth, k = W / 100;
        svg.setAttribute("viewBox", "0 0 100 100"); svg.style.cssText = "position:absolute;inset:0;width:100%;height:100%;overflow:visible;"; if (getComputedStyle(el).position === "static") el.style.position = "relative";
        svg.innerHTML = '<path d="M50 0 V100 M0 50 H100" stroke="#3a4466" stroke-width="0.6" stroke-dasharray="2 2" fill="none"/>'; el.appendChild(svg);
        var mkp = function (d, col, w) { var p = document.createElementNS(ns, "path"); p.setAttribute("d", d); p.setAttribute("fill", "none"); p.setAttribute("stroke", col); p.setAttribute("stroke-width", w); p.setAttribute("stroke-linecap", "round"); p.setAttribute("stroke-linejoin", "round"); svg.appendChild(p); return p; };
        o.strokes.forEach(function (d) { mkp(d, "#2a3142", o.width); });
        var S = o.strokes.map(function (d, i) { var p = mkp(d, o.accent, o.width), L = p.getTotalLength(), b = document.createElementNS(ns, "g"), q = p.getPointAtLength(0); p.style.strokeDasharray = L + " " + L; p.style.strokeDashoffset = String(L);
          b.innerHTML = '<circle r="4.2" fill="' + o.accent + '"/><text y="1.6" text-anchor="middle" font-size="5" font-weight="800" fill="#0b0d12" font-family="Inter, sans-serif">' + (i + 1) + "</text>"; b.setAttribute("transform", "translate(" + (q.x - 5) + " " + (q.y - 5) + ")"); b.style.opacity = "0"; svg.appendChild(b); return { p: p, L: L, b: b, d: Math.max(0.16, L * k / 4 * 0.003) }; });
        var head = document.createElementNS(ns, "path"); head.setAttribute("d", "M0 -3.4 L5.5 0 L0 3.4 Z"); head.setAttribute("fill", o.accent); svg.appendChild(head);
        var tot = S.reduce(function (a, s) { return a + s.d; }, 0) + o.gap * (S.length - 1), f = tot > o.fit ? o.fit / tot : 1, t0 = o.start; S.forEach(function (s) { s.t = t0; s.d *= f; t0 += s.d + o.gap * f; });
        return MW.drive(tl, at, o.loop, function (t) {
          var x = Math.max(0, Math.min(1, (t - o.exitAt) / 0.3)), act = null; svg.style.opacity = String(1 - x);
          S.forEach(function (s) { var u = io(Math.max(0, Math.min(1, (t - s.t) / s.d))); s.p.style.strokeDashoffset = String(s.L * (1 - u)); s.p.setAttribute("stroke", u >= 1 ? o.ink : o.accent); s.b.style.opacity = t >= s.t ? "1" : "0"; if (u > 0 && u < 1) act = { s: s, u: u }; });
          if (act) { var l = act.s.L * act.u, a = act.s.p.getPointAtLength(l), b = act.s.p.getPointAtLength(Math.max(0, l - 1)); head.setAttribute("transform", "translate(" + a.x + " " + a.y + ") rotate(" + (Math.atan2(a.y - b.y, a.x - b.x) * 180 / Math.PI) + ")"); head.style.opacity = "1"; } else head.style.opacity = "0";
        });
      };
  MW.textStrokeOrder = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
      </script>
      <script>
        (function () {
          var tl = gsap.timeline({ paused: true });
          var q = function (s) { return document.querySelector(s); }, qa = function (s) { return Array.prototype.slice.call(document.querySelectorAll(s)); };
          MW.textStrokeOrder(q(".so"), tl, 0, {});
          tl.set({}, {}, 5);

          var go = function () { window.__timelines = window.__timelines || {}; window.__timelines["mw-demo"] = tl; };
          if (window.MW && MW.pending && MW.pending.length) Promise.all(MW.pending).then(go, go); else go();
        })();
      </script>
    </div>
  </body>
</html>
