<!--
  Card Flip (Moworks Studio, the studio's own, written here).
  Source: Moworks Studio.
  Thẻ lật quanh trục dọc 180° để lộ mặt sau, phồng nhẹ giữa chừng; mặt quay đi được ẩn nên không bao giờ thấy chữ bị lật ngược, rồi lật về.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.motionMoworksCardFlip(q(".kf"), tl, 0.4, {});

  Options (defaults in brackets):
      - duration: s per flip (0.7)
      - hold: s on the back (0.65)
      - bulge: scaleY added mid-flip (0.06)
      - ease: (power2.inOut)
      - perspective: px (1600)
      - returns: flip back after the hold
      - front: 
      - back: 

  Notes: Card 110x70 r8 with front (accent, 'FRONT', chip, number) and back (dark, stripe, 'BACK', 'DETAILS') faces. rotationY 0 → 180° over 0.7 s power2.inOut (0.4-1.1 s), back over 1.75-2.45 s after a hold; scaleY 1 + 0.06 × sin(angle) mid-flip; the face turned away is hidden (backface hidden, no mirrored text). AE: a 3D layer with two faces. (The demo also shows a wrong mirrored copy for comparison.) Params: duration (0.7 s, power2.inOut) · hold (0.65 s) · bulge (6 %) · faces: trước / sau. The face turned away is hidden, so the text is never seen mirrored.
-->

<script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.drive = MW.drive || function (tl, at, dur, fn) {
    var s = { t: 0 }; fn(0);
    tl.fromTo(s, { t: 0 }, { t: dur, duration: dur, ease: "none", immediateRender: false, onUpdate: function () { fn(s.t); } }, at);
    return at + dur;
  };
  var defaults = {"duration":0.7,"hold":0.65,"bulge":0.06,"ease":"power2.inOut","perspective":1600,"returns":true,"front":".kf-f","back":".kf-b"};
  var run = function (el, tl, at, o) {
        var f = el.querySelector(o.front), b = el.querySelector(o.back), e = gsap.parseEase(o.ease), back = o.duration + o.hold;
        return MW.drive(tl, at, o.returns ? back + o.duration : o.duration, function (t) {
          var A = 180 * e(Math.max(0, Math.min(1, t / o.duration))); if (o.returns) A -= 180 * e(Math.max(0, Math.min(1, (t - back) / o.duration)));
          var face = A > 90 ? 1 : 0; gsap.set(el, { rotationY: face ? A - 180 : A, scaleY: 1 + o.bulge * Math.sin(A * Math.PI / 180), transformPerspective: o.perspective });
          f.style.visibility = face ? "hidden" : "visible"; b.style.visibility = face ? "visible" : "hidden";
        });
      };
  MW.motionMoworksCardFlip = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
</script>
