<!--
  Melt Drip (Moworks Studio, the studio's own, written here).
  Source: Moworks Studio.
  Phần dưới của chữ chảy dài xuống như sáp nóng, mỗi chữ một nhịp, từ vệt dài nhất một giọt rơi xuống.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.textMeltDrip(q(".tk-head"), tl, 0, {});

  Options (defaults in brackets):
      - drip: [min, max] px of the drips ([32, 264])
      - duration: s per letter (1.6, ease-in quad)
      - spread: s the letters start within, in a seeded order (0.5)
      - start: s (0.3)
      - resetAt: s (3.0)
      - accent: the falling drops
      - seed: (6)
      - loop: s (3.8)

  Notes: Per char (seeded order, starts spread over 0.5 s): the lower half (baseline − 0.3 to + 0.26 em) stretches down per column by melt × (8 + 58 × noise(x·0.11)^1.8) px, melt 0 → 1 over 1.6 s easeInQuad (SVG: Y displacement 0 → 40 px, 2 s, spline (.55,0,1,.45), turbulence 0.02 / 0.15); tops pinned; gooey alpha (blur 4, alpha ×18 −7); Each char sheds one accent drop from its longest drip: swells 0.25 s, falls y = 220·t² px. Reset 3.0–3.5 s; loop 3.8 s. Params: drip: độ dài vệt chảy (8–66 px) · duration: mỗi chữ (1.6–2 s, ease-in) · spread: lệch giữa các chữ (0.5 s) · drops (bật). The tops stay pinned; only the lower part of each column stretches down by melt × the drip length.
-->

<script>
(function () {

  var defaults = {"drip":[32,264],"duration":1.6,"spread":0.5,"start":0.3,"resetAt":3,"accent":"#ff5d8f","seed":6,"loop":3.8};

    var g = off.getContext("2d"); g.font = cs.fontWeight + " " + cs.fontSize + " " + cs.fontFamily; g.fillStyle = cs.color; g.textAlign = "center"; g.textBaseline = "middle"; g.fillText(el.textContent, W / 2, Hh / 2 + parseFloat(cs.fontSize) * 0.04);

    c.drawImage(Rr.off, 0, 0, Rr.W, cut, 0, 0, Rr.W, cut); var ci = 0;
    for (var x = 0; x < Rr.W; x += 2) { while (ci < chars.length - 1 && x >= chars[ci].b) ci++; var q = chars[ci], m = reset > 0.5 ? 0 : p1(Math.max(0, Math.min(1, (t - q.st) / o.duration))), ext = m * D(x); c.drawImage(Rr.off, x, cut, 2, bot - cut, x, cut, 2, bot - cut + ext); }
    if (reset < 0.5) chars.forEach(function (q) { var u = t - q.st - o.duration * 0.7; if (u <= 0) return; var sw = Math.min(1, u / 0.25), y = bot + q.dmax + (u > 0.25 ? 880 * Math.pow(u - 0.25, 2) : 0); if (y > cv.height) return; c.fillStyle = o.accent; c.beginPath(); c.arc(q.dx + 1, y, 10 * sw, 0, 2 * Math.PI); c.fill(); });
    c.globalAlpha = 1;
  });
  };
  MW.textMeltDrip = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
