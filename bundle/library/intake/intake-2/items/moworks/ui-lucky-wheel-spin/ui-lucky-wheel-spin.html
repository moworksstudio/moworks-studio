<!--
  Lucky Roulette (Moworks Studio, the studio's own, written here).
  Source: Moworks Studio.
  Bánh xe sáu ô quay hơn ba vòng rồi chậm dần, chữ trên ô mờ đi khi quay nhanh; kim phía trên giật mỗi lần vạch chia đi qua; dừng lại thì ô trúng đổ màu nhấn và nhãn kết quả bật ra.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.uiLuckyWheelSpin(q(".gm"), tl, 0, {});

  Options (defaults in brackets):
      - labels: the prizes (6)
      - turns: full turns (3)
      - extra: degrees more (100)
      - start: s (0.3)
      - spin: s (2.05), power3.out
      - loop: s (3.8)

  Notes: px @320x200. Wheel r 60, 6 segments of 60° (alternating greys), labels on radius 40. Spins 3 turns + 100° over 2.05 s (0.3-2.35 s) outQuart. Label opacity 1 − 0.8·clamp(s − 1), with s = 4·(1 − p)^0.75 (p = eased progress): 20 % at full speed. Top pointer tilts back 0.5 rad × min(1, s) × e^(−6f) (f = share of a segment past the last divider). Winning segment fills accent at 2.4 s (150 ms); result 0.8 → 1 (250 ms back.out, 2.45 s). Rewind 3.4-3.75 s. Params: segments: số ô (6) · turns: số vòng (3 vòng + 100°) · spin: thời gian quay (2.05 s) · win: ô trúng (3) · result: nhãn kết quả.
-->

<div class="gm"><div class="lw-res">TRÚNG THƯỞNG!</div></div>

<script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.drive = MW.drive || function (tl, at, dur, fn) {
    var s = { t: 0 }; fn(0);
    tl.fromTo(s, { t: 0 }, { t: dur, duration: dur, ease: "none", immediateRender: false, onUpdate: function () { fn(s.t); } }, at);
    return at + dur;
  };
  MW.canvas = MW.canvas || function (host, w, h) {
    host = MW.el(host);
    var cv = document.createElement("canvas"); w = w || host.clientWidth || 1920; h = h || host.clientHeight || 1080;
    cv.width = w; cv.height = h; cv.style.position = "absolute"; cv.style.left = "0"; cv.style.top = "0"; cv.style.width = w + "px"; cv.style.height = h + "px"; cv.style.pointerEvents = "none";
    host.appendChild(cv);
    return { cv: cv, ctx: cv.getContext("2d"), w: w, h: h };
  };
  MW.rr = MW.rr || function (c, x, y, w, h, r) { r = Math.min(r, w / 2, h / 2); c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); };
  MW.txt = MW.txt || function (c, s, x, y, size, color, weight, align) { c.font = (weight || 700) + " " + size + "px Inter, sans-serif"; c.fillStyle = color || "#e8ebf3"; c.textAlign = align || "center"; c.textBaseline = "middle"; c.fillText(s, x, y); };
  MW.cursor = MW.cursor || function (c, x, y, s) { s = s || 1; c.save(); c.translate(x, y); c.scale(s, s); c.beginPath(); c.moveTo(0, 0); c.lineTo(0, 16); c.lineTo(4, 12.5); c.lineTo(6.5, 18); c.lineTo(9, 17); c.lineTo(6.5, 11.5); c.lineTo(11.5, 11.5); c.closePath(); c.fillStyle = "#fff"; c.fill(); c.lineWidth = 1; c.strokeStyle = "#111"; c.stroke(); c.restore(); };
  MW.path = MW.path || function (keys, t, ease) {
    var e = typeof ease === "function" ? ease : gsap.parseEase(ease || "power2.inOut");
    if (t <= keys[0][0]) return [keys[0][1], keys[0][2]];
    for (var i = 1; i < keys.length; i++) if (t <= keys[i][0]) { var a = keys[i - 1], b = keys[i], u = e((t - a[0]) / ((b[0] - a[0]) || 1)); return [a[1] + (b[1] - a[1]) * u, a[2] + (b[2] - a[2]) * u]; }
    var z = keys[keys.length - 1]; return [z[1], z[2]];
  };
  MW.stage320 = MW.stage320 || function (host) {
    host = MW.el(host); if (getComputedStyle(host).position === "static") host.style.position = "relative";
    var c = MW.canvas(host), k = Math.min(c.w / 320, c.h / 200), ox = (c.w - 320 * k) / 2, oy = (c.h - 200 * k) / 2;
    return { ctx: c.ctx, cv: c.cv, k: k, ox: ox, oy: oy, w: c.w, h: c.h,
      clear: function () { c.ctx.setTransform(1, 0, 0, 1, 0, 0); c.ctx.clearRect(0, 0, c.w, c.h); c.ctx.setTransform(k, 0, 0, k, ox, oy); },
      put: function (el, x, y) { el.style.position = "absolute"; el.style.left = (ox + x * k) + "px"; el.style.top = (oy + y * k) + "px"; gsap.set(el, { xPercent: -50, yPercent: -50 }); } };
  };
  var defaults = {"labels":["10 điểm","Quà","50 điểm","Thêm lượt","100 điểm","Mất lượt"],"turns":3,"extra":100,"start":0.3,"spin":2.05,"loop":3.8};
  var run = function (el, tl, at, o) {
        var S = MW.stage320(el), c = S.ctx, q3 = gsap.parseEase("power3.out"), bk = gsap.parseEase("back.out"), io = gsap.parseEase("power2.inOut"), res = el.querySelector(".lw-res"), n = o.labels.length, seg = 2 * Math.PI / n;
        var total = (o.turns * 360 + o.extra) * Math.PI / 180, fin = total % (2 * Math.PI), win = ((Math.round((-fin / seg) - 0.5) % n) + n) % n;
        if (res) { S.put(res, 160, 186); res.textContent = o.labels[win].toUpperCase(); }
        return MW.drive(tl, at, o.loop, function (t) {
          S.clear(); var u = Math.max(0, Math.min(1, (t - o.start) / o.spin)), p = q3(u), rw = io(Math.max(0, Math.min(1, (t - 3.4) / 0.35))), a = total * p * (1 - rw), s = u > 0 && u < 1 ? 4 * Math.pow(1 - p, 0.75) : 0;
          c.save(); c.translate(160, 96); c.rotate(a);
          for (var i = 0; i < n; i++) {
            var a0 = -Math.PI / 2 + i * seg; c.beginPath(); c.moveTo(0, 0); c.arc(0, 0, 60, a0, a0 + seg); c.closePath();
            c.fillStyle = i === win && t >= 2.4 && rw < 1 ? gsap.utils.interpolate(i % 2 ? "#2a3142" : "#363f57", "#8b7bff", Math.min(1, (t - 2.4) / 0.15)) : i % 2 ? "#2a3142" : "#363f57"; c.fill(); c.strokeStyle = "#0b0d12"; c.lineWidth = 1.2; c.stroke();
            c.save(); c.rotate(a0 + seg / 2); c.translate(40, 0); c.rotate(Math.PI / 2); c.globalAlpha = 1 - 0.8 * Math.max(0, Math.min(1, s - 1)); MW.txt(c, o.labels[i], 0, 0, 7.5, "#e8ebf3", 800); c.restore();
          }
          c.restore(); c.fillStyle = "#e8ebf3"; c.beginPath(); c.arc(160, 96, 8, 0, 2 * Math.PI); c.fill();
          var f = ((a % seg) + seg) % seg / seg, tilt = 0.5 * Math.min(1, s) * Math.exp(-6 * f);
          c.save(); c.translate(160, 30); c.rotate(-tilt); c.fillStyle = "#ffd23d"; c.beginPath(); c.moveTo(-7, -6); c.lineTo(7, -6); c.lineTo(0, 10); c.closePath(); c.fill(); c.restore();
          if (res) { var v = Math.max(0, Math.min(1, (t - 2.45) / 0.25)); gsap.set(res, { xPercent: -50, yPercent: -50, scale: (0.8 + 0.2 * bk(v)) * (1 - rw) }); res.style.opacity = String(Math.min(1, v * 3) * (1 - rw)); }
        });
      };
  MW.uiLuckyWheelSpin = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
</script>
