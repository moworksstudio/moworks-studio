  Bounce Press (Moworks Studio, the studio's own, written here).
  Source: Moworks Studio.
  Con trỏ bấm, nút lún xuống 0.92 trong 0.1 s, giữ trong lúc nhấn, thả ra thì nảy lên 1.05 một lần rồi về đúng cỡ.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.uiPressBounce(q(".pb"), tl, 0, { cursor: ".ui-cursor" });

  Options (defaults in brackets):
      - press: s (0.7)
      - release: s (1.25)
      - down: scale when pressed, 0.1 s power2.out (0.92)
      - up: rebound on release, 0.16 s power1.out (1.05)
      - settle: s back to 1 (0.3, power2.inOut)
      - cursor: an optional cursor that makes the clicks
      - approach: [x, y] px the cursor comes from
      - lead: s it arrives before a click

  Notes: At the click: scale 1 → 0.92 in 100 ms (power2.out); stays down while held (0.55 s in the demo, press 0.7 s, release 1.25 s); release: 0.92 → 1.05 in 160 ms (power1.out), then 1.05 → 1 in 300 ms (power2.inOut). One rebound only. Pill button 140x46. The cursor arrives on a slight arc (10 % sideways bow) before the press. Params: at: lúc bấm · hold (0.55 s) · down (0.92, 0.1 s) · up (1.05, 0.16 s) · settle (0.3 s).
-->
