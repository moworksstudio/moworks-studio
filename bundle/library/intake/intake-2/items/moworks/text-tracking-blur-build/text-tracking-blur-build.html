<!--
  Blur + Tracking Build (Moworks Studio, the studio's own, written here).
  Source: Moworks Studio.
  Dòng chữ giãn rộng và nhoè 20 px từ từ khép lại và rõ nét trong 2 giây, kiểu tiêu đề phim.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.textTrackingBlurBuild(q(".tk-head"), tl, 0, { tracking: "fill" });

  Options (defaults in brackets):
      - tracking: em of extra spacing at the start (0.5), or 'fill' to spread to the frame width
      - max: em at most with 'fill' (0.9)
      - width: px to fill (0: the window)
      - duration: s the spacing closes over (2.1)
      - ease: (cubic-bezier(.33,1,.68,1))
      - fade: s per letter (0.6)
      - unblur: s per letter (1.7)
      - spread: s the letters start within (0.25)
      - blur: px (20)
      - start: s (0.3)
      - exitAt: s (3.4)
      - loop: s (4)

  Notes: Line letter-spacing +0.5 em → 0 over 2 s easeOutCubic (CSS cubic-bezier(.33,1,.68,1); labelled power3.out; demo spreads to fill the frame width, max 0.9 em, over 2.1 s); meanwhile each char fades in and un-blurs 20 → 0 px over 1.5 s, chars 50 ms apart left → right (demo: fade 0.6 s, blur 1.7 s, starts spread over 0.25 s). AE: Tracking +50 → 0, Blur 20 → 0, Ramp Up, Ease Low 50 %. Demo framed in 2.39:1 letterbox bars; exit fade 3.4–3.8 s; loop 4 s. Params: tracking: giãn đầu (0.5 em) · duration (2 s) · blur (20 px) · stagger (0.05 s).
-->

<script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.split = MW.split || function (el, mode) {
    el = MW.el(el);
    if (el.__mwSplit) return el.__mwSplit;
    var seg = typeof Intl !== "undefined" && Intl.Segmenter ? new Intl.Segmenter("vi", { granularity: "grapheme" }) : null;
    var graphemes = function (s) { if (seg) { var out = []; var it = seg.segment(s)[Symbol.iterator](), r; while (!(r = it.next()).done) out.push(r.value.segment); return out; } return Array.from(s); };
    var res = { chars: [], words: [], lines: [] };
    var walk = function (node) {
      var kids = Array.prototype.slice.call(node.childNodes);
      for (var k = 0; k < kids.length; k++) {
        var n = kids[k];
        if (n.nodeType === 1) { if (n.tagName === "BR") continue; walk(n); continue; }
        if (n.nodeType !== 3) continue;
        var text = n.nodeValue.normalize("NFC"), frag = document.createDocumentFragment();
        var parts = text.split(/(\s+)/);
        for (var p = 0; p < parts.length; p++) {
          var part = parts[p];
          if (!part) continue;
          if (/^\s+$/.test(part)) { frag.appendChild(document.createTextNode(part)); continue; }
          var w = document.createElement("span");
          w.className = "mw-w"; w.style.display = "inline-block"; w.style.whiteSpace = "nowrap";
          if (mode === "words") w.textContent = part;
          else { var gs = graphemes(part); for (var g = 0; g < gs.length; g++) { var c = document.createElement("span"); c.className = "mw-ch"; c.style.display = "inline-block"; c.textContent = gs[g]; w.appendChild(c); res.chars.push(c); } }
          res.words.push(w); frag.appendChild(w);
        }
        node.replaceChild(frag, n);
      }
    };
    walk(el);
    var top = null, line = null;
    for (var i = 0; i < res.words.length; i++) { var y = res.words[i].offsetTop; if (top === null || Math.abs(y - top) > 2) { top = y; line = []; res.lines.push(line); } line.push(res.words[i]); }
    el.__mwSplit = res;
    return res;
  };
  MW.bezier = MW.bezier || function (x1, y1, x2, y2) {
    var cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx, cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
    var X = function (t) { return ((ax * t + bx) * t + cx) * t; }, Y = function (t) { return ((ay * t + by) * t + cy) * t; }, dX = function (t) { return (3 * ax * t + 2 * bx) * t + cx; };
    return function (p) {
      if (p <= 0) return 0; if (p >= 1) return 1;
      var t = p, i, d;
      for (i = 0; i < 8; i++) { d = X(t) - p; if (Math.abs(d) < 1e-6) return Y(t); var s = dX(t); if (Math.abs(s) < 1e-6) break; t -= d / s; }
      var lo = 0, hi = 1; t = p;
      for (i = 0; i < 40; i++) { d = X(t); if (Math.abs(d - p) < 1e-6) break; if (d < p) lo = t; else hi = t; t = (lo + hi) / 2; }
      return Y(t);
    };
  };
  MW.CSS_EASE = { ease: [0.25, 0.1, 0.25, 1], easeIn: [0.42, 0, 1, 1], easeOut: [0, 0, 0.58, 1], easeInOut: [0.42, 0, 0.58, 1] };
  MW.EASES = MW.EASES || { "css-ease": [0.25, 0.1, 0.25, 1], "css-in": [0.42, 0, 1, 1], "css-out": [0, 0, 0.58, 1], "css-in-out": [0.42, 0, 0.58, 1],
    md3: [0.2, 0, 0, 1], "md3-emph": [0.05, 0.7, 0.1, 1], "md3-acc": [0.3, 0, 1, 1], "md3-dec": [0, 0, 0, 1], whip: [0.9, 0, 0.1, 1], glide: [0.4, 0, 0.2, 1],
    house: [0.83, 0, 0.17, 1], "in-out": [0.65, 0, 0.35, 1] };
  MW.ez = MW.ez || function (name) {
    if (typeof name === "function") return name;
    var b = MW.EASES[name]; if (b) return MW.bezier(b[0], b[1], b[2], b[3]);
    var m = /^cubic-bezier\(([^)]+)\)$/.exec(name || ""); if (m) { var v = m[1].split(",").map(Number); return MW.bezier(v[0], v[1], v[2], v[3]); }
    return gsap.parseEase(name || "none");
  };
  MW.drive = MW.drive || function (tl, at, dur, fn) {
    var s = { t: 0 }; fn(0);
    tl.fromTo(s, { t: 0 }, { t: dur, duration: dur, ease: "none", immediateRender: false, onUpdate: function () { fn(s.t); } }, at);
    return at + dur;
  };
  var defaults = {"tracking":0.5,"max":0.9,"width":0,"duration":2.1,"ease":"cubic-bezier(.33,1,.68,1)","fade":0.6,"unblur":1.7,"spread":0.25,"blur":20,"start":0.3,"exitAt":3.4,"loop":4};
  var run = function (el, tl, at, o) {
        el.style.whiteSpace = "nowrap"; el.style.maxWidth = "none";
        var ch = MW.split(el, "chars").chars, n = ch.length, e = MW.ez(o.ease), fs = parseFloat(getComputedStyle(el).fontSize), sp = o.tracking, gap = o.spread / Math.max(1, n - 1);
        if (sp === "fill") { var tw = ch.reduce(function (s, c) { return s + c.offsetWidth; }, 0); sp = Math.max(0, Math.min(o.max, ((o.width || window.innerWidth) * 0.92 - tw) / Math.max(1, n - 1) / fs)); }
        return MW.drive(tl, at, o.loop, function (t) {
          var ls = sp * (1 - e(Math.max(0, Math.min(1, (t - o.start) / o.duration)))), x = Math.max(0, Math.min(1, (t - o.exitAt) / 0.4));
          el.style.letterSpacing = ls.toFixed(4) + "em"; el.style.paddingLeft = ls.toFixed(4) + "em";
          ch.forEach(function (c, i) { var s = t - o.start - i * gap, a = Math.max(0, Math.min(1, s / o.fade)), b = Math.max(0, Math.min(1, s / o.unblur)); c.style.opacity = String(a * (1 - x)); c.style.filter = b < 1 ? "blur(" + (o.blur * (1 - e(b))).toFixed(2) + "px)" : ""; });
        });
      };
  MW.textTrackingBlurBuild = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
</script>
