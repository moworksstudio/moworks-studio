  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.textConvergeFromSpread(q(".tk-head"), tl, 0, {});

  Options (defaults in brackets):
      - spread: em per step from the centre (1.5)
      - duration: s (1, power1.inOut)
      - stagger: s from the centre out (0.08)
      - cap: s (0.6)
      - ease: 
      - dim: opacity when spread (0.35)
      - start: s (0.3)
      - outAt: s (2.6)
      - outDuration: s (0.65)
      - outStagger: s, edges first (0.04)
      - loop: s (3.5)

  Notes: Split chars; char i starts at x = 150 px × (i − n/2) (demo 1.5 em × (i − (n−1)/2)) and moves to 0 over 1 s power1.inOut, stagger 80 ms from the centre outward (demo capped 0.6 s total), from 0.3 s; demo opacity 0.35 → 1. Loop exit: chars spread out again, edges first, 0.65 s, 40 ms apart, from 2.6 s; loop 3.5 s. Clip to the text box. Params: spread: khoảng cách đầu mỗi bậc (150 px) · duration (1 s) · stagger: từ giữa ra (0.08 s) · ease (power1.inOut).
-->
