<!--
  Freeze-frame Color Drain (Moworks Studio, the studio's own, written here).
  Source: Moworks Studio.
  Cảnh đang chạy thì đứng hình đúng khung đó, màu rút sạch về xám trong tích tắc, bốn góc khung và chữ "TẠM DỪNG" hiện lên; giữ một lúc rồi màu trở lại và cảnh chạy tiếp từ đúng chỗ dừng.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.effectFreezeColorDrain(sc, tl, 0, { label: ".fzl", frame: ".fzb" });

  Options (defaults in brackets):
      - freezeAt: s (1.3)
      - resumeAt: s (3.1)
      - drain: s for the colour to drain, ease-out (0.15)
      - back: s for it to return, ease-in, ending as time resumes (0.2)
      - label: the PAUSED title (fades with the drain)
      - frame: the corner brackets

  Notes: Scene time runs, freezes at 1.3 s and resumes at 3.1 s from the same frame (time after = t − 1.8 s). Saturation 100 → 0 % in 150 ms outCubic at 1.3 s; held grey 1.6 s; colour returns 2.9-3.1 s in-cubic, finishing as time resumes. Corner brackets (14 px legs, 2 px; inset 14 px from the sides, 26 / 14 px from top / bottom @320x200) and a 'PAUSED' title fade with the drain. The small demo cross-fades to a grey copy of the scene; a film uses filter saturate(). Params: freezeAt: lúc đứng hình (1.3 s) · resumeAt: lúc chạy lại (3.1 s) · drain: thời gian rút màu (0.15 s) · back: thời gian màu về (0.2 s) · label: chữ tạm dừng. Time freeze: the scene's own animation must read its time from el.__mwTime(t) (the demo's orbiting shapes do).
-->

<div class="fz"><div class="o o1"></div><div class="o o2"></div><div class="o o3"></div><div class="fzl">TẠM DỪNG</div><div class="fzb"><i></i><i></i><i></i><i></i></div></div>

<script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.drive = MW.drive || function (tl, at, dur, fn) {
    var s = { t: 0 }; fn(0);
    tl.fromTo(s, { t: 0 }, { t: dur, duration: dur, ease: "none", immediateRender: false, onUpdate: function () { fn(s.t); } }, at);
    return at + dur;
  };
  var defaults = {"freezeAt":1.3,"resumeAt":3.1,"drain":0.15,"back":0.2,"label":null,"frame":null};
  var run = function (el, tl, at, o) {
        var out = gsap.parseEase("power2.out"), inn = gsap.parseEase("power2.in"), lab = o.label ? MW.el(o.label) : null, fr = o.frame ? MW.el(o.frame) : null, span = o.resumeAt - o.freezeAt;
        // the scene's own motion reads its time from el.__mwTime(t): it runs, stands still from freezeAt, and resumes from the same frame
        el.__mwTime = function (t) { return t < at + o.freezeAt ? t - at : t < at + o.resumeAt ? o.freezeAt : t - at - span; };
        return MW.drive(tl, at, o.resumeAt + 0.2, function (t) {
          var g = t < o.freezeAt ? 0 : t < o.freezeAt + o.drain ? out((t - o.freezeAt) / o.drain) : t < o.resumeAt - o.back ? 1 : t < o.resumeAt ? 1 - inn((t - o.resumeAt + o.back) / o.back) : 0;
          el.style.filter = g > 0.001 ? "saturate(" + (1 - g) + ")" : "";
          if (lab) lab.style.opacity = String(g); if (fr) fr.style.opacity = String(g);
        });
      };
  MW.effectFreezeColorDrain = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
</script>
