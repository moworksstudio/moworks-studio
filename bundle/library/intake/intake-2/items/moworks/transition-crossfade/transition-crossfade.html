<!--
  Crossfade / Dissolve (Moworks Studio, the studio's own, written here).
  Source: Moworks Studio.
  Cảnh mới hiện dần đè lên cảnh cũ trong khoảng 12 khung hình, cảnh cũ giữ nguyên bên dưới cho tới hết.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.transitionCrossfade(q(".tk-b"), tl, 1.2, { duration: 0.5, ease: "sine.inOut" });

  Options (defaults in brackets):
      - duration: s (0.5)
      - ease: none, or sine.inOut as the small demo
      - from: the outgoing scene

  Notes: Incoming scene opacity 0 -> 1 over the outgoing one in 500 ms (atlas: ~12 frames at 24 fps), linear (the demo eases it in-out); the outgoing scene stays at 1 underneath (no dip to the film background) and hides at the end. HF showcase-dissolve ships Crossfade / Color Dip / Blur Crossfade / Focus Pull (Apache-2.0). Params: duration (0.5 s) · ease (none / sine.inOut).
-->

<section class="tk-scene tk-a"><div class="tk-mark circle"></div><div class="tk-sc-text"><div class="tk-sc-letter">A</div><div class="tk-sc-cap">Cảnh mở đầu</div></div></section>
<section class="tk-scene tk-b"><div class="tk-mark square"></div><div class="tk-sc-text"><div class="tk-sc-letter">B</div><div class="tk-sc-cap">Cảnh tiếp theo</div></div></section>

<style>

</style>

<script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.drive = MW.drive || function (tl, at, dur, fn) {
    var s = { t: 0 }; fn(0);
    tl.fromTo(s, { t: 0 }, { t: dur, duration: dur, ease: "none", immediateRender: false, onUpdate: function () { fn(s.t); } }, at);
    return at + dur;
  };
  var defaults = {"duration":0.5,"ease":"none","from":null};
  var run = function (el, tl, at, o) {
        var out = o.from ? MW.el(o.from) : el.previousElementSibling, ease = gsap.parseEase(o.ease);
        return MW.drive(tl, at, o.duration, function (t) {
          var p = t / o.duration;
          el.style.opacity = ease(p); el.style.visibility = p > 0 ? "visible" : "hidden";
          if (out) out.style.visibility = p >= 1 ? "hidden" : "visible";
        });
      };
  MW.transitionCrossfade = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
</script>
