  Color Splash (Moworks Studio, the studio's own, written here).
  Source: Moworks Studio.
  Chạm vào nút, trạng thái mới (nền màu nhấn, chữ đổi màu) loang tròn ra từ đúng điểm chạm với mép sắc, phủ kín nút; chạm lần nữa thì trạng thái cũ loang về.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.uiColorSplash(q(".cs"), tl, 0, { cursor: ".ui-cursor" });

  Options (defaults in brackets):
      - taps: [[s, x share, y share], ...]: the first brings the new state, the second the old one back
      - grow: s to the farthest corner (0.5, power2.out), hard edge
      - rim: px light rim while it grows (6)
      - on: new background
      - onInk: new label colour
      - label: the label
      - cursor: an optional cursor that makes the clicks
      - approach: [x, y] px the cursor comes from
      - lead: s it arrives before a click

  Notes: Button 172x52, radius 14. Tap 1 (0.5 s, left-low point (116,104)): a circle carrying the new state (accent background, dark label) grows from the tap point to the farthest corner in 500 ms power2.out, hard edge (no fade), a 1.5 px light (ink) rim on the edge while it grows. Tap 2 (1.7 s, right-high point (214,80)) brings the old state (dark card, light label) back the same way. A small dot marks each tap for 0.3 s. Params: taps [[giây, x, y]] · grow (0.5 s, power2.out) · rim (1.5 px) · states (cũ / mới).
-->
