  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.textProximityRepel(q(".tk-head"), tl, 0, {});

  Options (defaults in brackets):
      - radius: em (1.3)
      - push: em at most (0.5)
      - follow: share of the gap closed each 1/60 s (0.15)
      - tilt: degrees per em of sideways push (18)
      - tintAt: em at full accent (0.3)
      - accent: 
      - ghost: opacity of the resting copy while displaced (0.15)
      - cursor: 
      - loop: s (4)

  Notes: Scripted cursor: bottom-left off-frame (0.4 s) → just left of the text (0.9 s) → straight across the line, linear, to just past its end (2.3 s) → out bottom-right (2.85 s). Char target = push away from the cursor of 24 px × (1 − d / 64 px) inside 64 px (recipe R 120, max 30); it closes 15 % of the gap per 60 fps frame. Tilt 0.012 rad per px of x push; tint to accent (full at 14 px); faint ghost at rest while displaced. Loop 4 s. Params: bán kính (64 px) · độ đẩy tối đa (24 px) · độ bám (0.15 / khung). The pointer comes in from the lower left, crosses the line at a steady speed and leaves to the lower right; the smoothing is stepped on the film clock.
-->
