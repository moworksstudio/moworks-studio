<!--
  Pixel Mosaic Resolve (Moworks Studio, the studio's own, written here).
  Source: Moworks Studio.
  Chữ hoặc khối hình bị khảm ô vuông lớn rồi rõ dần qua sáu nấc 32 → 1 px, mỗi nấc 120 ms, không chuyển mượt.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.effectPixelMosaic(q(".tk-head"), tl, 0, {});

  Options (defaults in brackets):
      - blocks: block sizes in px, coarse to sharp ([96, 48, 24, 12, 6, 1])
      - start: s it starts resolving (0.3)
      - step: s per step (0.12), hard cuts
      - exitAt: s it breaks up again (2.4)
      - exitStep: s per step on the way out (0.08)
      - loop: s (3.2)

  Notes: Text (or box) pixelated with block size 32 → 16 → 8 → 4 → 2 → 1 px, 6 hard steps of 120 ms (hold keys, smoothing off); letterforms become legible in the last two steps; reverse for an exit. Demo: 32 px held until 0.3 s, resolved by 0.78 s; exit steps back up at 80 ms each from 2.4 s; loop 3.2 s. Params: steps: các cỡ ô (32 / 16 / 8 / 4 / 2 / 1 px) · step: mỗi nấc (0.12 s) · exit: mỗi nấc khi rời (0.08 s). The small demo's steps are 32 → 1 px on a small frame; here the blocks are scaled to large type. Letters read only in the last two steps.
-->

<div class="tk-stage"><div><h1 class="tk-head ">RÕ DẦN</h1></div></div>

<style>

</style>

<script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.drive = MW.drive || function (tl, at, dur, fn) {
    var s = { t: 0 }; fn(0);
    tl.fromTo(s, { t: 0 }, { t: dur, duration: dur, ease: "none", immediateRender: false, onUpdate: function () { fn(s.t); } }, at);
    return at + dur;
  };
  var defaults = {"blocks":[96,48,24,12,6,1],"start":0.3,"step":0.12,"exitAt":2.4,"exitStep":0.08,"loop":3.2};
  var run = function (el,tl,at,o
  ) {
  var host = el.parentNode; if (getComputedStyle(host).position === "static") host.style.position = "relative";
  var clone = function () { var g = el.cloneNode(true), br = el.getBoundingClientRect(); g.removeAttribute("id"); g.style.position = "absolute"; g.style.margin = "0"; g.style.pointerEvents = "none"; g.style.boxSizing = "border-box";
    g.style.left = el.offsetLeft + "px"; g.style.top = el.offsetTop + "px"; g.style.width = (br.width + 0.5) + "px"; g.style.height = el.offsetHeight + "px"; host.insertBefore(g, el.nextSibling); return g; };
  var raster = function (m) { var cs = getComputedStyle(el), W = el.offsetWidth + 2 * m, Hh = el.offsetHeight + 2 * m, cv = document.createElement("canvas"), off = document.createElement("canvas"); cv.width = off.width = W; cv.height = off.height = Hh;
    cv.style.cssText = "position:absolute;pointer-events:none;left:" + (el.offsetLeft - m) + "px;top:" + (el.offsetTop - m) + "px;width:" + W + "px;height:" + Hh + "px;"; host.insertBefore(cv, el.nextSibling);
    var g = off.getContext("2d"); g.font = cs.fontWeight + " " + cs.fontSize + " " + cs.fontFamily; g.fillStyle = cs.color; g.textAlign = "center"; g.textBaseline = "middle"; g.fillText(el.textContent, W / 2, Hh / 2 + parseFloat(cs.fontSize) * 0.04);
    el.style.visibility = "hidden"; return { cv: cv, c: cv.getContext("2d"), off: off, W: W, H: Hh, fs: parseFloat(cs.fontSize), font: g.font }; };
  var Rr = raster(10), c = Rr.c, sm = document.createElement("canvas"), g = sm.getContext("2d");
  var B = function (t) { var steps = o.blocks, n = steps.length; if (o.exitAt != null && t >= o.exitAt) { var k = Math.floor((t - o.exitAt) / o.exitStep); return steps[Math.max(0, n - 1 - Math.min(n - 1, k))]; } if (t < o.start) return steps[0]; var j = Math.floor((t - o.start) / o.step) + 1; return steps[Math.min(n - 1, j)]; };
  return MW.drive(tl, at, o.loop, function (t) {
    var b = B(t); c.clearRect(0, 0, Rr.W, Rr.H); if (b <= 1) { c.imageSmoothingEnabled = true; c.drawImage(Rr.off, 0, 0); return; }
    var w = Math.max(1, Math.ceil(Rr.W / b)), h = Math.max(1, Math.ceil(Rr.H / b)); sm.width = w; sm.height = h; g.imageSmoothingEnabled = true; g.clearRect(0, 0, w, h); g.drawImage(Rr.off, 0, 0, w, h); c.imageSmoothingEnabled = false; c.drawImage(sm, 0, 0, w, h, 0, 0, w * b, h * b);
  });
  };
  MW.effectPixelMosaic = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
</script>
