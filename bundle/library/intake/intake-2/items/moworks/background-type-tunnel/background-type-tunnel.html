<!--
  Perspective Type Tunnel (Moworks Studio, the studio's own, written here).
  Source: Moworks Studio.
  Bốn bản của cùng một chữ nối nhau từ sâu trong khung phóng to lao về phía người xem, càng gần càng mờ và chỉ còn nét viền, lặp không ngắt.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.backgroundTypeTunnel(q(".tt"), tl, 0, {});

  Options (defaults in brackets):
      - word: the word element
      - copies: (4); one enters every loop ÷ 2 s
      - loop: s (4.2): each copy crosses in 2 × loop
      - color: fill and outline colour

  Notes: 4 copies of one word (34 px base) on a shared centre. Copy i has depth z = fract((i + 2t / 4.2) / 4): a copy enters every 2.1 s and crosses in 8.4 s. Scale = 0.3 × 22^z (0.3 → 6.6, exponential); opacity = min(1, 6z) × (1 − z)^1.8. While z < 0.4 the copy is filled accent; nearer copies are outline only (1.6 px on screen, opacity × 1.2). Draw far to near. Seamless loop (4.2 s demo). Params: số bản (4) · tỉ lệ (0.3 → 6.6) · chu kỳ (8.4 s mỗi bản) · chữ.
-->

<div class="tt"><div class="tt-w">TƯƠNG LAI</div></div>

<style>

</style>

<script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.drive = MW.drive || function (tl, at, dur, fn) {
    var s = { t: 0 }; fn(0);
    tl.fromTo(s, { t: 0 }, { t: dur, duration: dur, ease: "none", immediateRender: false, onUpdate: function () { fn(s.t); } }, at);
    return at + dur;
  };
  var defaults = {"word":".tt-w","copies":4,"loop":4.2,"color":"#a99bff"};
  var run = function (el, tl, at, o) {
        var word = el.querySelector(o.word), copies = [];
        for (var i = 0; i < o.copies; i++) { var c = word.cloneNode(true); c.style.position = "absolute"; c.style.left = "50%"; c.style.top = "50%"; c.style.whiteSpace = "nowrap"; el.appendChild(c); copies.push(c); }
        word.style.display = "none";
        return MW.drive(tl, at, o.loop, function (t) {
          copies.forEach(function (c, i) {
            var z = (((i + 2 * t / o.loop) / o.copies) % 1 + 1) % 1, sc = 0.3 * Math.pow(22, z), a = Math.min(1, 6 * z) * Math.pow(1 - z, 1.8), fill = z < 0.4;
            gsap.set(c, { xPercent: -50, yPercent: -50, scale: sc });
            c.style.color = fill ? o.color : "transparent"; c.style.webkitTextStroke = fill ? "0" : (1.6 * 4 / sc) + "px " + o.color; c.style.opacity = String(Math.min(1, fill ? a : a * 1.2)); c.style.zIndex = String(Math.round(z * 100));
          });
        });
      };
  MW.backgroundTypeTunnel = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
</script>
