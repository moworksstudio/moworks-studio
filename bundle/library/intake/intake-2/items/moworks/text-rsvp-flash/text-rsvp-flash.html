  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.textRsvpFlash(q(".rv"), tl, 0, {});

  Options (defaults in brackets):
      - text: the sentence
      - per: s per word (0.2: 300 words a minute), × 1.5 after punctuation or for long words
      - start: s (0.35)
      - cutAt: s (3.85)
      - accent: the focus letter
      - loop: s (4.2)

  Notes: One word at a fixed spot, hard cut every 0.2 s (300 wpm), × 1.5 after punctuation or for words over 8 letters; from 0.35 s the list (≤ 10 words) repeats to fill ~2.4 s, cut at 3.85 s. ORP letter (index floor(0.35 × length)) accent, centred between two short accent ticks; the part before right-aligned to it, the part after left-aligned. Size: largest ≤ 40 px (weight 700) keeping every word within ±140 px; two thin frame lines 60 px apart. Loop 4.2 s. Params: tốc độ (300 từ/phút = 0.2 s) · chậm lại (×1.5 sau dấu câu, từ dài) · điểm nhìn (35 %).
-->
