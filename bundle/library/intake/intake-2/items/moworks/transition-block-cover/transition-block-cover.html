<!--
  Staggered Blocks (Moworks Studio, the studio's own, written here).
  Source: Moworks Studio.
  Lưới ô màu bật lên theo đường chéo phủ kín khung, đổi cảnh, rồi các ô thu lại theo cùng thứ tự.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.transitionBlockCover(q(".tk-b"), tl, 1, {});

  Options (defaults in brackets):
      - cols: 8
      - rows: 5
      - stagger: s per diagonal step (0.01)
      - each: s each tile scales (0.25)
      - duration: s (0.8: cover, cut at the middle, clear)
      - color: tile colour
      - from: the outgoing scene

  Notes: 8 x 5 grid of solid accent tiles (each 1/8 x 1/5 of the frame, 1 px overlap). Cover 0-400 ms: tile (col i, row j) starts (i + j) x 10 ms (demo; the recipe says '30 ms stagger'), scale 0 -> 1 about its centre over 250 ms easeOutCubic, frame covered by 360 ms; cut at 400 ms; clear 400-800 ms in the same diagonal order, scale 1 -> 0 easeInCubic. Params: grid (8 × 5) · stagger chéo (10 ms) · duration mỗi ô (0.25 s) · color.
-->

<section class="tk-scene tk-a"><div class="tk-mark circle"></div><div class="tk-sc-text"><div class="tk-sc-letter">A</div><div class="tk-sc-cap">Cảnh mở đầu</div></div></section>
<section class="tk-scene tk-b"><div class="tk-mark square"></div><div class="tk-sc-text"><div class="tk-sc-letter">B</div><div class="tk-sc-cap">Cảnh tiếp theo</div></div></section>

<style>

</style>

<script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.drive = MW.drive || function (tl, at, dur, fn) {
    var s = { t: 0 }; fn(0);
    tl.fromTo(s, { t: 0 }, { t: dur, duration: dur, ease: "none", immediateRender: false, onUpdate: function () { fn(s.t); } }, at);
    return at + dur;
  };
  var defaults = {"cols":8,"rows":5,"stagger":0.01,"each":0.25,"duration":0.8,"color":"#8b7bff","from":null};
  var run = function (el, tl, at, o) {
        var out = o.from ? MW.el(o.from) : el.previousElementSibling, W = el.offsetWidth, H = el.offsetHeight, cw = W / o.cols, ch = H / o.rows, tiles = [];
        var grid = document.createElement("div"); grid.style.cssText = "position:absolute;inset:0;pointer-events:none;z-index:5;"; el.parentNode.appendChild(grid);
        for (var j = 0; j < o.rows; j++) for (var i = 0; i < o.cols; i++) {
          var d = document.createElement("div"); d.style.cssText = "position:absolute;left:" + (i * cw - 0.5) + "px;top:" + (j * ch - 0.5) + "px;width:" + (cw + 1) + "px;height:" + (ch + 1) + "px;background:" + o.color + ";transform:scale(0);";
          grid.appendChild(d); tiles.push({ d: d, k: i + j });
        }
        var fin = gsap.parseEase("power2.out"), fout = gsap.parseEase("power2.in"), half = o.duration / 2;
        return MW.drive(tl, at, o.duration, function (t) {
          tiles.forEach(function (x) {
            var s0 = x.k * o.stagger, s;
            if (t < half) s = fin(Math.max(0, Math.min(1, (t - s0) / o.each)));
            else s = 1 - fout(Math.max(0, Math.min(1, (t - half - s0) / o.each)));
            x.d.style.transform = "scale(" + s + ")";
          });
          grid.style.visibility = t > 0 && t < o.duration ? "visible" : "hidden";
          el.style.visibility = t >= half ? "visible" : "hidden"; if (out) out.style.visibility = t >= half ? "hidden" : "visible";
        });
      };
  MW.transitionBlockCover = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
</script>
