  Sticky Shrinking Headline (Moworks Studio, the studio's own, written here).
  Source: Moworks Studio.
  Tiêu đề rất to chiếm cả trang thu nhỏ dần về góc trên bên trái và nằm gọn trong thanh đầu trang khi nội dung cuộn lên.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.textStickyShrink(q(".ss-h"), tl, 0, { rows: ".ss-rows", slot: ".ss-slot" });

  Options (defaults in brackets):
      - scale: end scale (0.15)
      - maxWidth: px it may span in the header (800)
      - inset: [x, y] px of its spot in the header ([60, 30])
      - rows: the page rows that scroll up
      - scroll: px (450)
      - slot: the dashed slot outline

  Notes: Page frame 292 × 168 px (radius 6) with a 24 px header bar (three small pills on its right). Headline 110 px, left-aligned, up to 2 lines. Over 0.4–1.8 s (cubic-bezier .65,0,.35,1) it scales 1 → the size that fits the header (≈0.15, ≤160 px wide) with origin top-left, while its top-left moves to the header's inset (12, 6 px); a dashed slot outline fades in there; placeholder rows scroll up 90 px. Return 2.9–3.5 s. Loop 3.8 s. Params: tỉ lệ cuối (0.15) · thời gian (1.4 s) · gốc (trên trái).
-->
