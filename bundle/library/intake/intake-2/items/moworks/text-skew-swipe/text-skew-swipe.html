<!--
  Skew Swipe (Moworks Studio, the studio's own, written here).
  Source: Moworks Studio.
  Từ cũ nghiêng và vụt sang trái, từ mới lao vào từ phải còn nghiêng rồi đứng thẳng trong 6 khung cuối.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.textSkewSwipe(q(".ssw"), tl, 0, {});

  Options (defaults in brackets):
      - a: first word
      - b: second word
      - skew: degrees (20)
      - out: px the old word leaves (1200)
      - in: px the new comes from (880)
      - at: s (0.5)
      - backAt: s (2.0)
      - accent: speed line colour

  Notes: Old word: x 0 → −300 px, skewX 0 → −20°, opacity → 0 (demo 0.4), 0.3 s ease-in (power3.in, CSS cubic-bezier(.55,0,1,.45)). New word overlaps by 0.18 s: from x +220 px, skewX −20°, opacity 0 → x 0, opacity 1 in 0.4 s expo.out (cubic-bezier(.16,1,.3,1)); the skew holds until the last 0.2 s (6 frames) and settles −20° → 0 power2.out. Demo adds 4 speed lines behind the incoming word while it moves fast; swaps at 0.5 s and 2.0 s; loop 3.4 s. Params: to: từ mới · skew (20°) · out / in: quãng ra / vào (300 / 220 px) · duration vào (0.4 s, expo.out).
-->

<div class="sw"><div class="ssw" style="position:relative;font-size:220px;font-weight:900;width:1200px;height:280px"><span class="ss-a" style="position:absolute;left:0;right:0;text-align:center">NHANH</span><span class="ss-b" style="position:absolute;left:0;right:0;text-align:center;color:#a99bff;opacity:0">GỌN</span></div></div>

</style>

<script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.drive = MW.drive || function (tl, at, dur, fn) {
    var s = { t: 0 }; fn(0);
    tl.fromTo(s, { t: 0 }, { t: dur, duration: dur, ease: "none", immediateRender: false, onUpdate: function () { fn(s.t); } }, at);
    return at + dur;
  };
  var defaults = {"a":".ss-a","b":".ss-b","skew":20,"out":1200,"in":880,"at":0.5,"backAt":2,"accent":"#a99bff"};
  var run = function (el,tl,at,o
  ) {
  var seg = typeof Intl !== "undefined" && Intl.Segmenter ? new Intl.Segmenter("vi", { granularity: "grapheme" }) : null;
  var gr = function (s) { s = String(s).normalize("NFC"); if (!seg) return Array.from(s); var out = [], it = seg.segment(s)[Symbol.iterator](), r; while (!(r = it.next()).done) out.push(r.value.segment); return out; };
  var a = el.querySelector(o.a), b = el.querySelector(o.b), p3 = gsap.parseEase("power3.in"), ex = gsap.parseEase("expo.out"), p2 = gsap.parseEase("power2.out"), lines = [];
  for (var i = 0; i < 4; i++) { var l = document.createElement("span"); l.style.cssText = "position:absolute;height:8px;border-radius:4px;background:" + o.accent + ";opacity:0;pointer-events:none;"; el.appendChild(l); lines.push(l); }
  var swap = function (outEl, inEl, t0, t) {
    var u = Math.max(0, Math.min(1, (t - t0) / 0.3)), e = p3(u); gsap.set(outEl, { x: -o.out * e, skewX: -o.skew * e }); outEl.style.opacity = String(t < t0 ? 1 : 1 - e);
    var t1 = t0 + 0.3 - 0.18, v = Math.max(0, Math.min(1, (t - t1) / 0.4)), x = o.in * (1 - ex(v)), sk = v < 0.5 ? -o.skew : -o.skew * (1 - p2((v - 0.5) / 0.5));
    gsap.set(inEl, { x: x, skewX: t < t1 ? -o.skew : sk }); inEl.style.opacity = String(t < t1 ? 0 : Math.min(1, v * 3));
    return [v, x, inEl];
  };
  return MW.drive(tl, at, o.backAt + 1, function (t) {
    var s = t < o.backAt ? swap(a, b, o.at, t) : swap(b, a, o.backAt, t);
    var v = s[0], fast = v > 0 && v < 0.45;
    lines.forEach(function (l, i) { l.style.opacity = fast ? String(0.7 * (1 - v / 0.45)) : "0"; l.style.width = (120 + 60 * i) + "px"; l.style.left = (s[2].offsetLeft + s[2].offsetWidth + s[1] * 0.5 + 30) + "px"; l.style.top = (s[2].offsetTop + s[2].offsetHeight * (0.25 + 0.17 * i)) + "px"; });
  });
  };
  MW.textSkewSwipe = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
</script>
