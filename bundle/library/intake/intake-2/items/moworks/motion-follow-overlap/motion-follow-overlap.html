<!--
  Follow-through & Overlap (Moworks Studio, the studio's own, written here).
  Source: Moworks Studio.
  Thẻ rơi vào bằng lò xo, bóng đổ, tiêu đề và hai dòng chữ đáp xuống trễ dần 50–140 ms.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.motionFollowOverlap(q(".fo-c"), tl, 0.3, { shadow: ".fo-sh", exitAt: 1.9 });

  Options (defaults in brackets):
      - k: spring stiffness (170)
      - c: damping (18): about 5 % overshoot
      - y: px it drops from (−240)
      - parts: [[selector, delay s], ...] inside the card
      - shadow: its shadow
      - shadowDelay: s (0.05)
      - exitAt: s after the start to leave (null)
      - rise: px up on the way out (120)
      - exit: s (0.3)

  Notes: Card drops in y −60 → 0 px on a spring (k 170, c 18: 5 % overshoot, ~500 ms); its shadow lands 50 ms later, title bar 60 ms, two text lines 100 / 140 ms, all on the same spring (recipe: parent 600 ms power2.out, shadow +40, title +80, subtitle +120 ms). Exit: all rise 30 px and fade, 300 ms. Params: spring (k 170, c 18) · y (−60 px) · delays (50 / 60 / 100 / 140 ms).
-->

<div class="ui-wrap"><div class="fo"><div class="fo-sh"></div><div class="ui-card fo-c"><div class="fo-t">Lịch quay tuần này</div><div class="fo-l1">Thứ hai: phỏng vấn khách mời</div><div class="fo-l2">Thứ tư: quay cảnh ngoài trời</div></div></div></div>

<script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.spring = MW.spring || function (stiffness, damping, mass, from, to) {
    var k = stiffness || 100, c = damping == null ? 10 : damping, m = mass || 1, w0 = Math.sqrt(k / m), z = c / (2 * Math.sqrt(k * m));
    var x = function (t) {
      if (z < 1) { var wd = w0 * Math.sqrt(1 - z * z); return 1 - Math.exp(-z * w0 * t) * (Math.cos(wd * t) + (z * w0 / wd) * Math.sin(wd * t)); }
      if (z === 1) return 1 - Math.exp(-w0 * t) * (1 + w0 * t);
      var q = Math.sqrt(z * z - 1), r1 = -w0 * (z - q), r2 = -w0 * (z + q), A = r2 / (r2 - r1), B = -r1 / (r2 - r1);
      return 1 - (A * Math.exp(r1 * t) + B * Math.exp(r2 * t));
    };
    var T = 0, dt = 1 / 240; for (var t = 0; t < 30; t += dt) if (Math.abs(1 - x(t)) > 0.001) T = t;
    T = Math.max(dt, T + dt);
    return { duration: T, ease: function (p) { return p >= 1 ? 1 : x(p * T); }, at: x };
  };
  MW.springDB = MW.springDB || function (duration, bounce) {
    var z = 1 - (bounce == null ? 0.25 : bounce), w = Math.log(1000) / (Math.max(0.05, z) * (duration || 0.8));
    return MW.spring(w * w, 2 * z * w, 1);
  };
  MW.drive = MW.drive || function (tl, at, dur, fn) {
    var s = { t: 0 }; fn(0);
    tl.fromTo(s, { t: 0 }, { t: dur, duration: dur, ease: "none", immediateRender: false, onUpdate: function () { fn(s.t); } }, at);
    return at + dur;
  };
  var defaults = {"k":170,"c":18,"y":-240,"parts":[[".fo-t",0.06],[".fo-l1",0.1],[".fo-l2",0.14]],"shadow":null,"shadowDelay":0.05,"exitAt":null,"rise":120,"exit":0.3};
  var run = function (el, tl, at, o) {
        var sp = MW.spring(o.k, o.c), host = el.parentNode, sh = o.shadow ? host.querySelector(o.shadow) : null, parts = o.parts.map(function (p) { return [el.querySelector(p[0]), p[1]]; }).filter(function (p) { return p[0]; });
        var Y = function (t) { return o.y * (1 - (t > 0 ? sp.at(t) : 0)); }, end = sp.duration + Math.max.apply(null, o.parts.map(function (p) { return p[1]; }).concat([o.shadowDelay]));
        return MW.drive(tl, at, o.exitAt == null ? end : o.exitAt + o.exit, function (t) {
          var x = o.exitAt != null && t > o.exitAt ? Math.min(1, (t - o.exitAt) / o.exit) : 0, lift = -o.rise * gsap.parseEase("power2.in")(x), y = Y(t);
          gsap.set(el, { y: y + lift }); el.style.opacity = String(Math.min(1, t / 0.12) * (1 - x));
          parts.forEach(function (p) { gsap.set(p[0], { y: Y(t - p[1]) - y }); });
          if (sh) { var v = t - o.shadowDelay > 0 ? sp.at(t - o.shadowDelay) : 0; gsap.set(sh, { scaleX: 0.6 + 0.4 * v }); sh.style.opacity = String(Math.min(1, v) * (1 - x)); }
        });
      };
  MW.motionFollowOverlap = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
</script>
