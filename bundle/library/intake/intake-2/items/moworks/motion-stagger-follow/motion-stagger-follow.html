<!--
  Stagger Follow (Moworks Studio, the studio's own, written here).
  Source: Moworks Studio.
  Bốn viên thuốc cùng trượt 165 px, mỗi lớp trễ 55 ms và nhạt dần, như một dòng chảy.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.motionStaggerFollow(q(".sfl"), tl, 0.3, { backAt: 1.6 });

  Options (defaults in brackets):
      - items: 
      - x: px (1140)
      - duration: s each (0.9, power2.out)
      - stagger: s (0.055)
      - backAt: s after the start to return (null, 0.55 s power2.in)

  Notes: Four pills (50×18) in rows: x 0 → 165 px (demo 190) in 900 ms power2.out each, 55 ms apart; row opacities 1 / 0.72 / 0.5 / 0.32. Return: same stagger, 550 ms power2.in back to the start. Params: duration (0.9 s) · x (165 px) · stagger (55 ms) · ease (power2.out).
-->

<div class="sfl"><i></i><i style="opacity:.72"></i><i style="opacity:.5"></i><i style="opacity:.32"></i></div>

<style>

</style>

<script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.drive = MW.drive || function (tl, at, dur, fn) {
    var s = { t: 0 }; fn(0);
    tl.fromTo(s, { t: 0 }, { t: dur, duration: dur, ease: "none", immediateRender: false, onUpdate: function () { fn(s.t); } }, at);
    return at + dur;
  };
  var defaults = {"items":"i","x":1140,"duration":0.9,"stagger":0.055,"backAt":null};
  var run = function (el, tl, at, o) {
        var it = Array.prototype.slice.call(el.querySelectorAll(o.items)), p2 = gsap.parseEase("power2.out"), pin = gsap.parseEase("power2.in");
        return MW.drive(tl, at, o.backAt == null ? (it.length - 1) * o.stagger + o.duration : o.backAt + (it.length - 1) * o.stagger + 0.55, function (t) { it.forEach(function (x, i) { var u = p2(Math.max(0, Math.min(1, (t - i * o.stagger) / o.duration))); if (o.backAt != null && t > o.backAt) u = 1 - pin(Math.max(0, Math.min(1, (t - o.backAt - i * o.stagger) / 0.55))); gsap.set(x, { x: o.x * u }); }); });
      };
  MW.motionStaggerFollow = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
</script>
