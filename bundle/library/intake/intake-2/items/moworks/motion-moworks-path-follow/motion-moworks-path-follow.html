  Source: Moworks Studio.
  Mũi tên chạy dọc đường cong và luôn xoay theo tiếp tuyến, phần đường đã đi hiện màu.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.motionMoworksPathFollow(q(".pf"), tl, 0.3, {});

  Options (defaults in brackets):
      - to: [x, y] px ([1080, 0])
      - control: [x, y] px ([540, −840])
      - duration: s (1.0)
      - ease: (sine.inOut)
      - rotate: turn with the tangent
      - trail: an SVG path on the same curve that draws behind it
      - hold: s (0.6)

  Notes: Arrow rides an arc and turns to its tangent (θ = atan2(dy, dx) from the same progress). Recipe: 1000 ms sine.inOut, x 0 → 90 → 180, y 0 → −70 → 0, rotation −28° → 0 → +28°. Small demo: the steeper arc of arc-travel (−50° → +50°) at constant speed in 2200 ms; the travelled part draws as a 2 px accent line, the rest dashed. Params: duration (1 s) · path: đường SVG · rotate: xoay theo hướng (true) · ease (sine.inOut).
-->
