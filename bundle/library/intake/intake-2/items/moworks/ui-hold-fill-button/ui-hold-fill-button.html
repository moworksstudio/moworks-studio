    MW.uiHoldFillButton(q(".hf"), tl, 0, { cursor: ".ui-cursor" });

      - hold: s to fill, linear (1.2)

      - presses: [[s down, s up], ...]
      - resetAt: s it fades back (3.55)
      - accent: 
      - ink: label colour in the fill
      - label: the label
      - hint: a line shown after an early release
      - bar: a thin bar that mirrors the fill
      - doneText: 
      - cursor: an optional cursor that makes the clicks
      - approach: [x, y] px the cursor comes from
      - lead: s it arrives before a click
