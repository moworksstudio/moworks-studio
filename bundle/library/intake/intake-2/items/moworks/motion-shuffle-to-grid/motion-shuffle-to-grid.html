<!--
  Shuffle to Grid (Moworks Studio, the studio's own, written here).
  Source: Moworks Studio.
  Các ô đang nằm lộn xộn, xoay lệch và nhỏ đi, lần lượt bay về đúng lưới thẳng hàng.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.motionShuffleToGrid(q(".sg"), tl, 0.3, { backAt: 1.9 });

  Options (defaults in brackets):
      - items: 
      - scatter: ± px (96)
      - rot: ± degrees (18)
      - from: start scale (0.72)
      - stagger: s in reading order (0.035)
      - duration: s (0.72, back.inOut)
      - backAt: s after the start to scatter again (null)
      - seed: (23)
      - cols: 

  Notes: 3×3 tiles (34 px, 10 px gap) start scattered: each offset by a seeded uniform random up to ±24 px in x and y (recipe ±26), rotated up to ±18°, scale 0.72 (seed 23); they settle into the grid (0°, scale 1) in 720 ms back.inOut, each 35 ms after the previous in reading order (≈1 s in all). Reverse to scatter: all at once in 400 ms power2.inOut. Params: scatter: độ lệch (24 px) · rot (18°) · scale đầu (0.72) · stagger (35 ms) · seed.
-->
