<!--
  Soft Gradient Mask Wipe (Moworks Studio, the studio's own, written here).
  Source: Moworks Studio.
  Chữ hiện dần từ trái sang qua một mép mặt nạ mềm rộng 70 px; khi rời cảnh, mép mềm quét tiếp cùng chiều làm chữ biến mất.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.textSoftMaskWipe(q(".tk-head"), tl, 0.3, { exit: 2.5 });

  Options (defaults in brackets):
      - duration: s (1.2), ease-out cubic
      - feather: px of the soft edge (240; 70 in the small demo)
      - exit: s after the start when a second edge hides it left to right (1.2 s ease-in-out; null: stay)

  Notes: Text masked by a linear gradient (opaque → transparent; demo soft edge 70 px; CSS stops 40 % → 60 % of a mask 250 % wide, so the soft band is half the text width). The edge moves from left of the text to past its right edge (mask-position 100 % → 0) over 1.2 s easeOutCubic (power2.out), revealing left → right. Exit: a second edge follows the same way, hiding left → right, 1.2 s easeInOutCubic (demo 2.8–4.0 s). Demo in 0.3–1.5 s; loop 4.2 s. Params: duration (1.2 s) · feather: độ mềm mép (70 px) · ease (easeOutCubic) · exit (1.2 s).
-->

<div class="tk-stage"><div><h1 class="tk-head ">Hiện dần qua mép mềm</h1></div></div>

<style>

</style>

<script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.drive = MW.drive || function (tl, at, dur, fn) {
    var s = { t: 0 }; fn(0);
    tl.fromTo(s, { t: 0 }, { t: dur, duration: dur, ease: "none", immediateRender: false, onUpdate: function () { fn(s.t); } }, at);
    return at + dur;
  };
  var defaults = {"duration":1.2,"feather":240,"exit":null};
  var run = function (el, tl, at, o) {
        var out = gsap.parseEase("power2.out"), io = gsap.parseEase("power2.inOut"), F = o.feather;
        var end = o.exit == null ? o.duration : o.exit + o.duration;
        return MW.drive(tl, at, end, function (t) {
          var W = el.offsetWidth, m;
          if (o.exit == null || t < o.exit) { var e = -F + (W + 2 * F) * out(Math.min(1, t / o.duration)); m = "linear-gradient(90deg, #000 " + (e - F / 2) + "px, transparent " + (e + F / 2) + "px)"; }
          else { var x = -F + (W + 2 * F) * io(Math.min(1, (t - o.exit) / o.duration)); m = "linear-gradient(90deg, transparent " + (x - F / 2) + "px, #000 " + (x + F / 2) + "px)"; }
          el.style.webkitMaskImage = m; el.style.maskImage = m;
        });
      };
  MW.textSoftMaskWipe = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
</script>
