<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Combo Heat Escalation - Demo</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
:root { --bg: #09090b; --fg: #fafafa; --card: #111114; --line: #27272a; }
* { box-sizing: border-box; }
html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); }
#demo { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); color: var(--fg); font-family: Inter, sans-serif; }
.center { position: absolute; inset: 0; display: grid; place-items: center; }
.row { display: flex; align-items: center; justify-content: center; gap: 48px; }
.col { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 32px; }
.h1 { font-size: 132px; font-weight: 800; letter-spacing: -0.035em; line-height: 1.1; text-align: center; }
.h2 { font-size: 84px; font-weight: 700; letter-spacing: -0.025em; line-height: 1.15; text-align: center; }
.p { font-size: 40px; line-height: 1.4; opacity: 0.72; text-align: center; }
.card { position: relative; border-radius: 28px; background: var(--card); border: 2px solid var(--line); overflow: hidden; }
.muted { opacity: 0.6; }

#demo { background: radial-gradient(100% 100% at 50% 40%, #1a1f33, #0b0d12); color: #e8ebf3; font-family: Inter, sans-serif; }
.cb { position: absolute; left: 460px; top: 230px; width: 1000px; }
.cnum { font-size: 260px; font-weight: 900; line-height: 1; text-align: center; transform-origin: 50% 60%; } .chit { font-size: 64px; font-weight: 800; letter-spacing: 0.1em; text-align: center; color: #8f9ab3; margin-bottom: 50px; }
.cg { position: relative; height: 60px; border-radius: 30px; background: #1d2234; overflow: hidden; } .cbar { position: absolute; left: 0; top: 0; bottom: 0; width: 0; border-radius: 30px; }
.cg i { position: absolute; top: 0; bottom: 0; width: 6px; background: #0b0d12; } .cls { display: flex; justify-content: space-around; margin-top: 26px; font-size: 40px; font-weight: 800; letter-spacing: 0.08em; }
.csp { position: absolute; right: 40px; top: 380px; width: 300px; height: 10px; } .csp b { position: absolute; bottom: 0; width: 12px; height: 12px; border-radius: 50%; background: #ffd23d; box-shadow: 0 0 14px #ffb547; }
    </style>
  </head>
  <body>
    <div id="demo" data-composition-id="mw-demo" data-start="0" data-width="1920" data-height="1080" data-duration="4">
<div class="cb"><div class="cnum">1</div><div class="chit">HIT</div><div class="cg"><div class="cbar"></div><i style="left:33.3%"></i><i style="left:66.6%"></i></div>
<div class="cls"><span class="cst">LẠNH</span><span class="cst">ẤM</span><span class="cst">NÓNG</span></div><div class="csp"><b style="left:0px"></b><b style="left:30px"></b><b style="left:60px"></b><b style="left:90px"></b><b style="left:120px"></b><b style="left:150px"></b><b style="left:180px"></b><b style="left:210px"></b><b style="left:240px"></b><b style="left:270px"></b></div></div>
      <script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.spring = MW.spring || function (stiffness, damping, mass, from, to) {
    var k = stiffness || 100, c = damping == null ? 10 : damping, m = mass || 1, w0 = Math.sqrt(k / m), z = c / (2 * Math.sqrt(k * m));
    var x = function (t) {
      if (z < 1) { var wd = w0 * Math.sqrt(1 - z * z); return 1 - Math.exp(-z * w0 * t) * (Math.cos(wd * t) + (z * w0 / wd) * Math.sin(wd * t)); }
      if (z === 1) return 1 - Math.exp(-w0 * t) * (1 + w0 * t);
      var q = Math.sqrt(z * z - 1), r1 = -w0 * (z - q), r2 = -w0 * (z + q), A = r2 / (r2 - r1), B = -r1 / (r2 - r1);
      return 1 - (A * Math.exp(r1 * t) + B * Math.exp(r2 * t));
    };
    var T = 0, dt = 1 / 240; for (var t = 0; t < 30; t += dt) if (Math.abs(1 - x(t)) > 0.001) T = t;
    T = Math.max(dt, T + dt);
    return { duration: T, ease: function (p) { return p >= 1 ? 1 : x(p * T); }, at: x };
  };
  MW.springDB = MW.springDB || function (duration, bounce) {
    var z = 1 - (bounce == null ? 0.25 : bounce), w = Math.log(1000) / (Math.max(0.05, z) * (duration || 0.8));
    return MW.spring(w * w, 2 * z * w, 1);
  };
  MW.drive = MW.drive || function (tl, at, dur, fn) {
    var s = { t: 0 }; fn(0);
    tl.fromTo(s, { t: 0 }, { t: dur, duration: dur, ease: "none", immediateRender: false, onUpdate: function () { fn(s.t); } }, at);
    return at + dur;
  };
  var defaults = {"hits":[0.35,0.8,1.15,1.45,1.7,1.9],"resetAt":3.4};
  var run = function (el, tl, at, o) {
        var num = el.querySelector(".cnum"), bar = el.querySelector(".cbar"), labs = el.querySelectorAll(".cst"), sparks = el.querySelector(".csp"), sp = MW.spring(260, 22), cols = ["#3dd6f5", "#ffd23d", "#8b7bff"];
        var stage = function (n) { return n <= 2 ? 0 : n <= 4 ? 1 : 2; };
        return MW.drive(tl, at, o.resetAt + 0.6, function (t) {
          var n = 0, g = 0, last = -1;
          o.hits.forEach(function (h, i) { if (t >= h) { n = i + 1; last = h; g += (1 / o.hits.length) * sp.at(t - h); } });
          if (t >= o.resetAt) g *= 1 - sp.at(t - o.resetAt);
          var pop = last >= 0 ? 1 + 0.35 * Math.exp(-12 * (t - last)) * Math.cos(20 * (t - last)) : 1, st = stage(n), prev = stage(Math.max(0, n - 1));
          var mix = last >= 0 ? Math.min(1, (t - last) / 0.15) : 1, col = gsap.utils.interpolate(cols[prev], cols[st], st !== prev ? mix : 1);
          num.firstChild.nodeValue = String(Math.max(1, n)); gsap.set(num, { scale: n ? pop : 0.001 }); num.style.color = col; num.style.opacity = t >= o.resetAt ? String(Math.max(0, 1 - (t - o.resetAt) / 0.4)) : n ? "1" : "0";
          bar.style.width = (Math.max(0, g) * 100) + "%"; bar.style.background = col;
          labs.forEach(function (l, i) { l.style.color = n && i === st && t < o.resetAt ? cols[i] : "#4a5270"; });
          sparks.style.opacity = n >= 5 && t < o.resetAt ? "1" : "0";
          Array.prototype.forEach.call(sparks.children, function (s, i) { var ph = (t * 0.9 + i / 10) % 1; gsap.set(s, { y: -150 * ph, opacity: 1 - ph }); });
        });
      };
  MW.uiComboHeatGauge = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
      </script>
      <script>
        (function () {
          var tl = gsap.timeline({ paused: true });
          var q = function (s) { return document.querySelector(s); }, qa = function (s) { return Array.prototype.slice.call(document.querySelectorAll(s)); };
          MW.uiComboHeatGauge(q(".cb"), tl, 0, {});
          tl.set({}, {}, 4);
          // register only when every motion is ready (MW.pending: e.g. a WebGL texture still decoding), as HyperFrames asks of async builds
          var go = function () { window.__timelines = window.__timelines || {}; window.__timelines["mw-demo"] = tl; };
          if (window.MW && MW.pending && MW.pending.length) Promise.all(MW.pending).then(go, go); else go();
        })();
      </script>
    </div>
  </body>
</html>
