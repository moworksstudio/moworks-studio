  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.dataTimelineScrub(q(".gm"), tl, 0, {});

  Notes: Whole line drawn faint (5 points). A marker scrubs along x with linear keys: 650-1550 ms to the 3rd point, hold to 1850, to the end by 2750; the line left of the marker redrawn thick in accent (clip at marker x); dot on the line + value tag; time rail below with a handle at the same x and a dashed drop line. Return 3450-3950 easeInOut. Optional cursor dragging the handle. Params: points (5) · stop: điểm dừng (điểm 3) · duration kéo (2.1 s).
-->

<script>
(function () {
