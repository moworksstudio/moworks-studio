  Quả bóng rơi, nảy hai lần thấp dần, bẹp mỗi lần chạm, rồi hiện dấu tích và một vòng sóng báo xong.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.motionDoubleBounce(q(".db"), tl, 0.3, {});

  Options (defaults in brackets):
      - drop: px (400)
      - heights: px of the two bounces ([220, 100])
      - durations: s of fall, bounce, bounce ([0.287, 0.287, 0.246])
      - squash: at the three contacts ([0.3, 0.18, 0.08])
      - check: a path drawn after the last contact
      - ping: px the ring grows (72)
      - accent: 

  Notes: y −100 → 0 in 287 ms (fall, ease-in), up to −55 and down in 287 ms, up to −25 and down in 246 ms (parabolas), done at 820 ms; squash 30 / 18 / 8 % at the three contacts (scaleX = 1/scaleY, 100 ms triangles, origin bottom). After the last contact a check mark draws inside (260 ms) and a ring pings (+18 px, 480 ms). Params: drop (100 px) · bounces (55 / 25 px) · squash (0.3 / 0.18 / 0.08) · done: dấu tích (bật/tắt).
-->
