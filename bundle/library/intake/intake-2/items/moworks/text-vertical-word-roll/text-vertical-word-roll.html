  Source: Moworks Studio.
  Từ cũ cuộn lên khỏi khung, từ mới cuộn lên thế chỗ cùng lúc, lệch nhau từng ký tự 0.02 giây.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.textVerticalWordRoll(q(".vr"), tl, 0, {});

  Options (defaults in brackets):
      - from: word shown first
      - to: word it rolls to
      - duration: s (0.5), in-out
      - at: s (0.6)
      - backAt: s it rolls back (2.3)

  Notes: Two words stacked in one clip window (one line tall + 0.08 em). At the swap, old chars y 0 → −100 % and new chars +100 % → 0 at the same time, char by char 20 ms apart (capped 0.25 s), 0.5 s easeInOutCubic (labelled power3.inOut). Demo swaps at 0.6 s (A → B) and 2.3 s (B → A); loop 3.6 s. View-transition variant: whole word, 0.4 s cubic-bezier(.65,0,.35,1) with a fade. Params: to: từ mới · duration (0.5 s) · stagger (0.02 s) · ease (easeInOutCubic).
-->
