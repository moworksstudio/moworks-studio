<!--
  Staggered List (Moworks Studio, the studio's own, written here).
  Source: Moworks Studio.
  Bốn dòng trượt từ trái vào và hiện dần, mỗi dòng trễ 70 ms.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.motionListStagger(q(".ls"), tl, 0.3, { exitAt: 1.7 });

  Options (defaults in brackets):
      - items: 
      - from: px (−96)
      - duration: s per row (0.55, power2.out)
      - stagger: s (0.07)
      - exitAt: s after the start to fade all (null)
      - cols: 

  Notes: Four rows (172×24, 30 px pitch): x −24 → 0 px and opacity 0 → 1, each 550 ms power2.out, 70 ms apart (760 ms in all — the recipe's 760 ms is the total). Exit: all fade 200 ms power2.in. Params: from (−24 px) · each: thời gian mỗi dòng (0.55 s) · stagger (70 ms) · ease (power2.out).
-->

<div class="st"><div class="ls"><div class="rw"><i></i><b style="width:62%"></b></div><div class="rw"><i></i><b style="width:48%"></b></div><div class="rw"><i></i><b style="width:70%"></b></div><div class="rw"><i></i><b style="width:54%"></b></div></div></div>

<script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.drive = MW.drive || function (tl, at, dur, fn) {
    var s = { t: 0 }; fn(0);
    tl.fromTo(s, { t: 0 }, { t: dur, duration: dur, ease: "none", immediateRender: false, onUpdate: function () { fn(s.t); } }, at);
    return at + dur;
  };
  var defaults = {"items":".rw","from":-96,"duration":0.55,"stagger":0.07,"exitAt":null,"cols":0};
  var run = function (el,tl,at,o
  ) {
  var it = Array.prototype.slice.call(el.querySelectorAll(o.items)), n = it.length, cols = o.cols || n;
  var p2 = gsap.parseEase("power2.out"), pin = gsap.parseEase("power2.in");
  return MW.drive(tl, at, o.exitAt == null ? (n - 1) * o.stagger + o.duration : o.exitAt + 0.2, function (t) { var x = o.exitAt != null ? pin(Math.max(0, Math.min(1, (t - o.exitAt) / 0.2))) : 0; it.forEach(function (r, i) { var u = p2(Math.max(0, Math.min(1, (t - i * o.stagger) / o.duration))); gsap.set(r, { x: o.from * (1 - u) }); r.style.opacity = String(u * (1 - x)); }); });
  };
  MW.motionListStagger = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
</script>
