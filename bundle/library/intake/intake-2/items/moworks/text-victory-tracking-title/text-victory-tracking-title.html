  Victory Title (Moworks Studio, the studio's own, written here).
  Source: Moworks Studio.
  Chữ chiến thắng hiện ra với khoảng cách chữ rất rộng rồi khép về giữa, gạch chân mọc từ giữa, dòng phụ hiện bên dưới và vài tia sao bay lên; giữ yên khá lâu rồi mờ ra.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.textVictoryTrackingTitle(q(".vt h1"), tl, 0, { sub: ".vt p" });

  Options (defaults in brackets):
      - from: letter spacing at the start, × (2.6), closing in 0.7 s expo.out
      - rule: px each side (550)
      - color: rule colour
      - sub: the subtitle (fades in 1.1-1.4 s)
      - outAt: s (2.45)
      - seed: sparkles

  Notes: px @320x200. Letters (42 px, accent) start at 2.6× their spacing from the centre and close to 1× in 700 ms outExpo (0.25-0.95 s), opacity = min(1, 1.6p). Rule grows from the centre to ±110 px (400 ms outExpo at 0.85 s). Subtitle fades in 1.1-1.4 s. 16 seeded four-point sparkles rise 40-90 px from the rule (start 0.95-1.2 s, life 0.9-1.3 s, outCubic), fading. Holds ~1.4 s; out 2.45-2.7 s in-cubic. Params: from: giãn đầu (×2.6) · duration: thời gian khép (0.7 s) · rule: gạch chân (±110 px) · sparkles: số tia sao (16) · outAt: lúc ra (2.45 s).
-->
