<!--
  Film Grain (Moworks Studio, the studio's own, written here).
  Source: Moworks Studio.
  Một lớp nhiễu rất mờ đổi mẫu mỗi khung hình phủ lên hình, xoá cảm giác phẳng của đồ hoạ số.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.effectFilmGrainFlicker(q(".pic"), tl, 0, {});

  Options (defaults in brackets):
      - opacity: (0.25 in the demo; 0.05–0.1 in a film)
      - count: specks per 320 × 200 (900)
      - max: specks at most (20000)
      - size: px (4)
      - fps: new grain a second (24)
      - seed: (3)
      - loop: s (3)

  Notes: New noise every frame at 24 fps (~42 ms), 7 % opacity (5-10 %). Demo: 900 specks 1.4 px, half white half black, at 25 % opacity, re-seeded every 1/24 s over the art. Params: opacity (7 %) · fps (24) · size: cỡ hạt.
-->

<div class="st"><div class="pic"></div></div>

<script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.rand = MW.rand || function (seed) {
    var a = typeof seed === "string" ? MW.hash(seed) : (seed >>> 0) || 1;
    return function () { a = (a + 0x6d2b79f5) >>> 0; var t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  };
  MW.hash = MW.hash || function (s) { var h = 2166136261; s = String(s); for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; };
  MW.drive = MW.drive || function (tl, at, dur, fn) {
    var s = { t: 0 }; fn(0);
    tl.fromTo(s, { t: 0 }, { t: dur, duration: dur, ease: "none", immediateRender: false, onUpdate: function () { fn(s.t); } }, at);
    return at + dur;
  };
  var defaults = {"opacity":0.25,"count":900,"max":20000,"size":4,"fps":24,"seed":3,"loop":3};
  var run = function (el, tl, at, o) {
        if (getComputedStyle(el).position === "static") el.style.position = "relative"; var cv = document.createElement("canvas"), W = el.clientWidth, Hh = el.clientHeight; cv.width = W; cv.height = Hh; cv.style.cssText = "position:absolute;inset:0;pointer-events:none;"; el.appendChild(cv);
        var c = cv.getContext("2d"), n = Math.min(o.max, Math.round(o.count * W * Hh / 64000));
        return MW.drive(tl, at, o.loop, function (t) { var r = MW.rand(o.seed + Math.floor(t * o.fps)); c.clearRect(0, 0, W, Hh); c.globalAlpha = o.opacity; for (var i = 0; i < n; i++) { c.fillStyle = i % 2 ? "#fff" : "#000"; c.fillRect(r() * W, r() * Hh, o.size, o.size); } c.globalAlpha = 1; });
      };

    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
