  Con trỏ nhấn giữ, thẻ nhấc lên phóng nhẹ 1.045 và bóng đổ sâu hơn, được kéo đi rồi thả về, đặt xuống trong 0.18 s.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.motionDragLift(q(".gm"), tl, 0, {});

  Options (defaults in brackets):
      - tile: index of the tile picked up (1)
      - grab: s (0.5, spring k420 c30)
      - release: s (1.8, 0.18 s power2.out)
      - loop: s (2.6)

  Notes: Grid card 240x140 with six tiles 60x48 r10 (74 / 62 px pitch); the accent tile is grabbed at 0.5 s: lift L = spring(k420, c30): scale 1 + 0.045 L, shadow blur 8 → 28 px, offset y 2 → 12 px, opacity 0.55 → 0.7; a dashed ghost stays at its slot. Held, it is dragged +26, −10 px (0.6-1.05 s power2.inOut) and back (1.05-1.55 s). Release at 1.8 s: L → 0 over 180 ms power2.out. Params: lift (1.045) · shadow (8 → 28 px) · spring (k420 c30) · settle (0.18 s). Lifted: scale 1 + 0.045 L, shadow blur 8 → 28, offset 2 → 12; a dashed ghost keeps its slot.
-->
