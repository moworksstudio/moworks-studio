<!--
  Outline To Fill Sweep (Moworks Studio, the studio's own, written here).
  Source: Moworks Studio.
  Chữ hiện bằng nét viền trước, sau đó phần ruột được tô đặc quét từ trái sang phải trong 1 giây.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.textOutlineFillSweep(q(".tk-head"), tl, 0.2, { exit: 2.9 });

  Options (defaults in brackets):
      - stroke: px of the outline (4)
      - delay: s from the outline's start to the fill (0.7)
      - duration: s of the fill sweep (1)
      - ease: css-in-out, cubic-bezier(.42,0,.58,1)
      - line: px of the accent edge line (4)
      - color: edge colour
      - exit: s after the start: the fill wipes off left to right in 0.6 s, then the outline fades (null: stay)

  Notes: Outline copy (transparent fill, stroke min(2 px, 0.035 em)) fades in and its stroke grows over 0.5 s (demo 0.2–0.7 s), staying on top. The filled copy underneath is revealed by clip inset(right 100 % → 0) over 1 s ease-in-out (CSS (.42,0,.58,1); demo (.65,0,.35,1)), starting 0.7 s after the outline (CSS delay 0.3 s); a 2 px accent line marks the sweep edge. Exit: the fill wipes off left → right (0.6 s), then the outline fades. Loop 4.2 s. Params: stroke: nét viền (2 px) · delay: tô sau viền (0.7 s) · duration: quét tô (1 s) · ease (ease-in-out).
-->

<div class="tk-stage"><div><h1 class="tk-head ">Viền trước, ruột sau</h1></div></div>

<style>

</style>

<script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.bezier = MW.bezier || function (x1, y1, x2, y2) {
    var cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx, cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
    var X = function (t) { return ((ax * t + bx) * t + cx) * t; }, Y = function (t) { return ((ay * t + by) * t + cy) * t; }, dX = function (t) { return (3 * ax * t + 2 * bx) * t + cx; };
    return function (p) {
      if (p <= 0) return 0; if (p >= 1) return 1;
      var t = p, i, d;
      for (i = 0; i < 8; i++) { d = X(t) - p; if (Math.abs(d) < 1e-6) return Y(t); var s = dX(t); if (Math.abs(s) < 1e-6) break; t -= d / s; }
      var lo = 0, hi = 1; t = p;
      for (i = 0; i < 40; i++) { d = X(t); if (Math.abs(d - p) < 1e-6) break; if (d < p) lo = t; else hi = t; t = (lo + hi) / 2; }
      return Y(t);
    };
  };
  MW.CSS_EASE = { ease: [0.25, 0.1, 0.25, 1], easeIn: [0.42, 0, 1, 1], easeOut: [0, 0, 0.58, 1], easeInOut: [0.42, 0, 0.58, 1] };
  MW.EASES = MW.EASES || { "css-ease": [0.25, 0.1, 0.25, 1], "css-in": [0.42, 0, 1, 1], "css-out": [0, 0, 0.58, 1], "css-in-out": [0.42, 0, 0.58, 1],
    md3: [0.2, 0, 0, 1], "md3-emph": [0.05, 0.7, 0.1, 1], "md3-acc": [0.3, 0, 1, 1], "md3-dec": [0, 0, 0, 1], whip: [0.9, 0, 0.1, 1], glide: [0.4, 0, 0.2, 1],
    house: [0.83, 0, 0.17, 1], "in-out": [0.65, 0, 0.35, 1] };
  MW.ez = MW.ez || function (name) {
    if (typeof name === "function") return name;
    var b = MW.EASES[name]; if (b) return MW.bezier(b[0], b[1], b[2], b[3]);
    var m = /^cubic-bezier\(([^)]+)\)$/.exec(name || ""); if (m) { var v = m[1].split(",").map(Number); return MW.bezier(v[0], v[1], v[2], v[3]); }
    return gsap.parseEase(name || "none");
  };
  MW.drive = MW.drive || function (tl, at, dur, fn) {
    var s = { t: 0 }; fn(0);
    tl.fromTo(s, { t: 0 }, { t: dur, duration: dur, ease: "none", immediateRender: false, onUpdate: function () { fn(s.t); } }, at);
    return at + dur;
  };
  var defaults = {"stroke":4,"delay":0.7,"duration":1,"ease":"css-in-out","line":4,"color":"#8b7bff","exit":null};
  var run = function (el, tl, at, o) {
        var ol = el.cloneNode(true), edge = document.createElement("div"), ease = MW.ez(o.ease), sw = o.stroke;
        el.style.position = "relative"; ol.removeAttribute("id"); ol.style.position = "absolute"; ol.style.left = "0"; ol.style.top = "0"; ol.style.width = "100%"; ol.style.margin = "0"; ol.style.maxWidth = "none";
        ol.style.pointerEvents = "none"; ol.style.color = "transparent"; ol.style.webkitTextFillColor = "transparent";
        el.appendChild(ol); edge.style.cssText = "position:absolute;top:-0.15em;bottom:-0.15em;width:" + o.line + "px;background:" + o.color + ";pointer-events:none;opacity:0;"; el.appendChild(edge);
        // the filled text is the element's own; the outline copy sits on top
        var fill = Array.prototype.slice.call(el.childNodes).filter(function (n) { return n !== ol && n !== edge; }), wrap = document.createElement("span");
        wrap.style.display = "inline-block"; el.insertBefore(wrap, el.firstChild); fill.forEach(function (n) { wrap.appendChild(n); });
        var col = getComputedStyle(el).color, end = o.exit == null ? 0.5 + o.delay + o.duration : o.exit + 0.9;
        return MW.drive(tl, at, end, function (t) {
          var W = wrap.offsetWidth, a = Math.min(1, t / 0.5), p = ease(Math.max(0, Math.min(1, (t - o.delay) / o.duration))), right = W * (1 - p), left = 0, olo = a;
          if (o.exit != null && t >= o.exit) { var q = ease(Math.min(1, (t - o.exit) / 0.6)); left = W * q; right = 0; olo = t > o.exit + 0.6 ? Math.max(0, 1 - (t - o.exit - 0.6) / 0.3) : 1; }
          ol.style.webkitTextStroke = (sw * a) + "px " + col; ol.style.opacity = String(olo);
          wrap.style.clipPath = "inset(-0.4em " + right + "px -0.4em " + left + "px)";
          var ex = o.exit != null && t >= o.exit ? left : W - right, on = (p > 0 && p < 1) || (o.exit != null && t >= o.exit && left > 0 && left < W);
          edge.style.left = (wrap.offsetLeft + ex - o.line / 2) + "px"; edge.style.opacity = on ? "1" : "0";
        });
      };
  MW.textOutlineFillSweep = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
</script>
