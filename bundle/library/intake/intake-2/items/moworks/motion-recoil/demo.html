<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Recoil - Demo</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
:root { --bg: #09090b; --fg: #fafafa; --card: #111114; --line: #27272a; }
* { box-sizing: border-box; }
html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); }
#demo { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); color: var(--fg); font-family: Inter, sans-serif; }
.center { position: absolute; inset: 0; display: grid; place-items: center; }
.row { display: flex; align-items: center; justify-content: center; gap: 48px; }
.col { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 32px; }
.h1 { font-size: 132px; font-weight: 800; letter-spacing: -0.035em; line-height: 1.1; text-align: center; }
.h2 { font-size: 84px; font-weight: 700; letter-spacing: -0.025em; line-height: 1.15; text-align: center; }
.p { font-size: 40px; line-height: 1.4; opacity: 0.72; text-align: center; }
.card { position: relative; border-radius: 28px; background: var(--card); border: 2px solid var(--line); overflow: hidden; }
.muted { opacity: 0.6; }

#demo { background: radial-gradient(100% 100% at 50% 45%, #1a1f33, #0b0d12); color: #e8ebf3; font-family: Inter, sans-serif; } .gm { position: absolute; inset: 0; }
.fl { position: absolute; left: 260px; right: 260px; top: 860px; height: 4px; border-radius: 2px; background: #262c3a; } .rc-w { position: absolute; left: 1280px; top: 520px; width: 30px; height: 344px; border-radius: 6px; background: #3a4466; } .rc { position: absolute; left: 400px; top: 660px; width: 200px; height: 200px; border-radius: 26px; background: linear-gradient(150deg, #ffd27a, #ff9b3d); }
    </style>
  </head>
  <body>
    <div id="demo" data-composition-id="mw-demo" data-start="0" data-width="1920" data-height="1080" data-duration="1.6">
<div class="fl"></div><div class="rc-w"></div><div class="rc"></div>
      <script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.drive = MW.drive || function (tl, at, dur, fn) {
    var s = { t: 0 }; fn(0);
    tl.fromTo(s, { t: 0 }, { t: dur, duration: dur, ease: "none", immediateRender: false, onUpdate: function () { fn(s.t); } }, at);
    return at + dur;
  };
  var defaults = {"keys":[0,680,530,590],"times":[0.26,0.114,0.146],"squash":0.82,"accent":"#a99bff"};
  var run = function (el, tl, at, o) {
        var host = el.parentNode, p3 = gsap.parseEase("power3.out"), p2 = gsap.parseEase("power2.out"), io = gsap.parseEase("power2.inOut"), K = o.keys, a = o.times[0], b = a + o.times[1], c = b + o.times[2], lines = [], sparks = [];
        if (getComputedStyle(host).position === "static") host.style.position = "relative"; gsap.set(el, { transformOrigin: "100% 50%" });
        for (var i = 0; i < 3; i++) { var l = document.createElement("div"); l.style.cssText = "position:absolute;height:8px;border-radius:4px;background:" + o.accent + ";opacity:0;pointer-events:none;"; host.appendChild(l); lines.push(l); }
        for (var j = 0; j < 5; j++) { var s = document.createElement("div"); s.style.cssText = "position:absolute;height:6px;width:60px;border-radius:3px;background:#ffd23d;opacity:0;pointer-events:none;transform-origin:0 50%;"; host.appendChild(s); sparks.push(s); }
        var X = function (t) { if (t <= 0) return K[0]; if (t < a) return K[0] + (K[1] - K[0]) * p3(t / a); if (t < b) return K[1] + (K[2] - K[1]) * p2((t - a) / (b - a)); if (t < c) return K[2] + (K[3] - K[2]) * io((t - b) / (c - b)); return K[3]; };
        var L0 = el.offsetLeft, T0 = el.offsetTop, W = el.offsetWidth, Hh = el.offsetHeight;
        return MW.drive(tl, at, Math.max(c, a + 0.22) + 0.1, function (t) {
          var x = X(t), w = 1 - Math.abs(t - a) / 0.06, sx = w > 0 ? 1 - (1 - o.squash) * w : 1; gsap.set(el, { x: x, scaleX: sx, scaleY: 1 / sx });
          var v = (X(t + 0.005) - X(t - 0.005)) / 0.01; lines.forEach(function (l, i) { var len = Math.min(220, v * 0.06) * (1 - i * 0.2); l.style.width = Math.max(0, len) + "px"; l.style.left = L0 + x - len - 30 - i * 20 + "px"; l.style.top = T0 + Hh * (0.3 + 0.2 * i) + "px"; l.style.opacity = t < a && v > 200 ? String(0.7 - 0.15 * i) : "0"; });
          var u = (t - a) / 0.22; sparks.forEach(function (s, i) { var ang = 180 + (i - 2) * 28; s.style.left = L0 + K[1] + W + "px"; s.style.top = T0 + Hh / 2 - 3 + "px"; s.style.transform = "rotate(" + ang + "deg) translateX(" + (30 + 80 * u) + "px) scaleX(" + (1 - u).toFixed(3) + ")"; s.style.opacity = u > 0 && u < 1 ? String(1 - u) : "0"; });
        });
      };
  MW.motionRecoil = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
      </script>
      <script>
        (function () {
          var tl = gsap.timeline({ paused: true });
          var q = function (s) { return document.querySelector(s); }, qa = function (s) { return Array.prototype.slice.call(document.querySelectorAll(s)); };
          MW.motionRecoil(q(".rc"), tl, 0.4, {});
          tl.set({}, {}, 1.6);
          // register only when every motion is ready (MW.pending: e.g. a WebGL texture still decoding), as HyperFrames asks of async builds
          var go = function () { window.__timelines = window.__timelines || {}; window.__timelines["mw-demo"] = tl; };
          if (window.MW && MW.pending && MW.pending.length) Promise.all(MW.pending).then(go, go); else go();
        })();
      </script>
    </div>
  </body>
</html>
