<!--
  Scroll Depth Zoom (Moworks Studio, the studio's own, written here).
  Source: Moworks Studio.
  Một mặt phẳng nhỏ và tối phóng dần về đúng cỡ quanh tâm cố định, sáng lên khi tới nơi.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.motionDepthZoomIn(q(".dz-c"), tl, 0.3, { backAt: 2.3 });

  Options (defaults in brackets):
      - from: start scale (0.78)
      - duration: s (1.2), in-out
      - backAt: s after the start to go back (null)

  Notes: Surface 224x134 r10 at centre: scale 0.78 → 1 around a fixed centre and brightness 0.7 → 1 (a 30 % dark overlay fades out) over 1.2 s (0.3-1.5 s) power2.inOut; a dashed final-size outline fades out as it lands. Demo reverses 2.6-3.2 s. Params: scale (0.78 → 1) · brightness (0.7 → 1) · duration (1.2 s) · ease (power2.inOut).
-->

<div class="dz"><div class="dz-c"></div></div>

<style>

</style>

<script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.drive = MW.drive || function (tl, at, dur, fn) {
    var s = { t: 0 }; fn(0);
    tl.fromTo(s, { t: 0 }, { t: dur, duration: dur, ease: "none", immediateRender: false, onUpdate: function () { fn(s.t); } }, at);
    return at + dur;
  };
  var defaults = {"from":0.78,"duration":1.2,"backAt":null};
  var run = function (el, tl, at, o) {
        var io = gsap.parseEase("power2.inOut"), host = el.parentNode, shade = document.createElement("div"), guide = document.createElement("div");
        shade.style.cssText = "position:absolute;inset:0;background:#000;border-radius:inherit;pointer-events:none;"; el.appendChild(shade);
        if (getComputedStyle(host).position === "static") host.style.position = "relative";
        guide.style.cssText = "position:absolute;pointer-events:none;border:3px dashed rgba(233,235,243,0.4);border-radius:40px;"; host.appendChild(guide);
        return MW.drive(tl, at, o.backAt == null ? o.duration : o.backAt + 0.6, function (t) {
          var p = io(Math.max(0, Math.min(1, t / o.duration))); if (o.backAt != null) p *= 1 - io(Math.max(0, Math.min(1, (t - o.backAt) / 0.6)));
          gsap.set(el, { scale: o.from + (1 - o.from) * p }); shade.style.opacity = String(0.3 * (1 - p));
          guide.style.left = el.offsetLeft + "px"; guide.style.top = el.offsetTop + "px"; guide.style.width = el.offsetWidth + "px"; guide.style.height = el.offsetHeight + "px"; guide.style.opacity = String(1 - p);
        });
      };
  MW.motionDepthZoomIn = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
</script>
