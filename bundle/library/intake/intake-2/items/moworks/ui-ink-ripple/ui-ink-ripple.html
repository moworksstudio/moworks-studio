  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.uiInkRipple(q(".ik"), tl, 0, { cursor: ".ui-cursor" });

  Options (defaults in brackets):
      - press: s (0.5)
      - point: [x, y] share of the button ([0.82, 0.5])
      - ring: px (120)
      - stroke: px (8)
      - dot: px (60)
      - duration: s (0.65, power2.out): scale 0.1 → 3.1
      - accent: 
      - cursor: an optional cursor
      - approach: [x, y] px the cursor comes from
      - lead: s it arrives before a click

  Notes: Button 88x36 r8. At the click point (28 px right of centre): two accent outline rings 24 px, 2 px stroke, scale 0.1 → 3.1 and opacity 0.72 → 0 over 650 ms power2.out, the second 110 ms later; a 12 px white dot pops scale 0.8 → 1.1 (28 %) → 1, opacity 0.5 → 1. Recipe variant: one filled ink circle clipped by the button (overflow hidden), scale 0 → 3.2, opacity 0.7 → 0, 650 ms. Params: point (x, y trong nút) · scale (0.1 → 3.1) · rings (2, cách 0.11 s) · duration (0.65 s) · ease (power2.out) · fill: vòng viền | mực đầy.
-->
