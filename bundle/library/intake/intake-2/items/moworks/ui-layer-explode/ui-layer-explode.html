<!--
  Volumetric Menu (Moworks Studio, the studio's own, written here).
  Source: Moworks Studio.
  Ba lớp menu nghiêng 3D xếp chồng tách ra theo chiều dọc (−56 / 0 / +56 px) bằng lò xo lệch nhịp, có đường nối các góc, rồi gộp lại.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.uiLayerExplode(q(".le"), tl, 0, { panels: ".lp.a, .lp.b, .lp.c" });

  Options (defaults in brackets):
      - panels: selector of the panel wrappers, top first
      - spread: px (302; 56 of 320)
      - rotX: (−57)
      - rotY: (−29)
      - perspective: px (2800)
      - at: s (0.45)
      - collapseAt: s (2.9)

  Notes: Three panels 150x92 (ONE accent on top, TWO, THREE) tilted rotateX −57° and rotateY −29° (perspective 520), stacked. Separation along screen Y: −56 / 0 / +56 px (plus a 4 px base step) on springs k200 c20, the middle at 0.45 s, the outer ones 60 ms later (bottom +40 ms more). Dashed lines join the corners once apart; y readouts at the side. Collapse 2.9-3.35 s power2.inOut. Params: tilt (rotX 57°, rotY 29°) · spread (56 px) · spring (k200 c20) · each (0.06 s) · collapse (0.45 s).
-->

<div class="gm le"><div class="lp c"><div>BA</div></div><div class="lp b"><div>HAI</div></div><div class="lp a"><div>MỘT</div></div><div class="ly">y 0</div><div class="ly">y 0</div><div class="ly">y 0</div></div>

</style>

<script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.spring = MW.spring || function (stiffness, damping, mass, from, to) {
    var k = stiffness || 100, c = damping == null ? 10 : damping, m = mass || 1, w0 = Math.sqrt(k / m), z = c / (2 * Math.sqrt(k * m));
    var x = function (t) {
      if (z < 1) { var wd = w0 * Math.sqrt(1 - z * z); return 1 - Math.exp(-z * w0 * t) * (Math.cos(wd * t) + (z * w0 / wd) * Math.sin(wd * t)); }
      if (z === 1) return 1 - Math.exp(-w0 * t) * (1 + w0 * t);
      var q = Math.sqrt(z * z - 1), r1 = -w0 * (z - q), r2 = -w0 * (z + q), A = r2 / (r2 - r1), B = -r1 / (r2 - r1);
      return 1 - (A * Math.exp(r1 * t) + B * Math.exp(r2 * t));
    };
    var T = 0, dt = 1 / 240; for (var t = 0; t < 30; t += dt) if (Math.abs(1 - x(t)) > 0.001) T = t;
    T = Math.max(dt, T + dt);
    return { duration: T, ease: function (p) { return p >= 1 ? 1 : x(p * T); }, at: x };
  };
  MW.springDB = MW.springDB || function (duration, bounce) {
    var z = 1 - (bounce == null ? 0.25 : bounce), w = Math.log(1000) / (Math.max(0.05, z) * (duration || 0.8));
    return MW.spring(w * w, 2 * z * w, 1);
  };
  MW.drive = MW.drive || function (tl, at, dur, fn) {
    var s = { t: 0 }; fn(0);
    tl.fromTo(s, { t: 0 }, { t: dur, duration: dur, ease: "none", immediateRender: false, onUpdate: function () { fn(s.t); } }, at);
    return at + dur;
  };
  var defaults = {"panels":".lp","spread":302,"rotX":-57,"rotY":-29,"perspective":2800,"at":0.45,"collapseAt":2.9};
  var run = function (el, tl, at, o) {
        var P = Array.prototype.slice.call(el.querySelectorAll(o.panels)), sp = MW.spring(200, 20), io = gsap.parseEase("power2.inOut"), labs = el.querySelectorAll(".ly");
        P.forEach(function (p) { p.firstElementChild.style.transform = "perspective(" + o.perspective + "px) rotateX(" + o.rotX + "deg) rotateY(" + o.rotY + "deg)"; });
        var starts = [o.at + 0.06, o.at, o.at + 0.1], targets = [-o.spread, 0, o.spread];
        return MW.drive(tl, at, o.collapseAt + 0.5, function (t) {
          var col = t > o.collapseAt ? io(Math.min(1, (t - o.collapseAt) / 0.45)) : 0;
          P.forEach(function (p, i) { var s = t >= starts[i] ? sp.at(t - starts[i]) : 0, y = (targets[i] * s + 4 * (i - 1)) * (1 - col); gsap.set(p, { y: y }); if (labs[i]) { labs[i].firstChild.nodeValue = "y " + Math.round(y / 5.4); gsap.set(labs[i], { y: y }); } });
        });
      };
  MW.uiLayerExplode = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
</script>
