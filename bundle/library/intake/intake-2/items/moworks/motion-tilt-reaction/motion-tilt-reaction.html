  Tilt Reaction (Moworks Studio, the studio's own, written here).
  Source: Moworks Studio.
  Thẻ nghiêng 16° về phía bị bấm rồi bật về, hơi quá một chút, bóng đổ rộng ra theo góc nghiêng.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.motionTiltReaction(q(".tr-c"), tl, 0, { shadow: ".tr-sh", cursor: ".ui-cursor" });

  Options (defaults in brackets):
      - angle: degrees (16)
      - duration: s per reaction (0.48)
      - taps: [[s, 'left' | 'right'], ...]
      - shadow: contact shadow (widens 0.6 % a degree)
      - cursor: an optional cursor that makes the taps

  Notes: Rotation about the centre after a press on one side (sign follows the side): 0 → 16° in 120 ms power2.out, → −3° by 300 ms, → 0 by 480 ms (power2.inOut segments); contact shadow widens with |angle| (+0.6 % per degree). Recipe variant: 0 → 18° (308 ms) → 0 (560 ms) back.out. Demo: the cursor taps the right side, then the left 1.1 s later. Params: angle: góc (16°) · side: bên bấm (trái | phải) · duration (0.48 s).
-->
