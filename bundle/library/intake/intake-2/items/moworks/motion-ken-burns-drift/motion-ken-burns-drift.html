<!--
  Ken Burns (Moworks Studio, the studio's own, written here).
  Source: Moworks Studio.
  Ảnh tĩnh phóng to thật chậm và trôi nhẹ sang ngang để có sức sống.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.motionKenBurnsDrift(q(".kb"), tl, 0, { scale: 1.12 });

  Options (defaults in brackets):
      - duration: s (4), linear
      - scale: end scale (1.1; the small demo 1.12)
      - x: px drift (−60; −20 on the small frame)

  Notes: Still picture: scale 1 -> 1.1 and translateX 0 -> -20 px over 4000 ms linear (whole picture, no depth). Demo: 1 -> 1.12 with a 20 px drift over 4 s. Params: duration (4 s) · scale (1 → 1.1) · x (−20 px).
-->

<div class="kb-frame"><div class="kb"></div></div>

<style>

</style>

<script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.drive = MW.drive || function (tl, at, dur, fn) {
    var s = { t: 0 }; fn(0);
    tl.fromTo(s, { t: 0 }, { t: dur, duration: dur, ease: "none", immediateRender: false, onUpdate: function () { fn(s.t); } }, at);
    return at + dur;
  };
  var defaults = {"duration":4,"scale":1.1,"x":-60};
  var run = function (el, tl, at, o) {
        return MW.drive(tl, at, o.duration, function (t) { var p = t / o.duration; gsap.set(el, { scale: 1 + (o.scale - 1) * p, x: o.x * p }); });
      };
  MW.motionKenBurnsDrift = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
</script>
