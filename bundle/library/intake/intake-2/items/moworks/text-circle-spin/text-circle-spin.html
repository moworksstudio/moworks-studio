  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline

    MW.textCircleSpin(q(".cs"), tl, 0, {});

  Options (defaults in brackets):
      - text: 
      - radius: px (232)
      - size: px at most (96), fitted so the ring closes
      - turn: s per turn (10), linear
      - boost: speed-up factor (4)
      - boostAt: [in from, in to, out from, out to] s ([1.5, 1.9, 3.1, 3.5])
      - ease: (cubic-bezier(.65,0,.35,1))
      - sep: separator colour
      - loop: s (5)

  Notes: Text + ' • ' (Japanese '・', separator accent) repeated m times so it fills the circle (demo radius 58 px, chars ≤ 24 px); char placed by arc length, rotated to the tangent with tops outward. The ring turns 360° per 10–20 s linear, seamless. Optional speed-up ×4 eased in 1.5–1.9 s and out 3.1–3.5 s (cubic-bezier .65,0,.35,1), rotation = integral of speed. Demo loop 5 s. Params: bán kính (58 px) · một vòng (10 s) · hệ số tăng tốc (×4) · ký tự ngăn (•). Letters are placed by arc length with their tops outward; the turn is the integral of the speed.
