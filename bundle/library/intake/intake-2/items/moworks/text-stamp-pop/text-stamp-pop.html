<!--
  Rubber-Stamp Cut-out Pop (Moworks Studio, the studio's own, written here).
  Source: Moworks Studio.
  Từng từ đập xuống như con dấu theo phách, to quá một khung, hụt một khung rồi đứng yên, nét chữ lấm tấm chỗ thiếu mực, nền đổi màu ở mỗi phách.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.textStampPop(q(".sp h1"), tl, 0, { shapes: ".sp .s1, .sp .s2" });

  Options (defaults in brackets):
      - beat: s between words (0.36, at most 1.7 s ÷ words)
      - start: s (0.4)
      - offAt: s all off (3.42)
      - colors: background per beat
      - base: background before
      - card: the background card (the text's parent)
      - shapes: flat shapes stamped on beats 1, 2
      - loop: s (3.8)
      - seed: tilts and ink voids

  Notes: Posterized 12 fps. Units = words (chars if one word); beats every min(0.36, 1.7 / n) s from 0.4 s. On its beat a unit appears at scale 1.18, next 12 fps frame 0.95, then 1.0 (no tweening), with a seeded tilt ±3.4°. The background card hard-switches each beat: accent → second accent → yellow (text in background colour). Flat shapes (a 16 px dot, a small rectangle) stamp on beats 1 and 2. Ink voids: ~90 holes 0.5–1.8 px punched out of the letters. All off at 3.42 s. Loop 3.8 s. Params: nhịp phách (0.36 s) · nhịp hình (12 fps) · bật (1.18 → 0.95 → 1) · màu nền (3 màu luân phiên).
-->

<div class="sp"><div class="s1"></div><div class="s2"></div><h1>ĐẬP MẠNH NÀO</h1></div>

<style>

</style>

<script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.rand = MW.rand || function (seed) {
    var a = typeof seed === "string" ? MW.hash(seed) : (seed >>> 0) || 1;
    return function () { a = (a + 0x6d2b79f5) >>> 0; var t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  };
  MW.hash = MW.hash || function (s) { var h = 2166136261; s = String(s); for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; };
  MW.split = MW.split || function (el, mode) {
    el = MW.el(el);
    if (el.__mwSplit) return el.__mwSplit;
    var seg = typeof Intl !== "undefined" && Intl.Segmenter ? new Intl.Segmenter("vi", { granularity: "grapheme" }) : null;
    var graphemes = function (s) { if (seg) { var out = []; var it = seg.segment(s)[Symbol.iterator](), r; while (!(r = it.next()).done) out.push(r.value.segment); return out; } return Array.from(s); };
    var res = { chars: [], words: [], lines: [] };
    var walk = function (node) {
      var kids = Array.prototype.slice.call(node.childNodes);
      for (var k = 0; k < kids.length; k++) {
        var n = kids[k];
        if (n.nodeType === 1) { if (n.tagName === "BR") continue; walk(n); continue; }
        if (n.nodeType !== 3) continue;
        var text = n.nodeValue.normalize("NFC"), frag = document.createDocumentFragment();
        var parts = text.split(/(\s+)/);
        for (var p = 0; p < parts.length; p++) {
          var part = parts[p];
          if (!part) continue;
          if (/^\s+$/.test(part)) { frag.appendChild(document.createTextNode(part)); continue; }
          var w = document.createElement("span");
          w.className = "mw-w"; w.style.display = "inline-block"; w.style.whiteSpace = "nowrap";
          if (mode === "words") w.textContent = part;
          else { var gs = graphemes(part); for (var g = 0; g < gs.length; g++) { var c = document.createElement("span"); c.className = "mw-ch"; c.style.display = "inline-block"; c.textContent = gs[g]; w.appendChild(c); res.chars.push(c); } }
          res.words.push(w); frag.appendChild(w);
        }
        node.replaceChild(frag, n);
      }
    };
    walk(el);
    var top = null, line = null;
    for (var i = 0; i < res.words.length; i++) { var y = res.words[i].offsetTop; if (top === null || Math.abs(y - top) > 2) { top = y; line = []; res.lines.push(line); } line.push(res.words[i]); }
    el.__mwSplit = res;
    return res;
  };
  MW.drive = MW.drive || function (tl, at, dur, fn) {
    var s = { t: 0 }; fn(0);
    tl.fromTo(s, { t: 0 }, { t: dur, duration: dur, ease: "none", immediateRender: false, onUpdate: function () { fn(s.t); } }, at);
    return at + dur;
  };
  var defaults = {"beat":0.36,"start":0.4,"offAt":3.42,"colors":["#8b7bff","#3dd6f5","#ffd23d"],"base":"#151a28","card":null,"shapes":null,"loop":3.8,"seed":8};
  var run = function (el, tl, at, o) {
        var S = MW.split(el, "words"), units = S.words.length > 1 ? S.words : MW.split(el, "chars").chars, n = units.length, beat = Math.min(o.beat, 1.7 / n), card = o.card ? MW.el(o.card) : el.parentNode, r = MW.rand(o.seed);
        var tilts = units.map(function () { return (r() * 2 - 1) * 3.4; }), shapes = o.shapes ? Array.prototype.slice.call(document.querySelectorAll(o.shapes)) : [];
        // ink voids: small holes punched out of the letters (a mask of many soft-edged dots, intersected)
        var holes = []; for (var i = 0; i < 90; i++) { var x = (r() * 100).toFixed(1), y = (r() * 100).toFixed(1), d = (0.12 + r() * 0.35).toFixed(2); holes.push("radial-gradient(circle at " + x + "% " + y + "%, transparent " + d + "%, #000 " + (+d + 0.15).toFixed(2) + "%)"); }
        el.style.webkitMaskImage = el.style.maskImage = holes.join(","); el.style.webkitMaskComposite = "source-in"; el.style.maskComposite = "intersect";
        return MW.drive(tl, at, o.loop, function (t) {
          var T12 = Math.floor(t * 12) / 12, b = Math.floor((T12 - o.start) / beat + 1e-6), on = t >= o.start && t < o.offAt;
          units.forEach(function (u, i) { var d = Math.round((T12 - (o.start + i * beat)) * 12); u.style.visibility = on && d >= 0 ? "visible" : "hidden"; gsap.set(u, { scale: d <= 0 ? 1.18 : d === 1 ? 0.95 : 1, rotation: tilts[i] }); });
          if (card) card.style.backgroundColor = on && b >= 0 ? o.colors[Math.min(n - 1, b) % o.colors.length] : o.base;
          shapes.forEach(function (s, i) { s.style.visibility = on && b >= i + 1 ? "visible" : "hidden"; });
        });
      };
  MW.textStampPop = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
</script>
