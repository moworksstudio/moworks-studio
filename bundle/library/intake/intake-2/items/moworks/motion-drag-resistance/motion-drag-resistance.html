<!--
  Drag Resistance (Moworks Studio, the studio's own, written here).
  Source: Moworks Studio.
  Con trỏ kéo mép phải đi trước, mép trái theo sau nên viên thuốc giãn ra; thả tay nó bật về chỗ cũ.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.motionDragResistance(q(".dr"), tl, 0, { cursor: ".ui-cursor" });

  Options (defaults in brackets):
      - grab: s (0.3)
      - pull: px the front edge moves (460)
      - duration: s (0.6, power2.inOut)
      - lag: s the back edge trails (0.1)
      - max: stretch at most (1.35)
      - k: spring stiffness back (220)
      - c: damping (16)
      - cursor: an optional cursor on the front edge

  Notes: Grab the right edge: it moves +92 px in 600 ms power2.inOut while the left edge lags (follows 100 ms later, width kept within 80–108 px: scaleX up to 1.35, height 1/scaleX); release: the pill springs back (k 220, d 16) ~12 px past its slot and settles, stretching up to +18 % with speed on the way. Params: pull (92 px) · lag: trễ mép sau (0.1 s) · stretch max (1.35) · spring (k 220, d 16).
-->

<script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.spring = MW.spring || function (stiffness, damping, mass, from, to) {
    var k = stiffness || 100, c = damping == null ? 10 : damping, m = mass || 1, w0 = Math.sqrt(k / m), z = c / (2 * Math.sqrt(k * m));
    var x = function (t) {
      if (z < 1) { var wd = w0 * Math.sqrt(1 - z * z); return 1 - Math.exp(-z * w0 * t) * (Math.cos(wd * t) + (z * w0 / wd) * Math.sin(wd * t)); }
      if (z === 1) return 1 - Math.exp(-w0 * t) * (1 + w0 * t);
      var q = Math.sqrt(z * z - 1), r1 = -w0 * (z - q), r2 = -w0 * (z + q), A = r2 / (r2 - r1), B = -r1 / (r2 - r1);
      return 1 - (A * Math.exp(r1 * t) + B * Math.exp(r2 * t));
    };
    var T = 0, dt = 1 / 240; for (var t = 0; t < 30; t += dt) if (Math.abs(1 - x(t)) > 0.001) T = t;
    T = Math.max(dt, T + dt);
    return { duration: T, ease: function (p) { return p >= 1 ? 1 : x(p * T); }, at: x };
  };
  MW.springDB = MW.springDB || function (duration, bounce) {
    var z = 1 - (bounce == null ? 0.25 : bounce), w = Math.log(1000) / (Math.max(0.05, z) * (duration || 0.8));
    return MW.spring(w * w, 2 * z * w, 1);
  };
  MW.drive = MW.drive || function (tl, at, dur, fn) {
    var s = { t: 0 }; fn(0);
    tl.fromTo(s, { t: 0 }, { t: dur, duration: dur, ease: "none", immediateRender: false, onUpdate: function () { fn(s.t); } }, at);
    return at + dur;
  };
  var defaults = {"grab":0.3,"pull":460,"duration":0.6,"lag":0.1,"max":1.35,"k":220,"c":16,"cursor":null};
  var run = function (el, tl, at, o) {
        var host = el.parentNode, cur = o.cursor ? (host.querySelector(o.cursor) || document.querySelector(o.cursor)) : null, io = gsap.parseEase("power2.inOut"), sp = MW.spring(o.k, o.c), W = el.offsetWidth; gsap.set(el, { transformOrigin: "0% 50%" });
        var Rr = function (t) { return o.pull * io(Math.max(0, Math.min(1, (t - o.grab) / o.duration))); }, rel = o.grab + o.duration + o.lag;
        var E = function (t) { if (t <= rel) { var r = Rr(t), l = Rr(t - o.lag), w = Math.max(W * 0.8, Math.min(W * o.max, W + r - l)); return [r + W - w, r]; } var s = sp.at(t - rel), rr = o.pull * (1 - s); return [rr, rr]; };
        return MW.drive(tl, at, rel + sp.duration + 0.2, function (t) {
          var e = E(t), v = (E(t + 0.005)[1] - E(t - 0.005)[1]) / 0.01, st = t > rel ? 1 + Math.min(0.18, Math.abs(v) / 6000) : (W + e[1] - e[0]) / W;
          gsap.set(el, { x: e[0], scaleX: st, scaleY: 1 / Math.sqrt(st) });

        });
      };
  MW.motionDragResistance = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
