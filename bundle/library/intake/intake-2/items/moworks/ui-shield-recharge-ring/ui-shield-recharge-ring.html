<!--
  Shield Recharge Sweep (Moworks Studio, the studio's own, written here).
  Source: Moworks Studio.
  Vòng màu quét quanh biểu tượng khiên theo chiều kim đồng hồ từ đỉnh, có chấm sáng ở đầu và số phần trăm chạy theo; đủ một vòng thì khiên đổ màu bằng lò xo, loé một vòng sáng và hiện chữ "ACTIVE".

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.uiShieldRechargeRing(q(".shr"), tl, 0, {});

  Options (defaults in brackets):
      - start: s (0.4)
      - sweep: s for one turn, linear (1.6)
      - label: text when full
      - outAt: s (3.6)

  Notes: px @320x200. Grey ring r 50, stroke 5; an accent arc (round cap) sweeps clockwise from 12 o'clock linearly over 1.6 s (0.4-2.0 s) with a light dot r 4 at its head; percent readout 0 → 100. Dashed shield outline in the centre. At 2.0 s the shield fills accent by spring k300 d13 from 0; flash ring r 50 → 70 (stroke 5 → 0.5) fading 500 ms outCubic; 'ACTIVE' replaces the readout. Out 3.6-3.95 s inOut. Params: sweep: thời gian quét (1.6 s) · start: lúc bắt đầu (0.4 s) · pop: lò xo khiên (k300 d13) · label: nhãn khi xong ("ACTIVE").
-->

<div class="shr"><svg viewBox="0 0 600 600" width="600" height="600"><circle cx="300" cy="300" r="250" fill="none" stroke="#2a3142" stroke-width="20"/>
<circle class="arc" cx="300" cy="300" r="250" fill="none" stroke="#8b7bff" stroke-width="20" stroke-linecap="round" transform="rotate(-90 300 300)"/><circle class="hd" cx="300" cy="50" r="16" fill="#f2eeff"/>
<path d="M300 150 L410 195 V300 C410 380 360 430 300 460 C240 430 190 380 190 300 V195 Z" fill="none" stroke="#6c778b" stroke-width="8" stroke-dasharray="18 14"/>
<path class="shf" d="M300 150 L410 195 V300 C410 380 360 430 300 460 C240 430 190 380 190 300 V195 Z" fill="#8b7bff"/><circle class="fl" cx="300" cy="300" r="250" fill="none" stroke="#d6ccff" stroke-width="20" style="opacity:0"/></svg>
<div class="pct">0%</div></div>

<style>

</style>

<script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.spring = MW.spring || function (stiffness, damping, mass, from, to) {
    var k = stiffness || 100, c = damping == null ? 10 : damping, m = mass || 1, w0 = Math.sqrt(k / m), z = c / (2 * Math.sqrt(k * m));
    var x = function (t) {
      if (z < 1) { var wd = w0 * Math.sqrt(1 - z * z); return 1 - Math.exp(-z * w0 * t) * (Math.cos(wd * t) + (z * w0 / wd) * Math.sin(wd * t)); }
      if (z === 1) return 1 - Math.exp(-w0 * t) * (1 + w0 * t);
      var q = Math.sqrt(z * z - 1), r1 = -w0 * (z - q), r2 = -w0 * (z + q), A = r2 / (r2 - r1), B = -r1 / (r2 - r1);
      return 1 - (A * Math.exp(r1 * t) + B * Math.exp(r2 * t));
    };
    var T = 0, dt = 1 / 240; for (var t = 0; t < 30; t += dt) if (Math.abs(1 - x(t)) > 0.001) T = t;
    T = Math.max(dt, T + dt);
    return { duration: T, ease: function (p) { return p >= 1 ? 1 : x(p * T); }, at: x };
  };
  MW.springDB = MW.springDB || function (duration, bounce) {
    var z = 1 - (bounce == null ? 0.25 : bounce), w = Math.log(1000) / (Math.max(0.05, z) * (duration || 0.8));
    return MW.spring(w * w, 2 * z * w, 1);
  };
  MW.drive = MW.drive || function (tl, at, dur, fn) {
    var s = { t: 0 }; fn(0);
    tl.fromTo(s, { t: 0 }, { t: dur, duration: dur, ease: "none", immediateRender: false, onUpdate: function () { fn(s.t); } }, at);
    return at + dur;
  };
  var defaults = {"start":0.4,"sweep":1.6,"label":"ĐÃ BẬT","outAt":3.6};
  var run = function (el, tl, at, o) {
        var arc = el.querySelector(".arc"), dot = el.querySelector(".hd"), pct = el.querySelector(".pct"), sh = el.querySelector(".shf"), fl = el.querySelector(".fl"), sp = MW.spring(300, 13), out = gsap.parseEase("power2.out"), io = gsap.parseEase("power2.inOut");
        var R = 250, C = 2 * Math.PI * R; arc.setAttribute("stroke-dasharray", C + " " + C);
        return MW.drive(tl, at, o.outAt + 0.4, function (t) {
          var u = Math.max(0, Math.min(1, (t - o.start) / o.sweep)), e = t > o.outAt ? 1 - io(Math.min(1, (t - o.outAt) / 0.35)) : 1, a = -Math.PI / 2 + u * 2 * Math.PI;
          arc.setAttribute("stroke-dashoffset", String(C * (1 - u))); dot.setAttribute("cx", 300 + R * Math.cos(a)); dot.setAttribute("cy", 300 + R * Math.sin(a)); dot.style.opacity = u > 0 && u < 1 ? "1" : "0";
          var done = t >= o.start + o.sweep, d = t - o.start - o.sweep;
          pct.firstChild.nodeValue = done ? o.label : Math.round(u * 100) + "%";
          gsap.set(sh, { scale: done ? sp.at(d) : 0, transformOrigin: "50% 50%" });
          var q = done ? out(Math.min(1, d / 0.5)) : 0; fl.setAttribute("r", 250 + 100 * q); fl.setAttribute("stroke-width", 20 - 18 * q); fl.style.opacity = done && d < 0.5 ? String(1 - q) : "0";
          el.style.opacity = String(e);
        });
      };
  MW.uiShieldRechargeRing = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
</script>
