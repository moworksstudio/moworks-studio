<!--
  Pendulum Swing (Moworks Studio, the studio's own, written here).
  Source: Moworks Studio.
  Mỗi chữ cái treo ở mép trên, bắt đầu nằm ngang 90° rồi buông xuống đung đưa như con lắc tắt dần, các chữ nối nhau thành một làn sóng.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.textPendulumLetters(q(".tk-head"), tl, 0, {});

  Options (defaults in brackets):
      - k: spring stiffness (90)
      - c: damping (4.5)
      - start: s (0.35)
      - stagger: s (0.06, ≤ 0.9 s)
      - exitAt: s they swing back up (3.55)

  Notes: Per char, pivot at its top centre (50 % 0 %), letter spacing 0.08 em: rotation 90° → 0 by spring k 90, c 4.5, m 1 (ζ≈0.24, ω 9.2 rad/s) from 0.35 s, stagger 0.06 s (capped at 0.9 s total). Peaks: −42° at 0.34 s, +19° at 0.68 s, −9° at 1.02 s, +4° at 1.36 s, settled ~2 s. Exit 3.55–4.15 s: swing back up to 90° with back.in. Optional rail line above the letters with a thin thread and a pivot dot per letter. Loop 4.2 s. Params: góc đầu (90°) · lò xo (k 90, c 4.5) · cách nhau (0.06 s).
-->

<div class="tk-stage"><div><h1 class="tk-head ">ĐUNG ĐƯA</h1></div></div>

<style>

</style>

<script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.split = MW.split || function (el, mode) {
    el = MW.el(el);
    if (el.__mwSplit) return el.__mwSplit;
    var seg = typeof Intl !== "undefined" && Intl.Segmenter ? new Intl.Segmenter("vi", { granularity: "grapheme" }) : null;
    var graphemes = function (s) { if (seg) { var out = []; var it = seg.segment(s)[Symbol.iterator](), r; while (!(r = it.next()).done) out.push(r.value.segment); return out; } return Array.from(s); };
    var res = { chars: [], words: [], lines: [] };
    var walk = function (node) {
      var kids = Array.prototype.slice.call(node.childNodes);
      for (var k = 0; k < kids.length; k++) {
        var n = kids[k];
        if (n.nodeType === 1) { if (n.tagName === "BR") continue; walk(n); continue; }
        if (n.nodeType !== 3) continue;
        var text = n.nodeValue.normalize("NFC"), frag = document.createDocumentFragment();
        var parts = text.split(/(\s+)/);
        for (var p = 0; p < parts.length; p++) {
          var part = parts[p];
          if (!part) continue;
          if (/^\s+$/.test(part)) { frag.appendChild(document.createTextNode(part)); continue; }
          var w = document.createElement("span");
          w.className = "mw-w"; w.style.display = "inline-block"; w.style.whiteSpace = "nowrap";
          if (mode === "words") w.textContent = part;
          else { var gs = graphemes(part); for (var g = 0; g < gs.length; g++) { var c = document.createElement("span"); c.className = "mw-ch"; c.style.display = "inline-block"; c.textContent = gs[g]; w.appendChild(c); res.chars.push(c); } }
          res.words.push(w); frag.appendChild(w);
        }
        node.replaceChild(frag, n);
      }
    };
    walk(el);
    var top = null, line = null;
    for (var i = 0; i < res.words.length; i++) { var y = res.words[i].offsetTop; if (top === null || Math.abs(y - top) > 2) { top = y; line = []; res.lines.push(line); } line.push(res.words[i]); }
    el.__mwSplit = res;
    return res;
  };
  MW.spring = MW.spring || function (stiffness, damping, mass, from, to) {
    var k = stiffness || 100, c = damping == null ? 10 : damping, m = mass || 1, w0 = Math.sqrt(k / m), z = c / (2 * Math.sqrt(k * m));
    var x = function (t) {
      if (z < 1) { var wd = w0 * Math.sqrt(1 - z * z); return 1 - Math.exp(-z * w0 * t) * (Math.cos(wd * t) + (z * w0 / wd) * Math.sin(wd * t)); }
      if (z === 1) return 1 - Math.exp(-w0 * t) * (1 + w0 * t);
      var q = Math.sqrt(z * z - 1), r1 = -w0 * (z - q), r2 = -w0 * (z + q), A = r2 / (r2 - r1), B = -r1 / (r2 - r1);
      return 1 - (A * Math.exp(r1 * t) + B * Math.exp(r2 * t));
    };
    var T = 0, dt = 1 / 240; for (var t = 0; t < 30; t += dt) if (Math.abs(1 - x(t)) > 0.001) T = t;
    T = Math.max(dt, T + dt);
    return { duration: T, ease: function (p) { return p >= 1 ? 1 : x(p * T); }, at: x };
  };
  MW.springDB = MW.springDB || function (duration, bounce) {
    var z = 1 - (bounce == null ? 0.25 : bounce), w = Math.log(1000) / (Math.max(0.05, z) * (duration || 0.8));
    return MW.spring(w * w, 2 * z * w, 1);
  };
  MW.drive = MW.drive || function (tl, at, dur, fn) {
    var s = { t: 0 }; fn(0);
    tl.fromTo(s, { t: 0 }, { t: dur, duration: dur, ease: "none", immediateRender: false, onUpdate: function () { fn(s.t); } }, at);
    return at + dur;
  };
  var defaults = {"k":90,"c":4.5,"start":0.35,"stagger":0.06,"exitAt":3.55};
  var run = function (el, tl, at, o) {
        var ch = MW.split(el, "chars").chars, n = ch.length, st = Math.min(o.stagger, 0.9 / Math.max(1, n - 1)), sp = MW.spring(o.k, o.c), bi = gsap.parseEase("back.in");
        el.style.letterSpacing = "0.08em"; ch.forEach(function (c) { c.style.transformOrigin = "50% 0%"; });
        return MW.drive(tl, at, o.exitAt + 0.6, function (t) {
          var e = bi(Math.max(0, Math.min(1, (t - o.exitAt) / 0.6)));
          ch.forEach(function (c, i) { var d = t - o.start - i * st, a = d < 0 ? 90 : 90 * (1 - sp.at(d)); a = a + (90 - a) * e; gsap.set(c, { rotation: a }); });
        });
      };
  MW.textPendulumLetters = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
</script>
