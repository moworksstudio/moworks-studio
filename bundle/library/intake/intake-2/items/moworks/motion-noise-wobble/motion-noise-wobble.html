<!--
  Noise Wobble (Moworks Studio, the studio's own, written here).
  Source: Moworks Studio.
  Mỗi phần tử xê dịch và nghiêng một chút theo nhiễu chậm, mỗi cái một kiểu, cho cảm giác vẽ tay chưa yên.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.motionNoiseWobble(q(".nw"), tl, 0, { items: "i" });

  Options (defaults in brackets):
      - items: children to wobble (null: the element itself)
      - amp: ± px (14; 2 at UI size)
      - rotate: ± degrees (6)
      - loop: s the wobble repeats (4)
      - seed: (3)
      - duration: s (8)

  Notes: Each element gets x, y and rotation from slow smooth noise: recipe noise(t x 0.5), +-2 px and +-1 deg, looping every 4 s. Demo (3 squares 48 px): x, y +-5 px (noise at 1.2 t and 1.4 t), rotation +-0.2 rad, a different seed per element. Params: amp (±2 px / ±1°) · loop (4 s) · seed. Smooth noise made of three sines with whole cycles per loop, a different seed per element, so it loops seamlessly.
-->

<div class="st"><div class="nw"><i style="background:#ffd23d">Mới</i><i style="background:#a99bff">Hay</i><i style="background:#75e4d2">Vui</i></div></div>

<script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.rand = MW.rand || function (seed) {
    var a = typeof seed === "string" ? MW.hash(seed) : (seed >>> 0) || 1;
    return function () { a = (a + 0x6d2b79f5) >>> 0; var t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  };
  MW.hash = MW.hash || function (s) { var h = 2166136261; s = String(s); for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; };
  MW.drive = MW.drive || function (tl, at, dur, fn) {
    var s = { t: 0 }; fn(0);
    tl.fromTo(s, { t: 0 }, { t: dur, duration: dur, ease: "none", immediateRender: false, onUpdate: function () { fn(s.t); } }, at);
    return at + dur;
  };
  var defaults = {"items":null,"amp":14,"rotate":6,"loop":4,"seed":3,"duration":8};
  var run = function (el, tl, at, o) {
        var it = o.items ? Array.prototype.slice.call(el.querySelectorAll(o.items)) : [el], P = it.map(function (_, i) { var r = MW.rand(o.seed + 17 * i), f = []; for (var j = 0; j < 9; j++) f.push(r() * 2 * Math.PI); return f; });
        var nz = function (ph, t, k) { var u = 2 * Math.PI * t / o.loop; return 0.6 * Math.sin(u + ph[k]) + 0.3 * Math.sin(2 * u + ph[k + 1]) + 0.1 * Math.sin(3 * u + ph[k + 2]); };
        return MW.drive(tl, at, o.duration, function (t) { it.forEach(function (x, i) { var ph = P[i]; gsap.set(x, { x: o.amp * nz(ph, t, 0), y: o.amp * nz(ph, t, 3), rotation: o.rotate * nz(ph, t, 6) }); }); });
      };
  MW.motionNoiseWobble = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
</script>
