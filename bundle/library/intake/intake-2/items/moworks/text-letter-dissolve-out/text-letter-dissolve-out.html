<!--
  Defeat Dissolve (Moworks Studio, the studio's own, written here).
  Source: Moworks Studio.
  Chữ đứng yên đủ để đọc, rồi từng chữ cái lần lượt bay lên, bẹp lại và mờ đi, mỗi chữ rơi rớt vài hạt vuông nhỏ trôi lên; cuối cùng nút "Thử lại" trồi lên và ở lại.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.textLetterDissolveOut(q(".ld h1"), tl, 0, { button: ".ld .bt" });

  Options (defaults in brackets):
      - leaveAt: s the letters start to go (1.0)
      - stagger: s (0.09)
      - rise: px (100)
      - bits: squares shed per letter (6)
      - color: their colour
      - button: the retry button
      - buttonAt: s (1.6)
      - outAt: s (2.55)
      - seed: bits

  Notes: px @320x200. Word (40 px) enters 0.05-0.35 s (fade, rise 6 px) and holds ~0.7 s. From 1.0 s letters leave 90 ms apart: each over 550 ms in-quad rises 20 px, scaleX 1 → 0.85, scaleY 1 → 0.65, fades; each sheds 6 seeded 3 px squares (within ±11 px, up to 26 px above the baseline) drifting up 24-44 px and ±8 px sideways, fading from 80 %, over 700 ms outCubic, 30 ms apart. 'TRY AGAIN' pill rises 8 px, 350 ms back.out at 1.6 s; out 2.55-2.75 s. Params: leaveAt: lúc bắt đầu tan (1.0 s) · stagger: cách nhau (0.09 s) · rise: bay lên (20 px) · bits: số hạt mỗi chữ (6) · button: nút ("THỬ LẠI").
-->

<div class="gm ld"><div><h1>THẤT BẠI</h1><div class="bt">THỬ LẠI</div></div></div>

</style>

<script>
(function () {

  };
  MW.hash = MW.hash || function (s) { var h = 2166136261; s = String(s); for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; };
  MW.split = MW.split || function (el, mode) {
    el = MW.el(el);
    if (el.__mwSplit) return el.__mwSplit;
    var seg = typeof Intl !== "undefined" && Intl.Segmenter ? new Intl.Segmenter("vi", { granularity: "grapheme" }) : null;
    var graphemes = function (s) { if (seg) { var out = []; var it = seg.segment(s)[Symbol.iterator](), r; while (!(r = it.next()).done) out.push(r.value.segment); return out; } return Array.from(s); };
    var res = { chars: [], words: [], lines: [] };
    var walk = function (node) {
      var kids = Array.prototype.slice.call(node.childNodes);
      for (var k = 0; k < kids.length; k++) {
        var n = kids[k];
        if (n.nodeType === 1) { if (n.tagName === "BR") continue; walk(n); continue; }
        if (n.nodeType !== 3) continue;
        var text = n.nodeValue.normalize("NFC"), frag = document.createDocumentFragment();
        var parts = text.split(/(\s+)/);
        for (var p = 0; p < parts.length; p++) {
          var part = parts[p];
          if (!part) continue;
          if (/^\s+$/.test(part)) { frag.appendChild(document.createTextNode(part)); continue; }
          var w = document.createElement("span");
          w.className = "mw-w"; w.style.display = "inline-block"; w.style.whiteSpace = "nowrap";
          if (mode === "words") w.textContent = part;
          else { var gs = graphemes(part); for (var g = 0; g < gs.length; g++) { var c = document.createElement("span"); c.className = "mw-ch"; c.style.display = "inline-block"; c.textContent = gs[g]; w.appendChild(c); res.chars.push(c); } }
          res.words.push(w); frag.appendChild(w);
        }
        node.replaceChild(frag, n);
      }
    };
    walk(el);
    var top = null, line = null;
    for (var i = 0; i < res.words.length; i++) { var y = res.words[i].offsetTop; if (top === null || Math.abs(y - top) > 2) { top = y; line = []; res.lines.push(line); } line.push(res.words[i]); }
    el.__mwSplit = res;
    return res;
  };
  MW.drive = MW.drive || function (tl, at, dur, fn) {
    var s = { t: 0 }; fn(0);
    tl.fromTo(s, { t: 0 }, { t: dur, duration: dur, ease: "none", immediateRender: false, onUpdate: function () { fn(s.t); } }, at);
    return at + dur;
  };
  var defaults = {"leaveAt":1,"stagger":0.09,"rise":100,"bits":6,"color":"#6c778b","button":null,"buttonAt":1.6,"outAt":2.55,"seed":4};
  var run = function (el, tl, at, o) {
        var ch = MW.split(el, "chars").chars, host = el.parentNode, r = MW.rand(o.seed), bits = [], pin = gsap.parseEase("power1.in"), out = gsap.parseEase("power2.out"), bk = gsap.parseEase("back.out"), btn = o.button ? MW.el(o.button) : null;
        if (getComputedStyle(host).position === "static") host.style.position = "relative";

        return MW.drive(tl, at, o.outAt + 0.25, function (t) {
          var e = Math.max(0, Math.min(1, (t - 0.05) / 0.3)), f = 1 - Math.max(0, Math.min(1, (t - o.outAt) / 0.2));

          ch.forEach(function (c, i) { var u = pin(Math.max(0, Math.min(1, (t - o.leaveAt - i * o.stagger) / 0.55))); gsap.set(c, { y: -o.rise * u, scaleX: 1 - 0.15 * u, scaleY: 1 - 0.35 * u, transformOrigin: "50% 100%" }); c.style.opacity = String(1 - u); });
          bits.forEach(function (q) { var u = (t - o.leaveAt - q.i * o.stagger - q.k * 0.03) / 0.7; if (u < 0 || u > 1) { q.b.style.opacity = "0"; return; } var p = out(u), cx = q.c.offsetLeft + el.offsetLeft + q.c.offsetWidth / 2, cy = el.offsetTop + q.c.offsetTop + q.c.offsetHeight * 0.8;
            q.b.style.left = (cx + q.dx + q.side * p) + "px"; q.b.style.top = (cy - q.dy - q.up * p) + "px"; q.b.style.opacity = String(0.8 * (1 - p)); });
          if (btn) { var v = Math.max(0, Math.min(1, (t - o.buttonAt) / 0.35)); gsap.set(btn, { y: 40 * (1 - bk(v)) }); btn.style.opacity = String(Math.min(1, v * 2) * f); }
        });
      };
  MW.textLetterDissolveOut = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
</script>
