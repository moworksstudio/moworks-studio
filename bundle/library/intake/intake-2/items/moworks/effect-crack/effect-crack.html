  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.effectCrack(q(".gm"), tl, 0, {});

  Options (defaults in brackets):
      - impact: s (0.55)
      - title: 
      - accent: crack colour
      - seed: the cracks (5)
      - loop: s (3.6)

  Notes: Impact at 0.55 s: 7 crack rays (4 jagged segments each, seeded: angle i/7 turn ± 0.25 rad, segments ± 0.27 rad, length to the panel edge × 0.72-0.92) draw from the centre outward in 0.4 s power2.out, 30 ms apart, 1.6 px accent; a 14-24 px branch on every second ray; impact ring 4 → 30 px fading over 0.4 s; panel shake 3 px × e^(−10 t) × sin(70 t). Repair 2.1-2.7 s: rays retract to the centre (reverse stagger, power2.inOut); light sweep 2.85-3.35 s. Params: rays (7 × 4 đoạn, seed) · draw (0.4 s, cách 0.03 s) · shake (3 px) · repair (0.6 s) · sweep. Seven jagged rays of four segments draw out in 0.4 s, 0.03 s apart, with a branch on every second one; they retract in reverse order 2.1–2.7 s, then a light sweep.
-->

  var run = function (el, tl, at, o) {
