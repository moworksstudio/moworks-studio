      - pieces: (28)

      - spread: ± px from the centre (200)
      - gravity: px added as gravity × s² (360)
      - wobble: ± px (16)
      - size: [w, h] px ([32, 20])
      - fadeStart: s after the launch (1.0)
      - fadeEnd: (1.5)
      - seed: (61)
      - flash: px the outline flash grows (40)
      - colors: 
      - accent: 
      - ink: label colour when filled
      - label: the label
      - doneHtml: the label when done
      - cursor: an optional cursor that makes the clicks
      - approach: [x, y] px the cursor comes from
      - lead: s it arrives before a click
