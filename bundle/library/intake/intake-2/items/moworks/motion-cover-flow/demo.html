<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Cover Flow - Demo</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
:root { --bg: #09090b; --fg: #fafafa; --card: #111114; --line: #27272a; }
* { box-sizing: border-box; }
html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); }
#demo { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); color: var(--fg); font-family: Inter, sans-serif; }
.center { position: absolute; inset: 0; display: grid; place-items: center; }
.row { display: flex; align-items: center; justify-content: center; gap: 48px; }
.col { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 32px; }
.h1 { font-size: 132px; font-weight: 800; letter-spacing: -0.035em; line-height: 1.1; text-align: center; }
.h2 { font-size: 84px; font-weight: 700; letter-spacing: -0.025em; line-height: 1.15; text-align: center; }
.p { font-size: 40px; line-height: 1.4; opacity: 0.72; text-align: center; }
.card { position: relative; border-radius: 28px; background: var(--card); border: 2px solid var(--line); overflow: hidden; }
.muted { opacity: 0.6; }

#demo { background: radial-gradient(100% 100% at 50% 45%, #1a1f33, #0b0d12); color: #e8ebf3; font-family: Inter, sans-serif; } .gm { position: absolute; inset: 0; }
.cf { position: absolute; inset: 0; } .cf .cd { width: 340px; height: 460px; border-radius: 30px; box-sizing: border-box; padding: 34px; display: flex; flex-direction: column; justify-content: flex-end; box-shadow: 0 30px 60px rgba(0,0,0,0.45); } .cf .cd b { font-size: 44px; font-weight: 900; color: #fff; } .cf .cd i { font-style: normal; font-size: 28px; color: rgba(255,255,255,0.75); margin-top: 8px; }
    </style>
  </head>
  <body>
    <div id="demo" data-composition-id="mw-demo" data-start="0" data-width="1920" data-height="1080" data-duration="4.4">
<div class="cf"><div class="cd" style="background:linear-gradient(150deg, #a693ff, #6a4cf0)"><b>Nhịp đêm</b><i>Moworks · 2022</i></div><div class="cd" style="background:linear-gradient(150deg, #3dd6f5, #1580b8)"><b>Biển xanh</b><i>Moworks · 2023</i></div><div class="cd" style="background:linear-gradient(150deg, #ffb18f, #ff6f91)"><b>Mùa hạ</b><i>Moworks · 2024</i></div><div class="cd" style="background:linear-gradient(150deg, #75e4d2, #2a8f7f)"><b>Phố cũ</b><i>Moworks · 2025</i></div><div class="cd" style="background:linear-gradient(150deg, #ffd23d, #ff8a3d)"><b>Bình minh</b><i>Moworks · 2026</i></div></div>
      <script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.spring = MW.spring || function (stiffness, damping, mass, from, to) {
    var k = stiffness || 100, c = damping == null ? 10 : damping, m = mass || 1, w0 = Math.sqrt(k / m), z = c / (2 * Math.sqrt(k * m));
    var x = function (t) {
      if (z < 1) { var wd = w0 * Math.sqrt(1 - z * z); return 1 - Math.exp(-z * w0 * t) * (Math.cos(wd * t) + (z * w0 / wd) * Math.sin(wd * t)); }
      if (z === 1) return 1 - Math.exp(-w0 * t) * (1 + w0 * t);
      var q = Math.sqrt(z * z - 1), r1 = -w0 * (z - q), r2 = -w0 * (z + q), A = r2 / (r2 - r1), B = -r1 / (r2 - r1);
      return 1 - (A * Math.exp(r1 * t) + B * Math.exp(r2 * t));
    };
    var T = 0, dt = 1 / 240; for (var t = 0; t < 30; t += dt) if (Math.abs(1 - x(t)) > 0.001) T = t;
    T = Math.max(dt, T + dt);
    return { duration: T, ease: function (p) { return p >= 1 ? 1 : x(p * T); }, at: x };
  };
  MW.springDB = MW.springDB || function (duration, bounce) {
    var z = 1 - (bounce == null ? 0.25 : bounce), w = Math.log(1000) / (Math.max(0.05, z) * (duration || 0.8));
    return MW.spring(w * w, 2 * z * w, 1);
  };
  MW.drive = MW.drive || function (tl, at, dur, fn) {
    var s = { t: 0 }; fn(0);
    tl.fromTo(s, { t: 0 }, { t: dur, duration: dur, ease: "none", immediateRender: false, onUpdate: function () { fn(s.t); } }, at);
    return at + dur;
  };
  MW.springTo = MW.springTo || function (k, c, keys) {
    var sp = MW.spring(k, c);
    return function (t) { var v = keys[0][1]; for (var i = 1; i < keys.length; i++) if (t >= keys[i][0]) v += (keys[i][1] - keys[i - 1][1]) * sp.at(t - keys[i][0]); return v; };
  };
  var defaults = {"items":".cd","keys":[[0,1],[0.8,2],[1.8,3],[2.8,2],[3.6,1]],"stiffness":200,"damping":22,"angle":60,"depth":[400,600],"step":320,"gap":110,"perspective":1800,"duration":4.4};
  var run = function (el, tl, at, o) {
        var it = Array.prototype.slice.call(el.querySelectorAll(o.items)), W = it[0].offsetWidth, Hh = it[0].offsetHeight, sel = MW.springTo(o.stiffness, o.damping, o.keys), cl = function (x) { return Math.max(-1, Math.min(1, x)); };
        el.style.perspective = o.perspective + "px"; el.style.transformStyle = "preserve-3d";
        it.forEach(function (c) { c.style.position = "absolute"; c.style.left = "50%"; c.style.top = "50%"; c.style.margin = -Hh / 2 + "px 0 0 " + -W / 2 + "px"; });
        return MW.drive(tl, at, o.duration, function (t) { var s = sel(t); it.forEach(function (c, i) { var d = i - s, a = Math.abs(d), z = -(o.depth[0] * Math.min(1, a) + (o.depth[1] - o.depth[0]) * Math.max(0, Math.min(1, a - 1)));
          gsap.set(c, { x: d * o.step + cl(d) * o.gap, z: z, rotationY: -cl(d) * o.angle }); c.style.zIndex = String(100 - Math.round(a * 10)); c.style.opacity = String(1 - Math.min(0.6, 0.3 * a)); }); });
      };
  MW.motionCoverFlow = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
      </script>
      <script>
        (function () {
          var tl = gsap.timeline({ paused: true });
          var q = function (s) { return document.querySelector(s); }, qa = function (s) { return Array.prototype.slice.call(document.querySelectorAll(s)); };
          MW.motionCoverFlow(q(".cf"), tl, 0, {});
          tl.set({}, {}, 4.4);
          // register only when every motion is ready (MW.pending: e.g. a WebGL texture still decoding), as HyperFrames asks of async builds
          var go = function () { window.__timelines = window.__timelines || {}; window.__timelines["mw-demo"] = tl; };
          if (window.MW && MW.pending && MW.pending.length) Promise.all(MW.pending).then(go, go); else go();
        })();
      </script>
    </div>
  </body>
</html>
