<!--
  Row Sweep Grid (Moworks Studio, the studio's own, written here).
  Source: Moworks Studio.
  Mỗi hàng ô trượt từ trái vào, hàng sau trễ 90 ms, trong hàng mỗi ô trễ thêm 20 ms.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.motionGridRowSweep(q(".gr"), tl, 0.3, {});

  Options (defaults in brackets):
      - items: 
      - cols: (4)
      - from: px (−136)
      - row: s per row (0.09)
      - col: s per column (0.02)
      - duration: s (0.56, power2.inOut)

  Notes: 3 rows × 4 tiles (32 px, 40 px pitch): x −34 → 0 px and opacity 0 → 1, each 560 ms power2.inOut; delay = row × 90 ms + column × 20 ms (800 ms in all). A soft band behind each row glows while it fills (guide). Params: from (−34 px) · row: trễ mỗi hàng (90 ms) · col: trễ mỗi cột (20 ms) · each (0.56 s).
-->

<div class="st"><div class="gr" style="grid-template-columns:repeat(4,1fr)"><i style="background:#2f3a5c">1</i><i style="background:#2f3a5c">2</i><i style="background:#2f3a5c">3</i><i style="background:#2f3a5c">4</i><i style="background:#2f3a5c">5</i><i style="background:#2f3a5c">6</i><i style="background:#2f3a5c">7</i><i style="background:#2f3a5c">8</i><i style="background:#2f3a5c">9</i><i style="background:#2f3a5c">10</i><i style="background:#2f3a5c">11</i><i style="background:#2f3a5c">12</i></div></div>

<style>

</style>

<script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.drive = MW.drive || function (tl, at, dur, fn) {
    var s = { t: 0 }; fn(0);
    tl.fromTo(s, { t: 0 }, { t: dur, duration: dur, ease: "none", immediateRender: false, onUpdate: function () { fn(s.t); } }, at);
    return at + dur;
  };
  var defaults = {"items":"i","cols":4,"from":-136,"row":0.09,"col":0.02,"duration":0.56};
  var run = function (el,tl,at,o
  ) {
  var it = Array.prototype.slice.call(el.querySelectorAll(o.items)), n = it.length, cols = o.cols || n;
  var io = gsap.parseEase("power2.inOut"), rows = Math.ceil(n / cols);
  return MW.drive(tl, at, (rows - 1) * o.row + (cols - 1) * o.col + o.duration, function (t) { it.forEach(function (x, i) { var d = Math.floor(i / cols) * o.row + (i % cols) * o.col, u = io(Math.max(0, Math.min(1, (t - d) / o.duration))); gsap.set(x, { x: o.from * (1 - u) }); x.style.opacity = String(u); }); });
  };
  MW.motionGridRowSweep = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
</script>
