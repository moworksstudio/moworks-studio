  Heavy Stop (Moworks Studio, the studio's own, written here).
  Source: Moworks Studio.
  Khối lao tới, bẹp dọc theo hướng đi lúc chạm, nhún tắt dần và bụi bay lên như vật nặng.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.motionHeavyStop(q(".hs"), tl, 0.3, {});

  Options (defaults in brackets):
      - x: px (1092)
      - over: px of overshoot (42)
      - squash: (0.18)
      - dust: (6)

  Notes: x 0 → 182 px in 462 ms power3.out (easeOutQuart), back to 175 by 680 ms power2.inOut (7 px overshoot) (recipe values; demo 202 / 195 px). From 320 ms the block squashes along the travel (ease-in) to scaleX 0.82 / scaleY 1.18 at arrival, then a damped wobble k = e^(−11 t)·cos(26 t) back to 1/1 (scale 1 ∓ 0.18 k, t in s after arrival). Pivot: bottom leading corner (100 % 100 %), at a stop line. 6 dust dots puff over 550 ms from 400 ms. Params: duration (0.68 s) · x (182 px) · overshoot (7 px) · squash (0.18) · dust: số hạt bụi (6). 0.462 s power3.out to the line, then back the overshoot by 0.68 s; squashed along the travel at arrival, then a damped wobble e^(−11 t) cos 26 t; the pivot is the bottom leading corner.
-->
