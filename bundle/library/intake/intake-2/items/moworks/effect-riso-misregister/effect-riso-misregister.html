<!--
  Misregistration (Moworks Studio, the studio's own, written here).
  Source: Moworks Studio.
  Hai bản màu in xanh và hồng chồng nhân màu, lệch nhau vài pixel và nhích về từng khung như in riso.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.effectRisoMisregister(q(".rz"), tl, 0, {});

  Options (defaults in brackets):
      - layers: [cyan layer, pink layer], each a copy of the art
      - steps: px offsets per frame ([16, 12, 8, 4, 8, 12])
      - fps: (12)
      - loop: s (3)

  Notes: Two copies of the art in print inks (cyan #2ec4e8, pink #ff4fa3) blended multiply, offset in opposite directions by (o, o/2): o steps 4 -> 3 -> 2 -> 1 -> 2 -> 3 px, one step per 12 fps frame (~83 ms; recipe 4 -> 3 -> 2 over 3 frames), cycling. Params: offset (4 → 1 px) · fps (12) · colors (#2ec4e8 / #ff4fa3). The two inks (cyan #2ec4e8, pink #ff4fa3) are blended multiply on paper white.
-->

<div class="rz"><div class="rz-c"><i></i><b>IN RISO</b></div><div class="rz-p"><i style="left:1240px;top:380px;width:360px;height:360px"></i><b>IN RISO</b></div></div>

<style>

</style>

<script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.drive = MW.drive || function (tl, at, dur, fn) {
    var s = { t: 0 }; fn(0);
    tl.fromTo(s, { t: 0 }, { t: dur, duration: dur, ease: "none", immediateRender: false, onUpdate: function () { fn(s.t); } }, at);
    return at + dur;
  };
  var defaults = {"layers":[".rz-c",".rz-p"],"steps":[16,12,8,4,8,12],"fps":12,"loop":3};
  var run = function (el, tl, at, o) {
        var L = o.layers.map(function (s) { return el.querySelector(s); });
        return MW.drive(tl, at, o.loop, function (t) { var k = Math.floor(t * o.fps) % o.steps.length, d = o.steps[k]; if (L[0]) gsap.set(L[0], { x: -d, y: -d / 2 }); if (L[1]) gsap.set(L[1], { x: d, y: d / 2 }); });
      };
  MW.effectRisoMisregister = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
</script>
