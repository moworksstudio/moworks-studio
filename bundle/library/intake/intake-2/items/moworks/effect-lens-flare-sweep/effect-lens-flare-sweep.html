<!--
  Lens Flare Sweep (Moworks Studio, the studio's own, written here).
  Source: Moworks Studio.
  Một nguồn sáng lướt ngang qua tiêu đề kèm vệt loé dài và các đốm phản chiếu chạy ngược, sáng nhất khi đi qua giữa.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.effectLensFlareSweep(q(".tk-head"), tl, 0.5, {});

  Options (defaults in brackets):
      - duration: s (1.05), in-out
      - unit: px per reference unit (5)
      - tint: title tint at the peak (35 %)

  Notes: A light source sweeps x −155 → +155 px across a title in 1050 ms power2.inOut; envelope sin(π p)^0.5, peak when centred (Gaussian width 60 px). Source: core r 4–7 px, halo r 12–20 px, horizontal streak (ellipse radius 70–110 px, 6 % tall, blur 3). Three ghost discs at +0.7×, −0.7× and −0.4× the offset (r 10 / 7 / 14 px, 20–35 % opacity), additive (lighter); title tinted 35 % at the peak. Params: duration (1.05 s) · x (±155 px) · ghosts (0.7 / −0.7 / −0.4) · streak (140–220 px) · tint (35 %).
-->

<div class="tk-stage"><div><h1 class="tk-head ">RA MẮT MÙA THU</h1></div></div>

<style>

</style>

<script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.drive = MW.drive || function (tl, at, dur, fn) {
    var s = { t: 0 }; fn(0);
    tl.fromTo(s, { t: 0 }, { t: dur, duration: dur, ease: "none", immediateRender: false, onUpdate: function () { fn(s.t); } }, at);
    return at + dur;
  };
  MW.canvas = MW.canvas || function (host, w, h) {
    host = MW.el(host);
    var cv = document.createElement("canvas"); w = w || host.clientWidth || 1920; h = h || host.clientHeight || 1080;
    cv.width = w; cv.height = h; cv.style.position = "absolute"; cv.style.left = "0"; cv.style.top = "0"; cv.style.width = w + "px"; cv.style.height = h + "px"; cv.style.pointerEvents = "none";
    host.appendChild(cv);
    return { cv: cv, ctx: cv.getContext("2d"), w: w, h: h };
  };
  var defaults = {"duration":1.05,"unit":5,"tint":"#d6ccff"};
  var run = function (el, tl, at, o) {
        var host = el.parentNode, cv = MW.canvas(host), c = cv.ctx, io = gsap.parseEase("power2.inOut"), col = getComputedStyle(el).color, mix = gsap.utils.interpolate(col, o.tint); cv.cv.style.zIndex = "5"; cv.cv.style.mixBlendMode = "plus-lighter";
        return MW.drive(tl, at, o.duration, function (t) {
          var p = io(t / o.duration), k = o.unit, off = (-155 + 310 * p) * k, env = Math.pow(Math.sin(Math.PI * t / o.duration), 0.5), g = Math.exp(-Math.pow(off / (60 * k), 2)), cx = el.offsetLeft + el.offsetWidth / 2, cy = el.offsetTop + el.offsetHeight / 2, x = cx + off;
          c.clearRect(0, 0, cv.w, cv.h); el.style.color = mix(0.35 * g * env); if (t <= 0 || t >= o.duration) return;
          var disc = function (X, R, a, cc) { var gr = c.createRadialGradient(X, cy, 0, X, cy, R); gr.addColorStop(0, "rgba(" + cc + "," + a + ")"); gr.addColorStop(1, "rgba(" + cc + ",0)"); c.fillStyle = gr; c.beginPath(); c.arc(X, cy, R, 0, 2 * Math.PI); c.fill(); };
          disc(x, (12 + 8 * g) * k, 0.8 * env, "214,204,255"); disc(x, (4 + 3 * g) * k, env, "255,255,255");
          c.save(); c.translate(x, cy); c.scale(1, 0.06); var sr = (70 + 40 * g) * k, sg = c.createRadialGradient(0, 0, 0, 0, 0, sr); sg.addColorStop(0, "rgba(255,255,255," + 0.9 * env + ")"); sg.addColorStop(1, "rgba(255,255,255,0)"); c.fillStyle = sg; c.beginPath(); c.arc(0, 0, sr, 0, 2 * Math.PI); c.fill(); c.restore();
          [[0.7, 10, 0.35], [-0.7, 7, 0.25], [-0.4, 14, 0.2]].forEach(function (q) { disc(cx + off * q[0] * -1, q[1] * k, q[2] * env, q[0] > 0 ? "139,123,255" : "61,214,245"); });
        });
      };
  MW.effectLensFlareSweep = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
</script>
