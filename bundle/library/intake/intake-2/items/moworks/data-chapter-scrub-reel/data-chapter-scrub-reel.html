  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.dataChapterScrubReel(q(".cs"), tl, 0, { cursor: ".ui-cursor" });

  Options (defaults in brackets):
      - reel: the column of chapter numbers
      - thumb: the slider thumb
      - fill: the track's fill
      - cursor: the cursor holding the thumb

  Notes: Progress p keyed 0 (0.5 s) → 0.30 (1.1 s) → 0.38 (1.4 s) → 1 (2.3 s), hold to 2.9 s, → 0 (3.6 s), each segment cubic-bezier(.65,0,.35,1). A reel 01–04 (mono 44 px, accent, pitch 60 px) in a 96 × 64 window (radius 8) sits at y = −p × 3 × pitch. A slider thumb (r 7, 8 while held) rides x = p along a 200 px track with an accent fill and 4 ticks; a cursor holds the thumb 0.4–3.7 s. Params: số chương (4) · bước cuộn (60 px) · các mốc tiến độ (0 → 0.3 → 0.38 → 1).
