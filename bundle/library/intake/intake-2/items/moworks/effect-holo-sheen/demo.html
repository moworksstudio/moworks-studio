<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Holographic Sheen - Demo</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
:root { --bg: #09090b; --fg: #fafafa; --card: #111114; --line: #27272a; }
* { box-sizing: border-box; }
html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); }
#demo { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); color: var(--fg); font-family: Inter, sans-serif; }
.center { position: absolute; inset: 0; display: grid; place-items: center; }
.row { display: flex; align-items: center; justify-content: center; gap: 48px; }
.col { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 32px; }
.h1 { font-size: 132px; font-weight: 800; letter-spacing: -0.035em; line-height: 1.1; text-align: center; }
.h2 { font-size: 84px; font-weight: 700; letter-spacing: -0.025em; line-height: 1.15; text-align: center; }
.p { font-size: 40px; line-height: 1.4; opacity: 0.72; text-align: center; }
.card { position: relative; border-radius: 28px; background: var(--card); border: 2px solid var(--line); overflow: hidden; }
.muted { opacity: 0.6; }

#demo { background: radial-gradient(100% 100% at 50% 40%, #1a1f33, #0b0d12); color: #e8ebf3; font-family: Inter, sans-serif; } .gm { position: absolute; inset: 0; }
.ui-cursor { position: absolute; left: 0; top: 0; z-index: 30; filter: drop-shadow(0 6px 10px rgba(0, 0, 0, 0.5)); }
.hs { position: absolute; inset: 0; display: grid; place-items: center; } .hs-c { width: 1000px; height: 600px; border-radius: 50px; background: linear-gradient(135deg, #2a3350, #151a28); border: 3px solid #3a4466; padding: 70px; box-sizing: border-box; }
.hs-c b { display: block; font-size: 64px; } .hs-c span { display: block; font-size: 40px; color: #9aa3b8; margin-top: 20px; } .hs-c strong { display: block; font-size: 130px; margin-top: 90px; }
    </style>
  </head>
  <body>
    <div id="demo" data-composition-id="mw-demo" data-start="0" data-width="1920" data-height="1080" data-duration="3.6">
<div class="gm hs"><div class="hs-c"><b>THẺ HỘI VIÊN</b><span>Hạng Bạch Kim</span><strong>990.000₫</strong></div></div>
      <script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.drive = MW.drive || function (tl, at, dur, fn) {
    var s = { t: 0 }; fn(0);
    tl.fromTo(s, { t: 0 }, { t: dur, duration: dur, ease: "none", immediateRender: false, onUpdate: function () { fn(s.t); } }, at);
    return at + dur;
  };
  var defaults = {"duration":1.3,"width":260,"angle":29,"opacity":0.55,"hue":55};
  var run = function (el, tl, at, o) {
        var band = document.createElement("div"), si = gsap.parseEase("sine.inOut");
        if (getComputedStyle(el).position === "static") el.style.position = "relative"; el.style.overflow = "hidden";
        band.style.cssText = "position:absolute;top:-60%;bottom:-60%;width:" + o.width + "px;pointer-events:none;mix-blend-mode:plus-lighter;z-index:0;background:linear-gradient(90deg, transparent, #ff4d6d, #ffd23d, #3ddc84, #3d7bff, transparent);";
        el.insertBefore(band, el.firstChild); Array.prototype.forEach.call(el.children, function (ch) { if (ch !== band && getComputedStyle(ch).position === "static") { ch.style.position = "relative"; ch.style.zIndex = "1"; } });
        return MW.drive(tl, at, o.duration, function (t) {
          var p = si(t / o.duration), W = el.offsetWidth, x = (-0.5 + 1.7 * p) * W;
          gsap.set(band, { x: x - o.width / 2, rotation: o.angle }); band.style.opacity = t > 0 && t < o.duration ? String(o.opacity * Math.pow(Math.sin(Math.PI * t / o.duration), 0.4)) : "0"; band.style.filter = "hue-rotate(" + o.hue * Math.sin(Math.PI * t / o.duration) + "deg)";
        });
      };
  MW.effectHoloSheen = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
      </script>
      <script>
        (function () {
          var tl = gsap.timeline({ paused: true });
          var q = function (s) { return document.querySelector(s); }, qa = function (s) { return Array.prototype.slice.call(document.querySelectorAll(s)); };
          MW.effectHoloSheen(q(".hs-c"), tl, 0.4, {}); MW.effectHoloSheen(q(".hs-c"), tl, 2.0, {});
          tl.set({}, {}, 3.6);
          // register only when every motion is ready (MW.pending: e.g. a WebGL texture still decoding), as HyperFrames asks of async builds
          var go = function () { window.__timelines = window.__timelines || {}; window.__timelines["mw-demo"] = tl; };
          if (window.MW && MW.pending && MW.pending.length) Promise.all(MW.pending).then(go, go); else go();
        })();
      </script>
    </div>
  </body>
</html>
