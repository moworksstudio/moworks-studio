<!--
  Magnetic Snap (Moworks Studio, the studio's own, written here).
  Source: Moworks Studio.
  Khối nhích chậm rồi bị hút vụt vào ô đích, vượt quá một chút rồi bám lại, vòng từ trường loé lên.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.motionMagneticSnap(q(".ms"), tl, 0.3, {});

  Options (defaults in brackets):
      - keys: [start, creep, past, rest] px ([0, 216, 1152, 1050])
      - target: the slot it snaps into
      - accent: 

  Notes: x keys 0 → 36 px at 260 ms (sine.inOut) → 192 at 484 ms (power2.in: pulled in, past the slot) → 175 at 620 ms (power2.out) (demo ×1.03). At the snap the block squashes: scaleX 1 − 0.14 s, scaleY 1 + 0.14 s, s a sine bump 440–640 ms. Target: three faint rings brighten with proximity²; one pulse ring 24 → 64 px fades over 470 ms from 484 ms. Params: duration (0.62 s) · x (175 px) · overshoot (17 px) · rings: vòng hút (bật/tắt). Creeps (sine.inOut), is pulled in past the slot (power2.in), settles back (power2.out) with a squash; the slot's rings brighten with proximity² and pulse once.
-->
