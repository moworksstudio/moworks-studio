<!--
  Iris Open (Moworks Studio, the studio's own, written here).
  Source: Moworks Studio.
  Một vòng tròn mở rộng từ tâm chủ thể để lộ nội dung, có viền màu chạy theo mép vòng.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.motionIrisOpen(q(".cd"), tl, 0.3, { exitAt: 1.8 });

  Options (defaults in brackets):
      - duration: s (0.76, ease-out quart)
      - pre: s the centre dot shows first (0.25)
      - x: centre share (0.5)
      - y: (0.5)
      - rim: px (6)
      - dot: px (16)
      - accent: 
      - exitAt: s (null)

  Notes: Circular clip centred on the subject: radius 0 → 1.5 × half the box diagonal (150 %) in 760 ms power3.out (easeOutQuart); a 1.5 px accent ring rides the edge until it passes the corners. Before it, a 4 px accent dot pops at the centre (250 ms back.out) and shrinks away as the iris opens (150 ms). Exit: fade 320 ms. Params: duration (0.76 s) · x, y: tâm vòng (50 %) · rim: viền mép (1.5 px) · ease (power3.out).
-->

<div class="st"><div class="cd"><b></b><i></i><i style="width:60%"></i></div></div>

  };
