  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.uiCornerBadgePop(q(".bdg"), tl, 0.6, {});

  Options (defaults in brackets):
      - duration: s (0.56)
      - peak: overshoot scale (1.2)
      - rotation: starting angle (−18°)

  Notes: Badge on the corner of a still 'Inbox' card: scale 0 → 1.2 → 0.95 → 1, rotation −18° → +5° → −2° → 0, opacity 0 → 1 in the first segment. Small DOM demo keys at 0 / 638 / 968 / 1254 ms of a 2200 ms loop (starting at 330 ms), each segment eased in-out; motion_ms 560 → scale the keys to 0 / 285 / 430 / 560 ms. The parent never moves. Params: duration (0.56 s) · peak (1.2) · rot đầu (−18°) · origin (giữa huy hiệu).
-->
