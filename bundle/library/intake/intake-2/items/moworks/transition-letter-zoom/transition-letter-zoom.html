<!--
  Mask Wipe through Letterforms (Moworks Studio, the studio's own, written here).
  Source: Moworks Studio.
  Cảnh mới hiện trong lòng một chữ to giữa khung, rồi chữ phóng lớn rất nhanh cho tới khi cảnh mới phủ kín.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.transitionLetterZoom(q(".tk-b"), tl, 0.9, { duration: 1.4 });

  Options (defaults in brackets):
      - letter: the letter or short word (B)
      - size: px at scale 1 (760)
      - scale: scale it reaches (30)
      - duration: s (0.9: 0.4 the letter appears, 0.5 it zooms, expo.in)
      - font: font family (Inter)
      - from: the outgoing scene

  Notes: Incoming scene shown only inside one huge heavy letter (or short word) centred on the frame: 0-400 ms the letter mask appears, 400-900 ms the mask scales 1 -> 30 easeInExpo until a stroke covers the frame, then the mask is removed. Align the letter's centre with the next subject. In AE: text layer as track matte. Params: letter (B) · scale (1 → 30) · duration (0.9 s) · ease (expo.in).
-->

<section class="tk-scene tk-a"><div class="tk-mark circle"></div><div class="tk-sc-text"><div class="tk-sc-letter">A</div><div class="tk-sc-cap">Cảnh mở đầu</div></div></section>
<section class="tk-scene tk-b"><div class="tk-mark square"></div><div class="tk-sc-text"><div class="tk-sc-letter">B</div><div class="tk-sc-cap">Cảnh tiếp theo</div></div></section>

<style>

</style>

<script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.drive = MW.drive || function (tl, at, dur, fn) {
    var s = { t: 0 }; fn(0);
    tl.fromTo(s, { t: 0 }, { t: dur, duration: dur, ease: "none", immediateRender: false, onUpdate: function () { fn(s.t); } }, at);
    return at + dur;
  };
  var defaults = {"letter":"B","size":760,"scale":30,"duration":0.9,"font":"Inter","from":null};
  var run = function (el, tl, at, o) {
        var out = o.from ? MW.el(o.from) : el.previousElementSibling, W = el.offsetWidth, H = el.offsetHeight, ez = gsap.parseEase("expo.in"), id = "mwlz" + Math.floor(at * 1000);
        // the letter as an SVG clip path in the page (so it uses the page's font), scaled about the frame centre
        var NS = "http://www.w3.org/2000/svg", svg = document.createElementNS(NS, "svg"), cp = document.createElementNS(NS, "clipPath"), tx = document.createElementNS(NS, "text");
        svg.setAttribute("width", "0"); svg.setAttribute("height", "0"); svg.style.position = "absolute";
        cp.setAttribute("id", id); cp.setAttribute("clipPathUnits", "userSpaceOnUse");
        tx.setAttribute("x", W / 2); tx.setAttribute("y", H / 2); tx.setAttribute("text-anchor", "middle"); tx.setAttribute("dominant-baseline", "central");
        tx.setAttribute("font-family", o.font); tx.setAttribute("font-weight", "900"); tx.setAttribute("font-size", o.size); tx.textContent = o.letter;
        cp.appendChild(tx); svg.appendChild(cp); el.parentNode.appendChild(svg);
        return MW.drive(tl, at, o.duration, function (t) {
          var a = 0.4 / 0.9 * o.duration, s = t < a ? 0.9 + 0.1 * (t / a) : 1 + (o.scale - 1) * ez((t - a) / (o.duration - a));
          tx.setAttribute("transform", "translate(" + W / 2 + " " + H / 2 + ") scale(" + s + ") translate(" + (-W / 2) + " " + (-H / 2) + ")");
          el.style.clipPath = t >= o.duration ? "none" : "url(#" + id + ")"; el.style.visibility = t > 0 ? "visible" : "hidden"; el.style.opacity = t > 0 ? String(Math.min(1, t / (0.15 * o.duration))) : "0";
          if (out) out.style.visibility = t >= o.duration ? "hidden" : "visible";
        });
      };
  MW.transitionLetterZoom = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
</script>
