  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline

    MW.textDiffRetype(q(".dr"), tl, 0, {});

  Options (defaults in brackets):
      - from: text before
      - to: text after (the shared start and end stay still)
      - perChar: s per changed character (0.14, ≤ 1.2 s)
      - at: s (0.6)
      - backAt: s it changes back (2.8)
      - underline: px (4)
      - accent: colour of new characters

  Notes: Common prefix / suffix stay still; the changed span is replaced in place left → right, one char per step (new char k replaces old char k; extras appear / vanish at the end), linear: demo 140 ms per changed char (max 1.2 s) from 0.6 s, GSAP TextPlugin 2 s. New chars pop 1.25 → 1 in 120 ms, accent, 1.5 px underline (offset 0.2 em); old chars waiting to change are muted (CSS 50 %); a 2 px accent caret marks the edit point. Demo reverses at 2.8 s; loop 4 s. Params: to: chuỗi mới · perChar: thời gian mỗi ký tự đổi (0.14 s, tối đa 1.2 s) · color: màu ký tự mới (màu nhấn) · underline (1.5 px).
-->
