<!--
  Metallic Foil Tilt (Moworks Studio, the studio's own, written here).
  Source: Moworks Studio.
  Thẻ nhũ nghiêng qua lại ±24°, một dải sáng nghiêng gồm ba vệt chạy ngược chiều nghiêng như ánh kim loại, mặt thẻ tối đi khi nghiêng nhiều.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.effectFoilSheenTilt(q(".fo"), tl, 0, {});

  Options (defaults in brackets):
      - tilt: degrees each way (24)
      - perspective: px (1900)
      - band: % width of the light band (60)
      - skew: degrees (12)

  Notes: Card 144x92 (78 % accent), perspective 380: rotateY 0 → −24° (0.3-1.2 s), hold, → +24° (1.6-2.7 s), hold, → 0 (3.1-3.9 s), power2.inOut. A skewed light band (soft strip 28 % wide at 28 %, bright 4.5 % at 75 %, thin 2.5 % at 55 %, skew 16 % of the width) sits at x = 58 % − (tilt / 24°) × 34 %, so it moves opposite the tilt; a dark overlay of 0.7 × |tilt in rad| (max ≈ 29 %). Chip outline, 'FOIL' type, soft shadow below. Params: tilt (±24°) · perspective (380) · band (28 % / 4.5 % / 2.5 %) · moves (0.9-1.1 s, power2.inOut). Tilts to −24°, holds, to +24°, holds, back to 0 (power2.inOut); the band sits at 58 % − (tilt / 24°) × 34 %, so it moves against the tilt; the face darkens 0.7 × |tilt in radians|.
-->

<div class="st"><div class="fo"><i></i><b>HỘI VIÊN</b><span>THẺ NHŨ BẠC</span></div></div>

<style>

</style>

<script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.drive = MW.drive || function (tl, at, dur, fn) {
    var s = { t: 0 }; fn(0);
    tl.fromTo(s, { t: 0 }, { t: dur, duration: dur, ease: "none", immediateRender: false, onUpdate: function () { fn(s.t); } }, at);
    return at + dur;
  };
  var defaults = {"tilt":24,"perspective":1900,"band":60,"skew":12};
  var run = function (el, tl, at, o) {
        if (getComputedStyle(el).position === "static") el.style.position = "relative"; el.style.overflow = "hidden";
        var io = gsap.parseEase("power2.inOut"), band = document.createElement("div"), dark = document.createElement("div");
        band.style.cssText = "position:absolute;top:-10%;bottom:-10%;width:" + o.band + "%;pointer-events:none;mix-blend-mode:screen;transform:skewX(-" + o.skew + "deg);background:linear-gradient(90deg,rgba(255,255,255,0) 0%,rgba(255,255,255,0.28) 30%,rgba(255,255,255,0.1) 45%,rgba(255,255,255,0.75) 52%,rgba(255,255,255,0.1) 58%,rgba(255,255,255,0.5) 70%,rgba(255,255,255,0) 100%);";
        dark.style.cssText = "position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;"; el.appendChild(band); el.appendChild(dark);
        var K = [[0, 0], [0.3, 0], [1.2, -o.tilt], [1.6, -o.tilt], [2.7, o.tilt], [3.1, o.tilt], [3.9, 0]];
        var A = function (t) { if (t <= 0) return 0; for (var i = 1; i < K.length; i++) if (t <= K[i][0]) return K[i - 1][1] + (K[i][1] - K[i - 1][1]) * io((t - K[i - 1][0]) / (K[i][0] - K[i - 1][0])); return 0; };
        return MW.drive(tl, at, 3.9, function (t) {
          var a = A(t); gsap.set(el, { rotationY: a, transformPerspective: o.perspective }); band.style.left = (58 - (a / o.tilt) * 34 - o.band / 2).toFixed(2) + "%"; dark.style.opacity = String((0.7 * Math.abs(a) * Math.PI / 180).toFixed(3));
        });
      };
  MW.effectFoilSheenTilt = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
</script>
