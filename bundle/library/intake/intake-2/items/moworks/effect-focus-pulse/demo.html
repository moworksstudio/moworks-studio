<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Focus Pulse - Demo</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
:root { --bg: #09090b; --fg: #fafafa; --card: #111114; --line: #27272a; }
* { box-sizing: border-box; }
html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); }
#demo { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); color: var(--fg); font-family: Inter, sans-serif; }
.center { position: absolute; inset: 0; display: grid; place-items: center; }
.row { display: flex; align-items: center; justify-content: center; gap: 48px; }
.col { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 32px; }
.h1 { font-size: 132px; font-weight: 800; letter-spacing: -0.035em; line-height: 1.1; text-align: center; }
.h2 { font-size: 84px; font-weight: 700; letter-spacing: -0.025em; line-height: 1.15; text-align: center; }
.p { font-size: 40px; line-height: 1.4; opacity: 0.72; text-align: center; }
.card { position: relative; border-radius: 28px; background: var(--card); border: 2px solid var(--line); overflow: hidden; }
.muted { opacity: 0.6; }

#demo { background: radial-gradient(100% 100% at 50% 45%, #1a1f33, #0b0d12); color: #e8ebf3; font-family: Inter, sans-serif; }
.st { position: absolute; inset: 0; display: grid; place-items: center; } .fp { position: relative; display: flex; gap: 50px; padding: 40px 60px; border-radius: 80px; background: #151a24; border: 3px solid #262c3a; } .fp i { width: 100px; height: 100px; border-radius: 30px; background: #2a3142; }
.fp i.on { background: linear-gradient(150deg, #a693ff, #6a4cf0); } .fp-t { position: absolute; left: 345px; top: -110px; width: 160px; margin-left: -30px; padding: 16px 0; border-radius: 22px; background: #ffd23d; color: #1b1440; font-size: 36px; font-weight: 900; text-align: center; opacity: 0; }
    </style>
  </head>
  <body>
    <div id="demo" data-composition-id="mw-demo" data-start="0" data-width="1920" data-height="1080" data-duration="2">
<div class="st"><div class="fp"><i></i><i></i><i></i><i class="on"></i><i></i><div class="fp-t">Mới</div></div></div>
      <script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.drive = MW.drive || function (tl, at, dur, fn) {
    var s = { t: 0 }; fn(0);
    tl.fromTo(s, { t: 0 }, { t: dur, duration: dur, ease: "none", immediateRender: false, onUpdate: function () { fn(s.t); } }, at);
    return at + dur;
  };
  var defaults = {"radius":80,"scale":[0.5,2.4],"opacity":0.8,"stroke":8,"duration":0.68,"accent":"#8b7bff","tooltip":null,"tipAt":0.5,"tipRise":20};
  var run = function (el, tl, at, o) {
        var host = el.parentNode; if (getComputedStyle(host).position === "static") host.style.position = "relative";
        var ring = document.createElement("div"), tip = o.tooltip ? host.querySelector(o.tooltip) : null, p2 = gsap.parseEase("power2.out"), cx = el.offsetLeft + el.offsetWidth / 2, cy = el.offsetTop + el.offsetHeight / 2;
        ring.style.cssText = "position:absolute;border-radius:50%;pointer-events:none;box-sizing:border-box;opacity:0;border:" + o.stroke + "px solid " + o.accent + ";"; host.appendChild(ring);
        return MW.drive(tl, at, Math.max(o.duration, o.tipAt + 0.2), function (t) {
          var u = Math.min(1, t / o.duration), r = o.radius * (o.scale[0] + (o.scale[1] - o.scale[0]) * p2(u));
          ring.style.width = ring.style.height = 2 * r + "px"; ring.style.left = cx - r + "px"; ring.style.top = cy - r + "px"; ring.style.opacity = t > 0 && u < 1 ? String(o.opacity * (1 - p2(u))) : "0";
          gsap.set(el, { scale: 1 + 0.06 * Math.sin(Math.PI * Math.min(1, t / 0.24)) });
          if (tip) { var w = p2(Math.max(0, Math.min(1, (t - o.tipAt) / 0.2))); tip.style.opacity = String(w); gsap.set(tip, { y: o.tipRise * (1 - w) }); }
        });
      };
  MW.effectFocusPulse = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
      </script>
      <script>
        (function () {
          var tl = gsap.timeline({ paused: true });
          var q = function (s) { return document.querySelector(s); }, qa = function (s) { return Array.prototype.slice.call(document.querySelectorAll(s)); };
          MW.effectFocusPulse(q(".fp i.on"), tl, 0.4, { tooltip: ".fp-t" });
          tl.set({}, {}, 2);
          // register only when every motion is ready (MW.pending: e.g. a WebGL texture still decoding), as HyperFrames asks of async builds
          var go = function () { window.__timelines = window.__timelines || {}; window.__timelines["mw-demo"] = tl; };
          if (window.MW && MW.pending && MW.pending.length) Promise.all(MW.pending).then(go, go); else go();
        })();
      </script>
    </div>
  </body>
</html>
