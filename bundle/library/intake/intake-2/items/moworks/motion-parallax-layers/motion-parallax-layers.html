<!--
  Parallax Layers (Moworks Studio, the studio's own, written here).
  Source: Moworks Studio.
  Ba lớp tiền cảnh, trung cảnh, hậu cảnh cùng trôi lên nhưng mỗi lớp một quãng khác nhau (40 / 25 / 10 px) để tạo chiều sâu.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.motionParallaxLayers(q(".pl"), tl, 0, {});

  Options (defaults in brackets):
      - duration: s per pass, linear (1.2)
      - passes: (3)
      - unit: px per reference unit (5); each layer's travel in data-travel (40 / 25 / 10)

  Notes: 3 layers, all start together, 1.2 s linear (mapped to scroll progress): front y +18 → −22 px (40 px), middle +11 → −14 (25 px), back +4 → −6 (10 px). Demo loops the pass. Params: ids: trước → sau · travel ([40, 25, 10] px) · duration (1.2 s) · ease (none).
-->

<div class="pl"><div data-travel="10" style="left:140px;top:120px;width:520px;height:520px;border-radius:50%;background:#2a2350"></div><div data-travel="25" style="left:560px;top:250px;width:440px;height:300px;background:#3a3566"></div><div data-travel="40" style="left:380px;top:330px;width:380px;height:240px;background:linear-gradient(160deg,#a693ff,#6a4cf0)"></div></div>

<style>

</style>

<script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.drive = MW.drive || function (tl, at, dur, fn) {
    var s = { t: 0 }; fn(0);
    tl.fromTo(s, { t: 0 }, { t: dur, duration: dur, ease: "none", immediateRender: false, onUpdate: function () { fn(s.t); } }, at);
    return at + dur;
  };
  var defaults = {"duration":1.2,"passes":3,"unit":5};
  var run = function (el, tl, at, o) {
        var Ls = Array.prototype.slice.call(el.querySelectorAll("[data-travel]"));
        return MW.drive(tl, at, o.duration * o.passes, function (t) { var p = (t / o.duration) % 1; Ls.forEach(function (l) { var tr = parseFloat(l.getAttribute("data-travel")) * o.unit; gsap.set(l, { y: tr * (0.45 - p) }); }); });
      };
  MW.motionParallaxLayers = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
</script>
