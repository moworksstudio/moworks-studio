  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.textHoverWordLift(q(".tk-head"), tl, 0, {});

  Options (defaults in brackets):
      - lift: em (0.2)
      - stiffness: (400)
      - damping: (26): ζ ≈ 0.65, ~0.3 s
      - from: s the first word is visited (0.9)
      - to: s the last (3.5)
      - accent: 
      - cursor: 
      - loop: s (4.6)

  Notes: Sentence 34 px, up to 3 lines. Scripted cursor visits each word centre in order, evenly from 0.9 s to 3.5 s, resting ±min(0.18, 1.3 / n) s on each, then exits by 4.0 s. The hovered word rises 0 → −7 px (recipe −6) on a spring k 400, c 26 (ζ≈0.65, settles ~0.3 s) and back when left; colour tints to accent and a 1.5 px accent underline fades in, both by lift / 7. Loop 4.6 s. Params: độ nhấc (7 px) · lò xo (k 400, c 26) · nhịp ghé mỗi từ. The pointer rests ± min(0.18, 1.3 / n) s on each word in turn; the hovered word lifts on the spring, tints and gets a fading underline.
-->
