  Source: Moworks Studio.
  Các ký tự sáng lên theo thứ tự ngẫu nhiên như sao nhấp nháy, mỗi ký tự kèm một tia lấp lánh nhỏ.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.textRandomOrderFade(q(".tk-head"), tl, 0, {});

  Options (defaults in brackets):
      - duration: s per letter (0.3, ease-out quad)
      - stagger: s in a seeded order (0.12)
      - cap: s (0.8)
      - seed: (11)
      - sparkle: a small four-point sparkle at each letter's top right
      - accent: 
      - start: s (0.3)
      - outAt: s (2.65)
      - loop: s (3)

  Notes: Split chars; seeded shuffled order (demo seed 11); the k-th char in that order starts at 0.3 s + k × 20–40 ms (whole build ≈1 s; demo up to 120 ms, capped 1.1 s total); opacity 0 → 1 over 0.3 s easeOutQuad. Demo adds a small 4-point accent sparkle at the char's top-right, growing and shrinking over 0.5 s (radius 5 px × sin). Loop exit: fade 2.65–2.95 s; loop 3 s. Params: duration (0.3 s) · total: cả đợt (1 s) · seed: thứ tự ngẫu nhiên · sparkle: tia lấp lánh (bật).
-->
