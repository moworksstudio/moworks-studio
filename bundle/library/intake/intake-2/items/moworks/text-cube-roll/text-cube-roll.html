<!--
  3D Roll Flip (Moworks Studio, the studio's own, written here).
  Source: Moworks Studio.
  Mỗi chữ cái là một khối hộp nhỏ lăn lên 90° nối nhau, mặt dưới mang chữ kiểu khác màu nhấn lật ra phía trước, rồi lăn về.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.textCubeRoll(q(".tk-head"), tl, 0, {});

  Options (defaults in brackets):
      - at: s each cube turns (0.55; 0.03 s apart, ≤ 0.6 s)
      - back: s they turn back (2.15)
      - font: the second face's font (a serif)
      - color: its colour
      - perspective: em (11)

  Notes: Each char is a cube as deep as its glyph box: front face = normal text; bottom face = same char in accent serif 700. On cue (0.55 s) each cube turns rotateX 0 → 90° about its centre (bottom face comes to the front) in 0.4 s power2.inOut, delay 30 ms × i (capped at 0.6 s total); front fades 1 → 0.3, new face 0.3 → 1 during the turn. Reverse from 2.15 s. Demo perspective 520 px at 46 px. Loop 3.4 s. Params: góc (0 → 90°) · thời gian (0.4 s) · cách nhau (30 ms) · kiểu chữ mặt sau (serif màu nhấn).
-->

<div class="tk-stage"><div><h1 class="tk-head ">Lăn đổi mặt</h1></div></div><svg class="ui-cursor" viewBox="0 0 32 32" width="64" height="64"><path d="M6 3 L6 25 L12 19.5 L16 28.5 L20 26.8 L16 18 L24 18 Z" fill="#fff" stroke="#111" stroke-width="1.6" stroke-linejoin="round"/></svg>

<style>

</style>

<script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.split = MW.split || function (el, mode) {
    el = MW.el(el);
    if (el.__mwSplit) return el.__mwSplit;
    var seg = typeof Intl !== "undefined" && Intl.Segmenter ? new Intl.Segmenter("vi", { granularity: "grapheme" }) : null;
    var graphemes = function (s) { if (seg) { var out = []; var it = seg.segment(s)[Symbol.iterator](), r; while (!(r = it.next()).done) out.push(r.value.segment); return out; } return Array.from(s); };
    var res = { chars: [], words: [], lines: [] };
    var walk = function (node) {
      var kids = Array.prototype.slice.call(node.childNodes);
      for (var k = 0; k < kids.length; k++) {
        var n = kids[k];
        if (n.nodeType === 1) { if (n.tagName === "BR") continue; walk(n); continue; }
        if (n.nodeType !== 3) continue;
        var text = n.nodeValue.normalize("NFC"), frag = document.createDocumentFragment();
        var parts = text.split(/(\s+)/);
        for (var p = 0; p < parts.length; p++) {
          var part = parts[p];
          if (!part) continue;
          if (/^\s+$/.test(part)) { frag.appendChild(document.createTextNode(part)); continue; }
          var w = document.createElement("span");
          w.className = "mw-w"; w.style.display = "inline-block"; w.style.whiteSpace = "nowrap";
          if (mode === "words") w.textContent = part;
          else { var gs = graphemes(part); for (var g = 0; g < gs.length; g++) { var c = document.createElement("span"); c.className = "mw-ch"; c.style.display = "inline-block"; c.textContent = gs[g]; w.appendChild(c); res.chars.push(c); } }
          res.words.push(w); frag.appendChild(w);
        }
        node.replaceChild(frag, n);
      }
    };
    walk(el);
    var top = null, line = null;
    for (var i = 0; i < res.words.length; i++) { var y = res.words[i].offsetTop; if (top === null || Math.abs(y - top) > 2) { top = y; line = []; res.lines.push(line); } line.push(res.words[i]); }
    el.__mwSplit = res;
    return res;
  };
  MW.drive = MW.drive || function (tl, at, dur, fn) {
    var s = { t: 0 }; fn(0);
    tl.fromTo(s, { t: 0 }, { t: dur, duration: dur, ease: "none", immediateRender: false, onUpdate: function () { fn(s.t); } }, at);
    return at + dur;
  };
  var defaults = {"at":0.55,"back":2.15,"font":"'Playfair Display', serif","color":"#a99bff","perspective":11};
  var run = function (el, tl, at, o) {
        var ch = MW.split(el, "chars").chars, n = ch.length, dl = Math.min(0.03, 0.6 / Math.max(1, n - 1)), io = gsap.parseEase("power2.inOut"), fs = parseFloat(getComputedStyle(el).fontSize), faces = [];
        ch.forEach(function (c) {
          var g = c.textContent; c.textContent = ""; c.style.position = "relative"; c.style.transformStyle = "preserve-3d";
          var f = document.createElement("span"), b = document.createElement("span"); f.textContent = g; b.textContent = g; f.style.display = "inline-block"; b.style.cssText = "position:absolute;left:0;top:0;width:100%;text-align:center;font-family:" + o.font + ";font-weight:700;color:" + o.color + ";";
          c.appendChild(f); c.appendChild(b); faces.push([f, b]);
        });
        var d = 0.5 * fs * 0.62;
        return MW.drive(tl, at, o.back + 0.4 + 0.6, function (t) {
          faces.forEach(function (F, i) {
            var a = 90 * io(Math.max(0, Math.min(1, (t - o.at - dl * i) / 0.4))) * (1 - io(Math.max(0, Math.min(1, (t - o.back - dl * i) / 0.4)))), u = a / 90, pp = o.perspective * fs;
            F[0].style.transform = "perspective(" + pp + "px) translateZ(" + (-d) + "px) rotateX(" + a + "deg) translateZ(" + d + "px)"; F[0].style.opacity = String(1 - 0.7 * u);
            F[1].style.transform = "perspective(" + pp + "px) translateZ(" + (-d) + "px) rotateX(" + (a - 90) + "deg) translateZ(" + d + "px)"; F[1].style.opacity = String(u < 0.01 ? 0 : 0.3 + 0.7 * u);
          });
        });
      };
  MW.textCubeRoll = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
</script>
