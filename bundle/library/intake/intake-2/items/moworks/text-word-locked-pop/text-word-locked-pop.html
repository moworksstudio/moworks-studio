    MW.textWordLockedPop(q(".tk-head"), tl, 0, { wave: ".wv i" });

      - times: s each word is spoken (word timestamps)
      - lead: s the pop comes before the word (0.3; 0.2–0.6)
      - duration: s (0.25, back.out)
      - spoken: s a word lasts on the waveform (0.55)
      - wave: waveform bars that light as words are heard (optional)
      - accent: 
      - outAt: s (3.6)
      - loop: s (4)

  Notes: Each word appears over 250 ms back.out (scale 0 -> 1), starting 0.2-0.6 s before it is spoken (word-level timestamps). Demo: 4 words at 0.3 / 1.1 / 2.0 / 2.9 s, the third in the accent, over a waveform that lights while each word is heard. Params: duration (0.25 s, back.out) · lead: sớm hơn lời (0.2–0.6 s). Take the times from the voice clip's word timestamps.
