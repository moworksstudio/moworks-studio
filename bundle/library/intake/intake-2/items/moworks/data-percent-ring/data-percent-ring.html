<!--
  Percent With Ring (Moworks Studio, the studio's own, written here).
  Source: Moworks Studio.
  Vòng tròn tiến độ và con số phần trăm ở giữa cùng chạy từ một giá trị, từ 0 lên 87 % trong 1.6 giây.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.dataPercentRing(q(".pr"), tl, 0, {});

  Options (defaults in brackets):
      - value: % (87)
      - duration: s (1.6), ease-out quad
      - start: s (0.3)
      - resetAt: s (3.05)
      - loop: s (3.6)

  Notes: Ring (pathLength 100, round cap, from 12 o'clock clockwise; demo r 58 px, 8 px stroke on a dim track, a small dot at the tip) and the centred number driven by one value: 0 → 87 over 1.6 s easeOutQuad (CSS cubic-bezier(.5,1,.89,1), labelled power2.out); stroke-dashoffset 100 → 13; the number rounded, tabular, '%' at half size and muted. Demo from 0.3 s, reset 3.05–3.6 s; loop 3.6 s. Params: value: phần trăm đích (87) · duration (1.6 s) · ease (easeOutQuad) · stroke: độ dày vòng (8 px).
-->

<div class="pr"><svg viewBox="0 0 600 600" width="600" height="600"><circle cx="300" cy="300" r="270" fill="none" stroke="#222a42" stroke-width="34"/><circle class="pr-arc" cx="300" cy="300" r="270" fill="none" stroke="#8b7bff" stroke-width="34" stroke-linecap="round" transform="rotate(-90 300 300)"/><circle class="pr-dot" cx="300" cy="30" r="10" fill="#fff"/></svg>
<div class="pr-c"><div class="pr-num">0<small>%</small></div></div><div class="pr-lab">khách hàng hài lòng</div></div>

<style>

</style>

<script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.drive = MW.drive || function (tl, at, dur, fn) {
    var s = { t: 0 }; fn(0);
    tl.fromTo(s, { t: 0 }, { t: dur, duration: dur, ease: "none", immediateRender: false, onUpdate: function () { fn(s.t); } }, at);
    return at + dur;
  };
  var defaults = {"value":87,"duration":1.6,"start":0.3,"resetAt":3.05,"loop":3.6};
  var run = function (el, tl, at, o) {
        var arc = el.querySelector(".pr-arc"), dot = el.querySelector(".pr-dot"), num = el.querySelector(".pr-num"), pq = gsap.parseEase("power1.out"), R = +arc.getAttribute("r"), C = 2 * Math.PI * R;
        arc.setAttribute("stroke-dasharray", C + " " + C);
        return MW.drive(tl, at, o.loop, function (t) {
          var v = o.value * pq(Math.max(0, Math.min(1, (t - o.start) / o.duration))), f = 1 - Math.max(0, Math.min(1, (t - o.resetAt) / 0.55)), a = -Math.PI / 2 + 2 * Math.PI * v / 100;
          arc.setAttribute("stroke-dashoffset", String(C * (1 - v / 100))); dot.setAttribute("cx", 300 + R * Math.cos(a)); dot.setAttribute("cy", 300 + R * Math.sin(a)); dot.style.opacity = v > 0.5 ? "1" : "0";
          num.firstChild.nodeValue = String(Math.round(v)); el.style.opacity = String(f);
        });
      };
  MW.dataPercentRing = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
</script>
