<!--
  Handheld Drift (Moworks Studio, the studio's own, written here).
  Source: Moworks Studio.
  Cả khung trôi chậm không đều như máy quay cầm tay, biên độ rất nhỏ.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.motionHandheldDrift(q(".tk-cam"), tl, 0, { duration: 4 });

  Options (defaults in brackets):
      - duration: s it drifts
      - amp: px scale of the sines (9: x = 18 sin 1.7t + 9 sin 3.1t, y = 12 sin 2.3t + 6 sin 4.7t)
      - roll: degrees (0.57)
      - overscan: scale hiding the edges (1.05)

  Notes: Full-frame group offset by a sum of sines: recipe x = sum a_i sin(2 pi t / T_i), T 1.7 / 2.9 / 4.3 s, amplitude 2-4 px. Demo: x = 6 sin(1.7 t) + 3 sin(3.1 t), y = 4 sin(2.3 t) + 2 sin(4.7 t) px, roll 0.01 sin(1.3 t) rad, scale 1.05 to hide the edges. Params: amp (2–4 px) · periods (1.7 / 2.9 / 4.3 s) · overscan (1.05).
-->

<script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.drive = MW.drive || function (tl, at, dur, fn) {
    var s = { t: 0 }; fn(0);
    tl.fromTo(s, { t: 0 }, { t: dur, duration: dur, ease: "none", immediateRender: false, onUpdate: function () { fn(s.t); } }, at);
    return at + dur;
  };
  var defaults = {"duration":4,"amp":9,"roll":0.57,"overscan":1.05};
  var run = function (el, tl, at, o) {
        return MW.drive(tl, at, o.duration, function (t) {
          var a = o.amp;
          gsap.set(el, { x: a * (2 * Math.sin(1.7 * t) + Math.sin(3.1 * t)), y: a * (1.33 * Math.sin(2.3 * t) + 0.67 * Math.sin(4.7 * t)), rotation: o.roll * Math.sin(1.3 * t), scale: o.overscan });
        });
      };
  MW.motionHandheldDrift = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
</script>
