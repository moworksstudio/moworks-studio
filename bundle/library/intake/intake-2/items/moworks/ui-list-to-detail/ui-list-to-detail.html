  Source: Moworks Studio.
  Bấm một dòng, dòng đó mở rộng thành bảng chi tiết, ảnh nhỏ thành ảnh lớn và chữ dời xuống dưới ảnh, các dòng khác mờ còn 25 %.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.uiListToDetail(q(".gm"), tl, 0, {});

  Options (defaults in brackets):
      - loop: s (3.2)

  Notes: List rows 128x38 r8 at (24, 40 + 46 i). Click row 2 at 0.34 s; it morphs over 0.45-1.27 s (820 ms) power2.inOut: rect (24,86,128,38) → (64,24,192,148), radius 8 → 15, padding 5 → 10; thumbnail 28x28 → full width x 64 (r5 → 9); title moves from beside the thumb to below the image (60 → 100 wide); body lines fade in over the last 30 %. Other rows fade to 25 %; a dashed slot stays at the origin. Back over 2.15-2.75 s. Params: from / to: khung dòng, khung chi tiết · duration (0.82 s) · radius (8 → 15) · siblings (25 %) · ease (power2.inOut).
-->
