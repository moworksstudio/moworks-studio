<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Light-Leak Title Burn - Demo</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
:root { --bg: #09090b; --fg: #fafafa; --card: #111114; --line: #27272a; }
* { box-sizing: border-box; }
html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); }
#demo { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); color: var(--fg); font-family: Inter, sans-serif; }
.center { position: absolute; inset: 0; display: grid; place-items: center; }
.row { display: flex; align-items: center; justify-content: center; gap: 48px; }
.col { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 32px; }
.h1 { font-size: 132px; font-weight: 800; letter-spacing: -0.035em; line-height: 1.1; text-align: center; }
.h2 { font-size: 84px; font-weight: 700; letter-spacing: -0.025em; line-height: 1.15; text-align: center; }
.p { font-size: 40px; line-height: 1.4; opacity: 0.72; text-align: center; }
.card { position: relative; border-radius: 28px; background: var(--card); border: 2px solid var(--line); overflow: hidden; }
.muted { opacity: 0.6; }

#demo { background: #0b0d12; color: #e8ebf3; font-family: Inter, sans-serif; }
.lb { position: absolute; inset: 0; overflow: hidden; background: radial-gradient(100% 100% at 50% 60%, #1c1a2c, #07070c); } .lb-title { position: absolute; inset: 0; display: grid; place-items: center; font-size: 200px; font-weight: 800; color: #fff; z-index: 3; opacity: 0; letter-spacing: -0.02em; }
    </style>
  </head>
  <body>
    <div id="demo" data-composition-id="mw-demo" data-start="0" data-width="1920" data-height="1080" data-duration="3.8">
<div class="lb"><div class="lb-title">BÌNH MINH</div></div>
      <script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.rand = MW.rand || function (seed) {
    var a = typeof seed === "string" ? MW.hash(seed) : (seed >>> 0) || 1;
    return function () { a = (a + 0x6d2b79f5) >>> 0; var t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  };
  MW.hash = MW.hash || function (s) { var h = 2166136261; s = String(s); for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; };
  MW.noise = MW.noise || function (seed) {
    var r = MW.rand(seed), v = []; for (var i = 0; i < 512; i++) v.push(r() * 2 - 1);
    return function (t) { var i = Math.floor(t), f = t - i, a = v[((i % 512) + 512) % 512], b = v[(((i + 1) % 512) + 512) % 512], s = f * f * (3 - 2 * f); return a + (b - a) * s; };
  };
  MW.bezier = MW.bezier || function (x1, y1, x2, y2) {
    var cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx, cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
    var X = function (t) { return ((ax * t + bx) * t + cx) * t; }, Y = function (t) { return ((ay * t + by) * t + cy) * t; }, dX = function (t) { return (3 * ax * t + 2 * bx) * t + cx; };
    return function (p) {
      if (p <= 0) return 0; if (p >= 1) return 1;
      var t = p, i, d;
      for (i = 0; i < 8; i++) { d = X(t) - p; if (Math.abs(d) < 1e-6) return Y(t); var s = dX(t); if (Math.abs(s) < 1e-6) break; t -= d / s; }
      var lo = 0, hi = 1; t = p;
      for (i = 0; i < 40; i++) { d = X(t); if (Math.abs(d - p) < 1e-6) break; if (d < p) lo = t; else hi = t; t = (lo + hi) / 2; }
      return Y(t);
    };
  };
  MW.CSS_EASE = { ease: [0.25, 0.1, 0.25, 1], easeIn: [0.42, 0, 1, 1], easeOut: [0, 0, 0.58, 1], easeInOut: [0.42, 0, 0.58, 1] };
  MW.EASES = MW.EASES || { "css-ease": [0.25, 0.1, 0.25, 1], "css-in": [0.42, 0, 1, 1], "css-out": [0, 0, 0.58, 1], "css-in-out": [0.42, 0, 0.58, 1],
    md3: [0.2, 0, 0, 1], "md3-emph": [0.05, 0.7, 0.1, 1], "md3-acc": [0.3, 0, 1, 1], "md3-dec": [0, 0, 0, 1], whip: [0.9, 0, 0.1, 1], glide: [0.4, 0, 0.2, 1],
    house: [0.83, 0, 0.17, 1], "in-out": [0.65, 0, 0.35, 1] };
  MW.ez = MW.ez || function (name) {
    if (typeof name === "function") return name;
    var b = MW.EASES[name]; if (b) return MW.bezier(b[0], b[1], b[2], b[3]);
    var m = /^cubic-bezier\(([^)]+)\)$/.exec(name || ""); if (m) { var v = m[1].split(",").map(Number); return MW.bezier(v[0], v[1], v[2], v[3]); }
    return gsap.parseEase(name || "none");
  };
  MW.drive = MW.drive || function (tl, at, dur, fn) {
    var s = { t: 0 }; fn(0);
    tl.fromTo(s, { t: 0 }, { t: dur, duration: dur, ease: "none", immediateRender: false, onUpdate: function () { fn(s.t); } }, at);
    return at + dur;
  };
  var defaults = {"cutAt":1,"offAt":3.15,"glow":"#8b7bff","title":".lb-title","loop":3.8,"seed":3};
  var run = function (el, tl, at, o) {
        var title = el.querySelector(o.title), blobs = [], white = document.createElement("div"), io = MW.ez("in-out"), out = gsap.parseEase("power2.out"), nz = MW.noise(o.seed);
        [["255,214,120", 0.2, 0.35], ["139,123,255", 0.6, 0.55], ["255,190,90", 0.85, 0.3]].forEach(function (b, i) { var d = document.createElement("div"); d.style.cssText = "position:absolute;border-radius:50%;pointer-events:none;mix-blend-mode:screen;background:radial-gradient(circle, rgba(" + b[0] + ",0.95), rgba(" + b[0] + ",0) 70%);"; el.appendChild(d); blobs.push({ d: d, x: b[1], y: b[2], i: i }); });
        white.style.cssText = "position:absolute;inset:0;background:#fff;pointer-events:none;opacity:0;"; el.appendChild(white); el.appendChild(title);
        var cl = function (a, b, t) { return Math.max(0, Math.min(1, (t - a) / (b - a))); };
        return MW.drive(tl, at, o.loop, function (t) {
          var leak = io(cl(0.25, 0.9, t)) * (1 - io(cl(3.15, 3.65, t))), burn = t < 1 ? io(cl(0.55, 1.0, t)) : 1 - io(cl(1.0, 1.55, t)), s = 0.35 * leak + 0.55 * burn, W = el.offsetWidth, Hh = el.offsetHeight;
          blobs.forEach(function (b) { var R = (420 + 600 * burn) * (0.8 + 0.2 * b.i), x = (b.x + 0.08 * nz(t * 0.6 + b.i * 10)) * W, y = (b.y + 0.08 * nz(t * 0.6 + b.i * 10 + 5)) * Hh; b.d.style.width = b.d.style.height = 2 * R + "px"; b.d.style.left = (x - R) + "px"; b.d.style.top = (y - R) + "px"; b.d.style.opacity = String(Math.min(1, s * 1.4)); });
          white.style.opacity = String(0.85 * burn);
          var on = t >= o.cutAt && t < o.offAt + 0.45, g = 18 - 14 * out(cl(o.cutAt, o.cutAt + 0.9, t)), f = 1 - cl(o.offAt, o.offAt + 0.45, t);
          title.style.opacity = on ? String(f) : "0"; title.style.textShadow = "0 0 " + g * 3 + "px " + o.glow + ", 0 0 " + g + "px " + o.glow;
        });
      };
  MW.textLightLeakBurn = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
      </script>
      <script>
        (function () {
          var tl = gsap.timeline({ paused: true });
          var q = function (s) { return document.querySelector(s); }, qa = function (s) { return Array.prototype.slice.call(document.querySelectorAll(s)); };
          MW.textLightLeakBurn(q(".lb"), tl, 0, {});
          tl.set({}, {}, 3.8);
          // register only when every motion is ready (MW.pending: e.g. a WebGL texture still decoding), as HyperFrames asks of async builds
          var go = function () { window.__timelines = window.__timelines || {}; window.__timelines["mw-demo"] = tl; };
          if (window.MW && MW.pending && MW.pending.length) Promise.all(MW.pending).then(go, go); else go();
        })();
      </script>
    </div>
  </body>
