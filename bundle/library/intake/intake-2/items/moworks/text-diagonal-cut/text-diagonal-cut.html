<!--
  Diagonal Cut Reveal (Moworks Studio, the studio's own, written here).
  Source: Moworks Studio.
  Một mép cắt nghiêng 15° chạy qua từng từ để lộ chữ, kèm lưỡi màu nhấn trên mép, các từ cách nhau 0.12 giây.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.textDiagonalCut(q(".tk-head"), tl, 0.3, { exit: 2.4 });

  Options (defaults in brackets):
      - angle: degrees the edge leans (15)
      - duration: s per word (0.7), expo.out
      - stagger: s between words (0.12)
      - blade: px of the accent blade (12)
      - color: blade colour
      - exit: s after the start when the edge sweeps on, hiding (0.5 s expo.in, 0.08 s apart; null: stay)

  Notes: Per word (120 ms apart): clip polygon with a leading edge leaning 15° (top ahead of bottom by height × tan15) moves from left of the word to past its right edge, 0.7 s expo.out; a 5 px accent blade rides the edge and fades over 0.3 s after. Exit: the edge sweeps on hiding the word (0.5 s expo.in, 80 ms apart). Demo: in from 0.3 s, blade fades 0.6–0.9 s after each word starts, exit from 2.8 s; loop 3.8 s. Params: angle: độ nghiêng mép (15°) · duration (0.7 s, expo.out) · stagger: mỗi từ (0.12 s) · blade: lưỡi màu nhấn (5 px).
-->

<div class="tk-stage"><div><h1 class="tk-head ">Cắt chéo từng từ</h1></div></div>

<style>

</style>

<script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.split = MW.split || function (el, mode) {
    el = MW.el(el);
    if (el.__mwSplit) return el.__mwSplit;
    var seg = typeof Intl !== "undefined" && Intl.Segmenter ? new Intl.Segmenter("vi", { granularity: "grapheme" }) : null;
    var graphemes = function (s) { if (seg) { var out = []; var it = seg.segment(s)[Symbol.iterator](), r; while (!(r = it.next()).done) out.push(r.value.segment); return out; } return Array.from(s); };
    var res = { chars: [], words: [], lines: [] };
    var walk = function (node) {
      var kids = Array.prototype.slice.call(node.childNodes);
      for (var k = 0; k < kids.length; k++) {
        var n = kids[k];
        if (n.nodeType === 1) { if (n.tagName === "BR") continue; walk(n); continue; }
        if (n.nodeType !== 3) continue;
        var text = n.nodeValue.normalize("NFC"), frag = document.createDocumentFragment();
        var parts = text.split(/(\s+)/);
        for (var p = 0; p < parts.length; p++) {
          var part = parts[p];
          if (!part) continue;
          if (/^\s+$/.test(part)) { frag.appendChild(document.createTextNode(part)); continue; }
          var w = document.createElement("span");
          w.className = "mw-w"; w.style.display = "inline-block"; w.style.whiteSpace = "nowrap";
          if (mode === "words") w.textContent = part;
          else { var gs = graphemes(part); for (var g = 0; g < gs.length; g++) { var c = document.createElement("span"); c.className = "mw-ch"; c.style.display = "inline-block"; c.textContent = gs[g]; w.appendChild(c); res.chars.push(c); } }
          res.words.push(w); frag.appendChild(w);
        }
        node.replaceChild(frag, n);
      }
    };
    walk(el);
    var top = null, line = null;
    for (var i = 0; i < res.words.length; i++) { var y = res.words[i].offsetTop; if (top === null || Math.abs(y - top) > 2) { top = y; line = []; res.lines.push(line); } line.push(res.words[i]); }
    el.__mwSplit = res;
    return res;
  };
  MW.drive = MW.drive || function (tl, at, dur, fn) {
    var s = { t: 0 }; fn(0);
    tl.fromTo(s, { t: 0 }, { t: dur, duration: dur, ease: "none", immediateRender: false, onUpdate: function () { fn(s.t); } }, at);
    return at + dur;
  };
  var defaults = {"angle":15,"duration":0.7,"stagger":0.12,"blade":12,"color":"#8b7bff","exit":null};
  var run = function (el, tl, at, o) {
        var ws = MW.split(el, "words").words, tn = Math.tan(o.angle * Math.PI / 180), ex = gsap.parseEase("expo.out"), ei = gsap.parseEase("expo.in"), blades = [];
        el.style.position = "relative";
        ws.forEach(function () { var b = document.createElement("div"); b.style.cssText = "position:absolute;pointer-events:none;width:" + o.blade + "px;background:" + o.color + ";opacity:0;transform-origin:50% 100%;"; el.appendChild(b); blades.push(b); });
        var end = (ws.length - 1) * o.stagger + o.duration + (o.exit == null ? 0.3 : o.exit + 0.5 + (ws.length - 1) * 0.08);
        return MW.drive(tl, at, end, function (t) {
          ws.forEach(function (w, i) {
            var fs = parseFloat(getComputedStyle(w).fontSize), wh = w.offsetHeight + 0.6 * fs, top = -0.35 * fs, lean = wh * tn, W = w.offsetWidth;
            var u = t - i * o.stagger, ue = o.exit == null ? -1 : t - o.exit - i * 0.08, pts;
            if (ue >= 0) { var x = -lean + (W + 2 * lean) * ei(Math.min(1, ue / 0.5)); pts = [[x + lean, top], [W + lean + 20, top], [W + lean + 20, top + wh], [x, top + wh]]; }
            else { var e = -lean + (W + 2 * lean + 10) * ex(Math.max(0, Math.min(1, u / o.duration))); pts = [[-20, top], [e + lean, top], [e, top + wh], [-20, top + wh]]; if (u <= 0) pts = [[0, 0], [0, 0], [0, 0], [0, 0]]; }
            w.style.clipPath = "polygon(" + pts.map(function (q) { return q[0] + "px " + q[1] + "px"; }).join(",") + ")";
            var b = blades[i], bx = ue >= 0 ? pts[0][0] : pts[1][0];
            b.style.left = (w.offsetLeft + bx - o.blade / 2 - lean / 2) + "px"; b.style.top = (w.offsetTop + top) + "px"; b.style.height = wh / Math.cos(o.angle * Math.PI / 180) + "px";
            gsap.set(b, { rotation: o.angle, transformOrigin: "50% 0%" });
            var fade = u < 0 ? 0 : u < 0.6 ? 1 : Math.max(0, 1 - (u - 0.6) / 0.3); b.style.opacity = String(ue >= 0 ? 0 : fade);
          });
        });
      };
  MW.textDiagonalCut = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
</script>
