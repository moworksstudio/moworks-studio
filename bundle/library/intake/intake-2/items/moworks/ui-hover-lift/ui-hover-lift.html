  Source: Moworks Studio.
  Khi con trỏ chạm vào, thẻ nhích lên 7 px, phóng nhẹ 1.02 và bóng đổ sâu hơn; con trỏ rời đi thì thẻ hạ về.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.uiHoverLift(q(".hl"), tl, 0, { cursor: ".ui-cursor" });

  Options (defaults in brackets):
      - lift: px (28)
      - scale: (1.02)
      - duration: s (0.18, power2.out)
      - ease: 
      - shadow: [rest, lifted] shadows
      - hovers: [[s in, s out], ...]
      - cursor: an optional cursor
      - approach: [x, y] px the cursor comes from
      - lead: s it arrives before a click

  Notes: Card (about half the frame) at rest; when the cursor lands (20 % of a 1.6 s loop) it lifts y −7 px, scale 1 → 1.02, shadow 0 8 18 α .28 → 0 20 34 α .46 in 180 ms power2.out; holds to 70 %; returns the same way by 81 %. Cursor fades in 58 px right / 40 px below centre, reaches the card centre at 19 %, leaves at 70-80 %. Params: lift (7 px) · scale (1.02) · duration (0.18 s) · hold (0.6 s) · ease (power2.out).
-->
