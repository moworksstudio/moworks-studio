<!--
  Crane / Jib (Moworks Studio, the studio's own, written here).
  Source: Moworks Studio.
  Máy quay được nâng lên cao và hơi chúc xuống nhìn cảnh, kiểu khép lại một cảnh.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.motionCameraCrane(q(".tk-cam"), tl, 0.5, { duration: 2.4 });

  Options (defaults in brackets):
      - duration: s (2)
      - rise: px the camera rises (300; 100 on the small frame): layers move down by rise × depth
      - tilt: degrees it tilts to look down (8)
      - push: push while rising (0.1)
      - layers: selector of the layers
      - ease: power2.inOut

  Notes: Crane up: the camera rises 100 px, so layers move down by 100 px x depth, while the stage tilts 8 deg to look down (rotateX on a perspective parent) with a 10 % push, 2000 ms easeInOutCubic. Demo: camera y +30 -> -40 with a push 1 -> 1.1 over 2.4 s ease-in-out, no tilt drawn. Params: duration (2 s) · rise (100 px) · tilt (8°) · push (10 %).
-->

<div class="tk-cam"><div class="tk-far" data-depth="0.2"><div class="sun"></div><div class="star" style="left:12%;top:14%"></div><div class="star" style="left:24%;top:30%"></div><div class="star" style="left:36%;top:10%"></div><div class="star" style="left:70%;top:18%"></div><div class="star" style="left:82%;top:34%"></div><div class="star" style="left:90%;top:12%"></div><div class="star" style="left:46%;top:22%"></div><div class="star" style="left:16%;top:40%"></div></div>

<div class="tk-near" data-depth="1"><div class="card">Toàn cảnh</div></div>
<div class="tk-fore" data-depth="1.6"><div class="blob" style="left:6%;top:62%;width:380px;height:380px"></div><div class="blob" style="left:80%;top:8%;width:300px;height:300px"></div><div class="blob" style="left:86%;top:70%;width:420px;height:420px"></div></div></div>

<script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.drive = MW.drive || function (tl, at, dur, fn) {
    var s = { t: 0 }; fn(0);
    tl.fromTo(s, { t: 0 }, { t: dur, duration: dur, ease: "none", immediateRender: false, onUpdate: function () { fn(s.t); } }, at);
    return at + dur;
  };
  var defaults = {"duration":2,"rise":300,"tilt":8,"push":0.1,"layers":"[data-depth]","ease":"power2.inOut"};
  var run = function (el, tl, at, o) {
        var Ls = Array.prototype.slice.call(el.querySelectorAll(o.layers)), ease = gsap.parseEase(o.ease);
        el.parentNode.style.perspective = "2400px";
        return MW.drive(tl, at, o.duration, function (t) {
          var p = ease(t / o.duration);
          Ls.forEach(function (l) { var d = parseFloat(l.getAttribute("data-depth") || "1"); gsap.set(l, { y: o.rise * d * p, scale: 1 + o.push * p }); });
          gsap.set(el, { rotationX: o.tilt * p, scale: 1 + 0.12 * p, transformOrigin: "50% 60%" });
        });
      };
  MW.motionCameraCrane = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
</script>
