<!--
  Falling Text Physics (Moworks Studio, the studio's own, written here).
  Source: Moworks Studio.
  Các từ thành viên thuốc lần lượt rơi xuống sàn, nảy nhẹ, nghiêng ngả rồi xếp chồng thành đống, từ ở dưới khẽ lún khi từ trên rơi trúng.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.textFallingPile(q(".fp"), tl, 0, {});

  Options (defaults in brackets):
      - gravity: px/s² (6000)
      - restitution: (0.4)
      - gap: px (16)
      - shift: px odd rows shift (24)
      - unit: px per reference unit (4)
      - start: s (0.3)
      - exitAt: s (3.75)
      - accent: first pill
      - seed: drops

  Notes: Units = words (chars if < 3 words) as pills: text + 0.7 em × 1.3 em, radius 0.39 em, first one accent; rest slots packed in rows on the floor (4 px gaps, odd rows +6 px, upper rows tilted ±0.07 rad). Release every min(0.2, 1.5 / n) s from 0.3 s, each from 30–80 px above its slot: g 1500 px/s², restitution 0.4; x drifts ±25 px → slot (power1.out); tilt ±0.6 rad settles as e^(−7t) cos 16t; pills below dip 2.4 px × e^(−12t) sin 34t. Exit 3.75 s: fall, fade 3.85–4.25 s. Params: cách nhau (0.2 s) · độ nảy (0.4) · trọng lực (1500 px/s²) · độ nghiêng (±0.6 rad).
-->

<div class="fp-w"><div class="fp">Mọi ý tưởng đều có chỗ đứng của nó</div></div>

<script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.rand = MW.rand || function (seed) {
    var a = typeof seed === "string" ? MW.hash(seed) : (seed >>> 0) || 1;
    return function () { a = (a + 0x6d2b79f5) >>> 0; var t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  };
  MW.hash = MW.hash || function (s) { var h = 2166136261; s = String(s); for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; };
  MW.drive = MW.drive || function (tl, at, dur, fn) {
    var s = { t: 0 }; fn(0);
    tl.fromTo(s, { t: 0 }, { t: dur, duration: dur, ease: "none", immediateRender: false, onUpdate: function () { fn(s.t); } }, at);
    return at + dur;
  };
  var defaults = {"gravity":6000,"restitution":0.4,"gap":16,"shift":24,"unit":4,"start":0.3,"exitAt":3.75,"accent":"#8b7bff","seed":6};
  var run = function (el, tl, at, o) {
        var words = el.textContent.trim().split(/\s+/), r = MW.rand(o.seed), W = el.offsetWidth, fs = parseFloat(getComputedStyle(el).fontSize), floor = el.offsetHeight, pills = [];
        el.textContent = ""; el.style.position = "relative";
        words.forEach(function (w, i) { var p = document.createElement("span"); p.textContent = w; p.style.cssText = "position:absolute;left:0;top:0;white-space:nowrap;padding:0.15em 0.35em;border-radius:0.39em;line-height:1;" + (i === 0 ? "background:" + o.accent + ";color:#fff;" : "background:#e8ebf3;color:#151a28;"); el.appendChild(p); pills.push({ p: p, w: p.offsetWidth, h: p.offsetHeight }); });
        // rest slots: rows from the floor up, centred, 4-unit gaps, odd rows shifted, upper rows tilted a little
        var row = 0, x = 0, rows = [[]]; pills.forEach(function (q) { if (x + q.w > W * 0.9 && rows[row].length) { row++; rows.push([]); x = 0; } rows[row].push(q); x += q.w + o.gap; });
        rows.forEach(function (rw, ri) { var tot = rw.reduce(function (s, q) { return s + q.w; }, 0) + o.gap * (rw.length - 1), xx = (W - tot) / 2 + (ri % 2 ? o.shift : 0); rw.forEach(function (q) { q.sx = xx; q.sy = floor - (ri + 1) * (q.h + 2); q.rot = ri ? (r() * 2 - 1) * 4 : 0; q.ri = ri; xx += q.w + o.gap; }); });
        var n = pills.length, step = Math.min(0.2, 1.5 / n), g = o.gravity, e = o.restitution;
        pills.forEach(function (q, i) { q.t0 = o.start + step * i; q.h0 = (30 + 50 * r()) * o.unit; q.dx = (r() * 2 - 1) * 25 * o.unit; q.tilt = (r() * 2 - 1) * 0.6; });
        var fallY = function (h0, d) { var v = Math.sqrt(2 * g * h0), tt = v / g; if (d < tt) return h0 - 0.5 * g * d * d; d -= tt; var vv = v * e; for (var k = 0; k < 4; k++) { var air = 2 * vv / g; if (d < air) return vv * d - 0.5 * g * d * d; d -= air; vv *= e; } return 0; };
        var land = function (q) { return Math.sqrt(2 * q.h0 / g); };
        return MW.drive(tl, at, o.exitAt + 0.6, function (t) {
          var ex = Math.max(0, t - o.exitAt);
          pills.forEach(function (q, i) {
            var d = t - q.t0; if (d < 0) { q.p.style.opacity = "0"; return; } var h = fallY(q.h0, d), p1 = gsap.parseEase("power1.out")(Math.min(1, d / 0.6)), td = Math.max(0, d - land(q)), tilt = q.tilt * Math.exp(-7 * td) * Math.cos(16 * td);
            var dip = 0; pills.forEach(function (u) { if (u.ri === q.ri - 1 && Math.abs(u.sx - q.sx) < q.w) { var du = t - u.t0 - land(u); if (du > 0) dip += 2.4 * o.unit * Math.exp(-12 * du) * Math.sin(34 * du); } });
            var fy = ex > 0 ? 0.5 * g * ex * ex : 0; gsap.set(q.p, { x: q.sx + q.dx * (1 - p1), y: q.sy - h + dip + fy, rotation: q.rot + tilt * 57.3 }); q.p.style.opacity = String(1 - Math.max(0, Math.min(1, (t - o.exitAt - 0.1) / 0.4)));
          });
        });
      };
  MW.textFallingPile = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
</script>
