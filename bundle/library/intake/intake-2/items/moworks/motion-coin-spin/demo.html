<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Coin Spin - Demo</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
:root { --bg: #09090b; --fg: #fafafa; --card: #111114; --line: #27272a; }
* { box-sizing: border-box; }
html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); }
#demo { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); color: var(--fg); font-family: Inter, sans-serif; }
.center { position: absolute; inset: 0; display: grid; place-items: center; }
.row { display: flex; align-items: center; justify-content: center; gap: 48px; }
.col { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 32px; }
.h1 { font-size: 132px; font-weight: 800; letter-spacing: -0.035em; line-height: 1.1; text-align: center; }
.h2 { font-size: 84px; font-weight: 700; letter-spacing: -0.025em; line-height: 1.15; text-align: center; }
.p { font-size: 40px; line-height: 1.4; opacity: 0.72; text-align: center; }
.card { position: relative; border-radius: 28px; background: var(--card); border: 2px solid var(--line); overflow: hidden; }
.muted { opacity: 0.6; }

#demo { background: radial-gradient(100% 100% at 50% 45%, #1a1f33, #0b0d12); color: #e8ebf3; font-family: Inter, sans-serif; } .gm { position: absolute; inset: 0; }
.st { position: absolute; inset: 0; display: grid; place-items: center; } .cs-w { position: relative; width: 380px; height: 380px; } .cs { position: absolute; inset: 0; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff1b0, #ffc633 60%, #d99400); }
.cs > div { position: absolute; inset: 70px; display: grid; place-items: center; color: #9a5d00; } .cs-b { visibility: hidden; } .cs-b i { width: 200px; height: 200px; border-radius: 50%; border: 26px solid #9a5d00; box-sizing: border-box; }
.cs-sh { position: absolute; left: 50%; top: 860px; width: 340px; height: 44px; margin-left: -170px; border-radius: 50%; background: rgba(0, 0, 0, 0.55); filter: blur(12px); }
    </style>
  </head>
  <body>
    <div id="demo" data-composition-id="mw-demo" data-start="0" data-width="1920" data-height="1080" data-duration="3.4">
<div class="cs-sh"></div><div class="st"><div class="cs-w"><div class="cs"><div class="cs-f"><svg viewBox="-10 -10 20 20" width="100%" height="100%"><path d="M0 -10 L2.6 -2.6 L10 0 L2.6 2.6 L0 10 L-2.6 2.6 L-10 0 L-2.6 -2.6 Z" fill="currentColor"/></svg></div><div class="cs-b"><i></i></div></div></div></div>
      <script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.drive = MW.drive || function (tl, at, dur, fn) {
    var s = { t: 0 }; fn(0);
    tl.fromTo(s, { t: 0 }, { t: dur, duration: dur, ease: "none", immediateRender: false, onUpdate: function () { fn(s.t); } }, at);
    return at + dur;
  };
  var defaults = {"turns":3,"duration":0.9,"ease":"power3.out","edge":35,"edgeColor":"#b07600","front":".cs-f","back":".cs-b","shadow":null};
  var run = function (el,tl,at,o
  ) {
  var host = el.parentNode; if (getComputedStyle(host).position === "static") host.style.position = "relative";
  var ghost = function () { var g = el.cloneNode(true); g.removeAttribute("id"); g.style.position = "absolute"; g.style.margin = "0"; g.style.pointerEvents = "none"; g.style.opacity = "0";
    g.style.left = el.offsetLeft + "px"; g.style.top = el.offsetTop + "px"; g.style.width = el.offsetWidth + "px"; g.style.height = el.offsetHeight + "px"; host.insertBefore(g, el); return g; };
  var f = el.querySelector(o.front), b = el.querySelector(o.back), edge = document.createElement("div"), e = gsap.parseEase(o.ease), sh = o.shadow ? host.querySelector(o.shadow) : null;
  edge.style.cssText = "position:absolute;pointer-events:none;border-radius:50%;opacity:0;background:" + o.edgeColor + ";left:" + el.offsetLeft + "px;top:" + el.offsetTop + "px;width:" + el.offsetWidth + "px;height:" + el.offsetHeight + "px;"; host.insertBefore(edge, el);
  return MW.drive(tl, at, o.duration, function (t) {
    var a = o.turns * 2 * Math.PI * e(Math.max(0, Math.min(1, t / o.duration))), c = Math.cos(a), s = Math.sin(a), w = Math.max(0.02, Math.abs(c));
    gsap.set(el, { scaleX: w }); f.style.visibility = c >= 0 ? "visible" : "hidden"; b.style.visibility = c >= 0 ? "hidden" : "visible";
    gsap.set(edge, { scaleX: w, x: o.edge * s }); edge.style.opacity = Math.abs(s) > 0.02 ? "1" : "0"; if (sh) gsap.set(sh, { scaleX: 0.55 + 0.45 * Math.abs(c) });
  });
  };
  MW.motionCoinSpin = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
      </script>
      <script>
        (function () {
          var tl = gsap.timeline({ paused: true });
          var q = function (s) { return document.querySelector(s); }, qa = function (s) { return Array.prototype.slice.call(document.querySelectorAll(s)); };
          MW.motionCoinSpin(q(".cs"), tl, 0.3, { shadow: ".cs-sh" }); MW.motionCoinSpin(q(".cs"), tl, 1.9, { shadow: ".cs-sh", turns: 2.5 });
          tl.set({}, {}, 3.4);
          // register only when every motion is ready (MW.pending: e.g. a WebGL texture still decoding), as HyperFrames asks of async builds
          var go = function () { window.__timelines = window.__timelines || {}; window.__timelines["mw-demo"] = tl; };
          if (window.MW && MW.pending && MW.pending.length) Promise.all(MW.pending).then(go, go); else go();
        })();
      </script>
    </div>
  </body>
</html>
