  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline

    MW.uiTooltipPop(q(".tp"), tl, 0, { cursor: ".ui-cursor" });

  Options (defaults in brackets):
      - showAt: s (0.6)
      - show: s (0.2, power2.out)
      - hideAt: s (1.8)
      - hide: s (0.12)
      - origin: transform origin: the arrow tip
      - icon: the icon it points at
      - cursor: an optional cursor
      - approach: [x, y] px the cursor comes from
      - lead: s it arrives before a click

  Notes: Icon '?' r14. Tooltip 140x34 r8 with a small arrow above the icon: scale 0.9 → 1 about the arrow tip (the icon side) and opacity 0 → 1 over 0.6-0.8 s power2.out; hides over 1.8-1.92 s (opacity, 120 ms; recipe 100 ms). Params: in (0.2 s, power2.out) · scale (0.9 → 1) · origin: mũi chỉ · out (0.12 s).
