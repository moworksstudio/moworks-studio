<!--
  Top Layer Dialog (Moworks Studio, the studio's own, written here).
  Source: Moworks Studio.
  Bấm Mở, hộp thoại trồi lên 18 px và hiện dần trong khi nền tối đi theo nhịp riêng chậm hơn; tiêu điểm nằm trên nút OK, bấm ra ngoài không có tác dụng.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.uiDialogBackdrop(q(".gm"), tl, 0, {});

  Options (defaults in brackets):
      - loop: s (2.8)

  Notes: App window 260x160 with an Open button. Click at 0.3 s: dialog 150x84 r10 (title, two lines, Cancel + OK pills) fades 0 → 1 and rises y +18 → 0 over 0.4-1.02 s power2.out; backdrop 0 → 65 % linear over 0.4-1.15 s (its own rate). Focus ring on OK fades in 1.02-1.16 s. A click on the backdrop at 1.7 s does nothing (inert). Cancel at 2.12 s: dialog out 2.22-2.42 s power2.in, backdrop 2.22-2.52 s. Params: rise (18 px) · dialog (0.62 s, power2.out) · backdrop (65 %, 0.75 s, none) · close (0.2 s). The backdrop runs on its own linear rate; a click on it does nothing (the dialog is modal); focus sits on OK.
-->

<script>
(function () {

  MW.canvas = MW.canvas || function (host, w, h) {

    host.appendChild(cv);

  };
  MW.rr = MW.rr || function (c, x, y, w, h, r) { r = Math.min(r, w / 2, h / 2); c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); };
  MW.txt = MW.txt || function (c, s, x, y, size, color, weight, align) { c.font = (weight || 700) + " " + size + "px Inter, sans-serif"; c.fillStyle = color || "#e8ebf3"; c.textAlign = align || "center"; c.textBaseline = "middle"; c.fillText(s, x, y); };
  MW.cursor = MW.cursor || function (c, x, y, s) { s = s || 1; c.save(); c.translate(x, y); c.scale(s, s); c.beginPath(); c.moveTo(0, 0); c.lineTo(0, 16); c.lineTo(4, 12.5); c.lineTo(6.5, 18); c.lineTo(9, 17); c.lineTo(6.5, 11.5); c.lineTo(11.5, 11.5); c.closePath(); c.fillStyle = "#fff"; c.fill(); c.lineWidth = 1; c.strokeStyle = "#111"; c.stroke(); c.restore(); };
  MW.path = MW.path || function (keys, t, ease) {

    var z = keys[keys.length - 1]; return [z[1], z[2]];
  };
  MW.stage320 = MW.stage320 || function (host) {

          c.fillStyle = "#8b7bff"; MW.rr(c, 214, 140, 60, 24, 12); c.fill(); MW.txt(c, "Mở", 244, 152.5, 10, "#fff", 800);
          var dlg = out(Math.max(0, Math.min(1, (t - 0.4) / 0.62))) * (1 - pin(Math.max(0, Math.min(1, (t - 2.22) / 0.2)))), bd = 0.65 * Math.max(0, Math.min(1, (t - 0.4) / 0.75)) * (1 - Math.max(0, Math.min(1, (t - 2.22) / 0.3)));
          c.fillStyle = "rgba(5,6,10," + bd + ")"; MW.rr(c, 30, 20, 260, 160, 10); c.fill();
          if (dlg > 0) { c.globalAlpha = dlg; var y = 58 + 18 * (1 - dlg); MW.rr(c, 85, y, 150, 84, 10); c.fillStyle = "#222a42"; c.fill(); c.strokeStyle = "#3a4466"; c.lineWidth = 1; c.stroke();
            MW.txt(c, "Xoá dự án?", 97, y + 16, 10, "#e8ebf3", 800, "left"); c.fillStyle = "#3a4466"; MW.rr(c, 97, y + 30, 120, 5, 2.5); c.fill(); MW.rr(c, 97, y + 40, 90, 5, 2.5); c.fill();
            MW.rr(c, 125, y + 58, 48, 18, 9); c.fillStyle = "#1b2130"; c.fill(); MW.txt(c, "Huỷ", 149, y + 67.5, 8, "#c9d2ea", 800); MW.rr(c, 179, y + 58, 46, 18, 9); c.fillStyle = "#8b7bff"; c.fill(); MW.txt(c, "OK", 202, y + 67.5, 8, "#fff", 900);
            var fr = Math.max(0, Math.min(1, (t - 1.02) / 0.14)); if (fr > 0) { c.globalAlpha = dlg * fr; c.strokeStyle = "#d6ccff"; c.lineWidth = 1.5; MW.rr(c, 176, y + 55, 52, 24, 12); c.stroke(); } c.globalAlpha = 1; }
          var cp = MW.path([[0, 250, 190], [0.1, 250, 190], [0.28, 244, 152], [1.4, 244, 152], [1.7, 60, 160], [1.9, 60, 160], [2.12, 150, 140]], t); MW.cursor(c, cp[0], cp[1], (t > 0.3 && t < 0.4) || (t > 1.7 && t < 1.8) || (t > 2.12 && t < 2.22) ? 0.9 : 1);
        });
      };
  MW.uiDialogBackdrop = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
