<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Rotating Text (Spring) - Demo</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
:root { --bg: #09090b; --fg: #fafafa; --card: #111114; --line: #27272a; }
* { box-sizing: border-box; }
html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); }
#demo { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); color: var(--fg); font-family: Inter, sans-serif; }
.center { position: absolute; inset: 0; display: grid; place-items: center; }
.row { display: flex; align-items: center; justify-content: center; gap: 48px; }
.col { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 32px; }
.h1 { font-size: 132px; font-weight: 800; letter-spacing: -0.035em; line-height: 1.1; text-align: center; }
.h2 { font-size: 84px; font-weight: 700; letter-spacing: -0.025em; line-height: 1.15; text-align: center; }
.p { font-size: 40px; line-height: 1.4; opacity: 0.72; text-align: center; }
.card { position: relative; border-radius: 28px; background: var(--card); border: 2px solid var(--line); overflow: hidden; }
.muted { opacity: 0.6; }

#demo { background: radial-gradient(100% 100% at 50% 45%, #1a1f33, #0b0d12); color: #e8ebf3; font-family: Inter, sans-serif; } .sw { position: absolute; inset: 0; display: grid; place-items: center; }
    </style>
  </head>
  <body>
    <div id="demo" data-composition-id="mw-demo" data-start="0" data-width="1920" data-height="1080" data-duration="4">
<div class="sw"><div style="font-size:120px;font-weight:800">Làm video <span class="rp" style="background:#8b7bff;color:#151a28;border-radius:40px">nhanh hơn</span></div></div>
      <script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.spring = MW.spring || function (stiffness, damping, mass, from, to) {
    var k = stiffness || 100, c = damping == null ? 10 : damping, m = mass || 1, w0 = Math.sqrt(k / m), z = c / (2 * Math.sqrt(k * m));
    var x = function (t) {
      if (z < 1) { var wd = w0 * Math.sqrt(1 - z * z); return 1 - Math.exp(-z * w0 * t) * (Math.cos(wd * t) + (z * w0 / wd) * Math.sin(wd * t)); }
      if (z === 1) return 1 - Math.exp(-w0 * t) * (1 + w0 * t);
      var q = Math.sqrt(z * z - 1), r1 = -w0 * (z - q), r2 = -w0 * (z + q), A = r2 / (r2 - r1), B = -r1 / (r2 - r1);
      return 1 - (A * Math.exp(r1 * t) + B * Math.exp(r2 * t));
    };
    var T = 0, dt = 1 / 240; for (var t = 0; t < 30; t += dt) if (Math.abs(1 - x(t)) > 0.001) T = t;
    T = Math.max(dt, T + dt);
    return { duration: T, ease: function (p) { return p >= 1 ? 1 : x(p * T); }, at: x };
  };
  MW.springDB = MW.springDB || function (duration, bounce) {
    var z = 1 - (bounce == null ? 0.25 : bounce), w = Math.log(1000) / (Math.max(0.05, z) * (duration || 0.8));
    return MW.spring(w * w, 2 * z * w, 1);
  };
  MW.drive = MW.drive || function (tl, at, dur, fn) {
    var s = { t: 0 }; fn(0);
    tl.fromTo(s, { t: 0 }, { t: dur, duration: dur, ease: "none", immediateRender: false, onUpdate: function () { fn(s.t); } }, at);
    return at + dur;
  };
  var defaults = {"words":["nhanh hơn","đẹp hơn"],"swaps":[0.7,2.7],"k":300,"c":25,"pad":56,"loop":4};
  var run = function (el,tl,at,o
  ) {
  var seg = typeof Intl !== "undefined" && Intl.Segmenter ? new Intl.Segmenter("vi", { granularity: "grapheme" }) : null;
  var gr = function (s) { s = String(s).normalize("NFC"); if (!seg) return Array.from(s); var out = [], it = seg.segment(s)[Symbol.iterator](), r; while (!(r = it.next()).done) out.push(r.value.segment); return out; };
  var pill = el, sp = MW.spring(o.k, o.c), words = o.words.map(gr), layers = [], fs = parseFloat(getComputedStyle(el).fontSize);
  pill.textContent = ""; pill.style.position = "relative"; pill.style.overflow = "hidden"; pill.style.display = "inline-block"; pill.style.verticalAlign = "bottom";
  words.forEach(function (w) { var d = document.createElement("span"); d.style.cssText = "position:absolute;left:" + o.pad + "px;top:0.09em;white-space:pre;display:inline-flex;"; w.forEach(function (g) { var s = document.createElement("span"); s.textContent = g; s.style.display = "inline-block"; s.style.whiteSpace = "pre"; d.appendChild(s); }); pill.appendChild(d); layers.push(d); });
  var widths = layers.map(function (d) { return d.offsetWidth + 2 * o.pad; }), H = fs * 1.18 + 0.18 * fs;
  pill.style.height = H + "px";
  return MW.drive(tl, at, o.loop, function (t) {
    var k = 0; o.swaps.forEach(function (s, i) { if (t >= s) k = i + 1; }); k = k % words.length;
    var w = widths[0]; for (var i = 0; i < o.swaps.length; i++) if (t >= o.swaps[i] + 0.22) { var to = widths[(i + 1) % words.length], from = widths[i % words.length]; w += (to - from) * sp.at(t - o.swaps[i] - 0.22); }
    pill.style.width = w + "px";
    layers.forEach(function (d, li) {
      var ch = d.children;
      Array.prototype.forEach.call(ch, function (s, ci) {
        var y = li === 0 ? 0 : 120, a = li === 0 ? 1 : 0;
        o.swaps.forEach(function (sw, i) { var outI = i % words.length, inI = (i + 1) % words.length, d0 = t - sw - 0.03 * ci;
          if (li === outI && d0 >= 0) { var v = Math.min(1.2, sp.at(d0)); y = -120 * v; a = Math.max(0, 1 - v); }
          if (li === inI && d0 - 0.22 >= 0) { var v2 = sp.at(d0 - 0.22); y = 100 * (1 - v2); a = Math.min(1, v2); } });
        gsap.set(s, { yPercent: y }); s.style.opacity = String(a);
      });
    });
  });
  };
  MW.textRotatingLettersPill = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
      </script>
      <script>
        (function () {
          var tl = gsap.timeline({ paused: true });
          var q = function (s) { return document.querySelector(s); }, qa = function (s) { return Array.prototype.slice.call(document.querySelectorAll(s)); };
          MW.textRotatingLettersPill(q(".rp"), tl, 0, {});
          tl.set({}, {}, 4);
          // register only when every motion is ready (MW.pending: e.g. a WebGL texture still decoding), as HyperFrames asks of async builds
          var go = function () { window.__timelines = window.__timelines || {}; window.__timelines["mw-demo"] = tl; };
          if (window.MW && MW.pending && MW.pending.length) Promise.all(MW.pending).then(go, go); else go();
        })();
      </script>
    </div>
  </body>
</html>
