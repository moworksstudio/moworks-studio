<!--
  Modal Enter / Exit (Moworks Studio, the studio's own, written here).
  Source: Moworks Studio.
  Nền tối đi, hộp thoại trồi lên 16 px và phóng 0.96 lên 1 bằng lò xo; khi đóng biến mất rất nhanh.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.uiModalSpring(q(".ms"), tl, 0.3, { backdrop: ".ms-bd" });

  Options (defaults in brackets):
      - rise: px (80)
      - closeAt: s after opening (1.9)
      - closeEase: expo.in (the recipe power3.in)
      - backdrop: the dim layer
      - dim: (0.65)

  Notes: Background (4 columns) dims 0 → 65 % with k. Modal 180x112 r12: k = spring(k280, c28) from 0.3 s: opacity k, y +16 → 0 px × (1 − k), scale 0.96 + 0.04 k (≈ 400 ms to settle). Close at 2.2 s over 220 ms (demo easeInExpo; recipe easeInQuart = power3.in), k → 0. Params: spring (k280 c28) · rise (16 px) · scale (0.96) · close (0.22 s, expo.in) · backdrop (65 %).
-->

<div class="gm"><section class="ms-app app dark"><div class="app-bar"><b></b><span>Bảng điều khiển</span></div>
<div class="app-body"><div class="app-hero" style="background:#8b7bff"></div><div class="app-row"></div><div class="app-row" style="width:70%"></div><div class="app-row" style="width:85%"></div></div></section><div class="ms-bd"></div><div class="ms"><b>Chào mừng trở lại</b><p>Bạn có 3 dự án đang chờ duyệt.</p><i>Xem ngay</i></div></div>

</style>

<script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.spring = MW.spring || function (stiffness, damping, mass, from, to) {
    var k = stiffness || 100, c = damping == null ? 10 : damping, m = mass || 1, w0 = Math.sqrt(k / m), z = c / (2 * Math.sqrt(k * m));
    var x = function (t) {
      if (z < 1) { var wd = w0 * Math.sqrt(1 - z * z); return 1 - Math.exp(-z * w0 * t) * (Math.cos(wd * t) + (z * w0 / wd) * Math.sin(wd * t)); }
      if (z === 1) return 1 - Math.exp(-w0 * t) * (1 + w0 * t);
      var q = Math.sqrt(z * z - 1), r1 = -w0 * (z - q), r2 = -w0 * (z + q), A = r2 / (r2 - r1), B = -r1 / (r2 - r1);
      return 1 - (A * Math.exp(r1 * t) + B * Math.exp(r2 * t));
    };
    var T = 0, dt = 1 / 240; for (var t = 0; t < 30; t += dt) if (Math.abs(1 - x(t)) > 0.001) T = t;
    T = Math.max(dt, T + dt);
    return { duration: T, ease: function (p) { return p >= 1 ? 1 : x(p * T); }, at: x };
  };
  MW.springDB = MW.springDB || function (duration, bounce) {
    var z = 1 - (bounce == null ? 0.25 : bounce), w = Math.log(1000) / (Math.max(0.05, z) * (duration || 0.8));
    return MW.spring(w * w, 2 * z * w, 1);
  };
  MW.drive = MW.drive || function (tl, at, dur, fn) {
    var s = { t: 0 }; fn(0);
    tl.fromTo(s, { t: 0 }, { t: dur, duration: dur, ease: "none", immediateRender: false, onUpdate: function () { fn(s.t); } }, at);
    return at + dur;
  };
  var defaults = {"rise":80,"closeAt":1.9,"closeEase":"expo.in","backdrop":null,"dim":0.65};
  var run = function (el, tl, at, o) {
        var sp = MW.spring(280, 28), ei = gsap.parseEase(o.closeEase), bd = o.backdrop ? MW.el(o.backdrop) : null;
        return MW.drive(tl, at, o.closeAt + 0.22, function (t) {
          var k = t > 0 ? sp.at(t) : 0; if (t > o.closeAt) k *= 1 - ei(Math.min(1, (t - o.closeAt) / 0.22));
          el.style.opacity = String(Math.max(0, Math.min(1, k))); gsap.set(el, { y: o.rise * (1 - k), scale: 0.96 + 0.04 * k }); if (bd) bd.style.opacity = String(o.dim * Math.max(0, Math.min(1, k)));
        });
      };
  MW.uiModalSpring = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
</script>
