  Source: Moworks Studio.
  Các ký tự chìm xuống 30 px và mờ đi, bắt đầu từ ký tự cuối.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.textFadeDownOut(q(".tk-head"), tl, 0, {});

  Options (defaults in brackets):
      - duration: s (0.6)
      - stagger: s from the last letter (0.06)
      - cap: s (0.6)
      - dist: em (0.6)
      - ease: (cubic-bezier(.55,.085,.68,.53): ease-in quad)
      - outAt: s (0.9)
      - backAt: s it fades back in place (2.4)
      - loop: s (3)

  Notes: Split chars; from the last char backward, each char y 0 → +30 px (0.6 em) and opacity 1 → 0, 0.6 s easeInQuad (power1.in, CSS cubic-bezier(.55,.085,.68,.53)), stagger 20 ms from the end (demo 60 ms capped 0.6 s), from 0.9 s. Demo loop: the text fades back in place 2.4–2.9 s; loop 3 s. Params: duration (0.6 s) · stagger: từ cuối (0.02 s) · y: quãng chìm (30 px) · ease (easeInQuad).
-->
