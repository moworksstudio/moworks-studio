<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />

    <title>One Shape, Never Cut - Demo</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
:root { --bg: #09090b; --fg: #fafafa; --card: #111114; --line: #27272a; }
* { box-sizing: border-box; }
html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); }
#demo { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); color: var(--fg); font-family: Inter, sans-serif; }
.center { position: absolute; inset: 0; display: grid; place-items: center; }
.row { display: flex; align-items: center; justify-content: center; gap: 48px; }
.col { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 32px; }
.h1 { font-size: 132px; font-weight: 800; letter-spacing: -0.035em; line-height: 1.1; text-align: center; }
.h2 { font-size: 84px; font-weight: 700; letter-spacing: -0.025em; line-height: 1.15; text-align: center; }
.p { font-size: 40px; line-height: 1.4; opacity: 0.72; text-align: center; }
.card { position: relative; border-radius: 28px; background: var(--card); border: 2px solid var(--line); overflow: hidden; }
.muted { opacity: 0.6; }

#demo { background: radial-gradient(100% 100% at 50% 45%, #1a1f33, #0b0d12); color: #e8ebf3; font-family: Inter, sans-serif; } .gm { position: absolute; inset: 0; }
.st { position: absolute; inset: 0; display: grid; place-items: center; } .sm { position: relative; box-sizing: border-box; border: 4px solid transparent; overflow: hidden; width: 480px; height: 176px; border-radius: 88px; background: #8b7bff; }
.sm > div { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); opacity: 0; } .sm-1 { font-size: 60px; font-weight: 800; color: #fff; white-space: nowrap; } .sm-2 svg { width: 100px; height: 100px; display: block; } .sm-3 svg { width: 120px; height: 120px; display: block; }
.sm-4 { width: 680px; } .sm-4 b { display: block; font-size: 52px; margin-bottom: 34px; } .sm-4 i { display: block; height: 22px; border-radius: 11px; background: #2a3350; margin-top: 22px; }
    </style>
  </head>
  <body>
    <div id="demo" data-composition-id="mw-demo" data-start="0" data-width="1920" data-height="1080" data-duration="5">
<div class="st"><div class="sm"><div class="sm-1">Gửi đi</div><div class="sm-2"><svg viewBox="-12 -12 24 24"><path d="M0 -9 A9 9 0 0 1 9 0" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/></svg></div>
<div class="sm-3"><svg viewBox="0 0 100 100"><path d="M24 52 L43 70 L77 33" fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/></svg></div><div class="sm-4"><b>Đã gửi tới nhóm</b><i></i><i style="width:70%"></i></div></div></div>
      <script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.spring = MW.spring || function (stiffness, damping, mass, from, to) {
    var k = stiffness || 100, c = damping == null ? 10 : damping, m = mass || 1, w0 = Math.sqrt(k / m), z = c / (2 * Math.sqrt(k * m));
    var x = function (t) {
      if (z < 1) { var wd = w0 * Math.sqrt(1 - z * z); return 1 - Math.exp(-z * w0 * t) * (Math.cos(wd * t) + (z * w0 / wd) * Math.sin(wd * t)); }
      if (z === 1) return 1 - Math.exp(-w0 * t) * (1 + w0 * t);
      var q = Math.sqrt(z * z - 1), r1 = -w0 * (z - q), r2 = -w0 * (z + q), A = r2 / (r2 - r1), B = -r1 / (r2 - r1);
      return 1 - (A * Math.exp(r1 * t) + B * Math.exp(r2 * t));
    };
    var T = 0, dt = 1 / 240; for (var t = 0; t < 30; t += dt) if (Math.abs(1 - x(t)) > 0.001) T = t;
    T = Math.max(dt, T + dt);
    return { duration: T, ease: function (p) { return p >= 1 ? 1 : x(p * T); }, at: x };
  };
  MW.springDB = MW.springDB || function (duration, bounce) {
    var z = 1 - (bounce == null ? 0.25 : bounce), w = Math.log(1000) / (Math.max(0.05, z) * (duration || 0.8));
    return MW.spring(w * w, 2 * z * w, 1);
  };
  MW.drive = MW.drive || function (tl, at, dur, fn) {
    var s = { t: 0 }; fn(0);
    tl.fromTo(s, { t: 0 }, { t: dur, duration: dur, ease: "none", immediateRender: false, onUpdate: function () { fn(s.t); } }, at);
    return at + dur;
  };
  MW.springTo = MW.springTo || function (k, c, keys) {
    var sp = MW.spring(k, c);
    return function (t) { var v = keys[0][1]; for (var i = 1; i < keys.length; i++) if (t >= keys[i][0]) v += (keys[i][1] - keys[i - 1][1]) * sp.at(t - keys[i][0]); return v; };
  };
  var defaults = {"states":[[0,480,176,88,".sm-1","#8b7bff","transparent"],[1.2,176,176,88,".sm-2","#8b7bff","transparent"],[2.2,224,224,112,".sm-3","#22c06e","transparent"],[3.2,800,480,56,".sm-4","#151a24","#3a4466"],[4.4,480,176,88,".sm-1","#8b7bff","transparent"]],"k":300,"c":26,"fade":[0.25,0.4,0.15,0.05],"spin":".sm-2 svg","loop":5};
  var run = function (el, tl, at, o) {
        var S = o.states, n = S.length, K = function (j) { return S.map(function (s) { return [s[0], s[j]]; }); }, W = MW.springTo(o.k, o.c, K(1)), Hh = MW.springTo(o.k, o.c, K(2)), R = MW.springTo(o.k, o.c, K(3));
        var cols = S.map(function (s) { return gsap.utils.splitColor(s[5]); }), CR = [0, 1, 2].map(function (ch) { return MW.springTo(o.k, o.c, S.map(function (s, i) { return [s[0], cols[i][ch]]; })); });
        var parts = S.map(function (s) { return s[4] ? el.querySelector(s[4]) : null; }), spin = o.spin ? el.querySelector(o.spin) : null;
        return MW.drive(tl, at, o.loop, function (t) {
          el.style.width = W(t).toFixed(1) + "px"; el.style.height = Hh(t).toFixed(1) + "px"; el.style.borderRadius = Math.max(0, R(t)).toFixed(1) + "px";
          el.style.backgroundColor = "rgb(" + CR.map(function (f) { return Math.round(Math.max(0, Math.min(255, f(t)))); }).join(",") + ")";
          var k = 0; for (var i = 0; i < n; i++) if (t >= S[i][0]) k = i; el.style.borderColor = S[k][6] || "transparent";
          var A = new Map(); parts.forEach(function (p, i) { if (!p) return; var st = S[i][0], en = i + 1 < n ? S[i + 1][0] : 1e9, a = 0;
            if (t >= st && t < en) a = (i === 0 ? 1 : Math.max(0, Math.min(1, (t - st - o.fade[0]) / (o.fade[1] - o.fade[0])))) * (1 - Math.max(0, Math.min(1, (t - (en - o.fade[2])) / (o.fade[2] - o.fade[3]))));
            A.set(p, Math.max(A.get(p) || 0, a)); });
          A.forEach(function (a, p) { p.style.opacity = String(a); p.style.filter = a > 0 && a < 1 ? "blur(" + (6 * (1 - a)).toFixed(1) + "px)" : ""; });
          if (spin) gsap.set(spin, { rotation: 360 * t / 0.8 });
        });
      };
  MW.uiShapeStateMorph = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
      </script>
      <script>
        (function () {
          var tl = gsap.timeline({ paused: true });
          var q = function (s) { return document.querySelector(s); }, qa = function (s) { return Array.prototype.slice.call(document.querySelectorAll(s)); };
          MW.uiShapeStateMorph(q(".sm"), tl, 0, {});
          tl.set({}, {}, 5);
          // register only when every motion is ready (MW.pending: e.g. a WebGL texture still decoding), as HyperFrames asks of async builds
          var go = function () { window.__timelines = window.__timelines || {}; window.__timelines["mw-demo"] = tl; };
          if (window.MW && MW.pending && MW.pending.length) Promise.all(MW.pending).then(go, go); else go();
        })();
      </script>
    </div>
