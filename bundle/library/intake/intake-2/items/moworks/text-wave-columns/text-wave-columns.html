<!--
  Dual Wave Columns (Moworks Studio, the studio's own, written here).
  Source: Moworks Studio.
  Hai cột danh sách từ cuộn dọc theo nhịp, mỗi từ lệch ngang theo một đường sóng, hai cột ngược pha nhau, từ nằm ở giữa to lên và đổi màu nhấn.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.textWaveColumns(q(".wc"), tl, 0, {});

  Options (defaults in brackets):
      - words: the list (the second column runs it reversed)
      - accent: colour of the word at the centre

  Notes: Two columns at 29 % / 71 % of the width: the word list and the same list reversed, pitch 32 px. Item x = column ± 20 px (≈6 % of width; recipe 10–20 vw) × sin(0.032 × dy + 1.1), dy = px from frame centre, sign mirrored per column. Nearness h = 1 − |dy| / 32: size 16 → 26 px, opacity 0.35 → 1, accent when h > 0.5; 26 px edge fades. Lists step one item 0.3–0.8 and 1.3–1.8 s, back 2.3–2.8 and 3.3–3.8 s, cubic-bezier(.65,0,.35,1). Loop 4 s. Params: biên độ sóng (6 % khung) · bước dòng (32 px) · cỡ chữ (16 → 26 px) · nhịp cuộn (1 mục / 0.5 s).
-->

<div class="gm wc"></div>

<script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.bezier = MW.bezier || function (x1, y1, x2, y2) {
    var cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx, cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
    var X = function (t) { return ((ax * t + bx) * t + cx) * t; }, Y = function (t) { return ((ay * t + by) * t + cy) * t; }, dX = function (t) { return (3 * ax * t + 2 * bx) * t + cx; };
    return function (p) {
      if (p <= 0) return 0; if (p >= 1) return 1;
      var t = p, i, d;
      for (i = 0; i < 8; i++) { d = X(t) - p; if (Math.abs(d) < 1e-6) return Y(t); var s = dX(t); if (Math.abs(s) < 1e-6) break; t -= d / s; }
      var lo = 0, hi = 1; t = p;
      for (i = 0; i < 40; i++) { d = X(t); if (Math.abs(d - p) < 1e-6) break; if (d < p) lo = t; else hi = t; t = (lo + hi) / 2; }
      return Y(t);
    };
  };
  MW.CSS_EASE = { ease: [0.25, 0.1, 0.25, 1], easeIn: [0.42, 0, 1, 1], easeOut: [0, 0, 0.58, 1], easeInOut: [0.42, 0, 0.58, 1] };
  MW.EASES = MW.EASES || { "css-ease": [0.25, 0.1, 0.25, 1], "css-in": [0.42, 0, 1, 1], "css-out": [0, 0, 0.58, 1], "css-in-out": [0.42, 0, 0.58, 1],
    md3: [0.2, 0, 0, 1], "md3-emph": [0.05, 0.7, 0.1, 1], "md3-acc": [0.3, 0, 1, 1], "md3-dec": [0, 0, 0, 1], whip: [0.9, 0, 0.1, 1], glide: [0.4, 0, 0.2, 1],
    house: [0.83, 0, 0.17, 1], "in-out": [0.65, 0, 0.35, 1] };
  MW.ez = MW.ez || function (name) {
    if (typeof name === "function") return name;
    var b = MW.EASES[name]; if (b) return MW.bezier(b[0], b[1], b[2], b[3]);
    var m = /^cubic-bezier\(([^)]+)\)$/.exec(name || ""); if (m) { var v = m[1].split(",").map(Number); return MW.bezier(v[0], v[1], v[2], v[3]); }
    return gsap.parseEase(name || "none");
  };
  MW.drive = MW.drive || function (tl, at, dur, fn) {
    var s = { t: 0 }; fn(0);
    tl.fromTo(s, { t: 0 }, { t: dur, duration: dur, ease: "none", immediateRender: false, onUpdate: function () { fn(s.t); } }, at);
    return at + dur;
  };
  var defaults = {"words":["Ý tưởng","Kịch bản","Phân cảnh","Giọng đọc","Âm nhạc","Dựng phim","Xuất bản"],"accent":"#a99bff"};
  var run = function (el, tl, at, o) {
        var cols = [o.words, o.words.slice().reverse()], io = MW.ez("in-out"), items = [];
        cols.forEach(function (list, ci) { list.forEach(function (w, i) { var s = document.createElement("div"); s.textContent = w; s.style.cssText = "position:absolute;left:0;top:0;white-space:nowrap;font-weight:800;"; el.appendChild(s); items.push({ s: s, c: ci, i: i }); }); });
        return MW.drive(tl, at, 4, function (t) {
          var W = el.offsetWidth, Hh = el.offsetHeight, k = Hh / 200, step = io(Math.max(0, Math.min(1, (t - 0.3) / 0.5))) + io(Math.max(0, Math.min(1, (t - 1.3) / 0.5))) - io(Math.max(0, Math.min(1, (t - 2.3) / 0.5))) - io(Math.max(0, Math.min(1, (t - 3.3) / 0.5)));
          items.forEach(function (it) {
            var n = cols[it.c].length, dy = (it.i - (n - 1) / 2 - step * (it.c ? -1 : 1)) * 32, h = Math.max(0, 1 - Math.abs(dy) / 32), cx = (it.c ? 0.71 : 0.29) * W, x = cx + (it.c ? -1 : 1) * 20 * k * Math.sin(0.032 * dy + 1.1);
            it.s.style.fontSize = (16 + 10 * h) * k + "px"; it.s.style.color = h > 0.5 ? o.accent : ""; var edge = Math.min(1, Math.max(0, (100 - Math.abs(dy)) / 26));
            it.s.style.opacity = String((0.35 + 0.65 * h) * edge); gsap.set(it.s, { x: x, y: Hh / 2 + dy * k, xPercent: -50, yPercent: -50 });
          });
        });
      };
  MW.textWaveColumns = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
</script>
