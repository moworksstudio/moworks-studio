<!--
  Moving Highlight Pill (Moworks Studio, the studio's own, written here).
  Source: Moworks Studio.
  Một viên nền màu nhấn bo tròn trượt nhanh từ từ này sang từ kia theo giọng đọc, đổi rộng theo từ, chữ nằm trong viên đổi sang màu tối.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.textCaptionGlidePill(q(".gpw"), tl, 0, {});

  Options (defaults in brackets):
      - from: s (0.4)
      - to: s (3.4): word times even (a stand-in for transcript times)
      - pad: em each side (0.22)
      - accent: pill colour
      - ink: text colour inside the pill
      - outAt: s (3.85)
      - caption: the caption

  Notes: Caption 34 px weight 800, ≤ 2 lines; word times even across 0.4–3.4 s (stand-in for transcript). One pill (height 1.18 em, full radius, accent) sits behind the spoken word with 0.22 em pad each side; on each new word its x, y and width interpolate from the previous word's box in 100 ms power2.out (80–120 ms). It grows from its centre 0.3–0.42 s power2.out and shrinks 3.85–4.0 s power2.in; text inside the pill is drawn in the dark background colour (clip). Loop 4.4 s. Params: thời gian trượt (100 ms) · lề (0.22 em) · cao (1.18 em).
-->

<div class="ft"></div><div class="gpw"><div class="gp">Đọc tới đâu sáng tới đó</div></div>

<style>

</style>

<script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.split = MW.split || function (el, mode) {
    el = MW.el(el);
    if (el.__mwSplit) return el.__mwSplit;
    var seg = typeof Intl !== "undefined" && Intl.Segmenter ? new Intl.Segmenter("vi", { granularity: "grapheme" }) : null;
    var graphemes = function (s) { if (seg) { var out = []; var it = seg.segment(s)[Symbol.iterator](), r; while (!(r = it.next()).done) out.push(r.value.segment); return out; } return Array.from(s); };
    var res = { chars: [], words: [], lines: [] };
    var walk = function (node) {
      var kids = Array.prototype.slice.call(node.childNodes);
      for (var k = 0; k < kids.length; k++) {
        var n = kids[k];
        if (n.nodeType === 1) { if (n.tagName === "BR") continue; walk(n); continue; }
        if (n.nodeType !== 3) continue;
        var text = n.nodeValue.normalize("NFC"), frag = document.createDocumentFragment();
        var parts = text.split(/(\s+)/);
        for (var p = 0; p < parts.length; p++) {
          var part = parts[p];
          if (!part) continue;
          if (/^\s+$/.test(part)) { frag.appendChild(document.createTextNode(part)); continue; }
          var w = document.createElement("span");
          w.className = "mw-w"; w.style.display = "inline-block"; w.style.whiteSpace = "nowrap";
          if (mode === "words") w.textContent = part;
          else { var gs = graphemes(part); for (var g = 0; g < gs.length; g++) { var c = document.createElement("span"); c.className = "mw-ch"; c.style.display = "inline-block"; c.textContent = gs[g]; w.appendChild(c); res.chars.push(c); } }
          res.words.push(w); frag.appendChild(w);
        }
        node.replaceChild(frag, n);
      }
    };
    walk(el);
    var top = null, line = null;
    for (var i = 0; i < res.words.length; i++) { var y = res.words[i].offsetTop; if (top === null || Math.abs(y - top) > 2) { top = y; line = []; res.lines.push(line); } line.push(res.words[i]); }
    el.__mwSplit = res;
    return res;
  };
  MW.drive = MW.drive || function (tl, at, dur, fn) {
    var s = { t: 0 }; fn(0);
    tl.fromTo(s, { t: 0 }, { t: dur, duration: dur, ease: "none", immediateRender: false, onUpdate: function () { fn(s.t); } }, at);
    return at + dur;
  };
  var defaults = {"from":0.4,"to":3.4,"pad":0.22,"accent":"#ffd23d","ink":"#151a28","outAt":3.85,"caption":".gp","loop":4.4};
  var run = function (el, tl, at, o) {
        var cap = el.querySelector(o.caption), ws = MW.split(cap, "words").words, n = ws.length, pill = document.createElement("div"), p2 = gsap.parseEase("power2.out"), pi = gsap.parseEase("power2.in"), col = getComputedStyle(cap).color;
        pill.style.cssText = "position:absolute;border-radius:999px;background:" + o.accent + ";pointer-events:none;"; el.insertBefore(pill, el.firstChild); cap.style.position = "relative";
        var box = function (w) { var r = w.getBoundingClientRect(), b = el.getBoundingClientRect(), fs = parseFloat(getComputedStyle(w).fontSize); return [r.left - b.left - o.pad * fs, r.top - b.top + r.height / 2 - 0.59 * fs, r.width + 2 * o.pad * fs, 1.18 * fs]; };
        var T0 = function (i) { return o.from + (o.to - o.from) * i / n; };
        return MW.drive(tl, at, o.loop, function (t) {
          var k = Math.max(0, Math.min(n - 1, Math.floor((t - o.from) / ((o.to - o.from) / n)))), cur = box(ws[k]), prev = box(ws[Math.max(0, k - 1)]), u = k ? p2(Math.min(1, (t - T0(k)) / 0.1)) : 1;
          var bx = prev.map(function (v, j) { return v + (cur[j] - v) * u; }), g = p2(Math.max(0, Math.min(1, (t - 0.3) / 0.12))) * (1 - pi(Math.max(0, Math.min(1, (t - o.outAt) / 0.15))));
          pill.style.left = (bx[0] + bx[2] * (1 - g) / 2) + "px"; pill.style.top = (bx[1] + bx[3] * (1 - g) / 2) + "px"; pill.style.width = bx[2] * g + "px"; pill.style.height = bx[3] * g + "px";
          ws.forEach(function (w, i) { w.style.color = i === k && g > 0.5 && t < o.outAt + 0.1 ? o.ink : col; });
        });
      };
  MW.textCaptionGlidePill = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
</script>
