    MW.textScribbleCircle(q(".tk-head"), tl, 0.4, { fadeAt: 2.1 });

  Options (defaults in brackets):
      - duration: s (0.8), ease-out
      - turns: (1.1)
      - padX: px (88)
      - padY: px (48)
      - tilt: degrees (−3.4)
      - stroke: px (10)
      - color: pen colour
      - fadeAt: s (null: stay)
      - seed: the wobble

  Notes: Hand-drawn ellipse round the phrase (rx = half width + 22 px, ry = half height + 12 px at 40 px type), tilted −3.4°, 1.1 turns starting upper-left (−149°); radius wobble = seeded noise ±6 % + 5 %·sin(2θ + 1) plus a 9 % outward drift over the stroke, so the end passes outside the start (recipe jitter ±4.5 %). Stroke 2.6 px, round caps, accent; draw-on (dashoffset 1 → 0) 0.8 s easeOutCubic from 0.4 s, 3.2 px pen dot at the tip. Loop exit fade 2.5–2.85 s; loop 3 s. Params: duration (0.8 s) · turns: số vòng (1.1) · jitter: độ méo (±4.5 %) · stroke (2.6 px) · tilt (−3.4°).
