<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Hand-drawn Circle - Demo</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
:root { --bg: #09090b; --fg: #fafafa; --card: #111114; --line: #27272a; }
* { box-sizing: border-box; }
html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); }
#demo { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); color: var(--fg); font-family: Inter, sans-serif; }
.center { position: absolute; inset: 0; display: grid; place-items: center; }
.row { display: flex; align-items: center; justify-content: center; gap: 48px; }
.col { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 32px; }
.h1 { font-size: 132px; font-weight: 800; letter-spacing: -0.035em; line-height: 1.1; text-align: center; }
.h2 { font-size: 84px; font-weight: 700; letter-spacing: -0.025em; line-height: 1.15; text-align: center; }
.p { font-size: 40px; line-height: 1.4; opacity: 0.72; text-align: center; }
.card { position: relative; border-radius: 28px; background: var(--card); border: 2px solid var(--line); overflow: hidden; }
.muted { opacity: 0.6; }

#demo { --ink: #e8ebf3; --acc: #8b7bff; --acc2: #3dd6f5; --warm: #ffb547; --rose: #ff5d8f; --mute: #6c778b; --tk-card: #151a24; --tk-line: #262c3a; background: #0b0d12; color: var(--ink); }
.tk-stage { position: absolute; inset: 0; display: grid; place-items: center; }
.tk-cap { font-size: 30px; font-weight: 500; color: var(--mute); letter-spacing: 0.01em; }
.tk-head { margin: 0; font-family: 'Inter', sans-serif; font-size: 150px; font-weight: 900; letter-spacing: -0.03em; line-height: 1.15; text-align: center; max-width: 1600px; }
.tk-sub { margin-top: 36px; text-align: center; }
    </style>
  </head>
  <body>
    <div id="demo" data-composition-id="mw-demo" data-start="0" data-width="1920" data-height="1080" data-duration="3">
<div class="tk-stage"><div><h1 class="tk-head ">Khuyến mãi</h1></div></div>
      <script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };

    return function () { a = (a + 0x6d2b79f5) >>> 0; var t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  };

  MW.drive = MW.drive || function (tl, at, dur, fn) {
    var s = { t: 0 }; fn(0);
    tl.fromTo(s, { t: 0 }, { t: dur, duration: dur, ease: "none", immediateRender: false, onUpdate: function () { fn(s.t); } }, at);
    return at + dur;
  };
  var defaults = {"duration":0.8,"turns":1.1,"padX":88,"padY":48,"tilt":-3.4,"stroke":10,"color":"#ff5d8f","fadeAt":null,"seed":6};
  var run = function (el, tl, at, o) {
        var host = el.parentNode, NS = "http://www.w3.org/2000/svg", svg = document.createElementNS(NS, "svg"), path = document.createElementNS(NS, "path"), dot = document.createElementNS(NS, "circle"), r = MW.rand(o.seed), out = gsap.parseEase("power2.out");
        if (getComputedStyle(host).position === "static") host.style.position = "relative";
        svg.style.cssText = "position:absolute;left:0;top:0;overflow:visible;pointer-events:none;"; svg.setAttribute("width", host.offsetWidth); svg.setAttribute("height", host.offsetHeight);
        path.setAttribute("fill", "none"); path.setAttribute("stroke", o.color); path.setAttribute("stroke-width", o.stroke); path.setAttribute("stroke-linecap", "round"); dot.setAttribute("r", o.stroke * 1.25); dot.setAttribute("fill", o.color);
        svg.appendChild(path); svg.appendChild(dot); host.appendChild(svg);
        var cx = el.offsetLeft + el.offsetWidth / 2, cy = el.offsetTop + el.offsetHeight / 2, rx = el.offsetWidth / 2 + o.padX, ry = el.offsetHeight / 2 + o.padY, N = 120, pts = [], tilt = o.tilt * Math.PI / 180, wob = []; for (var j = 0; j < 9; j++) wob.push((r() * 2 - 1) * 0.06);
        for (var i = 0; i <= N; i++) { var u = i / N, th = (-149 * Math.PI / 180) + u * o.turns * 2 * Math.PI, k = Math.floor(u * 7), f = u * 7 - k, w = wob[k] + (wob[k + 1] - wob[k]) * f, s = 1 + w + 0.05 * Math.sin(2 * th + 1) + 0.09 * u, x = rx * s * Math.cos(th), y = ry * s * Math.sin(th); pts.push([cx + x * Math.cos(tilt) - y * Math.sin(tilt), cy + x * Math.sin(tilt) + y * Math.cos(tilt)]); }
        path.setAttribute("d", "M" + pts.map(function (p) { return p[0].toFixed(1) + " " + p[1].toFixed(1); }).join(" L")); path.setAttribute("pathLength", "1"); path.style.strokeDasharray = "1 1";
        return MW.drive(tl, at, o.fadeAt == null ? o.duration : o.fadeAt + 0.35, function (t) {
          var p = out(Math.max(0, Math.min(1, t / o.duration))), q = pts[Math.round(p * N)]; path.style.strokeDashoffset = String(1 - p); dot.setAttribute("cx", q[0]); dot.setAttribute("cy", q[1]); dot.setAttribute("opacity", p > 0 && p < 1 ? "1" : "0");
          svg.style.opacity = String(o.fadeAt == null ? 1 : 1 - Math.max(0, Math.min(1, (t - o.fadeAt) / 0.35)));
        });
      };
  MW.textScribbleCircle = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
      </script>
      <script>
        (function () {
          var tl = gsap.timeline({ paused: true });
          var q = function (s) { return document.querySelector(s); }, qa = function (s) { return Array.prototype.slice.call(document.querySelectorAll(s)); };
          MW.textScribbleCircle(q(".tk-head"), tl, 0.4, { fadeAt: 2.1 });
          tl.set({}, {}, 3);
          // register only when every motion is ready (MW.pending: e.g. a WebGL texture still decoding), as HyperFrames asks of async builds
          var go = function () { window.__timelines = window.__timelines || {}; window.__timelines["mw-demo"] = tl; };
          if (window.MW && MW.pending && MW.pending.length) Promise.all(MW.pending).then(go, go); else go();
        })();
      </script>
    </div>
  </body>
</html>
