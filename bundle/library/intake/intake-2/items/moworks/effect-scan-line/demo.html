<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Scan Line - Demo</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
:root { --bg: #09090b; --fg: #fafafa; --card: #111114; --line: #27272a; }
* { box-sizing: border-box; }
html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); }
#demo { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); color: var(--fg); font-family: Inter, sans-serif; }
.center { position: absolute; inset: 0; display: grid; place-items: center; }
.row { display: flex; align-items: center; justify-content: center; gap: 48px; }
.col { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 32px; }
.h1 { font-size: 132px; font-weight: 800; letter-spacing: -0.035em; line-height: 1.1; text-align: center; }
.h2 { font-size: 84px; font-weight: 700; letter-spacing: -0.025em; line-height: 1.15; text-align: center; }
.p { font-size: 40px; line-height: 1.4; opacity: 0.72; text-align: center; }
.card { position: relative; border-radius: 28px; background: var(--card); border: 2px solid var(--line); overflow: hidden; }
.muted { opacity: 0.6; }

#demo { background: radial-gradient(100% 100% at 50% 40%, #1a1f33, #0b0d12); color: #e8ebf3; font-family: Inter, sans-serif; } .gm { position: absolute; inset: 0; }
.ui-cursor { position: absolute; left: 0; top: 0; z-index: 30; filter: drop-shadow(0 6px 10px rgba(0, 0, 0, 0.5)); }
.sl { position: absolute; inset: 0; display: grid; place-items: center; } .sl-c { position: relative; width: 1000px; height: 620px; border-radius: 40px; background: #151a28; border: 3px solid #2a3350; padding: 70px; box-sizing: border-box; display: flex; gap: 60px; }
.sl-c .ph { width: 300px; height: 380px; border-radius: 30px; background: linear-gradient(160deg, #3a4466, #222a42); } .sl-c b { display: block; font-size: 60px; margin-bottom: 30px; } .sl-c i { display: block; height: 30px; border-radius: 15px; background: #2a3350; margin-bottom: 26px; width: 420px; }
.sl-k { position: absolute; width: 70px; height: 70px; border: 0 solid #a99bff; } .sl-k.a { left: 20px; top: 20px; border-left-width: 6px; border-top-width: 6px; } .sl-k.b { right: 20px; top: 20px; border-right-width: 6px; border-top-width: 6px; } .sl-k.c { left: 20px; bottom: 20px; border-left-width: 6px; border-bottom-width: 6px; } .sl-k.d { right: 20px; bottom: 20px; border-right-width: 6px; border-bottom-width: 6px; }
    </style>
  </head>
  <body>
    <div id="demo" data-composition-id="mw-demo" data-start="0" data-width="1920" data-height="1080" data-duration="3.3">
<div class="gm sl"><div class="sl-c"><div class="ph"></div><div><b>THẺ NHÂN VIÊN</b><i></i><i style="width:300px"></i><i style="width:360px"></i></div><div class="sl-k a"></div><div class="sl-k b"></div><div class="sl-k c"></div><div class="sl-k d"></div></div></div>
      <script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.drive = MW.drive || function (tl, at, dur, fn) {
    var s = { t: 0 }; fn(0);
    tl.fromTo(s, { t: 0 }, { t: dur, duration: dur, ease: "none", immediateRender: false, onUpdate: function () { fn(s.t); } }, at);
    return at + dur;
  };
  var defaults = {"pass":1.1,"passes":3,"line":8,"glow":48,"tail":120,"color":"#8b7bff"};
  var run = function (el, tl, at, o) {
        var line = document.createElement("div"), tail = document.createElement("div");
        if (getComputedStyle(el).position === "static") el.style.position = "relative"; el.style.overflow = "hidden";
        tail.style.cssText = "position:absolute;left:-6px;right:-6px;height:" + o.tail + "px;pointer-events:none;background:linear-gradient(180deg, rgba(139,123,255,0), rgba(139,123,255,0.28));";
        line.style.cssText = "position:absolute;left:-6px;right:-6px;height:" + o.line + "px;pointer-events:none;background:" + o.color + ";box-shadow:0 0 " + o.glow + "px " + o.color + ";";
        el.appendChild(tail); el.appendChild(line);
        return MW.drive(tl, at, o.pass * o.passes, function (t) { var u = (t / o.pass) % 1, y = (-0.1 + 1.2 * u) * el.offsetHeight; line.style.top = y + "px"; tail.style.top = (y - o.tail) + "px"; });
      };
  MW.effectScanLine = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
      </script>
      <script>
        (function () {
          var tl = gsap.timeline({ paused: true });
          var q = function (s) { return document.querySelector(s); }, qa = function (s) { return Array.prototype.slice.call(document.querySelectorAll(s)); };
          MW.effectScanLine(q(".sl-c"), tl, 0, {});
          tl.set({}, {}, 3.3);
          // register only when every motion is ready (MW.pending: e.g. a WebGL texture still decoding), as HyperFrames asks of async builds
          var go = function () { window.__timelines = window.__timelines || {}; window.__timelines["mw-demo"] = tl; };
          if (window.MW && MW.pending && MW.pending.length) Promise.all(MW.pending).then(go, go); else go();
        })();
      </script>
    </div>
  </body>
</html>
