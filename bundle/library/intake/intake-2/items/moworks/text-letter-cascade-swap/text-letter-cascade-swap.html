<!--
  Letter Cascade Swap (Moworks Studio, the studio's own, written here).
  Source: Moworks Studio.
  Các ký tự của từ cũ rơi xuống và mờ đi, ký tự của từ mới rơi từ trên vào thế chỗ, nối đuôi nhau như thác.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.textLetterCascadeSwap(q(".lc"), tl, 0, {});

  Options (defaults in brackets):
      - from: first word
      - to: second word
      - drop: px (160)
      - stagger: s (0.05, ≤ 0.5 s)
      - at: s (0.4)
      - backAt: s (2.0)
      - accent: colour while falling in
      - seed: tilts

  Notes: Two stacked split words. Old chars fall y 0 → +40 px and fade, 0.35 s easeInCubic (CSS cubic-bezier(.32,0,.67,0); labelled power3.in), 50 ms apart; demo adds a seeded tilt up to ±8.6°. New chars drop in from y −40 px → 0 with fade-in, 0.45 s easeOutCubic (cubic-bezier(.33,1,.68,1)), 50 ms apart, starting 0.15 s after the old (accent while moving). Stagger capped 0.5 s total. Demo swaps at 0.4 s and 2.0 s; loop 3.6 s. Params: to: từ mới · stagger (0.05 s) · drop (40 px) · out / in (0.35 s / 0.45 s) · delay từ mới (0.15 s).
-->

  var defaults = {"from":"MƯA","to":"NẮNG","drop":160,"stagger":0.05,"at":0.4,"backAt":2,"accent":"#ffd23d","seed":4};
  var run = function (el,tl,at,o
  ) {

  var gr = function (s) { s = String(s).normalize("NFC"); if (!seg) return Array.from(s); var out = [], it = seg.segment(s)[Symbol.iterator](), r; while (!(r = it.next()).done) out.push(r.value.segment); return out; };
