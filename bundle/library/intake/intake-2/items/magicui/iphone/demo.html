<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>iPhone - Demo</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
:root { --bg: #09090b; --fg: #fafafa; --card: #111114; --line: #27272a; }
* { box-sizing: border-box; }
html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); }
#demo { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); color: var(--fg); font-family: Inter, sans-serif; }
.center { position: absolute; inset: 0; display: grid; place-items: center; }
.row { display: flex; align-items: center; justify-content: center; gap: 48px; }
.col { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 32px; }
.h1 { font-size: 132px; font-weight: 800; letter-spacing: -0.035em; line-height: 1.1; text-align: center; }
.h2 { font-size: 84px; font-weight: 700; letter-spacing: -0.025em; line-height: 1.15; text-align: center; }
.p { font-size: 40px; line-height: 1.4; opacity: 0.72; text-align: center; }
.card { position: relative; border-radius: 28px; background: var(--card); border: 2px solid var(--line); overflow: hidden; }
.muted { opacity: 0.6; }
.mw-iphone { position: relative; display: inline-block; line-height: 0; aspect-ratio: 433 / 882; }
.mw-iphone > .mw-iphone-screen { position: absolute; z-index: 0; overflow: hidden; left: calc(21.25 / 433 * 100%); top: calc(19.25 / 882 * 100%); width: calc(389.5 / 433 * 100%); height: calc(843.5 / 882 * 100%);
  border-radius: calc(55.75 / 389.5 * 100%) / calc(55.75 / 843.5 * 100%); }
.mw-iphone > .mw-iphone-screen > img, .mw-iphone > .mw-iphone-screen > video { display: block; width: 100%; height: 100%; object-fit: cover; object-position: top; }
.mw-iphone > svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.mw-iphone { width: 440px; }
    </style>
  </head>
  <body>
    <div id="demo" data-composition-id="mw-demo" data-start="0" data-width="1920" data-height="1080" data-duration="4">
<div class="center"><div class="row" style="gap:120px"><div class="mw-iphone i1"></div><div class="mw-iphone i2"></div></div></div>
      <script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  var defaults = {"src":null,"dark":false,"enter":null,"enterDuration":0.9};
  var run = function (el, tl, at, o) {
      var body = o.dark ? "#404040" : "#E5E5E5", bezel = o.dark ? "#262626" : "#FFFFFF", pill = o.dark ? "#262626" : "#F5F5F5", id = "mw-ip-" + (MW.__ip = (MW.__ip || 0) + 1);
      var screen = el.querySelector(".mw-iphone-screen");
      if (!screen) { screen = document.createElement("div"); screen.className = "mw-iphone-screen"; el.appendChild(screen); }
      if (o.src && !screen.firstChild) { var img = document.createElement("img"); img.src = o.src; img.alt = ""; screen.appendChild(img); }
      var m = ' mask="url(#' + id + ')"';
      el.insertAdjacentHTML("beforeend", '<svg viewBox="0 0 433 882" fill="none" xmlns="http://www.w3.org/2000/svg" style="transform:translateZ(0)"><g' + m + '>' +
        '<path d="M2 73C2 32.6832 34.6832 0 75 0H357C397.317 0 430 32.6832 430 73V809C430 849.317 397.317 882 357 882H75C34.6832 882 2 849.317 2 809V73Z" fill="' + body + '"/>' +
        '<path d="M0 171C0 170.448 0.447715 170 1 170H3V204H1C0.447715 204 0 203.552 0 203V171Z" fill="' + body + '"/><path d="M1 234C1 233.448 1.44772 233 2 233H3.5V300H2C1.44772 300 1 299.552 1 299V234Z" fill="' + body + '"/>' +
        '<path d="M1 319C1 318.448 1.44772 318 2 318H3.5V385H2C1.44772 385 1 384.552 1 384V319Z" fill="' + body + '"/><path d="M430 279H432C432.552 279 433 279.448 433 280V384C433 384.552 432.552 385 432 385H430V279Z" fill="' + body + '"/>' +
        '<path d="M6 74C6 35.3401 37.3401 4 76 4H356C394.66 4 426 35.3401 426 74V808C426 846.66 394.66 878 356 878H76C37.3401 878 6 846.66 6 808V74Z" fill="' + bezel + '"/></g>' +
        '<path opacity="0.5" d="M174 5H258V5.5C258 6.60457 257.105 7.5 256 7.5H176C174.895 7.5 174 6.60457 174 5.5V5Z" fill="' + body + '"/>' +
        '<path d="M21.25 75C21.25 44.2101 46.2101 19.25 77 19.25H355C385.79 19.25 410.75 44.2101 410.75 75V807C410.75 837.79 385.79 862.75 355 862.75H77C46.2101 862.75 21.25 837.79 21.25 807V75Z" fill="' + body + '" stroke="' + body + '" stroke-width="0.5"' + m + '/>' +
        '<path d="M154 48.5C154 38.2827 162.283 30 172.5 30H259.5C269.717 30 278 38.2827 278 48.5C278 58.7173 269.717 67 259.5 67H172.5C162.283 67 154 58.7173 154 48.5Z" fill="' + pill + '"/>' +
        '<path d="M249 48.5C249 42.701 253.701 38 259.5 38C265.299 38 270 42.701 270 48.5C270 54.299 265.299 59 259.5 59C253.701 59 249 54.299 249 48.5Z" fill="' + pill + '"/>' +
        '<path d="M254 48.5C254 45.4624 256.462 43 259.5 43C262.538 43 265 45.4624 265 48.5C265 51.5376 262.538 54 259.5 54C256.462 54 254 51.5376 254 48.5Z" fill="' + body + '"/>' +
        '<defs><mask id="' + id + '" maskUnits="userSpaceOnUse"><rect x="0" y="0" width="433" height="882" fill="white"/><rect x="21.25" y="19.25" width="389.5" height="843.5" rx="55.75" ry="55.75" fill="black"/></mask></defs></svg>');
      if (!o.enter) return at;
      tl.fromTo(el, o.enter === "rise" ? { y: 120, opacity: 0 } : { opacity: 0 }, { y: 0, opacity: 1, duration: o.enterDuration, ease: "power3.out", immediateRender: true }, at);
      return at + o.enterDuration;
    };
  MW.iphone = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
      </script>
      <script>
        (function () {
          var tl = gsap.timeline({ paused: true });
          var q = function (s) { return document.querySelector(s); }, qa = function (s) { return Array.prototype.slice.call(document.querySelectorAll(s)); };
          MW.iphone(q(".i1"), tl, 0.3, { src: "assets/screen.svg", enter: "rise" });
          MW.iphone(q(".i2"), tl, 0.6, { src: "assets/screen.svg", dark: true, enter: "rise" });
          tl.set({}, {}, 4);
          // register only when every motion is ready (MW.pending: e.g. a WebGL texture still decoding), as HyperFrames asks of async builds
          var go = function () { window.__timelines = window.__timelines || {}; window.__timelines["mw-demo"] = tl; };
          if (window.MW && MW.pending && MW.pending.length) Promise.all(MW.pending).then(go, go); else go();
        })();
      </script>
    </div>
  </body>
</html>
