<!--
  Pulsating Button (Magic UI (magicuidesign), MIT, adapted).
  Source: magicuidesign/magicui at efe76fc, apps/www/registry/magicui/pulsating-button.tsx.
  A button with a soft halo that pulses out from its edge (pulse) or a ring that expands and fades (ripple), every 1.5 s: a waiting call to action, a live dot, a map pin.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.pulsatingButton(q(".p1"), tl, 0, { distance: 22, hold: 6 });

  Options (defaults in brackets):
      - pulseColor: colour (the button's at 50 %)
      - duration: s (1.5)
      - distance: px (8)
      - variant: pulse | ripple (pulse)
      - hold: seconds (6)

  Notes: el is the button; its background colour is the pulse colour unless pulseColor is given.
-->

<div class="mw-pulsating-button" style="background:#fafafa;color:#09090b">Tham gia</div>

<style>
.mw-pulsating-button { position: relative; display: flex; align-items: center; justify-content: center; border-radius: 8px; padding: 8px 16px; text-align: center; }
.mw-pulsating-button > .mw-pb-label { position: relative; z-index: 10; }
.mw-pulsating-button > .mw-pb-halo { pointer-events: none; position: absolute; inset: 0; border-radius: inherit; background: inherit; }
</style>

<script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.bezier = MW.bezier || function (x1, y1, x2, y2) {
    var cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx, cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
    var X = function (t) { return ((ax * t + bx) * t + cx) * t; }, Y = function (t) { return ((ay * t + by) * t + cy) * t; }, dX = function (t) { return (3 * ax * t + 2 * bx) * t + cx; };
    return function (p) {
      if (p <= 0) return 0; if (p >= 1) return 1;
      var t = p, i, d;
      for (i = 0; i < 8; i++) { d = X(t) - p; if (Math.abs(d) < 1e-6) return Y(t); var s = dX(t); if (Math.abs(s) < 1e-6) break; t -= d / s; }
      var lo = 0, hi = 1; t = p;
      for (i = 0; i < 40; i++) { d = X(t); if (Math.abs(d - p) < 1e-6) break; if (d < p) lo = t; else hi = t; t = (lo + hi) / 2; }
      return Y(t);
    };
  };
  MW.CSS_EASE = { ease: [0.25, 0.1, 0.25, 1], easeIn: [0.42, 0, 1, 1], easeOut: [0, 0, 0.58, 1], easeInOut: [0.42, 0, 0.58, 1] };
  var defaults = {"pulseColor":null,"duration":1.5,"distance":8,"variant":"pulse","hold":6};
  var run = function (el, tl, at, o) {
      var label = document.createElement("span"); label.className = "mw-pb-label"; while (el.firstChild) label.appendChild(el.firstChild);
      var halo = document.createElement("span"); halo.className = "mw-pb-halo"; el.appendChild(label); el.appendChild(halo);
      var probe = document.createElement("canvas").getContext("2d"); probe.fillStyle = o.pulseColor || getComputedStyle(el).backgroundColor; probe.fillRect(0, 0, 1, 1);
      var px = probe.getImageData(0, 0, 1, 1).data, rgb = px[0] + ", " + px[1] + ", " + px[2];
      var out = MW.bezier.apply(null, MW.CSS_EASE.easeOut), rip = MW.bezier(0.16, 1, 0.3, 1), D = o.duration, s = { t: 0 };
      var set = function () {
        var f = (s.t % D) / D, d, a;
        if (o.variant === "ripple") { d = o.distance * rip(f); a = 1 - rip(f); }
        else { d = f < 0.5 ? o.distance * out(f * 2) : o.distance * (1 - out(f * 2 - 1)); a = o.pulseColor ? px[3] / 255 : 0.5; }
        halo.style.boxShadow = "0 0 0 " + d + "px rgba(" + rgb + ", " + a + ")";
      };
      set();
      tl.fromTo(s, { t: 0 }, { t: o.hold, duration: o.hold, ease: "none", onUpdate: set, immediateRender: false }, at);
      return at + o.hold;
    };
  MW.pulsatingButton = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
</script>
