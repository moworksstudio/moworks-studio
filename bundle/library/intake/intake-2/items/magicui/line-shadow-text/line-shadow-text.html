<!--
  Line Shadow Text (Magic UI (magicuidesign), MIT, adapted).
  Source: magicuidesign/magicui at efe76fc, apps/www/registry/magicui/line-shadow-text.tsx.
  A headline with a hatched drop shadow: an offset copy filled with fine diagonal stripes that crawl slowly (15 s per tile pass).

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.lineShadowText(q(".mw-line-shadow-text"), tl, 0, { shadowColor: "white", offset: 0.06, tile: 0.09, hold: 6 });

  Options (defaults in brackets):
      - shadowColor: stripe colour (black; white on dark)
      - offset: shadow offset in em (0.04)
      - tile: stripe tile in em (0.06)
      - hold: seconds (15)

  Notes: Registry keyframe line-shadow: background-position 0 0 -> 100% -100%, 15 s linear infinite. Demo style as upstream (italic, semibold, tight tracking), with a wider offset and tile so the hatch reads in a small preview.
-->

<span class="mw-line-shadow-text">Sọc</span>

<style>
.mw-line-shadow-text { position: relative; z-index: 0; display: inline-flex; }
.mw-line-shadow-text > .mw-ls-copy { position: absolute; top: var(--mw-ls-off, 0.04em); left: var(--mw-ls-off, 0.04em); z-index: -10; color: transparent; white-space: nowrap;
  background-image: linear-gradient(45deg, transparent 45%, var(--mw-ls-color) 45%, var(--mw-ls-color) 55%, transparent 0); background-size: var(--mw-ls-tile, 0.06em) var(--mw-ls-tile, 0.06em);
  -webkit-background-clip: text; background-clip: text; pointer-events: none; }
</style>

<script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  var defaults = {"shadowColor":"black","offset":0.04,"tile":0.06,"hold":15};
  var run = function (el, tl, at, o) {
      var copy = el.querySelector(".mw-ls-copy");
      if (!copy) { copy = document.createElement("span"); copy.className = "mw-ls-copy"; copy.setAttribute("aria-hidden", "true"); copy.textContent = el.textContent; el.appendChild(copy); }
      el.style.setProperty("--mw-ls-color", o.shadowColor);
      el.style.setProperty("--mw-ls-off", o.offset + "em");
      el.style.setProperty("--mw-ls-tile", o.tile + "em");
      var n = Math.max(1, Math.ceil(o.hold / 15));
      tl.fromTo(copy, { backgroundPosition: "0% 0%" }, { backgroundPosition: "100% -100%", duration: 15, ease: "none", repeat: n - 1 }, at);
      return at + o.hold;
    };
  MW.lineShadowText = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
</script>
