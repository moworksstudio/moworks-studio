<!--
  Shiny Button (Magic UI (magicuidesign), MIT, adapted).
  Source: magicuidesign/magicui at efe76fc, apps/www/registry/magicui/shiny-button.tsx.
  An outlined button that pops in with a bounce while a gleam sweeps across its label again and again.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.shinyButton(q(".mw-shiny-button"), tl, 0.3, { hold: 7.5 });

  Options (defaults in brackets):
      - color: label colour (rgba(255,255,255,0.9))
      - hold: seconds (8)

  Notes: el is the button. Upstream's border gleam does not render (invalid CSS) and is not ported.
-->

<div class="mw-shiny-button">Shiny Button</div>

<style>
.mw-shiny-button { position: relative; display: inline-block; border-radius: 8px; border: 1px solid rgba(255,255,255,0.15); padding: 8px 24px; font-weight: 500; backdrop-filter: blur(24px);
  background: radial-gradient(circle at 50% 0%, rgba(250,250,250,0.1) 0%, transparent 60%); }
.mw-shiny-button > .mw-sh-label { position: relative; display: block; letter-spacing: 0.025em; text-transform: uppercase; font-weight: 300; }
</style>

<script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.spring = MW.spring || function (stiffness, damping, mass, from, to) {
    var k = stiffness || 100, c = damping == null ? 10 : damping, m = mass || 1, w0 = Math.sqrt(k / m), z = c / (2 * Math.sqrt(k * m));
    var x = function (t) {
      if (z < 1) { var wd = w0 * Math.sqrt(1 - z * z); return 1 - Math.exp(-z * w0 * t) * (Math.cos(wd * t) + (z * w0 / wd) * Math.sin(wd * t)); }
      if (z === 1) return 1 - Math.exp(-w0 * t) * (1 + w0 * t);
      var q = Math.sqrt(z * z - 1), r1 = -w0 * (z - q), r2 = -w0 * (z + q), A = r2 / (r2 - r1), B = -r1 / (r2 - r1);
      return 1 - (A * Math.exp(r1 * t) + B * Math.exp(r2 * t));
    };
    var T = 0, dt = 1 / 240; for (var t = 0; t < 30; t += dt) if (Math.abs(1 - x(t)) > 0.001) T = t;
    T = Math.max(dt, T + dt);
    return { duration: T, ease: function (p) { return p >= 1 ? 1 : x(p * T); }, at: x };
  };
  MW.springDB = MW.springDB || function (duration, bounce) {
    var z = 1 - (bounce == null ? 0.25 : bounce), w = Math.log(1000) / (Math.max(0.05, z) * (duration || 0.8));
    return MW.spring(w * w, 2 * z * w, 1);
  };
  var defaults = {"color":"rgba(255,255,255,0.9)","hold":8};
  var run = function (el, tl, at, o) {
      var label = document.createElement("span"); label.className = "mw-sh-label"; label.style.color = o.color;
      while (el.firstChild) label.appendChild(el.firstChild); el.appendChild(label);
      var pop = MW.spring(200, 5, 0.5), gleam = MW.spring(20, 15, 2), cycle = gleam.duration + 1;
      tl.fromTo(el, { scale: 0.8 }, { scale: 1, duration: pop.duration, ease: pop.ease, immediateRender: true }, at);
      var s = { t: 0 }, set = function () {
        var f = s.t % cycle, x = f < gleam.duration ? 100 - 200 * gleam.ease(f / gleam.duration) : -100;
        label.style.webkitMaskImage = label.style.maskImage = "linear-gradient(-75deg, #000 calc(" + x + "% + 20%), transparent calc(" + x + "% + 30%), #000 calc(" + x + "% + 100%))";
      };
      set();
      tl.fromTo(s, { t: 0 }, { t: o.hold, duration: o.hold, ease: "none", onUpdate: set, immediateRender: false }, at);
      return at + o.hold;
    };
  MW.shinyButton = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
</script>
