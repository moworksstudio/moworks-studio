<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Interactive Grid Pattern - Demo</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
:root { --bg: #09090b; --fg: #fafafa; --card: #111114; --line: #27272a; }
* { box-sizing: border-box; }
html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); }
#demo { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); color: var(--fg); font-family: Inter, sans-serif; }
.center { position: absolute; inset: 0; display: grid; place-items: center; }
.row { display: flex; align-items: center; justify-content: center; gap: 48px; }
.col { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 32px; }
.h1 { font-size: 132px; font-weight: 800; letter-spacing: -0.035em; line-height: 1.1; text-align: center; }
.h2 { font-size: 84px; font-weight: 700; letter-spacing: -0.025em; line-height: 1.15; text-align: center; }
.p { font-size: 40px; line-height: 1.4; opacity: 0.72; text-align: center; }
.card { position: relative; border-radius: 28px; background: var(--card); border: 2px solid var(--line); overflow: hidden; }
.muted { opacity: 0.6; }
.mw-interactive-grid-pattern { position: absolute; inset: 0; width: 100%; height: 100%; }
.holder { position: absolute; left: 50%; top: 50%; width: 1920px; height: 1080px; transform: translate(-50%, -50%) skewY(8deg); -webkit-mask-image: radial-gradient(800px circle at center, white, transparent); mask-image: radial-gradient(800px circle at center, white, transparent); }
    </style>
  </head>
  <body>
    <div id="demo" data-composition-id="mw-demo" data-start="0" data-width="1920" data-height="1080" data-duration="7">
<div class="holder"><svg class="mw-interactive-grid-pattern"></svg></div><div class="center"><div class="h1">Lưới tương tác</div></div>
      <script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.bezier = MW.bezier || function (x1, y1, x2, y2) {
    var cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx, cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
    var X = function (t) { return ((ax * t + bx) * t + cx) * t; }, Y = function (t) { return ((ay * t + by) * t + cy) * t; }, dX = function (t) { return (3 * ax * t + 2 * bx) * t + cx; };
    return function (p) {
      if (p <= 0) return 0; if (p >= 1) return 1;
      var t = p, i, d;
      for (i = 0; i < 8; i++) { d = X(t) - p; if (Math.abs(d) < 1e-6) return Y(t); var s = dX(t); if (Math.abs(s) < 1e-6) break; t -= d / s; }
      var lo = 0, hi = 1; t = p;
      for (i = 0; i < 40; i++) { d = X(t); if (Math.abs(d - p) < 1e-6) break; if (d < p) lo = t; else hi = t; t = (lo + hi) / 2; }
      return Y(t);
    };
  };
  MW.CSS_EASE = { ease: [0.25, 0.1, 0.25, 1], easeIn: [0.42, 0, 1, 1], easeOut: [0, 0, 0.58, 1], easeInOut: [0.42, 0, 0.58, 1] };
  var defaults = {"width":40,"height":40,"squares":[24,24],"path":null,"line":"rgba(156,163,175,0.3)","fill":"rgba(209,213,219,0.3)"};
  var run = function (el, tl, at, o) {
      var NS = "http://www.w3.org/2000/svg", H = o.squares[0], V = o.squares[1], w = o.width, h = o.height, cells = [];
      el.setAttribute("width", w * H); el.setAttribute("height", h * V); el.style.border = "1px solid " + o.line;
      for (var i = 0; i < H * V; i++) {
        var r = document.createElementNS(NS, "rect");
        r.setAttribute("x", (i % H) * w); r.setAttribute("y", Math.floor(i / H) * h); r.setAttribute("width", w); r.setAttribute("height", h);
        r.setAttribute("stroke", o.line); r.setAttribute("fill", o.fill); r.setAttribute("fill-opacity", 0); el.appendChild(r); cells.push(r);
      }
      var path = o.path || [[0, -50, h * V * 0.2], [2.5, w * H + 50, h * V * 0.8], [3, w * H + 50, h * V * 0.8], [5.5, -50, h * V * 0.3]];
      var at2 = function (t) {
        if (t <= path[0][0]) return path[0];
        for (var k = 1; k < path.length; k++) if (t <= path[k][0]) { var a = path[k - 1], b = path[k], f = (t - a[0]) / (b[0] - a[0]); return [t, a[1] + (b[1] - a[1]) * f, a[2] + (b[2] - a[2]) * f]; }
        return path[path.length - 1];
      };
      var cellAt = function (t) { var p = at2(t), cx = Math.floor(p[1] / w), cy = Math.floor(p[2] / h); return cx < 0 || cy < 0 || cx >= H || cy >= V ? -1 : cy * H + cx; };
      // enter / leave times per cell on a 60 fps grid
      var end = path[path.length - 1][0], visits = {}, prev = -1;
      for (var f = 0; f <= Math.ceil(end * 60) + 1; f++) {
        var c = cellAt(f / 60);
        if (c !== prev) { if (prev >= 0) visits[prev][visits[prev].length - 1][1] = f / 60; if (c >= 0) (visits[c] = visits[c] || []).push([f / 60, Infinity]); prev = c; }
      }
      var e = MW.bezier.apply(null, MW.CSS_EASE.easeInOut), s = { t: 0 };
      var set = function () {
        for (var key in visits) {
          var v = visits[key], val = 0, t = s.t;
          for (var j = 0; j < v.length; j++) {
            var on = v[j][0], off = v[j][1];
            if (t < on) break;
            var start = val;                                    // value when this visit began (after the previous fade)
            if (t < off) { val = start + (1 - start) * e(Math.min(1, (t - on) / 0.1)); continue; }
            var peak = start + (1 - start) * e(Math.min(1, (off - on) / 0.1));
            val = peak * (1 - e(Math.min(1, (t - off) / 1)));
          }
          cells[key].setAttribute("fill-opacity", val);
        }
      };
      set();
      tl.fromTo(s, { t: 0 }, { t: end + 1, duration: end + 1, ease: "none", onUpdate: set, immediateRender: false }, at);
      return at + end + 1;
    };
  MW.interactiveGridPattern = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
      </script>
      <script>
        (function () {
          var tl = gsap.timeline({ paused: true });
          var q = function (s) { return document.querySelector(s); }, qa = function (s) { return Array.prototype.slice.call(document.querySelectorAll(s)); };
          MW.interactiveGridPattern(q(".mw-interactive-grid-pattern"), tl, 0.2, { width: 80, height: 80, squares: [24, 14], fill: "rgba(196,181,253,0.45)", path: [[0, -60, 300], [2.6, 1980, 820], [3.2, 1980, 820], [5.8, -60, 380]] });
          tl.set({}, {}, 7);
          // register only when every motion is ready (MW.pending: e.g. a WebGL texture still decoding), as HyperFrames asks of async builds
          var go = function () { window.__timelines = window.__timelines || {}; window.__timelines["mw-demo"] = tl; };
          if (window.MW && MW.pending && MW.pending.length) Promise.all(MW.pending).then(go, go); else go();
        })();
      </script>
    </div>
  </body>
</html>
