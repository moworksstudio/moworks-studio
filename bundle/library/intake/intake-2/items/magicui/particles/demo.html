<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Particles - Demo</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
:root { --bg: #09090b; --fg: #fafafa; --card: #111114; --line: #27272a; }
* { box-sizing: border-box; }
html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); }
#demo { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); color: var(--fg); font-family: Inter, sans-serif; }
.center { position: absolute; inset: 0; display: grid; place-items: center; }
.row { display: flex; align-items: center; justify-content: center; gap: 48px; }
.col { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 32px; }
.h1 { font-size: 132px; font-weight: 800; letter-spacing: -0.035em; line-height: 1.1; text-align: center; }
.h2 { font-size: 84px; font-weight: 700; letter-spacing: -0.025em; line-height: 1.15; text-align: center; }
.p { font-size: 40px; line-height: 1.4; opacity: 0.72; text-align: center; }
.card { position: relative; border-radius: 28px; background: var(--card); border: 2px solid var(--line); overflow: hidden; }
.muted { opacity: 0.6; }
.mw-particles { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }

    </style>
  </head>
  <body>
    <div id="demo" data-composition-id="mw-demo" data-start="0" data-width="1920" data-height="1080" data-duration="7">
<canvas class="mw-particles"></canvas><div class="center"><div class="h1">Bụi sao</div></div>
      <script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.rand = MW.rand || function (seed) {
    var a = typeof seed === "string" ? MW.hash(seed) : (seed >>> 0) || 1;
    return function () { a = (a + 0x6d2b79f5) >>> 0; var t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  };
  MW.hash = MW.hash || function (s) { var h = 2166136261; s = String(s); for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; };
  var defaults = {"quantity":100,"staticity":50,"ease":50,"size":0.4,"color":"#ffffff","vx":0,"vy":0,"pointer":null,"hold":10,"seed":1};
  var run = function (el, tl, at, o) {
      var W = el.offsetWidth, H = el.offsetHeight, dpr = window.devicePixelRatio || 1, ctx = el.getContext("2d");
      el.width = W * dpr; el.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      var hex = o.color.replace("#", ""), full = hex.length === 3 ? hex.split("").map(function (c) { return c + c; }).join("") : hex, n = parseInt(full, 16);
      var rgb = [(n >> 16) & 255, (n >> 8) & 255, n & 255];
      var mouseAt = function (t) {
        var p = o.pointer; if (!p || !p.length) return [0, 0];
        if (t <= p[0][0]) return [p[0][1], p[0][2]];
        for (var k = 1; k < p.length; k++) if (t <= p[k][0]) { var a = p[k - 1], b = p[k], f = (t - a[0]) / (b[0] - a[0]); return [a[1] + (b[1] - a[1]) * f, a[2] + (b[2] - a[2]) * f]; }
        return [p[p.length - 1][1], p[p.length - 1][2]];
      };
      var simulate = function (frames) {
        var r = MW.rand(o.seed * 7703);
        var make = function () { return { x: Math.floor(r() * W), y: Math.floor(r() * H), tx: 0, ty: 0, size: Math.floor(r() * 2) + o.size, alpha: 0, target: parseFloat((r() * 0.6 + 0.1).toFixed(1)), dx: (r() - 0.5) * 0.1, dy: (r() - 0.5) * 0.1, mag: 0.1 + r() * 4 }; };
        var C = []; for (var i = 0; i < o.quantity; i++) C.push(make());
        for (var f = 0; f < frames; f++) {
          var m = mouseAt(f / 60);
          for (var i = 0; i < C.length; i++) {
            var c = C[i], edge = Math.min(c.x + c.tx - c.size, W - c.x - c.tx - c.size, c.y + c.ty - c.size, H - c.y - c.ty - c.size), rem = Math.max(0, parseFloat((edge / 20).toFixed(2)));
            if (rem > 1) { c.alpha += 0.02; if (c.alpha > c.target) c.alpha = c.target; } else c.alpha = c.target * rem;
            c.x += c.dx + o.vx; c.y += c.dy + o.vy;
            c.tx += (m[0] / (o.staticity / c.mag) - c.tx) / o.ease; c.ty += (m[1] / (o.staticity / c.mag) - c.ty) / o.ease;
            if (c.x < -c.size || c.x > W + c.size || c.y < -c.size || c.y > H + c.size) C[i] = make();
          }
        }
        return C;
      };
      var s = { t: 0 }, draw = function () {
        var C = simulate(Math.round(s.t * 60));
        ctx.clearRect(0, 0, W, H);
        for (var i = 0; i < C.length; i++) { var c = C[i]; ctx.beginPath(); ctx.arc(c.x + c.tx, c.y + c.ty, c.size, 0, 2 * Math.PI); ctx.fillStyle = "rgba(" + rgb.join(", ") + ", " + c.alpha + ")"; ctx.fill(); }
      };
      draw();
      tl.fromTo(s, { t: 0 }, { t: o.hold, duration: o.hold, ease: "none", onUpdate: draw, immediateRender: false }, at);
      return at + o.hold;
    };
  MW.particles = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
      </script>
      <script>
        (function () {
          var tl = gsap.timeline({ paused: true });
          var q = function (s) { return document.querySelector(s); }, qa = function (s) { return Array.prototype.slice.call(document.querySelectorAll(s)); };
          MW.particles(q(".mw-particles"), tl, 0, { quantity: 300, size: 1.2, vx: 0.25, vy: -0.15, staticity: 30, pointer: [[0, -600, -200], [3.5, 600, 250], [7, -300, 300]], hold: 7 });
          tl.set({}, {}, 7);
          // register only when every motion is ready (MW.pending: e.g. a WebGL texture still decoding), as HyperFrames asks of async builds
          var go = function () { window.__timelines = window.__timelines || {}; window.__timelines["mw-demo"] = tl; };
          if (window.MW && MW.pending && MW.pending.length) Promise.all(MW.pending).then(go, go); else go();
        })();
      </script>
    </div>
  </body>
</html>
