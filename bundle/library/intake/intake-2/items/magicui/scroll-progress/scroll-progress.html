<!--
  Scroll Progress (Magic UI (magicuidesign), MIT, adapted).
  Source: magicuidesign/magicui at efe76fc, apps/www/registry/magicui/scroll-progress.tsx.
  A thin gradient bar along the top edge (purple, pink, peach) filling from left to right as the scene plays, like a reading progress bar.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.scrollProgress(q(".mw-scroll-progress"), tl, 0.3, { height: 10, progress: [[0, 0], [1.5, 0.3], [2.5, 0.35], [4.5, 0.9], [5.4, 1]] });

  Options (defaults in brackets):
      - duration: s (5)
      - progress: [[t, p], ...] (none)
      - height: px (1)

  Notes: Scroll -> film time. progress: [[t, 0..1], ...] for uneven reading (linear between keys); else linear over duration. height 1 px as upstream; thicker reads better on video.
-->

<div class="mw-scroll-progress"></div>

<style>
.mw-scroll-progress { position: absolute; left: 0; right: 0; top: 0; z-index: 50; transform-origin: left; background: linear-gradient(to right, #A97CF8, #F38CB8, #FDCC92); }
</style>

<script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  var defaults = {"duration":5,"progress":null,"height":1};
  var run = function (el, tl, at, o) {
      el.style.height = o.height + "px";
      if (!o.progress) { tl.fromTo(el, { scaleX: 0 }, { scaleX: 1, duration: o.duration, ease: "none", immediateRender: true }, at); return at + o.duration; }
      var K = o.progress, s = { t: 0 }, set = function () {
        var p = K[0][1];
        for (var k = 1; k < K.length; k++) if (s.t <= K[k][0]) { var a = K[k - 1], b = K[k]; p = a[1] + (b[1] - a[1]) * (s.t - a[0]) / (b[0] - a[0]); break; } else p = K[k][1];
        el.style.transform = "scaleX(" + p + ")";
      };
      set();
      var end = K[K.length - 1][0];
      tl.fromTo(s, { t: 0 }, { t: end, duration: end, ease: "none", onUpdate: set, immediateRender: false }, at);
      return at + end;
    };
  MW.scrollProgress = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
</script>
