<!--
  Animated Beam (Magic UI (magicuidesign), MIT, adapted).
  Source: magicuidesign/magicui at efe76fc, apps/www/registry/magicui/animated-beam.tsx.
  A gradient light streak travels along a curve from one element to another over a faint base line, every 5 s, like data flowing between apps.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.animatedBeam(container, tl, 0, { from: ".a", to: ".b", curvature: -75 });

  Options (defaults in brackets):
      - from: element or selector
      - to: element or selector
      - curvature: px (0)
      - reverse: false
      - duration: s (5)
      - delay: s (0)
      - repeatDelay: s (0)
      - pathColor: gray
      - pathWidth: 2
      - pathOpacity: 0.2
      - gradientStartColor: #ffaa40
      - gradientStopColor: #9c40ff
      - startXOffset: 0
      - startYOffset: 0
      - endXOffset: 0
      - endYOffset: 0
      - hold: seconds (10)

  Notes: el is the container (position: relative); from / to are elements inside it. Upstream's demo uses brand logos (trademarks): the demo here uses plain glyphs.
-->

<div style="position:relative"><div class="a"></div><div class="b"></div></div>

<style>
.mw-animated-beam { position: absolute; left: 0; top: 0; pointer-events: none; overflow: visible; }
</style>

<script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.bezier = MW.bezier || function (x1, y1, x2, y2) {
    var cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx, cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
    var X = function (t) { return ((ax * t + bx) * t + cx) * t; }, Y = function (t) { return ((ay * t + by) * t + cy) * t; }, dX = function (t) { return (3 * ax * t + 2 * bx) * t + cx; };
    return function (p) {
      if (p <= 0) return 0; if (p >= 1) return 1;
      var t = p, i, d;
      for (i = 0; i < 8; i++) { d = X(t) - p; if (Math.abs(d) < 1e-6) return Y(t); var s = dX(t); if (Math.abs(s) < 1e-6) break; t -= d / s; }
      var lo = 0, hi = 1; t = p;
      for (i = 0; i < 40; i++) { d = X(t); if (Math.abs(d - p) < 1e-6) break; if (d < p) lo = t; else hi = t; t = (lo + hi) / 2; }
      return Y(t);
    };
  };
  MW.CSS_EASE = { ease: [0.25, 0.1, 0.25, 1], easeIn: [0.42, 0, 1, 1], easeOut: [0, 0, 0.58, 1], easeInOut: [0.42, 0, 0.58, 1] };
  var defaults = {"from":null,"to":null,"curvature":0,"reverse":false,"duration":5,"delay":0,"repeatDelay":0,"pathColor":"gray","pathWidth":2,"pathOpacity":0.2,"gradientStartColor":"#ffaa40","gradientStopColor":"#9c40ff","startXOffset":0,"startYOffset":0,"endXOffset":0,"endYOffset":0,"hold":10};
  var run = function (el, tl, at, o) {
      var NS = "http://www.w3.org/2000/svg", A = MW.el(o.from), B = MW.el(o.to);
      var c = el.getBoundingClientRect(), ra = A.getBoundingClientRect(), rb = B.getBoundingClientRect();
      var sx = ra.left - c.left + ra.width / 2 + o.startXOffset, sy = ra.top - c.top + ra.height / 2 + o.startYOffset;
      var ex = rb.left - c.left + rb.width / 2 + o.endXOffset, ey = rb.top - c.top + rb.height / 2 + o.endYOffset;
      var d = "M " + sx + "," + sy + " Q " + (sx + ex) / 2 + "," + (sy - o.curvature) + " " + ex + "," + ey;
      var id = "mw-beam-" + (MW.__beams = (MW.__beams || 0) + 1);
      var svg = document.createElementNS(NS, "svg");
      svg.setAttribute("class", "mw-animated-beam"); svg.setAttribute("fill", "none");
      svg.setAttribute("width", c.width); svg.setAttribute("height", c.height); svg.setAttribute("viewBox", "0 0 " + c.width + " " + c.height);
      svg.innerHTML = '<path d="' + d + '" stroke="' + o.pathColor + '" stroke-width="' + o.pathWidth + '" stroke-opacity="' + o.pathOpacity + '" stroke-linecap="round"/>' +
        '<path d="' + d + '" stroke-width="' + o.pathWidth + '" stroke="url(#' + id + ')" stroke-opacity="1" stroke-linecap="round"/>' +
        '<defs><linearGradient id="' + id + '" gradientUnits="userSpaceOnUse" x1="0%" x2="0%" y1="0%" y2="0%">' +
        '<stop stop-color="' + o.gradientStartColor + '" stop-opacity="0"/><stop stop-color="' + o.gradientStartColor + '"/>' +
        '<stop offset="32.5%" stop-color="' + o.gradientStopColor + '"/><stop offset="100%" stop-color="' + o.gradientStopColor + '" stop-opacity="0"/></linearGradient></defs>';
      el.insertBefore(svg, el.firstChild);
      var g = svg.querySelector("linearGradient"), e = MW.bezier(0.16, 1, 0.3, 1);
      var X1 = o.reverse ? [90, -10] : [10, 110], X2 = o.reverse ? [100, 0] : [0, 100], P = o.duration + o.repeatDelay;
      var s = { t: 0 };
      var set = function () {
        var t = s.t - o.delay;
        if (t < 0) { g.setAttribute("x1", "0%"); g.setAttribute("x2", "0%"); return; }       // motion starts from the initial 0 %
        var f = Math.min(1, (t % P) / o.duration), u = e(f);
        g.setAttribute("x1", (X1[0] + (X1[1] - X1[0]) * u) + "%"); g.setAttribute("x2", (X2[0] + (X2[1] - X2[0]) * u) + "%");
      };
      set();
      tl.fromTo(s, { t: 0 }, { t: o.hold, duration: o.hold, ease: "none", onUpdate: set, immediateRender: false }, at);
      return at + o.hold;
    };
  MW.animatedBeam = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
</script>
