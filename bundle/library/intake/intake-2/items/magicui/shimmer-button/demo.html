<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Shimmer Button - Demo</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
:root { --bg: #09090b; --fg: #fafafa; --card: #111114; --line: #27272a; }
* { box-sizing: border-box; }
html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); }
#demo { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); color: var(--fg); font-family: Inter, sans-serif; }
.center { position: absolute; inset: 0; display: grid; place-items: center; }
.row { display: flex; align-items: center; justify-content: center; gap: 48px; }
.col { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 32px; }
.h1 { font-size: 132px; font-weight: 800; letter-spacing: -0.035em; line-height: 1.1; text-align: center; }
.h2 { font-size: 84px; font-weight: 700; letter-spacing: -0.025em; line-height: 1.15; text-align: center; }
.p { font-size: 40px; line-height: 1.4; opacity: 0.72; text-align: center; }
.card { position: relative; border-radius: 28px; background: var(--card); border: 2px solid var(--line); overflow: hidden; }
.muted { opacity: 0.6; }
.mw-shimmer-button { position: relative; z-index: 0; display: flex; align-items: center; justify-content: center; overflow: hidden; border: 1px solid rgba(255,255,255,0.1); padding: 12px 24px; white-space: nowrap; color: #fff; }
.mw-shimmer-button > .mw-sb-sparks { position: absolute; inset: 0; z-index: -30; overflow: visible; filter: blur(2px); container-type: size; }
.mw-shimmer-button .mw-sb-spark { position: absolute; inset: 0; aspect-ratio: 1; height: 100cqh; }
.mw-shimmer-button .mw-sb-cone { position: absolute; inset: -100%; width: auto; }
.mw-shimmer-button > .mw-sb-hi { position: absolute; inset: 0; border-radius: 16px; box-shadow: inset 0 -8px 10px #ffffff1f; pointer-events: none; }
.mw-shimmer-button > .mw-sb-back { position: absolute; z-index: -20; }
.mw-shimmer-button { font-size: 56px; font-weight: 500; letter-spacing: -0.01em; padding: 30px 70px; }
    </style>
  </head>
  <body>
    <div id="demo" data-composition-id="mw-demo" data-start="0" data-width="1920" data-height="1080" data-duration="6">
<div class="center"><div class="col"><div class="h2">Sẵn sàng bắt đầu?</div><div class="mw-shimmer-button">Dùng thử miễn phí</div></div></div>
      <script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.bezier = MW.bezier || function (x1, y1, x2, y2) {
    var cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx, cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
    var X = function (t) { return ((ax * t + bx) * t + cx) * t; }, Y = function (t) { return ((ay * t + by) * t + cy) * t; }, dX = function (t) { return (3 * ax * t + 2 * bx) * t + cx; };
    return function (p) {
      if (p <= 0) return 0; if (p >= 1) return 1;
      var t = p, i, d;
      for (i = 0; i < 8; i++) { d = X(t) - p; if (Math.abs(d) < 1e-6) return Y(t); var s = dX(t); if (Math.abs(s) < 1e-6) break; t -= d / s; }
      var lo = 0, hi = 1; t = p;
      for (i = 0; i < 40; i++) { d = X(t); if (Math.abs(d - p) < 1e-6) break; if (d < p) lo = t; else hi = t; t = (lo + hi) / 2; }
      return Y(t);
    };
  };
  MW.CSS_EASE = { ease: [0.25, 0.1, 0.25, 1], easeIn: [0.42, 0, 1, 1], easeOut: [0, 0, 0.58, 1], easeInOut: [0.42, 0, 0.58, 1] };
  var defaults = {"shimmerColor":"#ffffff","shimmerSize":"0.05em","shimmerDuration":3,"borderRadius":"100px","background":"rgba(0, 0, 0, 1)","hold":6};
  var run = function (el, tl, at, o) {
      el.style.borderRadius = o.borderRadius; el.style.background = o.background;
      var sparks = document.createElement("div"), spark = document.createElement("div"), cone = document.createElement("div"), hi = document.createElement("div"), back = document.createElement("div");
      sparks.className = "mw-sb-sparks"; spark.className = "mw-sb-spark"; cone.className = "mw-sb-cone"; hi.className = "mw-sb-hi"; back.className = "mw-sb-back";
      cone.style.background = "conic-gradient(from calc(270deg - (90deg * 0.5)), transparent 0, " + o.shimmerColor + " 90deg, transparent 90deg)";
      back.style.inset = o.shimmerSize; back.style.borderRadius = o.borderRadius; back.style.background = o.background;
      spark.appendChild(cone); sparks.appendChild(spark); el.insertBefore(sparks, el.firstChild); el.appendChild(hi); el.appendChild(back);
      var e = MW.bezier.apply(null, MW.CSS_EASE.easeInOut), S = o.shimmerDuration, s = { t: 0 };
      var spin = function (f) { // spin-around keyframes, linear between them
        if (f < 0.15) return 90 * f / 0.15; if (f < 0.35) return 90; if (f < 0.65) return 90 + 180 * (f - 0.35) / 0.3; if (f < 0.85) return 270; return 270 + 90 * (f - 0.85) / 0.15;
      };
      var set = function () {
        var k = Math.floor(s.t / S), f = (s.t - k * S) / S; if (k % 2) f = 1 - f;           // alternate
        var u = e(f);
        spark.style.transform = "translate(calc((100cqw - 100%) * " + u + "), 0)";
        cone.style.transform = "translateZ(0) rotate(" + spin((s.t % (S * 2)) / (S * 2)) + "deg)";
      };
      set();
      tl.fromTo(s, { t: 0 }, { t: o.hold, duration: o.hold, ease: "none", onUpdate: set, immediateRender: false }, at);
      return at + o.hold;
    };
  MW.shimmerButton = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
      </script>
      <script>
        (function () {
          var tl = gsap.timeline({ paused: true });
          var q = function (s) { return document.querySelector(s); }, qa = function (s) { return Array.prototype.slice.call(document.querySelectorAll(s)); };
          MW.shimmerButton(q(".mw-shimmer-button"), tl, 0, { hold: 6 });
          tl.set({}, {}, 6);
          // register only when every motion is ready (MW.pending: e.g. a WebGL texture still decoding), as HyperFrames asks of async builds
          var go = function () { window.__timelines = window.__timelines || {}; window.__timelines["mw-demo"] = tl; };
          if (window.MW && MW.pending && MW.pending.length) Promise.all(MW.pending).then(go, go); else go();
        })();
      </script>
    </div>
  </body>
</html>
