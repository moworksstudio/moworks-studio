<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Flickering Grid - Demo</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
:root { --bg: #09090b; --fg: #fafafa; --card: #111114; --line: #27272a; }
* { box-sizing: border-box; }
html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); }
#demo { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); color: var(--fg); font-family: Inter, sans-serif; }
.center { position: absolute; inset: 0; display: grid; place-items: center; }
.row { display: flex; align-items: center; justify-content: center; gap: 48px; }
.col { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 32px; }
.h1 { font-size: 132px; font-weight: 800; letter-spacing: -0.035em; line-height: 1.1; text-align: center; }
.h2 { font-size: 84px; font-weight: 700; letter-spacing: -0.025em; line-height: 1.15; text-align: center; }
.p { font-size: 40px; line-height: 1.4; opacity: 0.72; text-align: center; }
.card { position: relative; border-radius: 28px; background: var(--card); border: 2px solid var(--line); overflow: hidden; }
.muted { opacity: 0.6; }
.mw-flickering-grid { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.holder { position: absolute; inset: 0; -webkit-mask-image: radial-gradient(760px circle at center, white, transparent); mask-image: radial-gradient(760px circle at center, white, transparent); }
.holder canvas { width: 100%; height: 100%; display: block; }
    </style>
  </head>
  <body>
    <div id="demo" data-composition-id="mw-demo" data-start="0" data-width="1920" data-height="1080" data-duration="6">
<div class="holder"><canvas class="mw-flickering-grid"></canvas></div><div class="center"><div class="h1">Bảng đèn LED</div></div>
      <script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.rand = MW.rand || function (seed) {
    var a = typeof seed === "string" ? MW.hash(seed) : (seed >>> 0) || 1;
    return function () { a = (a + 0x6d2b79f5) >>> 0; var t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  };
  MW.hash = MW.hash || function (s) { var h = 2166136261; s = String(s); for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; };
  var defaults = {"squareSize":4,"gridGap":6,"flickerChance":0.3,"color":"rgb(0, 0, 0)","maxOpacity":0.3,"hold":10,"seed":1};
  var run = function (el, tl, at, o) {
      var W = el.clientWidth, H = el.clientHeight, dpr = window.devicePixelRatio || 1, ctx = el.getContext("2d");
      el.width = W * dpr; el.height = H * dpr;
      var p = document.createElement("canvas").getContext("2d"); p.fillStyle = o.color; p.fillRect(0, 0, 1, 1);
      var px = p.getImageData(0, 0, 1, 1).data, rgba = "rgba(" + px[0] + ", " + px[1] + ", " + px[2] + ",";
      var step = o.squareSize + o.gridGap, cols = Math.ceil(W / step), rows = Math.ceil(H / step), n = cols * rows, r = MW.rand(o.seed * 6007);
      // each square: its start value, then flips at exponential gaps (rate flickerChance), each with a new value
      var times = [], vals = [];
      for (var i = 0; i < n; i++) {
        var ts = [], vs = [r() * o.maxOpacity], t = 0;
        while (true) { t += -Math.log(1 - r()) / o.flickerChance; if (t > o.hold) break; ts.push(t); vs.push(r() * o.maxOpacity); }
        times.push(ts); vals.push(vs);
      }
      var s = { t: 0 };
      var draw = function () {
        ctx.clearRect(0, 0, el.width, el.height);
        for (var c = 0; c < cols; c++) for (var j = 0; j < rows; j++) {
          var k = c * rows + j, ts = times[k], m = 0;
          while (m < ts.length && ts[m] <= s.t) m++;
          ctx.fillStyle = rgba + vals[k][m] + ")";
          ctx.fillRect(c * step * dpr, j * step * dpr, o.squareSize * dpr, o.squareSize * dpr);
        }
      };
      draw();
      tl.fromTo(s, { t: 0 }, { t: o.hold, duration: o.hold, ease: "none", onUpdate: draw, immediateRender: false }, at);
      return at + o.hold;
    };
  MW.flickeringGrid = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
      </script>
      <script>
        (function () {
          var tl = gsap.timeline({ paused: true });
          var q = function (s) { return document.querySelector(s); }, qa = function (s) { return Array.prototype.slice.call(document.querySelectorAll(s)); };
          MW.flickeringGrid(q(".mw-flickering-grid"), tl, 0, { squareSize: 8, gridGap: 8, color: "#60A5FA", maxOpacity: 0.6, flickerChance: 1.2, hold: 6 });
          tl.set({}, {}, 6);
          // register only when every motion is ready (MW.pending: e.g. a WebGL texture still decoding), as HyperFrames asks of async builds
          var go = function () { window.__timelines = window.__timelines || {}; window.__timelines["mw-demo"] = tl; };
          if (window.MW && MW.pending && MW.pending.length) Promise.all(MW.pending).then(go, go); else go();
        })();
      </script>
    </div>
  </body>
</html>
