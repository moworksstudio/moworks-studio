<!--
  Light Rays (Magic UI (magicuidesign), MIT, adapted).
  Source: magicuidesign/magicui at efe76fc, apps/www/registry/magicui/light-rays.tsx.
  Soft blurred light shafts shine down from above, swinging slightly and fading in and out over two ambient glows: an atmosphere layer for titles and reveals.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.lightRays(q(".mw-light-rays"), tl, 0, { count: 9, color: "rgba(160, 210, 255, 0.45)", speed: 6, preroll: 6, hold: 8 });

  Options (defaults in brackets):
      - count: 7
      - color: rgba(160, 210, 255, 0.2)
      - blur: px (36)
      - speed: cycle s (14)
      - length: px (70 % of the frame height)
      - preroll: s (0)
      - hold: seconds (14)
      - seed: 1

  Notes: Rays start dark until their delay, as upstream; `preroll` (s) starts the clock earlier so the first frame is already lit. length 70vh becomes px of the frame (70 % of its height).
-->

<div class="mw-light-rays"></div>

<style>
.mw-light-rays { position: absolute; inset: 0; isolation: isolate; overflow: hidden; pointer-events: none; border-radius: inherit; }
.mw-light-rays > .mw-lr-glow { position: absolute; inset: 0; opacity: 0.6; }
.mw-light-rays > .mw-lr-ray { position: absolute; top: -12%; transform-origin: top; border-radius: 9999px; mix-blend-mode: screen; opacity: 0;
  background: linear-gradient(to bottom, color-mix(in srgb, var(--mw-lr-color) 70%, transparent), transparent); filter: blur(var(--mw-lr-blur)); }
</style>

<script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.rand = MW.rand || function (seed) {
    var a = typeof seed === "string" ? MW.hash(seed) : (seed >>> 0) || 1;
    return function () { a = (a + 0x6d2b79f5) >>> 0; var t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  };
  MW.hash = MW.hash || function (s) { var h = 2166136261; s = String(s); for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; };
  MW.bezier = MW.bezier || function (x1, y1, x2, y2) {
    var cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx, cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
    var X = function (t) { return ((ax * t + bx) * t + cx) * t; }, Y = function (t) { return ((ay * t + by) * t + cy) * t; }, dX = function (t) { return (3 * ax * t + 2 * bx) * t + cx; };
    return function (p) {
      if (p <= 0) return 0; if (p >= 1) return 1;
      var t = p, i, d;
      for (i = 0; i < 8; i++) { d = X(t) - p; if (Math.abs(d) < 1e-6) return Y(t); var s = dX(t); if (Math.abs(s) < 1e-6) break; t -= d / s; }
      var lo = 0, hi = 1; t = p;
      for (i = 0; i < 40; i++) { d = X(t); if (Math.abs(d - p) < 1e-6) break; if (d < p) lo = t; else hi = t; t = (lo + hi) / 2; }
      return Y(t);
    };
  };
  MW.CSS_EASE = { ease: [0.25, 0.1, 0.25, 1], easeIn: [0.42, 0, 1, 1], easeOut: [0, 0, 0.58, 1], easeInOut: [0.42, 0, 0.58, 1] };
  var defaults = {"count":7,"color":"rgba(160, 210, 255, 0.2)","blur":36,"speed":14,"length":null,"preroll":0,"hold":14,"seed":1};
  var run = function (el, tl, at, o) {
      var cycle = Math.max(o.speed, 0.1), r = MW.rand(o.seed * 2203), len = o.length || el.clientHeight * 0.7;
      el.style.setProperty("--mw-lr-color", o.color); el.style.setProperty("--mw-lr-blur", o.blur + "px");
      var g1 = document.createElement("div"), g2 = document.createElement("div"); g1.className = g2.className = "mw-lr-glow";
      g1.style.background = "radial-gradient(circle at 20% 15%, color-mix(in srgb, " + o.color + " 45%, transparent), transparent 70%)";
      g2.style.background = "radial-gradient(circle at 80% 10%, color-mix(in srgb, " + o.color + " 35%, transparent), transparent 75%)";
      el.appendChild(g1); el.appendChild(g2);
      var rays = [], ease = MW.bezier.apply(null, MW.CSS_EASE.easeInOut);
      for (var i = 0; i < o.count; i++) {
        var ray = { left: 8 + r() * 84, rotate: -28 + r() * 56, width: 160 + r() * 160, swing: 0.8 + r() * 1.8, delay: r() * cycle, duration: cycle * (0.75 + r() * 0.5), intensity: 0.6 + r() * 0.5 };
        var d = document.createElement("div"); d.className = "mw-lr-ray";
        d.style.left = ray.left + "%"; d.style.width = ray.width + "px"; d.style.height = len + "px"; d.style.marginLeft = (-ray.width / 2) + "px";
        el.appendChild(d); ray.el = d; rays.push(ray);
      }
      var s = { t: 0 };
      var set = function () {
        for (var i = 0; i < rays.length; i++) {
          var R = rays[i], u = s.t + o.preroll - R.delay, P = R.duration * 1.1, op = 0, rot = R.rotate;
          if (u >= 0) {
            var f = (u % P) / R.duration;
            if (f <= 1) { var half = f < 0.5, e = ease(half ? f * 2 : f * 2 - 1); op = half ? R.intensity * e : R.intensity * (1 - e); rot = half ? R.rotate - R.swing + 2 * R.swing * e : R.rotate + R.swing - 2 * R.swing * e; }
            else { op = 0; rot = R.rotate - R.swing; }
          }
          R.el.style.opacity = op; R.el.style.transform = "rotate(" + rot + "deg)";
        }
      };
      set();
      tl.fromTo(s, { t: 0 }, { t: o.hold, duration: o.hold, ease: "none", onUpdate: set, immediateRender: false }, at);
      return at + o.hold;
    };
  MW.lightRays = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
</script>
