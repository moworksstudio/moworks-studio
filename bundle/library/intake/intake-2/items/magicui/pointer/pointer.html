<!--
  Pointer (Magic UI (magicuidesign), MIT, adapted).
  Source: magicuidesign/magicui at efe76fc, apps/www/registry/magicui/pointer.tsx.
  A custom pointer (an arrow, an emoji, any element) pops in over an area and follows a path, popping out at the end.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.pointer(q(".a"), tl, 0.3, { size: 72, path: [[0, 500, 300], [1.2, 900, 500], [2.4, 700, 760]] });

  Options (defaults in brackets):
      - path: [[t, x, y], ...]
      - enter: s (path start)
      - leave: s (path end)
      - size: px (24)

  Notes: el is a layer over the area (position absolute, inset 0); put your own element inside it with class mw-pt-item, or leave it empty for the arrow. path: [[t, x, y], ...] px of el (linear).
-->

<div class="mw-pointer"></div>

<style>
.mw-pointer { position: absolute; inset: 0; pointer-events: none; z-index: 50; }
.mw-pointer > .mw-pt-item { position: absolute; left: 0; top: 0; }
</style>

</script>
