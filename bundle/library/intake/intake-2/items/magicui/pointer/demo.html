<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Pointer - Demo</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
:root { --bg: #09090b; --fg: #fafafa; --card: #111114; --line: #27272a; }
* { box-sizing: border-box; }
html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); }
#demo { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); color: var(--fg); font-family: Inter, sans-serif; }
.center { position: absolute; inset: 0; display: grid; place-items: center; }
.row { display: flex; align-items: center; justify-content: center; gap: 48px; }
.col { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 32px; }
.h1 { font-size: 132px; font-weight: 800; letter-spacing: -0.035em; line-height: 1.1; text-align: center; }
.h2 { font-size: 84px; font-weight: 700; letter-spacing: -0.025em; line-height: 1.15; text-align: center; }
.p { font-size: 40px; line-height: 1.4; opacity: 0.72; text-align: center; }
.card { position: relative; border-radius: 28px; background: var(--card); border: 2px solid var(--line); overflow: hidden; }
.muted { opacity: 0.6; }
.mw-pointer { position: absolute; inset: 0; pointer-events: none; z-index: 50; }
.mw-pointer > .mw-pt-item { position: absolute; left: 0; top: 0; }
.panel { width: 1300px; height: 700px; border-radius: 36px; background: linear-gradient(135deg, #1e1b4b, #312e81); display: grid; place-items: center; } .panel .h2 { opacity: .9; }
.mw-pt-item.emoji { font-size: 90px; line-height: 1; }
    </style>
  </head>
  <body>
    <div id="demo" data-composition-id="mw-demo" data-start="0" data-width="1920" data-height="1080" data-duration="6">
<div class="center"><div class="panel"><div class="h2">Di chuột vào đây</div></div></div><div class="mw-pointer a"></div><div class="mw-pointer b"><div class="mw-pt-item emoji">👆</div></div>
      <script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.bezier = MW.bezier || function (x1, y1, x2, y2) {
    var cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx, cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
    var X = function (t) { return ((ax * t + bx) * t + cx) * t; }, Y = function (t) { return ((ay * t + by) * t + cy) * t; }, dX = function (t) { return (3 * ax * t + 2 * bx) * t + cx; };
    return function (p) {
      if (p <= 0) return 0; if (p >= 1) return 1;
      var t = p, i, d;
      for (i = 0; i < 8; i++) { d = X(t) - p; if (Math.abs(d) < 1e-6) return Y(t); var s = dX(t); if (Math.abs(s) < 1e-6) break; t -= d / s; }
      var lo = 0, hi = 1; t = p;
      for (i = 0; i < 40; i++) { d = X(t); if (Math.abs(d - p) < 1e-6) break; if (d < p) lo = t; else hi = t; t = (lo + hi) / 2; }
      return Y(t);
    };
  };
  MW.CSS_EASE = { ease: [0.25, 0.1, 0.25, 1], easeIn: [0.42, 0, 1, 1], easeOut: [0, 0, 0.58, 1], easeInOut: [0.42, 0, 0.58, 1] };
  MW.spring = MW.spring || function (stiffness, damping, mass, from, to) {
    var k = stiffness || 100, c = damping == null ? 10 : damping, m = mass || 1, w0 = Math.sqrt(k / m), z = c / (2 * Math.sqrt(k * m));
    var x = function (t) {
      if (z < 1) { var wd = w0 * Math.sqrt(1 - z * z); return 1 - Math.exp(-z * w0 * t) * (Math.cos(wd * t) + (z * w0 / wd) * Math.sin(wd * t)); }
      if (z === 1) return 1 - Math.exp(-w0 * t) * (1 + w0 * t);
      var q = Math.sqrt(z * z - 1), r1 = -w0 * (z - q), r2 = -w0 * (z + q), A = r2 / (r2 - r1), B = -r1 / (r2 - r1);
      return 1 - (A * Math.exp(r1 * t) + B * Math.exp(r2 * t));
    };
    var T = 0, dt = 1 / 240; for (var t = 0; t < 30; t += dt) if (Math.abs(1 - x(t)) > 0.001) T = t;
    T = Math.max(dt, T + dt);
    return { duration: T, ease: function (p) { return p >= 1 ? 1 : x(p * T); }, at: x };
  };
  MW.springDB = MW.springDB || function (duration, bounce) {
    var z = 1 - (bounce == null ? 0.25 : bounce), w = Math.log(1000) / (Math.max(0.05, z) * (duration || 0.8));
    return MW.spring(w * w, 2 * z * w, 1);
  };
  var defaults = {"path":[[0,300,300],[2,1200,600]],"enter":null,"leave":null,"size":24};
  var run = function (el, tl, at, o) {
      var item = el.querySelector(".mw-pt-item");
      if (!item) {
        item = document.createElement("div"); item.className = "mw-pt-item";
        item.innerHTML = '<svg stroke="white" fill="black" stroke-width="1" viewBox="0 0 16 16" height="' + o.size + '" width="' + o.size + '" xmlns="http://www.w3.org/2000/svg" style="transform:rotate(-70deg);display:block">' +
          '<path d="M14.082 2.182a.5.5 0 0 1 .103.557L8.528 15.467a.5.5 0 0 1-.917-.007L5.57 10.694.803 8.652a.5.5 0 0 1-.006-.916l12.728-5.657a.5.5 0 0 1 .556.103z"/></svg>';
        el.appendChild(item);
      }
      var P = o.path, enter = o.enter == null ? P[0][0] : o.enter, leave = o.leave == null ? P[P.length - 1][0] : o.leave;
      var at2 = function (t) {
        if (t <= P[0][0]) return [P[0][1], P[0][2]];
        for (var k = 1; k < P.length; k++) if (t <= P[k][0]) { var a = P[k - 1], b = P[k], f = (t - a[0]) / (b[0] - a[0]); return [a[1] + (b[1] - a[1]) * f, a[2] + (b[2] - a[2]) * f]; }
        return [P[P.length - 1][1], P[P.length - 1][2]];
      };
      var pop = MW.spring(500, 25, 1), fade = MW.bezier(0.25, 0.1, 0.35, 1), W = item.offsetWidth, H = item.offsetHeight, s = { t: 0 };
      var set = function () {
        var q = at2(s.t), k = 0, op = 0;
        if (s.t >= enter && s.t < leave) { var u = s.t - enter; k = u < pop.duration ? pop.ease(u / pop.duration) : 1; op = fade(Math.min(1, u / 0.3)); }
        else if (s.t >= leave) { var v = s.t - leave; k = v < pop.duration ? 1 - pop.ease(v / pop.duration) : 0; op = 1 - fade(Math.min(1, v / 0.3)); }
        item.style.transform = "translate(" + (q[0] - W / 2) + "px, " + (q[1] - H / 2) + "px) scale(" + Math.max(0, k) + ")";
        item.style.opacity = op;
      };
      set();
      var end = leave + Math.max(0.3, pop.duration);
      tl.fromTo(s, { t: 0 }, { t: end, duration: end, ease: "none", onUpdate: set, immediateRender: false }, at);
      return at + end;
    };
  MW.pointer = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
      </script>
      <script>
        (function () {
          var tl = gsap.timeline({ paused: true });
          var q = function (s) { return document.querySelector(s); }, qa = function (s) { return Array.prototype.slice.call(document.querySelectorAll(s)); };
          MW.pointer(q(".a"), tl, 0.3, { size: 72, path: [[0, 500, 300], [1.2, 900, 500], [2.4, 700, 760]] });
          MW.pointer(q(".b"), tl, 3, { path: [[0, 1300, 700], [1.2, 1000, 420], [2.2, 1250, 330]] });
          tl.set({}, {}, 6);
          // register only when every motion is ready (MW.pending: e.g. a WebGL texture still decoding), as HyperFrames asks of async builds
          var go = function () { window.__timelines = window.__timelines || {}; window.__timelines["mw-demo"] = tl; };
          if (window.MW && MW.pending && MW.pending.length) Promise.all(MW.pending).then(go, go); else go();
        })();
      </script>
    </div>
  </body>
</html>
