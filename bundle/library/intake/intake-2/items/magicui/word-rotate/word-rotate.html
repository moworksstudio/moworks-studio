<!--
  Word Rotate (Magic UI (magicuidesign), MIT, adapted).
  Source: magicuidesign/magicui at efe76fc, apps/www/registry/magicui/word-rotate.tsx.
  One word from a list at a time: every 2.5 s the word drops out downward and the next drops in from above (0.25 s each, ease-out).

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.wordRotate(q(".mw-word-rotate"), tl, 0.2, { words: ["thiết kế", "xây dựng", "ra mắt"], duration: 2.5, cycles: 3, distance: 90 });

  Options (defaults in brackets):
      - words: list
      - duration: s per word (2.5)
      - distance: px (50)
      - cycles: words shown (one loop of the list)

  Notes: mode 'wait': exit first (0.25 s), then enter (0.25 s). The holder clips (overflow hidden, 8 px padding as upstream's py-2) with room for Vietnamese marks.
-->

<span class="mw-word-rotate"><span>Thiết kế</span></span>

<style>
.mw-word-rotate { display: inline-block; overflow: hidden; padding: 0.15em 0; vertical-align: bottom; }
.mw-word-rotate > span { display: inline-block; }
</style>

<script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.bezier = MW.bezier || function (x1, y1, x2, y2) {
    var cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx, cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
    var X = function (t) { return ((ax * t + bx) * t + cx) * t; }, Y = function (t) { return ((ay * t + by) * t + cy) * t; }, dX = function (t) { return (3 * ax * t + 2 * bx) * t + cx; };
    return function (p) {
      if (p <= 0) return 0; if (p >= 1) return 1;
      var t = p, i, d;
      for (i = 0; i < 8; i++) { d = X(t) - p; if (Math.abs(d) < 1e-6) return Y(t); var s = dX(t); if (Math.abs(s) < 1e-6) break; t -= d / s; }
      var lo = 0, hi = 1; t = p;
      for (i = 0; i < 40; i++) { d = X(t); if (Math.abs(d - p) < 1e-6) break; if (d < p) lo = t; else hi = t; t = (lo + hi) / 2; }
      return Y(t);
    };
  };
  MW.CSS_EASE = { ease: [0.25, 0.1, 0.25, 1], easeIn: [0.42, 0, 1, 1], easeOut: [0, 0, 0.58, 1], easeInOut: [0.42, 0, 0.58, 1] };
  var defaults = {"words":["Thiết kế","Xây dựng","Ra mắt"],"duration":2.5,"distance":50,"cycles":0};
  var run = function (el, tl, at, o) {
      var w = el.querySelector("span") || el.appendChild(document.createElement("span"));
      var e = MW.bezier.apply(null, MW.CSS_EASE.easeOut), D = o.duration, n = o.cycles || o.words.length, d = o.distance;
      var s = { t: 0 };
      var set = function () {
        var k = Math.max(0, Math.min(n - 1, Math.floor(s.t / D))), local = s.t - k * D;
        var y = 0, op = 1, word = o.words[k % o.words.length];
        if (k > 0 && local < 0.25) { word = o.words[(k - 1) % o.words.length]; var f = e(local / 0.25); y = d * f; op = 1 - f; }       // exit
        else if (k > 0 && local < 0.5) { var g = e((local - 0.25) / 0.25); y = -d * (1 - g); op = g; }                                     // enter
        else if (k === 0 && local < 0.25) { var h = e(local / 0.25); y = -d * (1 - h); op = h; }                                            // first entrance
        if (w.textContent !== word) w.textContent = word;
        w.style.transform = "translateY(" + y + "px)"; w.style.opacity = op;
      };
      set();
      tl.fromTo(s, { t: 0 }, { t: n * D, duration: n * D, ease: "none", onUpdate: set, immediateRender: false }, at);
      return at + n * D;
    };
  MW.wordRotate = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
</script>
