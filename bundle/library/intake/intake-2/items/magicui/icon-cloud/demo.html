<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Icon Cloud - Demo</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
:root { --bg: #09090b; --fg: #fafafa; --card: #111114; --line: #27272a; }
* { box-sizing: border-box; }
html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); }
#demo { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); color: var(--fg); font-family: Inter, sans-serif; }
.center { position: absolute; inset: 0; display: grid; place-items: center; }
.row { display: flex; align-items: center; justify-content: center; gap: 48px; }
.col { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 32px; }
.h1 { font-size: 132px; font-weight: 800; letter-spacing: -0.035em; line-height: 1.1; text-align: center; }
.h2 { font-size: 84px; font-weight: 700; letter-spacing: -0.025em; line-height: 1.15; text-align: center; }
.p { font-size: 40px; line-height: 1.4; opacity: 0.72; text-align: center; }
.card { position: relative; border-radius: 28px; background: var(--card); border: 2px solid var(--line); overflow: hidden; }
.muted { opacity: 0.6; }
.mw-icon-cloud { position: relative; }
.mw-icon-cloud > * { position: absolute; left: 50%; top: 50%; width: 40px; height: 40px; margin: -20px 0 0 -20px; will-change: transform, opacity; }
.mw-icon-cloud > i { border-radius: 12px; display: grid; place-items: center; font-style: normal; font-weight: 800; font-size: 20px; color: #fff; }
    </style>
  </head>
  <body>
    <div id="demo" data-composition-id="mw-demo" data-start="0" data-width="1920" data-height="1080" data-duration="8">
<div class="center"><div class="mw-icon-cloud"><i style="background:#f97316">M</i><i style="background:#0ea5e9">O</i><i style="background:#22c55e">W</i><i style="background:#eab308">R</i><i style="background:#ec4899">K</i><i style="background:#8b5cf6">S</i><i style="background:#14b8a6">T</i><i style="background:#ef4444">U</i><i style="background:#6366f1">D</i><i style="background:#84cc16">I</i><i style="background:#06b6d4">A</i><i style="background:#f43f5e">M</i><i style="background:#a855f7">O</i><i style="background:#10b981">W</i><i style="background:#f59e0b">R</i><i style="background:#3b82f6">K</i><i style="background:#d946ef">S</i><i style="background:#64748b">T</i><i style="background:#fb7185">U</i><i style="background:#22d3ee">D</i><i style="background:#4ade80">I</i><i style="background:#facc15">A</i><i style="background:#c084fc">M</i><i style="background:#2dd4bf">O</i></div></div>
      <script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  var defaults = {"size":400,"pointer":[0,0],"focus":[],"focusDuration":1.2};
  var run = function (el, tl, at, o) {
      var icons = Array.prototype.slice.call(el.children), n = icons.length || 20, k = o.size / 400, P = [], inc = Math.PI * (3 - Math.sqrt(5)), off = 2 / n;
      el.style.width = el.style.height = o.size + "px";
      for (var i = 0; i < n; i++) { var y = i * off - 1 + off / 2, r = Math.sqrt(1 - y * y), ph = i * inc; P.push([Math.cos(ph) * r * 100, y * 100, Math.sin(ph) * r * 100]); }
      var cx = 200, cy = 200, maxD = Math.sqrt(cx * cx + cy * cy), dx = o.pointer[0] - cx, dy = o.pointer[1] - cy, speed = 0.003 + (Math.sqrt(dx * dx + dy * dy) / maxD) * 0.01;
      var rate = [(dy / 400) * speed, (dx / 400) * speed];          // radians a frame
      var cubic = function (t) { return 1 - Math.pow(1 - t, 3); };
      var rotAt = function (t) {
        var rx = 0, ry = 0, last = 0;
        for (var q = 0; q < o.focus.length; q++) {
          var f = o.focus[q], tf = f[0];
          if (t < tf) break;
          rx += rate[0] * (tf - last) * 60; ry += rate[1] * (tf - last) * 60;
          var p = P[f[1] % n], tx = -Math.atan2(p[1], Math.sqrt(p[0] * p[0] + p[2] * p[2])), ty = Math.atan2(p[0], p[2]);
          var u = Math.min(1, (t - tf) / o.focusDuration), e = cubic(u);
          var ex = rx + (tx - rx) * e, ey = ry + (ty - ry) * e;
          if (u < 1) return [ex, ey];
          rx = tx; ry = ty; last = tf + o.focusDuration;
        }
        return [rx + rate[0] * (t - last) * 60, ry + rate[1] * (t - last) * 60];
      };
      var s = { t: 0 }, set = function () {
        var R = rotAt(s.t), cX = Math.cos(R[0]), sX = Math.sin(R[0]), cY = Math.cos(R[1]), sY = Math.sin(R[1]);
        for (var i = 0; i < icons.length; i++) {
          var p = P[i], x = p[0] * cY - p[2] * sY, z = p[0] * sY + p[2] * cY, yy = p[1] * cX + z * sX, sc = (z + 200) / 300, op = Math.max(0.2, Math.min(1, (z + 150) / 200));
          icons[i].style.transform = "translate(" + x * k + "px, " + yy * k + "px) scale(" + sc * k + ")"; icons[i].style.opacity = op; icons[i].style.zIndex = Math.round(z + 200);
        }
      };
      set();
      var end = Math.max(8, o.focus.length ? o.focus[o.focus.length - 1][0] + o.focusDuration + 2 : 8);
      tl.fromTo(s, { t: 0 }, { t: end, duration: end, ease: "none", onUpdate: set, immediateRender: false }, at);
      return at + end;
    };
  MW.iconCloud = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
      </script>
      <script>
        (function () {
          var tl = gsap.timeline({ paused: true });
          var q = function (s) { return document.querySelector(s); }, qa = function (s) { return Array.prototype.slice.call(document.querySelectorAll(s)); };
          MW.iconCloud(q(".mw-icon-cloud"), tl, 0, { size: 900, focus: [[3.5, 7]] });
          tl.set({}, {}, 8);
          // register only when every motion is ready (MW.pending: e.g. a WebGL texture still decoding), as HyperFrames asks of async builds
          var go = function () { window.__timelines = window.__timelines || {}; window.__timelines["mw-demo"] = tl; };
          if (window.MW && MW.pending && MW.pending.length) Promise.all(MW.pending).then(go, go); else go();
        })();
      </script>
    </div>
  </body>
</html>
