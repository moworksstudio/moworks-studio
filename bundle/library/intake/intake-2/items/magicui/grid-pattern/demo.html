<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Grid Pattern - Demo</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
:root { --bg: #09090b; --fg: #fafafa; --card: #111114; --line: #27272a; }
* { box-sizing: border-box; }
html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); }
#demo { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); color: var(--fg); font-family: Inter, sans-serif; }
.center { position: absolute; inset: 0; display: grid; place-items: center; }
.row { display: flex; align-items: center; justify-content: center; gap: 48px; }
.col { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 32px; }
.h1 { font-size: 132px; font-weight: 800; letter-spacing: -0.035em; line-height: 1.1; text-align: center; }
.h2 { font-size: 84px; font-weight: 700; letter-spacing: -0.025em; line-height: 1.15; text-align: center; }
.p { font-size: 40px; line-height: 1.4; opacity: 0.72; text-align: center; }
.card { position: relative; border-radius: 28px; background: var(--card); border: 2px solid var(--line); overflow: hidden; }
.muted { opacity: 0.6; }
.mw-grid-pattern { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
.holder { position: absolute; left: 0; right: 0; top: -30%; height: 160%; transform: skewY(12deg); -webkit-mask-image: radial-gradient(800px circle at center, white, transparent); mask-image: radial-gradient(800px circle at center, white, transparent); }
    </style>
  </head>
  <body>
    <div id="demo" data-composition-id="mw-demo" data-start="0" data-width="1920" data-height="1080" data-duration="6">
<div class="holder"><svg class="mw-grid-pattern" aria-hidden="true"></svg></div><div class="center"><div class="h1">Lưới nền</div></div>
      <script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  var defaults = {"width":40,"height":40,"x":-1,"y":-1,"strokeDasharray":"0","squares":[],"color":"rgba(156,163,175,0.3)","drift":[0,0],"hold":10};
  var run = function (el, tl, at, o) {
      var NS = "http://www.w3.org/2000/svg", id = "mw-grid-" + (MW.__gp = (MW.__gp || 0) + 1), w = o.width, h = o.height;
      el.innerHTML = '<defs><pattern id="' + id + '" width="' + w + '" height="' + h + '" patternUnits="userSpaceOnUse" x="' + o.x + '" y="' + o.y + '">' +
        '<path d="M.5 ' + h + "V.5H" + w + '" fill="none" stroke="' + o.color + '" stroke-dasharray="' + o.strokeDasharray + '"/></pattern></defs>' +
        '<rect width="100%" height="100%" stroke-width="0" fill="url(#' + id + ')"/>';
      var cells = document.createElementNS(NS, "svg"); cells.setAttribute("x", o.x); cells.setAttribute("y", o.y); cells.style.overflow = "visible";
      o.squares.forEach(function (sq) {
        var r = document.createElementNS(NS, "rect");
        r.setAttribute("width", w - 1); r.setAttribute("height", h - 1); r.setAttribute("x", sq[0] * w + 1); r.setAttribute("y", sq[1] * h + 1);
        r.setAttribute("fill", o.color); r.setAttribute("stroke-width", "0"); cells.appendChild(r);
      });
      el.appendChild(cells);
      if (!o.drift[0] && !o.drift[1]) return at;
      var pat = el.querySelector("pattern"), s = { t: 0 };
      var set = function () { var dx = o.drift[0] * s.t, dy = o.drift[1] * s.t; pat.setAttribute("x", o.x + dx); pat.setAttribute("y", o.y + dy); cells.setAttribute("x", o.x + dx); cells.setAttribute("y", o.y + dy); };
      set();
      tl.fromTo(s, { t: 0 }, { t: o.hold, duration: o.hold, ease: "none", onUpdate: set, immediateRender: false }, at);
      return at + o.hold;
    };
  MW.gridPattern = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
      </script>
      <script>
        (function () {
          var tl = gsap.timeline({ paused: true });
          var q = function (s) { return document.querySelector(s); }, qa = function (s) { return Array.prototype.slice.call(document.querySelectorAll(s)); };
          MW.gridPattern(q(".mw-grid-pattern"), tl, 0, { width: 80, height: 80, color: "rgba(156,163,175,0.35)", squares: [[4,4],[5,1],[8,2],[5,3],[5,5],[10,10],[12,15],[15,10],[10,15],[15,10],[10,15],[15,10]], drift: [0, 20], hold: 6 });
          tl.set({}, {}, 6);
          // register only when every motion is ready (MW.pending: e.g. a WebGL texture still decoding), as HyperFrames asks of async builds
          var go = function () { window.__timelines = window.__timelines || {}; window.__timelines["mw-demo"] = tl; };
          if (window.MW && MW.pending && MW.pending.length) Promise.all(MW.pending).then(go, go); else go();
        })();
      </script>
    </div>
  </body>
</html>
