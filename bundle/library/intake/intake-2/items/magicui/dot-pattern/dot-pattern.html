<!--
  Dot Pattern (Magic UI (magicuidesign), MIT, adapted).
  Source: magicuidesign/magicui at efe76fc, apps/www/registry/magicui/dot-pattern.tsx.
  A full-frame grid of small dots, static or softly twinkling (glow), for UI and data backdrops; mask it to fade at the edges.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.dotPattern(q(".mw-dot-pattern"), tl, 0, { width: 32, height: 32, cx: 2, cy: 2, cr: 3, glow: true, color: "rgba(196,181,253,0.9)", hold: 7 });

  Options (defaults in brackets):
      - width: 16
      - height: 16
      - x: 0
      - y: 0
      - cx: 1
      - cy: 1
      - cr: 1
      - glow: false
      - color: rgba(161,161,161,0.8)
      - hold: seconds (10)
      - seed: 1

  Notes: Static unless glow is on. Thousands of dots: for glow keep the spacing large (24 px or more) on a full HD frame.
-->

<svg class="mw-dot-pattern" aria-hidden="true"></svg>

<style>
.mw-dot-pattern { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
</style>

<script>
(function () {
  "use strict";

    return function () { a = (a + 0x6d2b79f5) >>> 0; var t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  };
  MW.hash = MW.hash || function (s) { var h = 2166136261; s = String(s); for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; };
  MW.bezier = MW.bezier || function (x1, y1, x2, y2) {
    var cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx, cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
    var X = function (t) { return ((ax * t + bx) * t + cx) * t; }, Y = function (t) { return ((ay * t + by) * t + cy) * t; }, dX = function (t) { return (3 * ax * t + 2 * bx) * t + cx; };
    return function (p) {
      if (p <= 0) return 0; if (p >= 1) return 1;
      var t = p, i, d;
      for (i = 0; i < 8; i++) { d = X(t) - p; if (Math.abs(d) < 1e-6) return Y(t); var s = dX(t); if (Math.abs(s) < 1e-6) break; t -= d / s; }
      var lo = 0, hi = 1; t = p;
      for (i = 0; i < 40; i++) { d = X(t); if (Math.abs(d - p) < 1e-6) break; if (d < p) lo = t; else hi = t; t = (lo + hi) / 2; }
      return Y(t);
    };
  };
  MW.CSS_EASE = { ease: [0.25, 0.1, 0.25, 1], easeIn: [0.42, 0, 1, 1], easeOut: [0, 0, 0.58, 1], easeInOut: [0.42, 0, 0.58, 1] };
  var defaults = {"width":16,"height":16,"x":0,"y":0,"cx":1,"cy":1,"cr":1,"glow":false,"color":"rgba(161,161,161,0.8)","hold":10,"seed":1};
  var run = function (el, tl, at, o) {
      var NS = "http://www.w3.org/2000/svg", id = "mw-dot-" + (MW.__dp = (MW.__dp || 0) + 1), b = el.getBoundingClientRect();
      var cols = Math.ceil(b.width / o.width), rows = Math.ceil(b.height / o.height), r = MW.rand(o.seed * 1009), dots = [];
      el.style.color = o.color;
      el.innerHTML = '<defs><radialGradient id="' + id + '"><stop offset="0%" stop-color="currentColor" stop-opacity="1"/><stop offset="100%" stop-color="currentColor" stop-opacity="0"/></radialGradient></defs>';
      for (var i = 0; i < cols * rows; i++) {
        var c = document.createElementNS(NS, "circle"), x = (i % cols) * o.width + o.cx + o.x, y = Math.floor(i / cols) * o.height + o.cy + o.y;
        c.setAttribute("cx", x); c.setAttribute("cy", y); c.setAttribute("r", o.cr); c.setAttribute("fill", o.glow ? "url(#" + id + ")" : "currentColor");
        el.appendChild(c); dots.push({ c: c, x: x, y: y, delay: r() * 5, dur: r() * 3 + 2 });
      }
      if (!o.glow) return at;
      var ease = MW.bezier.apply(null, MW.CSS_EASE.easeInOut), s = { t: 0 };
      var set = function () {
        for (var i = 0; i < dots.length; i++) {
          var d = dots[i], u = s.t - d.delay, op = 0.4, sc = 1;
          if (u > 0) {
            var k = Math.floor(u / d.dur), f = (u - k * d.dur) / d.dur;
            if (k % 2 === 1) f = 1 - f;                                  // repeatType reverse
            var half = f < 0.5, e = ease(half ? f * 2 : f * 2 - 1);
            op = half ? 0.4 + 0.6 * e : 1 - 0.6 * e; sc = half ? 1 + 0.5 * e : 1.5 - 0.5 * e;
          }
          d.c.setAttribute("opacity", op); d.c.setAttribute("r", o.cr * sc);

      set();
      tl.fromTo(s, { t: 0 }, { t: o.hold, duration: o.hold, ease: "none", onUpdate: set, immediateRender: false }, at);
      return at + o.hold;
    };
  MW.dotPattern = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
</script>
