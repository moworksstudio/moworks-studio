<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Animated Circular Progress Bar - Demo</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
:root { --bg: #09090b; --fg: #fafafa; --card: #111114; --line: #27272a; }
* { box-sizing: border-box; }
html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); }
#demo { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); color: var(--fg); font-family: Inter, sans-serif; }
.center { position: absolute; inset: 0; display: grid; place-items: center; }
.row { display: flex; align-items: center; justify-content: center; gap: 48px; }
.col { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 32px; }
.h1 { font-size: 132px; font-weight: 800; letter-spacing: -0.035em; line-height: 1.1; text-align: center; }
.h2 { font-size: 84px; font-weight: 700; letter-spacing: -0.025em; line-height: 1.15; text-align: center; }
.p { font-size: 40px; line-height: 1.4; opacity: 0.72; text-align: center; }
.card { position: relative; border-radius: 28px; background: var(--card); border: 2px solid var(--line); overflow: hidden; }
.muted { opacity: 0.6; }
.mw-animated-circular-progress-bar { position: relative; width: 160px; height: 160px; font-size: 24px; font-weight: 600; transform: translateZ(0); }
.mw-animated-circular-progress-bar > svg { width: 100%; height: 100%; }
.mw-animated-circular-progress-bar > span { position: absolute; inset: 0; margin: auto; width: fit-content; height: fit-content; }
.mw-animated-circular-progress-bar { width: 420px; height: 420px; font-size: 96px; }
.cap { font-size: 40px; opacity: .6; margin-top: 30px; text-align: center; }
    </style>
  </head>
  <body>
    <div id="demo" data-composition-id="mw-demo" data-start="0" data-width="1920" data-height="1080" data-duration="6">
<div class="center"><div class="col"><div class="mw-animated-circular-progress-bar"></div><div class="cap">Đã hoàn thành dự án</div></div></div>
      <script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.bezier = MW.bezier || function (x1, y1, x2, y2) {
    var cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx, cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
    var X = function (t) { return ((ax * t + bx) * t + cx) * t; }, Y = function (t) { return ((ay * t + by) * t + cy) * t; }, dX = function (t) { return (3 * ax * t + 2 * bx) * t + cx; };
    return function (p) {
      if (p <= 0) return 0; if (p >= 1) return 1;
      var t = p, i, d;
      for (i = 0; i < 8; i++) { d = X(t) - p; if (Math.abs(d) < 1e-6) return Y(t); var s = dX(t); if (Math.abs(s) < 1e-6) break; t -= d / s; }
      var lo = 0, hi = 1; t = p;
      for (i = 0; i < 40; i++) { d = X(t); if (Math.abs(d - p) < 1e-6) break; if (d < p) lo = t; else hi = t; t = (lo + hi) / 2; }
      return Y(t);
    };
  };
  MW.CSS_EASE = { ease: [0.25, 0.1, 0.25, 1], easeIn: [0.42, 0, 1, 1], easeOut: [0, 0, 0.58, 1], easeInOut: [0.42, 0, 0.58, 1] };
  var defaults = {"min":0,"max":100,"values":[[0,0],[0.5,72]],"gaugePrimaryColor":"#a78bfa","gaugeSecondaryColor":"rgba(255,255,255,0.1)","countNumber":false};
  var run = function (el, tl, at, o) {
      var C = 2 * Math.PI * 45, P = C / 100, gap = 5, NS = "http://www.w3.org/2000/svg";
      var svg = document.createElementNS(NS, "svg"); svg.setAttribute("fill", "none"); svg.setAttribute("viewBox", "0 0 100 100"); svg.setAttribute("stroke-width", "2");
      var mk = function (color) { var c = document.createElementNS(NS, "circle"); c.setAttribute("cx", 50); c.setAttribute("cy", 50); c.setAttribute("r", 45); c.setAttribute("stroke-width", 10);
        c.setAttribute("stroke-linecap", "round"); c.setAttribute("stroke-linejoin", "round"); c.style.stroke = color; c.style.transformOrigin = "50px 50px"; svg.appendChild(c); return c; };
      var sec = mk(o.gaugeSecondaryColor), pri = mk(o.gaugePrimaryColor), num = document.createElement("span");
      el.appendChild(svg); el.appendChild(num);
      var e = MW.bezier.apply(null, MW.CSS_EASE.ease), V = o.values, pct = function (v) { return Math.round(((v - o.min) / (o.max - o.min)) * 100); };
      var valueAt = function (t) {                          // each change slides from where the arc was over 1 s
        var shown = pct(V[0][1]);
        for (var k = 1; k < V.length; k++) { if (t < V[k][0]) break; var from = shown, f = Math.min(1, (t - V[k][0]) / 1); shown = from + (pct(V[k][1]) - from) * e(f); }
        return shown;
      };
      var targetAt = function (t) { var v = V[0][1]; for (var k = 0; k < V.length; k++) if (t >= V[k][0]) v = V[k][1]; return pct(v); };
      var s = { t: 0 }, set = function () {
        var p = valueAt(s.t);
        pri.style.strokeDasharray = p * P + "px " + C;
        pri.style.transform = "rotate(-90deg)";               // offset-factor 0: the primary arc starts at the top
        sec.style.display = p <= 90 && p >= 0 ? "" : "none";
        sec.style.strokeDasharray = (90 - p) * P + "px " + C;
        sec.style.transform = "rotate(calc(1turn - 90deg - " + gap * 3.6 + "deg)) scaleY(-1)";
        num.textContent = o.countNumber ? Math.round(p) : targetAt(s.t);
      };
      set();
      var end = V[V.length - 1][0] + 1;
      tl.fromTo(s, { t: 0 }, { t: end, duration: end, ease: "none", onUpdate: set, immediateRender: false }, at);
      return at + end;
    };
  MW.animatedCircularProgressBar = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
      </script>
      <script>
        (function () {
          var tl = gsap.timeline({ paused: true });
          var q = function (s) { return document.querySelector(s); }, qa = function (s) { return Array.prototype.slice.call(document.querySelectorAll(s)); };
          MW.animatedCircularProgressBar(q(".mw-animated-circular-progress-bar"), tl, 0, { values: [[0, 0], [0.5, 30], [2, 64], [3.5, 92]], gaugePrimaryColor: "#a78bfa" });
          tl.set({}, {}, 6);
          // register only when every motion is ready (MW.pending: e.g. a WebGL texture still decoding), as HyperFrames asks of async builds
          var go = function () { window.__timelines = window.__timelines || {}; window.__timelines["mw-demo"] = tl; };
          if (window.MW && MW.pending && MW.pending.length) Promise.all(MW.pending).then(go, go); else go();
        })();
      </script>
    </div>
  </body>
</html>
