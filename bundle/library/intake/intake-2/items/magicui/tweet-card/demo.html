<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Tweet Card - Demo</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
:root { --bg: #09090b; --fg: #fafafa; --card: #111114; --line: #27272a; }
* { box-sizing: border-box; }
html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); }
#demo { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); color: var(--fg); font-family: Inter, sans-serif; }
.center { position: absolute; inset: 0; display: grid; place-items: center; }
.row { display: flex; align-items: center; justify-content: center; gap: 48px; }
.col { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 32px; }
.h1 { font-size: 132px; font-weight: 800; letter-spacing: -0.035em; line-height: 1.1; text-align: center; }
.h2 { font-size: 84px; font-weight: 700; letter-spacing: -0.025em; line-height: 1.15; text-align: center; }
.p { font-size: 40px; line-height: 1.4; opacity: 0.72; text-align: center; }
.card { position: relative; border-radius: 28px; background: var(--card); border: 2px solid var(--line); overflow: hidden; }
.muted { opacity: 0.6; }
.mw-tweet-card { position: relative; display: flex; flex-direction: column; gap: 16px; width: 100%; max-width: 32rem; overflow: hidden; border-radius: 12px; border: 1px solid rgba(255,255,255,0.12); padding: 16px; background: #0a0a0a; }
.mw-tweet-card .mw-tc-head { display: flex; align-items: flex-start; justify-content: space-between; }
.mw-tweet-card .mw-tc-who { display: flex; align-items: center; gap: 12px; }
.mw-tweet-card .mw-tc-av { width: 40px; height: 40px; flex: none; border-radius: 9999px; overflow: hidden; border: 1px solid rgba(255,255,255,0.1); display: grid; place-items: center; color: #fff; font-weight: 700; }
.mw-tweet-card .mw-tc-av img { width: 100%; height: 100%; object-fit: cover; }
.mw-tweet-card .mw-tc-name { display: flex; align-items: center; font-weight: 500; white-space: nowrap; }
.mw-tweet-card .mw-tc-name svg { margin-left: 4px; width: 16px; height: 16px; }
.mw-tweet-card .mw-tc-handle { font-size: 14px; opacity: .55; }
.mw-tweet-card .mw-tc-text { font-size: 15px; line-height: 1.625; overflow-wrap: break-word; }
.mw-tweet-card .mw-tc-img { height: 16rem; width: 100%; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); object-fit: cover; }
.mw-tweet-card { max-width: none; width: 1000px; padding: 40px; gap: 30px; border-radius: 30px; } .mw-tweet-card .mw-tc-av { width: 96px; height: 96px; font-size: 44px; }
.mw-tweet-card .mw-tc-name { font-size: 38px; } .mw-tweet-card .mw-tc-name svg { width: 36px; height: 36px; } .mw-tweet-card .mw-tc-handle { font-size: 30px; }
.mw-tweet-card .mw-tc-text { font-size: 38px; } .mw-tweet-card .mw-tc-img { height: 340px; border-radius: 24px; }
    </style>
  </head>
  <body>
    <div id="demo" data-composition-id="mw-demo" data-start="0" data-width="1920" data-height="1080" data-duration="4">
<div class="center"><div class="mw-tweet-card"></div></div>
<div hidden aria-hidden="true" data-mw-script-text>Ngọc Lan · Vừa làm xong video ra mắt sản phẩm trong một buổi chiều. Chuyển động mượt, chữ tiếng Việt đẹp, khách duyệt ngay 🎉</div>
      <script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  var defaults = {"name":"Moworks Studio","handle":"@moworks","text":"","avatar":"linear-gradient(135deg,#6366f1,#ec4899)","verified":true,"image":null,"enter":null,"enterDuration":0.8};
  var run = function (el, tl, at, o) {
      var esc = function (s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;"); };
      var av = /\.(png|jpe?g|svg|webp)$/i.test(o.avatar) ? '<img src="' + esc(o.avatar) + '" alt="">' : esc(o.name.trim().charAt(0).toUpperCase());
      el.innerHTML = '<div class="mw-tc-head"><div class="mw-tc-who"><div class="mw-tc-av"' + (/\.(png|jpe?g|svg|webp)$/i.test(o.avatar) ? "" : ' style="background:' + esc(o.avatar) + '"') + '>' + av + '</div>' +
        '<div><div class="mw-tc-name">' + esc(o.name) + (o.verified ? '<svg viewBox="0 0 24 24" fill="#3b82f6"><path d="M12 2l2.4 2.2 3.2-.4.9 3.1 2.9 1.5-1 3.1 1 3.1-2.9 1.5-.9 3.1-3.2-.4L12 22l-2.4-2.2-3.2.4-.9-3.1-2.9-1.5 1-3.1-1-3.1 2.9-1.5.9-3.1 3.2.4z"/><path d="m8 12 3 3 5-6" stroke="#fff" stroke-width="2" fill="none"/></svg>' : "") +
        '</div><div class="mw-tc-handle">' + esc(o.handle) + '</div></div></div></div><div class="mw-tc-text">' + esc(o.text) + "</div>" + (o.image ? '<img class="mw-tc-img" src="' + esc(o.image) + '" alt="">' : "");
      if (!o.enter) return at;
      tl.fromTo(el, { y: 80, opacity: 0 }, { y: 0, opacity: 1, duration: o.enterDuration, ease: "power3.out", immediateRender: true }, at);
      return at + o.enterDuration;
    };
  MW.tweetCard = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
      </script>
      <script>
        (function () {
          var tl = gsap.timeline({ paused: true });
          var q = function (s) { return document.querySelector(s); }, qa = function (s) { return Array.prototype.slice.call(document.querySelectorAll(s)); };
          MW.tweetCard(q(".mw-tweet-card"), tl, 0.3, { name: "Ngọc Lan", handle: "@ngoclan.design", avatar: "linear-gradient(135deg,#f97316,#ec4899)", text: "Vừa làm xong video ra mắt sản phẩm trong một buổi chiều. Chuyển động mượt, chữ tiếng Việt đẹp, khách duyệt ngay 🎉", image: "assets/picture.svg", enter: "rise" });
          tl.set({}, {}, 4);
          // register only when every motion is ready (MW.pending: e.g. a WebGL texture still decoding), as HyperFrames asks of async builds
          var go = function () { window.__timelines = window.__timelines || {}; window.__timelines["mw-demo"] = tl; };
          if (window.MW && MW.pending && MW.pending.length) Promise.all(MW.pending).then(go, go); else go();
        })();
      </script>
    </div>
  </body>
</html>
