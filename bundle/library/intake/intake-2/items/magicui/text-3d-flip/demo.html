<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Text 3D Flip - Demo</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
:root { --bg: #09090b; --fg: #fafafa; --card: #111114; --line: #27272a; }
* { box-sizing: border-box; }
html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); }
#demo { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); color: var(--fg); font-family: Inter, sans-serif; }
.center { position: absolute; inset: 0; display: grid; place-items: center; }
.row { display: flex; align-items: center; justify-content: center; gap: 48px; }
.col { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 32px; }
.h1 { font-size: 132px; font-weight: 800; letter-spacing: -0.035em; line-height: 1.1; text-align: center; }
.h2 { font-size: 84px; font-weight: 700; letter-spacing: -0.025em; line-height: 1.15; text-align: center; }
.p { font-size: 40px; line-height: 1.4; opacity: 0.72; text-align: center; }
.card { position: relative; border-radius: 28px; background: var(--card); border: 2px solid var(--line); overflow: hidden; }
.muted { opacity: 0.6; }
.mw-text-3d-flip { display: flex; flex-wrap: wrap; position: relative; }
.mw-text-3d-flip .mw-flip-word { display: inline-flex; }
.mw-text-3d-flip .mw-flip-char { display: inline-block; transform-style: preserve-3d; }
.mw-text-3d-flip .mw-flip-front { position: relative; display: inline-block; height: 1lh; backface-visibility: hidden; }
.mw-text-3d-flip .mw-flip-back { position: absolute; top: 0; left: 0; height: 1lh; backface-visibility: hidden; }
.mw-text-3d-flip { font-family: 'Playfair Display', serif; font-size: 150px; font-weight: 700; line-height: 1.3; perspective: 1200px; }
.mw-text-3d-flip .mw-flip-back { color: #f472b6; }
.f2 .mw-flip-back { color: #38bdf8; }
    </style>
  </head>
  <body>
    <div id="demo" data-composition-id="mw-demo" data-start="0" data-width="1920" data-height="1080" data-duration="5">
<div class="center"><div class="col"><p class="mw-text-3d-flip f1" style="margin:0">Lật từng chữ</p><p class="mw-text-3d-flip f2" style="margin:0;font-size:110px">từ giữa ra</p></div></div>
      <script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.rand = MW.rand || function (seed) {
    var a = typeof seed === "string" ? MW.hash(seed) : (seed >>> 0) || 1;
    return function () { a = (a + 0x6d2b79f5) >>> 0; var t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  };
  MW.hash = MW.hash || function (s) { var h = 2166136261; s = String(s); for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; };
  MW.spring = MW.spring || function (stiffness, damping, mass, from, to) {
    var k = stiffness || 100, c = damping == null ? 10 : damping, m = mass || 1, w0 = Math.sqrt(k / m), z = c / (2 * Math.sqrt(k * m));
    var x = function (t) {
      if (z < 1) { var wd = w0 * Math.sqrt(1 - z * z); return 1 - Math.exp(-z * w0 * t) * (Math.cos(wd * t) + (z * w0 / wd) * Math.sin(wd * t)); }
      if (z === 1) return 1 - Math.exp(-w0 * t) * (1 + w0 * t);
      var q = Math.sqrt(z * z - 1), r1 = -w0 * (z - q), r2 = -w0 * (z + q), A = r2 / (r2 - r1), B = -r1 / (r2 - r1);
      return 1 - (A * Math.exp(r1 * t) + B * Math.exp(r2 * t));
    };
    var T = 0, dt = 1 / 240; for (var t = 0; t < 30; t += dt) if (Math.abs(1 - x(t)) > 0.001) T = t;
    T = Math.max(dt, T + dt);
    return { duration: T, ease: function (p) { return p >= 1 ? 1 : x(p * T); }, at: x };
  };
  MW.springDB = MW.springDB || function (duration, bounce) {
    var z = 1 - (bounce == null ? 0.25 : bounce), w = Math.log(1000) / (Math.max(0.05, z) * (duration || 0.8));
    return MW.spring(w * w, 2 * z * w, 1);
  };
  var defaults = {"rotateDirection":"right","staggerDuration":0.05,"staggerFrom":"first","stiffness":300,"damping":30,"starts":[0],"snapBack":true,"seed":1};
  var run = function (el, tl, at, o) {
      var ROT = { top: ["rotateX", 90], right: ["rotateY", 90], bottom: ["rotateX", -90], left: ["rotateY", -90] };
      var BACK = { top: "rotateX(-90deg) translateZ(0.5lh)", right: "rotateY(90deg) translateX(50%) rotateY(-90deg) translateX(-50%) rotateY(-90deg) translateX(50%)",
        bottom: "rotateX(90deg) translateZ(0.5lh)", left: "rotateY(90deg) translateX(50%) rotateY(-90deg) translateX(50%) rotateY(-90deg) translateX(50%)" };
      var FRONT = { top: "translateZ(0.5lh)", bottom: "translateZ(0.5lh)", left: "rotateY(90deg) translateX(50%) rotateY(-90deg)", right: "rotateY(-90deg) translateX(50%) rotateY(90deg)" };
      var BOX = { top: "translateZ(-0.5lh)", bottom: "translateZ(-0.5lh)", left: "rotateY(90deg) translateX(50%) rotateY(-90deg)", right: "rotateY(90deg) translateX(50%) rotateY(-90deg)" };
      var dir = o.rotateDirection;
      if (!el.__mwFlip) {
        var text = el.textContent.normalize("NFC"), seg = new Intl.Segmenter("vi", { granularity: "grapheme" }), boxes = [];
        el.textContent = "";
        text.split(" ").forEach(function (word, wi, words) {
          var w = document.createElement("span"); w.className = "mw-flip-word";
          var it = seg.segment(word)[Symbol.iterator](), r;
          while (!(r = it.next()).done) {
            var b = document.createElement("span"); b.className = "mw-flip-char";
            var f = document.createElement("span"); f.className = "mw-flip-front"; f.textContent = r.value.segment; f.style.transform = FRONT[dir];
            var k = document.createElement("span"); k.className = "mw-flip-back"; k.textContent = r.value.segment; k.style.transform = BACK[dir];
            b.appendChild(f); b.appendChild(k); w.appendChild(b); boxes.push(b);
          }
          el.appendChild(w);
          if (wi < words.length - 1) { var sp = document.createElement("span"); sp.style.whiteSpace = "pre"; sp.textContent = " "; el.appendChild(sp); }
        });
        el.__mwFlip = boxes;
      }
      var boxes = el.__mwFlip, n = boxes.length, sp = MW.spring(o.stiffness, o.damping, 1), axis = ROT[dir][0], deg = ROT[dir][1];
      var delayOf = function (i, start) {
        var f = o.staggerFrom, d = o.staggerDuration;
        if (f === "first") return i * d;
        if (f === "last") return (n - 1 - i) * d;
        if (f === "center") return Math.abs(Math.floor(n / 2) - i) * d;
        if (f === "random") return Math.abs(Math.floor(MW.rand(o.seed * 31 + start * 1000)() * n) - i) * d;
        return Math.abs(f - i) * d;
      };
      var s = { t: 0 }, last = 0;
      o.starts.forEach(function (st) { for (var i = 0; i < n; i++) last = Math.max(last, st + delayOf(i, st) + sp.duration); });
      var draw = function () {
        for (var i = 0; i < n; i++) {
          var a = 0;
          for (var k = 0; k < o.starts.length; k++) {
            var t0 = o.starts[k] + delayOf(i, o.starts[k]), u = s.t - t0;
            if (u < 0) continue;
            if (u < sp.duration) a = deg * sp.ease(u / sp.duration);
            else a = o.snapBack ? 0 : deg;
          }
          boxes[i].style.transform = BOX[dir] + " " + axis + "(" + a + "deg)";
        }
      };
      draw();
      tl.fromTo(s, { t: 0 }, { t: last, duration: last, ease: "none", onUpdate: draw, immediateRender: false }, at);
      return at + last;
    };
  MW.text3dFlip = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
      </script>
      <script>
        (function () {
          var tl = gsap.timeline({ paused: true });
          var q = function (s) { return document.querySelector(s); }, qa = function (s) { return Array.prototype.slice.call(document.querySelectorAll(s)); };
          MW.text3dFlip(q(".f1"), tl, 0.5, { starts: [0, 2], snapBack: false });
          MW.text3dFlip(q(".f2"), tl, 1.2, { rotateDirection: "top", staggerFrom: "center", staggerDuration: 0.03, stiffness: 160, damping: 25, starts: [0, 2], snapBack: false });
          tl.set({}, {}, 5);
          // register only when every motion is ready (MW.pending: e.g. a WebGL texture still decoding), as HyperFrames asks of async builds
          var go = function () { window.__timelines = window.__timelines || {}; window.__timelines["mw-demo"] = tl; };
          if (window.MW && MW.pending && MW.pending.length) Promise.all(MW.pending).then(go, go); else go();
        })();
      </script>
    </div>
  </body>
</html>
