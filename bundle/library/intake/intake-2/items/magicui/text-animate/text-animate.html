  Ten ready text entrances (fade, blur, blur up/down, slide four ways, scale up/down) staggered across words, letters or lines.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline

    MW.textAnimate(q(".a1"), tl, 0.3, { animation: "blurInUp", by: "character", duration: 0.9, exit: true, hold: HOLD });

  Options (defaults in brackets):
      - animation: fadeIn
      - by: word
      - duration: s spread over all pieces (0.3)
      - delay: s (0)
      - exit: false
      - hold: s between the entrance and the exit (0.6)

-->
