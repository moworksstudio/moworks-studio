<!--
  Animated List (Magic UI (magicuidesign), MIT, adapted).
  Source: magicuidesign/magicui at efe76fc, apps/www/registry/magicui/animated-list.tsx.
  A live activity feed: every second a new notification pops in at the top and pushes the older ones down (payments, sign-ups, messages).

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.animatedList(q(".mw-animated-list"), tl, 0.3, { delay: 1 });

  Options (defaults in brackets):
      - delay: s between items (1)
      - gap: px (16)

  Notes: el holds the items in the order they arrive (first child first). Upstream's demo row (40 px icon tile, name · time, a line) is the demo here, with Vietnamese text and emoji.
-->

<div class="mw-animated-list"><div>…</div><div>…</div></div>

<style>
.mw-animated-list { position: relative; }
.mw-animated-list > * { position: absolute; left: 0; right: 0; top: 0; margin: 0 auto; transform-origin: 50% 0%; }
</style>

<script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.spring = MW.spring || function (stiffness, damping, mass, from, to) {
    var k = stiffness || 100, c = damping == null ? 10 : damping, m = mass || 1, w0 = Math.sqrt(k / m), z = c / (2 * Math.sqrt(k * m));
    var x = function (t) {
      if (z < 1) { var wd = w0 * Math.sqrt(1 - z * z); return 1 - Math.exp(-z * w0 * t) * (Math.cos(wd * t) + (z * w0 / wd) * Math.sin(wd * t)); }
      if (z === 1) return 1 - Math.exp(-w0 * t) * (1 + w0 * t);
      var q = Math.sqrt(z * z - 1), r1 = -w0 * (z - q), r2 = -w0 * (z + q), A = r2 / (r2 - r1), B = -r1 / (r2 - r1);
      return 1 - (A * Math.exp(r1 * t) + B * Math.exp(r2 * t));
    };
    var T = 0, dt = 1 / 240; for (var t = 0; t < 30; t += dt) if (Math.abs(1 - x(t)) > 0.001) T = t;
    T = Math.max(dt, T + dt);
    return { duration: T, ease: function (p) { return p >= 1 ? 1 : x(p * T); }, at: x };
  };
  MW.springDB = MW.springDB || function (duration, bounce) {
    var z = 1 - (bounce == null ? 0.25 : bounce), w = Math.log(1000) / (Math.max(0.05, z) * (duration || 0.8));
    return MW.spring(w * w, 2 * z * w, 1);
  };
  var defaults = {"delay":1,"gap":16};
  var run = function (el, tl, at, o) {
      var items = Array.prototype.slice.call(el.children), H = items.map(function (n) { return n.offsetHeight; }), sp = MW.spring(350, 40, 1), n = items.length;
      var s = { t: 0 }, set = function () {
        // scale of item i (entered at i x delay) on the spring; its top is the sum of the scaled heights (and gaps) of the newer items above it
        var k = items.map(function (_, i) { var u = s.t - i * o.delay; return u <= 0 ? 0 : u >= sp.duration ? 1 : sp.ease(u / sp.duration); });
        for (var i = 0; i < n; i++) {
          var y = 0;
          for (var j = i + 1; j < n; j++) y += (H[j] + o.gap) * k[j];
          items[i].style.transform = "translateY(" + y + "px) scale(" + k[i] + ")";
          items[i].style.opacity = Math.min(1, k[i]);
        }
      };
      set();
      var end = (n - 1) * o.delay + sp.duration;
      tl.fromTo(s, { t: 0 }, { t: end, duration: end, ease: "none", onUpdate: set, immediateRender: false }, at);
      return at + end;
    };
  MW.animatedList = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
</script>
