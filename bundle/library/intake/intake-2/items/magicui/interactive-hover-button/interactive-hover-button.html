<!--
  Interactive Hover Button (Magic UI (magicuidesign), MIT, adapted).
  Source: magicuidesign/magicui at efe76fc, apps/www/registry/magicui/interactive-hover-button.tsx.
  A pill button: on hover a small dot floods the whole button with colour while the label slides out and a new label with an arrow slides in.

  Paste the markup, CSS and script into a composition. The motion adds its tweens to the composition's paused GSAP timeline
  (window.__timelines[...]), so seeking, rendering and HyperFrames Studio stay exact. GSAP is the film's own (assets/vendor).

    MW.interactiveHoverButton(q(".mw-interactive-hover-button"), tl, 0.6, { hovers: [[0, 1.6], [2.4, null]] });

  Options (defaults in brackets):
      - hovers: [[0, null]]
      - accent: #fafafa
      - accentText: #09090b
      - background: #09090b

  Notes: hovers: [[enter, leave], ...] in s after `at` (leave null = stays). The arrow is lucide's ArrowRight (ISC) drawn inline.
-->

<div class="mw-interactive-hover-button">Bắt đầu</div>

<style>
.mw-interactive-hover-button { position: relative; display: inline-block; overflow: hidden; border-radius: 9999px; border: 1px solid rgba(255,255,255,0.2); padding: 8px 24px; text-align: center; font-weight: 600; }
.mw-interactive-hover-button .mw-ih-row { display: flex; align-items: center; justify-content: center; gap: 8px; }
.mw-interactive-hover-button .mw-ih-dot { height: 8px; width: 8px; border-radius: 9999px; }
.mw-interactive-hover-button .mw-ih-text { display: inline-block; }
.mw-interactive-hover-button .mw-ih-over { position: absolute; top: 0; left: 0; z-index: 10; display: flex; height: 100%; width: 100%; align-items: center; justify-content: center; gap: 8px; opacity: 0; }
.mw-interactive-hover-button .mw-ih-over svg { width: 1em; height: 1em; }
</style>

<script>
(function () {
  "use strict";
  var MW = (window.MW = window.MW || {});
  MW.el = MW.el || function (x) { return typeof x === "string" ? document.querySelector(x) : x; };
  MW.bezier = MW.bezier || function (x1, y1, x2, y2) {
    var cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx, cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
    var X = function (t) { return ((ax * t + bx) * t + cx) * t; }, Y = function (t) { return ((ay * t + by) * t + cy) * t; }, dX = function (t) { return (3 * ax * t + 2 * bx) * t + cx; };
    return function (p) {
      if (p <= 0) return 0; if (p >= 1) return 1;
      var t = p, i, d;
      for (i = 0; i < 8; i++) { d = X(t) - p; if (Math.abs(d) < 1e-6) return Y(t); var s = dX(t); if (Math.abs(s) < 1e-6) break; t -= d / s; }
      var lo = 0, hi = 1; t = p;
      for (i = 0; i < 40; i++) { d = X(t); if (Math.abs(d - p) < 1e-6) break; if (d < p) lo = t; else hi = t; t = (lo + hi) / 2; }
      return Y(t);
    };
  };
  MW.CSS_EASE = { ease: [0.25, 0.1, 0.25, 1], easeIn: [0.42, 0, 1, 1], easeOut: [0, 0, 0.58, 1], easeInOut: [0.42, 0, 0.58, 1] };
  var defaults = {"hovers":[[0,null]],"accent":"#fafafa","accentText":"#09090b","background":"#09090b"};
  var run = function (el, tl, at, o) {
      var text = el.textContent; el.textContent = ""; el.style.background = o.background;
      el.innerHTML = '<div class="mw-ih-row"><div class="mw-ih-dot"></div><span class="mw-ih-text"></span></div><div class="mw-ih-over"><span></span>' +
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg></div>';
      var dot = el.querySelector(".mw-ih-dot"), lab = el.querySelector(".mw-ih-text"), over = el.querySelector(".mw-ih-over");
      lab.textContent = text; over.querySelector("span").textContent = text; dot.style.background = o.accent; over.style.color = o.accentText;
      var e = MW.bezier(0.4, 0, 0.2, 1), D = 0.3, s = { t: 0 }, end = 0;
      o.hovers.forEach(function (h) { end = Math.max(end, (h[1] == null ? h[0] : h[1]) + D); });
      var set = function () {
        var p = 0;
        for (var i = 0; i < o.hovers.length; i++) {
          var on = o.hovers[i][0], off = o.hovers[i][1];
          if (s.t < on) break;
          var from = p;
          if (off == null || s.t < off) { p = from + (1 - from) * e(Math.min(1, (s.t - on) / D)); continue; }
          var top = from + (1 - from) * e(Math.min(1, (off - on) / D)); p = top * (1 - e(Math.min(1, (s.t - off) / D)));
        }
        dot.style.transform = "scale(" + (1 + 99.8 * p) + ")";
        lab.style.transform = "translateX(" + 48 * p + "px)"; lab.style.opacity = 1 - p;
        over.style.transform = "translateX(" + (48 - 68 * p) + "px)"; over.style.opacity = p;
      };
      set();
      tl.fromTo(s, { t: 0 }, { t: end, duration: end, ease: "none", onUpdate: set, immediateRender: false }, at);
      return at + end;
    };
  MW.interactiveHoverButton = function (el, tl, at, options) {
    var o = {}, k;
    for (k in defaults) o[k] = defaults[k];
    for (k in options || {}) o[k] = options[k];
    return run(MW.el(el), tl, at || 0, o);
  };
})();
</script>
