<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Your First Explainer</title>
    <script src="ex/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Figtree";
        src: url("ex/fonts/figtree-latin-600-normal.woff2") format("woff2");
        font-weight: 600;
        font-display: block;
      }
      @font-face {
        font-family: "Figtree";
        src: url("ex/fonts/figtree-latin-700-normal.woff2") format("woff2");
        font-weight: 700;
        font-display: block;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #0a0230;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
      }
      #ex-stage {
        position: absolute;
        inset: 0;
        width: 1080px;
        height: 1920px;
        display: block;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="5" data-fps="60" data-width="1080" data-height="1920">
      <canvas id="ex-stage" width="1080" height="1920"></canvas>
      <audio id="mix" src="audio/mix.wav" data-start="0" data-duration="5" data-track-index="1"></audio>
    </div>
    <script src="ex/ex-core.js"></script>
    <script src="ex/ex-fx.js"></script>
    <script src="story/words.js"></script>
    <script src="ex/house-pal.js"></script>
    <script src="story/film-pal.js"></script>
    <script src="ex/house-hero.js"></script>
    <script src="ex/house-ui.js"></script>
    <script src="story/story.js"></script>
  </body>
</html>
