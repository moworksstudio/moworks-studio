<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>3D Cartoon</title>
    <style>
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #1b2140; }
      #main { position: relative; width: 1920px; height: 1080px; overflow: hidden; }
      #stage { position: absolute; inset: 0; }
    </style>
  </head>
  <body>
    <!-- 3D Cartoon (the owner's source skill): the composition is src/videos/film/Video.tsx; the app bundles it into compositions/film/film.js (never write that file).
         Size, rate and length here match the composition's WIDTH, HEIGHT, FPS and FRAMES / FPS. -->
    <div id="main" data-composition-id="main" data-skill="cartoon-3d" data-start="0" data-duration="10" data-width="1920" data-height="1080" data-fps="30">
      <div id="stage"></div>
    </div>
    <script src="compositions/film/film.js"></script>
  </body>
</html>
