<!doctype html>
<html lang="en" data-resolution="1920x1080">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Moworks 2D Explainer</title>
    <script src="assets/_app/explainer-2d/ex/gsap.min.js"></script>
    <style>

      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #0a0230;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
      }
      #ex-stage {
        position: absolute;
        inset: 0;
        width: 1920px;
        height: 1080px;
        display: block;
      }
    </style>
  </head>
  <body>
    <!-- 2D Explainer (the owner's source skill): the source skill's own page; the app places its engine in assets/_app/explainer-2d/ex/ and the voice's words in
         assets/_app/explainer-2d/words.js (never write them), and declares Figtree (its Vietnamese twin). The film's scripts are story/. -->
    <div id="root" data-composition-id="main" data-skill="explainer-2d" data-start="0" data-duration="10" data-fps="60" data-width="1920" data-height="1080">
      <canvas id="ex-stage" width="1920" height="1080"></canvas>
    </div>
    <script src="assets/_app/explainer-2d/ex/ex-core.js"></script>
    <script src="assets/_app/explainer-2d/ex/ex-fx.js"></script>
    <script src="assets/_app/explainer-2d/words.js"></script>
    <script src="assets/_app/explainer-2d/ex/house-pal.js"></script>
    <script src="story/film-pal.js"></script>
    <script src="assets/_app/explainer-2d/ex/house-hero.js"></script>
    <script src="assets/_app/explainer-2d/ex/house-ui.js"></script>
    <!-- art modules: one line per story/<module>.js, in the order they depend on each other -->
    <script src="story/story.js"></script>
  </body>
</html>
